[workspace]
members = ["crates/crazyagent", "apps/desktop/src-tauri"]
default-members = ["crates/crazyagent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.dev.package.crazyagent]
opt-level = 3

[profile.test.package.crazyagent]
opt-level = 3
