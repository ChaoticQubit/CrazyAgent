[workspace]
members = [
    "crates/crazyagent",
    "crates/crazyagent-linux-supervisor",
    "crates/crazyagent-macos-fs",
    "crates/crazyagent-win-sandbox",
    "crates/sdk/cap",
    "crates/sdk/capgen",
    "crates/sdk/rust",
    "crates/kernel/bus_gateway",
    "crates/kernel/storage",
    "crates/sdk/plugin_check",
    "plugins/t2/agent-quit",
    "apps/desktop/src-tauri",
]
default-members = ["crates/crazyagent"]
exclude = ["crates/sdk/plugin_check/tests/fixtures"]
resolver = "3"

[workspace.package]
version = "2.4.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.dev.package.crazyagent]
opt-level = 3

[profile.test.package.crazyagent]
opt-level = 3

[profile.dev.package.crazyagent-kernel-storage]
opt-level = 3

[profile.test.package.crazyagent-kernel-storage]
opt-level = 3
