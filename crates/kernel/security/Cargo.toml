[package]
name = "crazyagent-kernel-security"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_security"
path = "src/lib.rs"

[dependencies]
crazyagent-kernel-common = { path = "../common" }
form_urlencoded = "=1.2.2"
serde = "=1.0.229"
serde_json = "=1.0.154"
url = "=2.5.8"
zeroize = "=1.9.1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
