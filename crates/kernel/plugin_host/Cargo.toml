[package]
name = "crazyagent-kernel-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_plugin_host"
path = "src/lib.rs"

[dependencies]
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
crazyagent-kernel-common = { path = "../common" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", optional = true }
url = { version = "=2.5.8", optional = true }

[features]
default = ["store"]
store = ["dep:serde_json", "dep:url"]
