[package]
name = "crazyagent-kernel-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_plugin_host"
path = "src/lib.rs"

[dependencies]
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
crazyagent-kernel-common = { path = "../common" }
crazyagent-kernel-security = { path = "../security", optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "hooks", "limits"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", optional = true }
url = { version = "=2.5.8", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
default = ["store"]
store = ["dep:serde_json", "dep:url", "dep:rusqlite", "dep:crazyagent-kernel-security"]
