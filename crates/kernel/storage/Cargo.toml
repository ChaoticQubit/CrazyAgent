[package]
name = "crazyagent-kernel-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_storage"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "hooks", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
crazyagent-win-sandbox = { path = "../../crazyagent-win-sandbox" }

[dev-dependencies]
tempfile = "=3.27.0"
