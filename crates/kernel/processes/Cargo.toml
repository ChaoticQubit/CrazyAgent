[package]
name = "crazyagent-kernel-processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_processes"
path = "src/lib.rs"

[features]
test-support = ["dep:tempfile"]

[dependencies]
base64 = "=0.22.1"
crazyagent-kernel-common = { path = "../common" }
minisign-verify = "=0.3.0"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = { version = "=3.27.0", optional = true }
tokio = { version = "=1.53.2", features = ["net", "rt", "sync", "time"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
getrandom = "=0.4.3"
nix = { version = "=0.28.0", default-features = false, features = ["net", "socket", "user"] }
rustix = { version = "=1.1.5", features = ["event", "fs", "process"] }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
crazyagent-win-sandbox = { path = "../../crazyagent-win-sandbox" }

[dev-dependencies]
minisign = "=0.10.0"
nix = { version = "=0.28.0", default-features = false, features = ["fs"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["rt"] }
