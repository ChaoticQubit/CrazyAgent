[package]
name = "crazyagent-kernel-processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_processes"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
crazyagent-kernel-common = { path = "../common" }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.2", features = ["net", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
getrandom = "=0.4.3"
nix = { version = "=0.28.0", default-features = false, features = ["net", "socket", "user"] }
rustix = { version = "=1.1.5", features = ["event", "fs", "process"] }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
crazyagent-win-sandbox = { path = "../../crazyagent-win-sandbox" }
portable-pty = "=0.9.0"
vt100 = "=0.15.2"

[dev-dependencies]
nix = { version = "=0.28.0", default-features = false, features = ["fs"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["rt"] }
