[package]
name = "crazyagent-kernel-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_sandbox"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
crazyagent-kernel-common = { path = "../common" }
crazyagent-kernel-processes = { path = "../processes" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["net", "rt", "time"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", default-features = false, features = ["user"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"
