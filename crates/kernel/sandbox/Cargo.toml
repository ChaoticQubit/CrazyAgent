[package]
name = "crazyagent-kernel-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_sandbox"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
crazyagent-kernel-processes = { path = "../processes" }
tempfile = "=3.27.0"
