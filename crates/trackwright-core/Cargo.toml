[package]
name = "trackwright-core"
description = "Agent-first ticket tracker core: model, SQLite store, event log, text rules and host traits"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
