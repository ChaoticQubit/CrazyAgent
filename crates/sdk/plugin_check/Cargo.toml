[package]
name = "crazyagent-plugin-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
syn = { version = "=2.0.119", default-features = false, features = ["full", "visit", "parsing"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
