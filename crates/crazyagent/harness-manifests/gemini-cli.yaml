schema: 1
kind: harness
id: "gemini-cli"
name: "Gemini CLI"
binaries:
  - "gemini"
headless: "gemini --prompt with --output-format stream-json"
model_selection: true
account_kinds:
  - "subscription"
  - "api_key"
update:
  known_formulae:
    - "gemini-cli"
  npm:
    scope: "@google"
    name: "gemini-cli"
    package: "@google/gemini-cli"
    spec: "@google/gemini-cli"
  guide: "https://github.com/google-gemini/gemini-cli#readme"
cannot_start: "installed, but CrazyAgent cannot start it yet"
