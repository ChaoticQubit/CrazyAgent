schema: 1
kind: harness
id: "openclaw"
name: "OpenClaw"
binaries:
  - "openclaw"
headless: "openclaw agent --message through its gateway"
model_selection: true
account_kinds:
  - "subscription"
  - "api_key"
  - "local"
update:
  formulae:
    - "openclaw-cli"
  npm:
    name: "openclaw"
    package: "openclaw"
    spec: "openclaw@latest"
    flags:
      - "--allow-scripts=openclaw"
  guide: "https://docs.openclaw.ai/install"
tools_limited: "tools are set in OpenClaw's own configuration"
cannot_start: "installed, but CrazyAgent cannot start it yet"
