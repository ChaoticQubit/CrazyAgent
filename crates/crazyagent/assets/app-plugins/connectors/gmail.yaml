schema: 1
kind: connector
name: gmail
title: Gmail
version: 1.0.0
description: Mail in Gmail through Google's hosted MCP server. Preview at Google. This connector takes only your own app. In Google Cloud enable gmail.googleapis.com and gmailmcp.googleapis.com, then in Google Auth Platform create an OAuth client of type Desktop app, which takes the redirect http://127.0.0.1/callback on any port, and save its client ID and client secret here.
mcp:
  url: https://gmailmcp.googleapis.com/mcp/v1
  hosts: [gmailmcp.googleapis.com]
oauth:
  hosts: [accounts.google.com, oauth2.googleapis.com]
  registration: [own]
  scopes_read: [https://www.googleapis.com/auth/gmail.readonly]
  scopes_write: [https://www.googleapis.com/auth/gmail.compose]
