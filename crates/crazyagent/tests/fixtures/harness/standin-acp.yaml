schema: 1
kind: harness
id: "standin-acp"
name: "Stand-in ACP"
binaries:
  - "standin-acp"
headless: "standin-acp: ACP JSON-RPC over stdio, replayed from fixtures"
model_selection: true
account_kinds:
  - "api_key"
  - "open_ai_compatible_url"
  - "local"
account_protocols:
  - "openai-chat"
accounts:
  openai-chat:
    env:
      OPENAI_BASE_URL: "{relay_url}"
      OPENAI_API_KEY: "{token}"
      STANDIN_MODEL: "{model}"
home:
  owner_folders:
    - ".standin-acp"
mcp:
  render: "json-mcp-servers"
  path: "{home}/config/mcp.json"
instructions:
  render: "file"
  path: "{home}/config/AGENTS.md"
roles:
  - "agent"
  - "master"
  - "research"
sub_agents: "app"
piped:
  driver: "acp"
  argv:
    - "--home"
    - "{home}"
  tools_off:
    - "--no-tools"
