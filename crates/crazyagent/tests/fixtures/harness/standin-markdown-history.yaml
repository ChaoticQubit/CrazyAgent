schema: 1
kind: harness
id: "standin-markdown-history"
name: "Stand-in Markdown history"
binaries:
  - "standin-markdown-history"
headless: "none: standin-markdown-history runs in a terminal pane only"
model_selection: true
account_kinds:
  - "api_key"
  - "open_ai_compatible_url"
  - "local"
roles:
  - "agent"
  - "master"
sub_agents: "app"
terminal:
  argv:
    - "--home"
    - "{home}"
    - "--session"
    - "{session}"
  resume:
    - "--home"
    - "{home}"
    - "--resume"
    - "{session}"
  record:
    reader: "markdown-history"
    path: "{home}/standin/records/{session}.md"
