schema: 1
kind: harness
id: "standin-sqlite-poll"
name: "Stand-in SQLite record"
binaries:
  - "standin-sqlite-poll"
headless: "none: standin-sqlite-poll runs in a terminal pane only"
model_selection: true
account_kinds:
  - "api_key"
  - "open_ai_compatible_url"
  - "local"
roles:
  - "agent"
  - "master"
sub_agents: "app"
terminal:
  argv:
    - "--home"
    - "{home}"
    - "--session"
    - "{session}"
  resume:
    - "--home"
    - "{home}"
    - "--resume"
    - "{session}"
  record:
    reader: "sqlite-poll"
    path: "{home}/standin/records/{session}.db"
