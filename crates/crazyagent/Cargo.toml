[package]
name = "crazyagent"
default-run = "crazyagent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
clean-mac-gate = []
owner-trace = []

[dependencies]
crazyagent-bus-gateway = { path = "../kernel/bus_gateway" }
crazyagent-kernel-security = { path = "../kernel/security" }
crazyagent-kernel-storage = { path = "../kernel/storage" }
crazyagent-kernel-processes = { path = "../kernel/processes" }
crazyagent-kernel-common = { path = "../kernel/common" }
crazyagent-kernel-sandbox = { path = "../kernel/sandbox" }
crazyagent-plugin-agent-quit = { path = "../../plugins/t2/agent-quit" }
crazyagent-sdk = { path = "../sdk/rust" }
crazyagent-win-sandbox = { path = "../crazyagent-win-sandbox" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
url = "=2.5.8"
sha2 = "=0.10.9"
getrandom = "=0.4.3"
subtle = "=2.6.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "hooks", "limits"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display", "serde"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.28.1", default-features = false, features = ["events"] }
notify = "=8.2.0"
trash = "=5.2.2"
vt100 = "=0.15.2"
minisign-verify = "=0.3.0"
base64 = "=0.22.1"
semver = "=1.0.28"
zeroize = "=1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.5", features = ["event", "fs", "process", "thread"] }
nix = { version = "=0.28.0", default-features = false, features = ["fs", "mount", "net", "sched", "signal", "socket", "uio", "user"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
crazyagent-linux-supervisor = { path = "../crazyagent-linux-supervisor" }
landlock = "=0.4.2"
seccompiler = { version = "=0.5.0", default-features = false }
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
portable-pty = "=0.9.0"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
crazyagent-macos-fs = { path = "../crazyagent-macos-fs" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }

[build-dependencies]
crazyagent-plugin-check = { path = "../sdk/plugin_check" }

[dev-dependencies]
crazyagent-kernel-storage = { path = "../kernel/storage", features = ["test-support"] }
crazyagent-kernel-processes = { path = "../kernel/processes", features = ["test-support"] }
crazyagent-kernel-sandbox = { path = "../kernel/sandbox", features = ["test-support"] }
crazyagent-cap = { path = "../sdk/cap" }
crazyagent-plugin-check = { path = "../sdk/plugin_check" }
tempfile = "=3.27.0"
minisign = "=0.10.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
crazyagent-win-sandbox = { path = "../crazyagent-win-sandbox", features = ["test-principals"] }
