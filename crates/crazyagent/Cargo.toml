[package]
name = "crazyagent"
default-run = "crazyagent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
sha2 = "=0.10.9"
getrandom = "=0.4.3"
subtle = "=2.6.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display", "serde"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.28.1", default-features = false, features = ["events"] }
notify = "=8.2.0"
trash = "=5.2.2"
vt100 = "=0.15.2"
minisign-verify = "=0.3.0"
base64 = "=0.22.1"
semver = "=1.0.28"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
nix = { version = "=0.28.0", default-features = false, features = ["socket", "user"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.2"
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
crazyagent-win-sandbox = { path = "../crazyagent-win-sandbox" }
portable-pty = "=0.9.0"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }

[dev-dependencies]
tempfile = "=3.27.0"
minisign = "=0.10.0"
