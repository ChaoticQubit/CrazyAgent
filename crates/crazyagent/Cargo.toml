[package]
name = "crazyagent"
default-run = "crazyagent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
rusqlite = { version = "=0.40.2", default-features = false }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.28.1", default-features = false, features = ["events"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.28.0", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
tempfile = "=3.27.0"
