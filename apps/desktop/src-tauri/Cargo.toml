[package]
name = "crazyagent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "crazyagent-desktop"

[lib]
name = "crazyagent_desktop"
path = "src/lib.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-webdriver = ["dep:tauri-plugin-wdio-webdriver"]
e2e-bridge = ["tokio/net", "tokio/io-util"]

[[bin]]
name = "desktop-owner-fixture"
path = "src/bin/owner_fixture.rs"
required-features = ["native-webdriver"]

[[bin]]
name = "desktop-e2e-bridge"
path = "e2e_bridge/main.rs"
required-features = ["e2e-bridge"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
crazyagent = { path = "../../../crates/crazyagent" }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-updater = "=2.14.0"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"
