[package]
name = "crazyagent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "crazyagent-desktop"

[lib]
name = "crazyagent_desktop"
path = "src/lib.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-webdriver = ["dep:tauri-plugin-wdio-webdriver"]
e2e-bridge = ["tokio/net", "tokio/io-util"]

[[bin]]
name = "desktop-owner-fixture"
path = "src/bin/owner_fixture.rs"
required-features = ["native-webdriver"]

[[bin]]
name = "desktop-e2e-bridge"
path = "e2e_bridge/main.rs"
required-features = ["e2e-bridge"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
crazyagent = { path = "../../../crates/crazyagent" }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = ["unstable"] }
tauri-plugin-notification = "=2.7.0"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSControl", "NSDockTile", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSGeometry", "NSObjCRuntime", "NSString", "objc2-core-foundation"] }
rustix = { version = "=1.1.5", features = ["process"] }
wgpu = "=25.0.2"
glyphon = "=0.9.0"
alacritty_terminal = "=0.25.1"
pollster = "=0.4.0"
bytemuck = "=1.25.2"
raw-window-handle = "=0.6.2"

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
