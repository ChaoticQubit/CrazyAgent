name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP_FULL: a0e87b82e41c2d6fdf791f26eb635d67ea771c16
  RUNS: "5"

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Stack land gates, kernel storage restore and held_files rows x5 at the stack tip, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a full sha that is not 40 hex
        run: |
          set -euo pipefail
          [[ "$TIP_FULL" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::TIP_FULL is not a 40-hex sha: $TIP_FULL"; exit 1; }
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the stack tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='stack tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::HEAD^ is not the stack tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --verify -q 'HEAD^2' || true)" = "" ] || { echo "::error::the farm commit is a merge"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit changes more than tests.yml"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the stack tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch every locked crate
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Build the kernel storage lib test binary (one target)
        id: build
        if: ${{ steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo test --locked -p crazyagent-kernel-storage --lib --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          bin="$(python3 -I -c 'import json,sys
          for l in open(sys.argv[1]):
              try: m=json.loads(l)
              except Exception: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["kind"]==["lib"]: print(m["executable"])' "$RUNNER_TEMP/build.json" | tail -1)"
          [ -x "$bin" ] || { echo "::error::no test binary"; exit 1; }
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: restore and held_files rows x5 (expect rc 0, 0 failed and the same named passing rows each run)
        if: ${{ steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e
          bad=0
          for i in $(seq 1 "$RUNS"); do
            r="$RUNNER_TEMP/run-$i.log"
            "$BIN" restore:: held_files:: > "$r" 2>&1
            c=$?
            ok=$(grep -cE '^test .* \.\.\. ok$' "$r")
            failed=$(grep -cE '^test .* \.\.\. FAILED$' "$r")
            echo "RUN $i rc $c ok $ok failed $failed $(grep -E '^test result' "$r")"
            grep -E '^test .* \.\.\. ok$' "$r" | sed -E 's/^test (.*) \.\.\. ok$/\1/' | sort > "$RUNNER_TEMP/names-$i.txt"
            grep -E '^test .* FAILED$|panicked at' "$r" | head -n 10 | sed "s/^/run $i: /"
            grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed' "$r" || bad=$((bad + 1))
            [ "$i" = 1 ] || cmp -s "$RUNNER_TEMP/names-1.txt" "$RUNNER_TEMP/names-$i.txt" || { echo "run $i passed a different row set"; bad=$((bad + 1)); }
          done
          echo "ROWS restore:: held_files:: x$RUNS bad_runs $bad passed_rows $(wc -l < "$RUNNER_TEMP/names-1.txt")"
          cat "$RUNNER_TEMP/names-1.txt"
          [ "$bad" = 0 ] || exit 1
