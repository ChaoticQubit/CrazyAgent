name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: PLUGINS-BOUND-WIN clippy and the store row on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='branch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = d60637de57e4f896c7c9912de17f7d8f11c80f33 ] || { echo "::error::the parent is not the PLUGINS-BOUND-WIN tip d60637de57"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib and lib tests at the fix
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going --message-format short -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 3 "$log"
          echo "clippy -p crazyagent --lib --tests rc $rc"
          exit $rc
      - name: The plugin settings rows at the fix, both green
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked config::plugins_count_tests > "$log" 2>&1
          code=$?
          grep -E '^test |^test result:|panicked' "$log" || true
          ok=$(grep -cE '^test [a-z_:]+ \.\.\. ok$' "$log")
          failed=$(grep -cE '^test [a-z_:]+ \.\.\. FAILED$' "$log")
          store=$(grep -cE '^test config::plugins_count_tests::the_store_reads_back_knowledge_and_plugin_settings \.\.\. ok$' "$log")
          echo "fix d60637de57: config::plugins_count_tests rc $code ok $ok of 2 failed $failed store row ok $store"
          [ "$code" = 0 ] && [ "$ok" = 2 ] && [ "$failed" = 0 ] && [ "$store" = 1 ] || { tail -n 60 "$log"; exit 1; }
