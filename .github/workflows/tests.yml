name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  ptimeout-modules-linux:
    name: plugins-timeout fix 279ed4f98 barrier and deadline modules with the helper built, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TIP: 279ed4f98240cd63c73ee56cb89c863b6976f5c5
      RED: 7c6778236d3059615cf079e7df9ef9744fec1373
      PLUGINS: engine::owner::transport::barrier_tests::a_plugin_change_behind_busy_storage_is_refused_to_a_client_far_below_the_engine
      ACCOUNTS: engine::owner::transport::barrier_tests::an_account_removal_behind_busy_storage_is_pending_to_a_client_far_below_the_engine
      GITHUB: engine::owner::transport::native_profile_tests::github_transport_tests::a_github_wait_covers_the_action_bound_plus_the_client_timeout
      LOCATOR: engine::bootstrap::tests::locator_carries_a_bounded_owner_timeout_and_tolerates_older_engines
      OLDPLUGINS: engine::owner::transport::barrier_tests::a_plugin_change_storage_cannot_take_is_refused_to_a_client_whose_wait_ends_first
      OLDREMOVAL: engine::owner::transport::barrier_tests::an_account_removal_held_at_the_barrier_then_behind_storage_is_pending_before_its_cut
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Write the probe helpers to the runner's temp folder
        run: |
          set +e
          set -u
          cat > "$RUNNER_TEMP/farm-probe.sh" <<'SH'
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          libbin() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
            rc=$?
            echo "  lib build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error\|^warning" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)"
          }
          bins() {
            for bin in crazyagent crazyagent-landlock; do
              cargo build -p crazyagent --bin "$bin" --locked > "$RUNNER_TEMP/bin.log" 2>&1
              rc=$?
              echo "  bin $bin rc=$rc"
              [ "$rc" -eq 0 ] || { tail -20 "$RUNNER_TEMP/bin.log" | cut -c1-300; return 1; }
            done
            export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent"
          }
          panics() {
            python3 -I - "$1" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          for n, line in enumerate(text):
              m = re.match(r"^---- (\S+) stdout ----$", line)
              if not m:
                  continue
              print("      ---- " + m.group(1))
              for follow in text[n + 1:n + 30]:
                  if follow.startswith("---- ") or follow.strip() == "failures:":
                      break
                  print("        " + follow.rstrip()[:1500])
          PY
          }
          alone() {
            at=$1 row=$2 times=$3 want=$4 named=${5:-}
            fails=0 ran=0 matched=0
            for i in $(seq 1 "$times"); do
              log="$RUNNER_TEMP/alone-${row##*::}-$at-$i.log"
              keyring "$lib" --exact "$row" > "$log" 2>&1
              if grep -qx "test $row ... FAILED" "$log"; then
                fails=$((fails + 1)) ran=$((ran + 1))
                panics "$log"
                [ -n "$named" ] && grep -qF "$named" "$log" && matched=$((matched + 1))
              elif grep -qx "test $row ... ok" "$log"; then
                ran=$((ran + 1))
              else
                echo "    no result line in run $i"
                tail -5 "$log" | cut -c1-300
              fi
            done
            echo "    ${row##*::} at $at: $fails of $times failed, $ran ran, $matched failed naming '$named' (want $want)"
          }
          declare -A failed
          modules() {
            at=$1 i=$2
            shift 2
            log="$RUNNER_TEMP/modules-$at-$i.log"
            keyring "$lib" "$@" > "$log" 2>&1
            rc=$?
            echo "  $at $i rc=$rc $(grep -m1 '^test result' "$log" | cut -c1-120)"
            for name in $(grep '^test .* FAILED$' "$log" | sed 's/^test //; s/ \.\.\. FAILED$//'); do
              failed[$at:$name]=$(( ${failed[$at:$name]:-0} + 1 ))
              echo "    failed: $name"
            done
            panics "$log"
          }
          counts() {
            echo "== failure counts per label"
            for key in "${!failed[@]}"; do
              echo "  ${key%%:*} ${key#*:} ${failed[$key]}"
            done | sort
          }
          SH
          bash -n "$RUNNER_TEMP/farm-probe.sh" || exit 1
      - name: The two modules red without the helper, now with the helper built
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          set -u
          . "$RUNNER_TEMP/farm-probe.sh"
          git checkout -q -f --detach "$TIP"
          echo "== TIP $(git log --oneline -1 | cut -c1-100)"
          lib=$(libbin) || exit 1
          bins || exit 1
          ls -l target/debug/crazyagent-landlock | cut -c1-200
          for i in 1 2; do modules TIP-barrier "$i" engine::owner::transport::barrier_tests::; done
          for i in 1 2; do modules TIP-deadline "$i" engine::owner::transport::owner_deadline_tests::; done
          counts
