name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  CHORE: fb1c9b29ad2a1e86f6e60865119514ea8860258a
  TIP: 11aa90d03f28410b2ddf974a368a2224028b682b
  RED: d9b480fc981325701df4859c2d102836662c7b55
  FILES: intake settings-home-layout file-manager-words
  RED_SPEC: |
    intake|78|the projects folder line says whether new folders show up live
    intake|78|the projects folder chooser shows each state
    settings-home-layout|10|Projects folder shows its title and purpose, then Folder with the place on the left and the chooser on the right
    file-manager-words|1|the show-folder actions name Finder only on macOS and say Open folder on Windows and Linux
  SRC: apps/desktop/src/screens/intake/home-folder.tsx apps/desktop/src/screens/intake/intake.ts apps/desktop/src/screens/project/context.tsx apps/desktop/src/screens/project/index.tsx apps/desktop/src/screens/settings/projects-home.tsx apps/desktop/src/ui/index.ts apps/desktop/src/ui/keys.ts

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: WORDS-0105 tsc, red, and the intake, home layout and file manager files alone at the tip on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$CHORE" ] || { echo "::error::HEAD~3 is not fb1c9b29ad"; exit 1; }
          [ "$(git merge-base HEAD^ "$CHORE")" = "$CHORE" ] || { echo "::error::the tip is not on the ON-THIS-MAC merge fb1c9b29ad"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8  $work/chrome.zip" | shasum -a 256 -c -
          unzip -q "$work/chrome.zip" -d "$work"
          chrome="$work/chrome-linux64/chrome"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Caps at the tip, the touched files (expect none listed)
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps.txt" 2>&1
          echo "caps rc $?"
          touched=$(git diff --name-only "$CHORE" HEAD^ | tr '\n' '|')
          echo "touched: $touched"
          hits=$(grep -cE "^(${touched%|}):" "$RUNNER_TEMP/caps.txt" || true)
          echo "touched files over a cap or entry: $hits"
          [ "$hits" = 0 ] || { grep -E "^(${touched%|}):" "$RUNNER_TEMP/caps.txt"; exit 1; }
      - name: tsc --noEmit (expect rc 0)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run typecheck
      - name: Red, fb1c9b29ad's source under the tip rows (expect per file the tip test count and exactly the named rows not ok)
        if: ${{ !cancelled() }}
        run: |
          set +e
          for f in $SRC; do git checkout "$CHORE" -- "$f"; done
          bad=0
          for name in $FILES; do
            log="$RUNNER_TEMP/red-$name.log"
            node --test --test-timeout=60000 --test-reporter=spec "apps/desktop/test/$name.test.mjs" > "$log" 2>&1
            rc=$?
            tests=$(grep -E '^ℹ tests ' "$log" | awk '{print $3}')
            fail=$(grep -E '^ℹ fail ' "$log" | awk '{print $3}')
            sed -n '/failing tests:/,$p' "$log" | grep -E '^✖ ' | grep -v 'failing tests:' | sed -E 's/^✖ (.*) \([0-9.]+m?s\)$/\1/' | sort -u > "$RUNNER_TEMP/red-$name.failed"
            printf '%s\n' "$RED_SPEC" | sed -E 's/^ +//' | grep -E "^$name\|" | cut -d'|' -f3 | sort -u > "$RUNNER_TEMP/red-$name.want"
            want_tests=$(printf '%s\n' "$RED_SPEC" | sed -E 's/^ +//' | grep -E "^$name\|" | head -n 1 | cut -d'|' -f2)
            want_fail=$(wc -l < "$RUNNER_TEMP/red-$name.want" | tr -d ' ')
            echo "== red $name rc $rc tests ${tests:-none} (want $want_tests) fail ${fail:-none} (want $want_fail)"
            sed 's/^/  not ok /' "$RUNNER_TEMP/red-$name.failed"
            sed -n '/failing tests:/,$p' "$log" | grep -E '^  [+-] ' | head -n 12 || true
            if [ "$tests" != "$want_tests" ] || [ "$fail" != "$want_fail" ] || ! diff -q "$RUNNER_TEMP/red-$name.want" "$RUNNER_TEMP/red-$name.failed" > /dev/null; then
              bad=1
              echo "::error::red for $name is not the named rows"
            fi
          done
          for f in $SRC; do git checkout HEAD^ -- "$f"; done
          git diff --quiet HEAD^ -- apps || { echo "::error::the tip source was not put back"; exit 1; }
          exit "$bad"
      - name: The three files alone at the tip (expect rc 0, tests >= 1, fail 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -u
          out="$RUNNER_TEMP/alone"; mkdir -p "$out"
          bad=0
          for name in $FILES; do
            file="apps/desktop/test/$name.test.mjs"
            [ -f "$file" ] || { echo "::error::missing $file"; bad=1; continue; }
            node --test --test-timeout=60000 --test-reporter=spec "$file" > "$out/$name.log" 2>&1
            rc=$?
            tests=$(grep -E '^ℹ tests ' "$out/$name.log" | awk '{print $3}')
            fail=$(grep -E '^ℹ fail ' "$out/$name.log" | awk '{print $3}')
            echo "== $name rc $rc tests ${tests:-none} fail ${fail:-none}"
            sed -n '/failing tests:/,$p' "$out/$name.log" | grep -vE '^ℹ ' | head -n 40
            [ "$rc" = 0 ] && [ -n "$tests" ] && [ "$tests" -ge 1 ] && [ "$fail" = 0 ] || bad=1
          done
          exit "$bad"
  macos:
    name: WORDS-0105 tsc, red, and the intake, home layout and file manager files alone at the tip on macos-15
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$CHORE" ] || { echo "::error::HEAD~3 is not fb1c9b29ad"; exit 1; }
          [ "$(git merge-base HEAD^ "$CHORE")" = "$CHORE" ] || { echo "::error::the tip is not on the ON-THIS-MAC merge fb1c9b29ad"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
          echo "01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef  $work/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$work/chrome.zip" "$work"
          chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Print the macOS motion and display settings
        run: |
          set +e
          echo "reduceMotion $(defaults read com.apple.universalaccess reduceMotion 2>&1 | head -1)"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Resolution|UI Looks like' | head -3 || true
          exit 0
      - name: Caps at the tip, the touched files (expect none listed)
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps.txt" 2>&1
          echo "caps rc $?"
          touched=$(git diff --name-only "$CHORE" HEAD^ | tr '\n' '|')
          echo "touched: $touched"
          hits=$(grep -cE "^(${touched%|}):" "$RUNNER_TEMP/caps.txt" || true)
          echo "touched files over a cap or entry: $hits"
          [ "$hits" = 0 ] || { grep -E "^(${touched%|}):" "$RUNNER_TEMP/caps.txt"; exit 1; }
      - name: tsc --noEmit (expect rc 0)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run typecheck
      - name: The three files alone at the tip (expect rc 0, tests >= 1, fail 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -u
          out="$RUNNER_TEMP/alone"; mkdir -p "$out"
          bad=0
          for name in $FILES; do
            file="apps/desktop/test/$name.test.mjs"
            [ -f "$file" ] || { echo "::error::missing $file"; bad=1; continue; }
            node --test --test-timeout=60000 --test-reporter=spec "$file" > "$out/$name.log" 2>&1
            rc=$?
            tests=$(grep -E '^ℹ tests ' "$out/$name.log" | awk '{print $3}')
            fail=$(grep -E '^ℹ fail ' "$out/$name.log" | awk '{print $3}')
            echo "== $name rc $rc tests ${tests:-none} fail ${fail:-none}"
            sed -n '/failing tests:/,$p' "$out/$name.log" | grep -vE '^ℹ ' | head -n 40
            [ "$rc" = 0 ] && [ -n "$tests" ] && [ "$tests" -ge 1 ] && [ "$fail" = 0 ] || bad=1
          done
          exit "$bad"
