name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FILTER: "project_setup::research_logs::tests::"
  NEW_ROW: "a_block_whose_begin_row_starts_at_the_first_byte_read_hides_its_body_rows"
  STALE_ROW: "a_key_end_after_a_separator_still_hides_the_lines_above_it"

defaults:
  run:
    shell: bash

jobs:
  boundary:
    name: key block boundary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='branch tip %H %s' HEAD^
          git log -1 --format='red commit %H %s' HEAD^^
          [ "$(git rev-parse HEAD^)" = dae4010106935dfa3da6375c325e3c6d6376f890 ] || { echo "::error::the parent is not the fix tip dae4010106"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = 677d469454e67b9fc3df7d04d6dac6b17d6b0bae ] || { echo "::error::the grandparent is not the red commit 677d469454"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit touches more than tests.yml"; exit 1; }
          [ "$(git diff --name-only HEAD^^ HEAD^)" = crates/crazyagent/src/project_setup/research_logs.rs ] || { echo "::error::the fix commit touches more than research_logs.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: research log rows at the red commit (expect the new row FAILED)
        id: red
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 120
        run: |
          set +e
          git checkout HEAD^^ -- crates/crazyagent/src/project_setup/research_logs.rs
          git diff --quiet HEAD^^ || { echo "::error::the red tree is not the red commit 677d469454"; exit 1; }
          echo "side red: tree = 677d469454"
          log="$RUNNER_TEMP/rows-red.log"
          cargo test -p crazyagent --lib --locked -- "$FILTER" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          new_listed="$(grep -cxF "$FILTER$NEW_ROW: test" "$log.list" || true)"
          cargo test -p crazyagent --lib --locked -- "$FILTER" > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked|^running |^test ' "$log" || true
          grep -E -A3 'panicked at' "$log" | head -n 20 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          new_failed="$(grep -cxF "test $FILTER$NEW_ROW ... FAILED" "$log" || true)"
          new_ok="$(grep -cxF "test $FILTER$NEW_ROW ... ok" "$log" || true)"
          stale="$(grep -cxF "test $FILTER$STALE_ROW ... FAILED" "$log" || true)"
          built="$(cat "$log.list" "$log" | grep -cE '^ +(Checking|Compiling) crazyagent v' || true)"
          echo "rows side red rc $code listed $listed new-row listed $new_listed new-row failed $new_failed new-row ok $new_ok passed $passed failed $failed stale-base-row failed $stale crazyagent compiled $built"
          [ "$built" -gt 0 ] || { echo "::error::the row build never compiled crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$listed" -gt 0 ] && [ "$new_listed" = 1 ] && [ "$new_failed" = 1 ] && [ "$failed" = $((stale + 1)) ] && [ "$passed" = $((listed - failed)) ] || exit 1
      - name: clippy at the tip, lib and tests on Linux, lib on Windows (expect rc 0, 0 warning or error lines)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          git checkout HEAD^ -- crates/crazyagent/src/project_setup/research_logs.rs
          git diff --quiet HEAD^ || { echo "::error::the clippy tree is not the branch tip"; exit 1; }
          log="$RUNNER_TEMP/clippy.log"
          if [ "$RUNNER_OS" = Windows ]; then
            cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          else
            cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          fi
          code=$?
          grep -E '^(warning|error)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          lines="$(grep -cE '^(warning|error)(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ${{ matrix.os }} rc $code warning-or-error lines $lines crazyagent checked $checked"
          [ "$checked" -gt 0 ] || { echo "::error::clippy never checked crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$code" = 0 ] && [ "$lines" = 0 ] || exit 1
      - name: research log rows at the fix tip (expect the new row ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 120
        run: |
          set +e
          git checkout HEAD^ -- crates/crazyagent/src/project_setup/research_logs.rs
          git diff --quiet HEAD^ || { echo "::error::the tip tree is not the fix tip dae4010106"; exit 1; }
          echo "side tip: tree = dae4010106"
          log="$RUNNER_TEMP/rows-tip.log"
          cargo test -p crazyagent --lib --locked -- "$FILTER" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          new_listed="$(grep -cxF "$FILTER$NEW_ROW: test" "$log.list" || true)"
          cargo test -p crazyagent --lib --locked -- "$FILTER" > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked|^running |^test ' "$log" || true
          grep -E -A3 'panicked at' "$log" | head -n 20 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          new_failed="$(grep -cxF "test $FILTER$NEW_ROW ... FAILED" "$log" || true)"
          new_ok="$(grep -cxF "test $FILTER$NEW_ROW ... ok" "$log" || true)"
          stale="$(grep -cxF "test $FILTER$STALE_ROW ... FAILED" "$log" || true)"
          built="$(cat "$log.list" "$log" | grep -cE '^ +(Checking|Compiling) crazyagent v' || true)"
          echo "rows side tip rc $code listed $listed new-row listed $new_listed new-row failed $new_failed new-row ok $new_ok passed $passed failed $failed stale-base-row failed $stale crazyagent compiled $built"
          [ "$built" -gt 0 ] || { echo "::error::the row build never compiled crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$listed" -gt 0 ] && [ "$new_listed" = 1 ] && [ "$new_ok" = 1 ] && [ "$failed" = "$stale" ] && [ "$passed" = $((listed - failed)) ] || exit 1
