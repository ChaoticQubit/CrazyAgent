      - name: ide::bridge rows at base too, every row, tip and base listed side by side
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 150
        run: |
          set +e
          T="$RUNNER_TEMP"
          tip_log="$T/b36/log/b36-ide-bridge.log"
          [ -s "$tip_log" ] || { echo "no tip ide::bridge log"; exit 1; }
          if [ ! -d "$T/base" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || { echo "base fetch failed"; exit 1; }
            git worktree add --detach "$T/base" FETCH_HEAD || exit 1
          fi
          cd "$T/base" || exit 1
          export CARGO_TARGET_DIR="$T/base-target"
          git log -1 --format='base %H %s'
          bash -c "$BASE_PREP" > "$T/ib-base-prep.log" 2>&1
          echo "base prep rc=$?"
          export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$CARGO_TARGET_DIR/debug/crazyagent"
          cargo test -p crazyagent --lib --locked -- ide::bridge:: > "$T/ib-base.log" 2>&1
          echo "base ide::bridge rc=$?"
          grep -E '^test result:' "$T/ib-base.log" || true
          for side in tip base; do
            f="$tip_log"
            [ "$side" = base ] && f="$T/ib-base.log"
            sed -nE 's/^test (ide::bridge::[^ ]+) \.\.\. (ok|FAILED|ignored)$/\1 \2/p' "$f" | sort > "$T/ib-$side.txt"
            echo "$side ok=$(grep -c ' ok$' "$T/ib-$side.txt" || true) failed=$(grep -c ' FAILED$' "$T/ib-$side.txt" || true)"
          done
          echo "ide::bridge row, tip, base:"
          join -a1 -a2 -e none -o 0,1.2,2.2 "$T/ib-tip.txt" "$T/ib-base.txt" | awk '$2 != $3 || $2 != "ok"' | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit 0
      - name: Rows and NEW versus BASE
