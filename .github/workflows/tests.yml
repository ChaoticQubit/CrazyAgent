name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  N6_TIP: 521a78b9f
  R2_RED: 9a801c387
  N6_BASE: e604304c5
  CALLER_FILTERS: >-
    engine::bootstrap::held::tests::
    storage::windows_tests::
    storage::accounts::account_key_windows_tests::
    harnesses::launch::home_windows_tests::
    engine::owner::transport::root_windows_tests::
    engine::owner::transport::key_windows_tests::

defaults:
  run:
    shell: bash

jobs:
  n6-w1-linux:
    name: V244 N6 W1 r2 one name rule, red at 9a801c387, tip 521a78b9f, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux-ubuntu-22.04
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Check the tree is the N6 W1 r2 tip
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          git diff --quiet "$N6_BASE" "$N6_TIP" -- Cargo.lock
          echo "crates at $N6_TIP, Cargo.lock equal to $N6_BASE"
      - name: N6 W1 r2 red, the name rule over the red name.rs at 9a801c387
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$R2_RED" -- crates/crazyagent-win-sandbox/src/name.rs
          set +e
          cargo test -p crazyagent-win-sandbox --test name --locked > "$RUNNER_TEMP/red-name.log" 2>&1
          set -e
          git checkout -q "$N6_TIP" -- crates/crazyagent-win-sandbox/src/name.rs
          git diff --quiet "$N6_TIP" -- crates
          grep -E '^test result|panicked' "$RUNNER_TEMP/red-name.log" || true
          grep -qE '^test result: FAILED\. 0 passed; 1 failed' "$RUNNER_TEMP/red-name.log" || { echo "::error::the name row is not red"; tail -40 "$RUNNER_TEMP/red-name.log"; exit 1; }
      - name: Check crazyagent, all targets, with win-sandbox on every system, at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          cargo check -p crazyagent --all-targets --locked --message-format short > "$RUNNER_TEMP/check.log" 2>&1 || { tail -60 "$RUNNER_TEMP/check.log"; exit 1; }
          if grep -E '^(warning|error)|: (warning|error)' "$RUNNER_TEMP/check.log"; then echo "::error::check printed warnings"; exit 1; fi
          echo "check -p crazyagent --all-targets: rc 0, no warnings"
      - name: Clippy on crazyagent-win-sandbox, all targets, at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy on the crazyagent library and test rows at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: The name rule rows and the held rows at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          set +e
          cargo test -p crazyagent-win-sandbox --test name --locked > "$RUNNER_TEMP/name.log" 2>&1
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: > "$RUNNER_TEMP/held.log" 2>&1
          set -e
          grep -E '^test |^test result' "$RUNNER_TEMP/name.log" "$RUNNER_TEMP/held.log" || true
          grep -qE '^test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/name.log" || { echo "::error::the name row did not pass"; exit 1; }
          grep -qE '^test result: ok\. 12 passed; 0 failed' "$RUNNER_TEMP/held.log" || { echo "::error::the held rows are not 12 passed"; tail -60 "$RUNNER_TEMP/held.log"; exit 1; }
          grep -qE '^test engine::bootstrap::held::tests::a_checked_name_refuses_every_unsafe_spelling_and_keeps_plain_ones \.\.\. ok$' "$RUNNER_TEMP/held.log" || { echo "::error::the checked-name row did not pass"; exit 1; }
          echo "Linux: the name row and the 12 held rows pass"
  n6-w1:
    name: V244 N6 W1 r2 one name rule, red at 9a801c387, tip 521a78b9f, on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Keep the row checkers outside the tree
        run: |
          set -euo pipefail
          cp .github/farm/v244-win-signin-n6-w1-rows.sh "$RUNNER_TEMP/rows.sh"
          cp .github/farm/v244-win-signin-n6-w1-callers.sh "$RUNNER_TEMP/callers.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the N6 W1 r2 tip
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          git diff --quiet "$N6_BASE" "$N6_TIP" -- Cargo.lock
          rustc --version
          echo "crates at $N6_TIP, Cargo.lock equal to $N6_BASE"
      - name: N6 W1 r2 red, the name rule and rename row 5 over the red name.rs and win/private.rs at 9a801c387
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$R2_RED" -- crates/crazyagent-win-sandbox/src/name.rs crates/crazyagent-win-sandbox/src/win/private.rs
          set +e
          cargo test -p crazyagent-win-sandbox --test name --locked > "$RUNNER_TEMP/red-name.log" 2>&1
          cargo test -p crazyagent-win-sandbox --test private_windows --locked -- --test-threads 1 --exact a_rename_name_that_is_not_one_component_trips_the_assertion > "$RUNNER_TEMP/red-row5.log" 2>&1
          set -e
          git checkout -q "$N6_TIP" -- crates/crazyagent-win-sandbox/src/name.rs crates/crazyagent-win-sandbox/src/win/private.rs
          git diff --quiet "$N6_TIP" -- crates
          grep -E '^test result|panicked|reached' "$RUNNER_TEMP/red-name.log" "$RUNNER_TEMP/red-row5.log" || true
          grep -qE '^test result: FAILED\. 0 passed; 1 failed' "$RUNNER_TEMP/red-name.log" || { echo "::error::the name row is not red"; tail -40 "$RUNNER_TEMP/red-name.log"; exit 1; }
          grep -qE '^test result: FAILED\. 0 passed; 1 failed' "$RUNNER_TEMP/red-row5.log" || { echo "::error::row 5 is not red"; tail -40 "$RUNNER_TEMP/red-row5.log"; exit 1; }
          grep -qF '"a\u{1}b" reached the rename' "$RUNNER_TEMP/red-row5.log" || { echo "::error::row 5 did not fail on a control reaching the rename"; exit 1; }
          echo "N6 W1 r2 red: the name rule refuses nothing and a control reaches the rename at $R2_RED"
      - name: Clippy on crazyagent-win-sandbox, all targets, at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy on the crazyagent library at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: N6 W1 private rows at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          set +e
          cargo test -p crazyagent-win-sandbox --test private_windows --locked -- --test-threads 1 > "$RUNNER_TEMP/tip.log" 2>&1
          set -e
          bash "$RUNNER_TEMP/rows.sh" tip "$RUNNER_TEMP/tip.log"
      - name: The name rule rows at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          set +e
          cargo test -p crazyagent-win-sandbox --test name --locked > "$RUNNER_TEMP/name.log" 2>&1
          set -e
          grep -E '^test |^test result' "$RUNNER_TEMP/name.log" || true
          grep -qE '^test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/name.log" || { echo "::error::the name row did not pass"; tail -40 "$RUNNER_TEMP/name.log"; exit 1; }
      - name: Windows crazyagent rows that open through W1, at 521a78b9f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          read -r -a filters <<< "$CALLER_FILTERS"
          cargo test -p crazyagent --lib --locked -- --list "${filters[@]}" > "$RUNNER_TEMP/callers.list" 2>/dev/null
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 "${filters[@]}" > "$RUNNER_TEMP/callers.log" 2>&1
          set -e
          bash "$RUNNER_TEMP/callers.sh" "$RUNNER_TEMP/callers.list" "$RUNNER_TEMP/callers.log" "${filters[@]}"
