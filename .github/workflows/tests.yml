name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: B23 CR10 Windows dangling-link row on ${{ matrix.os }} at ${{ matrix.side }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            side: tip
          - os: windows-2022
            side: red
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='CR10 tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = e9af2c6a2d8331af64fb991f30eb01e8438c7927 ] || { echo "::error::the parent is not the CR10 tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = b744e024047750a698cc3682c05c1303fba39464 ] || { echo "::error::HEAD~2 is not the canonical chain commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = ba209aa1366ed4902e233bedb6028ffa515e7e69 ] || { echo "::error::HEAD~4 is not the CR10 fix"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = 1fdea8a10a1eb3e4a707afb751ad7facb70db82a ] || { echo "::error::HEAD~5 is not the CR10 red rows"; exit 1; }
          [ "$(git rev-parse HEAD~6)" = f0a086aaedf8fb960af9ad174abf7381706b2077 ] || { echo "::error::HEAD~6 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~6 HEAD^ | tr '\n' ' ')" = "crates/kernel/sandbox/src/paths.rs crates/kernel/sandbox/src/paths/tests.rs " ] || { echo "::error::the CR10 range touches more than paths.rs and paths/tests.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the CR10 tip"; exit 1; }
          if [ "${{ matrix.side }}" = red ]; then
            git checkout HEAD~6 -- crates/kernel/sandbox/src/paths.rs
            git diff --quiet HEAD~6 -- crates/kernel/sandbox/src/paths.rs || { echo "::error::paths.rs is not the base"; exit 1; }
            git diff --quiet HEAD^ -- crates/kernel/sandbox/src/paths || { echo "::error::the rows are not the tip rows"; exit 1; }
            git diff --stat HEAD^
            echo "side red: paths.rs at the base, paths/tests.rs with the tip rows"
          fi
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: kernel-sandbox clippy --lib --tests with warnings denied at tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +Checking crazyagent-kernel-sandbox ' "$log" || true)"
          echo "clippy side tip rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: CR10 Windows row at red, base paths.rs (expect listed 1, failed 1 at the refusal assert tests.rs 545)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'red' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/win-row.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::on_windows_a_root_holding_where_a_dangling_secret_link_or_junction_leads_is_refused --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::on_windows_a_root_holding_where_a_dangling_secret_link_or_junction_leads_is_refused > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "win-row side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$listed" = 1 ] && [ "$failed" = 1 ] && grep -qE "panicked at crates.kernel.sandbox.src.paths.tests\.rs:545:" "$log" || exit 1
      - name: CR10 Windows row at tip (expect listed 1, passed 1)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/win-row.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::on_windows_a_root_holding_where_a_dangling_secret_link_or_junction_leads_is_refused --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::on_windows_a_root_holding_where_a_dangling_secret_link_or_junction_leads_is_refused > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "win-row side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" = 1 ] && [ "$passed" = 1 ] && [ "$failed" = 0 ] || exit 1
      - name: CR10 every paths row at tip (expect listed > 0, passed = listed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/win-paths.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- paths::tests:: --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- paths::tests:: > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "win-paths side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1
