name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 8ae2700cc8c86d40a7efa8ae896f4a5d6fb2cb63

defaults:
  run:
    shell: bash

jobs:
  b2-rows:
    name: Admin step B2 ${{ matrix.runner }} at the clippy fix, the crate's library rows and clippy over every target
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tree is the tip but for this workflow
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD | tr '\n' ' ')" = ".github/workflows/tests.yml "
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: The crate's library rows, the admin step and device grant rows named
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent-win-sandbox --lib --locked > "$RUNNER_TEMP/lib.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/lib.txt" | cut -c1-300 | head -20
          grep -cE "^test admin_step::tests::.* ok$" "$RUNNER_TEMP/lib.txt"
          grep -E "^test (admin_step::tests::|dacl::tests::the_device_grants).* ok$" "$RUNNER_TEMP/lib.txt"
          [ "$rc" -eq 0 ] || { echo "LIBRARY ROWS FAILED"; exit 1; }
          [ "$(grep -cE "^test admin_step::tests::.* ok$" "$RUNNER_TEMP/lib.txt")" -eq 7 ] || { echo "NOT ALL 7 ADMIN STEP ROWS RAN"; exit 1; }
          grep -q "^test dacl::tests::the_device_grants_are_nul_read_write_and_the_mount_manager_lookup \.\.\. ok$" "$RUNNER_TEMP/lib.txt" || { echo "DEVICE GRANT TABLE ROW DID NOT RUN"; exit 1; }
      - name: Clippy, the crate with every target
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
