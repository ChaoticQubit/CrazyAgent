name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED1_SHA: 285c780772d3b8a549fd890c12bb38b27dc0e695
  RED2_SHA: 4d34ca8d782a746126a7e54bcca9784d7bd60cba
  HELD: tui::screens::app_setup::tests::first_run_keeps_its_own_fix_outcome_when_the_held_run_ends_with_a_problem
  SAME_READ: tui::screens::app_setup::tests::a_run_and_its_own_fix_ending_in_one_read_lead_with_the_fix_outcome
  KEEP: tui::screens::app_setup::tests::first_run_leaves_only_after_its_own_fix_ends_when_the_run_ends_first tui::screens::app_setup::tests::settings_says_the_run_end_then_its_own_fix_outcome_last tui::screens::app_setup::tests::enter_runs_setup_while_this_screens_own_fix_runs

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux app setup rows, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red1, red2, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the side
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          case "$SIDE" in
            red1) git checkout --detach "$RED1_SHA" ;;
            red2) git checkout --detach "$RED2_SHA" ;;
          esac
          git log --oneline -1
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows and their expected results
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          out="$RUNNER_TEMP/setup-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib --no-run 2>&1 | tail -3
          read -ra keep <<< "$KEEP"
          rows=("${keep[@]}" "$HELD")
          [ "$SIDE" = red1 ] || rows+=("$SAME_READ")
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib -- --exact "${rows[@]}" 2>&1 | tee -a "$out"
          result() { grep -E "^test $1 \.\.\. " "$out" | sed -E 's/.* \.\.\. //'; }
          verdict=pass
          for name in "${keep[@]}"; do [ "$(result "$name")" = ok ] || verdict=fail; done
          case "$SIDE" in
            red1) [ "$(result "$HELD")" = FAILED ] || verdict=fail ;;
            red2) [ "$(result "$HELD")" = ok ] && [ "$(result "$SAME_READ")" = FAILED ] || verdict=fail ;;
            green) [ "$(result "$HELD")" = ok ] && [ "$(result "$SAME_READ")" = ok ] || verdict=fail ;;
          esac
          { echo "| row | result |"; echo "| --- | --- |"; grep -E "^test .* \.\.\. " "$out" | sed -E 's/^test (.*) \.\.\. (.*)$/| \1 | \2 |/'; echo "| VERDICT $SIDE | $verdict |"; } >> "$GITHUB_STEP_SUMMARY"
          echo "VERDICT $SIDE held=$(result "$HELD") same_read=$(result "$SAME_READ") verdict=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-setup-${{ matrix.side }}
          path: ${{ runner.temp }}/setup-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
