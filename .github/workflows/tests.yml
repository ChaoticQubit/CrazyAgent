name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  ROW: research::runner::listed_tests::a_piped_research_job_exiting_right_after_a_folder_is_saved_hidden_publishes_no_report

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: piped late-hide row on macos-15 at ${{ matrix.side }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        side: [tip, red]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one, and on the red side take out the supervise hide check
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='branch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = e8d9dff24ef3ea76c1a09f955de116cd619d12bb ] || { echo "::error::the parent is not the row tip e8d9dff24e"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit touches more than tests.yml"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
          if [ "${{ matrix.side }}" = red ]; then
            runner=crates/crazyagent/src/research/runner.rs
            perl -0pi -e 's/\n        if matches!\(ending, Ending::Exited\(true\)\) && granted\.hide_stops\(jobs, listed, &never\)\(\) \{\n            return Ok\(Ending::Hidden\);\n        \}//' "$runner"
            git diff --numstat HEAD^ -- "$runner"
            [ "$(git diff --numstat HEAD^ | tr '\t' ' ')" = "0 3 $runner" ] || { echo "::error::the red tree is not the tip minus the 3 supervise lines"; exit 1; }
            [ "$(grep -c 'matches!(ending, Ending::Exited(true))' "$runner" || true)" = 0 ] || { echo "::error::the supervise hide check is still there"; exit 1; }
            echo "side red: supervise hide check taken out"
          fi
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: clippy on the crazyagent lib and tests at the tip (expect rc 0, 0 warning or error lines)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(warning|error)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          lines="$(grep -cE '^(warning|error)(\[|:)' "$log" || true)"
          checked="$(grep -c 'Checking crazyagent v' "$log" || true)"
          echo "clippy rc $code warning-or-error lines $lines crazyagent checked $checked"
          [ "$checked" -gt 0 ] || { echo "::error::clippy never checked crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$code" = 0 ] && [ "$lines" = 0 ] || exit 1
      - name: the piped late-hide row by exact name (tip expects passed 1; red expects 1 FAILED on an assert_eq)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/row.log"
          cargo test -p crazyagent --lib --locked -- --exact "$ROW" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- --exact "$ROW" > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked|left:|right:|^test |never started|never beat|ended before' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          compared="$(grep -cE '^ +left: ' "$log" || true)"
          early="$(grep -cE 'never started|never beat|ended before the stand-in' "$log" || true)"
          compiled="$(cat "$log.list" "$log" | grep -c 'Compiling crazyagent v' || true)"
          echo "row side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed assert_eq-left $compared early $early crazyagent compiled $compiled"
          [ "$compiled" -gt 0 ] || { echo "::error::the row build never compiled crazyagent (a restored target read as fresh)"; exit 1; }
          if [ "${{ matrix.side }}" = tip ]; then
            [ "$code" = 0 ] && [ "$listed" = 1 ] && [ "$passed" = 1 ] && [ "$failed" = 0 ] || exit 1
          else
            [ "$listed" = 1 ] && [ "$failed" = 1 ] && [ "$compared" -gt 0 ] && [ "$early" = 0 ] || exit 1
          fi
