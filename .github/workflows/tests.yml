name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: HANDOVER-W1 red rows on windows-2022
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the red commit's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='red B %H %s' HEAD^
          git log -1 --format='red A %H %s' HEAD^^
          git log -1 --format='base %H %s' HEAD^^^
          [ "$(git rev-parse HEAD^^^)" = 534867d75762eb89dd4255eca6f9ecf0dac18771 ] || { echo "::error::HEAD^^^ is not b23 534867d757"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = 41ff2650ad0c6572d2e11e85335fdde6bed8da78 ] || { echo "::error::HEAD^^ is not red A 41ff2650ad"; exit 1; }
          [ "$(git rev-parse HEAD^)" = b058838f4564e47e2066084e2ec541cae11d7ba2 ] || { echo "::error::the parent is not red B b058838f45"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not red B"; exit 1; }
          git diff --stat HEAD^^^ HEAD^
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the Windows boundary helper
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
          mkdir -p apps/desktop/dist
          printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
      - name: Row 3 at red B, kernel sandbox lib tests build (expected compile red, wrap_handing missing)
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/r3.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^error(\[E[0-9]+\])?:|-->' "$log" | head -n 40 || true
          tail -n 3 "$log"
          echo "row 3 build rc $code"
      - name: Row 1 at red A, handed_tests on Windows (expected runtime red, Handed::new refuses)
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          git checkout HEAD^^ -- crates/kernel/sandbox
          git diff --stat HEAD^^ -- crates/kernel/sandbox
          log="$RUNNER_TEMP/r1.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked profile::env::handed_tests:: -- --test-threads 1 > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ tests|^test |panicked|test result|^error' "$log" | head -n 40 || true
          echo "row 1 rc $code"
          git checkout HEAD -- crates/kernel/sandbox
          git diff --quiet HEAD^ || { echo "::error::the tree is not red B after row 1"; exit 1; }
      - name: Row 2 at red B, Windows bounded rows (expected runtime red on the hand-over row only)
        if: always()
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/r2.log"
          cargo test -p crazyagent --lib --locked harnesses::launch::bounded_windows_tests:: -- --test-threads 1 > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ tests|^test |panicked|test result|^error' "$log" | head -n 60 || true
          tail -n 3 "$log"
          echo "row 2 rc $code"
