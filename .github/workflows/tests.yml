name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  BASE_SHA: 6b0cb68f3
  L5C_RED_SHA: e953d4f16
  GREEN_SHA: 6d4a4698a

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: V244 Linux L5c term rows, red e953d4f16 then green 6d4a4698a, on X11, weston and sway, quiet and loaded
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Drop the Microsoft apt source the farm does not use
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install the display servers, Vulkan and screenshot tools the display row needs
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends xvfb x11-apps weston sway grim mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1-mesa-dri libegl1 imagemagick jq
      - name: Install the fonts the font rows read
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends fonts-dejavu-core \
            || echo "::warning::fonts-dejavu-core did not install; the font row takes its built-in branch"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux-2404
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Red then green rows, lib build and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          cp .github/farm/v244-linux-l5c.sh "$RUNNER_TEMP/l5c.sh"
          bash "$RUNNER_TEMP/l5c.sh" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-linux-l5c-linux
          path: |
            ${{ runner.temp }}/v244-linux-l5c-linux.txt
            ${{ runner.temp }}/l5c-cells
          if-no-files-found: warn
          retention-days: 14
