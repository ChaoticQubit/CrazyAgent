name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 87ac99dfea4af8faca0bb446a1b8f2e992a8457e
  BASE_FULL: ed6ba4a9d4d45f62cb4ce2f0d2583cb7be50cf46
  HELD: "engine::bootstrap::held::tests::"
  LAUNCH: "launch_context::windows_tests::"
  UNIX_LAUNCH: "launch_context::tests::"
  HOME_WINDOWS: "agent_home::windows_tests::"
  NEW_HELD: "a_sole_inherited_file_refuses_a_second_writer_while_it_is_open an_unjudged_file_open_reads_a_plain_file_and_refuses_a_link_or_folder an_unjudged_file_open_of_a_file_held_without_sharing_is_in_use"
  PRIVATE_ROW: "a_private_make_over_another_kind_of_entry_is_unsafe"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  NEW_WINDOWS: "a_windows_process_install_prepares_the_home_through_the_held_root a_windows_process_install_removes_planted_junctions_in_the_home_as_themselves a_windows_process_install_replaces_a_link_or_folder_at_the_instruction_file a_windows_process_install_with_no_text_removes_the_instruction_file a_windows_process_install_keeps_or_clears_the_caches_by_the_choice a_windows_process_install_clears_project_memory_and_links_but_keeps_transcripts a_windows_process_install_keeps_a_kept_file_it_cannot_open a_windows_install_it_cannot_write_yet_is_refused_before_it_changes_the_home"

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: S9B-6 prepare tip 3 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 9
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~7)" = "$BASE_FULL" ] || { echo "::error::HEAD~7 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Show the runner token's backup and restore privileges
        run: |
          set -euo pipefail
          whoami
          MSYS_NO_PATHCONV=1 /c/Windows/System32/whoami.exe /priv | grep -iE 'SeBackupPrivilege|SeRestorePrivilege' || true
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: crazyagent clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylibtests.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib --tests windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: held rows exact (24 + the private row, the 3 new ok), agent_home Windows rows == list, then launch_context Windows rows == list, the 8 new ones 5 rounds (crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          misses() {
            grep -E '^test .* \.\.\. ok' "$1" | grep -vE "^test $2[a-z0-9_:]+ \.\.\. ok$" | head -n 10 || true
          }
          count_list() {
            cargo test -p crazyagent --lib --locked -- "$1" --list 2>/dev/null | grep -cE ': test$' || true
          }
          held_exact() {
            local want="$1" log="$RUNNER_TEMP/held.log"
            cargo test -p crazyagent --lib --locked -- "$HELD" > "$log" 2>&1
            local code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            local failed ok private
            failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
            ok="$(grep -E "^test ${HELD}[a-z_:]+ \.\.\. ok$" "$log" | grep -cv "$PRIVATE_ROW" || true)"
            private="$(grep -cE "^test $HELD$PRIVATE_ROW \.\.\. ok$" "$log" || true)"
            echo "held rc $code failed $failed ok $ok want $want private ok $private"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "$want" ] && [ "$private" = 1 ]
          }
          held_exact 24 || exit 1
          read -r -a held_new <<< "$NEW_HELD"
          [ "${#held_new[@]}" = 3 ] || { echo "::error::want 3 new held rows, have ${#held_new[@]}"; exit 1; }
          for row in "${held_new[@]}"; do
            n="$(grep -cE "^test $HELD$row \.\.\. ok$" "$RUNNER_TEMP/held.log" || true)"
            echo "held new $row ok $n"
            [ "$n" = 1 ] || exit 1
          done
          home_listed="$(count_list "$HOME_WINDOWS")"
          hlog="$RUNNER_TEMP/home.log"
          cargo test -p crazyagent --lib --locked -- "$HOME_WINDOWS" > "$hlog" 2>&1
          hcode=$?
          grep -E '^test .* FAILED$|panicked at' "$hlog" | head -n 20 || true
          hfailed="$(result_sum "$hlog" 6)"
          hpassed="$(result_sum "$hlog" 4)"
          hignored="$(result_sum "$hlog" 8)"
          misses "$hlog" "$HOME_WINDOWS"
          echo "agent_home windows rc $hcode listed $home_listed passed $hpassed ignored $hignored failed $hfailed"
          [ "$hcode" = 0 ] && [ "$hfailed" = 0 ] && [ "$home_listed" -ge 1 ] && [ "$hpassed" = "$((home_listed - hignored))" ] || exit 1
          read -r -a new <<< "$NEW_WINDOWS"
          [ "${#new[@]}" = 8 ] || { echo "::error::want 8 new rows, have ${#new[@]}"; exit 1; }
          listed="$(count_list "$LAUNCH")"
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- "$LAUNCH" > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
          failed="$(result_sum "$log" 6)"
          passed="$(result_sum "$log" 4)"
          ignored="$(result_sum "$log" 8)"
          launch="$(grep -cE "^test ${LAUNCH}[a-z0-9_:]+ \.\.\. ok$" "$log" || true)"
          misses "$log" "$LAUNCH"
          gate="$(cat "$RUNNER_TEMP/held.log" "$hlog" "$log" | grep -cE '^ +(Checking|Compiling) crazyagent v' || true)"
          ok=0
          for row in "${new[@]}"; do
            n="$(grep -cE "^test $LAUNCH$row \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          echo "launch rc $code listed $listed passed $passed ignored $ignored ok lines $launch failed $failed new ok $ok of 8 gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" -ge 21 ] && [ "$passed" = "$((listed - ignored))" ] && [ "$ok" = 8 ] && [ "$gate" -ge 1 ] || exit 1
          for round in 1 2 3 4 5; do
            rlog="$RUNNER_TEMP/round-$round.log"
            cargo test -p crazyagent --lib --locked -- "$LAUNCH" > "$rlog" 2>&1
            rcode=$?
            rok=0
            for row in "${new[@]}"; do
              rok=$((rok + $(grep -cE "^test $LAUNCH$row \.\.\. ok$" "$rlog" || true)))
            done
            rfailed="$(grep -E '^test result:' "$rlog" | awk '{f+=$6} END {print f+0}')"
            echo "round $round rc $rcode failed $rfailed new ok $rok of 8"
            grep -E '^test .* FAILED$|panicked at' "$rlog" | head -n 10 || true
            [ "$rcode" = 0 ] && [ "$rfailed" = 0 ] && [ "$rok" = 8 ] || exit 1
          done

