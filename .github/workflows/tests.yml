name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 5c87e5a5d4914f0ea1a286b951a4be3746f66ac3
  RED: 1761b484ab9305ad30f66744aacda018d8dff3db
  BASE: ee844fc1e8dcc49cef9e193efd4551292623b11e
  FILES: apps/desktop/src/screens/team/terminal-io.ts apps/desktop/test/terminal-ended.test.mjs crates/crazyagent/src/tui/screens/team.rs crates/crazyagent/src/tui/screens/team/closed_words_tests.rs
  NODE_SRC: apps/desktop/src/screens/team/terminal-io.ts
  NODE_RED_ROW: "on Windows an unavailable terminal says the engine couldn't open it, since Windows terminals need no tmux"
  NODE_TESTS: "7"
  TUI_FILE: crates/crazyagent/src/tui/screens/team.rs
  TUI_FILTER: "tui::screens::team::closed_words_tests::"
  TUI_ROW: "tui::screens::team::closed_words_tests::on_windows_an_unavailable_terminal_says_the_engine_could_not_open_it"

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: WORDS-0131 node red and tip, rustfmt, caps, crazyagent clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE" ] || { echo "::error::HEAD~3 is not chore/v250 ee844fc1e8"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        run: |
          set -euo pipefail
          for f in crates/crazyagent/src/tui/screens/team.rs crates/crazyagent/src/tui/screens/team/closed_words_tests.rs; do
            rustfmt --edition 2024 --check "$f"
          done
      - name: Line caps and sleeps at the base and the tip (expect no file new to the problem list, sleeps rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; echo "caps tip rc $?"
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1; st=$?; echo "sleeps tip rc $st"
          git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; echo "caps base rc $?"; node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-base.txt" 2>&1; echo "sleeps base rc $?")
          git worktree remove --force "$RUNNER_TEMP/base"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-base.txt" | sort > "$RUNNER_TEMP/cb.txt"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-tip.txt" | sort > "$RUNNER_TEMP/ct.txt"
          comm -13 "$RUNNER_TEMP/cb.txt" "$RUNNER_TEMP/ct.txt" > "$RUNNER_TEMP/caps-new.txt"
          echo "caps new at tip $(wc -l < "$RUNNER_TEMP/caps-new.txt" | tr -d ' ')"; cat "$RUNNER_TEMP/caps-new.txt"
          [ ! -s "$RUNNER_TEMP/caps-new.txt" ] && [ "$st" = 0 ] || exit 1
      - name: tsc --noEmit (expect rc 0)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Red, the base terminal-io.ts under the tip rows (expect the tip test count and exactly the named row not ok)
        if: ${{ !cancelled() }}
        run: |
          set +e
          git checkout "$BASE" -- "$NODE_SRC"
          log="$RUNNER_TEMP/node-red.log"
          node --test --test-timeout=60000 --test-reporter=spec apps/desktop/test/terminal-ended.test.mjs > "$log" 2>&1
          rc=$?
          git checkout HEAD^ -- "$NODE_SRC"
          git diff --quiet HEAD^ -- apps || { echo "::error::the tip terminal-io.ts was not put back"; exit 1; }
          tests=$(grep -E '^ℹ tests ' "$log" | awk '{print $3}')
          fail=$(grep -E '^ℹ fail ' "$log" | awk '{print $3}')
          sed -n '/failing tests:/,$p' "$log" | grep -E '^✖ ' | grep -v 'failing tests:' | sed -E 's/^✖ (.*) \([0-9.]+m?s\)$/\1/' | sort -u > "$RUNNER_TEMP/node-red.failed"
          echo "== red terminal-ended rc $rc tests ${tests:-none} (want $NODE_TESTS) fail ${fail:-none} (want 1)"
          sed 's/^/  not ok /' "$RUNNER_TEMP/node-red.failed"
          sed -n '/failing tests:/,$p' "$log" | grep -E '^  [+-] ' | head -n 6 || true
          if [ "$tests" != "$NODE_TESTS" ] || [ "$fail" != 1 ] || [ "$(cat "$RUNNER_TEMP/node-red.failed")" != "$NODE_RED_ROW" ]; then
            echo "::error::the node red is not exactly the named row"
            exit 1
          fi
      - name: terminal-ended alone at the tip (expect rc 0, the tip test count, fail 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          log="$RUNNER_TEMP/node-tip.log"
          node --test --test-timeout=60000 --test-reporter=spec apps/desktop/test/terminal-ended.test.mjs > "$log" 2>&1
          rc=$?
          tests=$(grep -E '^ℹ tests ' "$log" | awk '{print $3}')
          fail=$(grep -E '^ℹ fail ' "$log" | awk '{print $3}')
          echo "== terminal-ended rc $rc tests ${tests:-none} fail ${fail:-none}"
          [ "$rc" = 0 ] && [ "$tests" = "$NODE_TESTS" ] && [ "$fail" = 0 ] || exit 1
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
  windows:
    name: WORDS-0131 rustfmt, crazyagent clippy, closed_words red and tip on windows-2022
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE" ] || { echo "::error::HEAD~3 is not chore/v250 ee844fc1e8"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        run: |
          set -euo pipefail
          for f in crates/crazyagent/src/tui/screens/team.rs crates/crazyagent/src/tui/screens/team/closed_words_tests.rs; do
            rustfmt --edition 2024 --check "$f"
          done
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Write the row runner
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          set +e
          set -u
          name=$1
          filter=$2
          log="$RUNNER_TEMP/rows-$name.log"
          cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
          rc=$?
          grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$name.txt"
          echo "$name FAILED $(wc -l < "$RUNNER_TEMP/failed-$name.txt" | tr -d ' '):"
          cat "$RUNNER_TEMP/failed-$name.txt"
          awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' | head -n 40 || true
          grep -E '^ +Compiling crazyagent v' "$log" || true
          ok=$(grep -cE '^test .* \.\.\. ok$' "$log")
          echo "$name filter $filter rc $rc ok $ok $(grep -E '^test result:' "$log" | tr '\n' ' ')"
          echo "$ok" > "$RUNNER_TEMP/ok-$name.txt"
          echo "$rc" > "$RUNNER_TEMP/rc-$name.txt"
          ROWS
          sed -i.bak 's/^          //' "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Red, the base team.rs under the tip rows (expect exactly the named closed_words row FAILED)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          git checkout "$BASE" -- "$TUI_FILE"
          bash "$RUNNER_TEMP/rows.sh" red "$TUI_FILTER"
          git checkout HEAD^ -- "$TUI_FILE"
          git diff --quiet HEAD^ -- crates || { echo "::error::the tip team.rs was not put back"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/failed-red.txt")" = "$TUI_ROW" ] || { echo "::error::the red set is not exactly $TUI_ROW"; exit 1; }
      - name: Tip, the closed_words rows (expect rc 0, the named row ok, FAILED 0)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          bash "$RUNNER_TEMP/rows.sh" tip "$TUI_FILTER"
          grep -qxF "test $TUI_ROW ... ok" "$RUNNER_TEMP/rows-tip.log" || { echo "::error::the named row did not pass"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/rc-tip.txt")" = 0 ] && [ ! -s "$RUNNER_TEMP/failed-tip.txt" ] && [ "$(cat "$RUNNER_TEMP/ok-tip.txt")" -ge 1 ] || exit 1
