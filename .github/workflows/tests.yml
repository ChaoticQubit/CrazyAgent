name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TIP: a0367171c4

defaults:
  run:
    shell: bash

jobs:
  npm-first-line:
    name: V250-WIN-NPM-CLI-FIRSTLINE npm and npx script heads on windows-2022
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Refuse a probe whose parent is not the ticket tip
        run: |
          set -euo pipefail
          parent=$(git rev-parse --short=10 HEAD^)
          echo "CASE head $(git rev-parse HEAD) parent $parent"
          [ "$parent" = "$TIP" ] || { echo "::error::HEAD^ is $parent, not the tip $TIP"; exit 1; }
          changed=$(git diff --name-only HEAD^ HEAD)
          [ "$changed" = ".github/workflows/tests.yml" ] || { echo "::error::the probe commit changes more than the workflow: $changed"; exit 1; }
      - name: Print the heads of npm's and npx's scripts beside the installed Node
        run: |
          set -uo pipefail
          folder='/c/Program Files/nodejs'
          echo "CASE node $("$folder/node.exe" -v)"
          echo "CASE npm $("$folder/node.exe" "$folder/node_modules/npm/bin/npm-cli.js" -v)"
          echo "CASE where node: $(command -v node)"
          failed=0
          for script in npm-cli.js npx-cli.js; do
            file="$folder/node_modules/npm/bin/$script"
            if [ ! -f "$file" ]; then
              echo "CASE $script missing"
              failed=1
              continue
            fi
            echo "CASE $script bytes=$(wc -c < "$file") crlf_lines=$(grep -c $'\r$' "$file" || true) lines=$(wc -l < "$file")"
            od -A d -t x1 -N 96 "$file" | sed "s/^/CASE $script hex /"
            head -c 96 "$file" | od -A d -c | sed "s/^/CASE $script chars /"
          done
          for cmd in npm.cmd npx.cmd; do
            echo "CASE $cmd head"
            head -c 200 "$folder/$cmd" | od -A d -c | head -6 | sed "s/^/CASE $cmd chars /"
          done
          exit "$failed"
