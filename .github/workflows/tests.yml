name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 4e3ce3ac8fca6835246b29809135dfee1e887fd2
  IMPORT_FIX: 39c066c2dfb76e1c3597fd6dc3da0e703df2c22a
  IMPORTED: crates/crazyagent/src/github/publish/windows_tests.rs
  OWNER_GIT_FILE: crates/crazyagent/src/sandbox/windows/owner_git.rs
  OWNER_GIT_COMMITS: "6c2c51fa446029d41db2246fc3aef2e47dac5e7c 4380ab9c7c8a794a8eb445c880adf422ecd3378b 4945912f75fb5435c8082fefae6533daa23a13a0 f21a0ca4fffdfb01edb8d69efd92853c599056f6"
  PATH_GIT: sandbox::windows::owner_git::tests::the_git_the_engine_finds_on_the_path_is_one_owner_git_installs_for
  RED: d7a26ac83cd58099ce5e0c86f0233ac2c5db2224
  FARM_FILES: ".github/farm/unc-share-setup.ps1 .github/workflows/tests.yml"
  PUBLISH_SHARE: github::publish::publish_windows_tests::a_contained_windows_publish_step_opens_no_share_a_git_folder_names_after_the_check
  PUBLISH_COMMITS: github::publish::publish_windows_tests::a_contained_windows_publish_commits_a_new_file_with_the_project_author_first
  LIST_SHARE: project_files::windows_tests::a_contained_windows_list_opens_no_share_a_git_folder_names_after_the_check
  LIST_NAMES: project_files::windows_tests::a_contained_windows_list_names_new_files_and_leaves_out_ignored_ones
  ROOTS: sandbox::windows::owner_git::tests::git_for_windows_install_folders_are_found_from_its_programs_only
  PROFILE: sandbox::windows::owner_git::tests::owner_git_has_no_capability_writes_only_the_project_and_its_folders_and_is_no_agents_container
  REFUSE: sandbox::windows::owner_git::tests::owner_git_refuses_a_git_outside_a_git_for_windows_install_before_any_profile
  WRAP: sandbox::windows::owner_git::tests::a_wrapped_git_starts_through_the_helper_in_its_own_home_with_no_global_config
  WRAP_REFUSES: sandbox::windows::owner_git::tests::a_wrapped_git_refuses_another_program_a_global_config_or_a_folder_outside_the_project
  MARKERS: sandbox::windows::owner_git::tests::owner_git_reads_only_a_folder_that_holds_git_for_windows_markers
  HOLDS: sandbox::windows::owner_git::tests::owner_git_refuses_an_install_folder_that_holds_the_project_or_its_own_folder
  JUNCTION_LIST: project_files::windows_tests::the_declined_windows_list_names_its_tracked_files_only_and_none_through_a_junction
  NESTED_LIST: project_files::windows_tests::the_declined_windows_list_names_tracked_files_only_and_never_opens_a_nested_git_file
  ORDER: project_files::windows_tests::the_git_folder_walk_runs_before_any_check_that_reads_through_its_folders
  OUTSIDE: github::publish::publish_windows_tests::a_windows_publish_opens_no_file_the_repository_config_names_outside_the_tree
  EVERY_STEP: github::publish::publish_windows_tests::every_windows_publish_step_refuses_a_git_folder_that_points_elsewhere
  NESTED: github::publish::publish_windows_tests::a_windows_publish_refuses_a_nested_git_entry_naming_its_folder_before_git_walks_the_tree
  STILL_COMMITS: github::publish::publish_windows_tests::a_windows_publish_of_a_project_with_no_nested_git_entry_still_commits

defaults:
  run:
    shell: bash

jobs:
  win-red:
    name: UNC owner git routing windows-2022 at the red commit plus the one-line import and the tip's owner git file, both share rows fail on a server session and the list row names new files
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep the share setup, then make the tree the red commit plus the import commit's one file and the tip's owner git file
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          git merge-base --is-ancestor "$IMPORT_FIX" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD | tr '\n' ' ' | sed 's/ $//')" = "$FARM_FILES"
          test "$(git diff --name-only "$IMPORT_FIX^" "$IMPORT_FIX")" = "$IMPORTED"
          test "$(git diff --numstat "$IMPORT_FIX^" "$IMPORT_FIX")" = "$(printf '1\t1\t%s' "$IMPORTED")"
          git diff --quiet "$RED" "$IMPORT_FIX^" -- "$IMPORTED"
          test "$(git log --format=%H "$RED..$TIP" -- "$OWNER_GIT_FILE" | tr '\n' ' ' | sed 's/ $//')" = "$OWNER_GIT_COMMITS"
          for commit in $OWNER_GIT_COMMITS; do
            test "$(git diff --name-only "$commit^" "$commit")" = "$OWNER_GIT_FILE"
          done
          cp .github/farm/unc-share-setup.ps1 "$RUNNER_TEMP/unc-share-setup.ps1"
          git checkout -q --detach "$RED"
          test "$(git rev-parse HEAD)" = "$RED"
          git checkout "$IMPORT_FIX" -- "$IMPORTED"
          git checkout "$TIP" -- "$OWNER_GIT_FILE"
          test "$(git status --porcelain | tr '\n' ' ' | sed 's/ $//')" = "M  $IMPORTED M  $OWNER_GIT_FILE" || { echo "TREE IS NOT THE RED COMMIT PLUS THE IMPORT AND OWNER GIT"; git status --short | head -20; exit 1; }
          git diff --cached --stat "$RED"
          git diff --cached "$RED" -- "$IMPORTED"
          test ! -e .github/farm/unc-share-setup.ps1
          test -f "$RUNNER_TEMP/unc-share-setup.ps1"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Build the boundary helper and the engine library tests at the red commit
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cargo test -p crazyagent --lib --locked --no-run
          test -f target/debug/crazyagent-win-boundary.exe
      - name: Open the shares and the device entries
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\unc-share-setup.ps1"'
      - name: Both share rows fail on a server session, the list row names new files
        timeout-minutes: 60
        run: |
          set +e -uo pipefail
          rc=0
          red() {
            local row="$1" want="$2" out="$RUNNER_TEMP/red-$3.txt"
            cargo test -p crazyagent --lib --locked -- --ignored --exact "$row" > "$out" 2>&1
            local code=$?
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -8
            grep -A4 "panicked at" "$out" | cut -c1-1200 | head -12
            [ "$code" -ne 0 ] || { echo "RED ROW PASSED: $row"; rc=1; return; }
            grep -q "^test $row \.\.\. FAILED" "$out" || { echo "RED ROW DID NOT RUN: $row"; rc=1; return; }
            grep -qF -- "$want" "$out" || { echo "RED ROW FAILED FOR ANOTHER REASON: $row (wanted a line holding: $want)"; rc=1; }
          }
          guard() {
            local row="$1" out="$RUNNER_TEMP/guard-$2.txt"
            cargo test -p crazyagent --lib --locked -- --ignored --exact "$row" > "$out" 2>&1
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -6
            grep -A4 "panicked at" "$out" | cut -c1-600 | head -10
            grep -q "^test $row \.\.\. ok" "$out" || { echo "GUARD ROW NOT OK AT RED: $row"; rc=1; }
          }
          red "$PUBLISH_SHARE" 'a server session after contained publish steps: ' publish-share
          red "$LIST_SHARE" 'a server session after a contained list: ' list-share
          guard "$LIST_NAMES" list-names
          [ "$rc" -eq 0 ] && echo "red ok: both share rows failed on a server session, the list guard passed"
          exit "$rc"

  win-tip:
    name: UNC owner git routing ${{ matrix.runner }} at the tip, clippy lib and tests on windows-2022, every owner git, list and publish row with the PATH-git guard, then the four contained rows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep the share setup, then put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD | tr '\n' ' ' | sed 's/ $//')" = "$FARM_FILES"
          cp .github/farm/unc-share-setup.ps1 "$RUNNER_TEMP/unc-share-setup.ps1"
          git rm -q -- .github/farm/unc-share-setup.ps1
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain with clippy
        id: toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Clippy crazyagent lib
        if: matrix.runner == 'windows-2022'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the boundary helper and the engine library tests
        id: lib
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cargo test -p crazyagent --lib --locked --no-run
          test -f target/debug/crazyagent-win-boundary.exe
      - name: Every owner git, project_files, publish and intake row at the tip, before the device entries
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- sandbox::windows::owner_git:: project_files:: github::publish:: tui::screens::intake:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | cut -c1-300 | head -40
          grep -A4 "panicked at" "$RUNNER_TEMP/tip.txt" | cut -c1-600 | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "owner_git|windows_tests|intake::tests::the_publish" "$RUNNER_TEMP/tip-rows.txt"
          grep -A6 "panicked at" "$RUNNER_TEMP/tip.txt" | grep -F "the install folder" | cut -c1-600
          for row in "$PATH_GIT" "$MARKERS" "$HOLDS" "$ROOTS" "$PROFILE" "$REFUSE" "$WRAP" "$WRAP_REFUSES" "$JUNCTION_LIST" "$NESTED_LIST" "$ORDER" "$OUTSIDE" "$EVERY_STEP" "$NESTED" "$STILL_COMMITS"; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"
      - name: Open the shares and the device entries
        id: shares
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\unc-share-setup.ps1"'
      - name: The four contained rows, one cargo call each
        if: ${{ !cancelled() && steps.shares.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e -uo pipefail
          rc=0
          for row in "$PUBLISH_SHARE" "$PUBLISH_COMMITS" "$LIST_SHARE" "$LIST_NAMES"; do
            out="$RUNNER_TEMP/contained-${row##*::}.txt"
            cargo test -p crazyagent --lib --locked -- --ignored --exact "$row" > "$out" 2>&1
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -6
            grep -A4 "panicked at" "$out" | cut -c1-1200 | head -12
            grep -q "^test $row \.\.\. ok" "$out" || { echo "CONTAINED ROW NOT OK: $row"; rc=1; }
          done
          [ "$rc" -eq 0 ] && echo "tip ok: no contained publish step or list opened a share, the contained commit and list kept their files"
          exit "$rc"
