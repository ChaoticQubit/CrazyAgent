name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  winlaunch-macos:
    name: W-INUSE-LAUNCH Mac compile proof and rows on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Refuse a probe whose parent is not the ticket tip
        env:
          TIP: de38b5ab8a
        run: |
          set -euo pipefail
          parent=$(git rev-parse --short=10 HEAD^)
          echo "CASE head $(git rev-parse HEAD) parent $parent"
          [ "$parent" = "$TIP" ] || { echo "::error::HEAD^ is $parent, not the tip $TIP"; exit 1; }
          changed=$(git diff --name-only HEAD^ HEAD)
          [ "$changed" = ".github/workflows/tests.yml" ] || { echo "::error::the probe commit changes more than the workflow: $changed"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Give the desktop crate the frontend placeholder its context needs
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          printf '<!doctype html>\n' > apps/desktop/dist/index.html
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Clippy each touched crate with warnings denied
        run: |
          set +e
          set -u
          failed=0
          for target in "crazyagent --lib --tests" "crazyagent-desktop --lib --tests"; do
            read -r -a words <<< "$target"
            crate="${words[0]}"
            started=$(date +%s)
            cargo clippy --locked --keep-going -p "$crate" "${words[@]:1}" -- -D warnings > "clippy-$crate.log" 2>&1
            rc=$?
            cat "clippy-$crate.log"
            built=$(grep -c -E "^ *(Checking|Compiling) $crate v" "clippy-$crate.log")
            echo "CASE clippy $crate rc=$rc built=$built seconds=$(( $(date +%s) - started ))"
            if [ "$rc" != 0 ]; then failed=1; fi
            if [ "$built" -lt 1 ]; then echo "::error::clippy never checked $crate"; failed=1; fi
          done
          exit "$failed"
      - name: Run the rows this entry names
        if: ${{ !cancelled() }}
        env:
          ROWS: |
            crazyagent|--lib|harnesses::update::state::in_use_tests::
            crazyagent|--lib|tui::screens::settings_harnesses::words::
            crazyagent|--lib|tui::screens::computer_words_tests::
            crazyagent-desktop|--lib|bridge::harnesses::
          EXPECT: green
        run: |
          set +e
          set -uo pipefail
          failed=0
          number=0
          while IFS='|' read -r crate target filter; do
            [ -n "$crate" ] || continue
            number=$((number + 1))
            log="row-$number.log"
            started=$(date +%s)
            read -r -a kind <<< "$target"
            only=()
            if [ -n "$filter" ]; then only=("$filter"); fi
            cargo test --locked -p "$crate" "${kind[@]}" -- "${only[@]}" > "$log" 2>&1
            rc=$?
            ran=$(grep -E '^running [0-9]+ tests?$' "$log" | tail -1 || true)
            echo "ROW $crate $target $filter rc=$rc $ran seconds=$(( $(date +%s) - started ))"
            grep -E '^test .* \.\.\. (ok|FAILED|ignored)' "$log" | sed 's/^/CASE /' || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -120 || true
            if [ "$rc" != 0 ] && ! grep -q -E '^running [0-9]+ tests?$' "$log"; then
              tail -40 "$log"
            fi
            [ "$rc" = 0 ] || failed=1
            count=$(echo "$ran" | grep -o -E '[0-9]+' | head -1)
            if [ "${count:-0}" -lt 1 ]; then
              echo "ROW-EMPTY $crate $target $filter ran no test"
              failed=1
            fi
          done <<< "$ROWS"
          if [ "$EXPECT" = green ] && [ "$failed" != 0 ]; then
            exit 1
          fi
