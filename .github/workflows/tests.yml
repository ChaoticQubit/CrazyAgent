name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  feedfix-macos:
    name: native feed fixes d316f70ab rows red and green, clippy, macos-15
    runs-on: macos-15
    timeout-minutes: 300
    env:
      TIP: d316f70ab91024f42939a44d9041a2745ca9d049
      RED: 486ef01d6946df1701d40aeef92c39cdd5e25f5c
      BIND: bridge::feed::tests::an_overflowed_view_bound_again_without_close_drops_its_first_opens_events
      ATTACHED: bridge::feed::tests::the_attached_of_a_live_open_reaches_the_host_only_once_its_view_is_open
      SPACED: terminal::tmux::tests::a_spaced_window_name_never_shifts_a_pane_targets_reading
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
          bash --version | head -1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the desktop frontend the desktop crate embeds
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Write the probe helpers to the runner's temp folder
        run: |
          set +e
          set -u
          cat > "$RUNNER_TEMP/farm-probe.sh" <<'SH'
          testbin() {
            out=$(cargo test -p "$1" --lib --locked --no-run 2>&1)
            rc=$?
            echo "  $1 lib build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error\|^warning" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)"
          }
          panics() {
            python3 -I - "$1" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          for n, line in enumerate(text):
              m = re.match(r"^---- (\S+) stdout ----$", line)
              if not m:
                  continue
              print("      ---- " + m.group(1))
              for follow in text[n + 1:n + 30]:
                  if follow.startswith("---- ") or follow.strip() == "failures:":
                      break
                  print("        " + follow.rstrip()[:1500])
          PY
          }
          alone() {
            bin=$1 at=$2 row=$3 times=$4 want=$5 named=${6:-}
            fails=0 ran=0 matched=0
            for i in $(seq 1 "$times"); do
              log="$RUNNER_TEMP/alone-${row##*::}-$at-$i.log"
              "$bin" --exact "$row" > "$log" 2>&1
              if grep -qx "test $row ... FAILED" "$log"; then
                fails=$((fails + 1)) ran=$((ran + 1))
                panics "$log"
                [ -n "$named" ] && grep -qF "$named" "$log" && matched=$((matched + 1))
              elif grep -qx "test $row ... ok" "$log"; then
                ran=$((ran + 1))
              else
                echo "    no result line in run $i"
                tail -5 "$log" | cut -c1-300
              fi
            done
            echo "    ${row##*::} at $at: $fails of $times failed, $ran ran, $matched failed naming '$named' (want $want)"
          }
          modules() {
            bin=$1 at=$2 i=$3
            shift 3
            log="$RUNNER_TEMP/modules-$at-$i.log"
            "$bin" "$@" > "$log" 2>&1
            rc=$?
            echo "  $at $i rc=$rc $(grep -m1 '^test result' "$log" | cut -c1-120)"
            grep '^test .* FAILED$' "$log" | sed 's/^/    /'
            panics "$log"
          }
          lint() {
            out=$(cargo clippy -p "$1" --lib --tests --locked 2>&1)
            rc=$?
            echo "  clippy $1 lib and tests rc=$rc warnings=$(printf '%s\n' "$out" | grep -c '^warning') errors=$(printf '%s\n' "$out" | grep -c '^error')"
            printf '%s\n' "$out" | grep -A6 '^warning\|^error' | cut -c1-300 | head -60 | sed 's/^/    /'
          }
          SH
          echo written
      - name: The red commit's rows
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          set -u
          . "$RUNNER_TEMP/farm-probe.sh"
          git checkout -q -f --detach "$RED"
          echo "== RED $(git log --oneline -1 | cut -c1-100)"
          desk=$(testbin crazyagent-desktop) || exit 1
          lib=$(testbin crazyagent) || exit 1
          alone "$desk" RED "$BIND" 3 "3 of 3" "the overflowed open's late output never reaches the view bound in the wall window"
          alone "$desk" RED "$ATTACHED" 3 "3 of 3" "no event of the view reaches the host while it is still opening"
          alone "$lib" RED "$SPACED" 3 "3 of 3" "the spaced window name never shifts the paste flag"
      - name: The fix tip's rows, modules and clippy
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        run: |
          set +e
          set -u
          . "$RUNNER_TEMP/farm-probe.sh"
          git checkout -q -f --detach "$TIP"
          echo "== TIP $(git log --oneline -1 | cut -c1-100)"
          desk=$(testbin crazyagent-desktop) || exit 1
          lib=$(testbin crazyagent) || exit 1
          alone "$desk" TIP "$BIND" 5 "0 of 5"
          alone "$desk" TIP "$ATTACHED" 5 "0 of 5"
          alone "$lib" TIP "$SPACED" 5 "0 of 5"
          for i in 1 2; do modules "$desk" TIP-feed "$i" bridge::feed::tests::; done
          modules "$lib" TIP-tmux 1 terminal::tmux::tests::
          lint crazyagent-desktop
          lint crazyagent

  feedfix-linux:
    name: native feed fixes d316f70ab tmux row red and green, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TIP: d316f70ab91024f42939a44d9041a2745ca9d049
      RED: 486ef01d6946df1701d40aeef92c39cdd5e25f5c
      SPACED: terminal::tmux::tests::a_spaced_window_name_never_shifts_a_pane_targets_reading
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The tmux row at the red commit and the fix tip, and the tmux module at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        run: |
          set +e
          set -u
          testbin() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
            rc=$?
            echo "  lib build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error\|^warning" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)"
          }
          alone() {
            at=$1 times=$2 want=$3
            fails=0 ran=0
            for i in $(seq 1 "$times"); do
              log="$RUNNER_TEMP/alone-$at-$i.log"
              "$lib" --exact "$SPACED" > "$log" 2>&1
              if grep -qx "test $SPACED ... FAILED" "$log"; then
                fails=$((fails + 1)) ran=$((ran + 1))
                grep -m3 'panicked at\|left:\|right:\|never shifts' "$log" | cut -c1-300 | sed 's/^/      /'
              elif grep -qx "test $SPACED ... ok" "$log"; then
                ran=$((ran + 1))
              else
                echo "    no result line in run $i"
                tail -5 "$log" | cut -c1-300
              fi
            done
            echo "    ${SPACED##*::} at $at: $fails of $times failed, $ran ran (want $want)"
          }
          git checkout -q -f --detach "$RED"
          echo "== RED $(git log --oneline -1 | cut -c1-100)"
          lib=$(testbin) || exit 1
          alone RED 3 "3 of 3"
          git checkout -q -f --detach "$TIP"
          echo "== TIP $(git log --oneline -1 | cut -c1-100)"
          lib=$(testbin) || exit 1
          alone TIP 5 "0 of 5"
          log="$RUNNER_TEMP/tmux-module.log"
          "$lib" terminal::tmux::tests:: > "$log" 2>&1
          echo "  TIP-tmux rc=$? $(grep -m1 '^test result' "$log" | cut -c1-120)"
          grep '^test .* FAILED$' "$log" | sed 's/^/    /'
