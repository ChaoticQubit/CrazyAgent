name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: GRANT-ROOT-SWAP red rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='branch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = cad0ddf56d06184b1b4bbb33da8d0532949047de ] || { echo "::error::the parent is not the GRANT-ROOT-SWAP red tip cad0ddf56d"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Kernel, Landlock and bubblewrap on this runner
        run: |
          set +e
          uname -r
          cat /sys/kernel/security/lsm || true
          bwrap --version
          echo "bwrap --help lines naming bind-fd: $(bwrap --help 2>&1 | grep -c -- '-bind-fd')"
          bwrap --dev-bind / / --unshare-user true && echo "user namespaces: yes" || echo "user namespaces: no"
          true
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the Landlock helper
        timeout-minutes: 60
        run: cargo build -p crazyagent --bin crazyagent-landlock --locked
      - name: root_swap rows (expect 2 matched, both red on the secret read)
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/root-swap.log"
          cargo test -p crazyagent --test linux_sandbox --locked -- root_swap > "$log" 2>&1
          code=$?
          grep -E '^test |test result:|panicked|read the secret' "$log" || true
          tail -n 30 "$log"
          matched="$(grep -cE '^test refused_launches::root_swap::' "$log" || true)"
          failed="$(grep -cE '^test refused_launches::root_swap::.* FAILED$' "$log" || true)"
          secret="$(grep -c 'the agent read the secret through the swapped home' "$log" || true)"
          echo "root_swap rc $code matched $matched failed $failed secret-read $secret (expect 2 2 2)"
          [ "$matched" = 2 ] && [ "$failed" = 2 ] && [ "$secret" = 2 ] || exit 1
      - name: objects_link rows (expect 2 matched, linked green, swapped red on the write)
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/objects-link.log"
          cargo test -p crazyagent --lib --locked -- landing::tests::own_clone_tip::objects_link > "$log" 2>&1
          code=$?
          grep -E '^test |test result:|panicked|landed at the link' "$log" || true
          tail -n 30 "$log"
          matched="$(grep -cE '^test landing::tests::own_clone_tip::objects_link::' "$log" || true)"
          linked="$(grep -cE '^test landing::tests::own_clone_tip::objects_link::a_linked_object_store_still_takes_a_confined_steps_objects \.\.\. ok$' "$log" || true)"
          swapped="$(grep -cE '^test landing::tests::own_clone_tip::objects_link::an_object_store_swapped_for_a_link_after_the_step_is_built_takes_nothing \.\.\. FAILED$' "$log" || true)"
          landed="$(grep -c 'objects landed at the link' "$log" || true)"
          echo "objects_link rc $code matched $matched linked-ok $linked swapped-failed $swapped landed $landed (expect 2 1 1 1)"
          [ "$matched" = 2 ] && [ "$linked" = 1 ] && [ "$swapped" = 1 ] && [ "$landed" = 1 ] || exit 1
