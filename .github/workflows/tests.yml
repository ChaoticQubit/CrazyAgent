name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  TIP_FULL: ff00a43f235588a830add83d26e6c15fec32cc89
  RED_FULL: a4f8468ce06d2bcb2a02eca2f3631bf681d629d4
  PREV_FULL: 6326796567d1e5552da1dc89efe89fe7d62cb85f
  TICKET_FILES: crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/engine/owner/transport/terminal/finish_tests.rs
  TRANSPORT: crates/crazyagent/src/engine/owner/transport/terminal.rs
  FINISH_ROW: "engine::owner::transport::terminal::finish_tests::a_paste_stalled_when_the_grant_ends_still_ends_the_view"
  OWNER_ROWS: "engine::owner::transport::terminal::windows_tests::"
  UNIX_ROWS: "engine::owner::transport::terminal::tests::"
  HELD_ROW: "engine::owner::transport::terminal::tests::a_prompt_held_as_its_view_ends_is_still_recorded_as_heard"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: WINTERM-PASTE-FINISH ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            leg: win-tip
            cache: Windows
          - os: windows-2022
            leg: win-red
            cache: Windows
          - os: ubuntu-22.04
            leg: linux
            cache: linux
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -4 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$PREV_FULL" ] || { echo "::error::HEAD~3 is not the win-owner-terminal tip"; exit 1; }
          changed="$(git diff --name-only "$PREV_FULL" HEAD^ | sort | tr '\n' ' ')"
          read -ra files <<< "$TICKET_FILES"
          wanted="$(printf '%s\n' "${files[@]}" | sort | tr '\n' ' ')"
          [ "$changed" = "$wanted" ] || { echo "::error::the ticket range is not the two ticket files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install the pinned tmux on Linux for the unix owner terminal rows
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache, so cargo rebuilds their crate
        run: |
          set -euo pipefail
          read -ra files <<< "$TICKET_FILES"
          sleep 2
          touch "${files[@]}"
          ls -l "${files[@]}"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt check of the two ticket files (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        run: |
          set +e
          read -ra files <<< "$TICKET_FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent --lib --tests with warnings denied on this system (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg != 'win-red' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings crazyagent checked $app"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$app" -ge 1 ] || exit 1
      - name: The finish row at tip three times by exact name (expect passed 1 each, 3 of 3)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg != 'win-red' }}
        timeout-minutes: 90
        run: |
          set +e
          ok=0
          for round in 1 2 3; do
            log="$RUNNER_TEMP/finish-$round.log"
            cargo test -p crazyagent --lib --locked -- --exact "$FINISH_ROW" --nocapture > "$log" 2>&1
            code=$?
            built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
            passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
            grep -E '^test .*(FAILED|ok)$|finish row:|panicked|left:|right:' "$log" | head -n 10 || true
            grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40; tail -n 20 "$log"; }
            echo "finish round $round rc $code passed $passed built $built"
            if [ "$code" = 0 ] && [ "$passed" = 1 ]; then ok=$((ok + 1)); fi
          done
          echo "finish rounds passed $ok of 3"
          [ "$ok" = 3 ] || exit 1
      - name: Windows owner terminal rows at tip (expect listed 9, passed 9)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'win-tip' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/owner-rows.log"
          cargo test -p crazyagent --lib --locked -- "$OWNER_ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --lib --locked -- "$OWNER_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:' "$log" | head -n 60 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "owner rows rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" = 9 ] && [ "$passed" = 9 ] && [ "$failed" = 0 ] || exit 1
      - name: Unix owner terminal rows at tip, the held-prompt row among them (expect listed > 0, failed 0, held row ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/unix-rows.log"
          cargo test -p crazyagent --lib --locked -- "$UNIX_ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --lib --locked -- "$UNIX_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*FAILED$|test result:|panicked' "$log" | head -n 40 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          held="$(grep -cxF "test $HELD_ROW ... ok" "$log" || true)"
          echo "unix rows rc $code listed $listed passed $passed failed $failed held-row-ok $held"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "$failed" = 0 ] && [ "$held" = 1 ] || exit 1
      - name: Red, the finish row over the red commit's terminal.rs, without the bounded finish (expect failed 1, the finish row)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg != 'win-tip' }}
        timeout-minutes: 120
        run: |
          set +e
          git show "$RED_FULL:$TRANSPORT" > "$TRANSPORT"
          git diff HEAD^ -- "$TRANSPORT" | grep -E '^[-+]' | head -n 40
          sleep 2
          touch "$TRANSPORT"
          log="$RUNNER_TEMP/red.log"
          cargo test -p crazyagent --lib --locked -- --exact "$FINISH_ROW" --nocapture > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|finish row:|panicked at|left:|right:' "$log" | head -n 20 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40; tail -n 20 "$log"; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          named="$(grep -cxF "test $FINISH_ROW ... FAILED" "$log" || true)"
          echo "red rc $code failed $failed named $named built $built"
          git checkout HEAD^ -- "$TRANSPORT"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 1 ] && [ "$named" = 1 ] && [ "$built" -ge 1 ] || exit 1
