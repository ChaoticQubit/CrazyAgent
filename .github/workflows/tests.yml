name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "26.12.1"
  TIP_FULL: 04e156b13db19834e7b1e2d496e9b1468aa9ad42
  RED_FULL: 625aa5a8278e9873a1b52b68a5096834e45ac38d
  BASE_FULL: fb1c9b29ad2a1e86f6e60865119514ea8860258a
  FIX_FILES: "crates/crazyagent/src/tui/screens/intake.rs crates/crazyagent/src/tui/screens/mod.rs apps/desktop/src/api-intake.ts"
  NEW_ROW: "tui::screens::computer_words_tests::intake_warnings_name_the_computer_the_build_runs_on"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: TUI-THIS-MAC ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
            want: "tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::account_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::plugin_and_profile_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::intake_warnings_name_the_computer_the_build_runs_on tui::screens::settings_accounts::tests::a_recorded_sign_in_failure_reads_the_app_s_sentence_for_the_harness_it_used tui::screens::settings_accounts::tests::a_recorded_code_wins_over_the_phase_line_and_an_unconfirmed_sign_in_says_how_it_clears tui::screens::new_project_tests::a_harness_the_engine_lists_as_cant_run_is_never_ready_the_default_or_picked tui::screens::settings_harnesses::tests::every_update_sentence_is_the_desktop_sentence_and_no_two_are_alike"
          - os: windows-2022
            leg: win
            cache: Windows
            want: "tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::account_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::plugin_and_profile_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::intake_warnings_name_the_computer_the_build_runs_on tui::screens::settings_accounts::tests::a_recorded_sign_in_failure_reads_the_app_s_sentence_for_the_harness_it_used tui::screens::settings_accounts::tests::a_recorded_code_wins_over_the_phase_line_and_an_unconfirmed_sign_in_says_how_it_clears"
          - os: macos-15
            leg: mac
            cache: macOS
            want: "tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::account_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::plugin_and_profile_sentences_name_the_computer_the_build_runs_on tui::screens::computer_words_tests::intake_warnings_name_the_computer_the_build_runs_on tui::screens::settings_accounts::tests::a_recorded_sign_in_failure_reads_the_app_s_sentence_for_the_harness_it_used tui::screens::settings_accounts::tests::a_recorded_code_wins_over_the_phase_line_and_an_unconfirmed_sign_in_says_how_it_clears tui::screens::new_project_tests::a_harness_the_engine_lists_as_cant_run_is_never_ready_the_default_or_picked tui::screens::settings_harnesses::tests::every_update_sentence_is_the_desktop_sentence_and_no_two_are_alike"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip (the fix commit)"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the ON-THIS-MAC merge fb1c9b29ad"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ matrix.os != 'windows-2022' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: caps and sleeps ratchets at the base and the tip (expect sleeps rc 0 both; no tip caps problem missing at the base, none naming a ticket file)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          ct=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          st=$?
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL" > /dev/null 2>&1
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs) > "$RUNNER_TEMP/caps-base.txt" 2>&1
          cb=$?
          (cd "$RUNNER_TEMP/base" && node scripts/quality/sleeps.mjs) > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          sb=$?
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-tip.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-tip-files.txt" || true
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-base.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-base-files.txt" || true
          git diff --name-only "$BASE_FULL" HEAD^ | sort > "$RUNNER_TEMP/ticket-files.txt"
          new="$(comm -23 <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-tip.txt" | sort) <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-base.txt" | sort) | grep -c . || true)"
          ticket="$(comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" | grep -c . || true)"
          tail -n 1 "$RUNNER_TEMP/caps-tip.txt"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt"
          tail -n 1 "$RUNNER_TEMP/sleeps-tip.txt"
          comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" || true
          echo "caps rc tip $ct base $cb problems tip $(grep -c . "$RUNNER_TEMP/caps-tip-files.txt") base $(grep -c . "$RUNNER_TEMP/caps-base-files.txt") new-at-tip $new on-ticket-files $ticket sleeps rc tip $st base $sb"
          [ "$st" = 0 ] && [ "$sb" = 0 ] && [ "$ticket" = 0 ] && [ "$new" = 0 ] || exit 1
      - name: rustfmt of crazyagent (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent lib with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'macos-15' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent lib rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: clippy crazyagent lib test target with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'macos-15' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-libtest.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent tests rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: desktop node, npm ci, tsc, api-intake rows at the tip and the e2e source words (expect rc 0, fail 0, pass 16; e2e names this Mac once, the Mac never)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'windows-2022' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log" || true
          (cd apps/desktop && npm run --silent typecheck) > "$RUNNER_TEMP/tsc.log" 2>&1
          tc=$?
          grep -E 'error TS' "$RUNNER_TEMP/tsc.log" | head -n 10 || true
          (cd apps/desktop && node --test --test-reporter=tap test/api-intake.test.mjs) > "$RUNNER_TEMP/ai.log" 2>&1
          ai=$?
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/ai.log" || true
          fail="$(grep -E '^# fail ' "$RUNNER_TEMP/ai.log" | awk '{print $3}' || true)"
          pass="$(grep -E '^# pass ' "$RUNNER_TEMP/ai.log" | awk '{print $3}' || true)"
          e2e_this="$(grep -cF 'If this Mac sleeps' apps/desktop/test/native/add-folder-anyway.e2e.mjs || true)"
          e2e_the="$(grep -cF 'the Mac sleeps' apps/desktop/test/native/add-folder-anyway.e2e.mjs || true)"
          echo "node npm rc $ci tsc rc $tc api-intake rc $ai pass ${pass:-none} fail ${fail:-none} e2e this-Mac $e2e_this the-Mac $e2e_the"
          [ "$ci" = 0 ] && [ "$tc" = 0 ] && [ "$ai" = 0 ] && [ "$fail" = 0 ] && [ "$pass" = 16 ] && [ "$e2e_this" = 1 ] && [ "$e2e_the" = 0 ] || exit 1
      - name: desktop node red, the base api-intake.ts under the tip rows (expect exactly row 12, the copy warnings, not ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'windows-2022' }}
        timeout-minutes: 10
        run: |
          set +e
          git checkout "$RED_FULL" -- apps/desktop/src/api-intake.ts
          (cd apps/desktop && node --test --test-reporter=tap test/api-intake.test.mjs) > "$RUNNER_TEMP/ai-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/api-intake.ts
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/ai-red.log" || true
          bad="$(grep -cE '^not ok ' "$RUNNER_TEMP/ai-red.log" || true)"
          named="$(grep -cE '^not ok 12 - each Move anyway and Copy anyway warning reads exactly as the owner asked$' "$RUNNER_TEMP/ai-red.log" || true)"
          echo "node red rc $red not ok $bad named $named"
          [ "$red" != 0 ] && [ "$bad" = 1 ] && [ "$named" = 1 ] || exit 1
      - name: crazyagent rows at the tip by want list (computer words + accounts readers on every leg, new project + harnesses readers on Unix; expect each wanted row ok, failed 0, crate gate)
        id: tiprows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        env:
          WANT: ${{ matrix.want }}
        run: |
          set +e
          log="$RUNNER_TEMP/rows-tip.log"
          read -r -a want <<< "$WANT"
          cargo test -p crazyagent --lib --locked -- "${want[@]}" > "$log" 2>&1
          c1=$?
          grep -E '^test .* (ok|FAILED)$|panicked at' "$log" | head -n 40 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.}( - should panic)? \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "tip rows rc $c1 failed $failed wanted ${#want[@]} ok $ok gate crazyagent $g1"
          [ "$c1" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "$g1" -ge 1 ] || exit 1
      - name: Red, the base intake.rs and mod.rs under the tip rows (expect exactly the new row FAILED on every leg, the other wanted rows ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        env:
          WANT: ${{ matrix.want }}
        run: |
          set +e
          git checkout "$RED_FULL" -- crates/crazyagent/src/tui/screens/intake.rs crates/crazyagent/src/tui/screens/mod.rs
          git diff --cached --stat HEAD^ | tail -n 1
          sleep 2
          touch crates/crazyagent/src/tui/screens/intake.rs crates/crazyagent/src/tui/screens/mod.rs
          log="$RUNNER_TEMP/rows-red.log"
          read -r -a want <<< "$WANT"
          cargo test -p crazyagent --lib --locked -- "${want[@]}" > "$log" 2>&1
          c1=$?
          grep -E '^test .* (ok|FAILED)$|^error(\[|:)' "$log" | head -n 20 || true
          bad="$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)"
          new="$(grep -cE "^test ${NEW_ROW} \.\.\. FAILED$" "$log" || true)"
          ok="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "red rows rc $c1 failed-rows $bad new-row-FAILED $new ok $ok of $(( ${#want[@]} - 1 )) gate crazyagent $g1"
          [ "$c1" != 0 ] && [ "$bad" = 1 ] && [ "$new" = 1 ] && [ "$ok" = "$(( ${#want[@]} - 1 ))" ] && [ "$g1" -ge 1 ] || exit 1
