js test/terminal-queries.test.mjs test/terminal-renderer-policy.test.mjs test/terminal-renderer.test.mjs test/terminal-scroll.test.mjs test/terminal-wall.test.mjs test/terminal-wheel.test.mjs test/theme-help-words.test.mjs test/tokens.test.mjs test/updates-reachable.test.mjs test/user-menu.test.mjs test/waiting-changes.test.mjs test/wall-reads.test.mjs test/window-scroll.test.mjs test/native/bridge-routes.test.mjs test/native/trial-kit.test.mjs; do
            tap="$RUNNER_TEMP/$(basename "$f").tap"
            node --test --test-reporter=tap "$f" > "$tap" 2>&1
            code=$?
            echo "$f on ubuntu-22.04: rc $code"
            grep -E '^# (tests|pass|fail)' "$tap" || true
            { grep -E '^[[:space:]]*not ok' "$tap" || true; } | sed -E 's/^[[:space:]]*not ok [0-9]+ - //' | awk -v f="$f" '!s[$0]++{print f "\t" $0}' >> "$RUNNER_TEMP/node.red"
            if [ "$code" -ne 0 ]; then printf '%s\n' "$f" >> "$RUNNER_TEMP/node.redfiles"; red=1; grep -E -A 12 '^[[:space:]]*not ok' "$tap" | head -n 60; fi
            grep -qE '^# pass [1-9]' "$tap" || { echo "$f: no row passed"; printf '%s\n' "$f" >> "$RUNNER_TEMP/node.redfiles"; red=1; }
