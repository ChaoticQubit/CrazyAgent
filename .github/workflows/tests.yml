        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Durable narrowing r2 late-refusal row once at 68619fbf4 on ubuntu-22.04
        timeout-minutes: 70
        run: |
          export CARGO_BUILD_JOBS=2
          cp .github/farm/r2.sh "$RUNNER_TEMP/r2.sh"
          export OVERLAY=07afaedf0:crates/crazyagent/src/engine/owner/transport/native_auth_restart_tests.rs
          bash "$RUNNER_TEMP/r2.sh" probe probe 68619fbf4 \
            engine::owner::transport::native_auth_restart_tests::a_sign_out_refused_after_the_owner_was_told_pending_keeps_its_intent_for_the_next_open
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-narrowing-probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
          retention-days: 14
  green-d:
    name: Durable narrowing r2 the two K rows green at 07afaedf0 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
