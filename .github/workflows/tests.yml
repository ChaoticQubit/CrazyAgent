name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: fc85d33786129e5245513b9e558d4d0c58fe2117
  BASE: 54e9bd33ff4827e9b1c8a5181dcdfea7a481cb46

defaults:
  run:
    shell: bash

jobs:
  owner-timeout-linux:
    name: owner-timeout windows fix fc85d3378 clippy lib and lib tests, ubuntu-22.04, pinned toolchain (rerun of 44525731179's Linux leg)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TIP: fc85d33786129e5245513b9e558d4d0c58fe2117
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy on the tip lib, then its lib tests
        timeout-minutes: 90
        run: |
          set +e
          set -u
          bad=0
          echo "toolchain $(rustc -V)"
          for targets in "--lib" "--lib --tests"; do
            out=$(cargo clippy -p crazyagent $targets --locked -- -D warnings 2>&1)
            rc=$?
            echo "clippy $targets rc=$rc"
            printf '%s\n' "$out" | grep -E -A6 '^(error|warning)' | head -60 | cut -c1-300
            [ "$rc" -eq 0 ] || bad=1
          done
          exit "$bad"


