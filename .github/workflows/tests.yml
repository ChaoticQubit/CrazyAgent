name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  TIP_FULL: 709ee9a893ebecf38721239bbcd6e522746b0e58
  PREV_FULL: c5622650ff0c18c44a7c11e78c8fd1ce980e8eae

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: MACOS-WORDS-A5-A6-R1 node ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
          - os: macos-15
            leg: mac
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -2 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip 709ee9a893"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$PREV_FULL" ] || { echo "::error::HEAD~2 is not c5622650ff"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm ci, navigator.platform, tsc, then move-home rows at the tip (expect each rc 0, fail 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log" || true
          (cd apps/desktop && node -e 'console.log("navigator.platform " + navigator.platform)') || true
          (cd apps/desktop && npm run --silent typecheck) > "$RUNNER_TEMP/tsc.log" 2>&1
          tc=$?
          grep -E 'error TS' "$RUNNER_TEMP/tsc.log" | head -n 10 || true
          (cd apps/desktop && node --test --test-reporter=tap test/move-home.test.mjs) > "$RUNNER_TEMP/mh.log" 2>&1
          mh=$?
          (cd apps/desktop && node --test --test-reporter=tap test/move-home-words.test.mjs) > "$RUNNER_TEMP/mhw.log" 2>&1
          mhw=$?
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/mh.log" || true
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/mhw.log" || true
          f1="$(grep -E '^# fail ' "$RUNNER_TEMP/mh.log" | awk '{print $3}' || true)"
          f2="$(grep -E '^# fail ' "$RUNNER_TEMP/mhw.log" | awk '{print $3}' || true)"
          echo "tip npm rc $ci tsc rc $tc move-home rc $mh fail ${f1:-none} move-home-words rc $mhw fail ${f2:-none}"
          [ "$ci" = 0 ] && [ "$tc" = 0 ] && [ "$mh" = 0 ] && [ "$mhw" = 0 ] && [ "$f1" = 0 ] && [ "$f2" = 0 ] || exit 1
      - name: Red on macOS, c5622650ff's move-home.test.mjs under the tip source (expect exactly the 2 unread-line rows not ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'macos-15' }}
        timeout-minutes: 15
        run: |
          set +e
          git checkout "$PREV_FULL" -- apps/desktop/test/move-home.test.mjs
          (cd apps/desktop && node --test --test-reporter=tap test/move-home.test.mjs) > "$RUNNER_TEMP/mh-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/test/move-home.test.mjs
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/mh-red.log" || true
          bad="$(grep -cE '^not ok ' "$RUNNER_TEMP/mh-red.log" || true)"
          named="$(grep -cE '^not ok [0-9]+ - (\\#383 code F1 r2|V243-MOVE-SIZE-PROBLEM-DESKTOP)' "$RUNNER_TEMP/mh-red.log" || true)"
          echo "red rc $red not ok $bad named $named"
          [ "$red" != 0 ] && [ "$bad" = 2 ] && [ "$named" = 2 ] || exit 1
