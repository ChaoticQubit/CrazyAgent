name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 6cd1e4ff896e30f015add0cce65d24ba36133553
  RED_FULL: 07eb253eb17065b899cb4e3cc96683f4e45aab07

defaults:
  run:
    shell: bash

jobs:
  red:
    name: REDACT-END-FIRST-OVERHIDE red at 07eb253eb1 on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the red sha
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git merge-base --is-ancestor "$RED_FULL" "$TIP_FULL" || { echo "::error::the red commit is not below the tip"; exit 1; }
          git checkout -q --detach "$RED_FULL"
          [ "$(git rev-parse HEAD)" = "$RED_FULL" ] || { echo "::error::HEAD is not the red sha"; exit 1; }
          git log -1 --format='red %H %s'
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the engine lib tests at the red sha
        timeout-minutes: 90
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1 || { tail -n 40 "$log"; exit 1; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "BUILT crazyagent $built"
          [ "$built" -gt 0 ] || { echo "::error::crazyagent was not compiled, the build was read as fresh"; exit 1; }
          tail -n 3 "$log"
      - name: Red rows
        timeout-minutes: 20
        run: |
          set +e
          names="project_setup::research_logs::tests::a_separator_starting_like_an_end_line_keeps_the_lines_above_it project_setup::research_logs::tests::a_key_end_after_a_separator_still_hides_the_lines_above_it"
          want="$(echo "$names" | tr ' ' '\n' | sort)"
          log="$RUNNER_TEMP/rows.log"
          read -r -a filters <<< "$names"
          cargo test -p crazyagent --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
          code=$?
          grep -E '^test |test result:|panicked at|^thread ' "$log" || true
          ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          got="$(grep -E '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          echo "ROWS crazyagent FAILED rc $code: $(printf '%s' "$got" | tr '\n' ' ')"
          [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::rows differ; want FAILED: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; exit 1; }
