name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Hidden git ${{ matrix.mode }} ${{ matrix.runner }} (tip 009dbe9d4, red 9013e0597)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            mode: rows
            minutes: 200
          - runner: windows-2025
            mode: rows
            minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm scripts outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet 009dbe9d44677aa601195c2ca7d2f59f1542ae24 -- crates apps
          cp .github/farm/v244-win-hidden-git-2-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Red at the red commit, green at the tip, every row naming hidden, and none_tracked timed quiet and under a CPU load step
        if: matrix.mode == 'rows'
        run: bash "$RUNNER_TEMP/rows.sh"

  linux:
    name: Hidden git rows and clippy ubuntu-22.04 (tip 009dbe9d4, red 9013e0597)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm script outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet 009dbe9d44677aa601195c2ca7d2f59f1542ae24 -- crates apps
          cp .github/farm/v244-win-hidden-git-2-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Red at the red commit, green at the tip, every row naming hidden, and none_tracked timed quiet and under a CPU load step
        run: bash "$RUNNER_TEMP/rows.sh"
      - name: Clippy at the tip, one target set per call
        if: always()
        run: |
          set -uo pipefail
          git checkout -q -f --detach 009dbe9d44677aa601195c2ca7d2f59f1542ae24
          failed=0
          printf '| Linux clippy at 009dbe9d4 | exit |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"

  clippy:
    name: Hidden git clippy windows-2022 (tip 009dbe9d4)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The crates are the tip
        run: git diff --quiet 009dbe9d44677aa601195c2ca7d2f59f1542ae24 -- crates apps
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy, one target set per call
        run: |
          set -uo pipefail
          failed=0
          printf '| Windows clippy at 009dbe9d4 | exit |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"
