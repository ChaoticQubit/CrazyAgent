name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 42a4fe934f8a93415d18779523b328399bc57d43
  RED_CASE: be7db0556644272088da905f7d07eed0bdd8ecc2
  RED_OFFER: 627a70780bc93d834d289a90afc206d80b2f7041
  BASE: e904fd105b8583354e5cbea5571c1dbbd268f35b
  ANSWER_ROW: sandbox::hidden_paths::tests::an_answer_line_cut_short_or_in_no_asked_folder_is_unchecked
  CASE_ROW: sandbox::hidden_paths::tests::a_folder_the_index_tracks_under_another_case_is_found_and_a_pattern_name_is_literal
  ASCII_ROW: sandbox::hidden_paths::tests::a_non_ascii_folder_name_in_a_git_project_is_unchecked_where_names_fold_case
  TUI_NAME_ROW: tui::screens::project_tests::a_hidden_folder_refused_for_its_non_english_name_is_told_why
  TUI_OFFER_ROW: tui::screens::project_tests::settings_offer_hidden_folders_only_where_the_boundary_holds_them_and_a_saved_list_clears
  ENGINE_ROW: project_setup::engine_tests::hidden_folders_are_refused_where_the_boundary_cannot_hold_them_and_a_list_still_clears

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Hidden git r2 rows ${{ matrix.runner }} (tip 42a4fe934, red be7db0556)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm script outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-win-hidden-git-3-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build at the case red commit
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" build "$RED_CASE"
      - name: Red at the case red commit (answer, case and non-ASCII rows)
        run: bash "$RUNNER_TEMP/rows.sh" red "$RED_CASE" "$ANSWER_ROW" "$CASE_ROW" "$ASCII_ROW"
      - name: Build at the tip
        if: always()
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" build "$TIP"
      - name: Green at the tip, and every lib row naming hidden
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" tip "$TIP"
      - name: Any row naming hidden red at the tip, again at the base
        if: always()
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" base "$BASE"

  linux:
    name: Hidden git r2 rows and clippy ubuntu-22.04 (tip 42a4fe934, reds be7db0556 627a70780)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm script outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-win-hidden-git-3-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build at the case red commit
        timeout-minutes: 60
        run: bash "$RUNNER_TEMP/rows.sh" build "$RED_CASE"
      - name: Red at the case red commit (answer, case and TUI name rows)
        run: bash "$RUNNER_TEMP/rows.sh" red "$RED_CASE" "$ANSWER_ROW" "$CASE_ROW" "$TUI_NAME_ROW"
      - name: Build at the offer red commit
        if: always()
        timeout-minutes: 60
        run: bash "$RUNNER_TEMP/rows.sh" build "$RED_OFFER"
      - name: Red at the offer red commit (engine and TUI offer rows)
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" red "$RED_OFFER" "$ENGINE_ROW" "$TUI_OFFER_ROW"
      - name: Build at the tip
        if: always()
        timeout-minutes: 60
        run: bash "$RUNNER_TEMP/rows.sh" build "$TIP"
      - name: Green at the tip, and every lib row naming hidden
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" tip "$TIP"
      - name: Any row naming hidden red at the tip, again at the base
        if: always()
        timeout-minutes: 60
        run: bash "$RUNNER_TEMP/rows.sh" base "$BASE"
      - name: Clippy at the tip, one target set per call
        if: always()
        timeout-minutes: 60
        run: |
          set -uo pipefail
          git checkout -q -f --detach "$TIP"
          failed=0
          printf '| Linux clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"

  clippy:
    name: Hidden git r2 clippy windows-2022 (tip 42a4fe934)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The crates are the tip
        run: git diff --quiet "$TIP" -- crates apps
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy, one target set per call
        timeout-minutes: 90
        run: |
          set -uo pipefail
          failed=0
          printf '| Windows clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"

  macos:
    name: Hidden git r2 rows and clippy macos-15 (tip 42a4fe934, red be7db0556)
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep the farm script outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-win-hidden-git-3-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install Rust toolchain, with no debug info for the runner's disk
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build at the case red commit
        timeout-minutes: 140
        run: bash "$RUNNER_TEMP/rows.sh" build "$RED_CASE"
      - name: Red at the case red commit (answer, case, non-ASCII and TUI name rows)
        run: bash "$RUNNER_TEMP/rows.sh" red "$RED_CASE" "$ANSWER_ROW" "$CASE_ROW" "$ASCII_ROW" "$TUI_NAME_ROW"
      - name: Build at the tip
        if: always()
        timeout-minutes: 140
        run: bash "$RUNNER_TEMP/rows.sh" build "$TIP"
      - name: Green at the tip, and every lib row naming hidden
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" tip "$TIP"
      - name: Any row naming hidden red at the tip, again at the base
        if: always()
        timeout-minutes: 140
        run: bash "$RUNNER_TEMP/rows.sh" base "$BASE"
      - name: Clippy at the tip, one target set per call
        if: always()
        timeout-minutes: 90
        run: |
          set -uo pipefail
          git checkout -q -f --detach "$TIP"
          failed=0
          printf '| macOS clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"
