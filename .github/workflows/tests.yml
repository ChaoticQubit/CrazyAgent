name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    windows-rust-1 windows-rust-2 windows-rust-3

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-2022
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Clippy on the Windows boundary crate
        continue-on-error: true
        run: |
          set -euo pipefail
          rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy-win-sandbox.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-clippy-windows
          path: ${{ runner.temp }}/clippy-win-sandbox.txt
          if-no-files-found: warn
          retention-days: 14

  windows-container-probe:
    name: Container-flake red on ${{ matrix.runner }} replica ${{ matrix.replica }}
    needs: build-windows
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        replica: [1]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: farm-archive-windows
          path: ${{ runner.temp }}/archive
      - name: Extract the archive and find the sandbox test binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'archive\farm-windows.tar.zst'
          $filter = 'binary_id(crazyagent) | binary_id(crazyagent-win-sandbox) | binary_id(crazyagent-win-sandbox::boundary)'
          $json = cargo nextest list --archive-file $archive --workspace-remap $env:GITHUB_WORKSPACE --extract-to $env:GITHUB_WORKSPACE --extract-overwrite --message-format json -E $filter
          if ($LASTEXITCODE -ne 0) { throw "nextest list failed with $LASTEXITCODE" }
          $suites = ($json | Out-String | ConvertFrom-Json).'rust-suites'
          foreach ($pair in @(@('ENGINE', 'crazyagent'), @('UNIT', 'crazyagent-win-sandbox'), @('BOUNDARY', 'crazyagent-win-sandbox::boundary'))) {
            $suite = $suites.($pair[1])
            if (-not $suite -or -not (Test-Path -LiteralPath $suite.'binary-path')) { throw "no test binary for $($pair[1])" }
            $cwd = if ($suite.cwd) { $suite.cwd } else { $env:GITHUB_WORKSPACE }
            "SBX_$($pair[0])_EXE=$($suite.'binary-path')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "SBX_$($pair[0])_CWD=$cwd" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "$($pair[1]) => $($suite.'binary-path') in $cwd"
          }
          $deps = Split-Path -Parent $suites.'crazyagent'.'binary-path'
          $helper = Join-Path (Split-Path -Parent $deps) 'crazyagent-win-boundary.exe'
          if (Test-Path -LiteralPath $helper) {
            Copy-Item -LiteralPath $helper -Destination $deps -Force
            Write-Host "boundary helper copied beside the engine tests in $deps"
          } else {
            Write-Host "no boundary helper at $helper"
          }
      - name: Probe first AppContainer creations as fresh standard local users
        shell: pwsh
        env:
          PROBE_RUNNER: ${{ matrix.runner }}
          PROBE_REPLICA: ${{ matrix.replica }}
          PROBE_TRIALS: "1"
          PROBE_ARMS: A0-control
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'container-probe'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $alphabet = [char[]]'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $arms = @($env:PROBE_ARMS -split ',')
          $replica = [int]$env:PROBE_REPLICA
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          $group = 'cprobe'
          net localgroup $group /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net localgroup failed with $LASTEXITCODE" }
          icacls $env:GITHUB_WORKSPACE /grant "${group}:(OI)(CI)(RX)" /C /Q | Out-Null
          $rows = [System.Collections.Generic.List[string]]::new()
          function Start-AsUser([string]$user, $secure, [string]$program, [string]$cwd, [string[]]$arguments) {
            $start = [System.Diagnostics.ProcessStartInfo]::new($program)
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $start.UserName = $user
            $start.Domain = '.'
            $start.Password = $secure
            $start.LoadUserProfile = $true
            $start.UseShellExecute = $false
            $start.WorkingDirectory = $cwd
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            [System.Diagnostics.Process]::Start($start)
          }
          function Invoke-AsUser([int]$trial, [string]$user, $secure, [string]$name, [string]$program, [string]$cwd, [string[]]$arguments) {
            $process = Start-AsUser $user $secure $program $cwd $arguments
            $out = $process.StandardOutput.ReadToEndAsync()
            $err = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(1200000)) { $process.Kill($true) }
            $process.WaitForExit()
            $text = $out.Result + "`n" + $err.Result
            Set-Content -LiteralPath (Join-Path $logs "t$trial-$name.txt") -Value $text
            Write-Host "==== t$trial $name exit $($process.ExitCode)"
            [pscustomobject]@{ Exit = $process.ExitCode; Text = $text }
          }
          function Get-ContainerEvents([datetime]$since) {
            $names = Get-WinEvent -ListLog * -ErrorAction SilentlyContinue | Where-Object { $_.RecordCount -gt 0 } | ForEach-Object { $_.LogName }
            foreach ($name in $names) {
              try {
                $found = Get-WinEvent -FilterHashtable @{ LogName = $name; StartTime = $since } -ErrorAction SilentlyContinue
              } catch {
                continue
              }
              foreach ($record in $found) {
                $message = "$($record.Message)" -replace '\s+', ' '
                if ($message -match 'AppContainer|0x8007000A|appcontainer\.cpp|crazyagent\.test') {
                  $short = $message.Substring(0, [Math]::Min(400, $message.Length))
                  "EVENT $($record.TimeCreated.ToUniversalTime().ToString('o')) [$name] $($record.ProviderName) id=$($record.Id) $short"
                }
              }
            }
          }
          function Get-Launches([string]$text) {
            @($text -split "`n" | Where-Object { $_ -like 'PROBE-LAUNCH*' })
          }
          for ($trial = 1; $trial -le [int]$env:PROBE_TRIALS; $trial++) {
            $arm = $arms[($trial + $replica) % $arms.Count]
            $user = "cpr$replica" + ('{0:d2}' -f $trial)
            $password = (-join (1..24 | ForEach-Object { $alphabet | Get-Random })) + 'aZ7!'
            net user $user $password /add /y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "net user failed with $LASTEXITCODE" }
            if ((net localgroup Administrators) -contains $user) { throw "$user is an administrator" }
            net localgroup $group $user /add | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "net localgroup add failed with $LASTEXITCODE" }
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $password = $null
            $since = Get-Date
            $uptime = [int]($since - $boot).TotalSeconds
            Write-Host "==== trial $trial arm $arm uptime ${uptime}s"
            $held = $null
            try {
              Invoke-AsUser $trial $user $secure 'whoami' "$env:SystemRoot\System32\whoami.exe" $env:GITHUB_WORKSPACE @('/all') | Out-Null
              if ($arm -eq 'A3-held-profile') {
                $held = Start-AsUser $user $secure "$env:SystemRoot\System32\PING.EXE" $env:GITHUB_WORKSPACE @('-n', '1200', '127.0.0.1')
                $heldOut = $held.StandardOutput.ReadToEndAsync()
                $heldErr = $held.StandardError.ReadToEndAsync()
              }
              Invoke-AsUser $trial $user $secure 'profile' "$env:SystemRoot\System32\cmd.exe" $env:GITHUB_WORKSPACE @('/C', 'echo', '%USERNAME%', '%USERPROFILE%', '%TEMP%') | Out-Null
              $unit = Invoke-AsUser $trial $user $secure 'unit' $env:SBX_UNIT_EXE $env:SBX_UNIT_CWD @()
              $unit.Text -split "`n" | Where-Object { $_ -match 'container::tests|^test result|panicked|left:|right:' } | ForEach-Object { Write-Host "UNIT t$trial $_" }
              $solo = ''
              if ($arm -eq 'A2-solo-first') {
                $solo = (Invoke-AsUser $trial $user $secure 'solo' $env:SBX_BOUNDARY_EXE $env:SBX_BOUNDARY_CWD @('a_hidden_folder_inside_the_project_is_neither_read_nor_listed', '--exact', '--nocapture', '--test-threads', '1')).Text
              }
              $threads = if ($arm -eq 'A1-serial') { '1' } else { '4' }
              $boundary = Invoke-AsUser $trial $user $secure 'boundary' $env:SBX_BOUNDARY_EXE $env:SBX_BOUNDARY_CWD @('--test-threads', $threads, '--nocapture')
              $exit = $boundary.Exit
            } catch {
              Write-Host "==== t$trial did not run: $($_.Exception.Message)"
              $exit = 'not started'
              $solo = ''
              $boundary = [pscustomobject]@{ Exit = $exit; Text = '' }
            } finally {
              if ($held) {
                $alive = -not $held.HasExited
                if ($alive) { $held.Kill($true) }
                $held.WaitForExit()
                Write-Host "==== t$trial held process alive until the end: $alive"
              }
            }
            $launches = Get-Launches ($solo + "`n" + $boundary.Text)
            $refused = @($launches | Where-Object { $_ -like '*agent not started*' })
            $bad = @($refused | Where-Object { $_ -like '*2147942410*' })
            $first = ($launches | ForEach-Object { if ($_ -match 'at_ms=(\d+)') { [int64]$Matches[1] } } | Measure-Object -Minimum).Minimum
            foreach ($line in $refused) {
              $offset = if ($line -match 'at_ms=(\d+)') { [int64]$Matches[1] - $first } else { -1 }
              Write-Host "PROBE-REFUSED t$trial $arm offset_ms=$offset $line"
            }
            $events = @(Get-ContainerEvents $since)
            Set-Content -LiteralPath (Join-Path $logs "t$trial-events.txt") -Value $events
            $events | Select-Object -First 40 | ForEach-Object { Write-Host $_ }
            $row = "PROBE-TRIAL runner=$env:PROBE_RUNNER replica=$replica trial=$trial arm=$arm uptime_s=$uptime boundary_exit=$exit launches=$($launches.Count) refused=$($refused.Count) bad_environment=$($bad.Count) events=$($events.Count)"
            Write-Host $row
            $rows.Add("| $replica | $trial | $arm | $uptime | $exit | $($launches.Count) | $($refused.Count) | $($bad.Count) | $($events.Count) |")
          }
          @('| replica | trial | arm | uptime s | boundary exit | launches | refused | 0x8007000A | events |', '| --- | --- | --- | --- | --- | --- | --- | --- | --- |') + $rows | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: container-probe-${{ matrix.runner }}-${{ matrix.replica }}
          path: ${{ runner.temp }}/container-probe
          if-no-files-found: warn
          retention-days: 14
