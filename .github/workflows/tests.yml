name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  winlaunch-cr:
    name: RV-GRPF-1826-CR8 ${{ matrix.name }} on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tip clippy and rows
            rev: c1eb17a7d2
            expect: green
            clippy: "yes"
            mutate: ""
            rows: |
              crazyagent|--lib|harnesses::update::state::in_use_tests::
          - name: scratch mutant setup errors are named
            rev: c1eb17a7d2
            expect: report
            clippy: "no"
            mutate: sed -i -e 's/var_os("SystemRoot")/var_os("SystemRootMutant")/' -e 's/join("engine.db")/join("missing-folder").join("engine.db")/' crates/crazyagent/src/harnesses/update/state/in_use_tests.rs
            rows: |
              crazyagent|--lib|harnesses::update::state::in_use_tests::
          - name: scratch mutant panic leaves no PING
            rev: c1eb17a7d2
            expect: report
            clippy: "no"
            mutate: sed -i -e '368a\    panic!("forced after the hold");' crates/crazyagent/src/harnesses/update/state/in_use_tests.rs
            rows: |
              crazyagent|--lib|harnesses::update::state::in_use_tests::a_windows_runtime_whose_command_line_names_a_script_under_the_prefix_refuses_the_update
          - name: scratch mutant panic at the base leaves a PING
            rev: 2878739a78
            expect: report
            clippy: "no"
            mutate: sed -i -e '312a\    panic!("forced after the hold");' crates/crazyagent/src/harnesses/update/state/in_use_tests.rs
            rows: |
              crazyagent|--lib|harnesses::update::state::in_use_tests::a_windows_runtime_whose_command_line_names_a_script_under_the_prefix_refuses_the_update
          - name: base control rows
            rev: 2878739a78
            expect: report
            clippy: "no"
            mutate: ""
            rows: |
              crazyagent|--lib|harnesses::update::state::in_use_tests::
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a probe whose parent is not the ticket tip
        env:
          TIP: c1eb17a7d2
        run: |
          set -euo pipefail
          parent=$(git rev-parse --short=10 HEAD^)
          echo "CASE head $(git rev-parse HEAD) parent $parent"
          [ "$parent" = "$TIP" ] || { echo "::error::HEAD^ is $parent, not the tip $TIP"; exit 1; }
          changed=$(git diff --name-only HEAD^ HEAD)
          [ "$changed" = ".github/workflows/tests.yml" ] || { echo "::error::the probe commit changes more than the workflow: $changed"; exit 1; }
      - name: Check out the revision this entry proves
        env:
          REV: ${{ matrix.rev }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$REV"
          echo "CASE head $(git rev-parse HEAD)"
      - name: Apply the scratch mutation this entry names
        if: ${{ matrix.mutate != '' }}
        env:
          MUTATE: ${{ matrix.mutate }}
        run: |
          set -euo pipefail
          bash -c "$MUTATE"
          git diff --stat
          git diff | sed 's/^/CASE mutant /'
          changed=$(git diff --numstat | wc -l)
          [ "$changed" = 1 ] || { echo "::error::the mutation changed $changed files"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Clippy each touched crate with warnings denied
        if: ${{ matrix.clippy == 'yes' }}
        run: |
          set +e
          set -u
          failed=0
          for target in "crazyagent --lib --tests"; do
            read -r -a words <<< "$target"
            crate="${words[0]}"
            started=$(date +%s)
            cargo clippy --locked --keep-going -p "$crate" "${words[@]:1}" -- -D warnings > "clippy-$crate.log" 2>&1
            rc=$?
            cat "clippy-$crate.log"
            built=$(grep -c -E "^ *(Checking|Compiling) $crate v" "clippy-$crate.log")
            echo "CASE clippy $crate rc=$rc built=$built seconds=$(( $(date +%s) - started ))"
            if [ "$rc" != 0 ]; then failed=1; fi
            if [ "$built" -lt 1 ]; then echo "::error::clippy never checked $crate"; failed=1; fi
          done
          exit "$failed"
      - name: Run the rows this entry names
        if: ${{ !cancelled() }}
        env:
          ROWS: ${{ matrix.rows }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set +e
          set -uo pipefail
          failed=0
          number=0
          while IFS='|' read -r crate target filter; do
            [ -n "$crate" ] || continue
            number=$((number + 1))
            log="row-$number.log"
            started=$(date +%s)
            read -r -a kind <<< "$target"
            read -r -a only <<< "$filter"
            cargo test --locked -p "$crate" "${kind[@]}" -- "${only[@]}" > "$log" 2>&1
            rc=$?
            ran=$(grep -E '^running [0-9]+ tests?$' "$log" | tail -1 || true)
            echo "ROW $crate $target $filter rc=$rc $ran seconds=$(( $(date +%s) - started ))"
            grep -E '^test .* \.\.\. (ok|FAILED|ignored)' "$log" | sed 's/^/CASE /' || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -120 || true
            if [ "$rc" != 0 ] && ! grep -q -E '^running [0-9]+ tests?$' "$log"; then
              tail -40 "$log"
            fi
            [ "$rc" = 0 ] || failed=1
            count=$(echo "$ran" | grep -o -E '[0-9]+' | head -1)
            if [ "${count:-0}" -lt 1 ]; then
              echo "ROW-EMPTY $crate $target $filter ran no test"
              failed=1
            fi
          done <<< "$ROWS"
          if [ "$EXPECT" = green ] && [ "$failed" != 0 ]; then
            exit 1
          fi
      - name: Count PING processes left after the rows
        if: ${{ !cancelled() }}
        run: |
          set +e
          left=$(MSYS_NO_PATHCONV=1 tasklist.exe /NH /FI "IMAGENAME eq PING.EXE" | grep -c -i 'ping.exe')
          echo "CASE ping left=$left"
