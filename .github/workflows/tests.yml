name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  BUN_DARWIN_ARM64_SHA256: 80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403
  NODE_DARWIN_ARM64_SHA256: 1901d539912c02afa10d1cc126943a8855a7eedebe830119463470db5e6c59e8
  RUSTC_DARWIN_ARM64_SHA256: 738e3f60114b20550fcf4f8a57c9cea0544239f214709f45594ff3fde327f577
  CARGO_DARWIN_ARM64_SHA256: de51d4fade4f31ad8ec405261cc96bedc000d905f98980027610d6e288dbe21b
  RUST_STD_DARWIN_ARM64_SHA256: 2de831ef563ce772519a4d18ba2659f0f7428d497ef66dad24b5a35e8f8cd177
  CLIPPY_DARWIN_ARM64_SHA256: 1ad080040ff0f4f8af0751bd7fa1fb1901212f8d164cecaa3c47b0654e0916f2
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ENGINE_TESTS_EXCLUDE: >-
    e2e_tui research_engine team_engine onboarding research_runner research_service tui_v1_e2e codex_app_server_live launch_context_live codex_bridge_live agents_live
    qualification_boundary worker_engine_boundary accounts_binary e2e_add_existing setup_network harness_catalog_bundled_rcli acceptance_v2_rcli_usage
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
  DESKTOP_TESTS_EXCLUDE: picker_windows accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: POD-C C2 r3 prerequisite rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Install tmux from the pinned source build
        timeout-minutes: 30
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get install -y --no-install-recommends musl-tools bison binutils
          if dpkg -s tmux >/dev/null 2>&1; then sudo apt-get remove -y tmux; fi
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target x86_64-unknown-linux-gnu --work "$work/build" --out "$work/tmux"
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          tmux -V
      - name: Install uv at the pinned version
        run: |
          set -euo pipefail
          python3 -m pip install --user "uv==$UV_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version
      - name: Build the Linux landlock helper
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          ls -l target/debug/crazyagent-landlock
      - name: The 17 prerequisite rows at the C2 tip
        id: rows
        timeout-minutes: 90
        run: |
          set +e
          command -v tmux uv
          tmux -V
          cargo test -p crazyagent --lib --locked -- --exact harnesses::interactive::tests::a_manifest_command_refuses_a_keyed_account_tools_off_and_full_access project_setup::engine_tests::message_timeline::a_page_size_of_100_shows_100_entries_a_page project_setup::engine_tests::message_timeline::a_page_size_of_25_shows_25_entries_a_page project_setup::engine_tests::message_timeline::a_page_size_of_50_shows_50_entries_a_page project_setup::engine_tests::message_timeline::a_project_keeping_2000_messages_shows_the_newest_2000 project_setup::engine_tests::message_timeline::a_project_keeping_500_messages_shows_the_newest_500 project_setup::engine_tests::message_timeline::a_project_keeping_5000_messages_shows_the_newest_5000 project_setup::engine_tests::message_timeline::with_master_messages_kept_the_timeline_shows_what_the_master_said project_setup::engine_tests::message_timeline::with_master_messages_not_kept_the_timeline_shows_only_that_the_master_said_something project_setup::engine_tests::message_timeline::with_owner_items_hidden_the_timeline_shows_only_the_master_s_words project_setup::engine_tests::message_timeline::with_owner_items_shown_the_timeline_shows_the_owner_s_tasks_and_prompts setup::linux::tests::setup_finds_tmux_exactly_when_the_live_start_does setup::pinned::tests::a_locked_tool_installs_only_files_whose_sha256_its_lock_lists setup::pinned::tests::a_tool_the_previous_build_installed_with_uv_tool_install_updates_to_its_lock setup::pinned::tests::uv_python_discovery_in_setup_never_runs_a_python_planted_in_a_project_folder terminal::tmux::tests::a_gone_window_reads_as_unknown_not_as_the_current_pane terminal::tmux::tests::a_spaced_window_name_never_shifts_a_pane_targets_reading 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "prerequisite rows at the C2 tip on ubuntu-22.04:"
          grep -E "^test |^test result|panicked" "$RUNNER_TEMP/rows.log" || true
          grep -E "^test .* \.\.\. FAILED$" "$RUNNER_TEMP/rows.log" | awk '{print $2}' > "$RUNNER_TEMP/red.txt" || true
          echo "red rows: $(wc -l < "$RUNNER_TEMP/red.txt")"
          [ "$code" -eq 0 ]
      - name: Base run of the rows still red, at a1c8aa820
        if: ${{ failure() && steps.rows.outcome == 'failure' }}
        timeout-minutes: 120
        run: |
          set +e
          red=$(tr '\n' ' ' < "$RUNNER_TEMP/red.txt")
          [ -n "$red" ] || { echo "no red row names to rerun"; exit 1; }
          git fetch --no-tags --depth=1 origin a1c8aa820c6adb1bae35ab1eb1a06c3292f0c000
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD
          cd "$RUNNER_TEMP/base"
          git log -1 --format='%H %s'
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          cargo test -p crazyagent --lib --locked -- --exact $red 2>&1 | tee "$RUNNER_TEMP/base.log"
          code=${PIPESTATUS[0]}
          echo "the same rows at base a1c8aa820 on ubuntu-22.04 rc $code:"
          grep -E "^test |^test result|panicked" "$RUNNER_TEMP/base.log" || true
          exit 1
