name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  N2A_TIP: b3b1c6f51
  PROBE_TIP: 69e870fac

defaults:
  run:
    shell: bash

jobs:
  probes:
    name: V244 win-signin Windows probes for D4r, the replace twin and S9b at 69e870fac, on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the N2a tip plus the probe rows
        run: |
          set -euo pipefail
          git diff --quiet "$PROBE_TIP" -- crates
          git diff --stat "$N2A_TIP" "$PROBE_TIP" -- crates
          [ "$(git diff --name-only "$N2A_TIP" "$PROBE_TIP" -- crates | wc -l)" -eq 2 ]
      - name: Probe rows, each outcome recorded
        timeout-minutes: 60
        run: |
          set -euo pipefail
          export CRAZYAGENT_PROBE_OUT="$RUNNER_TEMP/probes.txt"
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::probes:: 2>&1 | tee "$RUNNER_TEMP/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "===== probe record on $RUNNER_NAME ($ImageOS $ImageVersion)"
          cat "$CRAZYAGENT_PROBE_OUT" || true
          echo "====="
          grep -E 'test result' "$RUNNER_TEMP/probe.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/probe.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 7 passed; 0 failed' "$RUNNER_TEMP/probe.log"
