name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 71feb4035ea53beec2f1c836697271e9f85b6314
  RED: dbef54bdc4c7e573416fec26e9f675133f291ce9
  VALUE_WIN: research::runner::program_tests::engine_and_ide_git_name_a_missing_system_folder_file_for_hooks_programs_and_ssh
  VALUE_UNIX: research::runner::program_tests::engine_and_ide_git_name_dev_null_for_hooks_programs_and_ssh
  BUILDER: research::runner::program_tests::the_windows_value_is_a_plain_system_folder_with_forward_slashes_or_none
  EFFECT: github::publish::windows_tests::no_planted_program_runs_for_a_hook_a_signature_check_or_the_ssh_command
  IDE_LOG: ide::git::tests::the_ide_git_logs_a_signed_commit_alone_and_runs_no_false_the_path_finds

defaults:
  run:
    shell: bash

jobs:
  win-red:
    name: Git safe program path ${{ matrix.runner }}, the tip's rows over the red commit's code fail for their named reasons
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the tip's planted-program row over the red commit's code and value rows
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git checkout "$RED" -- crates/crazyagent/src/research/runner.rs crates/crazyagent/src/ide/git.rs crates/crazyagent/src/research/runner/program_tests.rs
          test "$(git diff --name-only "$TIP" | sort | tr '\n' ' ')" = "crates/crazyagent/src/ide/git.rs crates/crazyagent/src/research/runner.rs crates/crazyagent/src/research/runner/program_tests.rs " || { echo "TREE IS NOT THE TIP WITH THE RED CODE"; git diff --stat "$TIP"; exit 1; }
          test "$(git diff --name-only "$RED")" = crates/crazyagent/src/github/publish/windows_tests.rs || { echo "TREE DIFFERS FROM THE RED COMMIT BEYOND THE ROW LINT FIX"; git diff --stat "$RED"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Build the engine library tests at the red commit
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: The value row and the planted-program row fail at the red commit for their named reasons
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --exact "$VALUE_WIN" > "$RUNNER_TEMP/red-value.txt" 2>&1
          rc_value=$?
          cargo test -p crazyagent --lib --locked -- --ignored --exact "$EFFECT" > "$RUNNER_TEMP/red-effect.txt" 2>&1
          rc_effect=$?
          grep -E "^test |^test result|panicked|: ran |: ended |names a program" "$RUNNER_TEMP/red-value.txt" "$RUNNER_TEMP/red-effect.txt" | cut -c1-400 | head -60
          [ "$rc_value" -ne 0 ] || { echo "RED VALUE ROW PASSED, expected a failure"; exit 1; }
          [ "$rc_effect" -ne 0 ] || { echo "RED EFFECT ROW PASSED, expected a failure"; exit 1; }
          reason() {
            awk -v t="thread '$2' " -v want="$3" 'index($0, t) == 1 && /panicked at/ {getline line; if (index(line, want)) found=1} END {exit !found}' "$1" || { echo "RED: $2 did not fail for: $3"; exit 1; }
          }
          reason "$RUNNER_TEMP/red-value.txt" "$VALUE_WIN" "a git names a program a user could plant"
          reason "$RUNNER_TEMP/red-effect.txt" "$EFFECT" "a Windows git ran a planted program or ended wrong"
          for want in "publish update-ref: ran" "stage init: ran" " commit: ran" "reference-transaction.exe" "signature check: ran"; do
            grep -qF -- "$want" "$RUNNER_TEMP/red-effect.txt" || { echo "RED: the effect row names no '$want'"; exit 1; }
          done
          for left in /c/usr/bin/false /c/usr/bin/false.exe /c/dev/null.exe /c/dev/null/reference-transaction.exe /d/usr/bin/false /d/dev/null/reference-transaction.exe; do
            [ ! -e "$left" ] || { echo "RED: the row left $left behind"; exit 1; }
          done
          echo "red ok: both rows failed for their named reasons at $RED"

  win-tip:
    name: Git safe program path ${{ matrix.runner }} at the tip, clippy on windows-2022, rows, the planted-program row alone
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Clippy crazyagent-win-sandbox, all targets
        if: matrix.runner == 'windows-2022'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy crazyagent lib
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- research::runner::program_tests:: research::runner::windows_tests:: github:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "program_tests|ignored" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$VALUE_WIN" "$BUILDER"; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          grep -q "^test $EFFECT \.\.\. ignored" "$RUNNER_TEMP/tip.txt" || { echo "THE PLANTED-PROGRAM ROW IS NOT IGNORED IN THE SHARED RUN"; rc=1; }
          exit "$rc"
      - name: The planted-program row alone at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --ignored --exact "$EFFECT" > "$RUNNER_TEMP/effect.txt" 2>&1
          code=$?
          grep -E "^test |^test result|panicked|: ran |: ended " "$RUNNER_TEMP/effect.txt" | cut -c1-400 | head -40
          rc=0
          grep -q "^test $EFFECT \.\.\. ok" "$RUNNER_TEMP/effect.txt" || { echo "EFFECT ROW NOT OK (exit $code)"; rc=1; }
          grep -q "^test result: ok\. 1 passed" "$RUNNER_TEMP/effect.txt" || { echo "THE EFFECT ROW DID NOT RUN ALONE"; rc=1; }
          for left in /c/usr/bin/false /c/usr/bin/false.exe /c/dev/null.exe /c/dev/null/reference-transaction.exe /d/usr/bin/false /d/dev/null/reference-transaction.exe; do
            [ ! -e "$left" ] || { echo "THE ROW LEFT $left BEHIND"; rc=1; }
          done
          exit "$rc"
      - name: The system folder row in crazyagent-win-sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent-win-sandbox --lib --locked -- system:: > "$RUNNER_TEMP/system.txt" 2>&1
          code=$?
          grep -E "^test |^test result|panicked" "$RUNNER_TEMP/system.txt" | head -20
          grep -q "^test win::system::tests::the_system_folder_is_the_absolute_folder_that_holds_kernel32 \.\.\. ok" "$RUNNER_TEMP/system.txt" || { echo "SYSTEM FOLDER ROW NOT OK (exit $code)"; exit 1; }

  linux-tip:
    name: Git safe program path Linux at the tip, clippy lib then tests, rows
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          /usr/bin/git --version
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- research::runner::program_tests:: ide::git:: ide::env:: landing::signature_tests:: landing::git:: worktrees::tests:: github:: project_files:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "program_tests|ignored" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$VALUE_UNIX" "$BUILDER" "$IDE_LOG" ide::git::tests::the_ide_git_ssh_transport_runs_no_false_the_path_finds landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor worktrees::tests::engine_worktree_git_runs_no_repository_signature_program_in_any_armor; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"

  linux-red-value:
    name: Git safe program path Linux, the Unix value set back to /usr/bin/false turns the value row red
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the tip with the Unix value set back to /usr/bin/false
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/crazyagent/src/research/runner.rs")
          s = p.read_text()
          a = "#[cfg(unix)]\npub(crate) fn no_program() -> &'static str {\n    \"/dev/null\"\n}\n"
          assert s.count(a) == 1, s.count(a)
          p.write_text(s.replace(a, a.replace("\"/dev/null\"", "\"/usr/bin/false\"")))
          PY
          test "$(git diff --name-only "$TIP")" = crates/crazyagent/src/research/runner.rs
          git diff "$TIP" | grep -E "^[-+] "
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - name: Build the engine library tests with the value set back
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: The value row fails for its named reason
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --exact "$VALUE_UNIX" > "$RUNNER_TEMP/red.txt" 2>&1
          rc=$?
          grep -E "^test |^test result|panicked|names a program" "$RUNNER_TEMP/red.txt" | cut -c1-300 | head -20
          [ "$rc" -ne 0 ] || { echo "RED RUN PASSED, expected a failure"; exit 1; }
          awk -v t="thread '$VALUE_UNIX' " -v want="a git names a program a user could plant" 'index($0, t) == 1 && /panicked at/ {getline line; if (index(line, want)) found=1} END {exit !found}' "$RUNNER_TEMP/red.txt" || { echo "RED: the value row did not fail for its named reason"; exit 1; }
          echo "red ok: the value row failed with /usr/bin/false"

  linux-red-ide-signature:
    name: Git safe program path Linux, the IDE's three signature programs set back to the bare false turn the IDE log row red
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the tip with the IDE's three signature programs set back to the bare false
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/crazyagent/src/ide/git.rs")
          s = p.read_text()
          for n in (6, 7, 8):
              a = f'("GIT_CONFIG_VALUE_{n}", crate::research::runner::no_program()),'
              assert s.count(a) == 1, (n, s.count(a))
              s = s.replace(a, f'("GIT_CONFIG_VALUE_{n}", "false"),')
          assert 'log.showSignature' in s
          p.write_text(s)
          PY
          test "$(git diff --name-only "$TIP")" = crates/crazyagent/src/ide/git.rs
          test "$(git diff "$TIP" | grep -c '^+ ')" = 3
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - name: Build the engine library tests with the three values set back
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: The IDE log row fails for its named reason
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --exact "$IDE_LOG" > "$RUNNER_TEMP/red.txt" 2>&1
          rc=$?
          grep -E "^test |^test result|panicked|ran the path" "$RUNNER_TEMP/red.txt" | cut -c1-300 | head -20
          [ "$rc" -ne 0 ] || { echo "RED RUN PASSED, expected a failure"; exit 1; }
          awk -v t="thread '$IDE_LOG' " -v want="the IDE's git ran the path's false for a signature check" 'index($0, t) == 1 && /panicked at/ {getline line; if (index(line, want)) found=1} END {exit !found}' "$RUNNER_TEMP/red.txt" || { echo "RED: the IDE log row did not fail for its named reason"; exit 1; }
          echo "red ok: the IDE log row failed with the bare false"

  macos-tip:
    name: Git safe program path macOS at the tip, rows
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
          echo "confined-step git, which xcode-select does not move: $(/Library/Developer/CommandLineTools/usr/bin/git --version || echo missing)"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
      - name: Build the engine library tests
        id: lib
        timeout-minutes: 100
        run: |
          set -euo pipefail
          date -u '+lib build start %H:%M:%S'
          cargo test -p crazyagent --lib --locked --no-run
          date -u '+lib build end %H:%M:%S'
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- research::runner::program_tests:: ide::git:: ide::env:: ide::server::tests::server_env_holds_only_allowlisted_names ide::server::tests::an_older_agents_root_too_large_to_read_keeps_the_git_stop ide::sandbox::tests::ide_git_refuses_agent_folders_and_runs_project_hooks_only_when_on landing::signature_tests:: worktrees::tests:: github::publish:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "program_tests|ide::server::|ide::sandbox::|ignored" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$VALUE_UNIX" "$BUILDER" "$IDE_LOG" ide::server::tests::server_env_holds_only_allowlisted_names ide::server::tests::an_older_agents_root_too_large_to_read_keeps_the_git_stop ide::sandbox::tests::ide_git_refuses_agent_folders_and_runs_project_hooks_only_when_on landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"
      - name: Build the IDE settings integration test
        if: ${{ !cancelled() }}
