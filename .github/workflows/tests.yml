name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: POD-D D2a base rows at af4a4f099 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: kernel security rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent-kernel-security --locked 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel security rows on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: secret_format_copies
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --locked --test secret_format_copies 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "secret_format_copies on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: mcp_config_secret_copies
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --locked --test mcp_config_secret_copies 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "mcp_config_secret_copies on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: secret_value_wipe
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --locked --test secret_value_wipe 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "secret_value_wipe on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: secret_drops_wipe
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --locked --test secret_drops_wipe 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "secret_drops_wipe on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: lib credentials rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked credentials:: 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "lib credentials rows on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: lib model_gateway::relay rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked model_gateway::relay:: 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "lib model_gateway::relay rows on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: lib storage::accounts rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked storage::accounts:: 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "lib storage::accounts rows on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: lib storage::plugins rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked storage::plugins:: 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "lib storage::plugins rows on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: credential_platforms
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends libsecret-tools >/dev/null
          cat > "$RUNNER_TEMP/keyring-run.sh" <<'SCRIPT'
          set -u
          printf 'farm-keyring\n' | gnome-keyring-daemon --unlock --components=secrets
          echo "keyring daemons: $(pgrep -c gnome-keyring || true)"
          busctl --user list 2>/dev/null | grep -i secrets || echo "no org.freedesktop.secrets on the session bus"
          printf 'probe-value' | secret-tool store --label=farm-probe farm probe && echo "secret-tool store rc 0"
          echo "secret-tool lookup: $(secret-tool lookup farm probe || echo FAILED)"
          cargo test -p crazyagent --locked --test credential_platforms
          SCRIPT
          dbus-run-session -- bash "$RUNNER_TEMP/keyring-run.sh" 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "credential_platforms on ubuntu-22.04: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
  windows:
    name: POD-D D2a base rows at af4a4f099 on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: clippy desktop with a placeholder frontend
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          [ ! -e apps/desktop/dist ] || { echo "::error::apps/desktop/dist already exists"; exit 1; }
          mkdir apps/desktop/dist && printf '<!doctype html><title>check</title>\n' > apps/desktop/dist/index.html
          cargo clippy -p crazyagent-desktop --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          rm -rf apps/desktop/dist
          set -e
          echo "clippy desktop on ${{ matrix.runner }}: rc $code"
          grep -E "^(warning|error)|could not compile|panicked" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: clippy kernel security
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo clippy -p crazyagent-kernel-security --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "clippy kernel security on ${{ matrix.runner }}: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: clippy engine
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "clippy engine on ${{ matrix.runner }}: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: kernel security rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent-kernel-security --locked 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel security rows on ${{ matrix.runner }}: rc $code"
          grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: secret_format_copies
        if: ${{ !cancelled() }}
