name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  NAMED_ROWS: >-
    plugins::tests::a_windows_check_under_a_host_or_port_limit_is_refused_with_the_firewall_reason
    sandbox::policy::tests::a_loopback_model_on_windows_is_refused_under_every_network_choice
    sandbox::policy::tests::full_access_on_windows_names_no_level_this_version_refuses_there
    sandbox::policy::tests::full_access_on_windows_is_refused_with_its_own_reason_and_code
    sandbox::policy::tests::a_windows_model_only_agent_with_tools_starts_no_proxy_and_reaches_the_models_port_on_any_host
    sandbox::policy::tests::on_windows_a_limited_network_choice_says_it_reaches_the_whole_internet
    sandbox::policy::tests::each_platform_offers_only_the_levels_it_can_enforce

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows O3a/O2a rows and clippy at 4a825c6f4 (chore/v244 da95470d4 merged)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rows with the helper beside the tests, then clippy, one target set per cargo call
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/o3a-o2a-windows.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-run 2>&1 | tee -a "$out"
          built=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked 2>&1 | tee -a "$out"
          helper=${PIPESTATUS[0]}
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
          copied=$?
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- sandbox::policy::tests sandbox::windows::tests plugins::tests::a_windows_check_under plugins::tests::a_check_the_boundary context_mode::windows_tests 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          read -ra named <<< "$NAMED_ROWS"
          want=0
          failed=$(awk '/^test .* \.\.\. FAILED$/ {print $2}' "$out" | sort -u)
          [ -z "$failed" ] || { echo "::error::rows failed:"; echo "$failed"; want=1; }
          for row in "${named[@]}"; do grep -q "^test $row \.\.\. ok$" "$out" || { echo "::error::$row did not pass"; want=1; }; done
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --lib --locked -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --tests --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clipt=${PIPESTATUS[0]}
          printf '| Windows | exit |\n| --- | --- |\n| build | %s |\n| helper | %s |\n| rows | %s |\n| named rows ok, none failed (0 = yes) | %s |\n| clippy --lib -D warnings | %s |\n| clippy --tests -D warnings | %s |\n' "$built" "$helper" "$rc" "$want" "$clip" "$clipt" >> "$GITHUB_STEP_SUMMARY"
          [ "$built" = 0 ] && [ "$helper" = 0 ] && [ "$copied" = 0 ] && [ "$rc" = 0 ] && [ "$want" = 0 ] && [ "$clip" = 0 ] && [ "$clipt" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-o3a-o2a-windows
          path: ${{ runner.temp }}/o3a-o2a-windows.txt
          if-no-files-found: warn
          retention-days: 14
