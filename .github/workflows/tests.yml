name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 9624727fd6e60a31927bbfb0ffdc9e779e17a64a
  FIX_FULL: 942aa05b5851c19b90e92ead57c3c18f9aec6c25
  BASE_FULL: ed6ba4a9d4d45f62cb4ce2f0d2583cb7be50cf46
  HELD: "engine::bootstrap::held::tests::"
  LAUNCH: "launch_context::windows_tests::"
  BOUNDED: "harnesses::launch::bounded_windows_tests::"
  HOME_WINDOWS: "agent_home::windows_tests::"
  NEW_LAUNCH: "a_windows_process_install_prepares_the_home_through_the_held_root a_windows_process_install_removes_planted_junctions_in_the_home_as_themselves a_windows_process_install_replaces_a_link_or_folder_at_the_instruction_file a_windows_process_install_with_no_text_removes_the_instruction_file a_windows_process_install_keeps_or_clears_the_caches_by_the_choice a_windows_process_install_clears_project_memory_and_links_but_keeps_transcripts a_windows_process_install_keeps_a_kept_file_it_cannot_open a_windows_install_it_cannot_write_yet_is_refused_before_it_changes_the_home a_windows_install_names_its_files_in_the_held_home_after_a_junction_above_is_repointed a_windows_folder_above_the_homes_parent_cannot_be_moved_while_its_launch_holds_it a_windows_process_keys_its_records_by_the_held_home_after_a_junction_above_is_repointed a_windows_process_keys_its_skills_record_by_the_held_home_after_a_junction_above_is_repointed"
  NEW_HELD: "a_sole_inherited_file_refuses_a_second_writer_while_it_is_open an_unjudged_file_open_reads_a_plain_file_and_refuses_a_link_or_folder an_unjudged_file_open_of_a_file_held_without_sharing_is_in_use"
  NEW_BOUNDED: "a_windows_claude_launch_names_its_held_home_in_its_variables_after_a_repoint a_windows_launch_refuses_a_boundary_that_grants_another_home_than_the_held_one a_windows_launch_through_another_spelling_of_a_legit_home_builds_on_its_held_place"
  UNIX_LAUNCH: "launch_context::tests::"
  UNIX_HARNESS: "harnesses::launch::"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: S9B-6 records at the held place tip 5 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 14
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~10)" = "$BASE_FULL" ] || { echo "::error::HEAD~10 is not the ticket base"; exit 1; }
          [ "$(git rev-parse HEAD~3^2)" = "$FIX_FULL" ] || { echo "::error::the merge's second parent is not the CR gB fix"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: crazyagent clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylib.log"
          cargo clippy -p crazyagent --lib --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylibtests.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib --tests windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent lib test build, logged (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/norun.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "test build windows-2022 rc $code errors $errors gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: Build the boundary helper beside the test binary
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: held rows == list, agent_home Windows rows == list, launch_context Windows rows == list, bounded launch rows == list, the 18 new ones ok, launch and bounded new 5 rounds
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          count_list() {
            cargo test -p crazyagent --lib --locked -- "$1" --list 2>/dev/null | grep -cE ': test$' || true
          }
          all_rows() {
            local filter="$1" label="$2" floor="$3" log="$RUNNER_TEMP/$2.log" listed code failed passed ignored
            listed="$(count_list "$filter")"
            cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(result_sum "$log" 4)"
            ignored="$(result_sum "$log" 8)"
            echo "$label rc $code listed $listed passed $passed ignored $ignored failed $failed"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" -ge "$floor" ] && [ "$passed" = "$((listed - ignored))" ]
          }
          new_ok() {
            local filter="$1" rows="$2" log="$3" n=0 row
            for row in $rows; do
              c="$(grep -cE "^test $filter$row \.\.\. ok$" "$log" || true)"
              [ "$c" = 1 ] || echo "  missing or not ok: $row ($c)"
              n=$((n + c))
            done
            echo "$n"
          }
          fail=0
          all_rows "$HELD" held 25 || fail=1
          all_rows "$HOME_WINDOWS" home 4 || fail=1
          all_rows "$LAUNCH" launch 25 || fail=1
          all_rows "$BOUNDED" bounded 10 || fail=1
          hn="$(new_ok "$HELD" "$NEW_HELD" "$RUNNER_TEMP/held.log" | tail -n 1)"
          ln="$(new_ok "$LAUNCH" "$NEW_LAUNCH" "$RUNNER_TEMP/launch.log" | tail -n 1)"
          bn="$(new_ok "$BOUNDED" "$NEW_BOUNDED" "$RUNNER_TEMP/bounded.log" | tail -n 1)"
          echo "new held ok $hn of 3 new launch ok $ln of 12 new bounded ok $bn of 3"
          [ "$hn" = 3 ] && [ "$ln" = 12 ] && [ "$bn" = 3 ] || fail=1
          [ "$fail" = 0 ] || exit 1
          for round in 1 2 3 4 5; do
            for pair in "LAUNCH:12:$NEW_LAUNCH" "BOUNDED:3:$NEW_BOUNDED"; do
              var="${pair%%:*}"
              filter="${!var}"
              rest="${pair#*:}"
              want="${rest%%:*}"
              rows="${rest#*:}"
              rlog="$RUNNER_TEMP/round-$round-$var.log"
              cargo test -p crazyagent --lib --locked -- "$filter" > "$rlog" 2>&1
              rcode=$?
              rfailed="$(result_sum "$rlog" 6)"
              rok="$(new_ok "$filter" "$rows" "$rlog" | tail -n 1)"
              echo "round $round $var rc $rcode failed $rfailed new ok $rok of $want"
              grep -E '^test .* FAILED$|panicked at' "$rlog" | head -n 10 || true
              [ "$rcode" = 0 ] && [ "$rfailed" = 0 ] && [ "$rok" = "$want" ] || exit 1
            done
          done

  linux:
    name: S9B-6 records at the held place tip 5 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 14
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~10)" = "$BASE_FULL" ] || { echo "::error::HEAD~10 is not the ticket base"; exit 1; }
          [ "$(git rev-parse HEAD~3^2)" = "$FIX_FULL" ] || { echo "::error::the merge's second parent is not the CR gB fix"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: crazyagent clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylib.log"
          cargo clippy -p crazyagent --lib --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylibtests.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib --tests ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent lib test build, logged (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/norun.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "test build ubuntu-22.04 rc $code errors $errors gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: launch_context Unix rows == list, harnesses::launch rows == list
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          count_list() {
            cargo test -p crazyagent --lib --locked -- "$1" --list 2>/dev/null | grep -cE ': test$' || true
          }
          fail=0
          for pair in "unix-launch:$UNIX_LAUNCH" "unix-harness:$UNIX_HARNESS"; do
            label="${pair%%:*}"
            filter="${pair#*:}"
            log="$RUNNER_TEMP/$label.log"
            listed="$(count_list "$filter")"
            cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(result_sum "$log" 4)"
            ignored="$(result_sum "$log" 8)"
            echo "$label rc $code listed $listed passed $passed ignored $ignored failed $failed"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" -ge 1 ] && [ "$passed" = "$((listed - ignored))" ] || fail=1
          done
          [ "$fail" = 0 ] || exit 1
