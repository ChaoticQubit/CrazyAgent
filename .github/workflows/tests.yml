name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 8643a907582928cf5fa25f54ee3502aa082b71b3
  FIX1: ca0d5ddfe81a5e7bc5e0e77d37bb742dd7948608
  MERGE: a6ff9614b5785dc7add743606f5818db5743ca85
  CHORE: b4f2e713598d8d6dfb970100200c983e4366976b
  BASE: 2234cb34b9eca41c7aa4a91cd0ffcb031f1343f2
  FILES: "crates/crazyagent/src/launch_context.rs crates/crazyagent/src/launch_context/sized_json_tests.rs crates/kernel/security/src/secret.rs crates/kernel/security/src/secret/tests.rs scripts/quality/caps-allow.json "
  FILES2: "crates/kernel/security/src/secret.rs crates/kernel/security/src/secret/tests.rs "

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: SIZED-JSON-CAPPED on windows-2022, fix tip against base
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git rev-parse "$MERGE^1")" = "$FIX1" ] && [ "$(git rev-parse "$MERGE^2")" = "$CHORE" ] || { echo "::error::the merge is not the first fix plus chore"; exit 1; }
          git merge-base --is-ancestor "$MERGE" HEAD^ || { echo "::error::the merge is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" "$FIX1" | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the first fix touches other files"; exit 1; }
          [ "$(git diff --name-only "$MERGE" HEAD^ | tr '\n' ' ')" = "$FILES2" ] || { echo "::error::the commits after the merge touch other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain with clippy, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, Windows clippy -D on crazyagent-kernel-security lib and tests (expect rc 0, 0 errors, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/clippy-kernel.log"
          cargo clippy -p crazyagent-kernel-security --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-security v' "$log" || true)
          echo "CLIPPY kernel rc $rc errors $errors warnings $warnings checked $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent-kernel-security"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Tip, Windows clippy -D on crazyagent lib and tests (expect rc 0, 0 errors, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/clippy-engine.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
          echo "CLIPPY engine rc $rc errors $errors warnings $warnings checked $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          side="$1"
          : > "$RUNNER_TEMP/$side-failed.txt"
          bad=0
          for pair in "crazyagent-kernel-security secret::tests::" "crazyagent launch_context::sized_json_tests::"; do
            read -r pkg filter <<< "$pair"
            log="$RUNNER_TEMP/$side-$pkg.log"
            cargo test -p "$pkg" --lib --locked --offline "$filter" -- --list > "$log.list" 2>&1
            listed=$(grep -cE ': test$' "$log.list" || true)
            if grep -E ': test$' "$log.list" | grep -i -E 'keychain|security'; then echo "::error::a keychain row is listed"; exit 1; fi
            cargo test -p "$pkg" --lib --locked --offline "$filter" > "$log" 2>&1
            rc=$?
            result=$(grep -E '^test result: ' "$log" | tail -1 || true)
            grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' >> "$RUNNER_TEMP/$side-failed.txt" || true
            echo "ROWS $side $pkg $filter rc $rc listed $listed $result"
            grep -E 'panicked' -A3 "$log" | head -20 || true
            grep -E '^test .* (ok|FAILED|ignored)$' "$log" || true
            [ "$listed" -ge 1 ] || bad=1
            [ "$side" = base ] || [ "$rc" = 0 ] || bad=1
          done
          echo "ROWS-END $side bad $bad"
          [ "$bad" = 0 ] || { echo "::error::$side rows: none listed, or a tip row failed"; exit 1; }
          ROWS
      - name: "Tip, secret::tests:: and launch_context::sized_json_tests:: (expect listed > 0 and every row ok)"
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" tip
      - name: Base, base secret.rs and launch_context.rs with the new row module wired (expect the engine grow and shrink rows red)
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          set +e
          set -uo pipefail
          git checkout "$BASE" -- crates/kernel/security/src/secret.rs crates/kernel/security/src/secret/tests.rs crates/crazyagent/src/launch_context.rs
          py=$(command -v python3 || command -v python)
          "$py" - crates/crazyagent/src/launch_context.rs <<'WIRE'
          import sys
          p = sys.argv[1]
          lines = open(p, newline="").read().splitlines(keepends=True)
          at = [i for i, line in enumerate(lines) if line.rstrip() == "mod windows_tests;"]
          assert len(at) == 1, at
          end = lines[at[0]][len(lines[at[0]].rstrip()):]
          wire = ["", "#[cfg(test)]", '#[path = "launch_context/sized_json_tests.rs"]', "mod sized_json_tests;"]
          lines[at[0] + 1:at[0] + 1] = [text + end for text in wire]
          open(p, "w", newline="").write("".join(lines))
          WIRE
          grep -c '^mod sized_json_tests;$' crates/crazyagent/src/launch_context.rs | grep -qx 1 || { echo "::error::the row module is not wired at base"; exit 1; }
          git diff --stat HEAD^
          bash "$RUNNER_TEMP/rows.sh" base
          git checkout HEAD^ -- crates/kernel/security/src/secret.rs crates/kernel/security/src/secret/tests.rs crates/crazyagent/src/launch_context.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the fix tip"; exit 1; }
      - name: FAILED-name diff, tip against base (expect tip 0 and tip-only 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          sort -u "$RUNNER_TEMP/tip-failed.txt" > "$RUNNER_TEMP/t.txt"
          sort -u "$RUNNER_TEMP/base-failed.txt" > "$RUNNER_TEMP/b.txt"
          tip=$(wc -l < "$RUNNER_TEMP/t.txt" | tr -d ' ')
          base=$(wc -l < "$RUNNER_TEMP/b.txt" | tr -d ' ')
          only=$(comm -23 "$RUNNER_TEMP/t.txt" "$RUNNER_TEMP/b.txt" | wc -l | tr -d ' ')
          sed 's/^/BASE-FAILED /' "$RUNNER_TEMP/b.txt"
          echo "DIFF tip $tip base $base tip-only $only"
          [ "$tip" = 0 ] && [ "$only" = 0 ] || { echo "::error::the tip fails rows"; exit 1; }
  linux:
    name: SIZED-JSON-CAPPED on ubuntu-22.04, fix tip against base
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
