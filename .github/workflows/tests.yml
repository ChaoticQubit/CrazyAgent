name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 9cbe10c75cd59fa70e8247a4055913fda2eacc7f
  RED: a8f768b6c238a0b8e222059617a3d30bba1cd99c

defaults:
  run:
    shell: bash

jobs:
  flake-linux-tip:
    name: Git flake Linux at the tip, clippy lib then tests, rows, the load row alone six times
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          /usr/bin/git --version
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- ide::git::tests:: ide::env:: landing::signature_tests:: worktrees::tests:: landing::tests::repository_hooks_filters_merge_drivers_textconv_and_fsmonitor_never_run landing::tests::update_merges_a_lead_worker_s_set_with_its_lead_s_branch_and_names_it landing::tests::update_merges_a_clone_lead_s_newest_tip_into_its_worker_s_set > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "landing::tests::|ignored" "$RUNNER_TEMP/tip-rows.txt"
          grep -q "^test worktrees::tests::engine_worktree_git_reads_an_ssh_signed_commit_under_load_every_time \.\.\. ignored" "$RUNNER_TEMP/tip.txt" || { echo "LOAD ROW NOT IGNORED IN THE SHARED RUN"; rc=1; }
          for row in worktrees::tests::engine_worktree_git_runs_no_repository_signature_program_in_any_armor landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor ide::git::tests::the_ide_git_logs_a_signed_commit_alone_and_runs_no_false_the_path_finds ide::git::tests::the_ide_git_ssh_transport_runs_no_false_the_path_finds; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"
      - name: The load row alone six times at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          rc=0
          for run in 1 2 3 4 5 6; do
            cargo test -p crazyagent --lib --locked -- --ignored --exact worktrees::tests::engine_worktree_git_reads_an_ssh_signed_commit_under_load_every_time > "$RUNNER_TEMP/load-$run.txt" 2>&1
            code=$?
            grep -E "^test |^test result|panicked|runs failed" "$RUNNER_TEMP/load-$run.txt"
            grep -q "^test worktrees::tests::engine_worktree_git_reads_an_ssh_signed_commit_under_load_every_time \.\.\. ok" "$RUNNER_TEMP/load-$run.txt" || { echo "LOAD RUN $run NOT OK (exit $code)"; rc=1; }
            grep -q "^test result: ok\. 1 passed" "$RUNNER_TEMP/load-$run.txt" || { echo "LOAD RUN $run DID NOT RUN THE ROW ALONE"; rc=1; }
          done
          exit "$rc"

  flake-linux-red:
    name: Git flake Linux, the tip's rows over the red commit's code fail for their named reasons
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the tip's rows over the red commit's code
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git checkout "$RED" -- crates/crazyagent/src/research/runner.rs crates/crazyagent/src/ide/git.rs
          test "$(git diff --name-only "$TIP" | sort | tr '\n' ' ')" = "crates/crazyagent/src/ide/git.rs crates/crazyagent/src/research/runner.rs " || { echo "TREE IS NOT THE TIP WITH THE RED CODE"; git diff --stat "$TIP"; exit 1; }
          test "$(git diff --name-only "$RED" | sort | tr '\n' ' ')" = "crates/crazyagent/src/ide/git/tests.rs crates/crazyagent/src/worktrees.rs " || { echo "TREE DIFFERS FROM THE RED COMMIT BEYOND THE R2 ROWS"; git diff --stat "$RED"; exit 1; }
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - name: Build the engine library tests at the red commit
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: The new rows fail at the red commit's code for their named reasons
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --exact ide::git::tests::the_ide_git_logs_a_signed_commit_alone_and_runs_no_false_the_path_finds ide::git::tests::the_ide_git_ssh_transport_runs_no_false_the_path_finds landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor > "$RUNNER_TEMP/red.txt" 2>&1
          rc=$?
          cargo test -p crazyagent --lib --locked -- --ignored --exact worktrees::tests::engine_worktree_git_reads_an_ssh_signed_commit_under_load_every_time > "$RUNNER_TEMP/red-load.txt" 2>&1
          rc_load=$?
          grep -E "^test |^test result|panicked|runs failed|ran the path|setup git failed" "$RUNNER_TEMP/red.txt" "$RUNNER_TEMP/red-load.txt" | cut -c1-400 | head -40
          [ "$rc" -ne 0 ] || { echo "RED RUN PASSED, expected failures"; exit 1; }
          [ "$rc_load" -ne 0 ] || { echo "RED LOAD RUN PASSED, expected a failure"; exit 1; }
          reason() {
            awk -v t="thread '$2' " -v want="$3" 'index($0, t) == 1 && /panicked at/ {getline line; if (index(line, want)) found=1} END {exit !found}' "$1" || { echo "RED: $2 did not fail for: $3"; exit 1; }
          }
          reason "$RUNNER_TEMP/red.txt" ide::git::tests::the_ide_git_logs_a_signed_commit_alone_and_runs_no_false_the_path_finds "the IDE's git ran the path's false"
          reason "$RUNNER_TEMP/red.txt" ide::git::tests::the_ide_git_ssh_transport_runs_no_false_the_path_finds "the IDE's git ran the path's false as its ssh command"
          reason "$RUNNER_TEMP/red-load.txt" worktrees::tests::engine_worktree_git_reads_an_ssh_signed_commit_under_load_every_time "runs failed under"
          grep -q "^test landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor \.\.\. FAILED" "$RUNNER_TEMP/red.txt" && echo "signature row also failed at the red code" || echo "signature row passed at the red code (its red is the race, not required)"
          echo "red ok: 3 rows failed for their named reasons at $RED's code"

  flake-macos-tip:
    name: Git flake macOS at the tip, rows
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
          echo "confined-step git, which xcode-select does not move: $(/Library/Developer/CommandLineTools/usr/bin/git --version || echo missing)"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
      - name: Build the engine library tests
        id: lib
        timeout-minutes: 100
        run: |
          set -euo pipefail
          date -u '+lib build start %H:%M:%S'
          cargo test -p crazyagent --lib --locked --no-run
          date -u '+lib build end %H:%M:%S'
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- ide::git::tests:: ide::env:: ide::sandbox::tests::ide_git_refuses_agent_folders_and_runs_project_hooks_only_when_on landing::signature_tests:: worktrees::tests:: landing::tests::repository_hooks_filters_merge_drivers_textconv_and_fsmonitor_never_run landing::tests::update_merges_a_lead_worker_s_set_with_its_lead_s_branch_and_names_it landing::tests::update_merges_a_clone_lead_s_newest_tip_into_its_worker_s_set > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "landing::tests::|ide::sandbox::|ignored" "$RUNNER_TEMP/tip-rows.txt"
          for row in worktrees::tests::engine_worktree_git_runs_no_repository_signature_program_in_any_armor landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor ide::git::tests::the_ide_git_logs_a_signed_commit_alone_and_runs_no_false_the_path_finds ide::git::tests::the_ide_git_ssh_transport_runs_no_false_the_path_finds ide::sandbox::tests::ide_git_refuses_agent_folders_and_runs_project_hooks_only_when_on landing::tests::update_merges_a_lead_worker_s_set_with_its_lead_s_branch_and_names_it landing::tests::update_merges_a_clone_lead_s_newest_tip_into_its_worker_s_set; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"

  flake-windows-clippy:
    name: Git flake windows-2022 clippy lib then tests
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
