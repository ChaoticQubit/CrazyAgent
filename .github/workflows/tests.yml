name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  GREEN_SHA: 27ff30baf

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: V244 native webdriver probe on ${{ matrix.runner }}, the real app at 27ff30baf driven through its embedded server, wdio and tauri-driver
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    timeout-minutes: 100
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Build the app with native-webdriver, then drive it three ways
        run: |
          set -euo pipefail
          git diff --quiet "$GREEN_SHA" HEAD -- apps crates Cargo.toml Cargo.lock
          mkdir -p "$RUNNER_TEMP/wd"
          cp .github/farm/wd/* "$RUNNER_TEMP/wd/"
          bash "$RUNNER_TEMP/wd/v244-native-windows-wd.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-native-windows-wd-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/v244-native-windows-wd-*.txt
            ${{ runner.temp }}/raw.txt
            ${{ runner.temp }}/raw-app.txt
            ${{ runner.temp }}/wdio.txt
            ${{ runner.temp }}/official.txt
            ${{ runner.temp }}/official-driver.txt
            ${{ runner.temp }}/wd-build.txt
            ${{ runner.temp }}/plain-build.txt
            ${{ runner.temp }}/npm-ci.txt
            ${{ runner.temp }}/td.txt
          if-no-files-found: warn
          retention-days: 14

