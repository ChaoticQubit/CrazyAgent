name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TAKE: team::runtime::tests::hidden_seers_tests::a_pane_taken_over_after_a_folder_was_hidden_is_listed_by_what_its_record_hid
  GUARD: team::runtime::tests::hidden_seers_tests::an_agent_that_ended_before_a_folder_was_hidden_is_not_listed
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -60 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red246)
        [ "$rc" != 0 ] && grep -q 'panicked at crates/crazyagent/src/team/runtime/hidden_seers_tests.rs:246:' "$log" || { echo "::error::$name is not red at hidden_seers_tests.rs:246"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: B23 SEERS take-over rows on macos-15, red then tip
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='SEERS tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = 0c44592cd7d973a4d3fd8464a0488fac210b94fc ] || { echo "::error::the parent is not the SEERS tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = a080c563fda5ea2d8dcb19014dfd520ee9b54a05 ] || { echo "::error::HEAD~2 is not the SEERS fix"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = 15d32699f1bbd21f05cf549b7a5054aeb722c66c ] || { echo "::error::HEAD~3 is not the SEERS red row"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = 88dafb94f448a07cb105d461b9df018e451d817c ] || { echo "::error::HEAD~4 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~4 HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/team.rs crates/crazyagent/src/team/graph.rs crates/crazyagent/src/team/runtime/hidden_seers_tests.rs " ] || { echo "::error::the range touches more than team.rs, graph.rs and hidden_seers_tests.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the SEERS tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the product at 15d32699f1 with the tip tests file
        timeout-minutes: 120
        run: |
          set -euo pipefail
          git checkout 15d32699f1bbd21f05cf549b7a5054aeb722c66c -- crates/crazyagent/src/team.rs crates/crazyagent/src/team/graph.rs
          [ "$(git diff --name-only HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/team.rs crates/crazyagent/src/team/graph.rs " ] || { echo "::error::the red tree differs from the tip in more than the fix"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run
          set +e
          bash "$RUNNER_TEMP/rows.sh" guard-at-red pass --exact "$GUARD"
          guard=$?
          bash "$RUNNER_TEMP/rows.sh" take-at-red red246 --exact "$TAKE"
          take=$?
          git checkout HEAD^ -- crates/crazyagent/src/team.rs crates/crazyagent/src/team/graph.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the SEERS tip"; exit 1; }
          echo "red step guard rc $guard take rc $take"
          [ "$guard" = 0 ] && [ "$take" = 0 ]
      - name: Build the engine lib tests at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the SEERS tip"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run
      - name: Tip, take-over row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" take-at-tip pass --exact "$TAKE"
      - name: Tip, guard row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" guard-at-tip pass --exact "$GUARD"
      - name: Tip, hidden_seers_tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" hidden-seers pass team::runtime::tests::hidden_seers_tests::
      - name: Tip, team graph tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" graph pass team::graph::tests::
      - name: Tip, TUI settings row that names agents seeing a hidden folder
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" tui-settings-seers pass settings_name_agents_that_can_still_open_a_hidden_folder_and_r_restarts_them
      - name: Tip, TUI Restart them key row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" tui-restart-them pass settings_with_jobs_loaded_sends_restart_them_on_capital_r_and_r_still_refreshes
