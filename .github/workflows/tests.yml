name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  a30-windows:
    name: W-NODE 3a ${{ matrix.name }} on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tip clippy and rows
            rev: 1f21caaf3a
            expect: green
            clippy: "yes"
            rows: |
              crazyagent|--lib|harnesses::update::windows_tests::
              crazyagent|--lib|harnesses::update::state::windows_tests::
              crazyagent|--lib|harnesses::update::run::windows_tests::
              crazyagent|--lib|tui::screens::settings_harnesses::windows_tests::
              crazyagent-kernel-processes|--lib|finding::windows_tests::
              crazyagent|--lib|engine::owner::transport::harness_catalog::updates::
          - name: red rows
            rev: eda675831b
            expect: report
            clippy: "no"
            rows: |
              crazyagent|--lib|harnesses::update::windows_tests::
              crazyagent|--lib|harnesses::update::state::windows_tests::
              crazyagent|--lib|harnesses::update::run::windows_tests::
              crazyagent|--lib|tui::screens::settings_harnesses::windows_tests::
              crazyagent-kernel-processes|--lib|finding::windows_tests::
              crazyagent|--lib|engine::owner::transport::harness_catalog::updates::
          - name: base control rows
            rev: a58848483e
            expect: report
            clippy: "no"
            rows: |
              crazyagent|--lib|harnesses::update::windows_tests::
              crazyagent|--lib|harnesses::update::state::windows_tests::
              crazyagent|--lib|harnesses::update::run::windows_tests::
              crazyagent|--lib|tui::screens::settings_harnesses::windows_tests::
              crazyagent-kernel-processes|--lib|finding::windows_tests::
              crazyagent|--lib|engine::owner::transport::harness_catalog::updates::
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the revision this entry proves
        env:
          REV: ${{ matrix.rev }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$REV"
          echo "CASE head $(git rev-parse HEAD)"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Clippy each touched crate with warnings denied
        if: ${{ matrix.clippy == 'yes' }}
        run: |
          set +e
          set -u
          failed=0
          for target in "crazyagent-win-sandbox --tests" "crazyagent-kernel-processes --lib --tests" "crazyagent --lib --tests"; do
            read -r -a words <<< "$target"
            crate="${words[0]}"
            started=$(date +%s)
            cargo clippy --locked -p "$crate" "${words[@]:1}" -- -D warnings > "clippy-$crate.log" 2>&1
            rc=$?
            cat "clippy-$crate.log"
            built=$(grep -c -E "^ *(Checking|Compiling) $crate v" "clippy-$crate.log")
            echo "CASE clippy $crate rc=$rc built=$built seconds=$(( $(date +%s) - started ))"
            if [ "$rc" != 0 ]; then failed=1; fi
            if [ "$built" -lt 1 ]; then echo "::error::clippy never checked $crate"; failed=1; fi
          done
          exit "$failed"
      - name: Run the rows this entry names
        if: ${{ !cancelled() }}
        env:
          ROWS: ${{ matrix.rows }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set +e
          set -uo pipefail
          failed=0
          number=0
          while IFS='|' read -r crate target filter; do
            [ -n "$crate" ] || continue
            number=$((number + 1))
            log="row-$number.log"
            started=$(date +%s)
            read -r -a kind <<< "$target"
            only=()
            if [ -n "$filter" ]; then only=("$filter"); fi
            cargo test --locked -p "$crate" "${kind[@]}" -- "${only[@]}" > "$log" 2>&1
            rc=$?
            ran=$(grep -E '^running [0-9]+ tests?$' "$log" | tail -1 || true)
            echo "ROW $crate $target $filter rc=$rc $ran seconds=$(( $(date +%s) - started ))"
            grep -E '^test .* \.\.\. (ok|FAILED|ignored)' "$log" | sed 's/^/CASE /' || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -120 || true
            if [ "$rc" != 0 ] && ! grep -q -E '^running [0-9]+ tests?$' "$log"; then
              tail -40 "$log"
            fi
            [ "$rc" = 0 ] || failed=1
            count=$(echo "$ran" | grep -o -E '[0-9]+' | head -1)
            if [ "${count:-0}" -lt 1 ]; then
              echo "ROW-EMPTY $crate $target $filter ran no test"
              failed=1
            fi
          done <<< "$ROWS"
          if [ "$EXPECT" = green ] && [ "$failed" != 0 ]; then
            exit 1
          fi

  a30-linux:
    name: W-NODE 3a tip clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the tip
        run: |
          set -euo pipefail
          git checkout --quiet --detach 1f21caaf3a
          echo "CASE head $(git rev-parse HEAD)"
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: rustfmt and clippy of the touched crates with warnings denied
        run: |
          set +e
          set -u
          failed=0
          cargo fmt --check -p crazyagent-kernel-processes -p crazyagent
          rc=$?
          echo "CASE fmt rc=$rc"
          [ "$rc" = 0 ] || failed=1
          for target in "crazyagent-kernel-processes --lib --tests" "crazyagent --lib --tests"; do
            read -r -a words <<< "$target"
            crate="${words[0]}"
            cargo clippy --locked -p "$crate" "${words[@]:1}" -- -D warnings > "clippy-$crate.log" 2>&1
            rc=$?
            grep -E '^(error|warning)(\[|:)|^ +--> ' "clippy-$crate.log" | head -n 60 || true
            built=$(grep -c -E "^ *(Checking|Compiling) $crate v" "clippy-$crate.log" || true)
            echo "CASE clippy $crate rc=$rc built=$built"
            if [ "$rc" != 0 ]; then failed=1; fi
            if [ "$built" -lt 1 ]; then echo "::error::clippy never checked $crate"; failed=1; fi
          done
          exit "$failed"
