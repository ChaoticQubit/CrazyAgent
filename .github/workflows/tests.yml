name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  environ:
    name: HANDOVER-HOLDER-READ, own environ read forms on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Own environ read forms, counts only
        run: |
          set +e
          uname -r
          readlink -f /bin/sh
          for shell in /bin/sh /bin/bash; do
            one="$(PROBE_X=probe-value "$shell" -c "tr '\\0' '\\n' < /proc/self/environ | grep -c '^PROBE_X='")"
            two="$(PROBE_X=probe-value "$shell" -c "tr '\\0' '\\n' < /proc/\$\$/environ | grep -c '^PROBE_X='")"
            three="$(PROBE_X=probe-value "$shell" -c "cat /proc/self/environ | tr '\\0' '\\n' | grep -c '^PROBE_X='")"
            bytes="$(PROBE_X=probe-value "$shell" -c "wc -c < /proc/self/environ")"
            echo "form $shell row-form $one dollar-pid $two cat-pipe $three wc-redirect-bytes $bytes"
          done
