name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 519175224c2f0c126bf07d6807ac96e812fb2c30
  ROW: migrations::windows_tests::folders_another_account_owns_are_neither_counted_nor_removed

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Owner checks recorder, the Windows reader row, migrations rows and kernel storage clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the fix tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [[ "$TIP_FULL" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::TIP_FULL is not a 40-hex sha: $TIP_FULL"; exit 1; }
          [ "$(git rev-parse HEAD^1)" = "$TIP_FULL" ] || { echo "::error::the first parent is not the fix tip"; exit 1; }
          git cat-file -e "$TIP_FULL^{commit}" || { echo "::error::the fix tip is not in the clone"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked dependencies
        run: cargo fetch --locked
      - name: The Windows owner checks reader row alone, ok 1
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/row.log"
          cargo test -p crazyagent-kernel-storage --lib --locked -- "$ROW" --exact > "$log" 2>&1
          code=$?
          okn="$(grep -cE "^test $ROW \.\.\. ok$" "$log")"
          grep -E 'test result:|panicked at|^test ' "$log" | head -n 20
          echo "ROW $ROW rc $code ok $okn"
          [ "$code" = 0 ] && [ "$okn" = 1 ] || { echo "::error::the reader row is not ok once"; tail -n 40 "$log"; exit 1; }
      - name: Kernel storage migrations rows, rc 0
        if: always()
        timeout-minutes: 30
        run: |
          set +e
          log="$RUNNER_TEMP/migrations.log"
          cargo test -p crazyagent-kernel-storage --lib --locked -- migrations:: > "$log" 2>&1
          code=$?
          okn="$(grep -cE '^test migrations::[a-z_0-9:]+ \.\.\. ok$' "$log")"
          failed="$(grep -E '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | tr '\n' ' ')"
          grep -E 'test result:|panicked at' "$log" | head -n 20
          echo "ROWS migrations:: rc $code ok $okn FAILED: $failed"
          [ "$code" = 0 ] && [ "$okn" -gt 0 ] || { echo "::error::migrations rows red or empty"; exit 1; }
      - name: Clippy kernel storage lib and tests, rc 0
        if: always()
        timeout-minutes: 45
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/kernel/storage/src/lib.rs
          cargo clippy -p crazyagent-kernel-storage --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log")"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 100 || true
          tail -n 3 "$log"
          echo "CLIPPY $RUNNER_OS crazyagent-kernel-storage --lib --tests rc $code checked $checked"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked"; exit 1; }
          [ "$code" = 0 ] || { echo "::error::clippy rc $code"; exit 1; }
