name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  red-a:
    name: Durable narrowing r2 rows red at 4083668dd on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
          bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Durable narrowing r2 rows red at 4083668dd on ubuntu-22.04
        timeout-minutes: 100
        run: |
          export CARGO_BUILD_JOBS=2
          cp .github/farm/r2.sh "$RUNNER_TEMP/r2.sh"
          bash "$RUNNER_TEMP/r2.sh" red red-a 4083668dd \
            engine::owner::transport::barrier_tests::a_revocation_pending_when_the_engine_dies_lands_at_the_next_open \
            engine::owner::transport::barrier_tests::a_revocation_refused_at_the_barrier_lands_at_the_next_open_when_the_engine_dies_mid_drain \
            engine::owner::transport::barrier_tests::an_engine_whose_tui_is_revoked_starts_and_refuses_the_tui \
            engine::owner::transport::native_auth_restart_tests::a_sign_out_pending_when_the_engine_dies_signs_the_profile_out_at_the_next_start \
            engine::owner::transport::native_auth_restart_tests::a_leftover_sign_out_the_harness_cannot_finish_keeps_the_profile_blocked_and_says_why \
            engine::owner::transport::native_auth_restart_tests::a_sign_out_storage_refuses_keeps_no_intent_and_the_profile_launches_after_a_restart \
            engine::owner::transport::native_auth_restart_tests::an_owner_sign_in_ends_the_kept_sign_outs_of_its_profile_so_a_restart_keeps_it \
            engine::owner::transport::native_auth_restart_tests::a_drained_sign_out_whose_intent_is_gone_is_refused_and_the_sign_in_stays \
            engine::owner::transport::master_runtime::routing_tests::a_sign_out_that_outlasts_its_bound_is_pending_and_runs_while_the_host_stays_frozen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-narrowing-red-a
          path: ${{ runner.temp }}/red-a
          if-no-files-found: warn
          retention-days: 14
  red-b:
    name: Durable narrowing r2 kept-refusal row red at 7c2016567 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
          bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Durable narrowing r2 kept-refusal row red at 7c2016567 on ubuntu-22.04
        timeout-minutes: 70
        run: |
          export CARGO_BUILD_JOBS=2
          cp .github/farm/r2.sh "$RUNNER_TEMP/r2.sh"
          bash "$RUNNER_TEMP/r2.sh" red red-b 7c2016567 \
            engine::owner::transport::native_auth_restart_tests::a_drained_sign_out_refused_by_name_keeps_its_intent_and_the_next_open_replays_it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-narrowing-red-b
          path: ${{ runner.temp }}/red-b
          if-no-files-found: warn
          retention-days: 14
  green:
    name: Durable narrowing r2 green at 68619fbf4 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
