name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ROWS: "native_term::windows::rows::"
  RUN_SH: |
    set +e
    label="$1"
    want="$2"
    shift 2
    names=()
    for n in "$@"; do names+=("$ROWS$n"); done
    log="$RUNNER_TEMP/run-$label.log"
    cargo test -p crazyagent-desktop --lib --locked -- --include-ignored --test-threads=1 --show-output --exact "${names[@]}" > "$log" 2>&1
    code=$?
    ran=$(grep -oE '^running [0-9]+ test' "$log" | grep -oE '[0-9]+' | head -n 1)
    echo "run $label: rc $code, ran ${ran:-none}, want $want"
    grep -E '^test .* \.\.\. |^test result:' "$log"
    grep -E 'trial removal|the seam set|device-lost row|h5a row|panicked at|releasing a lost device' "$log" | head -n 80
    verdict=green
    [ "$code" -eq 0 ] || verdict=red
    [ "${ran:-0}" = "$want" ] || verdict="count-mismatch(${ran:-none}/$want)"
    echo "$label $verdict rc $code ran ${ran:-none}/$want" >> "$RUNNER_TEMP/verdict.txt"
    exit 0

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: DX12 frame release desktop clippy on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the fix tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='fix tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = 770f98624e0dd7d663539768b0c0ff64ef77cfb3 ] || { echo "::error::the parent is not the fix tip 770f98624e"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$RUN_SH" > "$RUNNER_TEMP/run.sh"
          bash -n "$RUNNER_TEMP/run.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Desktop clippy
        id: clippy
        timeout-minutes: 90
        run: |
          set +e
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
          rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
          cargo clippy -p crazyagent-desktop --lib --tests --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          grep -E '^(warning|error)|-->' "$RUNNER_TEMP/clippy.log" | sort -u | head -n 40 || true
          echo "clippy desktop --lib --tests rc $code"
          echo "clippy rc $code" >> "$RUNNER_TEMP/verdict.txt"
          exit 0
      - name: Verdicts
        if: ${{ always() }}
        run: |
          echo "DX12 frame release row, ${{ matrix.os }}:"
          cat "$RUNNER_TEMP/verdict.txt" 2>/dev/null || echo "no result"
