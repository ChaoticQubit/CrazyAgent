name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  landlock-linux:
    name: landlock helper path red a638f976c then green 6660e21be linux_sandbox project_sandbox clippy ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      RED: a638f976ce8947687143e1fc7ff6e2eab1717221
      TIP: 6660e21bee0fd90776e2ff5a4ebdafe8c4eb3e96
      INSTALL_ROWS: an_installed_sandbox_on_linux_launches_through_the_linux_boundary the_strict_setting_refuses_a_launch_without_the_call_supervisor_and_off_starts_it
      PIN_ROW: sandbox::linux::tests::an_engine_outside_a_deps_folder_never_takes_another_helper
      DEPS_ROW: sandbox::linux::tests::a_test_binary_in_cargos_deps_folder_takes_cargos_helper_build_only_when_none_is_beside_it
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Red and green rows
        timeout-minutes: 240
        run: |
          set -u +e +o pipefail
          bad=0
          libbin() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
            rc=$?
            echo "lib build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1
          }
          testbin() {
            out=$(cargo test -p crazyagent --test "$1" --locked --no-run 2>&1)
            rc=$?
            echo "$1 build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            printf '%s\n' "$out" | sed -n "s/.*Executable tests\/$1.rs (\(.*\))/\1/p" | tail -1
          }
          row() {
            out=$("$1" --exact "$2" 2>&1)
            rc=$?
            printf '%s\n' "$out" | grep -A6 'panicked at' | cut -c1-300 | sed 's/^/      /'
            printf '%s\n' "$out" | grep 'linux_helper_cargo_build\|linux_helper_missing' | head -3 | cut -c1-200 | sed 's/^/      /'
            printf '%s\n' "$out" | grep -q 'running 1 test' || { echo "    $2: not exactly one test"; return 2; }
            echo "    $2 rc=$rc"
            return "$rc"
          }
          full() {
            out=$("$1" 2>&1)
            rc=$?
            printf '%s\n' "$out" | grep '^test .* FAILED$' | cut -c1-200 | sed 's/^/      /'
            echo "    full $2 rc=$rc $(printf '%s\n' "$out" | grep -m1 'test result' | cut -c1-120)"
          }
          for at in RED TIP; do
            sha=${!at}
            git checkout -q -f --detach "$sha"
            echo "== $at $(git log --oneline -1)"
            lib=$(libbin) || { bad=1; continue; }
            ls -la target/debug/deps/crazyagent-landlock 2>&1 | sed 's/^/    deps: /'
            row "$lib" "$PIN_ROW" || bad=1
            row "$lib" "$DEPS_ROW"
            rc=$?
            if [ "$at" = RED ]; then [ "$rc" -eq 101 ] || bad=1; else [ "$rc" -eq 0 ] || bad=1; fi
            sandbox=$(testbin linux_sandbox) || { bad=1; continue; }
            ls -la target/debug/crazyagent-landlock 2>&1 | sed 's/^/    built: /'
            ls -la target/debug/deps/crazyagent-landlock 2>&1 | sed 's/^/    deps: /'
            for r in $INSTALL_ROWS; do
              row "$sandbox" "$r"
              rc=$?
              if [ "$at" = RED ]; then [ "$rc" -eq 101 ] || bad=1; else [ "$rc" -eq 0 ] || bad=1; fi
            done
            full "$sandbox" linux_sandbox
            project=$(testbin project_sandbox) || { bad=1; continue; }
            full "$project" project_sandbox
          done
          echo "verdict bad=$bad"
          [ "$bad" -eq 0 ]
      - name: Clippy at the tip
        if: always()
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q -f --detach "$TIP"
          cargo clippy -p crazyagent --lib --locked -- -D warnings
          cargo clippy -p crazyagent --lib --profile test --locked -- -D warnings
          cargo clippy -p crazyagent --test linux_sandbox --locked -- -D warnings
      - name: Kernel log and memory after the run
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE "oom|killed process|out of memory|landlock|apparmor=\"DENIED\"" | tail -30 || true
