name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  TIP_FULL: 7fde5b15bb2cf21f79e6ca9aa3cbcaa6f0b023b5
  RED_FULL: d3aa8a53e6afe157927d6c49e6a328473e03a1d1
  BASE_FULL: fb1c9b29ad2a1e86f6e60865119514ea8860258a

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: NOTIFY-WORDS node ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
          - os: windows-2022
            leg: win
          - os: macos-15
            leg: mac
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip (the fix commit)"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the ON-THIS-MAC merge fb1c9b29ad"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: caps and sleeps ratchets at the base and the tip (expect sleeps rc 0 both; no tip caps problem missing at the base, none naming a ticket file)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          ct=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          st=$?
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL" > /dev/null 2>&1
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs) > "$RUNNER_TEMP/caps-base.txt" 2>&1
          cb=$?
          (cd "$RUNNER_TEMP/base" && node scripts/quality/sleeps.mjs) > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          sb=$?
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-tip.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-tip-files.txt" || true
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-base.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-base-files.txt" || true
          git diff --name-only "$BASE_FULL" HEAD^ | sort > "$RUNNER_TEMP/ticket-files.txt"
          new="$(comm -23 <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-tip.txt" | sort) <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-base.txt" | sort) | grep -c . || true)"
          ticket="$(comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" | grep -c . || true)"
          tail -n 1 "$RUNNER_TEMP/caps-tip.txt"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt"
          tail -n 1 "$RUNNER_TEMP/sleeps-tip.txt"
          comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" || true
          echo "caps rc tip $ct base $cb problems tip $(grep -c . "$RUNNER_TEMP/caps-tip-files.txt") base $(grep -c . "$RUNNER_TEMP/caps-base-files.txt") new-at-tip $new on-ticket-files $ticket sleeps rc tip $st base $sb"
          [ "$st" = 0 ] && [ "$sb" = 0 ] && [ "$ticket" = 0 ] && [ "$new" = 0 ] || exit 1
      - name: npm ci, tsc, then the notification rows at the tip (expect rc 0, fail 0, the per-computer row ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log" || true
          (cd apps/desktop && npm run --silent typecheck) > "$RUNNER_TEMP/tsc.log" 2>&1
          tc=$?
          grep -E 'error TS' "$RUNNER_TEMP/tsc.log" | head -n 10 || true
          (cd apps/desktop && node --test --test-reporter=tap test/notify.test.mjs) > "$RUNNER_TEMP/nt.log" 2>&1
          nt=$?
          grep -E '^(not )?ok|^# (pass|fail)' "$RUNNER_TEMP/nt.log" || true
          fail="$(grep -E '^# fail ' "$RUNNER_TEMP/nt.log" | awk '{print $3}' || true)"
          pass="$(grep -E '^# pass ' "$RUNNER_TEMP/nt.log" | awk '{print $3}' || true)"
          row="$(grep -cE "^ok [0-9]+ - the notification lines name each computer's own notification settings, and macOS keeps its words$" "$RUNNER_TEMP/nt.log" || true)"
          plat="$(cd apps/desktop && node -e 'console.log(globalThis.navigator?.platform ?? "none")')"
          echo "tip npm rc $ci tsc rc $tc notify rc $nt pass ${pass:-none} fail ${fail:-none} per-computer-row-ok $row host-platform $plat"
          [ "$ci" = 0 ] && [ "$tc" = 0 ] && [ "$nt" = 0 ] && [ "$fail" = 0 ] && [ "$pass" = 10 ] && [ "$row" = 1 ] || exit 1
      - name: Red, the base notify.ts under the tip rows (expect exactly the per-computer row not ok, every other row ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set +e
          git checkout "$RED_FULL" -- apps/desktop/src/notify.ts
          (cd apps/desktop && node --test --test-reporter=tap test/notify.test.mjs) > "$RUNNER_TEMP/nt-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/notify.ts
          grep -E '^(not )?ok|^# (pass|fail)' "$RUNNER_TEMP/nt-red.log" || true
          bad="$(grep -cE '^not ok ' "$RUNNER_TEMP/nt-red.log" || true)"
          named="$(grep -cE "^not ok [0-9]+ - the notification lines name each computer's own notification settings, and macOS keeps its words$" "$RUNNER_TEMP/nt-red.log" || true)"
          oks="$(grep -cE '^ok [0-9]+ - ' "$RUNNER_TEMP/nt-red.log" || true)"
          echo "red rc $red not ok $bad named $named ok $oks"
          [ "$red" != 0 ] && [ "$bad" = 1 ] && [ "$named" = 1 ] && [ "$oks" = 9 ] || exit 1
