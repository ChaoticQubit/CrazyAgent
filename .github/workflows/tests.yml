name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 0c1b500a00a780039a018e85be8d465269f62082
  BASE_FULL: 587ab830893b35ca811b505ee5d01b69a76ba623
  RED_FULL: 803290f2ebc562852fac6bf7d72e92afec4d2ef6
  ROW: restore::tests::a_restore_holds_engine_db_alone_from_its_copy_to_its_end

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: CR17-RESTORE-LOCKS tip fmt, clippy and the lock row at red then fix on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -12 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the ticket base 587ab83089"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the two crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-storage -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel-storage and crazyagent --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage -p crazyagent --tests --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gates crazyagent-kernel-storage $g0 crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1

      - name: lock row at the red commit 803290f2eb (expect 1 run, FAILED with the lock message)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          git checkout "$RED_FULL" -- crates/kernel/storage/src/restore.rs
          git diff --quiet "$RED_FULL" -- crates/kernel/storage/src || { echo "::error::kernel storage src is not the red commit's"; exit 1; }
          log="$RUNNER_TEMP/row-red.log"
          cargo test --locked -p crazyagent-kernel-storage --lib "$ROW" -- --exact > "$log" 2>&1
          code=$?
          grep -E '^test |^test result|panicked at|another process wrote|lock_probe_failed|^error' "$log" | head -n 20 || true
          ran="$(grep -cE "^test $ROW \.\.\. " "$log" || true)"
          failed="$(grep -cE "^test $ROW \.\.\. FAILED" "$log" || true)"
          msg="$(grep -c 'another process wrote engine.db while the restore held it' "$log" || true)"
          result="$(grep -cE '^test result: FAILED\. 0 passed; 1 failed' "$log" || true)"
          echo "row at red rc $code ran $ran failed $failed result-1-failed $result lock-message $msg"
          git checkout HEAD^ -- crates/kernel/storage/src/restore.rs
          [ "$code" != 0 ] && [ "$ran" = 1 ] && [ "$failed" = 1 ] && [ "$result" = 1 ] && [ "$msg" -ge 1 ] || exit 1
      - name: lock row at the fix 0c1b500a00 (expect 1 run, ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          git diff --quiet HEAD^ -- crates/kernel/storage/src || { echo "::error::kernel storage src is not the fix's"; exit 1; }
          log="$RUNNER_TEMP/row-fix.log"
          cargo test --locked -p crazyagent-kernel-storage --lib "$ROW" -- --exact > "$log" 2>&1
          code=$?
          grep -E '^test |^test result|panicked at|lock_probe_failed|^error' "$log" | head -n 20 || true
          ran="$(grep -cE "^test $ROW \.\.\. ok" "$log" || true)"
          passed="$(grep -cE '^test result: ok\. 1 passed; 0 failed' "$log" || true)"
          echo "row at fix rc $code ran-ok $ran result-1-passed $passed"
          [ "$code" = 0 ] && [ "$ran" = 1 ] && [ "$passed" = 1 ] || exit 1
