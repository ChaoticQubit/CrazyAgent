name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: caccf8220e
  OWNER_ROW: service::tests::cli_link_publish::a_link_another_user_owns_is_swapped_for_a_new_one
  RUST_FILES: >-
    crates/kernel/processes/src/service/cli_link.rs
    crates/kernel/processes/src/service/acl.rs
    crates/kernel/processes/src/service/tests/access_list.rs
    crates/kernel/processes/src/service/tests/cli_link_publish.rs
    crates/kernel/processes/src/perf_tests/service.rs

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: LINK-REPOINT rows, owner row and clippy on macos-15
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Changed rows at the fix tip
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          touch crates/kernel/processes/src/lib.rs
          cargo test -p crazyagent-kernel-processes --lib --locked -- --test-threads=4 service::tests::cli_link_publish:: service::tests::access_list:: > "$log" 2>&1
          code=$?
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          ok="$(grep -cE '^test service::tests::(cli_link_publish|access_list)::[a-z_0-9]+ \.\.\. ok$' "$log")"
          bad="$(grep -cE '^test .* \.\.\. FAILED$' "$log")"
          echo "BUILT $built ROWS rc $code ok $ok failed $bad want-ok 36"
          [ "$built" -gt 0 ] && [ "$code" = 0 ] && [ "$bad" = 0 ] && [ "$ok" = 36 ] || { echo "::error::changed rows not all green"; tail -n 40 "$log"; exit 1; }
      - name: The owner row, ignored on the Mac, by exact name
        timeout-minutes: 30
        run: |
          set +e
          log="$RUNNER_TEMP/owner.log"
          sudo -n true || { echo "::error::sudo asks a password on this runner"; exit 1; }
          cargo test -p crazyagent-kernel-processes --lib --locked -- --ignored --exact "$OWNER_ROW" > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          passed="$(grep -cE '^test result: ok\. 1 passed; 0 failed' "$log")"
          echo "OWNER rc $code one-passed $passed"
          [ "$code" = 0 ] && [ "$passed" = 1 ] || { echo "::error::the owner row did not pass alone"; tail -n 40 "$log"; exit 1; }
      - name: Clippy kernel processes tests, failing on a lint in the touched files
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/kernel/processes/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent-kernel-processes --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          echo "CHECKED crazyagent-kernel-processes $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          echo "macos clippy rc $code touched-file lints $moved"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] || { echo "::error::a lint in the touched files"; exit 1; }
