name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  N2A_TIP: e36289642
  HELD_RED: 84f9a18b9

defaults:
  run:
    shell: bash

jobs:
  n2a-r2:
    name: V244 N2a r2 held API, red held.rs at 84f9a18b9, tip e36289642, on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Keep the row checker outside the tree
        run: |
          set -euo pipefail
          cp .github/farm/v244-win-signin-n2a-r2-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the N2a r2 tip
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          rustc --version
          echo "crates at $N2A_TIP"
      - name: N2a r2 red, the tip's rows over the red held.rs at 84f9a18b9
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git checkout -q "$HELD_RED" -- crates/crazyagent/src/engine/bootstrap/held.rs
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: > "$RUNNER_TEMP/red.log" 2>&1
          set -e
          git checkout -q "$N2A_TIP" -- crates/crazyagent/src/engine/bootstrap/held.rs
          git diff --quiet "$N2A_TIP" -- crates
          bash "$RUNNER_TEMP/rows.sh" red "$RUNNER_TEMP/red.log"
      - name: N2a r2 clippy on the crazyagent library at e36289642
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: N2a r2 clippy on the crazyagent test rows at e36289642
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: N2a r2 held rows at e36289642
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: > "$RUNNER_TEMP/tip.log" 2>&1
          set -e
          bash "$RUNNER_TEMP/rows.sh" tip "$RUNNER_TEMP/tip.log"
  macos:
    name: V244 N2a r2 held API at e36289642 on macos-15, held rows and clippy lib and tests
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Keep the row checker outside the tree
        run: |
          set -euo pipefail
          cp .github/farm/v244-win-signin-n2a-r2-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Check the tree is the N2a r2 tip
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          echo "crates at $N2A_TIP"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux 3.8"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_BUILD_JOBS=2"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Build the crazyagent library test binary at e36289642
        timeout-minutes: 120
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo test -p crazyagent --lib --locked --no-run
          echo "built in $(( $(date +%s) - start )) s"
      - name: N2a r2 clippy on the crazyagent library at e36289642
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: N2a r2 clippy on the crazyagent test rows at e36289642
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: N2a r2 held rows at e36289642
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: > "$RUNNER_TEMP/tip.log" 2>&1
          set -e
          bash "$RUNNER_TEMP/rows.sh" tip "$RUNNER_TEMP/tip.log"
