name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Nested read root ${{ matrix.mode }} ${{ matrix.runner }} (tip bad1783b5, red 566e4310f)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            mode: rows
            minutes: 180
          - runner: windows-2025
            mode: rows
            minutes: 180
          - runner: windows-2022
            mode: suite
            minutes: 240
          - runner: windows-2025
            mode: suite
            minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm scripts outside the checkout, whose crates are the tip
        run: |
          set -euo pipefail
          git diff --quiet bad1783b5ceae0d785cec1836d34118018df78fd -- crates
          cp .github/farm/v244-win-nested-read-root-rows.ps1 "$RUNNER_TEMP/rows.ps1"
          cp .github/farm/v244-win-nested-read-root-suite.sh "$RUNNER_TEMP/suite.sh"
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Red at the red commit and green at the tip, the fixture rows as a standard local user
        if: matrix.mode == 'rows'
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\rows.ps1"'
      - name: The full engine lib suite at the tip, any red rerun at the base
        if: matrix.mode == 'suite'
        run: bash "$RUNNER_TEMP/suite.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.mode == 'rows'
        with:
          name: win-nested-rows-${{ matrix.runner }}
          path: ${{ runner.temp }}/win-nested-rows
          retention-days: 7

  clippy:
    name: Nested read root clippy ${{ matrix.runner }} (tip bad1783b5)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: ubuntu-24.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The crates are the tip
        run: git diff --quiet bad1783b5ceae0d785cec1836d34118018df78fd -- crates
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy, one target set per call, and the sandbox crate's lib rows on Linux
        run: |
          set -uo pipefail
          failed=0
          printf '| %s step | exit |\n| --- | --- |\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          step() {
            "$@" 2>&1 | tail -n 60
            local rc=${PIPESTATUS[0]}
            printf '| %s | %s |\n' "$*" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          }
          step cargo clippy -p crazyagent-win-sandbox --lib --bins --locked -- -D warnings
          step cargo clippy -p crazyagent-win-sandbox --tests --locked -- -D warnings
          if [ "$RUNNER_OS" = Windows ]; then
            step cargo clippy -p crazyagent --lib --locked -- -D warnings
            step cargo clippy -p crazyagent --lib --profile test --locked -- -D warnings
          else
            step cargo test -p crazyagent-win-sandbox --lib --locked
          fi
          echo "FARM failed=$failed"
          exit "$failed"
