name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: 1d5841e52
  TIP_SHA: 65b2b21d0

defaults:
  run:
    shell: bash

jobs:
  s1:
    name: V244 WIN-MASTER S1 r3 Codex custody (CR-1354) on ${{ matrix.runner }}, red at 1d5841e52, tip 65b2b21d0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Clippy on the win-sandbox library and its test rows
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --lib --locked -- -D warnings
          cargo clippy -p crazyagent-win-sandbox --tests --locked -- -D warnings
      - name: S1 r3 red rows at 1d5841e52, a frame sent to a harness that floods before it reads
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            rows="engine::codex_host::process_windows_tests::a_windows_harness_that_floods_its_output_before_it_reads engine::codex_host::process_windows_tests::the_output_bound_ends_a_windows_run_that_floods_past_it"
            names="a_windows_harness_that_floods_its_output_before_it_reads_still_takes_a_frame_larger_than_its_pipe the_output_bound_ends_a_windows_run_that_floods_past_it_while_a_frame_waits"
          else
            rows="engine::codex_host::process_tests::a_harness_that_floods_its_output_before_it_reads engine::codex_host::process_tests::the_output_bound_ends_a_run_that_floods_past_it"
            names="a_harness_that_floods_its_output_before_it_reads_still_takes_a_frame_larger_than_its_pipe the_output_bound_ends_a_run_that_floods_past_it_while_a_frame_waits"
          fi
          git restore -q --source="$RED_SHA" --staged --worktree -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 $rows 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test engine::codex_host::|^test result|panicked|waited' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 2 failed' "$RUNNER_TEMP/red.log"
          for row in $names; do
            grep -q "$row \.\.\. FAILED" "$RUNNER_TEMP/red.log"
          done
          [ "$(grep -c 'the frame waited 20 s on a harness blocked on its unread output' "$RUNNER_TEMP/red.log")" -ge 2 ]
          echo "red as expected: without the fix both frames wait 20 s on a harness blocked on its unread output"
      - name: Build the Linux sandbox helper the custody rows start
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          ls -l target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
      - name: S1 r3 Codex host rows at the tip 65b2b21d0
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::codex_host:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test engine::codex_host::|^test result|panicked' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          if [ "$RUNNER_OS" = Windows ]; then
            grep -qE 'test result: ok\. 24 passed; 0 failed; 1 ignored' "$RUNNER_TEMP/tip.log"
          else
            grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/tip.log"
          fi
      - name: S1 r3 Codex host Windows rows, pump rows and the tree row five times at the tip
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set +e
          for round in 1 2 3 4 5; do
            cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::codex_host::process_windows_tests:: engine::codex_host::pump:: > "$RUNNER_TEMP/round-$round.log" 2>&1
            rc=$?
            echo "round $round rc=$rc"
            grep -E 'FAILED|panicked|^test result' "$RUNNER_TEMP/round-$round.log" || true
            [ "$rc" -eq 0 ] || exit 1
            grep -qE 'test result: ok\. 19 passed; 0 failed' "$RUNNER_TEMP/round-$round.log" || exit 1
            cargo test -p crazyagent-win-sandbox --lib --locked -- --test-threads 1 win::tree::tests:: > "$RUNNER_TEMP/tree-$round.log" 2>&1
            rc=$?
            echo "tree round $round rc=$rc"
            grep -E 'FAILED|panicked|^test result' "$RUNNER_TEMP/tree-$round.log" || true
            [ "$rc" -eq 0 ] || exit 1
            grep -qE 'test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/tree-$round.log" || exit 1
          done
      - name: Windows access refusal rows stay green at the tip
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 sandbox::policy::tests:: 2>&1 | tee "$RUNNER_TEMP/policy.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'windows|^test result' "$RUNNER_TEMP/policy.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
          grep -q 'full_access_on_windows_is_refused_with_its_own_reason_and_code \.\.\. ok' "$RUNNER_TEMP/policy.log"
