name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: 4dd5d206d1372fe378f9eebdf07c32cf041170ab
  RED_ROWS: >-
    sandbox::policy::tests::full_access_on_windows_is_refused_with_its_own_reason_and_code
    sandbox::policy::tests::a_windows_model_only_agent_with_tools_starts_no_proxy_and_reaches_the_models_port_on_any_host
    sandbox::policy::tests::on_windows_a_limited_network_choice_says_it_reaches_the_whole_internet
    sandbox::windows::tests::a_host_or_port_limit_widens_to_the_internet_client_and_a_loopback_port_is_refused
    sandbox::windows::tests::install_writes_the_profile_outside_the_roots_and_refuses_a_missing_helper

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows O3a/O2a rows, ${{ matrix.side }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        side: [red, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'red' && env.RED_SHA || github.sha }}
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rows, and clippy one target set per call on the green side
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/o3a-o2a-windows-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-run 2>&1 | tee -a "$out"
          built=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- sandbox::policy::tests sandbox::windows::tests 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          read -ra red <<< "$RED_ROWS"
          if [ "$SIDE" = red ]; then
            want=0
            for row in "${red[@]}"; do
              grep -q "^test $row \.\.\. FAILED" "$out" || { echo "::error::$row did not fail at the red commit"; want=1; }
            done
            grep -q "^test sandbox::policy::tests::each_platform_offers_only_the_levels_it_can_enforce \.\.\. ok" "$out" || { echo "::error::the platform levels row did not pass at the red commit"; want=1; }
            printf '| red side | exit |\n| --- | --- |\n| build | %s |\n| rows (the 5 red rows fail, the levels row passes) | %s |\n| expectation met (0 = yes) | %s |\n' "$built" "$rc" "$want" >> "$GITHUB_STEP_SUMMARY"
            exit "$want"
          fi
          for row in "${red[@]}"; do
            grep -q "^test $row \.\.\. ok" "$out" || { echo "::error::$row did not pass at the tip"; rc=1; }
          done
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --lib --locked -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --tests --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clipt=${PIPESTATUS[0]}
          printf '| green side | exit |\n| --- | --- |\n| build | %s |\n| rows | %s |\n| clippy --lib -D warnings | %s |\n| clippy --tests -D warnings | %s |\n' "$built" "$rc" "$clip" "$clipt" >> "$GITHUB_STEP_SUMMARY"
          [ "$built" = 0 ] && [ "$rc" = 0 ] && [ "$clip" = 0 ] && [ "$clipt" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-o3a-o2a-windows-${{ matrix.side }}
          path: ${{ runner.temp }}/o3a-o2a-windows-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux pure O3a/O2a rows and clippy, green side
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rows, then clippy, one target set per cargo call
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/o3a-o2a-linux.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-run 2>&1 | tee -a "$out"
          built=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- sandbox::policy::tests sandbox::linux_sockets_tests::the_windows_loopback_refusal_has_its_own_code_and_reads_plainly sandbox::linux_sockets_tests::the_strict_refusal config:: 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --lib --locked -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --tests --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clipt=${PIPESTATUS[0]}
          printf '| Linux | exit |\n| --- | --- |\n| build --lib --no-run | %s |\n| sandbox::policy + loopback and strict code rows + config | %s |\n| clippy --lib -D warnings | %s |\n| clippy --tests -D warnings | %s |\n' "$built" "$rc" "$clip" "$clipt" >> "$GITHUB_STEP_SUMMARY"
          [ "$built" = 0 ] && [ "$rc" = 0 ] && [ "$clip" = 0 ] && [ "$clipt" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-o3a-o2a-linux
          path: ${{ runner.temp }}/o3a-o2a-linux.txt
          if-no-files-found: warn
          retention-days: 14

  node:
    name: Desktop O3a/O2a rows, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: [red, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'red' && env.RED_SHA || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rows with TAP output, and typecheck on the green side
        working-directory: apps/desktop
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/o3a-o2a-node-$SIDE.txt"
          node --test --test-reporter=tap test/project-access.test.mjs test/settings-sandbox.test.mjs test/no-opaque-failures.test.mjs > "$out" 2>&1
          rc=$?
          cat "$out"
          fails=$(grep -E '^# fail ' "$out" | awk '{print $3}')
          row="on Windows Full access is refused with its own sentence"
          if [ "$SIDE" = red ]; then
            want=1
            [ "${fails:-0}" = 1 ] && grep -E '^not ok' "$out" | grep -qF "$row" && want=0
            printf '| red side | value |\n| --- | --- |\n| exit | %s |\n| failed rows (want 1, the Windows row) | %s |\n| expectation met (0 = yes) | %s |\n' "$rc" "${fails:-none}" "$want" >> "$GITHUB_STEP_SUMMARY"
            exit "$want"
          fi
          npm run typecheck > "$RUNNER_TEMP/typecheck.txt" 2>&1
          tc=$?
          cat "$RUNNER_TEMP/typecheck.txt"
          printf '| green side | value |\n| --- | --- |\n| rows exit | %s |\n| failed rows | %s |\n| typecheck | %s |\n' "$rc" "${fails:-none}" "$tc" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] && [ "$tc" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-o3a-o2a-node-${{ matrix.side }}
          path: ${{ runner.temp }}/o3a-o2a-node-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
