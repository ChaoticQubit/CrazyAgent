name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: c0d8861e4e
  TIP_FULL: c0d8861e4ec3d6985e8a172cdabdba2683ab3b0a
  PICK_FULL: e52ecc2c0c35ebdbfa6e5eb0eaa22edab00e2988

defaults:
  run:
    shell: bash

jobs:
  clippy:
    name: LANDING-UNCOMMITTED clippy at the tip on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='pick %H %s' HEAD^
          git log -1 --format='branch tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^)" = "$PICK_FULL" ] || { echo "::error::the parent is not the macOS-gate pick $PICK_FULL"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = "$TIP_FULL" ] || { echo "::error::the grandparent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the pick on the branch tip"; exit 1; }
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          cargo clippy -p crazyagent --lib --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "crazyagent lib clippy rc $code"
          exit $code
      - name: Clippy crazyagent tests
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-tests.log"
          cargo clippy -p crazyagent --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "crazyagent tests clippy rc $code"
          exit $code
