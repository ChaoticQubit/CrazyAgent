  windows-standard-user:
    name: Batch b38 Windows standard-user harness rows
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      GATE_USER: cagate
      ROW_ONE: a_standard_user_is_not_elevated_and_owns_what_it_makes
      ROW_TWO: a_standard_user_installs_checks_and_updates_an_npm_harness_into_the_engine_prefix
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$BATCH_TIP" ] || { echo "::error::HEAD^ is not the batch tip $BATCH_TIP"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Create the gate standard user and prove it before any build
        shell: pwsh
        env:
          GATE_STAGE: create
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [byte[]]::new(24)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $plain = 'Ca' + [Convert]::ToHexString($bytes) + 'z1!'
          Write-Output "::add-mask::$plain"
          $machine = "WinNT://$env:COMPUTERNAME"
          try {
            if ($env:GATE_STAGE -eq 'create') {
              $account = ([ADSI]$machine).Create('User', $env:GATE_USER)
              $account.SetPassword($plain)
              $account.SetInfo()
              ([ADSI]"$machine/Users,group").Add("$machine/$($env:GATE_USER),user")
            } else {
              ([ADSI]"$machine/$($env:GATE_USER),user").SetPassword($plain)
            }
          } catch {
            throw "the gate user's $($env:GATE_STAGE) step failed: $($_.Exception.InnerException.Message) $($_.Exception.Message)"
          }
          if ($env:GATE_STAGE -eq 'create') {
            New-Item -ItemType Directory -Force C:\gate | Out-Null
            icacls C:\gate /grant "$($env:GATE_USER):(OI)(CI)M" | Out-Null
          }
          $admins = (net localgroup Administrators) -join ' '
          Write-Output "CASE administrators $admins"
          if ($admins -match "(^|\s|\\)$($env:GATE_USER)(\s|$)") { throw "$env:GATE_USER is an administrator" }
          $secure = ConvertTo-SecureString $plain -AsPlainText -Force
          $cred = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$env:GATE_USER", $secure)
          function Invoke-AsGateUser([string]$program, [string[]]$arguments, [string]$name) {
            $out = "C:\gate\$name.out"
            $err = "C:\gate\$name.err"
            $started = Get-Date
            $run = Start-Process -FilePath $program -ArgumentList $arguments -Credential $cred -LoadUserProfile -UseNewEnvironment -WorkingDirectory C:\gate -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
            foreach ($file in @($out, $err)) {
              if (Test-Path $file) { Get-Content $file | ForEach-Object { Write-Host "CASE $name $_" } }
            }
            Write-Host "ROW $name rc=$($run.ExitCode) seconds=$([int]((Get-Date) - $started).TotalSeconds)"
            $run.ExitCode
          }
          $code = Invoke-AsGateUser 'C:\Windows\System32\cmd.exe' @('/d', '/c', 'exit 7') 'exit-code'
          if ($code -ne 7) { throw "an exit code read back from the gate user is $code, not 7" }
          $null = Invoke-AsGateUser 'C:\Windows\System32\whoami.exe' @('/groups') 'whoami'
          $groups = Get-Content C:\gate\whoami.out -Raw
          if ($groups -notmatch 'Medium Mandatory Level') { throw 'the gate user does not run at medium integrity' }
          if ($groups -match 'S-1-5-32-544') { throw 'the gate user holds the Administrators group' }
          $null = Invoke-AsGateUser 'C:\Windows\System32\cmd.exe' @('/d', '/c', 'set') 'environment'
          $lines = Get-Content C:\gate\environment.out
          $userHome = ($lines | Where-Object { $_ -like 'USERPROFILE=*' }) -replace '^USERPROFILE=', ''
          $temp = ($lines | Where-Object { $_ -like 'TEMP=*' }) -replace '^TEMP=', ''
          $local = ($lines | Where-Object { $_ -like 'LOCALAPPDATA=*' }) -replace '^LOCALAPPDATA=', ''
          Write-Host "CASE gate profile=$userHome temp=$temp localappdata=$local"
          if (-not $userHome -or $userHome -notmatch "\\$($env:GATE_USER)") { throw 'the gate user runs with another account''s profile' }
          foreach ($folder in @($temp, $local)) {
            if (-not $folder.StartsWith($userHome, [StringComparison]::OrdinalIgnoreCase)) { throw "the gate user's $folder lies outside its profile" }
          }
          if ($env:GATE_STAGE -eq 'create') { exit 0 }
          $failed = $false
          foreach ($row in @($env:ROW_ONE, $env:ROW_TWO)) {
            $rc = Invoke-AsGateUser 'C:\gate\rows.exe' @('--ignored', '--exact', $row, '--test-threads=1', '--nocapture') $row
            $ran = Select-String -Path "C:\gate\$row.out" -Pattern '^test result: ok\. 1 passed' -Quiet
            if ($rc -ne 0 -or -not $ran) { Write-Host "::error::$row failed as the gate user (rc $rc)"; $failed = $true }
          }
          & C:\gate\rows.exe --ignored --exact $env:ROW_ONE --test-threads=1 *> C:\gate\control.log
          $control = $LASTEXITCODE
          Get-Content C:\gate\control.log | ForEach-Object { Write-Host "CASE control $_" }
          $refused = Select-String -Path C:\gate\control.log -Pattern 'this row runs only as a standard user' -Quiet
          Write-Host "ROW elevated-control $($env:ROW_ONE) rc=$control refused=$refused (must fail with the refusal)"
          if ($control -eq 0 -or -not $refused) { Write-Host '::error::the elevated control did not fail with its refusal, so the gate cannot read red'; $failed = $true }
          if ($failed) { exit 1 }
          exit 0
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
