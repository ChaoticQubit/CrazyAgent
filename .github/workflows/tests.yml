name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: HANDOVER-W1 Linux clippy and env rows on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 7
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe-only pick %H %s' HEAD^
          git log -1 --format='fix tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = 31bc87f6c060c1fcd50a0de1fd0f6a6d6d938122 ] || { echo "::error::the grandparent is not the W1 fix tip 31bc87f6c0"; exit 1; }
          [ "$(git rev-parse HEAD^)" = 524a4135fcae00501afeea764af800d5a05e7855 ] || { echo "::error::the parent is not the probe-only ef337e841 pick 524a4135fc"; exit 1; }
          [ "$(git rev-parse HEAD~6)" = 534867d75762eb89dd4255eca6f9ecf0dac18771 ] || { echo "::error::HEAD~6 is not b23 534867d757"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the pick on the fix tip"; exit 1; }
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent-kernel-sandbox
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-kernel-sandbox.log"
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked --keep-going --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "crazyagent-kernel-sandbox clippy rc $code"
          exit $code
      - name: Clippy crazyagent
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-crazyagent.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "crazyagent clippy rc $code"
          exit $code
      - name: Env rows on Linux
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/env-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked profile::env:: -- --test-threads 1 > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ tests|^test |panicked|test result|^error' "$log" | head -n 40 || true
          echo "env rows rc $code"
          exit $code
