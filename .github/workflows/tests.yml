name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  K1_TIP: a99786497
  H1_RED: 45685eb07
  H1_TIP: 9f266121a

defaults:
  run:
    shell: bash

jobs:
  h1:
    name: V244 K1 r2 at a99786497 and H1 Windows account home, red at 45685eb07, tip 9f266121a, on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the H1 tip
        run: |
          set -euo pipefail
          git diff --quiet "$H1_TIP" -- crates
          echo "crates at $H1_TIP"
      - name: Build the boundary helper beside the test binary
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/
          ls -l target/debug/crazyagent-win-boundary.exe
      - name: K1 r2 clippy on the crazyagent test rows at a99786497
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q --detach "$K1_TIP"
          git diff --quiet HEAD -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: K1 rows and the storage Windows rows at a99786497
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q --detach "$K1_TIP"
          git diff --quiet HEAD -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 storage::accounts::account_key_windows_tests:: storage::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/k1.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*(account_key_windows_tests|windows_tests)|^test result' "$RUNNER_TEMP/k1.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/k1.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 20 passed; 0 failed' "$RUNNER_TEMP/k1.log"
          for row in a_key_is_stored_read_replaced_and_removed_as_a_labelled_secret_file a_low_integrity_process_cannot_read_a_stored_key an_app_container_agent_cannot_read_a_key_inside_its_project a_swapped_key_file_or_key_folder_is_refused a_replace_while_the_key_is_read_fails_and_keeps_the_old_key a_key_name_windows_reads_as_another_file_is_refused an_account_key_is_read_privately_and_an_open_one_is_refused the_start_sweep_deletes_what_a_removal_left_noted; do
            grep -qE "${row} \.\.\. ok" "$RUNNER_TEMP/k1.log" || { echo "::error::$row did not pass"; exit 1; }
          done
          echo "K1 r2 at $K1_TIP: 20 of 20 rows pass, all 8 named key rows"
      - name: H1 red rows, the tip's rows over the red launch.rs at 45685eb07
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q --detach "$H1_TIP"
          git checkout -q "$H1_RED" -- crates/crazyagent/src/harnesses/launch.rs
          git diff --quiet "$H1_RED" -- crates/crazyagent/src/harnesses/launch.rs
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 harnesses::launch::home_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git checkout -q "$H1_TIP" -- crates/crazyagent/src/harnesses/launch.rs
          git diff --quiet "$H1_TIP" -- crates
          grep -E '^test .*home_windows_tests|^test result' "$RUNNER_TEMP/red.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 5 failed' "$RUNNER_TEMP/red.log"
          echo "red as expected: 5 of 5 H1 rows fail at the red stubs"
      - name: H1 clippy on the crazyagent library at 9f266121a
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q --detach "$H1_TIP"
          git diff --quiet HEAD -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: H1 clippy on the crazyagent test rows at 9f266121a
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q --detach "$H1_TIP"
          git diff --quiet HEAD -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: H1 rows, the shared low probe, the K1 rows and the storage Windows rows at 9f266121a
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q --detach "$H1_TIP"
          git diff --quiet HEAD -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 harnesses::launch::home_windows_tests:: harnesses::launch::low_probe:: storage::accounts::account_key_windows_tests:: storage::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*(home_windows_tests|low_probe|account_key_windows_tests|windows_tests)|^test result' "$RUNNER_TEMP/tip.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 25 passed; 0 failed' "$RUNNER_TEMP/tip.log"
          for row in the_home_judge_passes_only_the_user_the_system_owner_rights_and_containers the_home_judge_refuses_a_link_a_share_a_foreign_owner_and_a_low_label a_private_home_passes_and_an_open_linked_or_relative_one_is_refused the_profile_and_its_codex_and_claude_folders_are_forbidden_homes a_granted_home_passes_and_a_low_integrity_process_cannot_change_it a_key_is_stored_read_replaced_and_removed_as_a_labelled_secret_file a_low_integrity_process_cannot_read_a_stored_key an_app_container_agent_cannot_read_a_key_inside_its_project a_swapped_key_file_or_key_folder_is_refused a_replace_while_the_key_is_read_fails_and_keeps_the_old_key a_key_name_windows_reads_as_another_file_is_refused; do
            grep -qE "${row} \.\.\. ok" "$RUNNER_TEMP/tip.log" || { echo "::error::$row did not pass"; exit 1; }
          done
          echo "H1 at $H1_TIP: 25 of 25 rows pass, all 5 H1 and 6 K1 named rows"
