name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: bf985fddd
  BASE_SHA: 238ab31c7
  TIP_SHA: 13b5ff3bb

defaults:
  run:
    shell: bash

jobs:
  s3:
    name: V244 WIN-MASTER S3 master commands on ${{ matrix.runner }}, red at bf985fddd, tip 13b5ff3bb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: S3 red rows at bf985fddd
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$RED_SHA" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::windows_tests:: engine::owner::transport::master_host_launch::windows_command_tests:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git checkout -q "$TIP_SHA" -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test engine::|^test result|_unavailable' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 2 passed; 5 failed' "$RUNNER_TEMP/red.log"
          grep -q 'with_its_tools_on_stays_refused \.\.\. ok' "$RUNNER_TEMP/red.log"
          echo "red as expected: 5 build rows refused by the Windows stubs, the 2 tools-on rows already refused"
      - name: S3 Windows command rows at the tip 13b5ff3bb
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::windows_tests:: engine::owner::transport::master_host_launch::windows_command_tests:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test engine::|^test result|panicked' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 7 passed; 0 failed' "$RUNNER_TEMP/tip.log"
      - name: Windows access refusal rows stay green at the tip
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 sandbox::policy::tests:: 2>&1 | tee "$RUNNER_TEMP/policy.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'windows|^test result' "$RUNNER_TEMP/policy.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
          grep -q 'full_access_on_windows_is_refused_with_its_own_reason_and_code \.\.\. ok' "$RUNNER_TEMP/policy.log"
      - name: Build the Linux sandbox helper the Unix master rows start
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          ls -l target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
      - name: Unix master command rows at the base 238ab31c7 and at the tip 13b5ff3bb
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          rows() {
            set +e
            cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host:: engine::owner::transport::master_host_launch:: > "$RUNNER_TEMP/$1.log" 2>&1
            echo "$1 rc=$?"
            set -e
            grep -E '^test result' "$RUNNER_TEMP/$1.log" || true
            { grep -E ' \.\.\. FAILED$' "$RUNNER_TEMP/$1.log" || true; } | sed 's/^test //; s/ \.\.\. FAILED$//' | sort -u > "$RUNNER_TEMP/$1.failed"
          }
          git checkout -q "$BASE_SHA" -- crates
          rows base
          git checkout -q "$TIP_SHA" -- crates
          git diff --quiet "$TIP_SHA" -- crates
          rows tip
          echo "failed at the base:"; cat "$RUNNER_TEMP/base.failed"
          echo "failed at the tip:"; cat "$RUNNER_TEMP/tip.failed"
          grep -qE 'test result: (ok|FAILED)\. [1-9][0-9]* passed' "$RUNNER_TEMP/tip.log"
          new=$(comm -13 "$RUNNER_TEMP/base.failed" "$RUNNER_TEMP/tip.failed")
          [ -z "$new" ] || { echo "::error::rows failing at the tip only: $new"; exit 1; }
          echo "no row fails at the tip that passes at the base"
