name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    windows-rust-1 windows-rust-2 windows-rust-3

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-2022
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse a runner that is not X64
        run: |
          set -euo pipefail
          [ "$RUNNER_ARCH" = X64 ] || { echo "::error::the x64 twin runs only on windows-2022, got RUNNER_ARCH=$RUNNER_ARCH"; exit 1; }
          echo "PROCESSOR_ARCHITECTURE=${PROCESSOR_ARCHITECTURE:-unset}"
          command -v clang || echo "::warning::clang is not on PATH"
          if command -v clang >/dev/null; then clang --version | head -1; fi
          rustup --version
          df -h . || true
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Check that the engine and boundary binaries are x64
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rustc -vV
          node -e 'const fs=require("node:fs");for(const f of process.argv.slice(1)){const b=fs.readFileSync(f);const m=b.readUInt16LE(b.readUInt32LE(0x3c)+4);console.log(f+" machine 0x"+m.toString(16));if(m!==0x8664)process.exitCode=1}' target/debug/crazyagent.exe target/debug/crazyagent-landlock.exe target/debug/crazyagent-win-boundary.exe

  rust-windows:
    name: Rust ${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }}
    needs: build-windows
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
            part: 1
            parts: 3
          - os: windows
            runner: windows-2022
            part: 2
            parts: 3
          - os: windows
            runner: windows-2022
            part: 3
            parts: 3
    env:
      FARM_JUNIT: target/nextest/farm/junit.xml
      FARM_PART: ${{ matrix.os }}-rust-${{ matrix.part }}
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse a runner that is not X64
        run: |
          set -euo pipefail
          [ "$RUNNER_ARCH" = X64 ] || { echo "::error::the x64 twin runs only on windows-2022, got RUNNER_ARCH=$RUNNER_ARCH"; exit 1; }
          echo "PROCESSOR_ARCHITECTURE=${PROCESSOR_ARCHITECTURE:-unset}"
          command -v clang || echo "::warning::clang is not on PATH"
          if command -v clang >/dev/null; then clang --version | head -1; fi
          rustup --version
          df -h . || true
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-shard
        with:
          os: ${{ matrix.os }}
          part: ${{ matrix.part }}
          parts: ${{ matrix.parts }}
          node-version: ${{ env.NODE_VERSION }}

  report:
    name: Test farm report
    needs: [build-windows, rust-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: farm-junit-*
          path: ${{ runner.temp }}/junit
      - name: Write the summary table
        env:
          FARM_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/junit"
          node scripts/ci/junit-summary.mjs "$RUNNER_TEMP/junit" | tee -a "$GITHUB_STEP_SUMMARY"
