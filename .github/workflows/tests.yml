name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win-git-program-probe:
    name: What Git for Windows runs for each signature program and ssh command value ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Plant a marker false.exe where a lookup could find one, then run git per value, repo on C and on D
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $git = 'C:\Program Files\Git\cmd\git.exe'
          & $git --version
          "PATH false: " + ((Get-Command false -All -ErrorAction SilentlyContinue | ForEach-Object Source) -join ', ')
          $t = $env:RUNNER_TEMP
          $marker = Join-Path $t 'marker.exe'
          $src = Join-Path $t 'marker.rs'
          $code = "fn main() {`n    let me = std::env::current_exe().unwrap();`n    let args: Vec<String> = std::env::args().collect();`n    let _ = std::fs::write(me.with_extension(`"ran`"), format!(`"{}\t{}`", me.display(), args.join(`" `")));`n    std::process::exit(1);`n}`n"
          [IO.File]::WriteAllText($src, $code)
          rustc -O $src -o $marker
          if ($LASTEXITCODE -ne 0) { throw 'marker build failed' }
          $pathdir = Join-Path $t 'pathdir'
          $fixed = @('C:\usr\bin\false.exe', 'D:\usr\bin\false.exe', 'C:\usr\bin\false', 'D:\usr\bin\false', 'C:\dev\null.exe', 'D:\dev\null.exe', (Join-Path $pathdir 'false.exe'))
          function Plant([string[]]$paths) {
            foreach ($p in $paths) {
              New-Item -ItemType Directory -Force (Split-Path $p) | Out-Null
              Copy-Item $marker $p -Force
            }
          }
          Plant $fixed
          $values = @('/usr/bin/false', '/dev/null', 'false', 'nul', 'C:/Windows/System32/crazyagent-none.exe', 'C:/Program Files/Git/usr/bin/false.exe')
          function New-Fixture([string]$base) {
            $repo = Join-Path $base 'owner'
            $homeDir = Join-Path $base 'home'
            New-Item -ItemType Directory -Force $repo, $homeDir | Out-Null
            $env:HOME = $homeDir
            & $git -C $repo init -q --template= | Out-Null
            $empty = Join-Path $base 'empty'
            [IO.File]::WriteAllBytes($empty, [byte[]]@())
            $tree = (& $git -C $repo hash-object -t tree -w $empty).Trim()
            $p = 'Owner <owner@example.invalid> 1700000000 +0000'
            $commits = @{}
            foreach ($armor in 'ssh', 'pgp', 'x509') {
              $b, $e = switch ($armor) {
                'ssh' { '-----BEGIN SSH SIGNATURE-----', '-----END SSH SIGNATURE-----' }
                'pgp' { '-----BEGIN PGP SIGNATURE-----', '-----END PGP SIGNATURE-----' }
                'x509' { '-----BEGIN SIGNED MESSAGE-----', '-----END SIGNED MESSAGE-----' }
              }
              $f = Join-Path $base "c-$armor.txt"
              [IO.File]::WriteAllText($f, "tree $tree`nauthor $p`ncommitter $p`ngpgsig $b`n `n U0lHTkFUVVJF`n $e`n`nSigned subject`n")
              $commits[$armor] = (& $git -C $repo hash-object -t commit -w $f).Trim()
            }
            $signers = Join-Path $base 'allowed_signers'
            [IO.File]::WriteAllText($signers, '')
            & $git -C $repo config gpg.ssh.allowedSignersFile $signers
            Plant @((Join-Path $repo 'false.exe'), (Join-Path $repo 'usr\bin\false.exe'), (Join-Path $repo 'dev\null.exe'))
            return @{ repo = $repo; commits = $commits }
          }
          function Ran([string]$repo) {
            $all = $fixed + @((Join-Path $repo 'false.exe'), (Join-Path $repo 'usr\bin\false.exe'), (Join-Path $repo 'dev\null.exe'))
            $found = @()
            foreach ($p in $all) {
              $m = [IO.Path]::ChangeExtension($p, 'ran')
              if (Test-Path $m) { $found += (Get-Content $m -Raw).Split("`t")[0]; Remove-Item $m -Force }
            }
            return (($found | Sort-Object -Unique) -join ', ')
          }
          function Probe([string]$label, [string]$repo, [string[]]$gitArgs) {
            $null = Ran $repo
            $env:GIT_TRACE = Join-Path $t 'trace.txt'
            if (Test-Path $env:GIT_TRACE) { Remove-Item $env:GIT_TRACE -Force }
            $saved = $env:PATH
            $env:PATH = "$pathdir;$saved"
            Push-Location $repo
            & $git @gitArgs > (Join-Path $t 'out.txt') 2> (Join-Path $t 'err.txt')
            $rc = $LASTEXITCODE
            Pop-Location
            $env:PATH = $saved
            Remove-Item Env:GIT_TRACE
            $ran = Ran $repo
            $out = ((Get-Content (Join-Path $t 'out.txt') -ErrorAction SilentlyContinue) -join ' | ')
            $err = ((Get-Content (Join-Path $t 'err.txt') -TotalCount 2 -ErrorAction SilentlyContinue) -join ' | ')
            $trace = ((Select-String -Path (Join-Path $t 'trace.txt') -Pattern 'run_command|start_command' -ErrorAction SilentlyContinue | Select-Object -Skip 0 -First 2 | ForEach-Object { ($_.Line -split 'trace: ')[-1] }) -join ' | ')
            "$label rc=$rc ran=[$ran] out=[$out] err=[$err] trace=[$trace]"
          }
          foreach ($drive in @(@{ name = 'C'; base = (Join-Path $env:USERPROFILE 'gp') }, @{ name = 'D'; base = (Join-Path $t 'gp') })) {
            $fx = New-Fixture $drive.base
            "== repo on $($drive.name): $($fx.repo)"
            foreach ($value in $values) {
              foreach ($armor in 'ssh', 'pgp', 'x509') {
                $repo = $fx.repo; $commit = $fx.commits[$armor]; & $git -C $repo update-ref HEAD $commit
                Probe "sig drive=$($drive.name) armor=$armor value=$value" $fx.repo @('-c', "gpg.program=$value", '-c', "gpg.x509.program=$value", '-c', "gpg.ssh.program=$value", 'log', '--show-signature', '-1', '--format=%s')
              }
              Probe "ssh drive=$($drive.name) value=$value" $fx.repo @('-c', "core.sshCommand=$value", 'ls-remote', 'ssh://example.invalid/x')
            }
          }
