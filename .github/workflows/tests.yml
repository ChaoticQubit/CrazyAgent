name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  BASE_SHA: f5cedbd834b0ac3a08da73b0a2cfff0719ec1c9e
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  TMUX_ROW: a_pane_holds_only_its_declared_environment_whatever_the_engine_and_server_hold
  MASTER_ROWS: the_tui_saves_a_master_harness_that_waits_for_the_masters_next_start the_tui_saves_a_master_harness_that_reaches_the_master_once_it_is_idle
  SIGN_IN_ROWS: a_claude_code_below_its_sign_in_minimum_updates_from_the_tui_then_signs_in a_codex_below_its_sign_in_minimum_updates_from_the_tui_then_signs_in

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux G1 tui reds, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        side: [base, fix]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the side and apply the diagnostic patch
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          cp .github/farm/g1-linux-diag.patch "$RUNNER_TEMP/diag.patch"
          if [ "$SIDE" = base ]; then git checkout --detach "$BASE_SHA"; fi
          git apply "$RUNNER_TEMP/diag.patch"
          git log --oneline -1
          git diff --stat
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Claude Code and Codex
        run: bash scripts/ci/install-harnesses.sh
      - name: Machine and harness facts
        run: |
          set -uo pipefail
          set +e
          nproc
          free -m
          echo "TMPDIR=${TMPDIR:-unset} HOME=$HOME"
          command -v tmux script
          for file in "$CRAZYAGENT_CLAUDE" "$CRAZYAGENT_CODEX"; do
            ls -laL "$file"
            /usr/bin/time -f "%e s to sha256 $file" sha256sum "$file"
          done
      - name: Build the two test binaries
        run: cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --no-run --test terminal_tmux --test e2e_tui
      - name: Rows, alone and under load, with the diagnostic log
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          export CA_DIAG_DIR="$RUNNER_TEMP/diag"
          mkdir -p "$CA_DIAG_DIR"
          out="$RUNNER_TEMP/g1-tui-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          for run in 1 2 3; do
            echo "== tmux row, run $run" | tee -a "$out"
            cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --test terminal_tmux -- --exact "$TMUX_ROW" 2>&1 | tee -a "$out"
          done
          read -ra master <<< "$MASTER_ROWS"
          read -ra sign_in <<< "$SIGN_IN_ROWS"
          echo "== master rows alone" | tee -a "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --test e2e_tui -- --exact "${master[@]}" --test-threads 1 2>&1 | tee -a "$out"
          echo "== master rows with every core hashing the farm Claude Code" | tee -a "$out"
          load=()
          for core in $(seq "$(nproc)"); do
            ( while :; do sha256sum "$CRAZYAGENT_CLAUDE" > /dev/null; done ) &
            load+=("$!")
          done
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --test e2e_tui -- --exact "${master[@]}" --test-threads 1 2>&1 | tee -a "$out"
          kill "${load[@]}"
          echo "== sign-in rows" | tee -a "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --test e2e_tui -- --exact "${sign_in[@]}" --test-threads 1 2>&1 | tee -a "$out"
          echo "== diagnostic log" | tee -a "$out"
          cat "$CA_DIAG_DIR/diag.log" 2>&1 | tee -a "$out"
          grep -E "^test .* \.\.\. |^== " "$out" > "$RUNNER_TEMP/rows.txt"
          { echo '| row | result |'; echo '| --- | --- |'; sed -E 's/^(.*) \.\.\. (.*)$/| \1 | \2 |/' "$RUNNER_TEMP/rows.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-g1-tui-${{ matrix.side }}
          path: ${{ runner.temp }}/g1-tui-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
