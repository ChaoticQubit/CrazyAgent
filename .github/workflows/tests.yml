name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 6f0aa9fd56d187c476990d9578cd04d03b702575
  BASE: c6f139883806b94c9f7e3ea9d8c5ee3529081ea8
  FILES: crates/crazyagent/src/tui/screens/project_page_tests.rs crates/crazyagent/src/tui/test_home.rs scripts/quality/caps-allow.json
  RED7: |
    tui::screens::project_page_tests::a_creation_run_in_the_background_finishes_after_its_page_is_gone
    tui::screens::project_page_tests::a_draft_refused_while_another_wizard_is_open_is_kept_ahead_of_that_wizards_draft
    tui::screens::project_page_tests::a_made_project_starts_its_github_publish_once_its_pool_is_assigned_and_says_its_reply
    tui::screens::project_page_tests::a_project_folder_the_engine_cannot_make_says_why_in_the_wizard
    tui::screens::project_page_tests::create_while_a_move_holds_the_job_waits_its_turn_and_is_made_once_the_move_stops
    tui::screens::project_page_tests::the_team_settings_screen_reads_the_harness_catalog_and_saves_the_picked_master
    tui::screens::project_page_tests::the_wizard_creates_a_real_project_assigns_its_pool_and_opens_it
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$name.txt"
    echo "$name FAILED $(wc -l < "$RUNNER_TEMP/failed-$name.txt" | tr -d ' '):"
    cat "$RUNNER_TEMP/failed-$name.txt"
    awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass) [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red7)
        printf '%s' "$RED7" | sed '/^$/d' | sort > "$RUNNER_TEMP/red7.txt"
        [ "$rc" != 0 ] && [ "$listed" = 10 ] && [ "$failed" = 7 ] && diff -q "$RUNNER_TEMP/red7.txt" "$RUNNER_TEMP/failed-$name.txt" >/dev/null || { echo "::error::$name is not the 7 rows red and 3 green"; exit 1; } ;;
      *) echo "::error::unknown expectation $expect"; exit 1 ;;
    esac
  ROWS: |
    tui::screens::project_page_tests::a_creation_run_in_the_background_finishes_after_its_page_is_gone
    tui::screens::project_page_tests::a_draft_refused_while_another_wizard_is_open_is_kept_ahead_of_that_wizards_draft
    tui::screens::project_page_tests::a_made_project_starts_its_github_publish_once_its_pool_is_assigned_and_says_its_reply
    tui::screens::project_page_tests::a_project_folder_the_engine_cannot_make_says_why_in_the_wizard
    tui::screens::project_page_tests::a_project_page_counts_its_own_change_sets_and_the_rest_as_other_projects
    tui::screens::project_page_tests::create_while_a_move_holds_the_job_waits_its_turn_and_is_made_once_the_move_stops
    tui::screens::project_page_tests::the_status_line_counts_the_change_sets_that_wait_for_the_owner
    tui::screens::project_page_tests::the_team_settings_screen_reads_the_harness_catalog_and_saves_the_picked_master
    tui::screens::project_page_tests::the_tools_page_switches_real_tools_and_ignores_reads_for_another_scope
    tui::screens::project_page_tests::the_wizard_creates_a_real_project_assigns_its_pool_and_opens_it

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: PROJECT-PAGE-CODEX-STUB base red then tip on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the ticket tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE" ] || { echo "::error::HEAD~2 is not chore/v250 c6f1398838"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/crazyagent/src/tui/screens/project_page_tests.rs crates/crazyagent/src/tui/test_home.rs
          echo "rustfmt rc 0"
      - name: Line caps and sleeps at the base and the tip (expect no file new to the problem list, sleeps rc 0)
        run: |
          set +e
          set -uo pipefail
          p() { grep -E '^[^ ]+: [0-9]+ lines' "$1" | cut -d: -f1 | sort; }
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; tip=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1; stip=$?
          git checkout "$BASE" -- crates scripts || exit 1
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; base=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-base.txt" 2>&1; sbase=$?
          git checkout HEAD^ -- crates scripts || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          new=$(comm -13 <(p "$RUNNER_TEMP/caps-base.txt") <(p "$RUNNER_TEMP/caps-tip.txt") | wc -l | tr -d ' ')
          comm -13 <(p "$RUNNER_TEMP/caps-base.txt") <(p "$RUNNER_TEMP/caps-tip.txt")
          echo "caps base rc $base problems $(p "$RUNNER_TEMP/caps-base.txt" | wc -l | tr -d ' ') tip rc $tip problems $(p "$RUNNER_TEMP/caps-tip.txt" | wc -l | tr -d ' ') new $new; project_page_tests lines at tip $(grep -c project_page_tests "$RUNNER_TEMP/caps-tip.txt")"
          echo "sleeps base rc $sbase tip rc $stip"
          [ "$new" = 0 ] && [ "$stip" = 0 ]
      - name: Build crazyagent-landlock (as the b25 job does)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          test -x "$CARGO_TARGET_DIR/debug/crazyagent-landlock"
          echo "landlock helper built"
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ]
      - name: Red, the 10 rows at the base (expect the 7 red, the 3 green)
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        run: |
          set +e
          git checkout "$BASE" -- crates scripts || exit 1
          git diff --quiet "$BASE" -- crates scripts || { echo "::error::the tree is not the base"; exit 1; }
          mapfile -t rows < <(printf '%s' "$ROWS" | sed '/^$/d')
          bash "$RUNNER_TEMP/rows.sh" base red7 --exact "${rows[@]}"
          rc=$?
          git checkout HEAD^ -- crates scripts || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "red leg rc $rc"
          [ "$rc" = 0 ]
      - name: Tip, the 10 rows (expect all green)
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        run: |
          set +e
          mapfile -t rows < <(printf '%s' "$ROWS" | sed '/^$/d')
          bash "$RUNNER_TEMP/rows.sh" tip pass --exact "${rows[@]}"
      - name: Tip, every project_page_tests row (expect all green)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          bash "$RUNNER_TEMP/rows.sh" project-page pass tui::screens::project_page_tests::
