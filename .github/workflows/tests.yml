name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  cm-engine-node-macos:
    name: context-mode engine Node probe on macos-15 with setup-node at dabb10f16, the probe row x3, the npm link row x3, the context_mode module
    runs-on: macos-15
    timeout-minutes: 200
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      TIP: dabb10f1616bc994183ab312cd21466ef4288c71
      PROBE: context_mode::tests::the_engine_s_own_node_passes_the_node_check_and_starts_npm_under_the_install_profile
      NPMROW: context_mode::tests::npm_linked_into_its_package_outside_every_granted_root_starts_under_the_install_profile
      MODULE: "context_mode::"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux 3.8"
      - name: State the runner node and its folders
        run: |
          set -euo pipefail
          id
          npm=$(command -v npm)
          echo "node $(node --version) npm $npm -> $(realpath "$npm")"
          walk=$(realpath "$(command -v node)")
          while [ "$walk" != / ]; do
            stat -f 'node path %Sp %Su:%Sg %N' "$walk"
            walk=$(dirname "$walk")
          done
      - name: Build the tip lib tests
        if: ${{ !cancelled() }}
        timeout-minutes: 110
        run: |
          set +e
          set -u
          out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
          rc=$?
          echo "tip lib build rc=$rc"
          printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300
          [ "$rc" -eq 0 ] || exit 1
          lib=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)
          test -n "$lib" || { echo "no lib test executable in the build output"; exit 1; }
          realpath "$lib" > "$RUNNER_TEMP/lib-tip"
          echo "tip lib $(cat "$RUNNER_TEMP/lib-tip")"
      - name: The probe and npm link rows at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          set -u
          lib=$(cat "$RUNNER_TEMP/lib-tip")
          bad=0
          for row in "$PROBE" "$NPMROW"; do
            passed=0
            failed=0
            for i in 1 2 3; do
              log="$RUNNER_TEMP/tip-${row##*::}-$i.log"
              "$lib" --exact "$row" > "$log" 2>&1
              if grep -qx "test $row ... ok" "$log"; then
                passed=$((passed + 1))
              elif grep -qx "test $row ... FAILED" "$log"; then
                failed=$((failed + 1))
                grep -m1 -A12 "panicked at" "$log" | cut -c1-1500
              else
                echo "  no result line in run $i"
                tail -8 "$log" | cut -c1-300
              fi
            done
            echo "ROW ${row##*::} at tip: $passed ok, $failed failed of 3"
            [ "$passed" -eq 3 ] || bad=1
          done
          "$lib" "$MODULE" > "$RUNNER_TEMP/module-tip.log" 2>&1
          rc=$?
          echo "MODULE at tip rc=$rc $(grep -m1 '^test result' "$RUNNER_TEMP/module-tip.log" | cut -c1-160)"
          grep '^test .* FAILED$' "$RUNNER_TEMP/module-tip.log"
          [ "$rc" -eq 0 ] || bad=1
          echo "tip verdict bad=$bad"
          exit "$bad"
