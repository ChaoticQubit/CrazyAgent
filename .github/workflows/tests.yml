name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 63eaa5181c995d61529f4c44f9b18a4970be0cbb
  FIX: cfe0f02bc8561f2463d39a42005288877a29be43
  BASE: 3d3992d3f37f3f50bccb3f81d09bf779050818c4
  FILES: "crates/crazyagent/src/tui/frames/plugins-80.txt crates/crazyagent/src/tui/screens/settings_plugins.rs crates/crazyagent/src/tui/screens/settings_plugins/tests.rs crates/crazyagent/src/tui/screens/settings_plugins/tests/skill_origin.rs scripts/quality/caps-allow.json "
  FRAME_ROW: tui::screens::settings_plugins::tests::plugin_frames_match_the_design
  ROWS_SH: |
    set +e
    set -uo pipefail
    name="$1"; want="$2"; filter="$3"; count="$4"
    log="$RUNNER_TEMP/rows-$name.log"
    cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
    code=$?
    grep -E '^test .* \.\.\. |^test result|panicked at|^thread |differs:$|^row [0-9]+$|^ want \||^ got  \|' "$log" | head -n 120
    passed=$(grep -cE '^test .* \.\.\. ok$' "$log" || true)
    failed=$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)
    ran=$((passed + failed))
    echo "rows $name filter $filter want $want rc $code ran $ran passed $passed failed $failed"
    if [ "$want" = pass ]; then
      [ "$code" = 0 ] && [ "$failed" = 0 ] && { { [ "$count" = any ] && [ "$ran" -ge 1 ]; } || [ "$ran" = "$count" ]; }
    else
      [ "$code" != 0 ] && [ "$ran" = "$count" ] && [ "$failed" = "$count" ]
    fi


defaults:
  run:
    shell: bash

jobs:
  linux:
    name: PLUGINS-FRAME-ROW21 crazyagent clippy, rustfmt, Plugins and skills rows and caps on ubuntu-22.04, red then tip
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='PLUGINS-FRAME-ROW21 tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$FIX" ] || { echo "::error::HEAD~2 is not the fix commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE" ] || { echo "::error::HEAD~3 is not the b25 tip"; exit 1; }
          [ "$(git diff --name-only HEAD~3 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the 80 and 120 frame row at the b25 tip (expect 1 row, failed)
        timeout-minutes: 60
        run: |
          set +e
          set -uo pipefail
          git checkout "$BASE" -- crates scripts || exit 1
          git diff --name-only --diff-filter=A "$BASE" HEAD^ -- crates scripts | while read -r added; do git rm -q -f -- "$added" || exit 1; done || exit 1
          git diff --quiet "$BASE" -- crates scripts || { echo "::error::the red tree is not the b25 tip"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" red red "$FRAME_ROW" 1
          rc=$?
          git checkout HEAD^ -- crates scripts || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "red leg rc $rc"
          [ "$rc" = 0 ]
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          rustfmt --edition 2024 --check crates/crazyagent/src/tui/screens/settings_plugins.rs crates/crazyagent/src/tui/screens/settings_plugins/tests.rs crates/crazyagent/src/tui/screens/settings_plugins/tests/skill_origin.rs
          code=$?
          echo "rustfmt rc $code"
          [ "$code" = 0 ]
      - name: Line caps at the tip against the base (expect no new problem file, no new settings_plugins line)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          git worktree add --detach "$RUNNER_TEMP/caps-base" "$BASE" || exit 1
          node scripts/quality/caps.mjs "$RUNNER_TEMP/caps-base" 2> "$RUNNER_TEMP/caps-base.txt"
          base_rc=$?
          node scripts/quality/caps.mjs 2> "$RUNNER_TEMP/caps-tip.txt"
          tip_rc=$?
          for name in base tip; do echo "caps $name problems:"; sed '$d' "$RUNNER_TEMP/caps-$name.txt"; done
          for name in base tip; do sed '$d' "$RUNNER_TEMP/caps-$name.txt" | awk '{print $1}' | sort -u > "$RUNNER_TEMP/caps-$name-files.txt"; done
          new=$(comm -13 "$RUNNER_TEMP/caps-base-files.txt" "$RUNNER_TEMP/caps-tip-files.txt" | tee "$RUNNER_TEMP/caps-new.txt" | wc -l | tr -d ' ')
          page_base=$(grep -c 'settings_plugins' "$RUNNER_TEMP/caps-base.txt" || true)
          page=$(grep -c 'settings_plugins' "$RUNNER_TEMP/caps-tip.txt" || true)
          echo "new vs base:"; cat "$RUNNER_TEMP/caps-new.txt"
          echo "caps base rc $base_rc problems $(wc -l < "$RUNNER_TEMP/caps-base-files.txt" | tr -d ' ') tip rc $tip_rc problems $(wc -l < "$RUNNER_TEMP/caps-tip-files.txt" | tr -d ' ') new $new settings_plugins lines base $page_base tip $page"
          [ "$new" = 0 ] && [ "$page" -le "$page_base" ]
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          grep -E '^ +(Checking|Compiling) crazyagent v' "$log" || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the frame row 5x (expect 1 row, pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          rc=0
          for run in 1 2 3 4 5; do bash "$RUNNER_TEMP/rows.sh" "tip-$run" pass "$FRAME_ROW" 1 || rc=1; done
          [ "$rc" = 0 ]
      - name: Tip, every Plugins and skills page row (expect all pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          bash "$RUNNER_TEMP/rows.sh" settings_plugins pass tui::screens::settings_plugins:: any
      - name: Tip, every App plugins TUI row (expect all pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          bash "$RUNNER_TEMP/rows.sh" app_plugins_tui pass tui::screens::settings::app_plugins:: any
