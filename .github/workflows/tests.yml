name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: dbd890eb02
  CHORE_FULL: c6f1398838
  SPECS: >-
    lib@team::runtime::tests::run_time::an_unset_run_time_stops_the_live_master_after_seven_days_without_the_owner,team::runtime::tests::run_time::a_one_day_run_time_stops_the_live_master_after_a_day_without_the_owner,team::runtime::tests::run_time::a_three_day_run_time_stops_the_live_master_after_three_days_without_the_owner,team::runtime::tests::run_time::a_seven_day_run_time_stops_the_live_master_after_seven_days_without_the_owner,team::runtime::tests::run_time::a_fourteen_day_run_time_stops_the_live_master_after_fourteen_days_without_the_owner,team::runtime::tests::run_time::a_thirty_day_run_time_stops_the_live_master_after_thirty_days_without_the_owner,team::master::tests::view_keys::only_a_views_focus_and_mouse_reports_are_not_pressed_keys,team::events::tests::quoted_breaks::each_of_the_seven_breaks_opens_a_quoted_line,usage::capture::tests::fifo_record::a_record_that_is_a_fifo_is_skipped_without_waiting_for_a_writer,tui::screens::settings_harnesses::tests::engine_line::u_shows_the_line_the_engine_has_now_not_the_one_read_when_the_page_opened
    master_session@pool_authority::master_worker_only_or_wrong_project_pool_cannot_authorize_a_leader
    projects_home@git_entry::a_copy_of_a_folder_whose_git_entry_cannot_be_read_is_a_linked_checkout_in_either_check
  RUST_FILES: >-
    crates/crazyagent/src/team/runtime/tests.rs crates/crazyagent/src/team/runtime/tests/run_time.rs crates/crazyagent/src/team/master/tests.rs crates/crazyagent/src/team/master/tests/view_keys.rs crates/crazyagent/src/team/events/tests.rs crates/crazyagent/src/team/events/tests/quoted_breaks.rs crates/crazyagent/src/usage/capture/tests.rs crates/crazyagent/src/usage/capture/tests/fifo_record.rs crates/crazyagent/src/team/events.rs crates/crazyagent/src/team/events/wake_default.rs crates/crazyagent/src/tui/screens/settings_harnesses/tests.rs crates/crazyagent/src/tui/screens/settings_harnesses/tests/engine_line.rs crates/crazyagent/tests/master_session.rs crates/crazyagent/tests/master_session/pool_authority.rs crates/crazyagent/tests/projects_home.rs crates/crazyagent/tests/projects_home/git_entry.rs

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: CAPS-MOVES-10-18 moved rows and clippy on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the caps tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~10)" = "$CHORE_FULL" ] || { echo "::error::HEAD~10 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the caps tip"; exit 1; }
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Touch the crate so a restored cache cannot skip it
        run: |
          set -euo pipefail
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
      - name: Moved rows by exact name
        timeout-minutes: 120
        run: |
          set +e
          fail=0
          for spec in $SPECS; do
            target="$(echo "$spec" | cut -d@ -f1)"
            names="$(echo "$spec" | cut -d@ -f2 | tr ',' ' ')"
            want="$(echo "$names" | tr ' ' '\n' | sort)"
            log="$RUNNER_TEMP/rows-$target.log"
            read -r -a filters <<< "$names"
            if [ "$target" = lib ]; then
              cargo test -p crazyagent --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
            else
              cargo test -p crazyagent --locked --test "$target" -- --exact "${filters[@]}" > "$log" 2>&1
            fi
            code=$?
            built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
            echo "BUILT crazyagent $target $built"
            [ "$built" -gt 0 ] || { echo "::error::crazyagent was not compiled for $target, the cache was read as fresh"; fail=1; }
            grep -E '^running [0-9]+ test|^test |test result:|panicked at|^thread ' "$log" || true
            ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED|ignored)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            got="$(grep -E '^test [a-z_0-9:]+ \.\.\. ok$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            echo "ROWS $target rc $code wanted $(echo "$want" | wc -l | tr -d ' ') ok $(printf '%s' "$got" | grep -c .)"
            [ "$code" = 0 ] && [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::$target rows differ from the want list: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
          done
          exit "$fail"
      - name: Clippy crazyagent lib and tests
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/crazyagent/src/lib.rs
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 200 || true
          tail -n 5 "$log"
          echo "macos clippy rc $code"
          exit $code

  linux:
    name: CAPS-MOVES-10-18 clippy lib strict and tests on the moved files on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the caps tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~10)" = "$CHORE_FULL" ] || { echo "::error::HEAD~10 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the caps tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent --lib --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "linux clippy lib rc $code"
          exit $code
      - name: Clippy crazyagent tests, failing only on the moved files or a missing module file
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-tests.log"
          touch crates/crazyagent/src/lib.rs
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          missing="$(grep -cE 'E0583|file not found for module' "$log")"
          echo "linux tests clippy rc $code moved-file lints $moved missing-module $missing"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] && [ "$missing" = 0 ] || { echo "::error::a lint or a missing module in the moved files"; exit 1; }

  windows:
    name: CAPS-MOVES-10-18 clippy lib strict and tests on the moved files on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the caps tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~10)" = "$CHORE_FULL" ] || { echo "::error::HEAD~10 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the caps tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          touch crates/crazyagent/src/lib.rs
