name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
    snapshot_v242/every_model_server_scenario_matches_its_2_4_2_capture
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3 macos-model-servers
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  probe-tmuxold-windows:
    name: Probe TMUX-OLD clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Run clippy on crazyagent tests at the ticket tip, keeping going
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set -uo pipefail
          tip=64b0ad0834
          logs="$RUNNER_TEMP/probe"
          mkdir -p "$logs"
          step() {
            local label=$1 rc=0
            shift
            "$@" > "$logs/$label.log" 2>&1 || rc=$?
            cat "$logs/$label.log"
            echo "$rc" > "$logs/$label.rc"
            echo "== $label rc $rc"
          }
          git checkout -q --detach "$tip" || { echo "::error::checkout $tip"; exit 1; }
          echo "== at $(git rev-parse --short=10 HEAD)"
          step fetch cargo fetch --locked
          step kclippy cargo clippy -p crazyagent-kernel-processes --tests --locked --offline --keep-going -- -D warnings
          step clippy cargo clippy -p crazyagent --tests --locked --offline --keep-going -- -D warnings
          echo "== verdicts"
          bad=0
          want() { if [ "$2" = "$3" ]; then echo "ok $1"; else echo "::error::$1: got $2, want $3"; bad=1; fi; }
          count() { grep -cE "$2" "$logs/$1.log" || true; }
          yes_if() { [ "$1" -ge 1 ] && echo yes || echo no; }
          echo "crate lines: $(count clippy '(Checking|Compiling) crazyagent v')"
          echo "error lines: $(count clippy '^error')"
          want "fetch rc" "$(cat "$logs/fetch.rc")" 0
          want "clippy rc" "$(cat "$logs/clippy.rc")" 0
          want "clippy checked the crate" "$(yes_if "$(count clippy '(Checking|Compiling) crazyagent v')")" yes
          want "kernel clippy rc" "$(cat "$logs/kclippy.rc")" 0
          want "kernel clippy checked the crate" "$(yes_if "$(count kclippy '(Checking|Compiling) crazyagent-kernel-processes v')")" yes
          exit "$bad"

  probe-tmuxold-linux:
    name: Probe TMUX-OLD clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsqlite3-dev libssl-dev
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Run clippy on crazyagent tests at the ticket tip, keeping going
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set -uo pipefail
          tip=64b0ad0834
          logs="$RUNNER_TEMP/probe"
          mkdir -p "$logs"
          step() {
            local label=$1 rc=0
            shift
            "$@" > "$logs/$label.log" 2>&1 || rc=$?
            cat "$logs/$label.log"
            echo "$rc" > "$logs/$label.rc"
            echo "== $label rc $rc"
          }
          git checkout -q --detach "$tip" || { echo "::error::checkout $tip"; exit 1; }
          echo "== at $(git rev-parse --short=10 HEAD)"
          step fetch cargo fetch --locked
          step kclippy cargo clippy -p crazyagent-kernel-processes --tests --locked --offline --keep-going -- -D warnings
          step clippy cargo clippy -p crazyagent --tests --locked --offline --keep-going -- -D warnings
          echo "== verdicts"
          bad=0
          want() { if [ "$2" = "$3" ]; then echo "ok $1"; else echo "::error::$1: got $2, want $3"; bad=1; fi; }
          count() { grep -cE "$2" "$logs/$1.log" || true; }
          yes_if() { [ "$1" -ge 1 ] && echo yes || echo no; }
          echo "crate lines: $(count clippy '(Checking|Compiling) crazyagent v')"
          echo "error lines: $(count clippy '^error')"
          want "fetch rc" "$(cat "$logs/fetch.rc")" 0
          want "clippy rc" "$(cat "$logs/clippy.rc")" 0
          want "clippy checked the crate" "$(yes_if "$(count clippy '(Checking|Compiling) crazyagent v')")" yes
          want "kernel clippy rc" "$(cat "$logs/kclippy.rc")" 0
          want "kernel clippy checked the crate" "$(yes_if "$(count kclippy '(Checking|Compiling) crazyagent-kernel-processes v')")" yes
          exit "$bad"
