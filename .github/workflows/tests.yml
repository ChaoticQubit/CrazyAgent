name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  admin-a-linux:
    name: 3a A Linux, pure ACL rows red then green, wording and context-mode rows at the tip
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        shell: bash
        run: |
          set -euo pipefail
          tip=431a10752439c4b528a66bcb35788a41ea1e5df8
          git merge-base --is-ancestor "$tip" HEAD
          test "$(git diff --name-only "$tip" HEAD)" = .github/workflows/tests.yml
          git checkout "$tip" -- .github/workflows/tests.yml
          git diff --quiet "$tip"
      - name: Install Linux build packages
        timeout-minutes: 10
        shell: bash
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - name: Install Claude Code and Codex as the shard does
        shell: bash
        run: bash scripts/ci/install-harnesses.sh
      - name: Pure ACL rows red at the red commit, green at the tip
        id: pure
        timeout-minutes: 30
        shell: bash
        run: |
          set +e -uo pipefail
          red=d35e24e37
          rows="with_allow_adds_one_24_byte_entry_after_the_explicit_entries_and_keeps_every_other_byte holds_allow_counts_a_plain_allow_on_the_object_itself_that_covers_the_rights without_allow_takes_out_only_the_entries_byte_equal_to_the_added_one with_allow_then_without_allow_gives_back_the_original_bytes with_allow_refuses_a_list_that_would_pass_the_size_limit"
          git checkout "$red" -- crates/crazyagent-win-sandbox || exit 1
          cargo test -p crazyagent-win-sandbox --lib --locked --no-run || { echo "RED BUILD FAILED"; exit 1; }
          cargo test -p crazyagent-win-sandbox --lib --locked dacl::tests:: > "$RUNNER_TEMP/red.txt" 2>&1
          rc=$?
          tail -40 "$RUNNER_TEMP/red.txt"
          [ "$rc" -ne 0 ] || { echo "RED RUN PASSED, expected failures"; exit 1; }
          for row in $rows; do
            grep -q "dacl::tests::$row \.\.\. FAILED" "$RUNNER_TEMP/red.txt" || { echo "RED: $row did not fail"; exit 1; }
          done
          echo "red ok: 5 rows failed at $red"
          git checkout HEAD -- crates/crazyagent-win-sandbox || exit 1
          git diff --quiet HEAD || exit 1
          cargo test -p crazyagent-win-sandbox --lib --locked --no-run || exit 1
          cargo test -p crazyagent-win-sandbox --lib --locked > "$RUNNER_TEMP/green.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/green.txt" | head -20
          [ "$rc" -eq 0 ] || exit 1
          for row in $rows; do
            grep -q "dacl::tests::$row \.\.\. ok" "$RUNNER_TEMP/green.txt" || { echo "GREEN: $row not ok"; exit 1; }
          done
          echo "green ok: win-sandbox lib at the tip"
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          date -u '+lib build start %H:%M:%S'
          cargo test -p crazyagent --lib --locked --no-run
          date -u '+lib build end %H:%M:%S'
      - name: Engine rows at the tip, wording and context-mode
        id: engine
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        shell: bash
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- plugins::tests::a_check_on_a tui::screens::settings_plugins::tests::a_check_on_a launch_context::tests::a_launch_that_left_context_mode_out_says_why_in_its_tools_section > "$RUNNER_TEMP/engine.txt" 2>&1
          rc=$?
          grep -E "^test |^test result|panicked" "$RUNNER_TEMP/engine.txt" | grep -v " ok$" | head -40
          grep -c " \.\.\. ok$" "$RUNNER_TEMP/engine.txt"
          for row in plugins::tests::a_check_on_a_drive_root_windows_sandboxes_cannot_read_names_the_administrator_step plugins::tests::a_check_on_a_node_folder_windows_sandboxes_cannot_read_says_so_in_one_sentence tui::screens::settings_plugins::tests::a_check_on_a_drive_root_windows_sandboxes_cannot_read_reads_the_engine_words tui::screens::settings_plugins::tests::a_check_on_a_node_folder_windows_sandboxes_cannot_read_reads_the_engine_words launch_context::tests::a_launch_that_left_context_mode_out_says_why_in_its_tools_section; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/engine.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"

  admin-a-win-sandbox:
    name: 3a A win-sandbox ${{ matrix.runner }}, drive-root check rows red then green
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        shell: bash
        run: |
          set -euo pipefail
          tip=431a10752439c4b528a66bcb35788a41ea1e5df8
          git merge-base --is-ancestor "$tip" HEAD
          test "$(git diff --name-only "$tip" HEAD)" = .github/workflows/tests.yml
          git checkout "$tip" -- .github/workflows/tests.yml
          git diff --quiet "$tip"
      - name: Show the system drive root's list
        shell: pwsh
        run: |
          icacls "$env:SystemDrive\"
          Write-Host "USERNAME $env:USERNAME"
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
      - name: Drive-root rows red at the red commit, green at the tip
        timeout-minutes: 60
        shell: bash
        run: |
          set +e -uo pipefail
          red=e6e1b3579
          rows="a_paths_drive_root_is_its_last_ancestor_in_the_same_form the_system_drive_keeps_access_lists_asked_by_either_root a_list_without_read_attributes_for_every_app_container_keeps_them_out the_drive_root_check_names_a_root_whose_list_keeps_app_containers_out"
          git checkout "$red" -- crates/crazyagent-win-sandbox || exit 1
          cargo test -p crazyagent-win-sandbox --lib --locked --no-run || { echo "RED BUILD FAILED"; exit 1; }
          cargo test -p crazyagent-win-sandbox --lib --locked win::owner::tests:: > "$RUNNER_TEMP/red.txt" 2>&1
          rc=$?
          tail -40 "$RUNNER_TEMP/red.txt"
          [ "$rc" -ne 0 ] || { echo "RED RUN PASSED, expected failures"; exit 1; }
          for row in $rows; do
            grep -q "win::owner::tests::$row \.\.\. FAILED" "$RUNNER_TEMP/red.txt" || { echo "RED: $row did not fail"; exit 1; }
          done
          echo "red ok: 4 rows failed at $red"
          git checkout HEAD -- crates/crazyagent-win-sandbox || exit 1
          git diff --quiet HEAD || exit 1
          cargo test -p crazyagent-win-sandbox --lib --locked --no-run || exit 1
          cargo test -p crazyagent-win-sandbox --lib --locked -- --test-threads 1 win::owner::tests:: dacl::tests:: > "$RUNNER_TEMP/green.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked|system drive root keeps" "$RUNNER_TEMP/green.txt" | head -30
          [ "$rc" -eq 0 ] || exit 1
          for row in $rows; do
            grep -q "win::owner::tests::$row \.\.\. ok" "$RUNNER_TEMP/green.txt" || { echo "GREEN: $row not ok"; exit 1; }
          done
          cargo test -p crazyagent-win-sandbox --lib --locked > "$RUNNER_TEMP/all.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/all.txt" | head -20
          exit "$rc"

  admin-a-windows-engine:
    name: 3a A Windows engine, context-mode rows and the drive-root refusal with the runner's Node.js
    runs-on: windows-2022
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        shell: bash
        run: |
          set -euo pipefail
          tip=431a10752439c4b528a66bcb35788a41ea1e5df8
          git merge-base --is-ancestor "$tip" HEAD
          test "$(git diff --name-only "$tip" HEAD)" = .github/workflows/tests.yml
          git checkout "$tip" -- .github/workflows/tests.yml
          git diff --quiet "$tip"
      - name: Install SQLite for Windows
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
      - name: Build the boundary helper beside the tests, as the shard archive does
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Build the engine library tests
        id: lib
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          date -u '+lib build start %H:%M:%S'
          cargo test -p crazyagent --lib --locked --no-run
          date -u '+lib build end %H:%M:%S'
      - name: Context-mode rows and the drive-root refusal
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        shell: bash
        run: |
          set +e -uo pipefail
          icacls "$SYSTEMDRIVE\\" || true
          echo "node $(command -v node) $(node -v)"
          cargo test -p crazyagent --lib --locked -- context_mode:: plugins::tests::a_check_on_a > "$RUNNER_TEMP/rows.txt" 2>&1
          rc=$?
          grep -E "^test |^test result|panicked" "$RUNNER_TEMP/rows.txt" | grep -v " ok$" | head -40
          grep -c " \.\.\. ok$" "$RUNNER_TEMP/rows.txt"
          cargo test -p crazyagent --lib --locked -- --ignored --exact context_mode::windows_tests::a_drive_root_no_app_container_reads_refuses_the_install_by_its_own_code > "$RUNNER_TEMP/drive.txt" 2>&1
          drive=$?
          grep -E "^test |^test result|panicked|context_mode_drive_root_refused|assert" "$RUNNER_TEMP/drive.txt" | head -20
          [ "$drive" -eq 0 ] || rc=1
          grep -q "a_drive_root_no_app_container_reads_refuses_the_install_by_its_own_code \.\.\. ok" "$RUNNER_TEMP/drive.txt" || rc=1
          exit "$rc"
