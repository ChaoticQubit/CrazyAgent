name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: engine_rows at ${{ matrix.tree }} on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tree: [base, fix]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Check out the tree under test
        env:
          TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = bc2b792970b2f1bc79a36b80ad2d76072b2e61aa ] || { echo "::error::the parent is not the ef337e841 pick on the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = 6aaa0dadbb5f249713dbb01d378b647b37805c67 ] || { echo "::error::the grandparent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD~6)" = 25373789a82ef6ca344b395b6b62f5124f4277dd ] || { echo "::error::HEAD~6 is not b23 25373789a8"; exit 1; }
          git diff HEAD^^ HEAD^ > "$RUNNER_TEMP/pick.diff"
          if [ "$TREE" = base ]; then
            git checkout -q 25373789a82ef6ca344b395b6b62f5124f4277dd
            git apply "$RUNNER_TEMP/pick.diff"
          else
            git checkout -q HEAD^
          fi
          git log -1 --format="tree $TREE at %H %s"
          git status --short | head -n 20
          git --version
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Kernel sandbox engine rows with their panic blocks
        timeout-minutes: 60
        env:
          TREE: ${{ matrix.tree }}
        run: |
          set +e
          log="$RUNNER_TEMP/engine-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- linux::launch::engine_rows --test-threads 1 > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ tests|^test .* \.\.\. |test result|^error' "$log" | head -n 80 || true
          echo "panic blocks:"
          grep -A4 'panicked at' "$log" | head -n 120 || true
          tail -n 3 "$log"
          echo "engine_rows at $TREE rc $code"
          exit $code
