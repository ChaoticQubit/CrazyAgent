name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  N6_TIP: a8f15b5bd
  W1_RED: 235373a25
  W1_FIRST_GREEN: 925cc023a
  N6_BASE: 731aea438
  CALLER_FILTERS: >-
    engine::bootstrap::held::tests::
    storage::windows_tests::
    storage::accounts::account_key_windows_tests::
    harnesses::launch::home_windows_tests::
    engine::owner::transport::root_windows_tests::
    engine::owner::transport::key_windows_tests::

defaults:
  run:
    shell: bash

jobs:
  n6-w1:
    name: V244 N6 W1 r2, red win/private.rs at 235373a25, row 5 at 925cc023a, tip a8f15b5bd, on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Keep the row checkers outside the tree
        run: |
          set -euo pipefail
          cp .github/farm/v244-win-signin-n6-w1-rows.sh "$RUNNER_TEMP/rows.sh"
          cp .github/farm/v244-win-signin-n6-w1-callers.sh "$RUNNER_TEMP/callers.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the N6 W1 tip
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          git diff --quiet "$N6_BASE" "$N6_TIP" -- Cargo.lock
          rustc --version
          echo "crates at $N6_TIP, Cargo.lock equal to $N6_BASE"
      - name: N6 W1 red, the tip's rows over the red win/private.rs at 235373a25
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$W1_RED" -- crates/crazyagent-win-sandbox/src/win/private.rs
          set +e
          cargo test -p crazyagent-win-sandbox --test private_windows --locked -- --test-threads 1 > "$RUNNER_TEMP/red.log" 2>&1
          set -e
          git checkout -q "$N6_TIP" -- crates/crazyagent-win-sandbox/src/win/private.rs
          git diff --quiet "$N6_TIP" -- crates
          bash "$RUNNER_TEMP/rows.sh" red "$RUNNER_TEMP/red.log"
      - name: N6 W1 row 5 over the first green win/private.rs at 925cc023a, a trailing dot or space reaches the rename
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$W1_FIRST_GREEN" -- crates/crazyagent-win-sandbox/src/win/private.rs
          set +e
          cargo test -p crazyagent-win-sandbox --test private_windows --locked -- --test-threads 1 --exact a_rename_name_that_is_not_one_component_trips_the_assertion > "$RUNNER_TEMP/row5.log" 2>&1
          set -e
          git checkout -q "$N6_TIP" -- crates/crazyagent-win-sandbox/src/win/private.rs
          git diff --quiet "$N6_TIP" -- crates
          bash "$RUNNER_TEMP/rows.sh" row5 "$RUNNER_TEMP/row5.log"
      - name: Clippy on crazyagent-win-sandbox, all targets, at a8f15b5bd
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy on the crazyagent library at a8f15b5bd
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows at a8f15b5bd
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: N6 W1 private rows at a8f15b5bd
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          set +e
          cargo test -p crazyagent-win-sandbox --test private_windows --locked -- --test-threads 1 > "$RUNNER_TEMP/tip.log" 2>&1
          set -e
          bash "$RUNNER_TEMP/rows.sh" tip "$RUNNER_TEMP/tip.log"
      - name: Windows crazyagent rows that open through W1, at a8f15b5bd
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N6_TIP" -- crates
          read -r -a filters <<< "$CALLER_FILTERS"
          cargo test -p crazyagent --lib --locked -- --list "${filters[@]}" > "$RUNNER_TEMP/callers.list" 2>/dev/null
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 "${filters[@]}" > "$RUNNER_TEMP/callers.log" 2>&1
          set -e
          bash "$RUNNER_TEMP/callers.sh" "$RUNNER_TEMP/callers.list" "$RUNNER_TEMP/callers.log" "${filters[@]}"
