name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "26.12.1"
  TIP_FULL: d919867e9a39824b73048255ba2265fc5013fa44
  RED_FULL: 815bad4ff3f25ead4b3bf41bd6e8d9a91604f415
  BASE_FULL: ee844fc1e8dcc49cef9e193efd4551292623b11e
  FIX_RS: "apps/desktop/src-tauri/src/bridge/owner_setup.rs apps/desktop/src-tauri/src/restore.rs"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: B07-CR1 ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
          - os: windows-2022
            leg: win
            cache: Windows
          - os: macos-15
            leg: mac
            cache: macOS
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip (the fix commit)"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not chore/v250 ee844fc1e8"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Desktop frontend for the crate's generated context (npm ci, build)
        id: front
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          ls dist/index.html
      - name: e2e bridge routes are generated from the tip (expect the generator test fail 0)
        if: ${{ !cancelled() && steps.front.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        working-directory: apps/desktop
        run: |
          set +e
          node --test --test-reporter=tap test/native/bridge-routes.test.mjs > "$RUNNER_TEMP/routes.log" 2>&1
          code=$?
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/routes.log" || true
          fail="$(grep -E '^# fail ' "$RUNNER_TEMP/routes.log" | awk '{print $3}' || true)"
          echo "routes generator rc $code fail ${fail:-none}"
          [ "$code" = 0 ] && [ "$fail" = 0 ] || exit 1
      - name: caps and sleeps ratchets at the base and the tip (expect sleeps rc 0 both; no tip caps problem missing at the base, none naming a ticket file)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          ct=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          st=$?
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL" > /dev/null 2>&1
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs) > "$RUNNER_TEMP/caps-base.txt" 2>&1
          cb=$?
          (cd "$RUNNER_TEMP/base" && node scripts/quality/sleeps.mjs) > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          sb=$?
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-tip.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-tip-files.txt" || true
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-base.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-base-files.txt" || true
          git diff --name-only "$BASE_FULL" HEAD^ | sort > "$RUNNER_TEMP/ticket-files.txt"
          new="$(comm -23 <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-tip.txt" | sort) <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-base.txt" | sort) | grep -c . || true)"
          ticket="$(comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" | grep -c . || true)"
          tail -n 1 "$RUNNER_TEMP/caps-tip.txt"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt"
          tail -n 1 "$RUNNER_TEMP/sleeps-tip.txt"
          comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" || true
          echo "caps rc tip $ct base $cb problems tip $(grep -c . "$RUNNER_TEMP/caps-tip-files.txt") base $(grep -c . "$RUNNER_TEMP/caps-base-files.txt") new-at-tip $new on-ticket-files $ticket sleeps rc tip $st base $sb"
          [ "$st" = 0 ] && [ "$sb" = 0 ] && [ "$ticket" = 0 ] && [ "$new" = 0 ] || exit 1
      - name: rustfmt of the desktop crate (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-desktop
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy desktop crate lib and tests with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.front.outcome == 'success' && matrix.os != 'macos-15' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-desktop.log"
          cargo clippy -p crazyagent-desktop --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-desktop v' "$log" || true)"
          echo "clippy desktop rc $code errors $errors warnings $warnings gate crazyagent-desktop $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: clippy of the e2e bridge binary that carries the generated route (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.front.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-e2e.log"
          cargo clippy -p crazyagent-desktop --features e2e-bridge --bin desktop-e2e-bridge --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-desktop v' "$log" || true)"
          echo "clippy e2e bridge rc $code errors $errors warnings $warnings gate crazyagent-desktop $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: side-by-side bridge rows at the tip on the Unix legs (expect both rows ok, failed 0, crate gate)
        if: ${{ !cancelled() && steps.front.outcome == 'success' && matrix.os != 'windows-2022' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows-tip.log"
          cargo test -p crazyagent-desktop --locked --test bridge_reads_side_by_side > "$log" 2>&1
          code=$?
          grep -E '^test .* (ok|FAILED)$|panicked at|^  left|^ right' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          a="$(grep -cE '^test an_overview_s_reads_side_by_side_are_all_served_by_the_engine( - should panic)? \.\.\. ok$' "$log" || true)"
          b="$(grep -cE '^test the_log_compaction_read_is_served_while_another_read_holds_the_bridge( - should panic)? \.\.\. ok$' "$log" || true)"
          g0="$(grep -cE '^ +Compiling crazyagent-desktop v' "$log" || true)"
          echo "tip rows rc $code failed $failed overview-ok $a compaction-ok $b gate crazyagent-desktop $g0"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$a" = 1 ] && [ "$b" = 1 ] && [ "$g0" -ge 1 ] || exit 1
      - name: Red on the Unix legs, the red commit's owner_setup.rs and restore.rs (expect the compaction row FAILED with busy, the overview row ok)
        if: ${{ !cancelled() && steps.front.outcome == 'success' && matrix.os != 'windows-2022' }}
        timeout-minutes: 90
        run: |
          set +e
          read -r -a files <<< "$FIX_RS"
          git checkout "$RED_FULL" -- "${files[@]}"
          git diff --cached --stat HEAD^ | tail -n 1
          sleep 2
          touch "${files[@]}"
          log="$RUNNER_TEMP/rows-red.log"
          cargo test -p crazyagent-desktop --locked --test bridge_reads_side_by_side > "$log" 2>&1
          code=$?
          grep -E '^test .* (ok|FAILED)$|^  left|^ right|^error(\[|:)' "$log" | head -n 20 || true
          a="$(grep -cE '^test an_overview_s_reads_side_by_side_are_all_served_by_the_engine \.\.\. ok$' "$log" || true)"
          b="$(grep -cE '^test the_log_compaction_read_is_served_while_another_read_holds_the_bridge \.\.\. FAILED$' "$log" || true)"
          busy="$(grep -cF 'Err("busy")' "$log" || true)"
          g0="$(grep -cE '^ +Compiling crazyagent-desktop v' "$log" || true)"
          echo "red rows rc $code overview-ok $a compaction-FAILED $b busy $busy gate crazyagent-desktop $g0"
          [ "$code" != 0 ] && [ "$a" = 1 ] && [ "$b" = 1 ] && [ "$busy" -ge 1 ] && [ "$g0" -ge 1 ] || exit 1
