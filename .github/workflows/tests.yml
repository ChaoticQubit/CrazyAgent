name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  modules-69-linux:
    name: 7 storage-busy rows and the routed resolver row alone x10 vs in the filter, with and without the keyring, chore/v243 8a3fec973, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TIP: 8a3fec97383a266417279aa926d69f91d85dacf0
      MODULES: "engine::owner::transport:: storage:: project_setup:: projects_home::"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows alone x10 and in the filter, without and with the keyring
        timeout-minutes: 200
        run: |
          set -u +e +o pipefail
          rows=(
            engine::owner::transport::owner_deadline_tests::a_skill_import_slower_than_the_owner_deadline_answers_with_the_skill
            engine::owner::transport::secret_storage_wait_tests::a_checked_server_removed_while_storage_is_busy_leaves_no_check_folder
            engine::owner::transport::secret_storage_wait_tests::a_server_added_with_secrets_while_storage_is_busy_is_withdrawn_with_every_one_of_them
            engine::owner::transport::secret_storage_wait_tests::a_server_removed_while_storage_is_busy_leaves_none_of_its_secrets_on_disk
            engine::owner::transport::secret_storage_wait_tests::a_server_secret_removed_while_storage_is_busy_leaves_no_file_on_disk
            engine::owner::transport::secret_storage_wait_tests::a_server_secret_replaced_while_storage_is_busy_is_withdrawn_and_keeps_only_the_old_one
            engine::owner::transport::secret_storage_wait_tests::an_account_removed_while_storage_is_busy_leaves_no_key_on_disk
          )
          resolver=a_routed_agent_looks_names_up_through_the_sandbox_resolver
          plain() { "$@"; }
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          build() {
            out=$(cargo "$@" 2>&1)
            rc=$?
            echo "cargo $* rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300 >&2
            printf '%s\n' "$out"
            return "$rc"
          }
          out=$(build test -p crazyagent --lib --locked --no-run) || exit 1
          lib=$(realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)")
          out=$(build test -p crazyagent --test linux_sandbox --locked --no-run) || exit 1
          sandbox=$(realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable tests\/linux_sandbox.rs (\(.*\))/\1/p' | tail -1)")
          [ -f "$lib" ] && [ -f "$sandbox" ] || { echo "::error::a test binary was not found"; exit 1; }
          build build -p crazyagent --bin crazyagent --locked > /dev/null || exit 1
          build build -p crazyagent --bin crazyagent-landlock --locked > /dev/null || exit 1
          rm -f target/debug/deps/crazyagent-landlock
          ls -la target/debug/crazyagent target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock 2>&1 | sed 's/^/  bins: /'
          export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent"
          echo "lib $lib"
          echo "linux_sandbox $sandbox"
          block() {
            printf '%s\n' "$1" | grep -A8 'panicked at' | head -12 | cut -c1-300 | sed 's/^/        /'
          }
          alone() {
            wrap=$1
            for row in "${rows[@]}"; do
              fails=0
              shown=0
              for i in $(seq 1 10); do
                out=$($wrap "$lib" --exact "$row" 2>&1)
                rc=$?
                printf '%s\n' "$out" | grep -q 'running 1 test' || echo "      $row: not exactly one test"
                if [ "$rc" -ne 0 ]; then
                  fails=$((fails + 1))
                  if [ "$shown" -eq 0 ]; then block "$out"; shown=1; fi
                fi
              done
              echo "    alone $wrap ${row##*::} fails=$fails/10"
            done
          }
          infilter() {
            wrap=$1
            out=$($wrap "$lib" $MODULES 2>&1)
            rc=$?
            echo "    filter $wrap rc=$rc $(printf '%s\n' "$out" | grep -m1 'test result' | cut -c1-110)"
            printf '%s\n' "$out" | grep '^test .* FAILED$' | sed 's/^test //; s/ \.\.\. FAILED$//' | sort | sed 's/^/      failed /'
            printf '%s\n' "$out" | awk '
              /^---- .* stdout ----$/ { name=$2; n=split(name, part, "::"); mod=part[n-1]; want=0; next }
              /panicked at/ && name != "" { sub(/.*panicked at /, ""); place=$0; want=1; next }
              want == 1 { print mod " | " place " | " substr($0, 1, 170); want=0; name="" }
            ' | sort | uniq -c | sort -rn | head -20 | sed 's/^/      message /'
          }
          for wrap in plain keyring; do
            echo "== storage-busy rows, $wrap"
            alone "$wrap"
            infilter "$wrap"
          done
          echo "== resolver row host"
          uname -r
          readlink -f /etc/resolv.conf
          grep -v '^#' /etc/resolv.conf | sed 's/^/  resolv: /'
          systemctl is-active systemd-resolved 2>&1 | sed 's/^/  resolved: /'
          echo "== resolver row alone x10"
          fails=0
          first=""
          for i in $(seq 1 10); do
            out=$("$sandbox" --exact "$resolver" 2>&1)
            rc=$?
            printf '%s\n' "$out" | grep -q 'running 1 test' || echo "  $resolver: not exactly one test"
            if [ "$rc" -ne 0 ]; then
              fails=$((fails + 1))
              [ -n "$first" ] || first=$out
            fi
          done
          echo "  alone $resolver fails=$fails/10"
          if [ -n "$first" ]; then
            echo "  first failing run, full output:"
            printf '%s\n' "$first" | tail -80 | cut -c1-400 | sed 's/^/    /'
          fi
          echo "== resolver row in the full linux_sandbox run"
          out=$("$sandbox" 2>&1)
          echo "  full rc=$? $(printf '%s\n' "$out" | grep -m1 'test result' | cut -c1-110)"
          printf '%s\n' "$out" | grep '^test .* FAILED$' | sed 's/^/    /'
          printf '%s\n' "$out" | awk -v row="$resolver" '$0 ~ "^---- " row " stdout ----$" {take=40} take > 0 {print "    " substr($0, 1, 400); take--}'
      - name: Kernel log and memory after the run
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE "oom|killed process|out of memory|landlock|apparmor=\"DENIED\"" | tail -30 || true
