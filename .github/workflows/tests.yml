name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 875b1805cfaf1646184e7d482e2dffe15a4886e3
  BASE_FULL: ec22db84c2445d37322e1515f2ff372454ef1275

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: SAVE-QUIT tip, the two save rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -12 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~3^2)" = "$BASE_FULL" ] || { echo "::error::the merge under the tip does not merge chore ec22db84c2"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: The two later-save rows (expect rc 0, crate gate, 2 listed, 2 ok, 2 passed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          list="$RUNNER_TEMP/list.log"
          cargo test --locked -p crazyagent --lib sdk_slice::tests::a_later_ -- --nocapture > "$log" 2>&1
          code=$?
          grep -E '^test sdk_slice::|^test result|panicked at|^  left|^ right|^error(\[|:)' "$log" | head -n 40 || true
          gate="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          ok="$(grep -cE '^test sdk_slice::tests::a_later_(quit|sandbox)_save_compiles_no_sql \.\.\. ok$' "$log" || true)"
          result="$(grep -cE '^test result: ok\. 2 passed; 0 failed' "$log" || true)"
          cargo test --locked -p crazyagent --lib sdk_slice::tests::a_later_ -- --list > "$list" 2>&1
          listed="$(grep -cE '^sdk_slice::tests::a_later_(quit|sandbox)_save_compiles_no_sql: test$' "$list" || true)"
          grep -E ': test$' "$list" || true
          echo "rows ubuntu-22.04 rc $code gate crazyagent $gate listed $listed ok $ok result $result"
          [ "$code" = 0 ] && [ "$gate" -ge 1 ] && [ "$listed" = 2 ] && [ "$ok" = 2 ] && [ "$result" = 1 ] || exit 1

  windows:
    name: SAVE-QUIT tip, the two save rows on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~3^2)" = "$BASE_FULL" ] || { echo "::error::the merge under the tip does not merge chore ec22db84c2"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: The two later-save rows (expect rc 0, crate gate, 2 listed, 2 ok, 2 passed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          list="$RUNNER_TEMP/list.log"
          cargo test --locked -p crazyagent --lib sdk_slice::tests::a_later_ -- --nocapture > "$log" 2>&1
          code=$?
          grep -E '^test sdk_slice::|^test result|panicked at|^  left|^ right|^error(\[|:)' "$log" | head -n 40 || true
          gate="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          ok="$(grep -cE '^test sdk_slice::tests::a_later_(quit|sandbox)_save_compiles_no_sql \.\.\. ok$' "$log" || true)"
          result="$(grep -cE '^test result: ok\. 2 passed; 0 failed' "$log" || true)"
          cargo test --locked -p crazyagent --lib sdk_slice::tests::a_later_ -- --list > "$list" 2>&1
          listed="$(grep -cE '^sdk_slice::tests::a_later_(quit|sandbox)_save_compiles_no_sql: test$' "$list" || true)"
          grep -E ': test$' "$list" || true
          echo "rows windows-2022 rc $code gate crazyagent $gate listed $listed ok $ok result $result"
          [ "$code" = 0 ] && [ "$gate" -ge 1 ] && [ "$listed" = 2 ] && [ "$ok" = 2 ] && [ "$result" = 1 ] || exit 1
