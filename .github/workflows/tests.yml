name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  a30-windows:
    name: ASK-0030 ${{ matrix.name }} on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tip clippy and changed rows
            rev: a76440b7e4
            expect: green
            clippy: "yes"
            rows: |
              crazyagent|--lib|harnesses::update::windows_tests::
          - name: W-TRUST red
            rev: b1a12718c4
            expect: report
            clippy: "no"
            rows: |
              crazyagent-win-sandbox|--test program_judge|
              crazyagent-win-sandbox|--test program_windows|
              crazyagent|--lib|harnesses::update::windows_tests::
          - name: W-TRUST second-name red
            rev: ae7fd82f08
            expect: report
            clippy: "no"
            rows: |
              crazyagent-win-sandbox|--test program_judge|
              crazyagent-win-sandbox|--test program_windows|
          - name: W-RUN npm.cmd red
            rev: 5362256da5
            expect: report
            clippy: "no"
            rows: |
              crazyagent-kernel-processes|--lib|finding::windows_tests::npm_runs_by_its_layout_and_only_with_its_own_script
          - name: W-RUN runner and elevation red
            rev: ab8c85649d
            expect: report
            clippy: "no"
            rows: |
              crazyagent-win-sandbox|--test program_windows|
              crazyagent|--lib|harnesses::update::windows_tests::
              crazyagent|--lib|harnesses::update::run::windows_tests::
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the revision this entry proves
        env:
          REV: ${{ matrix.rev }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$REV"
          echo "CASE head $(git rev-parse HEAD)"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Clippy each touched crate with warnings denied
        if: ${{ matrix.clippy == 'yes' }}
        run: |
          set -euo pipefail
          for target in "crazyagent-win-sandbox --tests" "crazyagent-kernel-processes --lib --tests" "crazyagent --lib --tests"; do
            read -r -a words <<< "$target"
            crate="${words[0]}"
            started=$(date +%s)
            cargo clippy --locked -p "$crate" "${words[@]:1}" -- -D warnings 2>&1 | tee "clippy-$crate.log"
            built=$(grep -c -E "^ *(Checking|Compiling) $crate v" "clippy-$crate.log" || true)
            echo "CASE clippy $crate built=$built seconds=$(( $(date +%s) - started ))"
            [ "$built" -ge 1 ] || { echo "::error::clippy never checked $crate"; exit 1; }
          done
      - name: Run the rows this entry names
        if: ${{ !cancelled() }}
        env:
          ROWS: ${{ matrix.rows }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set +e
          set -uo pipefail
          failed=0
          number=0
          while IFS='|' read -r crate target filter; do
            [ -n "$crate" ] || continue
            number=$((number + 1))
            log="row-$number.log"
            started=$(date +%s)
            read -r -a kind <<< "$target"
            only=()
            if [ -n "$filter" ]; then only=("$filter"); fi
            cargo test --locked -p "$crate" "${kind[@]}" -- "${only[@]}" > "$log" 2>&1
            rc=$?
            ran=$(grep -E '^running [0-9]+ tests?$' "$log" | tail -1 || true)
            echo "ROW $crate $target $filter rc=$rc $ran seconds=$(( $(date +%s) - started ))"
            grep -E '^test .* \.\.\. (ok|FAILED|ignored)' "$log" | sed 's/^/CASE /' || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -120 || true
            if [ "$rc" != 0 ] && ! grep -q -E '^running [0-9]+ tests?$' "$log"; then
              tail -40 "$log"
            fi
            [ "$rc" = 0 ] || failed=1
          done <<< "$ROWS"
          if [ "$EXPECT" = green ] && [ "$failed" != 0 ]; then
            exit 1
          fi
