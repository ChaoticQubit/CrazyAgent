name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  verbatim-script:
    name: V250-WIN-NODE-VERBATIM-SCRIPT ${{ matrix.name }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tip clippy and rows
            runner: windows-2022
            rev: df0b6056d9
            expect: green
            clippy: "yes"
            mutate: ""
            rows: |
              crazyagent-kernel-processes|--lib|finding::windows_tests::
              crazyagent|--lib|harnesses::interactive::windows_tests::
              crazyagent|--lib|harnesses::update::windows_tests::
              crazyagent|--lib|harnesses::update::state::windows_tests::
              crazyagent|--lib|tools::windows_tests::
          - name: red before the plain script word
            runner: windows-2022
            rev: b3791d08bd
            expect: report
            clippy: "no"
            mutate: ""
            rows: |
              crazyagent-kernel-processes|--lib|finding::windows_tests::
              crazyagent|--lib|harnesses::interactive::windows_tests::
          - name: red before the checked script constructor
            runner: windows-2022
            rev: da59ec1856
            expect: report
            clippy: "no"
            mutate: ""
            rows: |
              crazyagent-kernel-processes|--lib|finding::windows_tests::
          - name: base control rows
            runner: windows-2022
            rev: ec22db84c2
            expect: report
            clippy: "no"
            mutate: ""
            rows: |
              crazyagent-kernel-processes|--lib|finding::windows_tests::
              crazyagent|--lib|harnesses::update::windows_tests::
              crazyagent|--lib|harnesses::update::state::windows_tests::
              crazyagent|--lib|tools::windows_tests::
          - name: tip clippy and unix rows
            runner: ubuntu-22.04
            rev: df0b6056d9
            expect: green
            clippy: "yes"
            mutate: ""
            rows: |
              crazyagent-kernel-processes|--lib|finding::tests::
              crazyagent-kernel-sandbox|--lib|profile::interpreter_tests::
              crazyagent|--lib|harnesses::finding_tests::
              crazyagent|--lib|harnesses::update::tests::
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a probe whose parent is not the ticket tip
        env:
          TIP: df0b6056d9
        run: |
          set -euo pipefail
          parent=$(git rev-parse --short=10 HEAD^)
          echo "CASE head $(git rev-parse HEAD) parent $parent"
          [ "$parent" = "$TIP" ] || { echo "::error::HEAD^ is $parent, not the tip $TIP"; exit 1; }
          changed=$(git diff --name-only HEAD^ HEAD)
          [ "$changed" = ".github/workflows/tests.yml" ] || { echo "::error::the probe commit changes more than the workflow: $changed"; exit 1; }
      - name: Check out the revision this entry proves
        env:
          REV: ${{ matrix.rev }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$REV"
          echo "CASE head $(git rev-parse HEAD)"
      - name: Apply the scratch mutation this entry names
        if: ${{ matrix.mutate != '' }}
        env:
          MUTATE: ${{ matrix.mutate }}
        run: |
          set -euo pipefail
          bash -c "$MUTATE"
          git diff --stat
          git diff | sed 's/^/CASE mutant /'
          changed=$(git diff --numstat | wc -l)
          [ "$changed" = 1 ] || { echo "::error::the mutation changed $changed files"; exit 1; }
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Clippy each touched crate with warnings denied
        if: ${{ matrix.clippy == 'yes' }}
        run: |
          set +e
          set -u
          failed=0
          for target in "crazyagent-kernel-processes --lib --tests" "crazyagent-kernel-sandbox --lib --tests" "crazyagent --lib --tests"; do
            read -r -a words <<< "$target"
            crate="${words[0]}"
            started=$(date +%s)
            cargo clippy --locked --keep-going -p "$crate" "${words[@]:1}" -- -D warnings > "clippy-$crate.log" 2>&1
            rc=$?
            cat "clippy-$crate.log"
            built=$(grep -c -E "^ *(Checking|Compiling) $crate v" "clippy-$crate.log")
            echo "CASE clippy $crate rc=$rc built=$built seconds=$(( $(date +%s) - started ))"
            if [ "$rc" != 0 ]; then failed=1; fi
            if [ "$built" -lt 1 ]; then echo "::error::clippy never checked $crate"; failed=1; fi
          done
          exit "$failed"
      - name: Build the Linux sandbox helper the crazyagent rows start
        if: ${{ runner.os == 'Linux' }}
        run: |
          set +e
          set -uo pipefail
          started=$(date +%s)
          cargo build --locked -p crazyagent --bin crazyagent-landlock > landlock.log 2>&1
          rc=$?
          tail -20 landlock.log
          echo "CASE landlock build rc=$rc seconds=$(( $(date +%s) - started ))"
          [ "$rc" = 0 ] || { echo "::error::the crazyagent-landlock build failed"; exit 1; }
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          rc=$?
          echo "CASE landlock copied into target/debug/deps rc=$rc"
          [ "$rc" = 0 ] || { echo "::error::the crazyagent-landlock copy failed"; exit 1; }
      - name: Run the rows this entry names
        if: ${{ !cancelled() }}
        env:
          ROWS: ${{ matrix.rows }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set +e
          set -uo pipefail
          failed=0
          number=0
          while IFS='|' read -r crate target filter; do
            [ -n "$crate" ] || continue
            number=$((number + 1))
            log="row-$number.log"
            started=$(date +%s)
            read -r -a kind <<< "$target"
            read -r -a only <<< "$filter"
            cargo test --locked -p "$crate" "${kind[@]}" -- "${only[@]}" > "$log" 2>&1
            rc=$?
            ran=$(grep -E '^running [0-9]+ tests?$' "$log" | tail -1 || true)
            echo "ROW $crate $target $filter rc=$rc $ran seconds=$(( $(date +%s) - started ))"
            grep -E '^test .* \.\.\. (ok|FAILED|ignored)' "$log" | sed 's/^/CASE /' || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -120 || true
            if [ "$rc" != 0 ] && ! grep -q -E '^running [0-9]+ tests?$' "$log"; then
              tail -40 "$log"
            fi
            [ "$rc" = 0 ] || failed=1
            count=$(echo "$ran" | grep -o -E '[0-9]+' | head -1)
            if [ "${count:-0}" -lt 1 ]; then
              echo "ROW-EMPTY $crate $target $filter ran no test"
              failed=1
            fi
          done <<< "$ROWS"
          if [ "$EXPECT" = green ] && [ "$failed" != 0 ]; then
            exit 1
          fi
