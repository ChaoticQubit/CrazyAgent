name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PARENT_FULL: 9af0fed035548e0468d31f5db66792da23bf7496
  ROW: engine::owner::transport::changes::tests::an_engine_stop_waits_for_its_landing_upkeep_to_leave_the_database
  FIX_PATCH_B64: 
  FIX_TREE: 244a99f2b8d5a598ce32e0add3bee1f980e06397

defaults:
  run:
    shell: bash

jobs:
  upkeep:
    name: B25-UPKEEP-5X ${{ matrix.leg }} on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: base
            rev: 9af0fed035548e0468d31f5db66792da23bf7496
          - leg: b25
            rev: 3d3992d3f37f3f50bccb3f81d09bf779050818c4
          - leg: b25-fix
            rev: 3d3992d3f37f3f50bccb3f81d09bf779050818c4
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the leg's tree
        env:
          LEG: ${{ matrix.leg }}
          REV: ${{ matrix.rev }}
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$PARENT_FULL" ] || { echo "::error::the parent is not $PARENT_FULL"; exit 1; }
          git checkout -q --detach "$REV"
          [ "$(git rev-parse HEAD)" = "$REV" ] || { echo "::error::HEAD is not $REV"; exit 1; }
          git log -1 --format="$LEG at %H %s"
          if [ "$LEG" = b25-fix ]; then
            printf '%s' "$FIX_PATCH_B64" | base64 -d > "$RUNNER_TEMP/fix.patch"
            git apply --index "$RUNNER_TEMP/fix.patch"
            tree="$(git write-tree)"
            echo "fix tree $tree"
            [ "$tree" = "$FIX_TREE" ] || { echo "::error::the fixed tree is not the merge of c34654b318 into b25"; exit 1; }
            git diff --cached --stat
          fi
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Build the Linux landlock helper
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          ls -l target/debug/crazyagent-landlock
      - name: Build the engine lib tests
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run > "$RUNNER_TEMP/build.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/build.log"; exit 1; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$RUNNER_TEMP/build.log")"
          echo "BUILT crazyagent $built"
          [ "$built" -gt 0 ] || { echo "::error::crazyagent was not compiled"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/build.log"
      - name: The upkeep row 5x
        timeout-minutes: 90
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set +e
          ok=0
          failed=0
          started=0
          for pass in 1 2 3 4 5; do
            log="$RUNNER_TEMP/pass-$pass.log"
            timeout 900 cargo test -p crazyagent --lib --locked -- --exact "$ROW" > "$log" 2>&1
            code=$?
            line="$(grep -E "^test $ROW \.\.\. (ok|FAILED)$" "$log" || true)"
            prune="$(grep -c landing_prune_failed "$log" || true)"
            grep -q '^running 1 test$' "$log" && started=$((started + 1))
            echo "PASS $LEG $pass rc $code prune_failed $prune: ${line:-no result line}"
            case "$line" in
              *" ok") ok=$((ok + 1)) ;;
              *" FAILED") failed=$((failed + 1)); grep -E 'panicked at|^thread |Elapsed' "$log" | head -n 6 ;;
              *) tail -n 20 "$log" ;;
            esac
          done
          echo "LEG $LEG ok $ok FAILED $failed started $started"
          [ "$started" = 5 ] || { echo "::error::the row started $started of 5 times"; exit 1; }
          [ $((ok + failed)) = 5 ] || { echo "::error::only $((ok + failed)) of 5 passes gave a result"; exit 1; }
          exit 0
