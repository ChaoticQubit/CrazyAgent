name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 32eaebc15e831a97c25599c6be2cd8c519dc7b41
  BASE_FULL: 875b1805cfaf1646184e7d482e2dffe15a4886e3
  RED_FULL: 7ac8c2946b14ca547d1a2816b7988fd38b727537

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: REPEATED-READS fmt, clippy, the steady-save reds at red and the rows at the tip, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -4 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the SAVE-QUIT tip 875b1805cf"; exit 1; }
          [ "$(git diff --name-only "$RED_FULL" HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/settings_log.rs crates/crazyagent/src/state_log.rs crates/kernel/storage/src/state_log/appender.rs " ] || { echo "::error::red and tip differ beyond the three save files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the two crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt -p crazyagent-kernel-storage -p crazyagent -- --check > "$RUNNER_TEMP/fmt.log" 2>&1
          code=$?
          head -n 40 "$RUNNER_TEMP/fmt.log"
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel-storage and crazyagent --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, both crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage -p crazyagent --tests -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gates crazyagent-kernel-storage $g0 crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: The steady-save reds at the red commit's save files, then at the tip (expect 2 FAILED with their messages at red, 2 passed at the tip)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          files=(crates/kernel/storage/src/state_log/appender.rs crates/crazyagent/src/state_log.rs crates/crazyagent/src/settings_log.rs)
          steady() {
            local log="$RUNNER_TEMP/steady-$1.log"
            cargo test --locked -p crazyagent --lib sdk_slice::tests::a_steady_ > "$log" 2>&1
            local code=$?
            grep -E '^test sdk_slice::|^test result|panicked at|ran a repeat|^  left|^ right|^error(\[|:)' "$log" | head -n 40 || true
            failed="$(grep -cE '^test sdk_slice::tests::a_steady_(quit|sandbox)_save_[a-z_]+ \.\.\. FAILED$' "$log" || true)"
            passed="$(grep -cE '^test sdk_slice::tests::a_steady_(quit|sandbox)_save_[a-z_]+ \.\.\. ok$' "$log" || true)"
            quit="$(grep -cE 'the steady quit save ran a repeat' "$log" || true)"
            sandbox="$(grep -cE 'the steady sandbox save ran a repeat' "$log" || true)"
            gate="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
            echo "steady at $1 rc $code failed $failed passed $passed quit_message $quit sandbox_message $sandbox gate crazyagent $gate"
            eval "$1_code=$code $1_failed=$failed $1_passed=$passed $1_quit=$quit $1_sandbox=$sandbox $1_gate=$gate"
          }
          git checkout "$RED_FULL" -- "${files[@]}"
          [ "$(git diff --name-only "$RED_FULL" -- "${files[@]}" | wc -l)" = 0 ] || { echo "::error::the save files are not the red commit's"; exit 1; }
          steady red
          git checkout HEAD^ -- "${files[@]}"
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip after the red"; exit 1; }
          touch "${files[@]}"
          steady tip
          [ "$red_code" != 0 ] && [ "$red_failed" = 2 ] && [ "$red_passed" = 0 ] && [ "$red_quit" = 1 ] && [ "$red_sandbox" = 1 ] && [ "$red_gate" -ge 1 ] || { echo "::error::the reds did not fail as expected at red"; exit 1; }
          [ "$tip_code" = 0 ] && [ "$tip_failed" = 0 ] && [ "$tip_passed" = 2 ] && [ "$tip_gate" -ge 1 ] || exit 1
      - name: The sdk_slice, settings_log and kernel state_log rows at the tip (expect rc 0 and 0 failed each)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          ok=1
          for row in "crazyagent sdk_slice::" "crazyagent settings_log::" "crazyagent-kernel-storage state_log::"; do
            read -r crate filter <<< "$row"
            log="$RUNNER_TEMP/set.log"
            cargo test --locked -p "$crate" --lib "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|^test result' "$log" | head -n 20 || true
            failed="$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)"
            passed="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
            results="$(grep -cE '^test result: ' "$log" || true)"
            echo "set $filter rc $code failed $failed passed $passed results $results"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] && [ "$results" = 1 ] || ok=0
          done
          [ "$ok" = 1 ] || exit 1

  windows:
    name: REPEATED-READS fmt, clippy, the steady-save reds at red and the rows at the tip, on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
