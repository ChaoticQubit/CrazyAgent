name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: 6fbfa0fec
  TIP_SHA: 512b3f596

defaults:
  run:
    shell: bash

jobs:
  s9a-windows:
    name: V244 WIN-MASTER S9a launch lock on ${{ matrix.runner }}, red at 6fbfa0fec, tip 512b3f596
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: S9a red rows at 6fbfa0fec
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git restore -q --source="$RED_SHA" --staged --worktree -- crates/crazyagent/src/launch_context.rs
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 launch_context::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test launch_context::|^test result|panicked|left:|right:' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 3 passed; 3 failed' "$RUNNER_TEMP/red.log"
          for row in a_windows_lock_only_refuses_an_open_or_linked_home_before_a_lock a_windows_adopt_refuses_an_open_or_linked_home_before_a_lock a_windows_install_refuses_an_open_or_linked_home_before_a_lock; do
            grep -q "$row \.\.\. ok" "$RUNNER_TEMP/red.log"
          done
          echo "red as expected: with launch_context.rs at the red commit on the tip's tree, the 3 pass rows fail on the refusing Windows lock and the 3 refusal rows already hold on H1's check"
      - name: S9a launch lock rows at the tip 512b3f596, five rounds
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            set +e
            cargo test -p crazyagent --lib --locked -- --test-threads 1 launch_context::windows_tests:: > "$RUNNER_TEMP/tip-$round.log" 2>&1
            rc=$?
            set -e
            echo "round $round rc=$rc"
            grep -E '^test launch_context::|^test result|panicked|left:|right:' "$RUNNER_TEMP/tip-$round.log" || true
            [ "$rc" -eq 0 ]
            grep -qE 'test result: ok\. 6 passed; 0 failed' "$RUNNER_TEMP/tip-$round.log"
          done
          echo "6 rows green in 5 rounds"
      - name: Build the Windows boundary helper H1's row 5 starts
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/
      - name: H1's Windows home rows stay green at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 harnesses::launch::home_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/h1.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test |^test result|panicked' "$RUNNER_TEMP/h1.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/h1.log"
      - name: Windows access refusal rows stay green at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 sandbox::policy::tests:: 2>&1 | tee "$RUNNER_TEMP/policy.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'windows|^test result' "$RUNNER_TEMP/policy.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
          grep -q 'full_access_on_windows_is_refused_with_its_own_reason_and_code \.\.\. ok' "$RUNNER_TEMP/policy.log"
