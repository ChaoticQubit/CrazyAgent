name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 5f03c000d08e65c65ddaa86be6a133c494835318
  BASE_FULL: c58ccb8929bed5ad0b69df96ce75afec078a7b92
  HELD: "engine::bootstrap::held::tests::"
  LAUNCH: "launch_context::windows_tests::"
  UNIX_LAUNCH: "launch_context::tests::"
  PRIVATE_ROW: "a_private_make_over_another_kind_of_entry_is_unsafe"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  NEW_WINDOWS: "a_windows_tools_off_claude_install_writes_its_two_files_and_holds_the_home a_windows_install_removes_a_planted_junction_as_itself a_windows_install_drop_never_follows_a_junction_planted_after_it a_windows_install_refuses_a_home_its_held_judge_refuses_before_a_lock the_held_home_judge_refuses_a_low_or_open_inherited_label a_windows_install_it_cannot_write_yet_is_refused_before_it_changes_the_home"

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: S9B-1 tools-off tip 4 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 13
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~11)" = "$BASE_FULL" ] || { echo "::error::HEAD~11 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: crazyagent clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylibtests.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib --tests windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: held rows exact (21 + the private row), then launch_context Windows rows == list, the 6 new ones 5 rounds (crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          misses() {
            grep -E '^test .* \.\.\. ok' "$1" | grep -vE "^test $2[a-z0-9_:]+ \.\.\. ok$" | head -n 10 || true
          }
          count_list() {
            cargo test -p crazyagent --lib --locked -- "$1" --list 2>/dev/null | grep -cE ': test$' || true
          }
          held_exact() {
            local want="$1" log="$RUNNER_TEMP/held.log"
            cargo test -p crazyagent --lib --locked -- "$HELD" > "$log" 2>&1
            local code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            local failed ok private
            failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
            ok="$(grep -E "^test ${HELD}[a-z_:]+ \.\.\. ok$" "$log" | grep -cv "$PRIVATE_ROW" || true)"
            private="$(grep -cE "^test $HELD$PRIVATE_ROW \.\.\. ok$" "$log" || true)"
            echo "held rc $code failed $failed ok $ok want $want private ok $private"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "$want" ] && [ "$private" = 1 ]
          }
          held_exact 21 || exit 1
          read -r -a new <<< "$NEW_WINDOWS"
          [ "${#new[@]}" = 6 ] || { echo "::error::want 6 new rows, have ${#new[@]}"; exit 1; }
          listed="$(count_list "$LAUNCH")"
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- "$LAUNCH" > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
          failed="$(result_sum "$log" 6)"
          passed="$(result_sum "$log" 4)"
          ignored="$(result_sum "$log" 8)"
          launch="$(grep -cE "^test ${LAUNCH}[a-z0-9_:]+ \.\.\. ok$" "$log" || true)"
          misses "$log" "$LAUNCH"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          ok=0
          for row in "${new[@]}"; do
            n="$(grep -cE "^test $LAUNCH$row \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          echo "launch rc $code listed $listed passed $passed ignored $ignored ok lines $launch failed $failed new ok $ok of 6 gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" -ge 14 ] && [ "$passed" = "$((listed - ignored))" ] && [ "$ok" = 6 ] && [ "$gate" -ge 1 ] || exit 1
          for round in 1 2 3 4 5; do
            rlog="$RUNNER_TEMP/round-$round.log"
            cargo test -p crazyagent --lib --locked -- "$LAUNCH" > "$rlog" 2>&1
            rcode=$?
            rok=0
            for row in "${new[@]}"; do
              rok=$((rok + $(grep -cE "^test $LAUNCH$row \.\.\. ok$" "$rlog" || true)))
            done
            rfailed="$(grep -E '^test result:' "$rlog" | awk '{f+=$6} END {print f+0}')"
            echo "round $round rc $rcode failed $rfailed new ok $rok of 6"
            grep -E '^test .* FAILED$|panicked at' "$rlog" | head -n 10 || true
            [ "$rcode" = 0 ] && [ "$rfailed" = 0 ] && [ "$rok" = 6 ] || exit 1
          done

  linux:
    name: S9B-1 tools-off tip 4 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 13
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~11)" = "$BASE_FULL" ] || { echo "::error::HEAD~11 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: crazyagent clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylibtests.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib --tests ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: held rows exact (17 + the private row), then launch_context Unix rows == list (crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          misses() {
            grep -E '^test .* \.\.\. ok' "$1" | grep -vE "^test $2[a-z0-9_:]+ \.\.\. ok$" | head -n 10 || true
          }
          count_list() {
            cargo test -p crazyagent --lib --locked -- "$1" --list 2>/dev/null | grep -cE ': test$' || true
          }
          held_exact() {
            local want="$1" log="$RUNNER_TEMP/held.log"
            cargo test -p crazyagent --lib --locked -- "$HELD" > "$log" 2>&1
            local code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            local failed ok private
            failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
            ok="$(grep -E "^test ${HELD}[a-z_:]+ \.\.\. ok$" "$log" | grep -cv "$PRIVATE_ROW" || true)"
            private="$(grep -cE "^test $HELD$PRIVATE_ROW \.\.\. ok$" "$log" || true)"
            echo "held rc $code failed $failed ok $ok want $want private ok $private"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "$want" ] && [ "$private" = 1 ]
          }
          held_exact 17 || exit 1
          listed="$(count_list "$UNIX_LAUNCH")"
          log="$RUNNER_TEMP/unix-launch.log"
          cargo test -p crazyagent --lib --locked -- "$UNIX_LAUNCH" > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
          failed="$(result_sum "$log" 6)"
          passed="$(result_sum "$log" 4)"
          ignored="$(result_sum "$log" 8)"
          ok="$(grep -cE "^test ${UNIX_LAUNCH}[a-z0-9_:]+ \.\.\. ok$" "$log" || true)"
          misses "$log" "$UNIX_LAUNCH"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "unix launch rc $code listed $listed passed $passed ignored $ignored ok lines $ok failed $failed gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" -ge 1 ] && [ "$passed" = "$((listed - ignored))" ] && [ "$gate" -ge 1 ] || exit 1
