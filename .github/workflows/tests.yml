name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: f6f72c9d4b551de660e0c953522565253466359f
  ROW: team::runtime::tests::a_fresh_tools_off_frame_with_a_finished_sub_agent_says_what_a_task_holds_once
  KEEP: team::runtime::tests::a_tools_off_wake_block_carries_the_finding_and_the_acceptance_check team::runtime::tests::a_task_block_carries_the_finding_and_the_acceptance_check team::runtime::tests::the_master_diagnoses_and_plans_before_it_hands_out_work

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux master frame rows, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Red checks out the red commit
        if: matrix.side == 'red'
        run: |
          set -euo pipefail
          git checkout --detach "$RED_SHA"
          git log --oneline -1
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows and their expected results
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          out="$RUNNER_TEMP/frame-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib --no-run 2>&1 | tail -3
          read -ra keep <<< "$KEEP"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib -- --exact "$ROW" "${keep[@]}" 2>&1 | tee -a "$out"
          row=$(grep -E "^test $ROW \.\.\. " "$out" | sed -E 's/.* \.\.\. //')
          verdict=pass
          for name in "${keep[@]}"; do
            grep -qE "^test $name \.\.\. ok$" "$out" || verdict=fail
          done
          if [ "$SIDE" = red ]; then
            [ "$row" = FAILED ] || verdict=fail
          else
            [ "$row" = ok ] || verdict=fail
          fi
          { echo "| side | row | verdict |"; echo "| --- | --- | --- |"; echo "| $SIDE | ${row:-none} | $verdict |"; grep -E "^test .* \.\.\. " "$out" | sed -E 's/^test (.*) \.\.\. (.*)$/| \1 | \2 | |/'; } >> "$GITHUB_STEP_SUMMARY"
          echo "VERDICT $SIDE row=${row:-none} verdict=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-frame-${{ matrix.side }}
          path: ${{ runner.temp }}/frame-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
