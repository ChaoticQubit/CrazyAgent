name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 881351a304dd29a03c2de092352834f026b5c90a
  RED: c94539c0fc943dbb938da24ea64de773f191bf99
  HELD_BASE: ba7399b63d8ce0f9324ebe49b6045a1dd913982d
  HELD_FROM: bbfef9d4552e1966040d47006338234637e18dcd
  HELD_TREE: 9cb0fd923330350407ce5b3416017279bb011fb7

defaults:
  run:
    shell: bash

jobs:
  win-clippy:
    name: V243-NARROWING-DURABLE-REST r1d crazyagent clippy lib and tests on windows-2022 at the tip
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings

  linux:
    name: V243-NARROWING-DURABLE-REST r1d fmt, clippy and the REST rows with their neighbours on ubuntu-22.04 at the tip
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain with clippy and rustfmt
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Format check at the tip
        run: |
          set -euo pipefail
          cargo fmt -p crazyagent -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy at the tip, one target set per call
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -uo pipefail
          failed=0
          printf '| Linux clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          exit "$failed"
      - name: Red before the bound fix, the whole REST module on 4 threads 3x
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          git checkout -q -f --detach "$RED"
          printf '| red at %s, run | rc | removal rows |\n| --- | --- | --- |\n' "${RED:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for run in 1 2 3; do
            dbus-run-session -- bash -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec cargo test -p crazyagent --lib --locked -- engine::owner::transport::narrowing_rest_tests --test-threads=4' > "$RUNNER_TEMP/red-$run.log" 2>&1
            rc=$?
            verdicts=$(grep -E '^test engine::owner::transport::narrowing_rest_tests::an_account_removal_(the_full_queue|pending_when).* (ok|FAILED)$' "$RUNNER_TEMP/red-$run.log" | sed 's/^test engine::owner::transport::narrowing_rest_tests:://' | tr '\n' ' ')
            echo "red run $run rc=$rc $verdicts"
            grep -E '^test result:' "$RUNNER_TEMP/red-$run.log" || true
            printf '| %s | %s | %s |\n' "$run" "$rc" "$verdicts" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Red before the replay, the held rows with the pool setup 1x
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          git checkout -q -f --detach "$HELD_BASE"
          git diff "$HELD_FROM" "$TIP" | git apply
          git add -A crates
          tree=$(git write-tree)
          echo "held red tree $tree, want $HELD_TREE"
          test "$tree" = "$HELD_TREE" || { echo "the held red tree is not f823b1416's"; exit 1; }
          dbus-run-session -- bash -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec cargo test -p crazyagent --lib --locked -- engine::owner::transport::narrowing_rest_tests::a_held_account_removal_pending_when_the_engine_dies_leaves_the_catalog_at_the_next_open engine::owner::transport::narrowing_rest_tests::a_replayed_removal_stopped_after_its_settings_journal_finishes_at_the_next_open --exact --test-threads=2' > "$RUNNER_TEMP/held-red.log" 2>&1
          echo "held red rc=$?"
          grep -E '^test .* (ok|FAILED)$|^test result:' "$RUNNER_TEMP/held-red.log" || true
          grep -E 'panicked at|error\[E' -A3 "$RUNNER_TEMP/held-red.log" | head -n 20 || true
          git reset -q --hard
          git checkout -q -f --detach "$TIP"
          git diff --quiet "$TIP" -- crates apps
      - name: Build the native auth host the restart rows launch
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent --locked
          echo "CRAZYAGENT_TEST_NATIVE_AUTH_HOST=$GITHUB_WORKSPACE/target/debug/crazyagent" >> "$GITHUB_ENV"
      - name: The REST rows and their neighbours at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          dbus-run-session -- bash -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec cargo test -p crazyagent --lib --locked --no-fail-fast -- engine::owner::transport::narrowing_rest_tests engine::owner::transport::native_auth_restart_tests engine::owner::transport::barrier_tests engine::owner::transport::secret_storage_wait_tests storage::trash storage::plugins storage::narrowing storage::migrations storage::owner_actor_tests --test-threads=4' > "$RUNNER_TEMP/rows.log" 2>&1
          rc=$?
          grep -E '^test .* (ok|FAILED|ignored)$' "$RUNNER_TEMP/rows.log" | sort > "$RUNNER_TEMP/verdicts.txt"
          grep -E '^test result:' "$RUNNER_TEMP/rows.log" || true
          grep -E 'FAILED$' "$RUNNER_TEMP/verdicts.txt" || true
          grep -E 'panicked at|error\[E' -A3 "$RUNNER_TEMP/rows.log" | head -n 120 || true
          echo "::group::failed rows, captured output"
          awk '/^---- .* stdout ----$/{p=1} /^failures:$/{p=0} p' "$RUNNER_TEMP/rows.log" | head -n 600 || true
          echo "::endgroup::"
          echo "::group::storage and narrowing log lines"
          grep -E 'narrowing_|settings_|file_trash|journal|replay' "$RUNNER_TEMP/rows.log" | grep -vE '^test ' | sort | uniq -c | sort -rn | head -n 80 || true
          echo "::endgroup::"
          {
            printf '| Linux rows at %s | exit %s |\n| --- | --- |\n' "${TIP:0:9}" "$rc"
            printf '| passed | %s |\n' "$(grep -c ' ok$' "$RUNNER_TEMP/verdicts.txt" || true)"
            printf '| failed | %s |\n' "$(grep -c ' FAILED$' "$RUNNER_TEMP/verdicts.txt" || true)"
            grep ' FAILED$' "$RUNNER_TEMP/verdicts.txt" | sed 's/^test /| red | /; s/ \.\.\. FAILED$/ |/' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Green at the tip, the removal, held and attach-death rows 3x
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          git diff --quiet "$TIP" -- crates apps
          failed=0
          printf '| green at %s, run | rc | verdicts |\n| --- | --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for run in 1 2 3; do
            dbus-run-session -- bash -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec cargo test -p crazyagent --lib --locked -- engine::owner::transport::narrowing_rest_tests::an_account_removal_the_full_queue_refuses_is_pending_and_lands_while_the_engine_runs engine::owner::transport::narrowing_rest_tests::an_account_removal_pending_when_the_engine_dies_lands_at_the_next_open engine::owner::transport::narrowing_rest_tests::a_held_account_removal_pending_when_the_engine_dies_leaves_the_catalog_at_the_next_open engine::owner::transport::narrowing_rest_tests::a_replayed_removal_stopped_after_its_settings_journal_finishes_at_the_next_open engine::owner::transport::narrowing_rest_tests::a_death_between_an_attach_commit_and_its_intent_unlink_keeps_the_new_secret --exact --test-threads=2' > "$RUNNER_TEMP/green-$run.log" 2>&1
            rc=$?
            verdicts=$(grep -E '^test .* (ok|FAILED)$' "$RUNNER_TEMP/green-$run.log" | sed 's/^test engine::owner::transport::narrowing_rest_tests:://' | tr '\n' ' ')
            echo "green run $run rc=$rc $verdicts"
            grep -E 'panicked at' -A3 "$RUNNER_TEMP/green-$run.log" | head -n 20 || true
            awk '/^---- .* stdout ----$/{p=1} /^failures:$/{p=0} p' "$RUNNER_TEMP/green-$run.log" | head -n 80 || true
            printf '| %s | %s | %s |\n' "$run" "$rc" "$verdicts" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          exit "$failed"
