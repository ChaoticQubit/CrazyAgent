name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1-aarch64-pc-windows-msvc"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PROBE_ROW: an_agent_writes_in_its_roots_but_not_outside_them_or_into_protected_paths

defaults:
  run:
    shell: bash

jobs:
  defender-probe:
    name: ARM64 Defender probe of the slow access-list row
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse a runner that is not ARM64
        run: |
          set -euo pipefail
          [ "$RUNNER_ARCH" = ARM64 ] || { echo "::error::the Defender probe runs only on windows-11-arm, got RUNNER_ARCH=$RUNNER_ARCH"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the boundary rows
        run: |
          set -euo pipefail
          rustc -vV
          cargo test -p crazyagent-win-sandbox --test boundary --locked --no-run
      - name: Show Defender and the test temp root
        shell: pwsh
        run: |
          Get-MpComputerStatus | Format-List AMRunningMode,AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,OnAccessProtectionEnabled,IsTamperProtected
          "ExclusionPath: $((Get-MpPreference).ExclusionPath -join ';')"
          "TEMP=$env:TEMP TMP=$env:TMP GetTempPath=$([System.IO.Path]::GetTempPath()) LOCALAPPDATA=$env:LOCALAPPDATA"
      - name: Run the row 3 times with Defender real-time on
        timeout-minutes: 50
        run: |
          set -uo pipefail
          limit=()
          if [ -x /usr/bin/timeout ]; then limit=(/usr/bin/timeout 900); else echo "::warning::no /usr/bin/timeout, runs are bounded by the step limit only"; fi
          for i in 1 2 3; do
            log="$RUNNER_TEMP/acl-on-$i.log"
            rm -f "$log"
            start=$(date +%s%3N)
            CRAZYAGENT_PROBE_ACL_LOG="$(cygpath -w "$log")" ${limit[@]+"${limit[@]}"} cargo test -p crazyagent-win-sandbox --test boundary --locked -- --exact "$PROBE_ROW" --nocapture --test-threads 1 > "$RUNNER_TEMP/row-on-$i.out" 2>&1
            code=$?
            end=$(date +%s%3N)
            grep -E 'probe-step|test result|panicked' "$RUNNER_TEMP/row-on-$i.out" || true
            echo "probe-run on $i exit $code wall $((end - start)) ms"
          done
      - name: Exclude the test temp root from Defender
        shell: pwsh
        run: |
          $short = [System.IO.Path]::GetTempPath().TrimEnd('\')
          $long = Join-Path $env:LOCALAPPDATA 'Temp'
          Add-MpPreference -ExclusionPath $short, $long
          $listed = (Get-MpPreference).ExclusionPath
          "ExclusionPath: $($listed -join ';')"
          foreach ($path in @($short, $long)) { if ($listed -notcontains $path) { "::warning::the exclusion on $path is not listed" } }
          Get-MpComputerStatus | Format-List RealTimeProtectionEnabled,IsTamperProtected
      - name: Run the row 3 times with the temp root excluded
        timeout-minutes: 50
        run: |
          set -uo pipefail
          limit=()
          if [ -x /usr/bin/timeout ]; then limit=(/usr/bin/timeout 900); else echo "::warning::no /usr/bin/timeout, runs are bounded by the step limit only"; fi
          for i in 1 2 3; do
            log="$RUNNER_TEMP/acl-off-$i.log"
            rm -f "$log"
            start=$(date +%s%3N)
            CRAZYAGENT_PROBE_ACL_LOG="$(cygpath -w "$log")" ${limit[@]+"${limit[@]}"} cargo test -p crazyagent-win-sandbox --test boundary --locked -- --exact "$PROBE_ROW" --nocapture --test-threads 1 > "$RUNNER_TEMP/row-off-$i.out" 2>&1
            code=$?
            end=$(date +%s%3N)
            grep -E 'probe-step|test result|panicked' "$RUNNER_TEMP/row-off-$i.out" || true
            echo "probe-run off $i exit $code wall $((end - start)) ms"
          done
      - name: Summarize the access-list calls per run
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          for f in "$RUNNER_TEMP"/acl-*.log; do
            [ -f "$f" ] || continue
            awk -v name="$(basename "$f" .log)" '{ n[$1]++; t[$1] += $2; if ($2 > m[$1]) m[$1] = $2 } END { for (k in n) printf "probe-acl %s %s calls=%d total=%.0f ms max=%.0f ms\n", name, k, n[k], t[k], m[k] }' "$f"
          done
          for f in "$RUNNER_TEMP"/acl-on-3.log "$RUNNER_TEMP"/acl-off-3.log; do
            [ -f "$f" ] || continue
            sort -k2 -g -r "$f" | head -8 | sed "s|^|probe-slowest $(basename "$f" .log) |"
          done
