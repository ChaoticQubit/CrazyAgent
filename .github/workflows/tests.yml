name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TREE_FULL: a0c9fa18254ffdd2f6bb98d6591beb2d8b9f8774
  PKG: crazyagent
  FILT: "perf_tests::sandbox"
  ROWS: "paths.clear_of_secrets paths.granted_root extra_paths.checked extra_paths.checked_all grants.socket_fit"
  CALLS: "400"

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: Syscalls per call, 244 flame tree, on macos-15
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Refuse a full sha that is not 40 hex
        run: |
          set -euo pipefail
          n=0
          while IFS='=' read -r k v; do
            n=$((n + 1))
            [[ "$v" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$k is not a 40-hex sha: $v"; exit 1; }
            echo "$k ok"
          done < <(env | grep -E '^[A-Z_]+_FULL=' | sort)
          [ "$n" -ge 1 ] || { echo "::error::no *_FULL sha in the env"; exit 1; }
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the flame tree's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TREE_FULL" ] || { echo "::error::the parent is not the flame tree"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the flame tree"; exit 1; }
      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcrun xctrace version
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Build the release test binary (the flame build, as job-0023)
        id: build
        if: ${{ steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo test --release --locked -p "$PKG" --lib --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          bin="$(python3 -I -c 'import json,sys
          for line in open(sys.argv[1]):
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["kind"] == ["lib"]:
                  print(m["executable"])' "$RUNNER_TEMP/build.json" | tail -n 1)"
          [ -x "$bin" ] || { echo "::error::no test binary"; exit 1; }
          echo "test binary $bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Write the syscall counter and the trace helper
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/syscount.py" <<'PY'
          """Counts the syscalls of one process in an `xctrace export` of a System Trace syscall
          table. Inputs: the XML path and a process-name substring. Output: one `name count` line per
          syscall, most first, and a TOTAL line."""
          import collections, sys, xml.etree.ElementTree as ET
          path, want = sys.argv[1], sys.argv[2]
          ids = {}
          counts = collections.Counter()
          procs = collections.Counter()
          for _, el in ET.iterparse(path, events=("end",)):
              if "id" in el.attrib:
                  ids[el.attrib["id"]] = el.attrib.get("fmt", "")
              if el.tag != "row":
                  continue
              def val(tag):
                  c = el.find(tag)
                  if c is None:
                      return ""
                  return c.attrib.get("fmt") or ids.get(c.attrib.get("ref", ""), "")
              proc, name = val("process"), val("syscall")
              procs[proc] += 1
              if want in proc:
                  counts[name] += 1
              el.clear()
          assert counts or procs, "no rows"
          for name, n in counts.most_common():
              print(name, n)
          print("TOTAL", sum(counts.values()))
          if not counts:
              print("processes seen:", procs.most_common(5), file=sys.stderr)
          PY
          cat > "$RUNNER_TEMP/trace.sh" <<'SH'
          S="$RUNNER_TEMP/sys"
          mkdir -p "$S"
          trace() {
            local tag=$1 t rc name
            shift
            t="$S/$tag.trace"
            touch "$S/.mark"
            echo "$tag start $(date +%H:%M:%S) load1 $(sysctl -n vm.loadavg | awk '{print $2}') df $(df -g "$RUNNER_TEMP" | awk 'NR==2{print $4}') GB"
            $SUDO xcrun xctrace record --template 'System Trace' --time-limit 120s --output "$t" "$@" > "$S/$tag.rec" 2>&1
            rc=$?
            name=$(basename "$BIN" | cut -c1-14)
            $SUDO xcrun xctrace export --input "$t" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="syscall"]' > "$S/sys.xml" 2>/dev/null
            python3 -I "$RUNNER_TEMP/syscount.py" "$S/sys.xml" "$name" > "$S/$tag.txt" 2>&1
            echo "$tag xctrace rc $rc $(grep TOTAL "$S/$tag.txt")"
            [ "$rc" = 0 ] || tail -n 5 "$S/$tag.rec"
            $SUDO rm -rf "$t" "$S/sys.xml"
            for tmp in "$(getconf DARWIN_USER_TEMP_DIR)" "$($SUDO getconf DARWIN_USER_TEMP_DIR)"; do
              $SUDO find "$tmp" -maxdepth 1 -name 'instruments*.ktrace' -newer "$S/.mark" -print -delete | sed 's/^/  removed temp /'
            done
          }
          SH
          if xcrun xctrace record --template 'System Trace' --time-limit 2s --output "$RUNNER_TEMP/probe.trace" --launch -- /usr/bin/true > "$RUNNER_TEMP/probe.log" 2>&1; then
            echo "SUDO=" >> "$GITHUB_ENV"; echo "xctrace records as the runner user"
          else
            tail -n 5 "$RUNNER_TEMP/probe.log"; echo "SUDO=sudo" >> "$GITHUB_ENV"; echo "xctrace needs root here: traces run under sudo"
          fi
          rm -rf "$RUNNER_TEMP/probe.trace"
      - name: Per-call syscalls, 5 rows at 0 and $CALLS calls
        if: ${{ steps.build.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          source "$RUNNER_TEMP/trace.sh"
          for row in $ROWS; do
            for n in 0 "$CALLS"; do
              trace "$row-$n" --env CRAZYAGENT_PERF_FLAME="$row" --env CRAZYAGENT_PERF_FLAME_CALLS="$n" --launch -- "$BIN" "$FILT" --ignored --nocapture --test-threads=1
            done
            python3 -I - "$S/$row-0.txt" "$S/$row-$CALLS.txt" "$CALLS" "$row" <<'PY'
          import sys
          def read(p):
              out = {}
              for line in open(p):
                  name, _, n = line.rpartition(" ")
                  if name and n.strip().isdigit():
                      out[name] = int(n)
              return out
          zero, full, k, row = read(sys.argv[1]), read(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          if "TOTAL" not in zero or "TOTAL" not in full:
              print(f"PERCALL 244 {row} NOT MEASURED (a trace gave no TOTAL)")
              sys.exit(0)
          per = (full["TOTAL"] - zero["TOTAL"]) / k
          print(f"PERCALL 244 {row} {per:.2f} (0={zero['TOTAL']} {k}={full['TOTAL']})")
          top = sorted(((full[n] - zero.get(n, 0)) / k, n) for n in full if n != "TOTAL")
          print("  " + ", ".join(f"{n} {d:.2f}" for d, n in reversed(top[-4:]) if d > 0))
          PY
          done
