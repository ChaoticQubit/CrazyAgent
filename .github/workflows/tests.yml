name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  TIP_FULL: cc160117095bdd006a0e4bbeeecdc850d72a8e38
  RED_FULL: b9c1338daa98ef18cad3e81573bfd621052096d0
  BASE_FULL: c6c672b4726b8226a35e486089704f41e4f66230
  TICKET_FILES: apps/desktop/src/screens/settings/app-plugins.tsx apps/desktop/test/settings-app-plugins.test.mjs

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Desktop grants load on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the b24 base"; exit 1; }
          changed="$(git diff --name-only "$BASE_FULL" HEAD^ | sort | tr '\n' ' ')"
          read -ra files <<< "$TICKET_FILES"
          wanted="$(printf '%s\n' "${files[@]}" | sort | tr '\n' ' ')"
          [ "$changed" = "$wanted" ] || { echo "::error::the ticket range is not the two ticket files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Desktop typecheck at tip (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        working-directory: apps/desktop
        run: |
          set +e
          npm run typecheck
          code=$?
          echo "tsc rc $code"
          [ "$code" = 0 ] || exit 1
      - name: Desktop App plugins rows at tip (expect tests 21, pass 21, fail 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          log="$RUNNER_TEMP/desktop.log"
          node --test --test-reporter=spec apps/desktop/test/settings-app-plugins.test.mjs > "$log" 2>&1
          code=$?
          cat "$log"
          tests="$(grep -E '^ℹ tests [0-9]+' "$log" | awk '{print $3}')"
          pass="$(grep -E '^ℹ pass [0-9]+' "$log" | awk '{print $3}')"
          fail="$(grep -E '^ℹ fail [0-9]+' "$log" | awk '{print $3}')"
          echo "desktop tip rc $code tests $tests pass $pass fail $fail"
          [ "$code" = 0 ] && [ "$tests" = 21 ] && [ "$pass" = 21 ] && [ "$fail" = 0 ] || exit 1
      - name: Desktop App plugins rows over the base app-plugins.tsx (expect tests 21, pass 17, fail 4, the named rows)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          file=apps/desktop/src/screens/settings/app-plugins.tsx
          git checkout "$BASE_FULL" -- "$file"
          git diff --stat HEAD^
          log="$RUNNER_TEMP/desktop-red.log"
          node --test --test-reporter=spec apps/desktop/test/settings-app-plugins.test.mjs > "$log" 2>&1
          code=$?
          cat "$log"
          tests="$(grep -E '^ℹ tests [0-9]+' "$log" | awk '{print $3}')"
          pass="$(grep -E '^ℹ pass [0-9]+' "$log" | awk '{print $3}')"
          fail="$(grep -E '^ℹ fail [0-9]+' "$log" | awk '{print $3}')"
          named=0
          for row in "a failed built-in code plugin read says so" "built-in code plugins being read show their section" "a build without the built-in code plugin list says" "an essential built-in code plugin has a locked switch"; do
            if grep -qE "^✖ App plugins: ${row}" "$log"; then named=$((named + 1)); else echo "not failed: $row"; fi
          done
          echo "desktop red rc $code tests $tests pass $pass fail $fail named-failed $named"
          git checkout HEAD^ -- "$file"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 1 ] && [ "$tests" = 21 ] && [ "$pass" = 17 ] && [ "$fail" = 4 ] && [ "$named" = 4 ] || exit 1
