name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a30-probe:
    name: ASK-0030 Windows harness install probes W-P1 to W-P5 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Copy the probe out of the tree
        shell: bash
        run: cp .github/farm/a30-probe.ps1 "$RUNNER_TEMP/a30-probe.ps1"
      - name: Run the probes
        shell: pwsh
        run: |
          [Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem).Caption
          $PSVersionTable.PSVersion.ToString()
          & (Join-Path $env:RUNNER_TEMP 'a30-probe.ps1') -Root (Join-Path $env:RUNNER_TEMP 'a30')
