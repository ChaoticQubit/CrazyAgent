name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 3fdf1c2ea9
  TIP_FULL: e35894c77c13c9069f761d2f9fd8a7fac8520fd3

defaults:
  run:
    shell: bash

jobs:
  green:
    name: INSTALL-SCAN-PERF-TESTS green at the tip on macos-15
    runs-on: macos-15
    strategy:
      matrix:
        specs: ["crazyagent@ok@update::tests::no_install_path_skips_verification,update::tests::a_perf_tests_folder_is_test_code_to_the_install_scan crazyagent-kernel-storage@ok@tests::for_test_names_stay_in_test_files"]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install tmux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Rows
        timeout-minutes: 120
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set +e
          fail=0
          for spec in $SPECS; do
            package="$(echo "$spec" | cut -d@ -f1)"
            outcome="$(echo "$spec" | cut -d@ -f2)"
            names="$(echo "$spec" | cut -d@ -f3 | tr ',' ' ')"
            want="$(echo "$names" | tr ' ' '\n' | sort)"
            log="$RUNNER_TEMP/$package.log"
            read -r -a filters <<< "$names"
            cargo test -p "$package" --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
            code=$?
            grep -E '^test |test result:|panicked at|^thread ' "$log" || true
            ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            got="$(grep -E "^test [a-z_0-9:]+ \.\.\. $outcome\$" "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            echo "ROWS $package $outcome rc $code: $(printf '%s' "$got" | tr '\n' ' ')"
            [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::$package rows differ; want $outcome: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
          done
          exit "$fail"

  red:
    name: INSTALL-SCAN-PERF-TESTS red at f83faaa6ed on macos-15
    runs-on: macos-15
    strategy:
      matrix:
        specs: ["crazyagent@FAILED@update::tests::no_install_path_skips_verification"]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Check out the red sha
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout --detach f83faaa6ed
          git log -1 --format='red %H %s'
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Rows
        timeout-minutes: 120
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set +e
          fail=0
          for spec in $SPECS; do
            package="$(echo "$spec" | cut -d@ -f1)"
            outcome="$(echo "$spec" | cut -d@ -f2)"
            names="$(echo "$spec" | cut -d@ -f3 | tr ',' ' ')"
            want="$(echo "$names" | tr ' ' '\n' | sort)"
            log="$RUNNER_TEMP/$package.log"
            read -r -a filters <<< "$names"
            cargo test -p "$package" --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
            code=$?
            grep -E '^test |test result:|panicked at|^thread ' "$log" || true
            ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            got="$(grep -E "^test [a-z_0-9:]+ \.\.\. $outcome\$" "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            echo "ROWS $package $outcome rc $code: $(printf '%s' "$got" | tr '\n' ' ')"
            [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::$package rows differ; want $outcome: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
          done
          exit "$fail"
