name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows-clippy-tests:
    name: Hidden folder slices clippy lib and tests windows-2022 (${{ matrix.slice }} ${{ matrix.tip }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: V244-HIDDEN-GIT-NONASCII-CASE
            tip: 7537cda1ed6572d6574bb754cc0be2db00212bf2
          - slice: V244-WIN-HIDDEN-BOUNDARY
            tip: e41aab1be9b76512e9d0f134997ae894b15190f3
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tree is the slice tip
        env:
          SLICE_TIP: ${{ matrix.tip }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SLICE_TIP" HEAD
          git checkout --detach "$SLICE_TIP"
          git diff --quiet "$SLICE_TIP"
          git log -1 --format='tree at %H' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy crazyagent lib and tests
        timeout-minutes: 90
        env:
          SLICE_TIP: ${{ matrix.tip }}
        run: |
          set -uo pipefail
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tail -n 80
          rc=${PIPESTATUS[0]}
          printf '| clippy -p crazyagent --lib --tests at %s | exit %s |\n' "$SLICE_TIP" "$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "FARM clippy lib tests tip=$SLICE_TIP rc=$rc"
          exit "$rc"
