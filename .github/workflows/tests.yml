name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  SQ: 5a7742a6d11d2a2300800bdec31fb69bc69cae2c
  SQTWIN: 5341d874f8e2567bcaecfb38e9845db3ca635ae2

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Pod B save_quit build on macos-15 (2.5 crazyagent, twin crazyagent, one target at a time)
    runs-on: macos-15
    timeout-minutes: 330
    env:
      FLAME_OUT: ${{ github.workspace }}/flame-out
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check the two parents and lay out the trees
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^1)" = "$SQ" ] || { echo "::error::parent 1 is not the 2.5 tree"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$SQTWIN" ] || { echo "::error::parent 2 is not the twin tree"; exit 1; }
          [ "$(git rev-parse --verify -q 'HEAD^3' || true)" = "" ] || { echo "::error::more than two parents"; exit 1; }
          [ "$(git diff --name-only HEAD^1 HEAD | sort | tr '\n' ' ')" = ".github/probe/flame-farm.sh .github/probe/flame.py .github/probe/split.py .github/workflows/tests.yml " ] || { echo "::error::the farm commit changes more than the probe files"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/sq" "$SQ"
          git worktree add --detach "$RUNNER_TEMP/sqtwin" "$SQTWIN"
          mkdir -p "$FLAME_OUT"
          echo "PATHS runner_temp=$RUNNER_TEMP workspace=$GITHUB_WORKSPACE" | tee "$FLAME_OUT/PATHS.txt"
      - name: Record the runner
        run: |
          set -euo pipefail
          echo "RUNNER image=${ImageOS:-unknown} version=${ImageVersion:-unknown} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=build"
          echo "RUNNER $(sw_vers -productVersion) $(uname -m) ncpu=$(sysctl -n hw.ncpu) mem_gb=$(( $(sysctl -n hw.memsize) / 1073741824 )) load=$(sysctl -n vm.loadavg)"
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the release test binaries, one target at a time, each with --timings
        timeout-minutes: 300
        run: |
          set -euo pipefail
          mkdir -p "$FLAME_OUT/bins" "$FLAME_OUT/timings"
          : > "$FLAME_OUT/BINS.txt"
          for side in sq sqtwin; do
            dir="$RUNNER_TEMP/$side"; log="$RUNNER_TEMP/build-$side.json"; start=$(date +%s)
            (cd "$dir" && cargo fetch --locked > /dev/null && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$side" CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo test --release --locked -p crazyagent --lib --no-run --timings --message-format=json > "$log" 2> "$log.err") || { tail -n 30 "$log.err"; exit 1; }
            bin=$(python3 -I -c 'import json,sys
          found=[]
          for l in open(sys.argv[1]):
              try: m=json.loads(l)
              except ValueError: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["kind"]==["lib"] and m["profile"]["test"]: found.append(m["executable"])
          print(found[-1] if found else "")' "$log")
            [ -x "$bin" ] || { echo "::error::no test binary for $side"; exit 1; }
            cp "$RUNNER_TEMP/target-$side/cargo-timings/cargo-timing.html" "$FLAME_OUT/timings/$side.html"
            cp "$bin" "$FLAME_OUT/bins/$side"
            echo "$side $bin" >> "$FLAME_OUT/BINS.txt"
            echo "BUILD $side $(git -C "$dir" rev-parse --short=10 HEAD) crazyagent rc=0 min=$(( ($(date +%s) - start) / 60 )) bin=$bin df=$(df -g "$RUNNER_TEMP" | awk 'NR==2{print $4}')G" | tee -a "$FLAME_OUT/RUNS.txt"
            rm -rf "$RUNNER_TEMP/target-$side"
          done
          (cd "$FLAME_OUT/bins" && shasum -a 256 sq sqtwin) | tee "$FLAME_OUT/SHA256.txt"
          cat "$FLAME_OUT/BINS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pod-b-sq-bins
          path: flame-out
          if-no-files-found: warn
          retention-days: 1

  measure:
    name: Pod B save_quit quiet flames on macos-15 (2.5 and twin on this runner, no build running)
    needs: build
    runs-on: macos-15
    timeout-minutes: 180
    env:
      FLAME_OUT: ${{ github.workspace }}/flame-out
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check the two parents and copy the probe
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^1)" = "$SQ" ] || { echo "::error::parent 1 is not the 2.5 tree"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$SQTWIN" ] || { echo "::error::parent 2 is not the twin tree"; exit 1; }
          [ "$(git rev-parse --verify -q 'HEAD^3' || true)" = "" ] || { echo "::error::more than two parents"; exit 1; }
          cp -R .github/probe "$RUNNER_TEMP/probe"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pod-b-sq-bins
          path: ${{ runner.temp }}/bins-in
      - name: Check the paths and the binary hashes, then put each binary at its build path
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/bins-in"
          want="PATHS runner_temp=$RUNNER_TEMP workspace=$GITHUB_WORKSPACE"
          [ "$(cat "$in/PATHS.txt")" = "$want" ] || { echo "::error::paths differ from the build job: $(cat "$in/PATHS.txt") vs $want"; exit 1; }
          (cd "$in/bins" && shasum -a 256 -c "$in/SHA256.txt") || { echo "::error::a binary hash does not match"; exit 1; }
          [ "$(wc -l < "$in/SHA256.txt" | tr -d ' ')" = 2 ] || { echo "::error::the hash list does not name 2 binaries"; exit 1; }
          mkdir -p "$FLAME_OUT"
          while read -r side bin; do
            mkdir -p "$(dirname "$bin")"
            cp "$in/bins/$side" "$bin"
            chmod +x "$bin"
            echo "BIN $side $bin $(shasum -a 256 "$bin" | cut -d' ' -f1)"
          done < "$in/BINS.txt"
          cp "$in/BINS.txt" "$in/RUNS.txt" "$in/SHA256.txt" "$in/PATHS.txt" "$FLAME_OUT/"
          cp -R "$in/timings" "$FLAME_OUT/timings"
      - name: Record the runner
        run: |
          set -euo pipefail
          echo "RUNNER image=${ImageOS:-unknown} version=${ImageVersion:-unknown} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=measure"
          echo "RUNNER $(sw_vers -productVersion) $(uname -m) ncpu=$(sysctl -n hw.ncpu) mem_gb=$(( $(sysctl -n hw.memsize) / 1073741824 )) load=$(sysctl -n vm.loadavg) builds=$(pgrep -x cargo rustc | wc -l | tr -d ' ')"
      - name: Quiet samples, save_quit, both sides (load1 < 3 and no cargo or rustc, cap 30 min per leg)
        timeout-minutes: 150
        run: |
          set +e
          f="$RUNNER_TEMP/probe/flame-farm.sh"
          bash "$f" sample sq perf_tests::sdk_provider_calls provider.settings.save_quit save-quit quiet 30
          bash "$f" sample sqtwin perf_tests::sdk::sdk_provider_calls provider.settings.save_quit save-quit quiet 30
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pod-b-flame-save-quit-quiet
          path: flame-out
          if-no-files-found: warn
      - name: Gates (expect 2 graphs, 0 GATE FAIL)
        if: always()
        run: |
          set -euo pipefail
          s="$FLAME_OUT/RUNS.txt"
          [ -f "$s" ] || { echo "::error::no RUNS.txt"; exit 1; }
          grep -E '^(BUILD|RUN|FLAME|GATE|RETRY|QUIET)' "$s"
          fails="$(grep -c '^GATE FAIL' "$s" || true)"
          graphs="$(awk '$1=="FLAME" && $3=="quiet" && $2 ~ /^save-quit-/ { split($4, a, "="); if (a[2] + 0 >= 5000) seen[$2] = 1 } END { n = 0; for (k in seen) n++; print n }' "$s")"
          echo "gates graphs $graphs gate_fail $fails"
          [ "$fails" = 0 ] && [ "$graphs" = 2 ] || exit 1
