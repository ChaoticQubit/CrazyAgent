name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: ef4fca3a5c0db9bb0fd5f1344051fbd8091a2b73
  RED: f7d28c5bf2d55d0704824dad6402c5e942c164e2
  JUNCTION_LIST: project_files::windows_tests::the_declined_windows_list_names_its_tracked_files_only_and_none_through_a_junction
  NESTED_LIST: project_files::windows_tests::the_declined_windows_list_names_tracked_files_only_and_never_opens_a_nested_git_file
  COMMONDIR: project_files::windows_tests::a_windows_commondir_planted_after_the_check_redirects_nothing
  PLAIN: project_files::windows_tests::a_plain_windows_git_folder_with_history_passes_the_judge
  ORDER: project_files::windows_tests::the_git_folder_walk_runs_before_any_check_that_reads_through_its_folders
  ELSEWHERE: project_files::windows_tests::a_windows_repository_whose_git_folder_points_elsewhere_is_not_listed
  ALTERNATES: project_files::windows_tests::a_windows_git_folder_with_an_alternates_file_of_any_kind_is_not_listed
  FIXED_LINK: project_files::windows_tests::a_windows_git_folder_whose_fixed_entry_is_a_link_is_not_listed
  DEEP_LINK: project_files::windows_tests::a_windows_link_deeper_in_the_git_folder_is_not_listed
  BOUND: project_files::windows_tests::the_git_folder_walk_passes_at_its_bound_and_refuses_past_it
  OUTSIDE: github::publish::publish_windows_tests::a_windows_publish_opens_no_file_the_repository_config_names_outside_the_tree
  EVERY_STEP: github::publish::publish_windows_tests::every_windows_publish_step_refuses_a_git_folder_that_points_elsewhere
  NESTED: github::publish::publish_windows_tests::a_windows_publish_refuses_a_nested_git_entry_naming_its_folder_before_git_walks_the_tree
  STILL_COMMITS: github::publish::publish_windows_tests::a_windows_publish_of_a_project_with_no_nested_git_entry_still_commits
  WORDS: tui::screens::intake::tests::the_publish_judge_refusals_read_the_same_in_the_tui_and_the_desktop
  UNIX_COMMONDIR: project_files::tests::a_commondir_planted_after_the_check_redirects_nothing

defaults:
  run:
    shell: bash

jobs:
  win-red:
    name: UNC declined path r2 windows-2022 at the red commit, each red row fails for its named reason and each guard row passes
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the red commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$RED" -- .
          git diff --quiet "$RED" || { echo "TREE IS NOT THE RED COMMIT"; git diff --stat "$RED"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Build the engine library tests at the red commit
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Each red row fails for its named reason, each guard row passes
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          rc=0
          red() {
            local row="$1" want="$2" out="$RUNNER_TEMP/red-$3.txt"
            cargo test -p crazyagent --lib --locked -- --exact "$row" > "$out" 2>&1
            local code=$?
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -8
            grep -A4 "panicked at" "$out" | cut -c1-400 | head -10
            [ "$code" -ne 0 ] || { echo "RED ROW PASSED: $row"; rc=1; return; }
            grep -q "^test $row \.\.\. FAILED" "$out" || { echo "RED ROW DID NOT RUN: $row"; rc=1; return; }
            grep -qF -- "$want" "$out" || { echo "RED ROW FAILED FOR ANOTHER REASON: $row (wanted a line holding: $want)"; rc=1; }
          }
          guard() {
            local row="$1" out="$RUNNER_TEMP/guard-$2.txt"
            cargo test -p crazyagent --lib --locked -- --exact "$row" > "$out" 2>&1
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -6
            grep -A4 "panicked at" "$out" | cut -c1-400 | head -10
            grep -q "^test $row \.\.\. ok" "$out" || { echo "GUARD ROW NOT OK AT RED: $row"; rc=1; }
          }
          red "$JUNCTION_LIST" 'failed: tracked files only, and no tracked path whose folder became a junction' junction-list
          red "$NESTED_LIST" 'failed: tracked only: no notes.txt, nothing under sub' nested-list
          red "$COMMONDIR" 'left: ["README.md", "notes.txt"]' commondir
          red "$PLAIN" 'left: ["README.md", "notes.txt"]' plain
          red "$ORDER" 'failed: the pointer checks ran for the plain .git only' order
          red "$OUTSIDE" 'the outside excludes file hid notes.txt' outside
          guard "$ELSEWHERE" elsewhere
          guard "$STILL_COMMITS" still-commits
          guard "$EVERY_STEP" every-step
          guard "$NESTED" nested
          [ "$rc" -eq 0 ] && echo "red ok: six rows failed for their named reasons, four guards passed"
          exit "$rc"

  win-tip:
    name: UNC declined path r2 ${{ matrix.runner }} at the tip, clippy lib and tests on windows-2022, every row
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Clippy crazyagent lib
        if: matrix.runner == 'windows-2022'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Every project_files, publish and intake row at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- project_files:: github::publish:: tui::screens::intake:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | cut -c1-300 | head -40
          grep -A4 "panicked at" "$RUNNER_TEMP/tip.txt" | cut -c1-600 | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "windows_tests|intake::tests::the_publish" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$JUNCTION_LIST" "$NESTED_LIST" "$COMMONDIR" "$PLAIN" "$ORDER" "$ELSEWHERE" "$ALTERNATES" "$FIXED_LINK" "$DEEP_LINK" "$BOUND" "$OUTSIDE" "$EVERY_STEP" "$NESTED" "$STILL_COMMITS" "$WORDS"; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"

  linux-tip:
    name: UNC declined path r2 ubuntu-22.04 at the tip, every unix project_files and publish row
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Drop the Microsoft apt source the farm does not use
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          git --version
      - name: Build the engine library tests
        id: lib
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Every unix project_files and publish row at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- project_files:: github::publish:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | cut -c1-300 | head -40
          grep -A4 "panicked at" "$RUNNER_TEMP/tip.txt" | cut -c1-600 | head -40
          grep -cE "^test .* \.\.\. ok" "$RUNNER_TEMP/tip.txt"
          grep -q "^test $UNIX_COMMONDIR \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $UNIX_COMMONDIR"; rc=1; }
          exit "$rc"
