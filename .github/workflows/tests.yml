name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  qf-keyboard-linux:
    name: Questions flow 6b with a live terminal on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.RCLI_SOURCE_REPOSITORY }}
          ref: ${{ env.RCLI_SOURCE_REVISION }}
          path: .local-state/tools/rcli-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install IDE extension dependencies
        working-directory: apps/ide-extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install rcli source dependencies
        working-directory: .local-state/tools/rcli-source
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Install the pinned Chrome for Testing
        env:
          CHROME_PLATFORM: linux64
          CHROME_SHA256: ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/$CHROME_PLATFORM/chrome-$CHROME_PLATFORM.zip"
          echo "$CHROME_SHA256  $work/chrome.zip" | shasum -a 256 -c -
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "$work/chrome.zip" "$work"
            chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          else
            unzip -q "$work/chrome.zip" -d "$work"
            chrome="$work/chrome-linux64/chrome"
          fi
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Red rig with the base bridge, tip bridge row, clippy and tip rig, keeping going
        timeout-minutes: 200
        run: |
          set -uo pipefail
          logs="$RUNNER_TEMP/qf-logs"
          mkdir -p "$logs"
          step() {
            local label=$1 rc=0
            shift
            "$@" > "$logs/$label.log" 2>&1 || rc=$?
            cat "$logs/$label.log"
            echo "$rc" > "$logs/$label.rc"
            echo "== $label rc $rc"
          }
          rig() {
            local label=$1 home
            home=$(mktemp -d "$HOME/qf-XXXXXX")
            chmod 700 "$home"
            step "$label" env TMPDIR="$home" CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent" SMOKE_BRIDGE="$2" timeout 5400 node apps/desktop/test/native/questions-flow.mjs
          }
          git checkout -q --detach 83cdf043f3
          echo "red tree $(git rev-parse --short=10 HEAD)"
          step engine-red bash -c 'cargo build -p crazyagent --bin crazyagent --bin crazyagent-landlock --locked --offline && install -m 0755 target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock'
          step bridge-red cargo build -p crazyagent-desktop --bin desktop-e2e-bridge --features e2e-bridge --locked --offline
          cp target/debug/desktop-e2e-bridge "$RUNNER_TEMP/bridge-red"
          git diff --quiet d7af343abc HEAD -- apps/desktop/src-tauri && echo "red bridge and app sources = base d7af343abc"
          rig rig-red "$RUNNER_TEMP/bridge-red"
          git checkout -q --detach be4cff231f
          echo "tip tree $(git rev-parse --short=10 HEAD)"
          step bridge-tip cargo build -p crazyagent-desktop --bin desktop-e2e-bridge --features e2e-bridge --locked --offline
          step row-tip cargo test -p crazyagent-desktop --bin desktop-e2e-bridge --features e2e-bridge --locked --offline -- terminal::tests --nocapture
          step clippy-tip cargo clippy -p crazyagent-desktop --bin desktop-e2e-bridge --features e2e-bridge --tests --locked --offline -- -D warnings
          step node-tip node --test apps/desktop/test/native/e2e-watch.test.mjs apps/desktop/test/shown-text.test.mjs apps/desktop/test/native/bridge-routes.test.mjs
          rig rig-tip "$PWD/target/debug/desktop-e2e-bridge"
          echo "== verdicts"
          bad=0
          want() {
            if [ "$2" = "$3" ]; then echo "ok $1"; else echo "::error::$1: got $2, want $3"; bad=1; fi
          }
          count() { grep -cE "$2" "$logs/$1.log" || true; }
          yes_if() { [ "$1" -ge 1 ] && echo yes || echo no; }
          want "engine built at red" "$(cat "$logs/engine-red.rc")" 0
          want "red bridge built" "$(cat "$logs/bridge-red.rc")" 0
          want "red bridge compiled the desktop crate" "$(yes_if "$(count bridge-red 'Compiling crazyagent-desktop v')")" yes
          want "6b red names no_live_terminal" "$(count rig-red '^FAIL 6b .*\[no_live_terminal')" 1
          want "tip bridge built" "$(cat "$logs/bridge-tip.rc")" 0
          want "tip bridge compiled the desktop crate" "$(yes_if "$(count bridge-tip 'Compiling crazyagent-desktop v')")" yes
          want "bridge row rc" "$(cat "$logs/row-tip.rc")" 0
          want "bridge row ran" "$(count row-tip '^test terminal::tests::a_poll_takes_a_views_frames_in_order_and_its_last_frame_ends_it \.\.\. ok$')" 1
          want "clippy rc" "$(cat "$logs/clippy-tip.rc")" 0
          want "clippy checked the desktop crate" "$(yes_if "$(count clippy-tip 'Checking crazyagent-desktop v')")" yes
          want "node rows rc" "$(cat "$logs/node-tip.rc")" 0
          want "6b tip passes with the keyboard kept" "$(count rig-tip '^PASS 6b .*keyboard kept in .* while typed keys reached the terminal')" 1
          echo "== every step line, red then tip"
          grep -hE '^(PASS|FAIL|BLOCKED|MANUAL) ' "$logs/rig-red.log" | sed 's/^/red /' || true
          grep -hE '^(PASS|FAIL|BLOCKED|MANUAL) ' "$logs/rig-tip.log" | sed 's/^/tip /' || true
          exit "$bad"
      - name: Keep the rig logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qf-keyboard-linux
          path: ${{ runner.temp }}/qf-logs
          retention-days: 7
