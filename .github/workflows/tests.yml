name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: b4f2e713598d8d6dfb970100200c983e4366976b
  SNAPSHOT_ROW: every_scenario_matches_its_2_4_2_capture

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: TICKET-0440 storage snapshot red at chore, then a full capture of storage/fresh and storage/settings, on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "${#TIP_FULL}" = 40 ] || { echo "::error::TIP_FULL is not a full sha"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not chore $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not chore"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The snapshot row at chore, expected red, by exact name
        timeout-minutes: 75
        run: |
          set +e
          log="$RUNNER_TEMP/red.log"
          cargo test -p crazyagent --test snapshot_v242 --locked -- --exact "$SNAPSHOT_ROW" > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          sed -n '/ stdout ----$/,/^note: run with/p' "$log" | grep -E '^[a-z0-9_-]+/[a-z0-9_.-]+: ' | sort | sed 's/^/SCENARIO /'
          echo "RED rc $code failed $(grep -cE '^test result: FAILED\. 0 passed; 1 failed' "$log")"
          exit 0
      - name: Full capture of storage/fresh and storage/settings (goldens moved aside in the runner only)
        timeout-minutes: 75
        run: |
          set +e
          out="$RUNNER_TEMP/capture"
          mkdir -p "$out/golden"
          g=crates/crazyagent/tests/snapshots/v242/storage
          for n in fresh settings; do mv "$g/$n.json" "$out/golden/$n.json"; done
          log="$RUNNER_TEMP/capture.log"
          SNAPSHOT_V242_WRITE=1 cargo test -p crazyagent --test snapshot_v242 --locked -- --exact "$SNAPSHOT_ROW" > "$log" 2>&1
          echo "CAPTURE rc $?"
          sed -n '/ stdout ----$/,/^note: run with/p' "$log" | grep -E '^[a-z0-9_-]+/[a-z0-9_.-]+: ' | sort | sed 's/^/SCENARIO /'
          for n in fresh settings; do
            if [ -f "$g/$n.json" ]; then
              cp "$g/$n.json" "$out/$n.capture.json"
              diff -u "$out/golden/$n.json" "$out/$n.capture.json" > "$out/$n.diff"
              echo "DIFF storage/$n hunks $(grep -c '^@@' "$out/$n.diff") added $(grep -c '^+[^+]' "$out/$n.diff") removed $(grep -c '^-[^-]' "$out/$n.diff")"
              grep -E '^@@' "$out/$n.diff" | sed "s/^/HUNK storage\/$n /"
            else
              echo "NO CAPTURE storage/$n"
            fi
          done
          git status --short | sed 's/^/TREE /'
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: snapshot-0440-capture
          path: ${{ runner.temp }}/capture
          if-no-files-found: warn
          retention-days: 3
      - name: Gate (a red row at chore and both captures written)
        if: always()
        run: |
          set -euo pipefail
          for n in fresh settings; do [ -f "$RUNNER_TEMP/capture/$n.capture.json" ] || { echo "::error::no capture of storage/$n"; exit 1; }; done
          grep -qE '^test result: FAILED' "$RUNNER_TEMP/red.log" || { echo "::error::the row was not red at chore"; exit 1; }
