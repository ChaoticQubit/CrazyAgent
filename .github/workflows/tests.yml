name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: HANDOVER-W1 AppContainer environment cross-read probe on windows-2022
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the probe commit's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe r2 %H %s' HEAD^
          git log -1 --format='probe %H %s' HEAD^^
          git log -1 --format='base %H %s' HEAD^^^
          [ "$(git rev-parse HEAD^^^)" = 534867d75762eb89dd4255eca6f9ecf0dac18771 ] || { echo "::error::the great-grandparent is not b23 534867d757"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = 2a8f00a9797898632fc9119a798206fb6a7cb359 ] || { echo "::error::the grandparent is not the probe commit 2a8f00a979"; exit 1; }
          [ "$(git rev-parse HEAD^)" = 00d1c84328e46a4590c55bbd1171ea845ea8053d ] || { echo "::error::the parent is not the probe r2 commit 00d1c84328"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the probe commit"; exit 1; }
          git diff --stat HEAD^^^ HEAD^
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Probe the cross-container environment read
        timeout-minutes: 40
        run: |
          set +e
          log="$RUNNER_TEMP/env-cross-read.log"
          cargo test -p crazyagent-win-sandbox --test env_cross_read --locked -- --nocapture --test-threads 1 > "$log" 2>&1
          code=$?
          grep -E '^(PROBE|READ|CROSS|SIBLING)|test result|panicked|error(\[E[0-9]+\])?:' "$log" || true
          tail -n 30 "$log"
          echo "env_cross_read rc $code"
          exit $code
