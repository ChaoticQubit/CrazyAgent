name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TMUX_VERSION: "3.8"
  BASE_SHA: a40e9fc4c35e6b6e22f4a736a1136d543e2fdb8f
  TIP_SHA: 0a3eb6695b793ee6bf06160973c7a497dcbe11f6
  ROW: the_owner_adds_a_folder_sets_it_up_opens_its_team_and_removes_it_in_the_tui
  RUNS: "5"
  TIP_ROWS: the_owner_adds_a_folder_sets_it_up_opens_its_team_and_removes_it_in_the_tui the_tui_walks_from_home_into_the_project_team_tree after_every_agent_stops_its_tasks_keep_its_name_and_f_lists_it_in_the_tui

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS e2e_tui wait rows, the remove row at base, then three rows at tip, five runs each
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned tmux
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.1"
      - name: Install Claude Code and Codex as G1 does
        env:
          CLAUDE_CODE_VERSION: "2.1.309"
          CODEX_VERSION: "0.164.0"
        run: bash scripts/ci/install-harnesses.sh
      - name: Select the Xcode git the engine lands with
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The remove row at base, then three rows at tip, five runs each
        run: |
          set -uo pipefail
          set +e
          verdict=pass
          for side in base tip; do
            if [ "$side" = base ]; then sha="$BASE_SHA"; rows="$ROW"; else sha="$TIP_SHA"; rows="$TIP_ROWS"; fi
            out="$RUNNER_TEMP/remove-macos-$side.txt"
            git checkout -q --detach "$sha" || { echo "::error::checkout $sha failed"; exit 1; }
            git log --oneline -1 | tee "$out"
            cargo test -p crazyagent --locked --no-run --test e2e_tui 2>&1 | tee -a "$out"
            for row in $rows; do
              for run in $(seq 1 "$RUNS"); do
                echo "run $run $row" | tee -a "$out"
                cargo test -p crazyagent --locked --test e2e_tui -- --exact "$row" --test-threads 1 2>&1 | tee -a "$out"
              done
              ok=$(grep -cE "^test $row \\.\\.\\. ok$" "$out")
              failed=$(grep -cE "^test $row \\.\\.\\. FAILED$" "$out")
              if [ "$side" = tip ] && [ "$ok" != "$RUNS" ]; then verdict=fail; fi
              echo "VERDICT $side $row ok=$ok failed=$failed of $RUNS verdict_so_far=$verdict"
              echo "| $side | $row | $ok ok | $failed failed | of $RUNS |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          echo "VERDICT final=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-remove-macos
          path: ${{ runner.temp }}/remove-macos-*.txt
          if-no-files-found: warn
          retention-days: 14
