name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  MERGE_FULL: ad55dc381842b6b548e1643f3f6cdf3a97cff634
  TIP_FULL: 06d666483a2d3d7099d933bc0b3671922bb1ba67
  CHORE_FULL: c6f139883806b94c9f7e3ea9d8c5ee3529081ea8
  BASE_FULL: 9af0fed035548e0468d31f5db66792da23bf7496
  WANT: "file_identity::tests::pinned_identities_equal_to_the_live_files_match file_identity::tests::a_volume_renumbered_as_one_with_every_inode_kept_matches file_identity::tests::a_pinned_device_that_moved_alone_is_refused file_identity::tests::a_changed_inode_is_refused_even_on_a_renumbered_volume file_identity::tests::no_pinned_identities_match_no_live_files file_identity::tests::pinned_and_live_lists_of_different_lengths_are_a_caller_bug assets::tests::the_snapshot_hash_bytes_are_unchanged assets::tests::revoke_of_a_missing_source_is_refused assets::tests::a_snapshot_frame_without_room_for_its_envelope_panics assets::tests::admit_pins_the_file_identity_and_refuses_a_native_plugin assets::tests::a_snapshot_hash_covers_project_config_and_assets assets::tests::a_read_refuses_a_revoked_or_replaced_source assets::tests::a_read_from_another_project_or_config_is_refused assets::tests::the_sources_are_checked_as_one_set_not_one_by_one assets::tests::a_source_moved_to_another_volume_is_refused_as_replaced assets::tests::a_whole_volume_renumbered_at_mount_is_still_accepted assets::tests::admitting_with_a_sources_limit_over_the_selection_limit_panics"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: FILE-IDENTITY-KERNEL merged tip on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the merged tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %P %s' -4 HEAD^
          [ "$(git rev-parse HEAD^)" = "$MERGE_FULL" ] || { echo "::error::the parent is not the merged tip"; exit 1; }
          [ "$(git rev-parse HEAD^^1)" = "$TIP_FULL" ] || { echo "::error::the merge's first parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD^^2)" = "$CHORE_FULL" ] || { echo "::error::the merge's second parent is not chore/v250 c6f1398838"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE_FULL" ] || { echo "::error::HEAD~4 is not chore/v250 9af0fed035"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merged tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from chore newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the three crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-common -p crazyagent-kernel-plugin-host -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-kernel.log"
          cargo clippy -p crazyagent-kernel-common -p crazyagent-kernel-plugin-host --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-common v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log" || true)"
          echo "clippy kernel rc $code errors $errors warnings $warnings gates crazyagent-kernel-common $g0 crazyagent-kernel-plugin-host $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: cargo check crazyagent lib and tests (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/check-crazyagent.log"
          cargo check -p crazyagent --lib --tests --locked > "$log" 2>&1
          code=$?
          grep -E '^error(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "check crazyagent rc $code errors $errors gates crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: kernel rows by want list, kernel_common file_identity and plugin_host assets (expect 17 wanted rows ok, failed 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent-kernel-common --lib --locked -- file_identity:: > "$log" 2>&1
          c1=$?
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- assets::tests:: >> "$log" 2>&1
          c2=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          read -r -a want <<< "$WANT"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.}( - should panic)? \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          echo "rows rc $c1 $c2 passed $passed failed $failed wanted ${#want[@]} ok $ok"
          [ "$c1" = 0 ] && [ "$c2" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "${#want[@]}" = 17 ] || exit 1
