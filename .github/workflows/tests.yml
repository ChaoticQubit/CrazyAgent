name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 2d094b966a9c44f3e81b0c04bbe3374e6b414e89
  BASE: 8c91fc5ef67d0c25bd58c86c12154c58e339be23
  CAPS_BASE: c6c672b4726b8226a35e486089704f41e4f66230
  FILES: "crates/crazyagent/tests/terminal_tmux.rs crates/crazyagent/tests/terminal_tmux/native_lead.rs scripts/quality/caps-allow.json scripts/quality/sleeps-allow.json "
  ROWS: "38"

defaults:
  run:
    shell: bash

jobs:
  move:
    name: TERMINAL-TMUX-MOVE terminal_tmux target clippy, rustfmt, row list, caps and sleeps on macos-15, base then tip
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='TERMINAL-TMUX-MOVE tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the TERMINAL-TMUX-MOVE tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE" ] || { echo "::error::HEAD~2 is not the tmux keepers wait tip"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the TERMINAL-TMUX-MOVE tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Base, the terminal_tmux row list, caps and sleeps
        timeout-minutes: 50
        run: |
          set +e
          set -uo pipefail
          git checkout "$BASE" -- crates scripts || exit 1
          git diff --name-only --diff-filter=A "$BASE" HEAD^ -- crates scripts | while read -r added; do git rm -q -f -- "$added" || exit 1; done || exit 1
          git diff --quiet "$BASE" -- crates scripts || { echo "::error::the base tree is not the tmux keepers wait tip"; exit 1; }
          rc=0
          cargo test -p crazyagent --test terminal_tmux --locked -- --list > "$RUNNER_TEMP/list-base.log" 2>&1 || rc=1
          grep -E ': test$' "$RUNNER_TEMP/list-base.log" | sed -E 's/: test$//' | sort > "$RUNNER_TEMP/rows-base.txt"
          node scripts/quality/caps.mjs 2> "$RUNNER_TEMP/caps-base.txt"
          echo "caps at base rc $?"
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          echo "sleeps at base rc $?"
          git checkout HEAD^ -- crates scripts || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "base rows $(wc -l < "$RUNNER_TEMP/rows-base.txt") list rc $rc"
          [ "$rc" = 0 ]
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          rustfmt --edition 2024 --check crates/crazyagent/tests/terminal_tmux.rs crates/crazyagent/tests/terminal_tmux/native_lead.rs
          code=$?
          echo "rustfmt rc $code"
          [ "$code" = 0 ]
      - name: terminal_tmux clippy at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 50
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --test terminal_tmux --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          grep -E '^ +(Checking|Compiling) crazyagent v' "$log" || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy terminal_tmux macos-15 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the row list holds the same row names (expect 38, the same names after the module path)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          set -uo pipefail
          cargo test -p crazyagent --test terminal_tmux --locked -- --list > "$RUNNER_TEMP/list-tip.log" 2>&1
          rc=$?
          grep -E ': test$' "$RUNNER_TEMP/list-tip.log" | sed -E 's/: test$//' | sort > "$RUNNER_TEMP/rows-tip.txt"
          echo "tip rows:"; cat "$RUNNER_TEMP/rows-tip.txt"
          sed -E 's/^.*:://' "$RUNNER_TEMP/rows-base.txt" | sort > "$RUNNER_TEMP/names-base.txt"
          sed -E 's/^.*:://' "$RUNNER_TEMP/rows-tip.txt" | sort > "$RUNNER_TEMP/names-tip.txt"
          echo "name diff base to tip:"; diff "$RUNNER_TEMP/names-base.txt" "$RUNNER_TEMP/names-tip.txt"
          same=$?
          base=$(wc -l < "$RUNNER_TEMP/names-base.txt" | tr -d ' ')
          tip=$(wc -l < "$RUNNER_TEMP/names-tip.txt" | tr -d ' ')
          unique=$(sort -u "$RUNNER_TEMP/names-tip.txt" | wc -l | tr -d ' ')
          moved=$(grep -c '^native_lead::' "$RUNNER_TEMP/rows-tip.txt" || true)
          echo "rows list rc $rc base $base tip $tip unique $unique moved $moved diff rc $same"
          [ "$rc" = 0 ] && [ "$same" = 0 ] && [ "$base" = "$ROWS" ] && [ "$tip" = "$ROWS" ] && [ "$unique" = "$ROWS" ]
      - name: Caps at the tip against the b24 FINAL and the base (expect no file new to the problem list)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          git fetch --no-tags --depth=1 origin "$CAPS_BASE" || exit 1
          git worktree add --detach "$RUNNER_TEMP/caps-final" "$CAPS_BASE" || exit 1
          node scripts/quality/caps.mjs "$RUNNER_TEMP/caps-final" 2> "$RUNNER_TEMP/caps-final.txt"
          final_rc=$?
          node scripts/quality/caps.mjs 2> "$RUNNER_TEMP/caps-tip.txt"
          tip_rc=$?
          for name in final base tip; do echo "caps $name problems:"; sed '$d' "$RUNNER_TEMP/caps-$name.txt"; done
          for name in final base tip; do sed '$d' "$RUNNER_TEMP/caps-$name.txt" | awk '{print $1}' | sort -u > "$RUNNER_TEMP/caps-$name-files.txt"; done
          new_final=$(comm -13 "$RUNNER_TEMP/caps-final-files.txt" "$RUNNER_TEMP/caps-tip-files.txt" | tee "$RUNNER_TEMP/caps-new.txt" | wc -l | tr -d ' ')
          new_base=$(comm -13 "$RUNNER_TEMP/caps-base-files.txt" "$RUNNER_TEMP/caps-tip-files.txt" | wc -l | tr -d ' ')
          echo "new vs final:"; cat "$RUNNER_TEMP/caps-new.txt"
          tmux_tip=$(grep -c 'tests/terminal_tmux' "$RUNNER_TEMP/caps-tip.txt" || true)
          echo "caps final rc $final_rc problems $(wc -l < "$RUNNER_TEMP/caps-final-files.txt" | tr -d ' ') base problems $(wc -l < "$RUNNER_TEMP/caps-base-files.txt" | tr -d ' ') tip rc $tip_rc problems $(wc -l < "$RUNNER_TEMP/caps-tip-files.txt" | tr -d ' ') new vs final $new_final new vs base $new_base terminal_tmux lines at tip $tmux_tip"
          [ "$new_final" = 0 ] && [ "$new_base" = 0 ] && [ "$tmux_tip" = 0 ]
      - name: Sleeps at the tip against the base (expect the same problems, none on terminal_tmux)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          tip_rc=$?
          echo "sleeps base:"; cat "$RUNNER_TEMP/sleeps-base.txt"
          echo "sleeps tip:"; cat "$RUNNER_TEMP/sleeps-tip.txt"
          diff "$RUNNER_TEMP/sleeps-base.txt" "$RUNNER_TEMP/sleeps-tip.txt"
          same=$?
          tmux_tip=$(grep -c 'terminal_tmux' "$RUNNER_TEMP/sleeps-tip.txt" || true)
          echo "sleeps tip rc $tip_rc diff rc $same terminal_tmux lines $tmux_tip"
          [ "$same" = 0 ] && [ "$tmux_tip" = 0 ]
