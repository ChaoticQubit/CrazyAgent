name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win-git-program-probe:
    name: What Git for Windows runs for each signature program and ssh command value ${{ matrix.runner }}
    if: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Plant a marker false.exe where a lookup could find one, then run git per value, repo on C and on D
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $git = 'C:\Program Files\Git\cmd\git.exe'
          & $git --version
          "PATH false: " + ((Get-Command false -All -ErrorAction SilentlyContinue | ForEach-Object Source) -join ', ')
          $t = $env:RUNNER_TEMP
          $marker = Join-Path $t 'marker.exe'
          $src = Join-Path $t 'marker.rs'
          $code = "fn main() {`n    let me = std::env::current_exe().unwrap();`n    let args: Vec<String> = std::env::args().collect();`n    let _ = std::fs::write(me.with_extension(`"ran`"), format!(`"{}\t{}`", me.display(), args.join(`" `")));`n    std::process::exit(1);`n}`n"
          [IO.File]::WriteAllText($src, $code)
          rustc -O $src -o $marker
          if ($LASTEXITCODE -ne 0) { throw 'marker build failed' }
          $pathdir = Join-Path $t 'pathdir'
          $fixed = @('C:\usr\bin\false.exe', 'D:\usr\bin\false.exe', 'C:\usr\bin\false', 'D:\usr\bin\false', 'C:\dev\null.exe', 'D:\dev\null.exe', (Join-Path $pathdir 'false.exe'))
          function Plant([string[]]$paths) {
            foreach ($p in $paths) {
              New-Item -ItemType Directory -Force (Split-Path $p) | Out-Null
              Copy-Item $marker $p -Force
            }
          }
          Plant $fixed
          $values = @('/usr/bin/false', '/dev/null', 'false', 'nul', 'C:/Windows/System32/crazyagent-none.exe', 'C:/Program Files/Git/usr/bin/false.exe')
          function New-Fixture([string]$base) {
            $repo = Join-Path $base 'owner'
            $homeDir = Join-Path $base 'home'
            New-Item -ItemType Directory -Force $repo, $homeDir | Out-Null
            $env:HOME = $homeDir
            & $git -C $repo init -q --template= | Out-Null
            $empty = Join-Path $base 'empty'
            [IO.File]::WriteAllBytes($empty, [byte[]]@())
            $tree = (& $git -C $repo hash-object -t tree -w $empty).Trim()
            $p = 'Owner <owner@example.invalid> 1700000000 +0000'
            $commits = @{}
            foreach ($armor in 'ssh', 'pgp', 'x509') {
              $b, $e = switch ($armor) {
                'ssh' { '-----BEGIN SSH SIGNATURE-----', '-----END SSH SIGNATURE-----' }
                'pgp' { '-----BEGIN PGP SIGNATURE-----', '-----END PGP SIGNATURE-----' }
                'x509' { '-----BEGIN SIGNED MESSAGE-----', '-----END SIGNED MESSAGE-----' }
              }
              $f = Join-Path $base "c-$armor.txt"
              [IO.File]::WriteAllText($f, "tree $tree`nauthor $p`ncommitter $p`ngpgsig $b`n `n U0lHTkFUVVJF`n $e`n`nSigned subject`n")
              $commits[$armor] = (& $git -C $repo hash-object -t commit -w $f).Trim()
            }
            $signers = Join-Path $base 'allowed_signers'
            [IO.File]::WriteAllText($signers, '')
            & $git -C $repo config gpg.ssh.allowedSignersFile $signers
            Plant @((Join-Path $repo 'false.exe'), (Join-Path $repo 'usr\bin\false.exe'), (Join-Path $repo 'dev\null.exe'))
            return @{ repo = $repo; commits = $commits }
          }
          function Ran([string]$repo) {
            $all = $fixed + @((Join-Path $repo 'false.exe'), (Join-Path $repo 'usr\bin\false.exe'), (Join-Path $repo 'dev\null.exe'))
            $found = @()
            foreach ($p in $all) {
              $m = [IO.Path]::ChangeExtension($p, 'ran')
              if (Test-Path $m) { $found += (Get-Content $m -Raw).Split("`t")[0]; Remove-Item $m -Force }
            }
            return (($found | Sort-Object -Unique) -join ', ')
          }
          function Probe([string]$label, [string]$repo, [string[]]$gitArgs) {
            $null = Ran $repo
            $env:GIT_TRACE = Join-Path $t 'trace.txt'
            if (Test-Path $env:GIT_TRACE) { Remove-Item $env:GIT_TRACE -Force }
            $saved = $env:PATH
            $env:PATH = "$pathdir;$saved"
            Push-Location $repo
            & $git @gitArgs > (Join-Path $t 'out.txt') 2> (Join-Path $t 'err.txt')
            $rc = $LASTEXITCODE
            Pop-Location
            $env:PATH = $saved
            Remove-Item Env:GIT_TRACE
            $ran = Ran $repo
            $out = ((Get-Content (Join-Path $t 'out.txt') -ErrorAction SilentlyContinue) -join ' | ')
            $err = ((Get-Content (Join-Path $t 'err.txt') -TotalCount 2 -ErrorAction SilentlyContinue) -join ' | ')
            $trace = ((Select-String -Path (Join-Path $t 'trace.txt') -Pattern 'run_command|start_command' -ErrorAction SilentlyContinue | Select-Object -Skip 0 -First 2 | ForEach-Object { ($_.Line -split 'trace: ')[-1] }) -join ' | ')
            "$label rc=$rc ran=[$ran] out=[$out] err=[$err] trace=[$trace]"
          }
          foreach ($drive in @(@{ name = 'C'; base = (Join-Path $env:USERPROFILE 'gp') }, @{ name = 'D'; base = (Join-Path $t 'gp') })) {
            $fx = New-Fixture $drive.base
            "== repo on $($drive.name): $($fx.repo)"
            foreach ($value in $values) {
              foreach ($armor in 'ssh', 'pgp', 'x509') {
                $repo = $fx.repo; $commit = $fx.commits[$armor]; & $git -C $repo update-ref HEAD $commit
                Probe "sig drive=$($drive.name) armor=$armor value=$value" $fx.repo @('-c', "gpg.program=$value", '-c', "gpg.x509.program=$value", '-c', "gpg.ssh.program=$value", 'log', '--show-signature', '-1', '--format=%s')
              }
              Probe "ssh drive=$($drive.name) value=$value" $fx.repo @('-c', "core.sshCommand=$value", 'ls-remote', 'ssh://example.invalid/x')
            }
          }

  win-git-hookspath-probe:
    name: What Git for Windows runs for core.hooksPath=/dev/null and a missing system folder, publish's update-ref under GIT_SAFE ${{ matrix.runner }}
    if: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Plant hooks under each drive's dev\null, then run publish's update-ref and hook-firing git per hooksPath value, repo on C and on D
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $git = 'C:\Program Files\Git\cmd\git.exe'
          & $git --version
          "system folder: " + [Environment]::SystemDirectory
          "C:\ ACL: " + (((Get-Acl 'C:\').Access | Where-Object { $_.IdentityReference -match 'Authenticated Users|Users' } | ForEach-Object { "$($_.IdentityReference) $($_.FileSystemRights) $($_.AccessControlType)" }) -join '; ')
          $t = $env:RUNNER_TEMP
          $marks = Join-Path $t 'marks'
          New-Item -ItemType Directory -Force $marks | Out-Null
          $marker = Join-Path $t 'marker.exe'
          $src = Join-Path $t 'marker.rs'
          $code = "fn main() {`n    let me = std::env::current_exe().unwrap();`n    let _ = std::fs::write(me.with_extension(`"ran`"), me.display().to_string());`n}`n"
          [IO.File]::WriteAllText($src, $code)
          rustc -O $src -o $marker
          if ($LASTEXITCODE -ne 0) { throw 'marker build failed' }
          $hooks = @('reference-transaction', 'pre-commit', 'commit-msg', 'post-commit', 'post-checkout')
          $planted = @()
          function Plant([string]$kind) {
            foreach ($d in 'C', 'D') {
              $dir = "${d}:\dev\null"
              if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
              New-Item -ItemType Directory -Force $dir | Out-Null
              foreach ($h in $hooks) {
                if ($kind -eq 'sh') {
                  $mark = (Join-Path $marks "$d-$h.txt") -replace '\\', '/'
                  [IO.File]::WriteAllText((Join-Path $dir $h), "#!/bin/sh`necho ""`$0"" >> '$mark'`n")
                } else {
                  Copy-Item $marker (Join-Path $dir "$h.exe") -Force
                }
                $script:planted += (Join-Path $dir "$h.ran")
              }
            }
          }
          function Ran {
            $found = @()
            foreach ($f in Get-ChildItem $marks -File) { $found += "sh:" + $f.BaseName; Remove-Item $f.FullName -Force }
            foreach ($p in $planted) { if (Test-Path $p) { $found += "exe:" + (Get-Content $p -Raw); Remove-Item $p -Force } }
            return (($found | Sort-Object -Unique) -join ', ')
          }
          function Safe([string]$hooksPath) {
            return @('-c', "core.hooksPath=$hooksPath", '-c', 'core.fsmonitor=false', '-c', 'core.pager=cat', '-c', 'submodule.recurse=false', '-c', 'protocol.allow=never', '-c', 'gpg.program=/usr/bin/false', '-c', 'gpg.x509.program=/usr/bin/false', '-c', 'gpg.ssh.program=/usr/bin/false', '-c', 'log.showSignature=false')
          }
          function Run([string]$label, [string]$cwd, [hashtable]$vars, [string[]]$gitArgs) {
            $saved = @{}
            foreach ($k in $vars.Keys) { $saved[$k] = [Environment]::GetEnvironmentVariable($k); Set-Item "Env:$k" $vars[$k] }
            Push-Location $cwd
            & $git @gitArgs > (Join-Path $t 'out.txt') 2> (Join-Path $t 'err.txt')
            $rc = $LASTEXITCODE
            Pop-Location
            foreach ($k in $vars.Keys) { if ($null -eq $saved[$k]) { Remove-Item "Env:$k" -ErrorAction SilentlyContinue } else { Set-Item "Env:$k" $saved[$k] } }
            foreach ($k in 'GIT_DIR', 'GIT_WORK_TREE') { if (Test-Path "Env:$k") { throw "$k leaked after $label" } }
            $err = ((Get-Content (Join-Path $t 'err.txt') -TotalCount 2 -ErrorAction SilentlyContinue) -join ' | ')
            "$label rc=$rc ran=[$(Ran)] err=[$err]"
          }
          $values = @('/dev/null', (([Environment]::SystemDirectory -replace '\\', '/') + '/crazyagent-none'))
          foreach ($kind in 'sh', 'exe') {
          Plant $kind
          "== hooks planted as $kind only"
          foreach ($drive in @(@{ name = 'C'; base = (Join-Path $env:USERPROFILE "hp-$kind") }, @{ name = 'D'; base = (Join-Path $t "hp-$kind") })) {
            for ($n = 0; $n -lt $values.Count; $n++) {
              $value = $values[$n]
              $base = Join-Path $drive.base "v$n"
              $project = Join-Path $base 'project'
              $homeDir = Join-Path $base 'home'
              $stage = Join-Path $homeDir 'stage'
              New-Item -ItemType Directory -Force $project, $homeDir | Out-Null
              & $git -C $project init -q --template= -b main | Out-Null
              & $git -C $project -c user.name=o -c user.email=o@example.invalid -c core.hooksPath=NONE commit -q --allow-empty --no-verify -m base | Out-Null
              $commit = (& $git -C $project rev-parse HEAD).Trim()
              $null = Ran
              $env1 = @{ HOME = $homeDir; GIT_NO_LAZY_FETCH = '1'; GIT_CONFIG_NOSYSTEM = '1'; GIT_ATTR_NOSYSTEM = '1'; GIT_TERMINAL_PROMPT = '0'; GIT_CONFIG_GLOBAL = 'NUL' }
              $projectVars = $env1.Clone(); $projectVars['GIT_DIR'] = (Join-Path $project '.git'); $projectVars['GIT_WORK_TREE'] = $project
              Run "hooks kind=$kind drive=$($drive.name) value=$value cmd=publish-project-update-ref" $project $projectVars ((Safe $value) + @('update-ref', 'refs/heads/published', $commit))
              Run "hooks kind=$kind drive=$($drive.name) value=$value cmd=publish-stage-init" $homeDir $env1 ((Safe $value) + @('init', '--bare', '-q', '--template=', '--', $stage))
              $alternates = Join-Path $stage 'objects\info'
              New-Item -ItemType Directory -Force $alternates | Out-Null
              [IO.File]::WriteAllText((Join-Path $alternates 'alternates'), ((Join-Path $project '.git\objects') + "`n"))
              $stageVars = $env1.Clone(); $stageVars['GIT_DIR'] = $stage
              Run "hooks kind=$kind drive=$($drive.name) value=$value cmd=publish-stage-update-ref" $homeDir $stageVars ((Safe $value) + @('update-ref', 'refs/heads/main', $commit))
              Run "hooks kind=$kind drive=$($drive.name) value=$value cmd=commit" $project @{} @('-c', "core.hooksPath=$value", '-c', 'user.name=o', '-c', 'user.email=o@example.invalid', 'commit', '-q', '--allow-empty', '-m', 'x')
              Run "hooks kind=$kind drive=$($drive.name) value=$value cmd=checkout" $project @{} @('-c', "core.hooksPath=$value", 'checkout', '-q', '-b', 'probe2')
            }
          }
          }

  win-git-signature-env-probe:
    name: Why the engine's signature check runs no planted /usr/bin/false where a plain git does ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: The git and PATH a bash step's cargo test sees
        shell: bash
        run: |
          set -euo pipefail
          command -v git
          cygpath -w "$(command -v git)" > "$RUNNER_TEMP/row-git.txt"
          cygpath -w -p "$PATH" > "$RUNNER_TEMP/row-path.txt"
          cat "$RUNNER_TEMP/row-git.txt"
          tr ';' '\n' < "$RUNNER_TEMP/row-path.txt" | head -8
      - name: Replay the engine's signature check, then change one thing per case
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $t = $env:RUNNER_TEMP
          $cmdGit = 'C:\Program Files\Git\cmd\git.exe'
          $rowGit = (Get-Content (Join-Path $t 'row-git.txt') -Raw).Trim()
          $rowPath = (Get-Content (Join-Path $t 'row-path.txt') -Raw).Trim()
          "row git: $rowGit"
          & $cmdGit --version
          $marker = Join-Path $t 'marker.exe'
          $src = Join-Path $t 'marker.rs'
          $code = "fn main() {`n    let me = std::env::current_exe().unwrap();`n    let _ = std::fs::write(me.with_extension(`"ran`"), me.display().to_string());`n    std::process::exit(1);`n}`n"
          [IO.File]::WriteAllText($src, $code)
          rustc -O $src -o $marker
          if ($LASTEXITCODE -ne 0) { throw 'marker build failed' }
          $planted = @('C:\usr\bin\false', 'C:\usr\bin\false.exe', 'D:\usr\bin\false', 'D:\usr\bin\false.exe')
          foreach ($p in $planted) {
            New-Item -ItemType Directory -Force (Split-Path $p) | Out-Null
            Copy-Item $marker $p -Force
          }
          function Ran {
            $found = @()
            foreach ($p in $planted) {
              $m = [IO.Path]::ChangeExtension($p, 'ran')
              if (Test-Path $m) { $found += (Get-Content $m -Raw); Remove-Item $m -Force }
            }
            return (($found | Sort-Object -Unique) -join ', ')
          }
          function New-Fixture([string]$base) {
            $repo = Join-Path $base 'project'
            $homeDir = Join-Path $base 'home'
            New-Item -ItemType Directory -Force $repo, $homeDir | Out-Null
            & $cmdGit -C $repo init -q --template= -b main | Out-Null
            $empty = Join-Path $base 'empty'
            [IO.File]::WriteAllBytes($empty, [byte[]]@())
            $tree = (& $cmdGit -C $repo hash-object -t tree -w $empty).Trim()
            $p = 'Owner <owner@example.invalid> 1700000000 +0000'
            $commits = @{}
            foreach ($armor in 'ssh', 'pgp') {
              $b, $e = switch ($armor) {
                'ssh' { '-----BEGIN SSH SIGNATURE-----', '-----END SSH SIGNATURE-----' }
                'pgp' { '-----BEGIN PGP SIGNATURE-----', '-----END PGP SIGNATURE-----' }
              }
              $f = Join-Path $base "c-$armor.txt"
              [IO.File]::WriteAllText($f, "tree $tree`nauthor $p`ncommitter $p`ngpgsig $b`n `n U0lHTkFUVVJF`n $e`n`nSigned subject`n")
              $commits[$armor] = (& $cmdGit -C $repo hash-object -t commit -w $f).Trim()
            }
            $signers = Join-Path $base 'allowed_signers'
            [IO.File]::WriteAllText($signers, '')
            & $cmdGit -C $repo config gpg.ssh.allowedSignersFile $signers
            return @{ repo = $repo; home = $homeDir; commits = $commits }
          }
          $safe = @('-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', '-c', 'core.pager=cat', '-c', 'submodule.recurse=false', '-c', 'protocol.allow=never', '-c', 'gpg.program=/usr/bin/false', '-c', 'gpg.x509.program=/usr/bin/false', '-c', 'gpg.ssh.program=/usr/bin/false', '-c', 'log.showSignature=false')
          $gpgOnly = @('-c', 'gpg.program=/usr/bin/false', '-c', 'gpg.x509.program=/usr/bin/false', '-c', 'gpg.ssh.program=/usr/bin/false')
          function Run([string]$label, [string]$git, [string]$cwd, [bool]$clean, [hashtable]$vars, [string[]]$gitArgs) {
            $null = Ran
            $trace = Join-Path $t 'trace.txt'
            if (Test-Path $trace) { Remove-Item $trace -Force }
            $psi = [System.Diagnostics.ProcessStartInfo]::new($git)
            foreach ($a in $gitArgs) { $psi.ArgumentList.Add($a) }
            $psi.WorkingDirectory = $cwd
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            if ($clean) { $psi.Environment.Clear() }
            foreach ($k in $vars.Keys) { $psi.Environment[$k] = $vars[$k] }
            $psi.Environment['GIT_TRACE'] = $trace
            $proc = [System.Diagnostics.Process]::Start($psi)
            $proc.StandardInput.Close()
            $outTask = $proc.StandardOutput.ReadToEndAsync()
            $errTask = $proc.StandardError.ReadToEndAsync()
            $proc.WaitForExit()
            $out = $outTask.Result.Trim() -replace "`r?`n", ' | '
            $err = (($errTask.Result -split "`r?`n" | Where-Object { $_ } | Select-Object -First 3) -join ' | ')
            $spawn = ((Select-String -Path $trace -Pattern 'run_command|start_command|cannot|temporary' -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { ($_.Line -split 'trace: ')[-1] }) -join ' | ')
            "$label rc=$($proc.ExitCode) ran=[$(Ran)] out=[$out] err=[$err] trace=[$spawn]"
          }
          foreach ($drive in @(@{ name = 'C'; base = (Join-Path $env:USERPROFILE 'sp') }, @{ name = 'D'; base = (Join-Path $t 'sp') })) {
            $fx = New-Fixture $drive.base
            "== project on $($drive.name): $($fx.repo)"
            $engine = @{ HOME = $fx.home; GIT_NO_LAZY_FETCH = '1'; GIT_CONFIG_NOSYSTEM = '1'; GIT_ATTR_NOSYSTEM = '1'; GIT_TERMINAL_PROMPT = '0'; GIT_CONFIG_GLOBAL = 'NUL'; PATH = $rowPath; SystemRoot = $env:SystemRoot; GIT_DIR = (Join-Path $fx.repo '.git'); GIT_WORK_TREE = $fx.repo }
            $withTemp = $engine.Clone(); $withTemp['TEMP'] = $env:TEMP; $withTemp['TMP'] = $env:TMP
            $dirs = @{ GIT_DIR = (Join-Path $fx.repo '.git'); GIT_WORK_TREE = $fx.repo }
            foreach ($gitCase in @(@{ name = 'rowgit'; exe = $rowGit }, @{ name = 'cmdgit'; exe = $cmdGit })) {
              foreach ($armor in 'ssh', 'pgp') {
                $tail = @('log', '--show-signature', '-1', '--format=%s', $fx.commits[$armor])
                $at = "drive=$($drive.name) git=$($gitCase.name) armor=$armor"
                Run "A row-exact $at" $gitCase.exe $fx.repo $true $engine ($safe + $tail)
                Run "B row+TEMP $at" $gitCase.exe $fx.repo $true $withTemp ($safe + $tail)
                Run "C row-env,gpg-only $at" $gitCase.exe $fx.repo $true $engine ($gpgOnly + $tail)
                Run "D full-env,GIT_SAFE $at" $gitCase.exe $fx.repo $false $dirs ($safe + $tail)
                Run "E full-env,gpg-only $at" $gitCase.exe $fx.repo $false $dirs ($gpgOnly + $tail)
                Run "F probe1-shape $at" $gitCase.exe $fx.repo $false @{} ($gpgOnly + $tail)
              }
            }
          }
