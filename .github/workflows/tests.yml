name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 9cedf7635b
  RED_FULL: cc5b0d4526
  CHORE_FULL: c6f1398838
  RED_ROW: engine::owner::transport::changes::tests::upkeep_stop_tests::an_engine_stop_during_a_large_prune_returns_within_its_budget_and_leaves_the_rest_due
  TIP_ROWS: >-
    engine::owner::transport::changes::tests::upkeep_stop_tests::an_engine_stop_during_a_large_prune_returns_within_its_budget_and_leaves_the_rest_due
    engine::owner::transport::changes::tests::an_engine_stop_waits_for_its_landing_upkeep_to_leave_the_database
    landing::tests::a_discarded_change_set_ref_is_pruned_after_seven_days
    landing::tests::a_discarded_set_whose_ref_cannot_be_deleted_never_stops_the_others_from_pruning
    landing::tests::owner_edits_are_forgotten_once_their_set_is_accepted_or_pruned_or_the_worktree_retires
    engine::owner::transport::setup_tests::the_owner_server_s_start_tasks_add_nothing_to_the_schema_the_engine_start_made
  RUST_FILES: >-
    crates/crazyagent/src/engine/owner/transport/changes.rs
    crates/crazyagent/src/engine/owner/transport/changes/tests/upkeep_stop_tests.rs
    crates/crazyagent/src/landing.rs
    crates/crazyagent/src/landing/change_set_id.rs
    crates/crazyagent/src/landing/flow.rs
    crates/crazyagent/src/landing/prune.rs

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: PRUNE-STOP red at cc5b0d4526, rows at 9cedf7635b and clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit $RED_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~5)" = "$CHORE_FULL" ] || { echo "::error::HEAD~5 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the landing helper beside the test binaries
        run: |
          set -euo pipefail
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
      - name: Red row at the red commit
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/red.log"
          git -c advice.detachedHead=false checkout -q "$RED_FULL" -- crates
          git diff --quiet "$RED_FULL" -- crates || { echo "::error::crates is not the red commit"; exit 1; }
          touch crates/crazyagent/src/lib.rs
          cargo test -p crazyagent --lib --locked -- --exact "$RED_ROW" > "$log" 2>&1
          code=$?
          git checkout -q HEAD -- crates
          git diff --quiet HEAD^ -- crates || { echo "::error::crates is not back at the fix tip"; exit 1; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "BUILT crazyagent red $built"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at|the stop waited|^thread ' "$log" || true
          failed="$(grep -cE "^test $RED_ROW \.\.\. FAILED\$" "$log")"
          echo "RED rc $code FAILED lines $failed"
          [ "$built" -gt 0 ] && [ "$code" != 0 ] && [ "$failed" = 1 ] || { echo "::error::the red row did not fail at the red commit"; tail -n 40 "$log"; exit 1; }
      - name: Rows at the fix tip by exact name
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/tip.log"
          touch crates/crazyagent/src/lib.rs
          read -r -a filters <<< "$TIP_ROWS"
          want="$(printf '%s\n' "${filters[@]}" | sort)"
          cargo test -p crazyagent --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
          code=$?
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "BUILT crazyagent tip $built"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at|^thread |fence_out_of_process' "$log" || true
          ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED|ignored)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          got="$(grep -E '^test [a-z_0-9:]+ \.\.\. ok$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          echo "ROWS tip rc $code wanted $(printf '%s\n' "$want" | grep -c .) ok $(printf '%s' "$got" | grep -c .)"
          [ "$built" -gt 0 ] && [ "$code" = 0 ] && [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::tip rows differ from the want list"; tail -n 40 "$log"; exit 1; }
      - name: Clippy crazyagent lib
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent --lib --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "linux clippy lib rc $code"
          exit $code
      - name: Clippy crazyagent tests, failing only on the touched files or a missing module file
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-tests.log"
          touch crates/crazyagent/src/lib.rs
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          missing="$(grep -cE 'E0583|file not found for module' "$log")"
          echo "linux tests clippy rc $code moved-file lints $moved missing-module $missing"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] && [ "$missing" = 0 ] || { echo "::error::a lint or a missing module in the touched files"; exit 1; }

  windows:
    name: PRUNE-STOP clippy lib strict and tests on the touched files on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit $RED_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~5)" = "$CHORE_FULL" ] || { echo "::error::HEAD~5 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent --lib --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "windows clippy lib rc $code"
          exit $code
      - name: Clippy crazyagent tests, failing only on the touched files or a missing module file
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-tests.log"
          touch crates/crazyagent/src/lib.rs
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          missing="$(grep -cE 'E0583|file not found for module' "$log")"
          echo "windows tests clippy rc $code moved-file lints $moved missing-module $missing"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] && [ "$missing" = 0 ] || { echo "::error::a lint or a missing module in the touched files"; exit 1; }
