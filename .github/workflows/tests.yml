name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TMUX_VERSION: "3.8"
  RED_SHA: 9b8c694d8
  SETTLE_RED_SHA: 842a4e6db
  BASE_SHA: 238ab31c7
  TIP_SHA: a45de2f8a

defaults:
  run:
    shell: bash

jobs:
  s4-windows:
    name: V244 WIN-MASTER S4 Claude custody on ${{ matrix.runner }}, red at 9b8c694d8, tip a45de2f8a
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: S4 red rows at 9b8c694d8
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git restore -q --source="$RED_SHA" --staged --worktree -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::process::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test engine::|^test result|panicked|left:' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 6 failed; 1 ignored' "$RUNNER_TEMP/red.log"
          echo "red as expected: the red-only Windows custody refuses every run, so all 6 rows fail"
      - name: S4 exit settle red at 842a4e6db on the tip's tree
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git restore -q --source="$SETTLE_RED_SHA" --staged --worktree -- crates/crazyagent/src/engine/claude_host/process.rs
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::process::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/settle-red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test engine::|^test result|left:|run [0-9]' "$RUNNER_TEMP/settle-red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 5 passed; 1 failed; 1 ignored' "$RUNNER_TEMP/settle-red.log"
          grep -q 'a_windows_claude_harness_that_exits_before_a_turn_is_reaped_and_retired \.\.\. FAILED' "$RUNNER_TEMP/settle-red.log"
          grep -q 'left: Some("claude_host_disconnected")' "$RUNNER_TEMP/settle-red.log"
          echo "red as expected: without the settle the exit row reads a disconnect"
      - name: S4 Windows custody rows at the tip a45de2f8a, five rounds
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            set +e
            cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::process::windows_tests:: > "$RUNNER_TEMP/tip-$round.log" 2>&1
            rc=$?
            set -e
            echo "round $round rc=$rc"
            grep -E '^test engine::|^test result|panicked|left:|right:' "$RUNNER_TEMP/tip-$round.log" || true
            [ "$rc" -eq 0 ]
            grep -qE 'test result: ok\. 6 passed; 0 failed; 1 ignored' "$RUNNER_TEMP/tip-$round.log"
          done
          echo "6 rows green in 5 rounds"
      - name: Earlier Windows master rows stay green at the tip (S1 Codex custody, S2 stream log, S3 commands)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host:: engine::codex_host:: engine::owner::transport::master_host_launch::windows_command_tests:: 2>&1 | tee "$RUNNER_TEMP/earlier.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test result|FAILED|panicked' "$RUNNER_TEMP/earlier.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/earlier.log"
      - name: Windows access refusal rows stay green at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 sandbox::policy::tests:: 2>&1 | tee "$RUNNER_TEMP/policy.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'windows|^test result' "$RUNNER_TEMP/policy.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
          grep -q 'full_access_on_windows_is_refused_with_its_own_reason_and_code \.\.\. ok' "$RUNNER_TEMP/policy.log"
  s4-linux:
    name: V244 WIN-MASTER S4 Unix master host rows on ubuntu-22.04 at a45de2f8a against 238ab31c7
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the Linux sandbox helper the Unix master rows start
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          ls -l target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
      - name: Unix master host rows at the base 238ab31c7 and at the tip a45de2f8a
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          rows() {
            set +e
            cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host:: engine::codex_host:: engine::owner::transport::master_host_launch:: > "$RUNNER_TEMP/$1.log" 2>&1
            echo "$1 rc=$?"
            set -e
            grep -E '^test result' "$RUNNER_TEMP/$1.log" || true
            { grep -E ' \.\.\. FAILED$' "$RUNNER_TEMP/$1.log" || true; } | sed 's/^test //; s/ \.\.\. FAILED$//' | sort -u > "$RUNNER_TEMP/$1.failed"
          }
          git restore -q --source="$BASE_SHA" --staged --worktree -- crates
          rows base
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          rows tip
          echo "failed at the base:"; cat "$RUNNER_TEMP/base.failed"
          echo "failed at the tip:"; cat "$RUNNER_TEMP/tip.failed"
          grep -qE 'test result: (ok|FAILED)\. [1-9][0-9]* passed' "$RUNNER_TEMP/tip.log"
          new=$(comm -13 "$RUNNER_TEMP/base.failed" "$RUNNER_TEMP/tip.failed")
          [ -z "$new" ] || { echo "::error::rows failing at the tip only: $new"; exit 1; }
          echo "no row fails at the tip that passes at the base"
  s4-macos:
    name: V244 WIN-MASTER S4 Unix master host rows on macos-15 at a45de2f8a against 238ab31c7
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_BUILD_JOBS=2"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Unix master host rows at the base 238ab31c7 and at the tip a45de2f8a
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          rows() {
            set +e
            cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host:: engine::codex_host:: engine::owner::transport::master_host_launch:: > "$RUNNER_TEMP/$1.log" 2>&1
            echo "$1 rc=$?"
            set -e
            grep -E '^test result' "$RUNNER_TEMP/$1.log" || true
            { grep -E ' \.\.\. FAILED$' "$RUNNER_TEMP/$1.log" || true; } | sed 's/^test //; s/ \.\.\. FAILED$//' | sort -u > "$RUNNER_TEMP/$1.failed"
          }
          git restore -q --source="$BASE_SHA" --staged --worktree -- crates
          rows base
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          rows tip
          echo "failed at the base:"; cat "$RUNNER_TEMP/base.failed"
          echo "failed at the tip:"; cat "$RUNNER_TEMP/tip.failed"
          grep -qE 'test result: (ok|FAILED)\. [1-9][0-9]* passed' "$RUNNER_TEMP/tip.log"
          new=$(comm -13 "$RUNNER_TEMP/base.failed" "$RUNNER_TEMP/tip.failed")
          [ -z "$new" ] || { echo "::error::rows failing at the tip only: $new"; exit 1; }
          echo "no row fails at the tip that passes at the base"
