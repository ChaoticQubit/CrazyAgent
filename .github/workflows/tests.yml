name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FILTER: "project_setup::research_logs::tests::"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: key block tail on ${{ matrix.os }} at ${{ matrix.side }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            side: tip
          - os: macos-15
            side: red
          - os: windows-2022
            side: tip
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one, and on the red side the red commit's code
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='branch tip %H %s' HEAD^
          git log -1 --format='red commit %H %s' HEAD^^
          [ "$(git rev-parse HEAD^)" = e0d9c1d13d21f8736eb69358db3455581a22fb43 ] || { echo "::error::the parent is not the fix tip e0d9c1d13d"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = 15d8bec5293e5834d0ff43f28e6f6ffa7aaad231 ] || { echo "::error::the grandparent is not the red commit 15d8bec529"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit touches more than tests.yml"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
          if [ "${{ matrix.side }}" = red ]; then
            git checkout HEAD^^ -- crates/crazyagent/src/project_setup/redaction.rs crates/crazyagent/src/project_setup/research_logs.rs
            git diff --quiet HEAD^^ || { echo "::error::the red tree is not the red commit"; exit 1; }
            echo "side red: tree = 15d8bec529"
          fi
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: clippy at the tip, lib and tests on macOS, lib on Windows (expect rc 0, 0 warning or error lines)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          if [ "$RUNNER_OS" = Windows ]; then
            cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          else
            cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          fi
          code=$?
          grep -E '^(warning|error)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          lines="$(grep -cE '^(warning|error)(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ${{ matrix.os }} rc $code warning-or-error lines $lines crazyagent built $checked"
          [ "$checked" -gt 0 ] || { echo "::error::clippy never built crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$code" = 0 ] && [ "$lines" = 0 ] || exit 1
      - name: the research log rows (tip expects all passed; red expects exactly the two new red rows FAILED)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- "$FILTER" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- "$FILTER" > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked|^test ' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          red1="$(grep -cE '^test project_setup::research_logs::tests::a_block_opened_before_the_tail_window_and_never_ended_hides_its_body_rows \.\.\. FAILED$' "$log" || true)"
          red4="$(grep -cE '^test project_setup::research_logs::tests::a_block_whose_begin_row_the_tail_window_cuts_hides_its_body_rows \.\.\. FAILED$' "$log" || true)"
          built="$(cat "$log.list" "$log" | grep -cE '^ +(Checking|Compiling) crazyagent v' || true)"
          echo "rows side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed red-row-1 $red1 red-row-4 $red4 crazyagent built $built"
          [ "$built" -gt 0 ] || { echo "::error::the row build never built crazyagent (a restored target read as fresh)"; exit 1; }
          if [ "${{ matrix.side }}" = tip ]; then
            [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1
          else
            [ "$listed" -gt 0 ] && [ "$failed" = 2 ] && [ "$red1" = 1 ] && [ "$red4" = 1 ] && [ "$passed" = $((listed - 2)) ] || exit 1
          fi
