name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 04c5edfc5998c7238934ef2868bf5cb1e3341c41
  BASE: b4f2e713598d8d6dfb970100200c983e4366976b
  FILES: "crates/kernel/security/src/relay_token.rs crates/kernel/security/src/relay_token/tests.rs crates/kernel/security/src/secret.rs "

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: RELAY-TOKEN-MINT on windows-2022, fix tip against base
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain with clippy, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, Windows clippy -D on crazyagent-kernel-security lib and tests (expect rc 0, 0 errors, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/clippy-kernel.log"
          cargo clippy -p crazyagent-kernel-security --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-security v' "$log" || true)
          echo "CLIPPY kernel rc $rc errors $errors warnings $warnings checked $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent-kernel-security"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          side="$1"
          : > "$RUNNER_TEMP/$side-failed.txt"
          bad=0
          for pair in "crazyagent-kernel-security relay_token::tests::"; do
            read -r pkg filter <<< "$pair"
            log="$RUNNER_TEMP/$side-$pkg.log"
            cargo test -p "$pkg" --lib --locked --offline "$filter" -- --list > "$log.list" 2>&1
            listed=$(grep -cE ': test$' "$log.list" || true)
            if grep -E ': test$' "$log.list" | grep -i -E 'keychain|security'; then echo "::error::a keychain row is listed"; exit 1; fi
            cargo test -p "$pkg" --lib --locked --offline "$filter" > "$log" 2>&1
            rc=$?
            result=$(grep -E '^test result: ' "$log" | tail -1 || true)
            grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' >> "$RUNNER_TEMP/$side-failed.txt" || true
            echo "ROWS $side $pkg $filter rc $rc listed $listed $result"
            grep -E 'panicked' -A3 "$log" | head -20 || true
            grep -E '^test .* (ok|FAILED|ignored)$' "$log" || true
            [ "$listed" -ge 1 ] || bad=1
            [ "$side" = base ] || [ "$rc" = 0 ] || bad=1
          done
          echo "ROWS-END $side bad $bad"
          [ "$bad" = 0 ] || { echo "::error::$side rows: none listed, or a tip row failed"; exit 1; }
          ROWS
      - name: "Tip, relay_token::tests:: (expect listed > 0 and every row ok)"
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" tip
      - name: Base, base relay_token.rs and secret.rs under the new rows (expect E0425 for encoded, a compile red)
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          set +e
          set -uo pipefail
          git checkout "$BASE" -- crates/kernel/security/src/relay_token.rs crates/kernel/security/src/secret.rs
          git diff --stat HEAD^
          log="$RUNNER_TEMP/base-build.log"
          cargo test -p crazyagent-kernel-security --lib --locked --offline --no-run > "$log" 2>&1
          rc=$?
          first=$(grep -m1 -E '^error' "$log" || true)
          echo "BASE build rc $rc first: $first"
          git checkout HEAD^ -- crates/kernel/security/src/relay_token.rs crates/kernel/security/src/secret.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the fix tip"; exit 1; }
          refused=$(grep -c -F "error[E0425]: cannot find function \`encoded\`" "$log" || true)
          echo "BASE refused rows $refused"
          if [ "$rc" = 0 ] || [ "$refused" -lt 1 ]; then echo "::error::the base did not refuse the new rows with E0425 for encoded"; exit 1; fi
  linux:
    name: RELAY-TOKEN-MINT on ubuntu-22.04, fix tip against base
