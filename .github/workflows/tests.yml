name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  MERGE: fb1c9b29ad2a1e86f6e60865119514ea8860258a
  CHORE: ee844fc1e8dcc49cef9e193efd4551292623b11e
  FILES: settings-access-layout theme-help-words accounts app first-run-harnesses-words harness-path harness-updates intake new-project no-opaque-failures project-page settings-plugins settings-setup
  KNOWN: "V243-TERMINAL-SETTINGS-PLACE: Settings lists Terminal under App, and its section holds Terminal input and Terminal renderer as Profile's Appearance does"

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: ON-THIS-MAC merge of b28, tsc, desktop files, clippy and rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the merge's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$MERGE" ] || { echo "::error::the parent is not the merge commit"; exit 1; }
          [ "$(git rev-parse HEAD^^2)" = "$CHORE" ] || { echo "::error::the merge's second parent is not chore/v250 ee844fc1e8"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merge commit"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8  $work/chrome.zip" | shasum -a 256 -c -
          unzip -q "$work/chrome.zip" -d "$work"
          chrome="$work/chrome-linux64/chrome"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Desktop tsc --noEmit (expect rc 0)
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run typecheck
      - name: The merged desktop files alone (expect fail 0, or fail 1 that is exactly the known V243-TERMINAL-SETTINGS-PLACE base row)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -u
          out="$RUNNER_TEMP/alone"; mkdir -p "$out"
          bad=0
          for name in $FILES; do
            file="apps/desktop/test/$name.test.mjs"
            [ -f "$file" ] || { echo "::error::missing $file"; bad=1; continue; }
            node --test --test-timeout=60000 --test-reporter=spec "$file" > "$out/$name.log" 2>&1
            rc=$?
            tests=$(grep -E '^ℹ tests ' "$out/$name.log" | awk '{print $3}')
            fail=$(grep -E '^ℹ fail ' "$out/$name.log" | awk '{print $3}')
            echo "== $name rc $rc tests ${tests:-none} fail ${fail:-none}"
            sed -n '/failing tests:/,$p' "$out/$name.log" | grep -E '^✖ ' | grep -v 'failing tests:' | sed -E 's/^✖ (.*) \([0-9.]+m?s\)$/\1/' | sort -u > "$out/$name.failed"
            sed 's/^/  not ok /' "$out/$name.failed"
            ok=0
            if [ -n "$tests" ] && [ "$tests" -ge 1 ]; then
              if [ "$fail" = 0 ] && [ "$rc" = 0 ]; then ok=1; fi
              if [ "$fail" = 1 ] && [ "$(cat "$out/$name.failed")" = "$KNOWN" ]; then ok=1; fi
            fi
            [ "$ok" = 1 ] || { bad=1; echo "::error::$name is not green apart from the known row"; sed -n '/failing tests:/,$p' "$out/$name.log" | grep -vE '^ℹ ' | head -n 60; }
          done
          exit "$bad"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: crazyagent rows the merge touches, render frames, computer words and theme (expect each filter to list rows and pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          bad=0
          for filter in tui::render_tests:: tui::screens::computer_words_tests tui::theme:: tui::screens::profile_form; do
            log="$RUNNER_TEMP/rows-$(echo "$filter" | tr ':' '_').log"
            cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
            rc=$?
            grep -E '^ +Compiling crazyagent v' "$log" || true
            grep -E '^test .* \.\.\. FAILED$' "$log" || true
            passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
            failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
            echo "rows $filter rc $rc passed $passed failed $failed"
            [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] || { bad=1; awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' | head -n 40; }
          done
          exit "$bad"
  macos:
    name: ON-THIS-MAC merge of b28, desktop files on macos-15
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the merge's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$MERGE" ] || { echo "::error::the parent is not the merge commit"; exit 1; }
          [ "$(git rev-parse HEAD^^2)" = "$CHORE" ] || { echo "::error::the merge's second parent is not chore/v250 ee844fc1e8"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merge commit"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
          echo "01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef  $work/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$work/chrome.zip" "$work"
          chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Print the macOS motion and display settings
        run: |
          set +e
          echo "reduceMotion $(defaults read com.apple.universalaccess reduceMotion 2>&1 | head -1)"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Resolution|UI Looks like' | head -3 || true
          exit 0
      - name: The merged desktop files alone (expect fail 0, or fail 1 that is exactly the known V243-TERMINAL-SETTINGS-PLACE base row)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -u
          out="$RUNNER_TEMP/alone"; mkdir -p "$out"
          bad=0
          for name in $FILES; do
            file="apps/desktop/test/$name.test.mjs"
            [ -f "$file" ] || { echo "::error::missing $file"; bad=1; continue; }
            node --test --test-timeout=60000 --test-reporter=spec "$file" > "$out/$name.log" 2>&1
            rc=$?
            tests=$(grep -E '^ℹ tests ' "$out/$name.log" | awk '{print $3}')
            fail=$(grep -E '^ℹ fail ' "$out/$name.log" | awk '{print $3}')
            echo "== $name rc $rc tests ${tests:-none} fail ${fail:-none}"
            sed -n '/failing tests:/,$p' "$out/$name.log" | grep -E '^✖ ' | grep -v 'failing tests:' | sed -E 's/^✖ (.*) \([0-9.]+m?s\)$/\1/' | sort -u > "$out/$name.failed"
            sed 's/^/  not ok /' "$out/$name.failed"
            ok=0
            if [ -n "$tests" ] && [ "$tests" -ge 1 ]; then
              if [ "$fail" = 0 ] && [ "$rc" = 0 ]; then ok=1; fi
              if [ "$fail" = 1 ] && [ "$(cat "$out/$name.failed")" = "$KNOWN" ]; then ok=1; fi
            fi
            [ "$ok" = 1 ] || { bad=1; echo "::error::$name is not green apart from the known row"; sed -n '/failing tests:/,$p' "$out/$name.log" | grep -vE '^ℹ ' | head -n 60; }
          done
          exit "$bad"
