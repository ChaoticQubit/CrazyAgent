name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 84392800d0563bc220ec3ed46d19803ef255e4e4
  BASE_FULL: f99948f04baf4c1d8a4da28e7ca8ff42de0a7bb3
  RED_FULL: db00b16e8ff0e588cd60a63b1d1e8755ff9ed1a2

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Put-back lock fmt, clippy, the red row at the red commit and at the tip, the restore rows, and the filter 30 times, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -5 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED_FULL" ] || { echo "::error::HEAD~3 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE_FULL" ] || { echo "::error::HEAD~4 is not the put-back tip"; exit 1; }
          [ "$(git diff --name-only "$BASE_FULL" HEAD^ | tr '\n' ' ')" = "crates/kernel/storage/src/restore/recovery.rs crates/kernel/storage/src/restore/recovery/tests.rs " ] || { echo "::error::the tip differs from the base beyond recovery"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of kernel storage (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt -p crazyagent-kernel-storage -- --check > "$RUNNER_TEMP/fmt.log" 2>&1
          code=$?
          head -n 40 "$RUNNER_TEMP/fmt.log"
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel storage --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, the crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage --tests -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate kernel-storage $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g1" -ge 1 ] || exit 1
      - name: The copy row at the red commit, then at the tip (expect FAILED with storage_putback_busy at red, passed at the tip)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          files=(crates/kernel/storage/src/restore/recovery.rs crates/kernel/storage/src/restore/recovery/tests.rs)
          row=restore::recovery::tests::a_copy_of_the_lock_left_in_a_spawned_process_does_not_keep_the_next_lock_out
          one() {
            local log="$RUNNER_TEMP/row-$1.log"
            cargo test --locked -p crazyagent-kernel-storage --lib "$row" -- --exact > "$log" 2>&1
            local code=$?
            grep -E '^test restore::|^test result|panicked at|storage_putback_busy|^error(\[|:)' "$log" | head -n 20 || true
            eval "$1_code=$code $1_failed=$(grep -cE "^test $row \.\.\. FAILED$" "$log" || true) $1_passed=$(grep -cE "^test $row \.\.\. ok$" "$log" || true) $1_busy=$(grep -c storage_putback_busy "$log" || true)"
            echo "row at $1 rc $code"
          }
          git checkout "$RED_FULL" -- "${files[@]}"
          one red
          git checkout HEAD^ -- "${files[@]}"
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip after the red"; exit 1; }
          touch "${files[@]}"
          one tip
          echo "red rc $red_code failed $red_failed busy $red_busy; tip rc $tip_code passed $tip_passed"
          [ "$red_code" != 0 ] && [ "$red_failed" = 1 ] && [ "$red_busy" -ge 1 ] || { echo "::error::the red commit did not fail as expected"; exit 1; }
          [ "$tip_code" = 0 ] && [ "$tip_passed" = 1 ] || exit 1
      - name: restore and held_files rows at the tip, then the filter 30 times (expect rc 0 and 0 failed each)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/set.log"
          cargo test --locked -p crazyagent-kernel-storage --lib -- restore:: held_files:: > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|^test result' "$log" | head -n 20 || true
          echo "set restore:: held_files:: rc $code failed $(grep -cE '^test .* \.\.\. FAILED$' "$log" || true) passed $(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
          [ "$code" = 0 ] || exit 1
          bin="$(cargo test --locked -p crazyagent-kernel-storage --lib --no-run --message-format=json 2>/dev/null | python3 -I -c 'import json,sys
          for l in sys.stdin:
              try: m=json.loads(l)
              except Exception: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["kind"]==["lib"]: print(m["executable"])' | tail -1)"
          [ -x "$bin" ] || { echo "::error::no test binary"; exit 1; }
          bad=0
          for i in $(seq 1 30); do
            r="$RUNNER_TEMP/run.log"
            "$bin" restore::recovery::tests:: held_files:: > "$r" 2>&1
            c=$?
            [ "$i" = 1 ] && grep -E '^test result' "$r"
            [ "$c" = 0 ] || { bad=$((bad+1)); grep -E '^test .* FAILED$|panicked at' "$r" | head -n 5 | sed "s/^/run $i: /"; }
          done
          echo "filter restore::recovery::tests:: held_files:: x30 failing_runs $bad"
          [ "$bad" = 0 ] || exit 1
