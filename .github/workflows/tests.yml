name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  wait-linux:
    name: intake wait assert r2 red a51800710 then green 2b6405b3e rows x10 clippy ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    env:
      RED: a518007107293ced09485219e9503df51c6fc68f
      TIP: 2b6405b3e9bc7a130682648083366f2be025100a
      ROW: engine::owner::transport::intake::tests::a_job_its_guard_ends_while_admit_runs_stays_ended
      ROWS: engine::owner::transport::intake::tests::a_job_its_guard_ends_while_admit_runs_stays_ended engine::owner::transport::intake::tests::an_admit_passes_a_waiting_job_its_guard_ended_before_its_turn projects_home::job::tests::a_job_that_started_its_copy_never_waits
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Red row at the red commit
        timeout-minutes: 60
        run: |
          set -u +e +o pipefail
          git checkout -q -f --detach "$RED"
          git log --oneline -1
          out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
          rc=$?
          echo "red build rc=$rc"
          printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300 | sed 's/^/    /'
          bin=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)
          [ "$rc" -eq 0 ] && [ -n "$bin" ] || exit 1
          out=$("$bin" --exact "$ROW" 2>&1)
          rc=$?
          printf '%s\n' "$out" | grep -A4 'panicked at' | cut -c1-300 | sed 's/^/    /'
          echo "red row rc=$rc $(printf '%s\n' "$out" | grep -m1 'running ')"
          printf '%s\n' "$out" | grep -q 'running 1 test' || exit 1
          [ "$rc" -ne 0 ] || { echo "::error::the red row passed at the red commit"; exit 1; }
          printf '%s\n' "$out" | grep -q 'only a job not yet started waits' || { echo "::error::the red row failed without the job.rs:444 assert"; exit 1; }
          echo "red confirmed: job.rs:444 assert"
      - name: Green rows at the tip
        timeout-minutes: 90
        run: |
          set -u +e +o pipefail
          git checkout -q -f --detach "$TIP"
          git diff --quiet "$TIP" || exit 1
          git log --oneline -1
          out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
          rc=$?
          echo "green build rc=$rc"
          printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300 | sed 's/^/    /'
          bin=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)
          [ "$rc" -eq 0 ] && [ -n "$bin" ] || exit 1
          bad=0
          for row in $ROWS; do
            out=$("$bin" --exact "$row" 2>&1)
            rc=$?
            printf '%s\n' "$out" | grep -A4 'panicked at' | cut -c1-300 | sed 's/^/    /'
            echo "green row $row rc=$rc $(printf '%s\n' "$out" | grep -m1 'test result' | cut -c1-60)"
            { [ "$rc" -eq 0 ] && printf '%s\n' "$out" | grep -q 'running 1 test'; } || bad=1
          done
          fail=0
          waits=0
          for i in $(seq 1 10); do
            out=$("$bin" intake_parallel_tests:: intake::tests:: 2>&1)
            printf '%s\n' "$out" | grep -q 'test result: ok' || fail=$((fail + 1))
            waits=$((waits + $(printf '%s\n' "$out" | grep -c 'only a job not yet started waits')))
            echo "loop $i $(printf '%s\n' "$out" | grep -m1 'test result' | cut -c1-60)"
            printf '%s\n' "$out" | grep -A3 'panicked at' | cut -c1-300 | sed 's/^/    /'
          done
          echo "row loop runs=10 failed_runs=$fail wait_asserts=$waits"
          [ "$bad" -eq 0 ] && [ "$waits" -eq 0 ]
      - name: Clippy at the tip
        if: always()
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q -f --detach "$TIP"
          cargo clippy -p crazyagent --lib --locked -- -D warnings
          cargo clippy -p crazyagent --lib --profile test --locked -- -D warnings
