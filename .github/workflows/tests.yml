name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "26.12.1"
  TIP_FULL: 55d668969baa91897c8bbaedc61195e0ea503763
  RED_FULL: 69f873d50e211fc0d9b90d2b2bdec088bfc9d202
  BASE_FULL: c6f139883806b94c9f7e3ea9d8c5ee3529081ea8
  FIX_RS: "crates/crazyagent/src/projects_home.rs crates/crazyagent/src/projects_home/intake.rs crates/kernel/processes/src/finding.rs"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: MACOS-WORDS-A1-A3 ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            leg: mac
            cache: macOS
            want: "finding::tests::a_missing_git_names_the_command_line_tools_on_macos projects_home::intake::words_tests::a_permission_refusal_names_the_macos_privacy_settings_on_macos"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not chore/v250 c6f1398838"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ matrix.os == 'macos-15' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: node api-intake rows at the tip, then red with the red commit's api-intake.ts (expect tip pass, red fail on the off-macOS sentence)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'macos-15' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log"
          (cd apps/desktop && node --test --test-reporter=tap test/api-intake.test.mjs) > "$RUNNER_TEMP/node-tip.log" 2>&1
          tip=$?
          grep -E '^# (pass|fail)|^not ok' "$RUNNER_TEMP/node-tip.log" || true
          git checkout "$RED_FULL" -- apps/desktop/src/api-intake.ts
          (cd apps/desktop && node --test --test-reporter=tap test/api-intake.test.mjs) > "$RUNNER_TEMP/node-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/api-intake.ts
          grep -E '^# (pass|fail)|^not ok' "$RUNNER_TEMP/node-red.log" || true
          named="$(grep -cE '^not ok [0-9]+ - an iCloud refusal reads as a plain sentence that keeps the folder safe' "$RUNNER_TEMP/node-red.log" || true)"
          echo "node npm rc $ci tip rc $tip red rc $red red names the row $named"
          [ "$ci" = 0 ] && [ "$tip" = 0 ] && [ "$red" != 0 ] && [ "$named" -ge 1 ] || exit 1
      - name: ticket rows at the tip by want list (expect each wanted row ok, failed 0)
        id: tiprows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        env:
          WANT: ${{ matrix.want }}
        run: |
          set +e
          log="$RUNNER_TEMP/rows-tip.log"
          cargo test -p crazyagent-kernel-processes --lib --locked -- a_missing_git_names > "$log" 2>&1
          c1=$?
          cargo test -p crazyagent --lib --locked -- projects_home::intake::words_tests:: >> "$log" 2>&1
          c2=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          read -r -a want <<< "$WANT"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.} \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g0="$(grep -cE '^ +Compiling crazyagent-kernel-processes v' "$log" || true)"
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "tip rows rc $c1 $c2 failed $failed wanted ${#want[@]} ok $ok gates crazyagent-kernel-processes $g0 crazyagent $g1"
          [ "$c1" = 0 ] && [ "$c2" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "${#want[@]}" = 2 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: Red commit's three fix files under the same rows (macOS keeps its sentences, so these rows are guards; expect both wanted rows ok, rc 0, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        env:
          WANT: ${{ matrix.want }}
        run: |
          set +e
          read -r -a files <<< "$FIX_RS"
          git checkout "$RED_FULL" -- "${files[@]}"
          git diff --cached --stat HEAD^ | tail -n 1
          sleep 2
          touch "${files[@]}"
          log="$RUNNER_TEMP/rows-red.log"
          cargo test -p crazyagent-kernel-processes --lib --locked -- a_missing_git_names > "$log" 2>&1
          c1=$?
          cargo test -p crazyagent --lib --locked -- projects_home::intake::words_tests:: >> "$log" 2>&1
          c2=$?
          grep -E '^test .* (ok|FAILED)$|^test result:' "$log" || true
          read -r -a want <<< "$WANT"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.} \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g0="$(grep -cE '^ +Compiling crazyagent-kernel-processes v' "$log" || true)"
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "red-commit rows rc $c1 $c2 wanted ${#want[@]} ok $ok gates crazyagent-kernel-processes $g0 crazyagent $g1"
          [ "$c1" = 0 ] && [ "$c2" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
