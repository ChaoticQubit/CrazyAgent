name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  NEW: 6c428a29a422fcd94c09e5c113d109b12bae8454
  BEFORE: 627e24a643f2e9a629500a5c6200e7fdacb527dd
  PERF_NS_SHA256: 767d74080206a330c034990064ef4b442e57c49d79a94f49847e96d5e7f870e0
  NEW_BASE: 35667a7805fd3c15535f9bd4cbe33c9c28fa766b
  BEFORE_BASE: 08deedec3f5cbe8e23ba84b2fc12c297a51f66a1
  RATIOS_SHA256: 9d8324ca9149a0205bb1ff3a819b9b0325ac0faba18b70e50d3602598a235216
  AB_BLOCKS: "8"
  AA_BLOCKS: "8"
  FILTER: perf_tests::root_files::storage_root_file_calls
  PACKAGE_DIR: crates/kernel/storage
  SPIN_NS: "1289"

defaults:
  run:
    shell: bash

jobs:
  sitting:
    name: GATE-DESIGN-0930 calibration sitting 2 pod B, PERF lines in ns on both sides, 2.5 35667a7805 vs before 08deedec3f vs a byte-equal 2.5 copy, root file rows + a planted 1289 ns row, 8 A/B + 8 A/A blocks, quiet then loaded
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the two parents and their bases, lay out the trees
        run: |
          set -euo pipefail
          for c in "$NEW" "$BEFORE" "$NEW_BASE" "$BEFORE_BASE" "$RATIOS_SHA256" "$PERF_NS_SHA256"; do [[ "$c" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]] || { echo "::error::$c is not a full hex id"; exit 1; }; done
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^1)" = "$NEW" ] || { echo "::error::the first parent is not the 2.5 probe"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$BEFORE" ] || { echo "::error::the second parent is not the before probe"; exit 1; }
          [ "$(git rev-parse --verify -q 'HEAD^3' || true)" = "" ] || { echo "::error::more than two parents"; exit 1; }
          [ "$(git diff --name-only HEAD^1 HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit changes more than tests.yml"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the 2.5 probe"; exit 1; }
          for c in "$NEW_BASE" "$BEFORE_BASE"; do git cat-file -e "$c^{commit}" || { echo "::error::$c is not in the clone"; exit 1; }; done
          [ "$(git rev-parse "$NEW^")" = "$NEW_BASE" ] || { echo "::error::the 2.5 probe is not on $NEW_BASE"; exit 1; }
          [ "$(git rev-parse "$BEFORE^")" = "$BEFORE_BASE" ] || { echo "::error::the before probe is not on $BEFORE_BASE"; exit 1; }
          rows=crates/kernel/storage/src/perf_tests/root_files.rs
          for pair in "$NEW_BASE:$NEW" "$BEFORE_BASE:$BEFORE"; do
            base=${pair%%:*}; side=${pair#*:}
            [ "$(git diff --name-only "$base" "$side" | tr '\n' ' ')" = "crates/kernel/common/src/perf_kit.rs crates/kernel/common/src/perf_kit_tests.rs $rows " ] || { echo "::error::the probe on $base changes more than perf_kit and the root file rows"; exit 1; }
            got=$(git -c core.abbrev=10 diff "$base" "$side" -- crates/kernel/common/src/perf_kit.rs crates/kernel/common/src/perf_kit_tests.rs | shasum -a 256 | cut -d' ' -f1)
            [ "$got" = "$PERF_NS_SHA256" ] || { echo "::error::the perf_kit change on $base is not the ns patch: $got"; exit 1; }
            echo "PERF-NS $side diff sha256 $got"
          done
          [ "$(git diff --name-only "$BEFORE_BASE" "$NEW_BASE" | tr '\n' ' ')" = "crates/kernel/storage/src/restore/record.rs crates/kernel/storage/src/restore/tests.rs " ] || { echo "::error::before and 2.5 differ in more than the record and its tests"; exit 1; }
          git diff --quiet "$NEW_BASE" "$BEFORE_BASE" -- crates/kernel/storage/src/perf_tests.rs crates/kernel/storage/src/perf_tests crates/kernel/common/src/perf_kit.rs crates/kernel/common/src/perf_kit_tests.rs || { echo "::error::the base perf files differ"; exit 1; }
          git diff --quiet "$NEW" "$BEFORE" -- crates/kernel/common/src/perf_kit.rs crates/kernel/common/src/perf_kit_tests.rs || { echo "::error::the two sides' perf_kit differ"; exit 1; }
          [ "$(git diff --numstat "$BEFORE" "$NEW" -- "$rows" | tr '\t' ' ')" = "4 1 $rows" ] || { echo "::error::the two probes differ in more than the spin"; exit 1; }
          [ "$(git diff "$BEFORE" "$NEW" -- "$rows" | grep -E '^[-+][^-+]' | tr -s ' ' | tr '\n' '|')" = "-const PLANTED_SPIN: Duration = Duration::from_nanos(0);|+const PLANTED_SPIN: Duration = Duration::from_nanos(1289);|+ time(&row(\"migrations.planted.spin\", READ_BATCH), SAMPLES, || {|+ spin(PLANTED_SPIN);|+ });|" ] || { echo "::error::the probe difference is not the planted spin"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/before" "$BEFORE"
          [ "$(git -C "$RUNNER_TEMP/before" rev-parse HEAD)" = "$BEFORE" ] || { echo "::error::the before tree is not the before commit"; exit 1; }
          {
            echo "NEW_DIR=$PWD"
            echo "BEFORE_DIR=$RUNNER_TEMP/before"
          } >> "$GITHUB_ENV"
      - name: Record the runner
        run: |
          set -euo pipefail
          echo "RUNNER image=${ImageOS:-unknown} version=${ImageVersion:-unknown} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT new=$NEW before=$BEFORE"
          echo "RUNNER $(sw_vers -productVersion) $(uname -m) cpu=$(sysctl -n machdep.cpu.brand_string) ncpu=$(sysctl -n hw.ncpu) mem_gb=$(( $(sysctl -n hw.memsize) / 1073741824 )) load=$(sysctl -n vm.loadavg)"
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Write the sitting scripts and the gate tool
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/measure.sh" <<'EOF'
          set -u
          build=$1 label=$2 condition=$3 block=$4
          case $build in 2.5) bin=$NEW_BIN dir=$NEW_DIR commit=$NEW;; before) bin=$BEFORE_BIN dir=$BEFORE_DIR commit=$BEFORE;; 2.5-copy) bin=$COPY_BIN dir=$NEW_DIR commit=$NEW;; *) echo "unknown build $build" >&2; exit 2;; esac
          start=$(sysctl -n vm.loadavg | awk '{print $2}')
          echo "PERF-RUN build=$build label=$label commit=${commit:0:10} condition=$condition block=$block load1=$start date=$(date -u +%Y-%m-%dT%H:%M:%S)"
          (cd "$dir/$PACKAGE_DIR" && "$bin" "$FILTER" --exact --ignored --nocapture --test-threads=1 2>&1) | sed -E 's/^test [^ ]+ \.\.\. (PERF )/\1/'
          rc=${PIPESTATUS[0]}
          echo "PERF-RUN-END build=$build label=$label rc=$rc load1_start=$start load1_end=$(sysctl -n vm.loadavg | awk '{print $2}') date=$(date -u +%Y-%m-%dT%H:%M:%S)"
          EOF
          cat > "$RUNNER_TEMP/sitting.sh" <<'EOF'
          set -u
          condition=$1
          log="$RUNNER_TEMP/$condition.log"
          : > "$log"
          for build in 2.5 before 2.5-copy; do
            bash "$RUNNER_TEMP/measure.sh" "$build" W "$condition" "warmup-$build" > "$RUNNER_TEMP/$condition-warmup-$build.out"
          done
          quiet_wait() {
            local waited=0 l1
            while :; do
              l1=$(sysctl -n vm.loadavg | awk '{print $2}')
              echo "QUIET-WAIT block=$1 load1=$l1 waited_s=$waited" | tee -a "$log"
              awk -v l="$l1" 'BEGIN{exit !(l<3)}' && break
              if [ "$waited" -ge 1800 ]; then
                echo "::error::load1 stayed at 3 or more for 30 min before quiet block $1, so the quiet half is not quiet"
                exit 1
              fi
              sleep 30
              waited=$((waited + 30))
            done
            echo "QUIET-READY block=$1 load1=$l1 waited_s=$waited" | tee -a "$log"
          }
          [ "$AB_BLOCKS" = "$AA_BLOCKS" ] || { echo "::error::the A/B and A/A block counts differ"; exit 1; }
          for i in $(seq 1 "$AB_BLOCKS"); do
            if [ "$condition" = quiet ]; then quiet_wait "$i"; fi
            for build in 2.5 before before 2.5; do
              case $build in 2.5) label=A;; *) label=C;; esac
              bash "$RUNNER_TEMP/measure.sh" "$build" "$label" "$condition" "$i" >> "$log"
            done
            if [ "$condition" = quiet ]; then quiet_wait "aa$i"; fi
            for build in 2.5 2.5-copy 2.5-copy 2.5; do
              case $build in 2.5) label=A;; *) label=A2;; esac
              bash "$RUNNER_TEMP/measure.sh" "$build" "$label" "$condition" "aa$i" >> "$log"
            done
          done
          echo "SITTING $condition runs=$(grep -c '^PERF-RUN ' "$log") rows=$(grep -c '^PERF ' "$log") failed_runs=$(grep -E '^PERF-RUN-END' "$log" | grep -vc ' rc=0 ' || true)"
          EOF
          cat > "$RUNNER_TEMP/ratios.py" <<'EOF'
          import math, random, re, statistics, sys

          UNIT_NS = {"p50_ns": 1, "p50": 1000}
          P95_OF = {"p50_ns": "p95_ns", "p50": "p95"}


          def parse(log):
              """Reads a sitting log into runs, every row's p50 and p95 in ns; a row printed in whole
              microseconds is refused, its 1 us step being wider than the gate. Input: the log path. Output: a list of runs, each a dict with build, label,
              block, the p50 rows and the p95 rows as {(module, name): ns} and the units seen.
              """
              runs = []
              for line in open(log, errors="replace"):
                  head = re.match(r"PERF-RUN build=(\S+) label=(\S+) .* block=(\S+) load1=(\S+)", line)
                  if head:
                      runs.append({"build": head.group(1), "label": head.group(2), "block": head.group(3), "rows": {}, "p95": {}, "units": {}})
                      continue
                  row = re.match(r"PERF \d+ (\S+) (\S+) (p50_ns|p50)=(\d+) (p95_ns|p95)=(\d+)", line)
                  if row and runs:
                      assert row.group(3) == "p50_ns", f"us-floored row, every side must print ns: {line.strip()}"
                      key = (row.group(1), row.group(2))
                      runs[-1]["rows"][key] = int(row.group(4)) * UNIT_NS[row.group(3)]
                      assert row.group(5) == P95_OF[row.group(3)], line
                      runs[-1]["p95"][key] = int(row.group(6)) * UNIT_NS[row.group(3)]
                      runs[-1]["units"][key] = row.group(3)
              for run in runs:
                  assert set(run["rows"]) == set(run["units"]) == set(run["p95"])
              return runs


          def median(runs, build=None, block=None, label=None, field="rows"):
              """Takes the median ns per row over the runs that match. Inputs: the runs, the build,
              block and label to keep (none for any) and the field, p50 rows or p95. Output:
              {(module, name): median ns}."""
              out = {}
              for r in runs:
                  if build and r["build"] != build:
                      continue
                  if block and r["block"] != block:
                      continue
                  if label and r["label"] != label:
                      continue
                  for key, value in r[field].items():
                      out.setdefault(key, []).append(value)
              return {key: statistics.median(values) for key, values in out.items()}


          def band(runs, field):
              """Takes the A/A band per row: the largest over the smallest value across the A/A runs,
              minus 1, so two runs that differ by 3% give 0.030 however their medians fall. Inputs:
              the A/A runs and the field, p50 rows or p95. Output: {(module, name): band}, rows with
              under two runs left out."""
              values = {}
              for r in runs:
                  for key, value in r[field].items():
                      values.setdefault(key, []).append(value)
              out = {key: max(v) / min(v) - 1 for key, v in values.items() if len(v) >= 2 and min(v) > 0}
              assert all(b >= 0 for b in out.values())
              return out


          def report(runs, new="2.5", old="2.4.4", aa=None):
              """Builds the RATIOS lines, every value in ns, a row SLOWER only when the new build is
              slower in every scored block. Inputs: the parsed runs, the new and old build names and
              the build of an A/A copy of the new build timed inside the blocks, if any; with none
              the A/A gap reads the aa block's A1 and A2 runs. Output: the lines and the slower count."""
              assert new != old and aa not in (new, old)
              blocks = sorted({r["block"] for r in runs if r["block"] not in ("aa", "warmup")})
              scored = [r for r in runs if r["block"] in blocks]
              new_all, old_all = median(scored, new), median(scored, old)
              new_95, old_95 = median(scored, new, field="p95"), median(scored, old, field="p95")
              per_block = {b: (median(runs, new, b), median(runs, old, b)) for b in blocks}
              if aa is None:
                  a1, a2 = median(runs, new, "aa", "A1"), median(runs, new, "aa", "A2")
                  copies = [r for r in runs if r["build"] == new and r["block"] == "aa"]
              else:
                  a1, a2 = new_all, median(scored, aa)
                  copies = [r for r in scored if r["build"] in (new, aa)]
              bands, bands95 = band(copies, "rows"), band(copies, "p95")
              units = {}
              for r in runs:
                  for key, unit in r["units"].items():
                      units.setdefault(key, set()).add(unit)
              lines = [f"RATIOS unit=ns runs={len(runs)} scored={len(scored)} blocks={','.join(blocks)}"]
              slower = 0
              for key in sorted(set(new_all) | set(old_all)):
                  n, o = new_all.get(key), old_all.get(key)
                  cells = []
                  for b in blocks:
                      bn, bo = per_block[b][0].get(key), per_block[b][1].get(key)
                      word = "-" if bn is None or bo is None else ("slow" if bn > bo else "fast" if bn < bo else "eq")
                      cells.append(f"B{b}{word} {bn}/{bo}")
                  gap = f"{a2[key] / a1[key]:.2f}" if a1.get(key) and key in a2 else "-"
                  ratio = "-" if n is None or not o else f"{n / o:.2f}"
                  n95, o95 = new_95.get(key), old_95.get(key)
                  ratio95 = "-" if n95 is None or not o95 else f"{n95 / o95:.2f}"
                  flag = ""
                  if cells and all(c.split(" ")[0].endswith("slow") for c in cells):
                      flag = " SLOWER"
                      slower += 1
                  mixed = " units=" + "+".join(sorted(units[key])) if len(units[key]) > 1 else ""
                  b50 = f"{bands[key]:.3f}" if key in bands else "-"
                  b95 = f"{bands95[key]:.3f}" if key in bands95 else "-"
                  lines.append(f"ROW {'.'.join(key)} {new}={n}ns {old}={o}ns ratio={ratio} p95 {new}={n95}ns {old}={o95}ns p95_ratio={ratio95} {' | '.join(cells)} aa_gap={gap} aa_band={b50} aa_band95={b95}{flag}{mixed}")
              lines.append(f"SLOWER-ROWS {slower}")
              return lines, slower


          AB_BLOCKS, AA_BLOCKS = 8, 8
          RESAMPLES, SEED = 2000, 20261128
          DELTA = {"p50": 0.03, "p95": 0.10}
          FIELDS = {"p50": "rows", "p95": "p95"}


          def block_logs(runs, first, second, field):
              """Takes one log ratio per block and row: log of the median of `first`'s runs over the
              median of `second`'s, for the blocks holding both builds. Inputs: the runs, the two
              build names and the field. Output: {key: [log ratio per block]} and the block count."""
              blocks = {}
              for r in runs:
                  if r["build"] in (first, second):
                      blocks.setdefault(r["block"], []).append(r)
              out, count = {}, 0
              for runs_in in blocks.values():
                  builds = {r["build"] for r in runs_in}
                  if builds != {first, second}:
                      continue
                  count += 1
                  keys = set.intersection(*(set(r[FIELDS[field]]) for r in runs_in))
                  for key in keys:
                      a = statistics.median(r[FIELDS[field]][key] for r in runs_in if r["build"] == first)
                      b = statistics.median(r[FIELDS[field]][key] for r in runs_in if r["build"] == second)
                      assert a > 0 and b > 0, key
                      out.setdefault(key, []).append(math.log(a / b))
              return out, count


          def interval(values):
              """Takes the median of the block log ratios and its 95% interval by a bootstrap over
              blocks, RESAMPLES draws from a generator seeded with SEED. Input: the log ratios.
              Output: (median, low, high)."""
              rng = random.Random(SEED)
              draws = sorted(statistics.median(rng.choices(values, k=len(values))) for _ in range(RESAMPLES))
              low, high = draws[int(0.025 * RESAMPLES)], draws[int(0.975 * RESAMPLES) - 1]
              assert low <= high
              return statistics.median(values), low, high


          def verdict(low, high, aa_low, aa_high, delta):
              """Reads one field: VOID when the A/A interval lies wholly outside +-log(1+delta), a
              bench bias of practical size; SLOWER when the interval's low end is above log(1+delta),
              FASTER when its high end is below -log(1+delta), WITHIN when it lies inside, else
              INCONCLUSIVE. Inputs: both intervals and delta. Output: the word."""
              edge = math.log(1 + delta)
              if aa_low > edge or aa_high < -edge:
                  return "VOID"
              if low > edge:
                  return "SLOWER"
              if high < -edge:
                  return "FASTER"
              if -edge <= low and high <= edge:
                  return "WITHIN"
              return "INCONCLUSIVE"


          def judge(runs, new, before, copy):
              """Judges every row of one sitting and condition on the design's shape: exactly
              AB_BLOCKS blocks of NEW against BEFORE and AA_BLOCKS of NEW against its byte-equal copy.
              Inputs: the runs and the three build names. Output: {key: {field: result}}."""
              out = {}
              for field in ("p50", "p95"):
                  ab, ab_count = block_logs(runs, new, before, field)
                  aa, aa_count = block_logs(runs, new, copy, field)
                  assert ab_count == AB_BLOCKS and aa_count == AA_BLOCKS, f"blocks: {ab_count} A/B, {aa_count} A/A"
                  for key in ab:
                      assert len(ab[key]) == AB_BLOCKS and len(aa.get(key, [])) == AA_BLOCKS, key
                      m, low, high = interval(ab[key])
                      aa_m, aa_low, aa_high = interval(aa[key])
                      out.setdefault(key, {})[field] = {
                          "verdict": verdict(low, high, aa_low, aa_high, DELTA[field]),
                          "r": math.exp(m), "low": math.exp(low), "high": math.exp(high),
                          "aa_r": math.exp(aa_m), "aa_low": math.exp(aa_low), "aa_high": math.exp(aa_high),
                      }
              return out


          def arguments(words):
              """Reads the command line: the log, then `--pair NEW,OLD` and `--aa BUILD`, each at most
              once. Input: the words after the script. Output: the log and the report keywords."""
              log, options = words[0], {}
              rest = words[1:]
              while rest:
                  flag, value, rest = rest[0], rest[1], rest[2:]
                  assert flag in ("--pair", "--aa") and flag not in options, flag
                  options[flag] = value
              keywords = {}
              if "--pair" in options:
                  keywords["new"], keywords["old"] = options["--pair"].split(",")
              if "--aa" in options:
                  keywords["aa"] = options["--aa"]
              return log, keywords


          def gate_lines(runs, new, before, copy):
              """Builds the GATE lines of the design gate: per row and field the block median ratio,
              its 95% interval, the same for the A/A blocks and the verdict. Inputs: the runs and the
              three build names. Output: the lines."""
              lines = []
              for key, fields in sorted(judge(runs, new, before, copy).items()):
                  for field, x in fields.items():
                      lines.append(f"GATE {'.'.join(key)} {field} r={x['r']:.3f} [{x['low']:.3f}, {x['high']:.3f}] aa={x['aa_r']:.3f} [{x['aa_low']:.3f}, {x['aa_high']:.3f}] {x['verdict']}")
              return lines


          if __name__ == "__main__":
              if "--gate" in sys.argv:
                  at = sys.argv.index("--gate")
                  new, before, copy = sys.argv[at + 1].split(",")
                  out = gate_lines(parse(sys.argv[1]), new, before, copy)
              else:
                  log, keywords = arguments(sys.argv[1:])
                  out = report(parse(log), **keywords)[0]
              for line in out:
                  print(line)
          EOF
          [ "$(shasum -a 256 "$RUNNER_TEMP/ratios.py" | cut -d' ' -f1)" = "$RATIOS_SHA256" ] || { echo "::error::ratios.py is not the gate version"; exit 1; }
          echo "RATIOS-PY sha256 $RATIOS_SHA256"
          for f in measure sitting; do bash -n "$RUNNER_TEMP/$f.sh"; done
          python3 -I -m py_compile "$RUNNER_TEMP/ratios.py"
      - name: Fetch the locked crates for both trees
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          (cd "$BEFORE_DIR" && cargo fetch --locked)
      - name: Build both bench binaries and the byte-equal 2.5 copy
        timeout-minutes: 120
        run: |
          set +e
          set -uo pipefail
          for build in 2.5 before; do
            case $build in 2.5) dir=$NEW_DIR;; *) dir=$BEFORE_DIR;; esac
            (cd "$dir" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$build" cargo test --release --locked -p crazyagent-kernel-storage --lib --no-run) > "$RUNNER_TEMP/build-$build.log" 2>&1
            rc=$?
            grep -E '^(error|warning)(\[|:)|^ +--> ' "$RUNNER_TEMP/build-$build.log" | head -n 60 || true
            tail -n 5 "$RUNNER_TEMP/build-$build.log"
            echo "BUILD $build rc $rc gate $(grep -cE '^ +Compiling crazyagent-kernel-storage v' "$RUNNER_TEMP/build-$build.log" || true)"
            [ "$rc" = 0 ] || { echo "::error::the $build bench binary did not build"; exit 1; }
            bin="$(grep -oE 'Executable unittests src/lib\.rs \([^)]+\)' "$RUNNER_TEMP/build-$build.log" | sed -E 's/.*\(//; s/\)$//' | tail -n 1)"
            case $bin in /*) ;; *) bin="$dir/$bin";; esac
            [ -n "$bin" ] && [ -x "$bin" ] || { echo "::error::no lib test binary for $build: $bin"; exit 1; }
            case $build in 2.5) new_bin="$bin";; *) before_bin="$bin";; esac
          done
          mkdir -p "$RUNNER_TEMP/copy"
          copy_bin="$RUNNER_TEMP/copy/$(basename "$new_bin")"
          cp -p "$new_bin" "$copy_bin"
          new_sha=$(shasum -a 256 "$new_bin" | cut -d' ' -f1)
          [ "$(shasum -a 256 "$copy_bin" | cut -d' ' -f1)" = "$new_sha" ] || { echo "::error::the copy is not byte-equal"; exit 1; }
          [ "$(shasum -a 256 "$before_bin" | cut -d' ' -f1)" != "$new_sha" ] || { echo "::error::before and 2.5 are the same binary"; exit 1; }
          echo "BIN 2.5 $new_bin $new_sha"
          echo "BIN 2.5-copy $copy_bin $(shasum -a 256 "$copy_bin" | cut -d' ' -f1)"
          echo "BIN before $before_bin $(shasum -a 256 "$before_bin" | cut -d' ' -f1)"
          {
            echo "NEW_BIN=$new_bin"
            echo "BEFORE_BIN=$before_bin"
            echo "COPY_BIN=$copy_bin"
          } >> "$GITHUB_ENV"
          for pair in "2.5:$new_bin:$NEW_DIR" "before:$before_bin:$BEFORE_DIR" "2.5-copy:$copy_bin:$NEW_DIR"; do
            name=${pair%%:*}; rest=${pair#*:}; b=${rest%%:*}; d=${rest#*:}
            listed=$(cd "$d/$PACKAGE_DIR" && "$b" "$FILTER" --exact --ignored --list 2>/dev/null | grep -c ': test$' || true)
            echo "LISTED $name $FILTER $listed of 1"
            [ "$listed" = 1 ] || { echo "::error::the $name binary lists $listed rows, not 1"; exit 1; }
          done
      - name: Quiet sitting (the runner alone)
        timeout-minutes: 90
        run: |
          set -uo pipefail
          echo "QUIET-START load=$(sysctl -n vm.loadavg)"
          bash "$RUNNER_TEMP/sitting.sh" quiet
          echo "QUIET-END load=$(sysctl -n vm.loadavg)"
          grep -E '^PERF-RUN-END' "$RUNNER_TEMP/quiet.log" | grep -v ' rc=0 ' && { echo "::error::a quiet run failed"; exit 1; } || true
      - name: Loaded sitting (the same runner with a parallel cargo build of the workspace)
        timeout-minutes: 120
        run: |
          set -uo pipefail
          stop="$RUNNER_TEMP/load.stop"
          rm -f "$stop"
          set -m
          (
            n=0
            while [ ! -e "$stop" ]; do
              n=$((n + 1))
              (cd "$NEW_DIR" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-load" cargo build --workspace --locked --exclude crazyagent-desktop) > "$RUNNER_TEMP/load-$n.log" 2>&1
              echo "LOAD-BUILD $n rc $? $(date -u +%H:%M:%S)" >> "$RUNNER_TEMP/load.log"
              rm -rf "$RUNNER_TEMP/target-load"
            done
          ) &
          loader=$!
          set +m
          sleep 90
          echo "LOADED-START load=$(sysctl -n vm.loadavg)"
          bash "$RUNNER_TEMP/sitting.sh" loaded
          echo "LOADED-END load=$(sysctl -n vm.loadavg)"
          touch "$stop"
          kill -TERM -- "-$loader" 2>/dev/null || true
          wait "$loader" || true
          cat "$RUNNER_TEMP/load.log" 2>/dev/null || true
          echo "LOAD-STOPPED builds_finished=$(grep -c '^LOAD-BUILD' "$RUNNER_TEMP/load.log" 2>/dev/null || echo 0) builds_started=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'load-*.log' | wc -l | tr -d ' ')"
          [ "$(find "$RUNNER_TEMP" -maxdepth 1 -name 'load-*.log' | wc -l | tr -d ' ')" -ge 1 ] || { echo "::error::the loader never ran"; exit 1; }
          grep -E '^PERF-RUN-END' "$RUNNER_TEMP/loaded.log" | grep -v ' rc=0 ' && { echo "::error::a loaded run failed"; exit 1; } || true
      - name: Gate lines and the calibration checks
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for condition in quiet loaded; do
            [ -f "$RUNNER_TEMP/$condition.log" ] || { echo "NO $condition log"; continue; }
            echo "== $condition GATE 2.5 ${NEW:0:10} vs before ${BEFORE:0:10}, A/A vs the byte-equal copy (ratios.py $RATIOS_SHA256, image ${ImageOS:-unknown} ${ImageVersion:-unknown}, run $GITHUB_RUN_ID)"
            python3 -I "$RUNNER_TEMP/ratios.py" "$RUNNER_TEMP/$condition.log" --gate 2.5,before,2.5-copy | tee "$RUNNER_TEMP/$condition.gate"
            for row in migrations.backup_failure migrations.backups_in migrations.pinned restore.restorable_until; do
              for field in p50 p95; do
                got=$(awk -v r="storage.$row" -v f="$field" '$2 == r && $3 == f {print $NF}' "$RUNNER_TEMP/$condition.gate")
                echo "CAL $condition $row $field expect WITHIN got ${got:-none} $([ "$got" = WITHIN ] && echo PASS || echo FAIL)"
              done
            done
            for field in p50 p95; do
              got=$(awk -v f="$field" '$2 == "storage.migrations.planted" && $3 == f {print $NF}' "$RUNNER_TEMP/$condition.gate")
              echo "CAL $condition migrations.planted $field expect SLOWER got ${got:-none} $([ "$got" = SLOWER ] && echo PASS || echo FAIL)"
            done
            echo "CAL $condition void_rows $(grep -c ' VOID$' "$RUNNER_TEMP/$condition.gate" || true)"
            awk '/^PERF-RUN /{b=$2} /^PERF / && $4 == "migrations.planted.spin" && b == "build=2.5" {print $5}' "$RUNNER_TEMP/$condition.log" | sed 's/p50_ns=//' | sort -n | awk -v s="$SPIN_NS" -v c="$condition" '{v[NR]=$1} END{m=(NR%2)?v[(NR+1)/2]:(v[NR/2]+v[NR/2+1])/2; printf "SPIN %s alone p50 median %d ns over %d runs, target %d ns, ratio %.3f\n", c, m, NR, s, m/s}'
            grep -E '^PERF-RUN-END' "$RUNNER_TEMP/$condition.log" | awk '{print "LOAD1 " $2 " " $3 " " $5 " " $6}'
          done
      - name: Keep the raw sitting logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sitting-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quiet.log
            ${{ runner.temp }}/loaded.log
            ${{ runner.temp }}/load.log
            ${{ runner.temp }}/*.gate
            ${{ runner.temp }}/*-warmup-*.out
          retention-days: 14
