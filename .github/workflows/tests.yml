name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  T25: 4d42946349f6f25512bf841441337ac837d4edca
  TTW: 10bd05ef88b0197a7e5d03cf5fa9aa32370b6118

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Pod D keychain build on macos-15 (2.5 kernel-security, 2.5 crazyagent, twin crazyagent, one target at a time)
    runs-on: macos-15
    timeout-minutes: 340
    env:
      FLAME_OUT: ${{ github.workspace }}/flame-out
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check the two parents, lay out the trees and apply the probe diffs
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^1)" = "$T25" ] || { echo "::error::parent 1 is not the 2.5 tree"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$TTW" ] || { echo "::error::parent 2 is not the twin tree"; exit 1; }
          [ "$(git rev-parse --verify -q 'HEAD^3' || true)" = "" ] || { echo "::error::more than two parents"; exit 1; }
          want=".github/probe/flame-farm.sh .github/probe/flame.py .github/probe/kc-probe-25.diff .github/probe/kc-probe-twin.diff .github/probe/pd-farm.sh .github/probe/sdk-samples-25.diff .github/probe/sdk-samples-twin.diff .github/probe/split.py .github/probe/sysc.py .github/workflows/tests.yml "
          [ "$(git diff --name-only HEAD^1 HEAD | sort | tr '\n' ' ')" = "$want" ] || { echo "::error::the farm commit changes more than the probe files"; exit 1; }
          cp -R .github/probe "$RUNNER_TEMP/probe"
          git worktree add --detach "$RUNNER_TEMP/t25" "$T25"
          git worktree add --detach "$RUNNER_TEMP/ttw" "$TTW"
          for t in t25:25 ttw:twin; do
            dir="$RUNNER_TEMP/${t%%:*}"
            for d in kc-probe sdk-samples; do
              git -C "$dir" apply --check "$RUNNER_TEMP/probe/$d-${t#*:}.diff"
              git -C "$dir" apply "$RUNNER_TEMP/probe/$d-${t#*:}.diff"
            done
            echo "TREE ${t%%:*} $(git -C "$dir" rev-parse HEAD) $(git -C "$dir" diff --stat | tail -n 1)"
          done
          mkdir -p "$FLAME_OUT"
          echo "PATHS runner_temp=$RUNNER_TEMP workspace=$GITHUB_WORKSPACE" | tee "$FLAME_OUT/PATHS.txt"
      - name: Record the runner
        run: |
          set -euo pipefail
          echo "RUNNER image=${ImageOS:-unknown} version=${ImageVersion:-unknown} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "RUNNER $(sw_vers -productVersion) $(uname -m) ncpu=$(sysctl -n hw.ncpu) mem_gb=$(( $(sysctl -n hw.memsize) / 1073741824 )) load=$(sysctl -n vm.loadavg)"
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the release test binaries, one target at a time, each with --timings
        timeout-minutes: 330
        run: |
          set -euo pipefail
          mkdir -p "$FLAME_OUT/bins" "$FLAME_OUT/timings"
          : > "$FLAME_OUT/BINS.txt"
          for spec in k25:t25:crazyagent-kernel-security s25:t25:crazyagent twin:ttw:crazyagent; do
            side=${spec%%:*}; rest=${spec#*:}; tree=${rest%%:*}; pkg=${rest#*:}
            dir="$RUNNER_TEMP/$tree"; log="$RUNNER_TEMP/build-$side.json"; start=$(date +%s)
            (cd "$dir" && cargo fetch --locked > /dev/null && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$side" CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo test --release --locked -p "$pkg" --lib --no-run --timings --message-format=json > "$log" 2> "$log.err") || { tail -n 30 "$log.err"; exit 1; }
            bin=$(python3 -I -c 'import json,sys
          found=[]
          for l in open(sys.argv[1]):
              try: m=json.loads(l)
              except ValueError: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["kind"]==["lib"] and m["profile"]["test"]: found.append(m["executable"])
          print(found[-1] if found else "")' "$log")
            [ -x "$bin" ] || { echo "::error::no test binary for $side"; exit 1; }
            cp "$RUNNER_TEMP/target-$side/cargo-timings/cargo-timing.html" "$FLAME_OUT/timings/$side.html"
            cp "$bin" "$FLAME_OUT/bins/$side"
            echo "$side $bin" >> "$FLAME_OUT/BINS.txt"
            echo "BUILD $side $(git -C "$dir" rev-parse --short=10 HEAD) $pkg rc=0 min=$(( ($(date +%s) - start) / 60 )) bin=$bin df=$(df -g "$RUNNER_TEMP" | awk 'NR==2{print $4}')G" | tee -a "$FLAME_OUT/RUNS.txt"
            rm -rf "$RUNNER_TEMP/target-$side"
          done
          (cd "$FLAME_OUT/bins" && shasum -a 256 k25 s25 twin) | tee "$FLAME_OUT/SHA256.txt"
          cat "$FLAME_OUT/BINS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pod-d-kc-bins
          path: flame-out
          if-no-files-found: warn
          retention-days: 1

  measure:
    name: Pod D keychain swap, secrets flame and syscalls on macos-15 (2.5 and twin on this runner, quiet then loaded)
    needs: build
    runs-on: macos-15
    timeout-minutes: 300
    env:
      FLAME_OUT: ${{ github.workspace }}/flame-out
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check the two parents, lay out the trees and apply the probe diffs
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^1)" = "$T25" ] || { echo "::error::parent 1 is not the 2.5 tree"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$TTW" ] || { echo "::error::parent 2 is not the twin tree"; exit 1; }
          [ "$(git rev-parse --verify -q 'HEAD^3' || true)" = "" ] || { echo "::error::more than two parents"; exit 1; }
          cp -R .github/probe "$RUNNER_TEMP/probe"
          git worktree add --detach "$RUNNER_TEMP/t25" "$T25"
          git worktree add --detach "$RUNNER_TEMP/ttw" "$TTW"
          for t in t25:25 ttw:twin; do
            dir="$RUNNER_TEMP/${t%%:*}"
            for d in kc-probe sdk-samples; do
              git -C "$dir" apply --check "$RUNNER_TEMP/probe/$d-${t#*:}.diff"
              git -C "$dir" apply "$RUNNER_TEMP/probe/$d-${t#*:}.diff"
            done
            echo "TREE ${t%%:*} $(git -C "$dir" rev-parse HEAD) $(git -C "$dir" diff --stat | tail -n 1)"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pod-d-kc-bins
          path: ${{ runner.temp }}/bins-in
      - name: Check the paths and the binary hashes, then put each binary at its build path
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/bins-in"
          want="PATHS runner_temp=$RUNNER_TEMP workspace=$GITHUB_WORKSPACE"
          [ "$(cat "$in/PATHS.txt")" = "$want" ] || { echo "::error::paths differ from the build job: $(cat "$in/PATHS.txt") vs $want"; exit 1; }
          (cd "$in/bins" && shasum -a 256 -c "$in/SHA256.txt") || { echo "::error::a binary hash does not match"; exit 1; }
          [ "$(wc -l < "$in/SHA256.txt" | tr -d ' ')" = 3 ] || { echo "::error::the hash list does not name 3 binaries"; exit 1; }
          mkdir -p "$FLAME_OUT/xtrace"
          while read -r side bin; do
            mkdir -p "$(dirname "$bin")"
            cp "$in/bins/$side" "$bin"
            chmod +x "$bin"
            echo "BIN $side $bin $(shasum -a 256 "$bin" | cut -d' ' -f1)"
          done < "$in/BINS.txt"
          cp "$in/BINS.txt" "$in/RUNS.txt" "$in/SHA256.txt" "$in/PATHS.txt" "$FLAME_OUT/"
          cp -R "$in/timings" "$FLAME_OUT/timings"
      - name: Record the runner
        run: |
          set -euo pipefail
          echo "RUNNER image=${ImageOS:-unknown} version=${ImageVersion:-unknown} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "RUNNER $(sw_vers -productVersion) $(uname -m) ncpu=$(sysctl -n hw.ncpu) mem_gb=$(( $(sysctl -n hw.memsize) / 1073741824 )) load=$(sysctl -n vm.loadavg)"
          xcrun xctrace version
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Quiet legs (keychain save, ABBA x2 own and swap for put and delete, secrets flame)
        id: quiet
        timeout-minutes: 75
        run: |
          set +e
          bash "$RUNNER_TEMP/probe/pd-farm.sh" legs quiet
          exit 0
      - name: Syscalls per call, xctrace System Trace CALLS=K and CALLS=0 (put, get, delete, no loader)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          bash "$RUNNER_TEMP/probe/pd-farm.sh" syscalls
          exit 0
      - name: Loaded legs (a looping kernel-storage release build on this runner)
        if: ${{ !cancelled() }}
        timeout-minutes: 110
        run: |
          set +e
          f="$RUNNER_TEMP/probe/pd-farm.sh"
          bash "$f" loader start "$RUNNER_TEMP/t25"
          bash "$f" legs loaded
          bash "$f" loader stop
          exit 0
      - name: Drop the keychain fixtures before the upload
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP"/kc-*.keychain-db
          find "$FLAME_OUT" -name '*.keychain-db' -print -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pod-d-keychain
          path: flame-out
          if-no-files-found: warn
      - name: Gates (expect 0 GATE FAIL and 0 XREC VOID)
        if: always()
        run: |
          set -euo pipefail
          s="$FLAME_OUT/RUNS.txt"
          [ -f "$s" ] || { echo "::error::no RUNS.txt"; exit 1; }
          grep -E '^(BUILD|RUN|KC|FLAME|XREC|XPARSE|GATE|RETRY|LOADER|QUIET|LOADED|DF|DISK)' "$s"
          fails="$(grep -c '^GATE FAIL' "$s" || true)"
          voids="$(grep -c '^XREC VOID' "$s" || true)"
          kc="$(grep -c '^KC ' "$s" || true)"
          graphs="$(grep -c '^FLAME ' "$s" || true)"
          echo "gates kc_runs $kc graphs $graphs gate_fail $fails xrec_void $voids"
          [ "$fails" = 0 ] && [ "$voids" = 0 ] || exit 1
