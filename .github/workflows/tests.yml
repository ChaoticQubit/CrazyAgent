name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ROWS: "native_term::windows::rows::"
  PROBE_PY: |
    import sys
    base = sys.argv[1] + "/apps/desktop/src-tauri/src/native_term/windows/"

    def edit(path, pairs):
        text = open(path, encoding="utf-8").read()
        for old, new in pairs:
            assert text.count(old) == 1, path + " lacks one " + repr(old)
            text = text.replace(old, new)
        return text

    draw = edit(base + "draw.rs", [
        ("        let round = BOARD.wait();\n        if let Some(style) = round.rung",
         "        let round = BOARD.wait();\n"
         "        farm_probe(&format!(\"round gone {} fresh {} ready {}\", round.gone.len(), round.fresh.len(), round.ready.len()));\n"
         "        if let Some(style) = round.rung"),
        ("        let made = self.surface(fresh.handle, fresh.geometry);\n",
         "        farm_probe(&format!(\"make {} key {} start\", fresh.id, fresh.geometry.scale_key));\n"
         "        let made = self.surface(fresh.handle, fresh.geometry);\n"
         "        farm_probe(&format!(\"make {} -> {:?}\", fresh.id, made.as_ref().err()));\n"),
        ("        let Ok(output) = waited(view.id, shared, surface) else {\n",
         "        farm_probe(&format!(\"present {} wait\", view.id));\n"
         "        let Ok(output) = waited(view.id, shared, surface) else {\n"
         "            farm_probe(&format!(\"present {} wait failed, lost {}\", view.id, shared.lost()));\n"),
        ("        after_wait(view.id, shared);\n",
         "        after_wait(view.id, shared);\n"
         "        farm_probe(&format!(\"present {} waited ok\", view.id));\n"),
        ("            self.replaced.lost(*key);\n",
         "            self.replaced.lost(*key);\n"
         "            farm_probe(&format!(\"retired a lost device on key {key}\"));\n"),
    ])
    draw += (
        "\nstatic FARM_LINES: AtomicU64 = AtomicU64::new(0);\n"
        "\npub fn farm_probe(line: &str) {\n"
        "    use std::io::Write;\n"
        "    if FARM_LINES.fetch_add(1, Ordering::SeqCst) >= 800 {\n"
        "        return;\n"
        "    }\n"
        "    if let Some(path) = std::env::var_os(\"NATIVE_PROBE\") {\n"
        "        if let Ok(mut file) = std::fs::OpenOptions::new().create(true).append(true).open(path) {\n"
        "            let _ = writeln!(file, \"{line}\");\n"
        "        }\n"
        "    }\n"
        "}\n"
    )
    open(base + "draw.rs", "w", encoding="utf-8", newline="\n").write(draw)

    rows = edit(base + "rows.rs", [
        ("    pump_until(\"both views present\", FARM_WAIT, || presents() >= before + 2);\n",
         "    draw::farm_probe(&format!(\"row 1 views made: counts {:?} shared {}\", draw::counts(), draw::trial_shared_made()));\n"
         "    let probe_started = Instant::now();\n"
         "    let mut probe_next = 0u64;\n"
         "    pump_until(\"both views present\", FARM_WAIT, || {\n"
         "        let secs = probe_started.elapsed().as_secs();\n"
         "        if secs >= probe_next {\n"
         "            draw::farm_probe(&format!(\"row 1 at {secs}s: counts {:?} faulted ({}, {})\", draw::counts(), failing.faulted(), other.faulted()));\n"
         "            probe_next = secs + 5;\n"
         "        }\n"
         "        presents() >= before + 2\n"
         "    });\n"
         "    draw::farm_probe(&format!(\"row 1 both present: counts {:?}\", draw::counts()));\n"),
        ("    println!(\"device-lost row: a replacement device after the removal came up: {replaced}\");\n",
         "    println!(\"device-lost row: a replacement device after the removal came up: {replaced}\");\n"
         "    draw::farm_probe(&format!(\"replacement device came up: {replaced}, counts {:?}\", draw::counts()));\n"),
        ("    println!(\"device-lost row: view 1 faulted, presents {presents}, failures {failures}\");\n",
         "    println!(\"device-lost row: view 1 faulted, presents {presents}, failures {failures}\");\n"
         "    draw::farm_probe(&format!(\"device-removed row: view 1 faulted, counts ({presents}, {failures})\"));\n"),
    ])
    open(base + "rows.rs", "w", encoding="utf-8", newline="\n").write(rows)
    print("probe edit applied")
  RUN_SH: |
    set +e
    label="$1"
    want="$2"
    shift 2
    names=()
    for n in "$@"; do names+=("$ROWS$n"); done
    probe="$RUNNER_TEMP/probe-$label.txt"
    log="$RUNNER_TEMP/run-$label.log"
    : > "$probe"
    NATIVE_PROBE="$(cygpath -w "$probe")" cargo test -p crazyagent-desktop --lib --locked -- --include-ignored --test-threads=1 --show-output --exact "${names[@]}" > "$log" 2>&1
    code=$?
    ran=$(grep -oE '^running [0-9]+ test' "$log" | grep -oE '[0-9]+' | head -n 1)
    echo "run $label: rc $code, ran ${ran:-none}, want $want"
    grep -E '^test .* \.\.\. |^test result:' "$log"
    grep -E 'trial removal|device-lost row|h5a row|panicked at' "$log" | head -n 40
    echo "probe $label:"
    cat "$probe"
    verdict=green
    [ "$code" -eq 0 ] || verdict=red
    [ "${ran:-0}" = "$want" ] || verdict="count-mismatch(${ran:-none}/$want)"
    echo "$label $verdict rc $code ran ${ran:-none}/$want" >> "$RUNNER_TEMP/verdict.txt"
    exit 0

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: device-removed order runs on windows-2022 at b13
    runs-on: windows-2022
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = 61acc49cc990619a29c5694202a8557a7e8e2e11 ] || { echo "::error::the parent is not b13 61acc49cc"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Write the probe edit and the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$PROBE_PY" > "$RUNNER_TEMP/probe.py"
          printf '%s\n' "$RUN_SH" > "$RUNNER_TEMP/run.sh"
          bash -n "$RUNNER_TEMP/run.sh"
          py=python
          command -v python >/dev/null 2>&1 || py=python3
          "$py" "$RUNNER_TEMP/probe.py" "$GITHUB_WORKSPACE"
          git diff --stat
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the boundary helper and the desktop lib tests
        id: setup
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
          cargo test -p crazyagent-desktop --lib --locked --no-run
      - name: Run a, row 1 alone
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: bash "$RUNNER_TEMP/run.sh" a 1 a_failed_wait_faults_its_own_view_never_another_at_its_scale
      - name: Run b, the device-removed row then row 1
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: bash "$RUNNER_TEMP/run.sh" b 2 a_device_removed_inside_present_faults_the_view a_failed_wait_faults_its_own_view_never_another_at_its_scale
      - name: Run c, the click and composition rows then row 1
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: bash "$RUNNER_TEMP/run.sh" c 3 a_click_whose_cancel_dismisses_the_view_reads_nothing_after a_composition_whose_redraw_dismisses_the_view_reads_nothing_after a_failed_wait_faults_its_own_view_never_another_at_its_scale
      - name: Run d, the replacement row alone
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: bash "$RUNNER_TEMP/run.sh" d 1 the_render_thread_answers_a_view_placed_after_a_removal_inside_present
      - name: Verdicts
        if: ${{ always() }}
        run: |
          echo "device-removed order runs, windows-2022, b13 61acc49cc:"
          cat "$RUNNER_TEMP/verdict.txt" 2>/dev/null || echo "no result"
