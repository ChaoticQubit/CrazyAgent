name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 3fdf1c2ea9
  TIP_FULL: 3fdf1c2ea92587fa1c05a59209e777fc07ae6704

defaults:
  run:
    shell: bash

jobs:
  red:
    name: FREE-SCAN-UNINIT red with features at ${{ matrix.sha }} on macos-15
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: 842bee21d5
            rows: "crazyagent:secret_realloc_residue:a_probe_request_frees_no_copy_of_its_key:test-support crazyagent-kernel-security:read_limited_wipe:a_gh_token_read_frees_no_copy_of_it,a_keychain_answer_read_frees_no_copy_of_it,a_read_of_more_than_the_limit_never_grows_its_buffer:"
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux from the fix tip
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Keep the tip's allocator blocks, then check out the red sha
        env:
          RED: ${{ matrix.sha }}
          ROWS: ${{ matrix.rows }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          mkdir -p "$RUNNER_TEMP/blocks"
          for spec in $ROWS; do
            test_name="$(echo "$spec" | cut -d: -f2)"
            file="$(git ls-files "crates/*/tests/$test_name.rs" "crates/kernel/*/tests/$test_name.rs" | head -n 1)"
            test -n "$file"
            sed -n '/^\/\/\/ The system allocator/,/^static ALLOCATOR/p' "$file" > "$RUNNER_TEMP/blocks/$test_name.rs"
            grep -q 'alloc_zeroed' "$RUNNER_TEMP/blocks/$test_name.rs"
            echo "$test_name=$file" >> "$RUNNER_TEMP/blocks/files"
          done
          git checkout --detach "$RED"
          git log -1 --format='red %H %s'
          while IFS='=' read -r test_name file; do
            block="$RUNNER_TEMP/blocks/$test_name.rs"
            awk -v blk="$block" 'BEGIN { while ((getline line < blk) > 0) text = text line "\n" } /^\/\/\/ The system allocator/ { skip = 1; printf "%s", text } skip && /^static ALLOCATOR/ { skip = 0; next } !skip' "$file" > "$RUNNER_TEMP/swap.rs"
            mv "$RUNNER_TEMP/swap.rs" "$file"
            [ "$(grep -c 'alloc_zeroed' "$file")" = 1 ] || { echo "::error::the swap missed $file"; exit 1; }
            git diff --stat -- "$file"
            git diff -- "$file"
          done < "$RUNNER_TEMP/blocks/files"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Red rows
        timeout-minutes: 120
        env:
          ROWS: ${{ matrix.rows }}
        run: |
          set +e
          fail=0
          for spec in $ROWS; do
            package="$(echo "$spec" | cut -d: -f1)"
            test_name="$(echo "$spec" | cut -d: -f2)"
            want="$(echo "$spec" | cut -d: -f3 | tr ',' '\n' | sort)"
            log="$RUNNER_TEMP/$test_name.log"
            features="$(echo "$spec" | cut -d: -f4)"
            if [ -n "$features" ]; then
              cargo test -p "$package" --test "$test_name" --features "$features" --locked > "$log" 2>&1
            else
              cargo test -p "$package" --test "$test_name" --locked > "$log" 2>&1
            fi
            code=$?
            grep -E '^test |test result:|panicked at|left:|right:|^error' "$log" || true
            got="$(grep -E '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            count="$(printf '%s' "$got" | grep -c . )"
            echo "RED $test_name rc $code failed ${count:-0}: $(printf '%s' "$got" | tr '\n' ' ')"
            if [ "$want" = ANY ]; then
              [ "${count:-0}" -ge 1 ] || { echo "::error::$test_name has no red row"; tail -n 40 "$log"; fail=1; }
            else
              [ "$got" = "$want" ] || { echo "::error::$test_name red rows differ; want: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
            fi
          done
          exit "$fail"
