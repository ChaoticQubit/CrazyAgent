name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 99a52fcffafd2f20e9d2c2e6769db2a63704d062
  PICK_FULL: e480de84b0e473c78a37481ac0ce0f5c48b677bd
  ROW: research::runner::listed_tests::a_research_job_on_a_listed_acp_harness_finishes_with_its_reply_as_the_report

defaults:
  run:
    shell: bash

jobs:
  listed-row:
    name: LISTED-ACP-ENOENT names the io error of the listed research row on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='pick %H %s' HEAD^
          git log -1 --format='branch tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^)" = "$PICK_FULL" ] || { echo "::error::the parent is not the macOS-gate pick $PICK_FULL"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = "$TIP_FULL" ] || { echo "::error::the grandparent is not the b23 tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the pick on the branch tip"; exit 1; }
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Print every io error the research runner turns into a run error, with its backtrace
        run: |
          set -euo pipefail
          perl -0pi -e 's/    fn from\(value: io::Error\) -> Self \{\n        Self::Io\(value\)/    fn from(value: io::Error) -> Self {\n        eprintln!("DIAG-IO {value:?}\\n{}", std::backtrace::Backtrace::force_capture());\n        Self::Io(value)/' crates/crazyagent/src/research/runner.rs
          git diff --stat
          test "$(git diff --numstat | awk '{print $1"/"$2}')" = "1/0"
      - name: Build the crazyagent lib tests
        timeout-minutes: 90
        run: |
          set -euo pipefail
          time cargo test -p crazyagent --lib --locked --no-run
      - name: Run the listed research row
        timeout-minutes: 20
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --exact "$ROW" --nocapture > "$RUNNER_TEMP/row.log" 2>&1
          code=$?
          grep -nE '^test |panicked|DIAG-IO|crazyagent::|kernel_[a-z_]*::|^test result' "$RUNNER_TEMP/row.log" | grep -vE 'std::|core::|test::' | head -n 120 || true
          tail -n 8 "$RUNNER_TEMP/row.log"
          echo "listed row rc $code"
