name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 8d0120b62b0781c798151fcd19ff7bba4e89a589
  FILTER: "team::runtime::"
  TMUX_VERSION: "3.8"

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: Login keychain untouched by team::runtime rows on macos-15 (default threads, then one thread)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the job-0026 tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the job-0026 tip"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the job-0026 tip"; exit 1; }
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          echo "engine git: $(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Build the crazyagent lib test binary
        id: build
        if: ${{ steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
          cargo test -p crazyagent --lib --locked "$FILTER" -- --list > "$RUNNER_TEMP/list.txt" 2>/dev/null
          echo "listed $(grep -cE ': test$' "$RUNNER_TEMP/list.txt") under $FILTER"
          [ "$(grep -cE ': test$' "$RUNNER_TEMP/list.txt")" -ge 1 ] || { echo "::error::no rows listed"; exit 1; }
      - name: The team::runtime rows at default threads, then at one thread, with the login keychain state read before and after each (expect no change)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          set -uo pipefail
          snap() {
            local out="$RUNNER_TEMP/state-$1.txt" f="$HOME/Library/Keychains/login.keychain-db"
            {
              echo "list $(/usr/bin/security list-keychains -d user 2>&1 | tr -s ' \n' ' ')"
              echo "default $(/usr/bin/security default-keychain -d user 2>&1 | tr -s ' \n' ' ')"
              if [ -e "$f" ]; then echo "login mtime $(stat -f '%m' "$f") size $(stat -f '%z' "$f")"; else echo "login absent"; fi
            } > "$out"
            sed "s/^/STATE $1 /" "$out"
          }
          bad=0
          echo "HOME $HOME"
          for run in default one; do
            snap "$run-before"
            log="$RUNNER_TEMP/team-$run.log"
            if [ "$run" = default ]; then
              cargo test -p crazyagent --lib --locked "$FILTER" > "$log" 2>&1
            else
              cargo test -p crazyagent --lib --locked "$FILTER" -- --test-threads=1 > "$log" 2>&1
            fi
            rc=$?
            snap "$run-after"
            echo "ROWS $run rc $rc $(grep -E '^test result:' "$log" | tail -n 1)"
            grep -E '^test .* FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/  red-'"$run"' \1/'
            echo "UNAVAILABLE $run $(grep -c 'agent_keychain_unavailable' "$log")"
            if cmp -s "$RUNNER_TEMP/state-$run-before.txt" "$RUNNER_TEMP/state-$run-after.txt"; then
              echo "SAME $run"
            else
              echo "::error::the login keychain state changed in the $run run"
              diff "$RUNNER_TEMP/state-$run-before.txt" "$RUNNER_TEMP/state-$run-after.txt"
              bad=1
            fi
          done
          echo "LOGIN-KEYCHAIN bad $bad"
          [ "$bad" = 0 ]
