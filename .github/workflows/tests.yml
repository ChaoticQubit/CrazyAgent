name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: e6af6b2aed220455b154626b67fdba5c4e9669d8
  RED: f0309dcbd3529bea44ed1b025b3f4ff64012b2fa
  BASE: ee844fc1e8dcc49cef9e193efd4551292623b11e
  FILES: crates/crazyagent/src/tui/theme/appearance.rs crates/crazyagent/src/tui/theme/appearance/tests.rs
  WANT: |
    tui::theme::appearance::tests::macos_reads_defaults_at_its_absolute_path
    tui::theme::appearance::tests::windows_reads_reg_exe_under_system_root
    tui::theme::appearance::tests::windows_without_a_drive_system_root_uses_c_windows
    tui::theme::appearance::tests::windows_light_or_unknown_answers_read_light
    tui::theme::appearance::tests::linux_gnome_reads_gsettings_at_its_absolute_path_never_from_path
    tui::theme::appearance::tests::linux_gnome_default_light_or_failure_reads_light
    tui::theme::appearance::tests::linux_unknown_desktop_asks_gsettings_and_reads_light_when_it_fails
    tui::theme::appearance::tests::linux_kde_reads_kdeglobals_without_starting_a_program
    tui::theme::appearance::tests::linux_kde_reads_the_general_section_under_home_config
    tui::theme::appearance::tests::a_kde_scheme_without_dark_in_its_name_reads_dark_from_its_window_background
    tui::theme::appearance::tests::a_light_kde_window_background_wins_over_dark_in_the_scheme_name
    tui::theme::appearance::tests::a_missing_or_malformed_kde_window_background_falls_back_to_the_scheme_name
    tui::theme::appearance::tests::a_kdeglobals_file_over_the_cap_is_refused_and_one_at_the_cap_is_read
    tui::theme::appearance::tests::a_program_that_is_not_an_absolute_path_is_never_started
    tui::theme::appearance::tests::this_build_reads_the_linux_desktop_setting
    tui::theme::appearance::tests::a_real_read_answers_within_five_seconds
  RED_ROWS: |
    tui::theme::appearance::tests::a_kde_scheme_without_dark_in_its_name_reads_dark_from_its_window_background
    tui::theme::appearance::tests::a_light_kde_window_background_wins_over_dark_in_the_scheme_name

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: THEME-CR1-CR2 red then tip, clippy, caps on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE" ] || { echo "::error::HEAD~3 is not chore/v250 ee844fc1e8"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/crazyagent/src/tui/theme/appearance.rs crates/crazyagent/src/tui/theme/appearance/tests.rs
      - name: Line caps and sleeps at the base and the tip (expect no file new to the problem list, sleeps rc 0)
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; echo "caps tip rc $?"
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1; st=$?; echo "sleeps tip rc $st"
          git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; echo "caps base rc $?"; node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-base.txt" 2>&1; echo "sleeps base rc $?")
          git worktree remove --force "$RUNNER_TEMP/base"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-base.txt" | sort > "$RUNNER_TEMP/cb.txt"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-tip.txt" | sort > "$RUNNER_TEMP/ct.txt"
          comm -13 "$RUNNER_TEMP/cb.txt" "$RUNNER_TEMP/ct.txt" > "$RUNNER_TEMP/caps-new.txt"
          echo "caps new at tip $(wc -l < "$RUNNER_TEMP/caps-new.txt" | tr -d ' ')"; cat "$RUNNER_TEMP/caps-new.txt"
          [ ! -s "$RUNNER_TEMP/caps-new.txt" ] && [ "$st" = 0 ] || exit 1
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Write the row runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          set +e
          set -u
          name=$1
          wantfile=$2
          log="$RUNNER_TEMP/rows-$name.log"
          rows=()
          while IFS= read -r row; do [ -n "$row" ] && rows+=("$row"); done < "$wantfile"
          echo "$name rows ${#rows[@]}"
          cargo test -p crazyagent --lib --locked -- --exact "${rows[@]}" > "$log" 2>&1
          rc=$?
          grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$name.txt"
          echo "$name FAILED $(wc -l < "$RUNNER_TEMP/failed-$name.txt" | tr -d ' '):"
          cat "$RUNNER_TEMP/failed-$name.txt"
          awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' || true
          grep -E '^ +(Compiling|Finished) ' "$log" | grep -E 'crazyagent v|Finished' || true
          grep -E '^test .* \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test (.*) \.\.\. (ok|FAILED)$/\1 \2/' | sed -E 's/ - should panic / /' | sort > "$RUNNER_TEMP/seen-$name.txt"
          grep -E ' ok$' "$RUNNER_TEMP/seen-$name.txt" | sed -E 's/ ok$//' > "$RUNNER_TEMP/ok-$name.txt"
          echo "$name rc $rc ok $(wc -l < "$RUNNER_TEMP/ok-$name.txt" | tr -d ' ') $(grep -E '^test result:' "$log" | tr '\n' ' ')"
          ROWS
          sed -i 's/^          //' "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          printf '%s' "$WANT" | sed '/^$/d' | sed -E 's/^ +//' | sort > "$RUNNER_TEMP/want.txt"
          printf '%s' "$RED_ROWS" | sed '/^$/d' | sed -E 's/^ +//' | sort > "$RUNNER_TEMP/red.txt"
          echo "want $(wc -l < "$RUNNER_TEMP/want.txt" | tr -d ' ') red $(wc -l < "$RUNNER_TEMP/red.txt" | tr -d ' ')"
      - name: Red, the base appearance.rs under the tip tests (expect exactly the 2 colour rows FAILED, every other wanted row ok)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          git checkout "$BASE" -- crates/crazyagent/src/tui/theme/appearance.rs
          git diff --stat HEAD^ -- crates/crazyagent/src
          bash "$RUNNER_TEMP/rows.sh" red "$RUNNER_TEMP/want.txt"
          git checkout HEAD^ -- crates/crazyagent/src/tui/theme/appearance.rs
          git diff --quiet HEAD^ -- crates || { echo "::error::the tip appearance.rs was not put back"; exit 1; }
          diff "$RUNNER_TEMP/red.txt" "$RUNNER_TEMP/failed-red.txt" > /dev/null || { echo "::error::the red set is not the 2 colour rows"; exit 1; }
          comm -23 "$RUNNER_TEMP/want.txt" "$RUNNER_TEMP/red.txt" > "$RUNNER_TEMP/rest.txt"
          comm -23 "$RUNNER_TEMP/rest.txt" "$RUNNER_TEMP/ok-red.txt" > "$RUNNER_TEMP/rest-missing.txt"
          [ ! -s "$RUNNER_TEMP/rest-missing.txt" ] || { echo "::error::wanted rows not ok at the base:"; cat "$RUNNER_TEMP/rest-missing.txt"; exit 1; }
      - name: Tip, every wanted appearance row (expect each ok, should_panic included)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          bash "$RUNNER_TEMP/rows.sh" tip "$RUNNER_TEMP/want.txt"
          comm -23 "$RUNNER_TEMP/want.txt" "$RUNNER_TEMP/ok-tip.txt" > "$RUNNER_TEMP/tip-missing.txt"
          echo "wanted rows not ok at the tip $(wc -l < "$RUNNER_TEMP/tip-missing.txt" | tr -d ' ')"
          cat "$RUNNER_TEMP/tip-missing.txt"
          [ ! -s "$RUNNER_TEMP/tip-missing.txt" ] && [ ! -s "$RUNNER_TEMP/failed-tip.txt" ] || exit 1
  windows:
    name: THEME-CR1-CR2 crazyagent clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE" ] || { echo "::error::HEAD~3 is not chore/v250 ee844fc1e8"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent windows-2022 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
