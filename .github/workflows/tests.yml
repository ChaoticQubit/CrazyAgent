name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: da33306fd80169de55712d264c32e4f45946e86e
  RED: 184ba549b4f18f0cb7a70ff69fb38a20e9894f88
  RED_LIVE: 1c17515bcba190159262d69562e6dd1343891976
  RED_REMOVE: 12910283ac4146060f47f187f118516c78e4b997
  BASE: af1b6b99ae9939e8fa514e6fe5e14cacbf17b3c1
  FILES: "crates/crazyagent/src/app_plugins.rs crates/kernel/plugin_host/src/registry.rs crates/kernel/plugin_host/src/registry_folder.rs crates/kernel/plugin_host/src/registry_folder_tests.rs crates/kernel/plugin_host/src/registry_tests.rs crates/kernel/plugin_host/src/sweep_tests.rs "
  NEW_ROWS: >-
    registry_tests::folder::a_replace_cut_after_its_renames_keeps_the_original_on_the_start_sweep
    registry_tests::folder::a_replace_rolled_back_with_the_plugins_folder_unopenable_keeps_the_original
    registry_tests::folder::a_retired_folder_neither_text_trusts_is_kept_with_the_live_one
    registry_tests::folder::a_retired_folder_is_kept_when_the_rows_do_not_read
    registry_tests::folder::a_committed_replace_leftover_beside_its_live_plugin_is_still_deleted
  LIVE_ROW: registry_tests::folder::a_retired_folder_is_kept_when_the_live_one_does_not_read
  REMOVE_ROWS: >-
    registry_tests::folder::a_removed_plugin_with_a_kept_retired_folder_stays_removed_through_a_start
    registry_tests::folder::a_removal_whose_retired_folder_cannot_lose_the_name_is_refused_with_nothing_moved
  GUARD: registry_tests::folder::a_committed_replace_leftover_beside_its_live_plugin_is_still_deleted
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent-kernel-plugin-host --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent-kernel-plugin-host --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -80 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red4)
        [ "$rc" != 0 ] && [ "$listed" = 5 ] && [ "$failed" = 4 ] && [ "$passed" = 1 ] && grep -qE "^test $GUARD \.\.\. ok$" "$log" || { echo "::error::$name is not 4 red rows and the guard green"; exit 1; } ;;
      red-all)
        [ "$rc" != 0 ] && [ "$failed" = "$listed" ] && [ "$passed" = 0 ] || { echo "::error::$name is not every row red"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: REPLACE-SWEEP plugin-host clippy and rows on ${{ matrix.os }}, red then tip
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='REPLACE-SWEEP tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the REPLACE-SWEEP tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_REMOVE" ] || { echo "::error::HEAD~2 is not the removal red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$RED_LIVE" ] || { echo "::error::HEAD~5 is not the live-row red commit"; exit 1; }
          [ "$(git rev-parse HEAD~7)" = "$RED" ] || { echo "::error::HEAD~7 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~8)" = "$BASE" ] || { echo "::error::HEAD~8 is not the b24 base"; exit 1; }
          [ "$(git diff --name-only HEAD~8 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the REPLACE-SWEEP tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red legs, each row commit with its product before the fix (5 rows 4 red and the guard green, live row red, 2 removal rows red)
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          leg() {
            local sha=$1 name=$2 expect=$3 rows=$4 rc=0 list
            git checkout "$sha" -- crates || return 1
            git diff --quiet "$sha" -- crates || { echo "::error::the $name tree is not $sha"; return 1; }
            cargo test -p crazyagent-kernel-plugin-host --lib --locked --no-run || rc=1
            read -ra list <<< "$rows"
            if [ "$rc" = 0 ]; then
              bash "$RUNNER_TEMP/rows.sh" "$name" "$expect" --exact "${list[@]}" || rc=$?
            fi
            git checkout HEAD^ -- crates || return 1
            git diff --quiet HEAD^ || { echo "::error::the tree is not back at the REPLACE-SWEEP tip"; return 1; }
            echo "red leg $name rc $rc"
            return "$rc"
          }
          one=0
          leg "$RED" new-at-red red4 "$NEW_ROWS" || one=$?
          two=0
          leg "$RED_LIVE" live-at-red red-all "$LIVE_ROW" || two=$?
          three=0
          leg "$RED_REMOVE" remove-at-red red-all "$REMOVE_ROWS" || three=$?
          echo "red legs rc $one $two $three"
          [ "$one" = 0 ] && [ "$two" = 0 ] && [ "$three" = 0 ]
      - name: plugin-host clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-plugin-host --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +Checking crazyagent-kernel-plugin-host ' "$log" || true)"
          echo "clippy ${{ matrix.os }} rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the 8 new rows
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          read -ra rows <<< "$NEW_ROWS $LIVE_ROW $REMOVE_ROWS"
          [ "${#rows[@]}" = 8 ] || { echo "::error::expected 8 new rows"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" new-at-tip pass --exact "${rows[@]}"
      - name: Tip, the folder rows, start_sweep callers included
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" folder pass registry_tests::folder::
      - name: Tip, re-pointed registry row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" registry-retired pass --exact registry_tests::a_retired_folder_beside_its_live_plugin_loses_its_name_on_the_sweep
      - name: Tip, sweep_tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" sweep pass sweep_tests::
      - name: Tip, every plugin-host lib row
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          bash "$RUNNER_TEMP/rows.sh" lib pass

  windows:
    name: REPLACE-SWEEP plugin-host clippy and sweep_tests on windows-2022 at tip
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the REPLACE-SWEEP tip"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the REPLACE-SWEEP tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: plugin-host clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings)
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-plugin-host --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +Checking crazyagent-kernel-plugin-host ' "$log" || true)"
          echo "clippy windows-2022 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, sweep_tests on Windows
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          bash "$RUNNER_TEMP/rows.sh" sweep-windows pass sweep_tests::

  engine:
    name: REPLACE-SWEEP rustfmt on the changed files and crazyagent lib clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the REPLACE-SWEEP tip"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the REPLACE-SWEEP tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: rustfmt --check on the changed files (expect rc 0)
        run: |
          set +e
          read -ra files <<< "$FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "rustfmt rc $code"
          [ "$code" = 0 ]
      - name: Fetch the locked crates
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: crazyagent clippy --lib (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +Checking crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
