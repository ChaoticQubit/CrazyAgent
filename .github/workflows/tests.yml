name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  v243-g1-resolver-linux:
    name: G1 tool resolver fix, red side and tip, ubuntu-22.04 (read-only)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on a self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Linux packages the engine builds against
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Red side and tip, lib tests alone per build, then clippy lib and tests apart
        run: |
          cp .github/farm/v243-g1-resolver-verify.sh "$RUNNER_TEMP/v243-g1-resolver-verify.sh"
          bash "$RUNNER_TEMP/v243-g1-resolver-verify.sh" linux

  v243-g1-resolver-macos:
    name: G1 tool resolver fix, red side and tip, macos-15 (read-only)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on a self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Red side and tip, lib tests, sandbox_toolchains and clean_mac at tip, then clippy
        run: |
          cp .github/farm/v243-g1-resolver-verify.sh "$RUNNER_TEMP/v243-g1-resolver-verify.sh"
          bash "$RUNNER_TEMP/v243-g1-resolver-verify.sh" macos
