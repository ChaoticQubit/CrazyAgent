name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 7487b20325d9a2118d6b13b533949820237a7cf9
  FARM_FILES: ".github/farm/unc-share-setup.ps1 .github/workflows/tests.yml"
  PROBE: sandbox::windows::step_probe::w5b_step_probe

defaults:
  run:
    shell: bash

jobs:
  win-probe:
    name: V244-WIN-LANDING W5b D2 step probe r5 quiet and loaded ${{ matrix.runner }} at 7487b2032 on chore/v244 3e45d7a38, facts only
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep the share setup, then put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD | tr '\n' ' ' | sed 's/ $//')" = "$FARM_FILES"
          cp .github/farm/unc-share-setup.ps1 "$RUNNER_TEMP/unc-share-setup.ps1"
          git rm -q -- .github/farm/unc-share-setup.ps1
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Build the boundary helper and the engine library tests
        id: lib
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cargo test -p crazyagent --lib --locked --no-run
          test -f target/debug/crazyagent-win-boundary.exe
      - name: Open the shares and the device entries
        id: shares
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\unc-share-setup.ps1"'
      - name: The probe, then its facts
        if: ${{ !cancelled() && steps.shares.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --ignored --exact "$PROBE" > "$RUNNER_TEMP/probe-run.txt" 2>&1
          rc=$?
          grep -E "^test |^test result" "$RUNNER_TEMP/probe-run.txt" | cut -c1-300 | head -4
          grep -A8 "panicked at" "$RUNNER_TEMP/probe-run.txt" | cut -c1-800 | head -20
          echo "=== FACTS ${{ matrix.runner }}"
          cat "$RUNNER_TEMP/w5b-probe.txt"
          echo "=== END FACTS"
          mv "$RUNNER_TEMP/w5b-probe.txt" "$RUNNER_TEMP/w5b-probe-quiet.txt"
          CARGO_TARGET_DIR="$RUNNER_TEMP/load-target" cargo build -p crazyagent --release --locked > "$RUNNER_TEMP/load.txt" 2>&1 &
          load=$!
          sleep 45
          kill -0 "$load" && echo "load running at probe start"
          cargo test -p crazyagent --lib --locked -- --ignored --exact "$PROBE" > "$RUNNER_TEMP/probe-loaded.txt" 2>&1
          loaded=$?
          kill -0 "$load" && echo "load still running at probe end"
          kill "$load" 2>/dev/null
          grep -E "^test result" "$RUNNER_TEMP/probe-loaded.txt" | cut -c1-300 | head -2
          echo "=== LOADED FACTS ${{ matrix.runner }}"
          cat "$RUNNER_TEMP/w5b-probe.txt"
          echo "=== END LOADED FACTS"
          [ "$rc" -eq 0 ] && exit "$loaded"
          exit "$rc"
