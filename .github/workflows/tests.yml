name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  TIP_FULL: 0ee025952955650b2b79c9a1f0ff2482e9a4aa1d
  MERGE_FULL: 0be00c6e41fcec3a9dc5a6709446c7fc00f6edc1
  BASE_FULL: c6c672b4726b8226a35e486089704f41e4f66230
  TICKET_FILES: crates/crazyagent/src/engine.rs crates/crazyagent/src/engine/owner/transport/agents.rs crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/engine/owner/transport/terminal/windows_tests.rs crates/crazyagent/src/team/master.rs crates/kernel/processes/src/terminal.rs crates/kernel/processes/src/terminal/kept.rs crates/kernel/processes/src/terminal/windows.rs crates/kernel/processes/src/terminal/windows/tests.rs scripts/quality/caps-allow.json
  RUST_FILES: crates/crazyagent/src/engine.rs crates/crazyagent/src/engine/owner/transport/agents.rs crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/engine/owner/transport/terminal/windows_tests.rs crates/crazyagent/src/team/master.rs crates/kernel/processes/src/terminal.rs crates/kernel/processes/src/terminal/kept.rs crates/kernel/processes/src/terminal/windows.rs crates/kernel/processes/src/terminal/windows/tests.rs
  BASE_CODE_FILES: crates/crazyagent/src/engine.rs crates/crazyagent/src/engine/owner/transport/agents.rs crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/team/master.rs crates/kernel/processes/src/terminal.rs crates/kernel/processes/src/terminal/kept.rs crates/kernel/processes/src/terminal/windows.rs crates/kernel/processes/src/terminal/windows/tests.rs
  KERNEL_WINDOWS: crates/kernel/processes/src/terminal/windows.rs
  OWNER_ROWS: "engine::owner::transport::terminal::windows_tests::"
  KERNEL_ROWS: "terminal::windows::tests::"
  PASTE_STALL_ROW: "terminal::windows::tests::a_paste_stalled_on_one_pane_leaves_every_other_call_answering"
  UNIX_ROWS: "engine::owner::transport::terminal::tests::"
  T3_FAILED: "engine::owner::transport::terminal::windows_tests::a_paste_without_bracketed_paste_reaches_the_shell_as_typed_keys engine::owner::transport::terminal::windows_tests::a_planted_git_bat_in_the_project_folder_does_not_run engine::owner::transport::terminal::windows_tests::an_input_only_view_of_an_exited_shell_ends_as_terminal_ended engine::owner::transport::terminal::windows_tests::the_host_reads_bracketed_paste_on_only_after_the_app_turns_it_on"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: WIN-OWNER-TERMINAL ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            leg: win-tip
            cache: Windows
          - os: windows-2022
            leg: win-red
            cache: Windows
          - os: ubuntu-22.04
            leg: linux
            cache: linux
          - os: macos-15
            leg: mac
            cache: macOS
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -8 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~7)" = "$MERGE_FULL" ] || { echo "::error::HEAD~7 is not the W4 merge"; exit 1; }
          [ "$(git rev-parse HEAD~8)" = "$BASE_FULL" ] || { echo "::error::HEAD~8 is not the b24 FINAL base"; exit 1; }
          changed="$(git diff --name-only "$BASE_FULL" HEAD^ | sort | tr '\n' ' ')"
          read -ra files <<< "$TICKET_FILES"
          wanted="$(printf '%s\n' "${files[@]}" | sort | tr '\n' ' ')"
          [ "$changed" = "$wanted" ] || { echo "::error::the ticket range is not the ten ticket files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install the pinned tmux on Linux for the unix owner terminal rows
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache, so cargo rebuilds their crates
        run: |
          set -euo pipefail
          read -ra files <<< "$RUST_FILES"
          sleep 2
          touch "${files[@]}"
          ls -l "${files[@]}"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt check of the nine ticket Rust files (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        run: |
          set +e
          read -ra files <<< "$RUST_FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent and kernel processes --lib --tests with warnings denied on this system (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg != 'win-red' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent -p crazyagent-kernel-processes --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          kernel="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings crazyagent checked $app kernel-processes checked $kernel"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$app" -ge 1 ] && [ "$kernel" -ge 1 ] || exit 1
      - name: Windows owner terminal rows at tip (expect listed 9, passed 9)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'win-tip' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/owner-rows.log"
          cargo test -p crazyagent --lib --locked -- "$OWNER_ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log.list" || true)"
          echo "owner rows listed $listed, crazyagent built $built"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- "$OWNER_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion|w4 row:' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "owner rows rc $code listed $listed passed $passed failed $failed built $built"
          [ "$code" = 0 ] && [ "$listed" = 9 ] && [ "$passed" = 9 ] && [ "$failed" = 0 ] && [ "$built" -ge 1 ] || exit 1
      - name: Kernel ConPTY host rows at tip (expect listed 2, passed 2)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'win-tip' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-rows.log"
          cargo test -p crazyagent-kernel-processes --lib --locked -- "$KERNEL_ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          cargo test -p crazyagent-kernel-processes --lib --locked -- "$KERNEL_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 40 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "kernel rows rc $code listed $listed passed $passed failed $failed built $built"
          [ "$code" = 0 ] && [ "$listed" = 2 ] && [ "$passed" = 2 ] && [ "$failed" = 0 ] && [ "$built" -ge 1 ] || exit 1
      - name: Red C, the paste-stall row over the merge's kernel windows.rs, whose paste writes under the panes lock (expect failed 1 at the answered expect)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'win-tip' }}
        timeout-minutes: 60
        run: |
          set +e
          git checkout "$MERGE_FULL" -- "$KERNEL_WINDOWS"
          git diff --stat HEAD^
          sleep 2
          touch "$KERNEL_WINDOWS"
          log="$RUNNER_TEMP/red-c.log"
          cargo test -p crazyagent-kernel-processes --lib --locked -- --exact "$PASTE_STALL_ROW" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked at|stalled' "$log" | head -n 40 || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          at="$(grep -cF "the host answered while one pane's write was stalled" "$log" || true)"
          echo "red C rc $code passed $passed failed $failed at-answered-expect $at built $built"
          git checkout HEAD^ -- "$KERNEL_WINDOWS"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 1 ] && [ "$passed" = 0 ] && [ "$at" = 1 ] && [ "$built" -ge 1 ] || exit 1
      - name: Red B, the nine owner rows over the tip without T3's kernel host (b24's windows.rs plus the at field; expect failed 4, the T3 rows, passed 5)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'win-red' }}
        timeout-minutes: 120
        run: |
          set +e
          git show "$BASE_FULL:$KERNEL_WINDOWS" > "$KERNEL_WINDOWS"
          perl -0pi -e '$n = s/^            chunks,\n        \}\)\n/            chunks,\n            at: None,\n        })\n/mg; die "matched $n\n" unless $n == 1' "$KERNEL_WINDOWS" || exit 1
          git diff HEAD^ -- "$KERNEL_WINDOWS" | grep -E '^[-+]' | head -n 80
          sleep 2
          touch "$KERNEL_WINDOWS"
          log="$RUNNER_TEMP/red-b.log"
          cargo test -p crazyagent --lib --locked -- "$OWNER_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked at|left:|right:|assertion' "$log" | head -n 80 || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          got="$(grep -E '^test .* FAILED$' "$log" | awk '{print $2}' | sort | tr '\n' ' ')"
          read -ra t3 <<< "$T3_FAILED"
          want="$(printf '%s\n' "${t3[@]}" | sort | tr '\n' ' ')"
          echo "red B rc $code passed $passed failed $failed built $built"
          echo "red B failed rows: $got"
          git checkout HEAD^ -- "$KERNEL_WINDOWS"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 4 ] && [ "$passed" = 5 ] && [ "$got" = "$want" ] && [ "$built" -ge 1 ] || exit 1
      - name: Red A, the nine owner rows over b24 FINAL's code with only their module declared (expect failed 9 at the engine's ConPTY host expect)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'win-red' }}
        timeout-minutes: 120
        run: |
          set +e
          read -ra code_files <<< "$BASE_CODE_FILES"
          git checkout "$BASE_FULL" -- "${code_files[@]}"
          transport=crates/crazyagent/src/engine/owner/transport/terminal.rs
          printf '\n#[cfg(all(test, windows))]\nmod windows_tests;\n' >> "$transport"
          git diff --stat HEAD^
          git diff "$BASE_FULL" -- "$transport"
          sleep 2
          read -ra files <<< "$RUST_FILES"
          touch "${files[@]}"
          log="$RUNNER_TEMP/red-a.log"
          cargo test -p crazyagent --lib --locked -- "$OWNER_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked at|ConPTY host' "$log" | head -n 80 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60; tail -n 30 "$log"; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          at="$(grep -cF 'the engine opens its ConPTY host on Windows' "$log" || true)"
          echo "red A rc $code passed $passed failed $failed at-conpty-expect $at built $built"
          git checkout HEAD^ -- "${code_files[@]}"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 9 ] && [ "$passed" = 0 ] && [ "$at" = 9 ] && [ "$built" -ge 1 ] || exit 1
      - name: Unix owner terminal rows at tip, no regression from the ungated pump (expect listed > 0, failed 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/unix-rows.log"
          cargo test -p crazyagent --lib --locked -- "$UNIX_ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- "$UNIX_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*FAILED$|test result:|panicked' "$log" | head -n 40 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          ignored="$(grep -E '^test result:' "$log" | awk '{i+=$8} END {print i+0}')"
          echo "unix rows rc $code listed $listed passed $passed failed $failed ignored $ignored built $built"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] && [ "$built" -ge 1 ] || exit 1
