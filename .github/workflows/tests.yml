name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED1_SHA: b5b257fa3712ea01cffc5f97b6363a9c82c07317
  RED2_SHA: 40c756c1846c530bb8bf552d7a51256d5c1546ed
  ROWS: project_files::windows_tests

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows project files row, ${{ matrix.side }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red1, red2, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'red1' && env.RED1_SHA || matrix.side == 'red2' && env.RED2_SHA || github.sha }}
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rows, and clippy on the green side
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/project-files-windows-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          read -ra rows <<< "$ROWS"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- "${rows[@]}" 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          m="project_files::windows_tests"
          r1="$m::a_windows_project_lists_its_tracked_and_untracked_files_but_no_ignored_one_or_one_through_a_junction"
          if [ "$SIDE" = red2 ]; then
            grep -q "^test $m::a_windows_commondir_planted_after_the_check_redirects_nothing \.\.\. FAILED" "$out" \
              && grep -q "^test $m::a_windows_repository_whose_git_folder_points_elsewhere_is_not_listed \.\.\. ok" "$out" \
              && grep -q "^test $m::a_windows_repository_own_excludes_file_is_not_read \.\.\. ok" "$out" \
              && grep -q "^test $r1 \.\.\. ok" "$out"
            want=$?
            printf '| red2 side 40c756c18 | exit |\n| --- | --- |\n| rows (planted-after-check row must fail, the earlier r2 rows and r1 row pass) | %s |\n| expectation met (0 = yes) | %s |\n' "$rc" "$want" >> "$GITHUB_STEP_SUMMARY"
            exit "$want"
          fi
          if [ "$SIDE" = red1 ]; then
            grep -q "^test $m::a_windows_repository_whose_git_folder_points_elsewhere_is_not_listed \.\.\. FAILED" "$out" \
              && grep -q "^test $m::a_windows_repository_own_excludes_file_is_not_read \.\.\. FAILED" "$out" \
              && grep -q "^test $r1 \.\.\. ok" "$out"
            want=$?
            ntfs=$(grep -o "^test $m::a_windows_index_entry_that_ntfs_opens_as_git_is_not_listed \.\.\. [A-Za-z]*" "$out" | awk '{print $NF}')
            printf '| red1 side b5b257fa3 | exit |\n| --- | --- |\n| rows (commondir/include and excludes rows must fail, r1 row passes) | %s |\n| NTFS .git row (expected FAILED) | %s |\n| expectation met (0 = yes) | %s |\n' "$rc" "${ntfs:-missing}" "$want" >> "$GITHUB_STEP_SUMMARY"
            exit "$want"
          fi
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --all-targets --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          printf '| green side | exit |\n| --- | --- |\n| rows | %s |\n| clippy -p crazyagent --all-targets -D warnings | %s |\n' "$rc" "$clip" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] && [ "$clip" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-project-files-windows-${{ matrix.side }}
          path: ${{ runner.temp }}/project-files-windows-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux project files rows, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red2, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'red2' && env.RED2_SHA || github.sha }}
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rows, and clippy on the green side
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/project-files-linux-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- project_files instruction_files 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          if [ "$SIDE" = red2 ]; then
            grep -q "^test project_files::tests::a_commondir_planted_after_the_check_redirects_nothing \.\.\. FAILED" "$out"
            want=$?
            printf '| Linux red2 side 40c756c18 | exit |\n| --- | --- |\n| rows (planted commondir row must fail) | %s |\n| expectation met (0 = yes) | %s |\n' "$rc" "$want" >> "$GITHUB_STEP_SUMMARY"
            exit "$want"
          fi
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --all-targets --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          printf '| Linux | exit |\n| --- | --- |\n| project_files rows | %s |\n| clippy -p crazyagent --all-targets -D warnings | %s |\n' "$rc" "$clip" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] && [ "$clip" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-project-files-linux-${{ matrix.side }}
          path: ${{ runner.temp }}/project-files-linux-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
