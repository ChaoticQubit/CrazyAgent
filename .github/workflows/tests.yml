name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 68721ffb41
  CHORE_FULL: c6f1398838
  RUST_FILES: >-
    crates/crazyagent-macos-fs/src/held.rs crates/crazyagent-macos-fs/src/held_tests.rs crates/crazyagent-macos-fs/src/lib.rs crates/kernel/processes/src/service.rs crates/kernel/processes/src/service/acl.rs crates/kernel/processes/src/service/changeable.rs crates/kernel/processes/src/service/markup.rs crates/kernel/processes/src/service/tests.rs crates/kernel/processes/src/service/tests/socket_check.rs crates/kernel/processes/src/update.rs

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: PERF-PARITY-PROC clippy kernel processes and macos-fs strict on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~8)" = "$CHORE_FULL" ] || { echo "::error::HEAD~8 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy kernel processes and macos-fs, lib and tests, strict
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          read -ra files <<< "$RUST_FILES"
          touch "${files[@]}"
          cargo fetch --locked
          cargo clippy -p crazyagent-kernel-processes -p crazyagent-macos-fs --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          kernel="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          macos="$(grep -cE '^ +(Checking|Compiling) crazyagent-macos-fs v' "$log")"
          echo "CHECKED crazyagent-kernel-processes $kernel"
          echo "CHECKED crazyagent-macos-fs $macos"
          grep -E ': (error|warning)(\[[A-Za-z0-9_:]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "linux clippy rc $code"
          [ "$kernel" -gt 0 ] || { echo "::error::crazyagent-kernel-processes was not checked, the cache was read as fresh"; code=1; }
          [ "$macos" -gt 0 ] || { echo "::error::crazyagent-macos-fs was not checked, the cache was read as fresh"; code=1; }
          exit $code

  windows:
    name: PERF-PARITY-PROC clippy kernel processes and macos-fs strict on windows-2022
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~8)" = "$CHORE_FULL" ] || { echo "::error::HEAD~8 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy kernel processes and macos-fs, lib and tests, strict
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          read -ra files <<< "$RUST_FILES"
          touch "${files[@]}"
          cargo fetch --locked
          cargo clippy -p crazyagent-kernel-processes -p crazyagent-macos-fs --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          kernel="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          macos="$(grep -cE '^ +(Checking|Compiling) crazyagent-macos-fs v' "$log")"
          echo "CHECKED crazyagent-kernel-processes $kernel"
          echo "CHECKED crazyagent-macos-fs $macos"
          grep -E ': (error|warning)(\[[A-Za-z0-9_:]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "windows clippy rc $code"
          [ "$kernel" -gt 0 ] || { echo "::error::crazyagent-kernel-processes was not checked, the cache was read as fresh"; code=1; }
          [ "$macos" -gt 0 ] || { echo "::error::crazyagent-macos-fs was not checked, the cache was read as fresh"; code=1; }
          exit $code
