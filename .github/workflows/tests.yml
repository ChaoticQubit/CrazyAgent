name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  cm-engine-node-linux:
    name: V243-CONTEXT-MODE-ENGINE-NODE r1 final tip 148ee12c0 on ubuntu-22.04, the engine Node, did-not-run and npm link rows x3 and the context_mode module, both rows red with a77119f85 context_mode.rs x3, clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    env:
      TIP: 148ee12c0287ac0055675d4e4a05edb442f3a9ee
      RED: a77119f8550346dd070df746a318b2421962958d
      NEW: context_mode::tests::a_node_check_that_did_not_run_answers_its_own_code_not_too_old
      PROBE: context_mode::tests::the_engine_s_own_node_passes_the_node_check_and_starts_npm_under_the_install_profile
      NPMROW: context_mode::tests::npm_linked_into_its_package_outside_every_granted_root_starts_under_the_install_profile
      MODULE: "context_mode::"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
          grep -qx crates/crazyagent/src/context_mode.rs <<< "$(git diff --name-only "$RED" "$TIP")"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The engine Node, did-not-run and npm link rows and the context_mode module at the tip, then both rows at the red commit
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        run: |
          set +e
          set -u
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          helper() {
            cargo build -p crazyagent --bin crazyagent-landlock --locked > "$RUNNER_TEMP/helper-$1.log" 2>&1
            rc=$?
            echo "helper at $1 rc=$rc"
            [ "$rc" -eq 0 ] || tail -20 "$RUNNER_TEMP/helper-$1.log" | cut -c1-300
            return "$rc"
          }
          libbin() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
            rc=$?
            echo "  lib build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error\|^warning" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)"
          }
          passed=0
          failed=0
          rows() {
            at=$1
            row=$2
            passed=0
            failed=0
            for i in 1 2 3; do
              log="$RUNNER_TEMP/$at-${row##*::}-$i.log"
              keyring "$lib" --exact "$row" > "$log" 2>&1
              if grep -qx "test $row ... ok" "$log"; then
                passed=$((passed + 1))
              elif grep -qx "test $row ... FAILED" "$log"; then
                failed=$((failed + 1))
                grep -m1 -A12 "panicked at" "$log" | cut -c1-1500
              else
                echo "  no result line in run $i"
                tail -8 "$log" | cut -c1-300
              fi
            done
            echo "ROW ${row##*::} at $at: $passed ok, $failed failed of 3"
          }
          npm=$(command -v npm)
          echo "node $(node --version) npm $npm -> $(realpath "$npm")"
          id
          walk=$(realpath "$(command -v node)")
          while [ "$walk" != / ]; do
            stat -c 'node path %A %U:%G %n' "$walk"
            walk=$(dirname "$walk")
          done
          bad=0
          helper tip || exit 1
          lib=$(libbin) || { echo "the tip lib tests did not build"; exit 1; }
          for row in "$PROBE" "$NEW" "$NPMROW"; do
            rows tip "$row"
            [ "$passed" -eq 3 ] || bad=1
          done
          keyring "$lib" "$MODULE" > "$RUNNER_TEMP/module-tip.log" 2>&1
          rc=$?
          echo "MODULE at tip rc=$rc $(grep -m1 '^test result' "$RUNNER_TEMP/module-tip.log" | cut -c1-160)"
          grep '^test .* FAILED$' "$RUNNER_TEMP/module-tip.log"
          [ "$rc" -eq 0 ] || bad=1
          git checkout "$RED" -- crates/crazyagent/src/context_mode.rs
          test "$(git diff --name-only "$TIP")" = crates/crazyagent/src/context_mode.rs || { echo "the red tree differs from the tip in more than context_mode.rs"; exit 1; }
          git diff --quiet "$RED" -- crates/crazyagent/src/context_mode.rs || { echo "context_mode.rs is not the red commit's"; exit 1; }
          helper red || exit 1
          lib=$(libbin) || { echo "the red lib tests did not build"; exit 1; }
          for row in "$PROBE" "$NEW"; do
            rows red "$row"
            [ "$failed" -eq 3 ] || bad=1
          done
          git checkout "$TIP" -- crates/crazyagent/src/context_mode.rs
          git diff --quiet "$TIP" || { echo "the tree is not back at the tip"; exit 1; }
          echo "verdict bad=$bad"
          exit "$bad"
      - name: Clippy on the fix tip lib, then its lib tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          set -u
          git diff --quiet "$TIP" || { echo "the tree is not the tip"; exit 1; }
          bad=0
          for profile in dev test; do
            out=$(cargo clippy -p crazyagent --lib --profile "$profile" --locked -- -D warnings 2>&1)
            rc=$?
            echo "clippy lib profile $profile rc=$rc"
            printf '%s\n' "$out" | grep -E -A6 '^(error|warning)' | head -60 | cut -c1-300
            [ "$rc" -eq 0 ] || bad=1
          done
          exit "$bad"
  cm-engine-node-macos:
    name: V243-CONTEXT-MODE-ENGINE-NODE r1 final tip 148ee12c0 on macos-15 with setup-node, the engine Node, did-not-run and npm link rows x3 and the context_mode module
    runs-on: macos-15
    timeout-minutes: 200
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      TIP: 148ee12c0287ac0055675d4e4a05edb442f3a9ee
      NEW: context_mode::tests::a_node_check_that_did_not_run_answers_its_own_code_not_too_old
      PROBE: context_mode::tests::the_engine_s_own_node_passes_the_node_check_and_starts_npm_under_the_install_profile
      NPMROW: context_mode::tests::npm_linked_into_its_package_outside_every_granted_root_starts_under_the_install_profile
      MODULE: "context_mode::"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux 3.8"
      - name: State the runner node and its folders
        run: |
          set -euo pipefail
          id
          npm=$(command -v npm)
          echo "node $(node --version) npm $npm -> $(realpath "$npm")"
          walk=$(realpath "$(command -v node)")
          while [ "$walk" != / ]; do
            stat -f 'node path %Sp %Su:%Sg %N' "$walk"
            walk=$(dirname "$walk")
          done
      - name: Build the tip lib tests
        if: ${{ !cancelled() }}
        timeout-minutes: 110
        run: |
          set +e
          set -u
          out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
          rc=$?
          echo "tip lib build rc=$rc"
          printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300
          [ "$rc" -eq 0 ] || exit 1
          lib=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)
          test -n "$lib" || { echo "no lib test executable in the build output"; exit 1; }
          realpath "$lib" > "$RUNNER_TEMP/lib-tip"
          echo "tip lib $(cat "$RUNNER_TEMP/lib-tip")"
      - name: The engine Node, did-not-run and npm link rows at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          set -u
          lib=$(cat "$RUNNER_TEMP/lib-tip")
          bad=0
          for row in "$PROBE" "$NEW" "$NPMROW"; do
            passed=0
            failed=0
            for i in 1 2 3; do
              log="$RUNNER_TEMP/tip-${row##*::}-$i.log"
              "$lib" --exact "$row" > "$log" 2>&1
              if grep -qx "test $row ... ok" "$log"; then
                passed=$((passed + 1))
              elif grep -qx "test $row ... FAILED" "$log"; then
                failed=$((failed + 1))
                grep -m1 -A12 "panicked at" "$log" | cut -c1-1500
              else
                echo "  no result line in run $i"
                tail -8 "$log" | cut -c1-300
              fi
            done
            echo "ROW ${row##*::} at tip: $passed ok, $failed failed of 3"
            [ "$passed" -eq 3 ] || bad=1
          done
          "$lib" "$MODULE" > "$RUNNER_TEMP/module-tip.log" 2>&1
          rc=$?
          echo "MODULE at tip rc=$rc $(grep -m1 '^test result' "$RUNNER_TEMP/module-tip.log" | cut -c1-160)"
          grep '^test .* FAILED$' "$RUNNER_TEMP/module-tip.log"
          [ "$rc" -eq 0 ] || bad=1
          echo "tip verdict bad=$bad"
          exit "$bad"
  cm-engine-node-windows:
    name: V243-CONTEXT-MODE-ENGINE-NODE r1 final tip 148ee12c0 on windows-2022, clippy lib and tests, the context_mode module as a standard local user
    runs-on: windows-2022
    timeout-minutes: 200
    env:
      TIP: 148ee12c0287ac0055675d4e4a05edb442f3a9ee
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        id: toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
          echo "clippy crazyagent --lib rc 0"
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
          echo "clippy crazyagent --tests rc 0"
      - name: Build the boundary helper and the engine library tests, the helper beside them
        id: lib
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
          printf '%s\n' "$out" | tail -3
          lib=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src[\\/]lib.rs (\(.*\))/\1/p' | tail -1)
          test -n "$lib" || { echo "no lib test executable in the build output"; exit 1; }
          lib=$(realpath "$(cygpath -u "$lib")")
          test -f "$lib"
          deps=$(dirname "$lib")
          cp target/debug/crazyagent-win-boundary.exe "$deps/"
          test -f "$deps/crazyagent-win-boundary.exe"
          echo "SBX_ENGINE_EXE=$(cygpath -w "$lib")" >> "$GITHUB_ENV"
          echo "engine tests $(cygpath -w "$lib"), boundary helper beside them in $(cygpath -w "$deps")"
      - name: The context_mode module as a standard local user
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 40
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'castd'
          $alphabet = [char[]]'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = (-join (1..24 | ForEach-Object { $alphabet | Get-Random })) + 'aZ7!'
          net user $user $password /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net user failed with $LASTEXITCODE" }
          $admins = net localgroup Administrators
          if ($admins -contains $user) { throw "$user is an administrator" }
          icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)(RX)" /C /Q | Out-Null
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $start = [System.Diagnostics.ProcessStartInfo]::new($env:SBX_ENGINE_EXE)
          foreach ($argument in @('context_mode::', '--test-threads', '1')) { $start.ArgumentList.Add($argument) }
          $start.UserName = $user
          $start.Domain = '.'
          $start.Password = $secure
          $start.LoadUserProfile = $true
          $start.UseShellExecute = $false
          $start.WorkingDirectory = Join-Path $env:GITHUB_WORKSPACE 'crates\crazyagent'
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $out = $process.StandardOutput.ReadToEndAsync()
          $err = $process.StandardError.ReadToEndAsync()
          if (-not $process.WaitForExit(2000000)) { $process.Kill($true) }
          $process.WaitForExit()
          $text = $out.Result + "`n" + $err.Result
          $lines = $text -split "`r?`n"
          $result = $lines | Where-Object { $_ -like 'test result*' } | Select-Object -First 1
          Write-Host "MODULE as a standard local user exit $($process.ExitCode) $result"
          $lines | Where-Object { $_ -match '^test .* FAILED$' } | ForEach-Object { Write-Host $_ }
          $lines | Select-String -Pattern 'panicked at' -Context 0,4 | Select-Object -First 8 | ForEach-Object { Write-Host $_ }
          $bad = $process.ExitCode -ne 0
          foreach ($row in @('the_node_probe_leaves_no_container_behind', 'a_node_probe_releases_the_container_a_crashed_probe_left', 'a_node_probe_leaves_a_live_probe_container_alone')) {
            if (-not ($lines -contains "test context_mode::windows_tests::$row ... ok")) { Write-Host "ROW NOT OK: $row"; $bad = $true }
          }
          if ($bad) { exit 1 }
