name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TMUX_VERSION: "3.8"
  NODE_VERSION: "26.12.1"
  BASE_SHA: cdf02af79b53347eb64d7d2b0d9d42391d6f71aa
  TIP_SHA: a7fbf7b9519e8bbb272b27ff6b1c350e8f4a8c49
  BOOT_ROWS: cli_output_failure_cleans_runtime_before_unlock cli_preserves_unrecorded_socket cli_shutdown_preserves_observed_replacements
  IDE_MODULE: "ide::server::tests::"
  ASIDE_ROW: ide::server::tests::a_recorded_temp_folder_is_moved_aside_at_once_and_removed_off_the_stop_path
  LEAK_ROW: ide::server::tests::a_confined_start_never_reuses_an_earlier_start_s_temp_folder
  NEXT_ROW: ide::server::tests::the_next_confined_start_removes_an_earlier_temp_folder_its_session_shut_and_pinned
  SWEEP_ROW: ide::server::tests::the_engine_start_sweep_removes_a_left_temp_folder_that_was_shut_and_pinned

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS owner_bootstrap rows around the IDE server rows, ${{ matrix.side }}
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: [base, tip]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select the Xcode git the engine lands with
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read the pinned IDE build
        id: ide
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("crates/crazyagent/src/ide/builds.json", "utf8"));
            const { version } = manifest;
            const build = manifest.builds["aarch64-apple-darwin"];
            const url = `https://github.com/VSCodium/vscodium/releases/download/${version}/vscodium-reh-web-darwin-arm64-${version}.tar.gz`;
            const pinned = /^[0-9]+(\.[0-9]+)*$/.test(version) && build?.url === url && /^[0-9a-f]{64}$/.test(build.sha256)
              && Number.isSafeInteger(build.bytes) && build.bytes > 0 && build.bytes <= 150 * 1024 * 1024;
            if (!pinned) throw new Error("builds.json does not pin an official darwin-arm64 VSCodium build");
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nurl=${url}\nsha256=${build.sha256}\nbytes=${build.bytes}\n`);
          '
      - name: Provision the pinned IDE build
        env:
          IDE_VERSION: ${{ steps.ide.outputs.version }}
          IDE_URL: ${{ steps.ide.outputs.url }}
          IDE_SHA256: ${{ steps.ide.outputs.sha256 }}
          IDE_BYTES: ${{ steps.ide.outputs.bytes }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vscodium-reh-web"
          build=".local-state/ide-cache/vscodium-$IDE_VERSION"
          mkdir -p "$work" "$build"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --max-filesize "$IDE_BYTES" -o "$work/vscodium.tgz" "$IDE_URL"
          test "$(stat -f %z "$work/vscodium.tgz")" = "$IDE_BYTES"
          echo "$IDE_SHA256  $work/vscodium.tgz" | shasum -a 256 -c -
          tar -xzf "$work/vscodium.tgz" -C "$build"
          test -f "$build/out/server-main.js"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Bootstrap rows, then the IDE server rows, then the bootstrap rows again
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          if [ "$SIDE" = base ]; then sha="$BASE_SHA"; else sha="$TIP_SHA"; fi
          git checkout -q --detach "$sha" || { echo "::error::checkout $sha failed"; exit 1; }
          pre="$RUNNER_TEMP/boot-pre-$SIDE.txt"; lib="$RUNNER_TEMP/ide-$SIDE.txt"; post="$RUNNER_TEMP/boot-post-$SIDE.txt"
          git log --oneline -1 | tee "$pre"
          gone() { find /private/tmp -maxdepth 1 -name 'ca-*-gone-*' 2>/dev/null | wc -l | tr -d ' '; }
          echo "gone folders at start: $(gone)"
          cargo test -p crazyagent --locked --lib --no-run 2>&1 | tail -3
          cargo test -p crazyagent --locked --test owner_bootstrap --no-run 2>&1 | tail -3
          read -ra boot <<< "$BOOT_ROWS"
          cargo test -p crazyagent --locked --test owner_bootstrap -- --exact "${boot[@]}" 2>&1 | tee -a "$pre"
          cargo test -p crazyagent --locked --lib -- "$IDE_MODULE" 2>&1 | tee "$lib"
          left_after_lib=$(gone)
          echo "gone folders after the IDE rows: $left_after_lib"
          cargo test -p crazyagent --locked --test owner_bootstrap -- --exact "${boot[@]}" 2>&1 | tee "$post"
          echo "gone folders at end: $(gone)"
          result() { grep -E "^test $1 \.\.\. " "$2" | sed -E 's/.* \.\.\. //'; }
          count() { grep -cE "^test [a-z_]+ \.\.\. $1$" "$2"; }
          pre_ok=$(count ok "$pre"); post_ok=$(count ok "$post"); post_failed=$(count FAILED "$post")
          leak=$(result "$LEAK_ROW" "$lib"); aside=$(result "$ASIDE_ROW" "$lib"); next=$(result "$NEXT_ROW" "$lib"); sweep=$(result "$SWEEP_ROW" "$lib")
          lib_ok=$(grep -cE "^test $IDE_MODULE[a-z0-9_]+ \.\.\. ok$" "$lib")
          lib_failed=$(grep -cE "^test $IDE_MODULE[a-z0-9_]+ \.\.\. FAILED$" "$lib")
          grep -E "^test $IDE_MODULE[a-z0-9_]+ \.\.\. FAILED$" "$lib"
          line=$(grep -c "ide_server_tmp_left" "$post")
          verdict=pass
          [ "$pre_ok" = 3 ] && [ "$leak" = ok ] && [ "$aside" = ok ] && [ "$lib_ok" -gt 20 ] || verdict=fail
          case "$SIDE" in
            base) [ "$next" = FAILED ] && [ "$sweep" = FAILED ] && [ "$lib_failed" = 2 ] && [ "$post_failed" = 3 ] && [ "$line" -ge 1 ] || verdict=fail ;;
            tip) [ "$next" = ok ] && [ "$sweep" = ok ] && [ "$lib_failed" = 0 ] && [ "$post_ok" = 3 ] && [ "$line" = 0 ] || verdict=fail ;;
          esac
          { echo "| side | pre ok | leak | aside | next | sweep | ide ok | ide failed | gone after lib | post ok | post failed | tmp_left lines | verdict |"; echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"; echo "| $SIDE | $pre_ok | ${leak:-none} | ${aside:-none} | ${next:-none} | ${sweep:-none} | $lib_ok | $lib_failed | $left_after_lib | $post_ok | $post_failed | $line | $verdict |"; } >> "$GITHUB_STEP_SUMMARY"
          echo "VERDICT $SIDE pre_ok=$pre_ok leak=${leak:-none} aside=${aside:-none} next=${next:-none} sweep=${sweep:-none} ide_ok=$lib_ok ide_failed=$lib_failed gone_after_lib=$left_after_lib post_ok=$post_ok post_failed=$post_failed tmp_left_lines=$line verdict=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-ide-tmp-${{ matrix.side }}
          path: ${{ runner.temp }}/*-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
