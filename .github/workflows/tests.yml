name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP_SHA: 36a87145c
  D2_TURNS: "20"

defaults:
  run:
    shell: bash

jobs:
  s6d2:
    name: V244 WIN-MASTER S6 D2 turn boundary timing on ${{ matrix.runner }}, tip 36a87145c, quiet and under a parallel cargo build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        if: ${{ false }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the Windows boundary helper the sandbox rows start
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/
      - name: D2 timing, quiet
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          export D2_TIMING_OUT="$RUNNER_TEMP/d2-quiet.txt"
          cargo test -p crazyagent --lib --locked -- --test-threads 1 --ignored --exact sandbox::windows::tests::d2_turn_boundary_time_per_turn_and_per_session > "$RUNNER_TEMP/d2-quiet.log" 2>&1 || true
          grep -E '^test |^test result|panicked' "$RUNNER_TEMP/d2-quiet.log" || true
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/d2-quiet.log"
          sed 's/^/quiet /' "$D2_TIMING_OUT"
      - name: D2 timing, under a parallel cargo build
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          export D2_TIMING_OUT="$RUNNER_TEMP/d2-loaded.txt"
          ( cargo build -p crazyagent --release --locked --target-dir "$RUNNER_TEMP/load-target" > "$RUNNER_TEMP/load.log" 2>&1 ) &
          load=$!
          sleep 60
          kill -0 "$load"
          cargo test -p crazyagent --lib --locked -- --test-threads 1 --ignored --exact sandbox::windows::tests::d2_turn_boundary_time_per_turn_and_per_session > "$RUNNER_TEMP/d2-loaded.log" 2>&1 || true
          grep -E '^test |^test result|panicked' "$RUNNER_TEMP/d2-loaded.log" || true
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/d2-loaded.log"
          if kill -0 "$load" 2>/dev/null; then echo "load still running at the end: yes"; kill "$load" || true; else echo "load still running at the end: no (it ended first; the loaded figures cover only part of the run)"; fi
          sed 's/^/loaded /' "$D2_TIMING_OUT"
