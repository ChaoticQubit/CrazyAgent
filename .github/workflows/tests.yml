name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 2c025c9d2ba84848c7ff078024d9041aa3cf7831
  RED: 9129d5a4fe3de7358e0908a701e6449467a68eeb
  BASE: af1b6b99ae9939e8fa514e6fe5e14cacbf17b3c1
  FILES: "apps/desktop/src/screens/settings/add-account.tsx apps/desktop/src/screens/settings/sign-in.tsx apps/desktop/test/accounts.test.mjs apps/desktop/test/native-auth.test.mjs crates/crazyagent/src/tui/client/settings/tests.rs crates/crazyagent/src/tui/frames/add-provider-120.txt crates/crazyagent/src/tui/frames/add-provider-80.txt crates/crazyagent/src/tui/screens/settings_accounts.rs crates/crazyagent/src/tui/screens/settings_add_account.rs "
  RUST_FILES: crates/crazyagent/src/tui/client/settings/tests.rs crates/crazyagent/src/tui/screens/settings_accounts.rs crates/crazyagent/src/tui/screens/settings_add_account.rs
  NODE_FILES: apps/desktop/test/accounts.test.mjs apps/desktop/test/native-auth.test.mjs
  RED_ROWS: >-
    tui::client::settings::tests::add_account_offers_one_entry_per_company_and_adds_the_same_engine_accounts
    tui::screens::settings_accounts::tests::add_account_provider_and_method_frames_match_the_design
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -80 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red-all)
        [ "$rc" != 0 ] && [ "$failed" = "$listed" ] && [ "$passed" = 0 ] || { echo "::error::$name is not red on every row"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac
  NODE_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    file=$3
    log="$RUNNER_TEMP/node-$name.log"
    node --test --test-timeout=15000 --test-reporter=spec "$file" > "$log" 2>&1
    rc=$?
    grep -E '✖|✔|ℹ (tests|pass|fail) ' "$log" | head -80 || true
    grep -E -A6 '^  (AssertionError|Error)' "$log" | head -60 || true
    tests=$(grep -E '^ℹ tests ' "$log" | awk '{print $3+0}')
    pass=$(grep -E '^ℹ pass ' "$log" | awk '{print $3+0}')
    fail=$(grep -E '^ℹ fail ' "$log" | awk '{print $3+0}')
    echo "$name expect $expect file $file rc $rc tests ${tests:-0} pass ${pass:-0} fail ${fail:-0}"
    [ "${tests:-0}" -ge 1 ] || { echo "::error::$name ran no test"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "${fail:-1}" = 0 ] && [ "$pass" = "$tests" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red)
        [ "$rc" != 0 ] && [ "${fail:-0}" -ge 1 ] || { echo "::error::$name is not red"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  copy:
    name: CR14-LOCAL-COPY crazyagent clippy, rustfmt, settings rows, desktop tests and tsc on ubuntu-22.04, red then tip
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='CR14-LOCAL-COPY tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the CR14-LOCAL-COPY tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red test commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE" ] || { echo "::error::HEAD~3 is not the b24 base"; exit 1; }
          [ "$(git diff --name-only HEAD~3 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the CR14-LOCAL-COPY tip"; exit 1; }
      - name: Write the row runners
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          printf '%s\n' "$NODE_SH" > "$RUNNER_TEMP/node.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/node.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the 2 rows and the 2 desktop files at the red test commit (expect every row red, each file red)
        timeout-minutes: 50
        run: |
          set +e
          set -uo pipefail
          git checkout "$RED" -- crates apps || exit 1
          git diff --quiet "$RED" -- crates apps || { echo "::error::the red tree is not the red test commit"; exit 1; }
          rc=0
          cargo test -p crazyagent --lib --locked --no-run || rc=1
          read -ra rows <<< "$RED_ROWS"
          if [ "$rc" = 0 ]; then
            bash "$RUNNER_TEMP/rows.sh" rows-at-red red-all --exact "${rows[@]}" || rc=$?
          fi
          read -ra files <<< "$NODE_FILES"
          for file in "${files[@]}"; do
            bash "$RUNNER_TEMP/node.sh" "red-$(basename "$file" .test.mjs)" red "$file" || rc=$?
          done
          git checkout HEAD^ -- crates apps || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "red leg rc $rc"
          [ "$rc" = 0 ]
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          read -ra files <<< "$RUST_FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "rustfmt rc $code"
          [ "$code" = 0 ]
      - name: Desktop tsc at the tip (expect rc 0)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: |
          set +e
          npm run typecheck
          code=$?
          echo "tsc rc $code"
          [ "$code" = 0 ]
      - name: Tip, the 2 desktop files
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set +e
          rc=0
          read -ra files <<< "$NODE_FILES"
          for file in "${files[@]}"; do
            bash "$RUNNER_TEMP/node.sh" "tip-$(basename "$file" .test.mjs)" pass "$file" || rc=$?
          done
          echo "desktop tip rc $rc"
          [ "$rc" = 0 ]
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 50
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          grep -E '^ +(Checking|Compiling) crazyagent v' "$log" || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the 2 rows
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          read -ra rows <<< "$RED_ROWS"
          bash "$RUNNER_TEMP/rows.sh" rows-at-tip pass --exact "${rows[@]}"
      - name: Tip, every settings client row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" settings-client pass tui::client::settings::
      - name: Tip, every settings screen row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" settings-screens pass tui::screens::settings_
