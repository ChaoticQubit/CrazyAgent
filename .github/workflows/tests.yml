name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n1-probes:
    name: V244-WIN-SIGNIN-N1 Q1 probes 2c 2d 4 on ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Copy the probe out of the tree
        shell: bash
        run: cp .github/farm/v244-n1-probes.cs "$RUNNER_TEMP/probes.cs"
      - name: Run the pin probes on NTFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem).Caption
          $PSVersionTable.PSVersion.ToString()
          whoami
          $root = Join-Path $env:RUNNER_TEMP 'n1probe'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          (Get-Volume -DriveLetter ($root.Substring(0,1))).FileSystem
          Add-Type -TypeDefinition (Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'probes.cs')) -Language CSharp
          [N1Probe]::Run($root)
          'probes done'
