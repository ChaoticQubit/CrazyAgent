name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  wire1-windows:
    name: V244-WIN-ENGINE-WIRING W3-3 land ${{ matrix.runner }} at 8856985a4 (7320b2018 on chore/v244 3e45d7a38), clippy crazyagent and win-sandbox lib and tests, ipc, engine pipe, owner pipe, owner root and cap rows, private and pipe store rows, release guard and feature tree
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, ubuntu-22.04]
    env:
      FARM_OS: ${{ startsWith(matrix.runner, 'windows') && 'windows' || 'linux' }}
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Copy the row script out of the tree
        run: cp .github/farm/v244-win-w3-3-land-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install Linux build packages, three tries
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 30
        run: |
          set -uo pipefail
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/90-farm-lock-wait >/dev/null
          for try in 1 2 3; do
            if timeout --kill-after=30 480 bash scripts/ci/linux-packages.sh; then
              echo "packages installed on try $try"
              exit 0
            fi
            echo "package install try $try failed"
            for wait in $(seq 1 60); do
              pgrep -x 'apt-get|apt|dpkg' >/dev/null || break
              sleep 5
            done
            if pgrep -x 'apt-get|apt|dpkg' >/dev/null; then
              echo "::error::an apt or dpkg process from try $try is still running after 5 minutes"
              exit 1
            fi
          done
          echo "::error::the Linux build packages did not install in three tries"
          exit 1
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Clippy, rows and red classification
        timeout-minutes: 220
        run: bash "$RUNNER_TEMP/rows.sh"

