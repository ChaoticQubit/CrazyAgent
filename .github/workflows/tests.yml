      - name: The confined record-folder bind leg on the production helper, open and limited network (expect rc 0, abi >= 3, 10 confined socket=13, 10 outside bound, test result 1 passed 0 failed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/record-sockets.log"
          cargo test -p crazyagent --test linux_record_sockets --locked -- --nocapture > "$log" 2>&1
