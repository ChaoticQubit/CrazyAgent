name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
    snapshot_v242/every_model_server_scenario_matches_its_2_4_2_capture
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  build-macos:
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      matrix:
        include:
          - os: macos
            runner: macos-15
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}

  rust-model-servers:
    name: Rust macos model-server rows
    needs: build-macos
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FARM_JUNIT: target/nextest/farm/junit.xml
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh
      - uses: ./.github/actions/model-servers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: farm-archive-macos
          path: ${{ runner.temp }}/archive
      - name: Run the model-server rows
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/archive/farm-macos.tar.zst"
          [ -f "$archive" ] || { echo "::error::no test archive at $archive; the build job for this platform failed"; exit 1; }
          cargo nextest run --archive-file "$archive" --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --no-tests=fail \
            -E 'binary_id(=crazyagent::snapshot_v242) & test(=every_model_server_scenario_matches_its_2_4_2_capture)'
      - name: Keep a JUnit report for the model-server rows
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FARM_JUNIT")"
          if [ ! -s "$FARM_JUNIT" ]; then
            printf '<testsuites><testcase classname="farm" name="macos model-server rows wrote no JUnit report"><failure/></testcase></testsuites>\n' > "$FARM_JUNIT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-junit-macos-model-servers
          path: target/nextest/farm/junit.xml
          if-no-files-found: error
          retention-days: 14

  rust-model-servers-absent:
    name: Rust macos model-server rows with no server (control)
    needs: build-macos
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FARM_JUNIT: target/nextest/farm/junit.xml
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: farm-archive-macos
          path: ${{ runner.temp }}/archive
      - name: Run the model-server rows with no server and require them to fail as unavailable
        run: |
          set -uo pipefail
          archive="$RUNNER_TEMP/archive/farm-macos.tar.zst"
          [ -f "$archive" ] || { echo "::error::no test archive at $archive; the build job for this platform failed"; exit 1; }
          for name in CRAZYAGENT_TEST_OLLAMA_URL CRAZYAGENT_TEST_LLAMA_URL CRAZYAGENT_TEST_LLAMA_KEYED_URL; do
            [ -z "${!name:-}" ] || { echo "::error::$name is set in the control"; exit 1; }
          done
          log="$RUNNER_TEMP/absent.log"
          cargo nextest run --archive-file "$archive" --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --no-tests=fail \
            -E 'binary_id(=crazyagent::snapshot_v242) & test(=every_model_server_scenario_matches_its_2_4_2_capture)' > "$log" 2>&1
          rc=$?
          cat "$log"
          echo "control rc $rc"
          [ "$rc" -ne 0 ] || { echo "::error::the rows passed with no server"; exit 1; }
          for name in CRAZYAGENT_TEST_OLLAMA_URL CRAZYAGENT_TEST_LLAMA_URL CRAZYAGENT_TEST_LLAMA_KEYED_URL; do
            count=$(grep -c "server unavailable: $name is unset" "$log" || true)
            echo "unavailable $name: $count"
            [ "$count" -ge 1 ] || { echo "::error::no server unavailable line for $name"; exit 1; }
          done
      - name: Keep a JUnit report for the model-server rows
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FARM_JUNIT")"
          if [ ! -s "$FARM_JUNIT" ]; then
            printf '<testsuites><testcase classname="farm" name="macos model-server control wrote no JUnit report"><failure/></testcase></testsuites>\n' > "$FARM_JUNIT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-junit-macos-model-servers-absent
          path: target/nextest/farm/junit.xml
          if-no-files-found: error
          retention-days: 14
