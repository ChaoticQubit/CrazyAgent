      - name: Durable narrowing r2 the two K rows green at 07afaedf0 on ubuntu-22.04
        timeout-minutes: 90
        run: |
          export CARGO_BUILD_JOBS=2
          cp .github/farm/r2.sh "$RUNNER_TEMP/r2.sh"
