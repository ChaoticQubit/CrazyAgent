name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TMUX_VERSION: "3.8"
  RED_SHA: 9b8c694d8
  SETTLE_RED_SHA: 842a4e6db
  BASE_SHA: 238ab31c7
  TREE_RED_SHA: caa607702
  TIP_SHA: 38f754dfd

defaults:
  run:
    shell: bash

jobs:
  s4-windows:
    name: V244 WIN-MASTER S4 r4 Claude custody on ${{ matrix.runner }}, red at 9b8c694d8 and caa607702, tip 38f754dfd
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: S4 red rows at 9b8c694d8
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git restore -q --source="$RED_SHA" --staged --worktree -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::process::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test engine::|^test result|panicked|left:' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 6 failed; 1 ignored' "$RUNNER_TEMP/red.log"
          echo "red as expected: the red-only Windows custody refuses every run, so all 6 rows fail"
      - name: S4 exit settle red at 842a4e6db on the tip's tree
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git restore -q --source="$SETTLE_RED_SHA" --staged --worktree -- crates/crazyagent/src/engine/claude_host/process.rs
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::process::windows_tests:: --skip a_windows_claude_harness_that_exits_leaving_a_sleeping_process 2>&1 | tee "$RUNNER_TEMP/settle-red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test engine::|^test result|left:|run [0-9]' "$RUNNER_TEMP/settle-red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 6 passed; 1 failed; 2 ignored' "$RUNNER_TEMP/settle-red.log"
          grep -q 'a_windows_claude_harness_that_exits_before_a_turn_is_reaped_and_retired \.\.\. FAILED' "$RUNNER_TEMP/settle-red.log"
          grep -q 'left: Some("claude_host_disconnected")' "$RUNNER_TEMP/settle-red.log"
          echo "red as expected: without the settle the exit row reads a disconnect"
      - name: S1 r2 W1 red for ended at caa607702 on the tip's tree
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git restore -q --source="$TREE_RED_SHA" --staged --worktree -- crates/crazyagent-win-sandbox/src/win/tree.rs
          set +e
          cargo test -p crazyagent-win-sandbox --lib --locked -- --test-threads 1 win::tree::tests:: 2>&1 | tee "$RUNNER_TEMP/tree-red.log"
          tree_rc=${PIPESTATUS[0]}
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::process::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/claude-tree-red.log"
          claude_rc=${PIPESTATUS[0]}
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test win::|^test engine::|^test result|left:|right:' "$RUNNER_TEMP/tree-red.log" "$RUNNER_TEMP/claude-tree-red.log" || true
          [ "$tree_rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 1 failed' "$RUNNER_TEMP/tree-red.log"
          grep -q 'a_held_tree_with_a_sleeping_child_says_ended_only_once_none_runs \.\.\. FAILED' "$RUNNER_TEMP/tree-red.log"
          [ "$claude_rc" -ne 0 ]
          grep -q 'a_process_in_a_job_nested_in_a_held_tree_counts_until_the_tree_ends_it \.\.\. FAILED' "$RUNNER_TEMP/claude-tree-red.log"
          echo "red as expected: an ended that ends nothing fails the tree row and the nested-job row"
      - name: S1 r2 W1 tree row at the tip 38f754dfd
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo test -p crazyagent-win-sandbox --lib --locked -- --test-threads 1 win::tree::tests:: 2>&1 | tee "$RUNNER_TEMP/tree-tip.log"
          grep -qE 'test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/tree-tip.log"
      - name: S4 Windows custody rows at the tip 38f754dfd, five rounds
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            set +e
            cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host::process::windows_tests:: > "$RUNNER_TEMP/tip-$round.log" 2>&1
            rc=$?
            set -e
            echo "round $round rc=$rc"
            grep -E '^test engine::|^test result|panicked|left:|right:' "$RUNNER_TEMP/tip-$round.log" || true
            [ "$rc" -eq 0 ]
            grep -qE 'test result: ok\. 8 passed; 0 failed; 2 ignored' "$RUNNER_TEMP/tip-$round.log"
          done
          echo "8 rows green in 5 rounds"
      - name: Earlier Windows master rows stay green at the tip (S1 Codex custody, S2 stream log, S3 commands)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::claude_host:: engine::codex_host:: engine::owner::transport::master_host_launch::windows_command_tests:: 2>&1 | tee "$RUNNER_TEMP/earlier.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test result|FAILED|panicked' "$RUNNER_TEMP/earlier.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/earlier.log"
      - name: Windows access refusal rows stay green at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 sandbox::policy::tests:: 2>&1 | tee "$RUNNER_TEMP/policy.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'windows|^test result' "$RUNNER_TEMP/policy.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
          grep -q 'full_access_on_windows_is_refused_with_its_own_reason_and_code \.\.\. ok' "$RUNNER_TEMP/policy.log"
