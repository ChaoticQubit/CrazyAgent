  node:
    name: Batch b10 b11 b12 node rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: T7r-2, pod E desktop node rows
        id: node
        timeout-minutes: 15
        run: |
          set +e
          red=0
          : > "$RUNNER_TEMP/node.red"
          cd apps/desktop || exit 1
          npm ci --ignore-scripts --no-audit --no-fund || { echo "npm ci failed"; exit 1; }
          for f in test/restore-recovery.test.mjs test/settings-restore.test.mjs test/command-registration.test.mjs test/command-wiring.test.mjs test/project-access.test.mjs test/bundles.test.mjs test/settings-sandbox.test.mjs test/settings-sandbox-layout.test.mjs test/project-sandbox.test.mjs; do
            tap="$RUNNER_TEMP/$(basename "$f").tap"
            node --test --test-reporter=tap "$f" > "$tap" 2>&1
            code=$?
            echo "$f on ubuntu-22.04: rc $code"
            grep -E '^# (tests|pass|fail)' "$tap" || true
            { grep -E '^[[:space:]]*not ok' "$tap" || true; } | sed -E 's/^[[:space:]]*not ok [0-9]+ - //' | awk -v f="$f" '!s[$0]++{print f "\t" $0}' >> "$RUNNER_TEMP/node.red"
            if [ "$code" -ne 0 ]; then red=1; grep -E -A 12 '^[[:space:]]*not ok' "$tap" | head -n 60; fi
            grep -qE '^# pass [1-9]' "$tap" || { echo "$f: no row passed"; red=1; }
          done
          cat "$RUNNER_TEMP/node.red"
          [ "$red" -eq 0 ]
      - name: Base rerun of the red node rows at chore/v250 b1e4758d5
        if: ${{ failure() && steps.node.outcome == 'failure' }}
        timeout-minutes: 15
        run: |
          set +e
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cd "$RUNNER_TEMP/base" || exit 1
          git log -1 --format='base %H %s'
          cd apps/desktop || exit 1
          npm ci --ignore-scripts --no-audit --no-fund || echo "base npm ci failed"
          echo "NEW vs BASE on ubuntu-22.04 node:"
          for f in test/restore-recovery.test.mjs test/settings-restore.test.mjs test/command-registration.test.mjs test/command-wiring.test.mjs test/project-access.test.mjs test/bundles.test.mjs test/settings-sandbox.test.mjs test/settings-sandbox-layout.test.mjs test/project-sandbox.test.mjs; do
            if [ ! -f "$f" ]; then
              awk -F'\t' -v f="$f" '$1==f{print "node " f " " $2 ": NEW (file absent at base)"}' "$RUNNER_TEMP/node.red"
              continue
            fi
            tap="$RUNNER_TEMP/$(basename "$f").base.tap"
            node --test --test-reporter=tap "$f" > "$tap" 2>&1
            echo "$f at base: rc $?"
            awk -F'\t' -v f="$f" '$1==f{print $2}' "$RUNNER_TEMP/node.red" | while IFS= read -r name; do
              if grep -E '^[[:space:]]*not ok' "$tap" | sed -E 's/^[[:space:]]*not ok [0-9]+ - //' | grep -qxF -- "$name"; then
                echo "node $f $name: BASE (red at base)"
              else
                echo "node $f $name: NEW (green or absent at base)"
              fi
            done
          done
          exit 1
