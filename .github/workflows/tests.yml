name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 866ed00c668da1fd1a4ed59a800baba77f849984
  MOVE: 56caa5cb5277e5eda1bca8c401a05d59537a2586
  RED: 8adccacd618d58ca4f658144ed8928562461f84f
  BASE: 2c025c9d2ba84848c7ff078024d9041aa3cf7831
  CAPS_BASE: c6c672b4726b8226a35e486089704f41e4f66230
  FILES: "apps/desktop/src/api-harness-path.ts apps/desktop/src/api-harness-updates.ts apps/desktop/src/api.ts apps/desktop/src/engine-client.ts apps/desktop/src/screens/dashboard/index.tsx apps/desktop/src/screens/first-run/harnesses.ts apps/desktop/src/screens/intake/clone.tsx apps/desktop/src/screens/intake/intake.ts apps/desktop/src/screens/new-project/index.tsx apps/desktop/src/screens/new-project/wizard.ts apps/desktop/src/screens/project/context.tsx apps/desktop/src/screens/project/research.ts apps/desktop/src/screens/settings/add-account.tsx apps/desktop/src/screens/settings/github.tsx apps/desktop/src/screens/settings/harnesses.tsx apps/desktop/src/screens/settings/plugins.tsx apps/desktop/src/screens/settings/profile.tsx apps/desktop/src/screens/settings/sign-in.tsx apps/desktop/src/ui/index.ts apps/desktop/src/ui/keys.ts apps/desktop/test/accounts.test.mjs apps/desktop/test/app.test.mjs apps/desktop/test/first-run-harnesses-words.test.mjs apps/desktop/test/harness-path.test.mjs apps/desktop/test/harness-updates.test.mjs apps/desktop/test/intake.test.mjs apps/desktop/test/new-project.test.mjs apps/desktop/test/no-opaque-failures.test.mjs apps/desktop/test/project-page.test.mjs apps/desktop/test/settings-access-layout.test.mjs apps/desktop/test/settings-harnesses-layout.test.mjs apps/desktop/test/settings-pack-layout.test.mjs apps/desktop/test/settings-plugins.test.mjs apps/desktop/test/settings-setup.test.mjs crates/crazyagent/src/lib.rs crates/crazyagent/src/plugins.rs crates/crazyagent/src/tui/client/settings/tests.rs crates/crazyagent/src/tui/frames/add-provider-120.macos.txt crates/crazyagent/src/tui/frames/add-provider-80.macos.txt crates/crazyagent/src/tui/frames/harnesses-120.macos.txt crates/crazyagent/src/tui/frames/harnesses-120.txt crates/crazyagent/src/tui/frames/home-first-120.txt crates/crazyagent/src/tui/frames/home-first-80.txt crates/crazyagent/src/tui/frames/plugin-add-80.macos.txt crates/crazyagent/src/tui/frames/plugin-add-80.txt crates/crazyagent/src/tui/render_tests.rs crates/crazyagent/src/tui/screens/computer_words_tests.rs crates/crazyagent/src/tui/screens/harness_setup.rs crates/crazyagent/src/tui/screens/home.rs crates/crazyagent/src/tui/screens/home/screen.rs crates/crazyagent/src/tui/screens/mod.rs crates/crazyagent/src/tui/screens/new_project.rs crates/crazyagent/src/tui/screens/new_project_tests.rs crates/crazyagent/src/tui/screens/settings/profile.rs crates/crazyagent/src/tui/screens/settings_accounts.rs crates/crazyagent/src/tui/screens/settings_accounts/tests.rs crates/crazyagent/src/tui/screens/settings_add_account.rs crates/crazyagent/src/tui/screens/settings_add_account/words.rs crates/crazyagent/src/tui/screens/settings_harnesses.rs crates/crazyagent/src/tui/screens/settings_harnesses/words.rs crates/crazyagent/src/tui/screens/settings_plugins.rs crates/crazyagent/src/tui/screens/settings_plugins/words.rs scripts/quality/caps-allow.json "
  RUST_FILES: crates/crazyagent/src/lib.rs crates/crazyagent/src/plugins.rs crates/crazyagent/src/tui/client/settings/tests.rs crates/crazyagent/src/tui/render_tests.rs crates/crazyagent/src/tui/screens/computer_words_tests.rs crates/crazyagent/src/tui/screens/harness_setup.rs crates/crazyagent/src/tui/screens/home.rs crates/crazyagent/src/tui/screens/home/screen.rs crates/crazyagent/src/tui/screens/mod.rs crates/crazyagent/src/tui/screens/new_project.rs crates/crazyagent/src/tui/screens/new_project_tests.rs crates/crazyagent/src/tui/screens/settings/profile.rs crates/crazyagent/src/tui/screens/settings_accounts.rs crates/crazyagent/src/tui/screens/settings_accounts/tests.rs crates/crazyagent/src/tui/screens/settings_add_account.rs crates/crazyagent/src/tui/screens/settings_add_account/words.rs crates/crazyagent/src/tui/screens/settings_harnesses.rs crates/crazyagent/src/tui/screens/settings_harnesses/words.rs crates/crazyagent/src/tui/screens/settings_plugins.rs crates/crazyagent/src/tui/screens/settings_plugins/words.rs
  LINUX_RED_ROWS: >-
    tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on
    tui::screens::computer_words_tests::plugin_and_profile_sentences_name_the_computer_the_build_runs_on
    tui::screens::new_project_tests::a_harness_the_engine_lists_as_cant_run_is_never_ready_the_default_or_picked
    tui::screens::settings_harnesses::tests::harness_list_frames_match_the_design
    tui::screens::settings_plugins::tests::the_server_form_checks_locally_and_hides_secret_values
  MAC_RED_ROWS: >-
    tui::screens::computer_words_tests::account_sentences_name_the_computer_the_build_runs_on
    tui::screens::settings_accounts::tests::add_account_provider_and_method_frames_match_the_design
    tui::client::settings::tests::add_account_offers_one_entry_per_company_and_adds_the_same_engine_accounts
  TIP_ROWS: >-
    tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on
    tui::screens::computer_words_tests::account_sentences_name_the_computer_the_build_runs_on
    tui::screens::computer_words_tests::plugin_and_profile_sentences_name_the_computer_the_build_runs_on
    tui::screens::new_project_tests::a_harness_the_engine_lists_as_cant_run_is_never_ready_the_default_or_picked
    tui::screens::settings_harnesses::tests::harness_list_frames_match_the_design
    tui::screens::settings_plugins::tests::the_server_form_checks_locally_and_hides_secret_values
    tui::screens::settings_accounts::tests::add_account_provider_and_method_frames_match_the_design
    tui::client::settings::tests::add_account_offers_one_entry_per_company_and_adds_the_same_engine_accounts
    tui::render_tests::home_frames_match_the_design
  NODE_RED_FILES: >-
    apps/desktop/test/accounts.test.mjs
    apps/desktop/test/app.test.mjs
    apps/desktop/test/harness-path.test.mjs
    apps/desktop/test/harness-updates.test.mjs
    apps/desktop/test/intake.test.mjs
    apps/desktop/test/new-project.test.mjs
    apps/desktop/test/no-opaque-failures.test.mjs
    apps/desktop/test/project-page.test.mjs
    apps/desktop/test/settings-plugins.test.mjs
    apps/desktop/test/settings-setup.test.mjs
  NODE_TIP_FILES: >-
    apps/desktop/test/first-run-harnesses-words.test.mjs
  BROWSER_FILES: >-
    apps/desktop/test/settings-access-layout.test.mjs
    apps/desktop/test/settings-harnesses-layout.test.mjs
    apps/desktop/test/settings-pack-layout.test.mjs
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -80 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    ignored=$(grep -E '^test result:' "$log" | awk '{i+=$8} END {print i+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed ignored $ignored"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$((passed + ignored))" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red-all)
        [ "$rc" != 0 ] && [ "$failed" = "$listed" ] && [ "$passed" = 0 ] || { echo "::error::$name is not red on every row"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac
  SPLIT_SH: |
    set +e
    set -uo pipefail
    at=$1
    rev=$2
    if [ "$at" = base ]; then
      git checkout "$rev" -- crates apps scripts || exit 1
      git diff --name-only --diff-filter=A "$rev" HEAD^ -- crates apps scripts | while read -r added; do git rm -q -f -- "$added" || exit 1; done || exit 1
      git diff --quiet "$rev" -- crates apps scripts || { echo "::error::the tree is not $rev"; exit 1; }
    fi
    log="$RUNNER_TEMP/screens-$at.log"
    cargo test -p crazyagent --lib --locked -- tui::screens:: > "$log" 2>&1
    rc=$?
    echo "screens $at rc $rc $(grep -E '^test result:' "$log" | tail -n 1)"
    grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$at.txt"
    echo "screens $at FAILED $(wc -l < "$RUNNER_TEMP/failed-$at.txt" | tr -d ' '):"
    cat "$RUNNER_TEMP/failed-$at.txt"
    grep -E -A14 '^---- .* stdout ----$' "$log" | grep -E '^---- |panicked at|want |got  |left:|right:|differs' | head -n 160
    for file in apps/desktop/test/settings-setup.test.mjs apps/desktop/test/settings-access-layout.test.mjs; do
      NODE_TIMEOUT=60000 bash "$RUNNER_TEMP/node.sh" "$at-$(basename "$file" .test.mjs)" pass "$file"
      echo "desktop $at $(basename "$file") rc $?"
    done
    if [ "$at" = base ]; then
      git checkout HEAD^ -- crates apps scripts || exit 1
      git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
    fi
    exit 0
  NODE_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    file=$3
    log="$RUNNER_TEMP/node-$name.log"
    node --test --test-timeout="${NODE_TIMEOUT:-15000}" --test-reporter=spec "$file" > "$log" 2>&1
    rc=$?
    grep -E '✖|✔|ℹ (tests|pass|fail) ' "$log" | head -80 || true
    grep -E -A6 '^  (AssertionError|Error)' "$log" | head -60 || true
    tests=$(grep -E '^ℹ tests ' "$log" | awk '{print $3+0}')
    pass=$(grep -E '^ℹ pass ' "$log" | awk '{print $3+0}')
    fail=$(grep -E '^ℹ fail ' "$log" | awk '{print $3+0}')
    echo "$name expect $expect file $file rc $rc tests ${tests:-0} pass ${pass:-0} fail ${fail:-0}"
    [ "${tests:-0}" -ge 1 ] || { echo "::error::$name ran no test"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "${fail:-1}" = 0 ] && [ "$pass" = "$tests" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red)
        [ "$rc" != 0 ] && [ "${fail:-0}" -ge 1 ] || { echo "::error::$name is not red"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: ON-THIS-MAC-FIX split, every screens row and two desktop rows at the base and the tip on ubuntu-22.04 (report)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='ON-THIS-MAC-FIX tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the ON-THIS-MAC-FIX tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$MOVE" ] || { echo "::error::HEAD~2 is not the move commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED" ] || { echo "::error::HEAD~3 is not the red test commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE" ] || { echo "::error::HEAD~4 is not the CR14-LOCAL-COPY tip"; exit 1; }
          [ "$(git diff --name-only HEAD~4 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ON-THIS-MAC-FIX tip"; exit 1; }
      - name: Write the row runners
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          printf '%s\n' "$NODE_SH" > "$RUNNER_TEMP/node.sh"
          printf '%s\n' "$SPLIT_SH" > "$RUNNER_TEMP/split.sh"
          bash -n "$RUNNER_TEMP/split.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/node.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8  $work/chrome.zip" | shasum -a 256 -c -
          unzip -q "$work/chrome.zip" -d "$work"
          chrome="$work/chrome-linux64/chrome"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Base, every screens row and the two desktop rows at the base (report)
        timeout-minutes: 70
        run: |
          bash "$RUNNER_TEMP/split.sh" base "$BASE"
      - name: Tip, every screens row and the two desktop rows at the tip (report)
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          bash "$RUNNER_TEMP/split.sh" tip HEAD^
      - name: Split, the screens rows failed at the tip only, at both, at the base only (report)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          echo "failed at the tip only:"
          comm -13 "$RUNNER_TEMP/failed-base.txt" "$RUNNER_TEMP/failed-tip.txt"
          echo "failed at both:"
          comm -12 "$RUNNER_TEMP/failed-base.txt" "$RUNNER_TEMP/failed-tip.txt"
          echo "failed at the base only:"
          comm -23 "$RUNNER_TEMP/failed-base.txt" "$RUNNER_TEMP/failed-tip.txt"
