name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "26.12.1"
  TIP_FULL: df3566cc4b593056c25fbba3d0e5a19ac1b9b7e3
  RED_FULL: 1cb0ab7f2bd05b777c7119be5a9e7069155391a2
  BASE_FULL: 04e156b13db19834e7b1e2d496e9b1468aa9ad42
  CHROME_VERSION: "151.0.7922.34"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: WIN-SUBTITLE ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
            chrome: linux64
            chrome_sha256: ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8
            want: "tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on tui::screens::settings_harnesses::tests::harness_list_frames_match_the_design"
            red_failed: "0"
          - os: windows-2022
            leg: win
            cache: Windows
            chrome: ""
            chrome_sha256: ""
            want: "tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on tui::screens::settings_harnesses::windows_tests::the_subtitle_says_to_install_and_update_harnesses_outside_crazyagent tui::screens::settings_harnesses::windows_tests::windows_offers_no_update_in_any_mode"
            red_failed: "2"
          - os: macos-15
            leg: mac
            cache: macOS
            chrome: mac-arm64
            chrome_sha256: 01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef
            want: "tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on tui::screens::settings_harnesses::tests::harness_list_frames_match_the_design"
            red_failed: "0"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip (the fix commit)"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the TICKET-0025 tip 04e156b13d"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ matrix.os != 'windows-2022' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: caps and sleeps ratchets at the base and the tip (expect sleeps rc 0 both; no tip caps problem missing at the base, none naming a ticket file)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          ct=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          st=$?
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL" > /dev/null 2>&1
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs) > "$RUNNER_TEMP/caps-base.txt" 2>&1
          cb=$?
          (cd "$RUNNER_TEMP/base" && node scripts/quality/sleeps.mjs) > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          sb=$?
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-tip.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-tip-files.txt" || true
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-base.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-base-files.txt" || true
          git diff --name-only "$BASE_FULL" HEAD^ | sort > "$RUNNER_TEMP/ticket-files.txt"
          new="$(comm -23 <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-tip.txt" | sort) <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-base.txt" | sort) | grep -c . || true)"
          ticket="$(comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" | grep -c . || true)"
          tail -n 1 "$RUNNER_TEMP/caps-tip.txt"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt"
          tail -n 1 "$RUNNER_TEMP/sleeps-tip.txt"
          comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" || true
          echo "caps rc tip $ct base $cb problems tip $(grep -c . "$RUNNER_TEMP/caps-tip-files.txt") base $(grep -c . "$RUNNER_TEMP/caps-base-files.txt") new-at-tip $new on-ticket-files $ticket sleeps rc tip $st base $sb"
          [ "$st" = 0 ] && [ "$sb" = 0 ] && [ "$ticket" = 0 ] && [ "$new" = 0 ] || exit 1
      - name: rustfmt of crazyagent (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent lib with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'macos-15' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent lib rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: clippy crazyagent lib test target with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'macos-15' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-libtest.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent tests rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: Install the pinned Chrome for Testing
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'windows-2022' }}
        env:
          CHROME_PLATFORM: ${{ matrix.chrome }}
          CHROME_SHA256: ${{ matrix.chrome_sha256 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/$CHROME_PLATFORM/chrome-$CHROME_PLATFORM.zip"
          echo "$CHROME_SHA256  $work/chrome.zip" | shasum -a 256 -c -
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "$work/chrome.zip" "$work"
            chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          else
            unzip -q "$work/chrome.zip" -d "$work"
            chrome="$work/chrome-linux64/chrome"
          fi
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: desktop node, npm ci, tsc, harness-updates rows (per computer purpose row ok) and the harnesses layout Chrome row at the tip (expect rc 0, fail 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'windows-2022' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log" || true
          (cd apps/desktop && npm run --silent typecheck) > "$RUNNER_TEMP/tsc.log" 2>&1
          tc=$?
          grep -E 'error TS' "$RUNNER_TEMP/tsc.log" | head -n 10 || true
          (cd apps/desktop && node --test --test-reporter=tap test/harness-updates.test.mjs) > "$RUNNER_TEMP/hu.log" 2>&1
          hu=$?
          (cd apps/desktop && node --test --test-reporter=tap test/settings-harnesses-layout.test.mjs) > "$RUNNER_TEMP/hl.log" 2>&1
          hl=$?
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/hu.log" || true
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/hl.log" || true
          f1="$(grep -E '^# fail ' "$RUNNER_TEMP/hu.log" | awk '{print $3}' || true)"
          f2="$(grep -E '^# fail ' "$RUNNER_TEMP/hl.log" | awk '{print $3}' || true)"
          row="$(grep -cE "^ok [0-9]+ - the page's purpose line says to install and update harnesses outside CrazyAgent on Windows" "$RUNNER_TEMP/hu.log" || true)"
          echo "node npm rc $ci tsc rc $tc harness-updates rc $hu fail ${f1:-none} purpose-row-ok $row layout rc $hl fail ${f2:-none}"
          [ "$ci" = 0 ] && [ "$tc" = 0 ] && [ "$hu" = 0 ] && [ "$hl" = 0 ] && [ "$f1" = 0 ] && [ "$f2" = 0 ] && [ "$row" = 1 ] || exit 1
      - name: desktop node red, the base harnesses.tsx under the tip rows (expect exactly the purpose row not ok, on its Windows words)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'windows-2022' }}
        timeout-minutes: 10
        run: |
          set +e
          git checkout "$RED_FULL" -- apps/desktop/src/screens/settings/harnesses.tsx
          (cd apps/desktop && node --test --test-reporter=tap test/harness-updates.test.mjs) > "$RUNNER_TEMP/hu-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/screens/settings/harnesses.tsx
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/hu-red.log" || true
          bad="$(grep -cE '^not ok ' "$RUNNER_TEMP/hu-red.log" || true)"
          named="$(grep -cE "^not ok [0-9]+ - the page's purpose line says to install and update harnesses outside CrazyAgent on Windows" "$RUNNER_TEMP/hu-red.log" || true)"
          win="$(grep -cE 'windows: <div' "$RUNNER_TEMP/hu-red.log" || true)"
          echo "node red rc $red not ok $bad named $named windows-words $win"
          [ "$red" != 0 ] && [ "$bad" = 1 ] && [ "$named" = 1 ] && [ "$win" -ge 1 ] || exit 1
      - name: crazyagent rows at the tip by want list (computer words harness row on every leg, the Windows rows on Windows, the harness frames on Unix; expect each wanted row ok, failed 0, crate gate)
        id: tiprows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        env:
          WANT: ${{ matrix.want }}
        run: |
          set +e
          log="$RUNNER_TEMP/rows-tip.log"
          read -r -a want <<< "$WANT"
          cargo test -p crazyagent --lib --locked -- "${want[@]}" > "$log" 2>&1
          c1=$?
          grep -E '^test .* (ok|FAILED)$|panicked at' "$log" | head -n 40 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.}( - should panic)? \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "tip rows rc $c1 failed $failed wanted ${#want[@]} ok $ok gate crazyagent $g1"
          [ "$c1" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "$g1" -ge 1 ] || exit 1
      - name: Red, the base settings_harnesses.rs under the tip rows (expect on Windows exactly the computer words harness row and the subtitle row FAILED; on Unix every wanted row ok, a guard on today's words)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        env:
          WANT: ${{ matrix.want }}
          RED_FAILED: ${{ matrix.red_failed }}
        run: |
          set +e
          git checkout "$RED_FULL" -- crates/crazyagent/src/tui/screens/settings_harnesses.rs
          git diff --cached --stat HEAD^ | tail -n 1
          sleep 2
          touch crates/crazyagent/src/tui/screens/settings_harnesses.rs
          log="$RUNNER_TEMP/rows-red.log"
          read -r -a want <<< "$WANT"
          cargo test -p crazyagent --lib --locked -- "${want[@]}" > "$log" 2>&1
          c1=$?
          grep -E '^test .* (ok|FAILED)$|^error(\[|:)' "$log" | head -n 20 || true
          bad="$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)"
          ok="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
          cw="$(grep -cE '^test tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on \.\.\. FAILED$' "$log" || true)"
          sub="$(grep -cE '^test tui::screens::settings_harnesses::windows_tests::the_subtitle_says_to_install_and_update_harnesses_outside_crazyagent \.\.\. FAILED$' "$log" || true)"
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "red rows rc $c1 failed-rows $bad want-failed $RED_FAILED cw-FAILED $cw subtitle-FAILED $sub ok $ok of ${#want[@]} gate crazyagent $g1"
          [ "$bad" = "$RED_FAILED" ] && [ "$ok" = "$(( ${#want[@]} - RED_FAILED ))" ] && [ "$g1" -ge 1 ] || exit 1
          if [ "$RED_FAILED" = 0 ]; then [ "$c1" = 0 ]; else [ "$c1" != 0 ] && [ "$cw" = 1 ] && [ "$sub" = 1 ]; fi || exit 1
