  macos:
    name: Batch b13 r2 rows on macos-15
    runs-on: macos-15
    timeout-minutes: 330
    env:
      FARM_OS: macos-15
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash --version | head -n 1
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Build the engine lib tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: RV-T7R2R4-F1 kernel storage restore rows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b13r2-storage-restore plain - -p crazyagent-kernel-storage --locked -- restore::
      - name: RV-T7R2R4-F1, T7r-2 engine lib restore rows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 150
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b13r2-lib-restore plain - -p crazyagent --lib --locked -- restore:: setup_restore_tests:: restore_recovery:: settings::restore::
      - name: engine restore_broken_start
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b13r2-test-restore-broken-start plain - -p crazyagent --locked --test restore_broken_start --
      - name: engine restore_not_resent
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b13r2-test-restore-not-resent plain - -p crazyagent --locked --test restore_not_resent --
      - name: engine golden_upgrade_restore
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b13r2-test-golden-upgrade-restore plain - -p crazyagent --locked --test golden_upgrade_restore --
      - name: Base rerun of the red rows at chore/v250 2b07be91f, cold base build first, about 50 min on macOS
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          bash "$RUNNER_TEMP/rows.sh" base
      - name: Rows and NEW versus BASE
        if: ${{ always() }}
        run: |
          bash "$RUNNER_TEMP/rows.sh" summary

  windows-clippy:
    name: Batch b13 r2 clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      FARM_OS: windows-2022
      BASE_PREP: cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked && cp "$CARGO_TARGET_DIR/debug/crazyagent-win-boundary.exe" "$CARGO_TARGET_DIR/debug/deps/crazyagent-win-boundary.exe"; mkdir -p apps/desktop/dist; printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the Windows boundary helper
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Write the stub frontend the desktop crate embeds
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
      - name: Clippy per crate, lib and tests, deny warnings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 240
        run: |
          set +e
          worst=0
          for p in crazyagent crazyagent-kernel-common crazyagent-kernel-security crazyagent-kernel-storage crazyagent-kernel-processes crazyagent-kernel-sandbox crazyagent-kernel-plugin-host crazyagent-bus-gateway crazyagent-capgen crazyagent-sdk crazyagent-sdk-host crazyagent-desktop; do
            log="$RUNNER_TEMP/clippy-$p.log"
            cargo clippy -p "$p" --lib --tests --locked -- -D warnings > "$log" 2>&1
            rc=$?
            echo "clippy $FARM_OS $p rc=$rc"
            echo "$FARM_OS $p rc=$rc" >> "$RUNNER_TEMP/clippy.txt"
            if [ "$rc" -ne 0 ]; then
              worst=1
              grep -E -A 8 '^(error|warning)(\[[A-Za-z0-9_:]+\])?:' "$log" | head -n 120
            fi
          done
          echo "clippy summary on $FARM_OS:"
          cat "$RUNNER_TEMP/clippy.txt"
          exit "$worst"
