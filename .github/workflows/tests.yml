name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  MERGE_FULL: 4ca0deeb28c77b987dd2ee7f9ea94f3e15552bba
  TIP_FULL: aea14cb25cab3c9e7376a85093e81b95455cb15e
  CHORE_FULL: c6f139883806b94c9f7e3ea9d8c5ee3529081ea8
  BASE_FULL: 5cc35d1b01
  WANT: "storage::migrations::tests::pins::restore::a_plugin_key_only_an_older_replaced_copy_names_stays_after_a_later_restore storage::migrations::tests::pins::restore::a_replaced_link_naming_a_key_does_not_keep_it storage::migrations::tests::pins::restore::an_account_key_only_an_older_replaced_copy_names_stays_after_a_later_restore storage::migrations::tests::pins::restore::an_unlisted_backups_folder_keeps_every_key app_plugins::host_tests::a_harness_yaml_error_keeps_its_sentence app_plugins::host_tests::the_engine_key_store_backs_the_plugin_host app_plugins::host_tests::the_start_sweep_removes_only_unreferenced_plugin_key_files app_plugins::host_tests::on_linux_the_adapter_passes_the_handed_out_range app_plugins::host_tests::the_handshake_flags_are_unchanged app_plugins::host_tests::the_owner_read_lists_plugin_grants app_plugins::host_tests::a_key_a_kept_replaced_copy_names_survives_the_start_sweep app_plugins::host_tests::an_unreadable_replaced_copy_keeps_every_plugin_key"

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: RESTORE2 r2 merged tip on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the merged tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %P %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$MERGE_FULL" ] || { echo "::error::the parent is not the merged tip"; exit 1; }
          [ "$(git rev-parse HEAD^^1)" = "$TIP_FULL" ] || { echo "::error::the merge's first parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD^^2)" = "$CHORE_FULL" ] || { echo "::error::the merge's second parent is not chore/v250 c6f1398838"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~8)" = "$BASE_FULL" ] || { echo "::error::HEAD~8 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merged tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from chore newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the two crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-storage -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel-storage and crazyagent with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-storage -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings gates crazyagent-kernel-storage $g0 crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: crazyagent rows by want list, 4 pins restore and 8 host_tests (expect 12 wanted rows ok, failed 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- --test-threads=1 storage::migrations::tests::pins::restore:: app_plugins::host_tests:: > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          read -r -a want <<< "$WANT"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.}( - should panic)? \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "rows rc $code passed $passed failed $failed wanted ${#want[@]} ok $ok gates crazyagent $g0"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "${#want[@]}" = 12 ] && [ "$g0" -ge 1 ] || exit 1

  windows:
    name: RESTORE2 r2 merged tip crazyagent clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the merged tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$MERGE_FULL" ] || { echo "::error::the parent is not the merged tip"; exit 1; }
          [ "$(git rev-parse HEAD^^1)" = "$TIP_FULL" ] || { echo "::error::the merge's first parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD^^2)" = "$CHORE_FULL" ] || { echo "::error::the merge's second parent is not chore/v250 c6f1398838"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merged tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from chore newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy windows-2022 rc $code errors $errors warnings $warnings gates crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
