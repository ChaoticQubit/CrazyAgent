name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-2022
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Windows clippy on the engine and the boundary crate
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent -p crazyagent-win-sandbox --all-targets --locked --keep-going -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy-windows.txt"
          rc=${PIPESTATUS[0]}
          printf '| check | exit |\n| --- | --- |\n| Windows clippy -p crazyagent -p crazyagent-win-sandbox --all-targets -D warnings | %s |\n' "$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-clippy-windows
          path: ${{ runner.temp }}/clippy-windows.txt
          if-no-files-found: warn
          retention-days: 14

  pwsh-row:
    name: The Windows PowerShell server row from the archive on ${{ matrix.runner }}
    needs: build-windows
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: farm-archive-windows
          path: ${{ runner.temp }}/archive
      - name: The row must pass with the fix
        run: |
          set -uo pipefail
          if [ -n "${PSModuleAnalysisCachePath:-}" ]; then cache=set; else cache=unset; fi
          cargo nextest run --archive-file "$RUNNER_TEMP/archive/farm-windows.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --no-tests=fail --no-capture -E 'test(=plugins::check::windows_tests::a_windows_powershell_server_answers_its_check_within_the_check_time)' 2>&1 | tee "$RUNNER_TEMP/pwsh-row.txt"
          rc=${PIPESTATUS[0]}
          printf '| run | PSModuleAnalysisCachePath | exit |\n| --- | --- | --- |\n| %s row | %s | %s |\n' "${{ matrix.runner }}" "$cache" "$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-pwsh-row-${{ matrix.runner }}
          path: ${{ runner.temp }}/pwsh-row.txt
          if-no-files-found: warn
          retention-days: 14

  pwsh-red:
    name: The row fails at its CHECK_TIME run without PSModuleAnalysisCachePath kept, on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Red patch, then the row must fail at its CHECK_TIME run after its control passed
        run: bash .github/farm/pwsh-cache-red.sh
