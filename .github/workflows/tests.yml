name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  KERNEL: crazyagent-kernel-processes
  RED_F1: "install::tests::a_system_package_name_a_manager_reads_as_a_version_or_pattern_is_refused"
  RED_F2A: "tests::the_crates_own_default_feature_turning_test_support_on_is_caught"
  RED_F2B: "tests::a_workspace_alias_turning_test_support_on_in_a_member_is_caught"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: b21 lows on macos-15 at ${{ matrix.side }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        side: [tip, red]
    timeout-minutes: 170
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 7
      - name: Restore the branch tip's tests.yml under the farm one, and on the red side the two red commits' files
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -6 --format='%H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = 2d4b173e44f60e2b6685dc8064e0f37b0e3d4169 ] || { echo "::error::the parent is not the tip 2d4b173e44"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = bb3e9d0f14fb35bee01c7e1e1b67b83f5044e1db ] || { echo "::error::HEAD~3 is not the F2 red commit bb3e9d0f14"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = cb6080f8043f3b7d424155dbb3075a82d3df6692 ] || { echo "::error::HEAD~5 is not the F1 red commit cb6080f804"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit touches more than tests.yml"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
          if [ "${{ matrix.side }}" = red ]; then
            git checkout HEAD~5 -- crates/kernel/processes/src/install.rs
            git checkout HEAD~3 -- crates/kernel/processes/src/tests.rs
            [ "$(git diff --name-only HEAD^ | sort | tr '\n' ' ')" = "crates/kernel/processes/src/install.rs crates/kernel/processes/src/tests.rs " ] || { echo "::error::the red tree differs from the tip in more than the two fix files"; exit 1; }
            git diff --quiet HEAD~5 -- crates/kernel/processes/src/install.rs crates/kernel/processes/src/install/tests.rs || { echo "::error::install files are not the F1 red commit's"; exit 1; }
            git diff --quiet HEAD~3 -- crates/kernel/processes/src/tests.rs || { echo "::error::tests.rs is not the F2 red commit's"; exit 1; }
            echo "side red: install.rs at cb6080f804, kernel tests.rs at bb3e9d0f14"
          fi
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: clippy on the kernel processes crate and the engine crate, lib and tests, at the tip (expect rc 0, 0 warning or error lines each)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 120
        run: |
          set +e
          worst=0
          for crate in "$KERNEL" crazyagent; do
            log="$RUNNER_TEMP/clippy-$crate.log"
            cargo clippy -p "$crate" --lib --tests --locked -- -D warnings > "$log" 2>&1
            code=$?
            grep -E '^(warning|error)(\[|:)|^ +--> ' "$log" | head -n 80 || true
            tail -n 3 "$log"
            lines="$(grep -cE '^(warning|error)(\[|:)' "$log" || true)"
            built="$(grep -cE "^ +(Checking|Compiling) $crate v" "$log" || true)"
            echo "clippy $crate rc $code warning-or-error lines $lines $crate built $built"
            [ "$built" -gt 0 ] || { echo "::error::clippy never built $crate (a restored target read as fresh)"; worst=1; }
            [ "$code" = 0 ] && [ "$lines" = 0 ] || worst=1
          done
          exit "$worst"
      - name: kernel rows (tip expects all passed; red expects exactly the three red rows FAILED)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/kernel.log"
          cargo test -p "$KERNEL" --lib --locked -- install::tests:: test_support --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          named=0
          for row in "$RED_F1" "$RED_F2A" "$RED_F2B"; do
            n="$(grep -cxF "$row: test" "$log.list" || true)"
            echo "listed $row: $n"
            [ "$n" = 1 ] && named=$((named + 1))
          done
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p "$KERNEL" --lib --locked -- install::tests:: test_support > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          reds=0
          for row in "$RED_F1" "$RED_F2A" "$RED_F2B"; do
            n="$(grep -cxF "test $row ... FAILED" "$log" || true)"
            echo "failed $row: $n"
            reds=$((reds + n))
          done
          built="$(cat "$log.list" "$log" | grep -cE "^ +(Checking|Compiling) $KERNEL v" || true)"
          echo "kernel rows side ${{ matrix.side }} rc $code listed $listed named $named passed $passed failed $failed red rows failed $reds $KERNEL built $built"
          [ "$built" -gt 0 ] || { echo "::error::the row build never built $KERNEL (a restored target read as fresh)"; exit 1; }
          [ "$named" = 3 ] || exit 1
          if [ "${{ matrix.side }}" = tip ]; then
            [ "$code" = 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1
          else
            [ "$failed" = 3 ] && [ "$reds" = 3 ] && [ "$passed" = $((listed - 3)) ] || exit 1
          fi
      - name: engine update rows at the tip (expect all passed, the desktop install row listed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/update.log"
          cargo test -p crazyagent --lib --locked -- update::tests:: --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          desktop="$(grep -cxF 'update::tests::no_install_path_skips_verification: test' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- update::tests:: > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          built="$(cat "$log.list" "$log" | grep -cE '^ +(Checking|Compiling) crazyagent v' || true)"
          echo "update rows rc $code listed $listed desktop row $desktop passed $passed failed $failed crazyagent built $built"
          [ "$built" -gt 0 ] || { echo "::error::the row build never built crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$code" = 0 ] && [ "$desktop" = 1 ] && [ "$listed" -gt 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1
