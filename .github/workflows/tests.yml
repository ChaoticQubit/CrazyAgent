name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  NEW: 298cba2a5afac7645dbc22bddd6f7efc0afdaefb
  OLD: 4b84dad66786c1c154358305da27ed9fc6fd182c
  BEFORE: 9a4c16a63d5ecf1bfb5d35495bbd39ed720c9b78
  NEW_CODE: 1f4218cd032a6364c6018af2fb7167fd3dec3508
  OLD_CODE: 8d1b20dfbf24bf1a0d65b6fa0a4490fd0c7ba064
  BEFORE_CODE: b4f2e713598d8d6dfb970100200c983e4366976b
  BLOCKS: "2"
  AA_RUNS: "4"
  ROWS: "9"

defaults:
  run:
    shell: bash

jobs:
  sitting:
    name: DEC-211 farm sitting ENTRIES-CAP A, 2.5 A tip 1f4218cd03 vs the chore b36 tip b4f2e71359 (A-only) vs 2.4.4 twin 8d1b20dfbf (each + perf rows), quiet then loaded, ABCCBA + A/A
    runs-on: macos-15
    timeout-minutes: 355
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Check the three parents and lay out the three trees
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          for v in NEW OLD BEFORE NEW_CODE OLD_CODE BEFORE_CODE; do
            printf '%s' "${!v}" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::$v is not a 40-hex sha"; exit 1; }
          done
          [ "$(git rev-parse HEAD^1)" = "$NEW" ] || { echo "::error::the first parent is not the 2.5 commit"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$OLD" ] || { echo "::error::the second parent is not the 2.4.4 twin"; exit 1; }
          [ "$(git rev-parse HEAD^3)" = "$BEFORE" ] || { echo "::error::the third parent is not the b36 tip perf commit"; exit 1; }
          for pair in "$NEW:$NEW_CODE" "$OLD:$OLD_CODE" "$BEFORE:$BEFORE_CODE"; do
            [ "$(git rev-parse "${pair%%:*}^")" = "${pair#*:}" ] || { echo "::error::${pair%%:*} is not one commit on ${pair#*:}"; exit 1; }
          done
          [ "$(git diff --name-only HEAD^1 HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit changes more than tests.yml"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the 2.5 commit"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/old" "$OLD"
          [ "$(git -C "$RUNNER_TEMP/old" rev-parse HEAD)" = "$OLD" ] || { echo "::error::the twin tree is not the twin commit"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/before" "$BEFORE"
          [ "$(git -C "$RUNNER_TEMP/before" rev-parse HEAD)" = "$BEFORE" ] || { echo "::error::the before tree is not the b36 tip perf commit"; exit 1; }
          echo "NEW_DIR=$PWD" >> "$GITHUB_ENV"
          echo "OLD_DIR=$RUNNER_TEMP/old" >> "$GITHUB_ENV"
          echo "BEFORE_DIR=$RUNNER_TEMP/before" >> "$GITHUB_ENV"
      - name: Record the runner
        run: |
          set -euo pipefail
          echo "RUNNER image=${ImageOS:-unknown} version=${ImageVersion:-unknown} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT new=$NEW old=$OLD before=$BEFORE"
          echo "RUNNER $(sw_vers -productVersion) $(uname -m) cpu=$(sysctl -n machdep.cpu.brand_string) ncpu=$(sysctl -n hw.ncpu) mem_gb=$(( $(sysctl -n hw.memsize) / 1073741824 )) load=$(sysctl -n vm.loadavg)"
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Write the sitting scripts
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scope.sh" <<'EOF'
          set -u
          if [ "$1" = 2.4.4 ]; then echo "crazyagent perf_tests::sandbox"; else echo "crazyagent-kernel-sandbox perf_tests"; echo "crazyagent perf_tests::guard::"; fi
          EOF
          cat > "$RUNNER_TEMP/measure.sh" <<'EOF'
          set -u
          build=$1 label=$2 condition=$3 block=$4
          case "$build" in 2.5) dir=$NEW_DIR commit=$NEW ;; before) dir=$BEFORE_DIR commit=$BEFORE ;; *) dir=$OLD_DIR commit=$OLD ;; esac
          start=$(sysctl -n vm.loadavg | awk '{print $2}')
          echo "PERF-RUN build=$build label=$label commit=${commit:0:10} condition=$condition block=$block load1=$start date=$(date -u +%Y-%m-%dT%H:%M:%S)"
          rc=0
          while read -r package filter; do
            (cd "$dir" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$build" cargo test --release --locked -p "$package" --lib "$filter" -- --ignored --nocapture --test-threads=1 2>&1) | sed -E 's/^test [^ ]+ \.\.\. (PERF )/\1/'
            one=${PIPESTATUS[0]}
            [ "$one" = 0 ] || rc=$one
          done < <(bash "$RUNNER_TEMP/scope.sh" "$build")
          echo "PERF-RUN-END build=$build label=$label rc=$rc load1_start=$start load1_end=$(sysctl -n vm.loadavg | awk '{print $2}') date=$(date -u +%Y-%m-%dT%H:%M:%S)"
          EOF
          cat > "$RUNNER_TEMP/sitting.sh" <<'EOF'
          set -u
          condition=$1
          log="$RUNNER_TEMP/$condition.log"
          : > "$log"
          bash "$RUNNER_TEMP/measure.sh" 2.5 A "$condition" warmup > "$RUNNER_TEMP/$condition-warmup-2.5.out"
          bash "$RUNNER_TEMP/measure.sh" 2.4.4 B "$condition" warmup > "$RUNNER_TEMP/$condition-warmup-2.4.4.out"
          bash "$RUNNER_TEMP/measure.sh" before C "$condition" warmup > "$RUNNER_TEMP/$condition-warmup-before.out"
          for block in $(seq 1 "$BLOCKS"); do
            for build in 2.5 2.4.4 before before 2.4.4 2.5; do
              case "$build" in 2.5) label=A ;; 2.4.4) label=B ;; *) label=C ;; esac
              bash "$RUNNER_TEMP/measure.sh" "$build" "$label" "$condition" "$block" >> "$log"
            done
          done
          for label in A1 A2 A2 A1; do
            bash "$RUNNER_TEMP/measure.sh" 2.5 "$label" "$condition" aa >> "$log"
          done
          echo "SITTING $condition runs=$(grep -c '^PERF-RUN ' "$log") rows=$(grep -c '^PERF ' "$log") failed_runs=$(grep -E '^PERF-RUN-END' "$log" | grep -vc ' rc=0 ' || true)"
          EOF
          cat > "$RUNNER_TEMP/ratios.py" <<'EOF'
          import re, statistics, sys

          UNIT_NS = {"p50_ns": 1, "p50": 1000}
          P95_OF = {"p50_ns": "p95_ns", "p50": "p95"}


          def parse(log):
              """Reads a sitting log into runs, every row's p50 and p95 in ns whatever unit perf_kit
              printed. Input: the log path. Output: a list of runs, each a dict with build, label,
              block, the p50 rows and the p95 rows as {(module, name): ns} and the units seen.
              """
              runs = []
              for line in open(log, errors="replace"):
                  head = re.match(r"PERF-RUN build=(\S+) label=(\S+) .* block=(\S+) load1=(\S+)", line)
                  if head:
                      runs.append({"build": head.group(1), "label": head.group(2), "block": head.group(3), "rows": {}, "p95": {}, "units": {}})
                      continue
                  row = re.match(r"PERF \d+ (\S+) (\S+) (p50_ns|p50)=(\d+) (p95_ns|p95)=(\d+)", line)
                  if row and runs:
                      key = (row.group(1), row.group(2))
                      runs[-1]["rows"][key] = int(row.group(4)) * UNIT_NS[row.group(3)]
                      assert row.group(5) == P95_OF[row.group(3)], line
                      runs[-1]["p95"][key] = int(row.group(6)) * UNIT_NS[row.group(3)]
                      runs[-1]["units"][key] = row.group(3)
              for run in runs:
                  assert set(run["rows"]) == set(run["units"]) == set(run["p95"])
              return runs


          def median(runs, build=None, block=None, label=None, field="rows"):
              """Takes the median ns per row over the runs that match. Inputs: the runs, the build,
              block and label to keep (none for any) and the field, p50 rows or p95. Output:
              {(module, name): median ns}."""
              out = {}
              for r in runs:
                  if build and r["build"] != build:
                      continue
                  if block and r["block"] != block:
                      continue
                  if label and r["label"] != label:
                      continue
                  for key, value in r[field].items():
                      out.setdefault(key, []).append(value)
              return {key: statistics.median(values) for key, values in out.items()}


          def report(runs, new="2.5", old="2.4.4", aa=None):
              """Builds the RATIOS lines, every value in ns, a row SLOWER only when the new build is
              slower in every scored block. Inputs: the parsed runs, the new and old build names and
              the build of an A/A copy of the new build timed inside the blocks, if any; with none
              the A/A gap reads the aa block's A1 and A2 runs. Output: the lines and the slower count."""
              assert new != old and aa not in (new, old)
              blocks = sorted({r["block"] for r in runs if r["block"] not in ("aa", "warmup")})
              scored = [r for r in runs if r["block"] in blocks]
              new_all, old_all = median(scored, new), median(scored, old)
              new_95, old_95 = median(scored, new, field="p95"), median(scored, old, field="p95")
              per_block = {b: (median(runs, new, b), median(runs, old, b)) for b in blocks}
              if aa is None:
                  a1, a2 = median(runs, new, "aa", "A1"), median(runs, new, "aa", "A2")
              else:
                  a1, a2 = new_all, median(scored, aa)
              units = {}
              for r in runs:
                  for key, unit in r["units"].items():
                      units.setdefault(key, set()).add(unit)
              lines = [f"RATIOS unit=ns runs={len(runs)} scored={len(scored)} blocks={','.join(blocks)}"]
              slower = 0
              for key in sorted(set(new_all) | set(old_all)):
                  n, o = new_all.get(key), old_all.get(key)
                  cells = []
                  for b in blocks:
                      bn, bo = per_block[b][0].get(key), per_block[b][1].get(key)
                      verdict = "-" if bn is None or bo is None else ("slow" if bn > bo else "fast" if bn < bo else "eq")
                      cells.append(f"B{b}{verdict} {bn}/{bo}")
                  gap = f"{a2[key] / a1[key]:.2f}" if a1.get(key) and key in a2 else "-"
                  ratio = "-" if n is None or not o else f"{n / o:.2f}"
                  n95, o95 = new_95.get(key), old_95.get(key)
                  ratio95 = "-" if n95 is None or not o95 else f"{n95 / o95:.2f}"
                  flag = ""
                  if cells and all(c.split(" ")[0].endswith("slow") for c in cells):
                      flag = " SLOWER"
                      slower += 1
                  mixed = " units=" + "+".join(sorted(units[key])) if len(units[key]) > 1 else ""
                  lines.append(f"ROW {'.'.join(key)} {new}={n}ns {old}={o}ns ratio={ratio} p95 {new}={n95}ns {old}={o95}ns p95_ratio={ratio95} {' | '.join(cells)} aa_gap={gap}{flag}{mixed}")
              lines.append(f"SLOWER-ROWS {slower}")
              return lines, slower


          def arguments(words):
              """Reads the command line: the log, then `--pair NEW,OLD` and `--aa BUILD`, each at most
              once. Input: the words after the script. Output: the log and the report keywords."""
              log, options = words[0], {}
              rest = words[1:]
              while rest:
                  flag, value, rest = rest[0], rest[1], rest[2:]
                  assert flag in ("--pair", "--aa") and flag not in options, flag
                  options[flag] = value
              keywords = {}
              if "--pair" in options:
                  keywords["new"], keywords["old"] = options["--pair"].split(",")
              if "--aa" in options:
                  keywords["aa"] = options["--aa"]
              return log, keywords


          if __name__ == "__main__":
              log, keywords = arguments(sys.argv[1:])
              for line in report(parse(log), **keywords)[0]:
                  print(line)
          EOF
          for f in scope measure sitting; do bash -n "$RUNNER_TEMP/$f.sh"; done
          python3 -I -m py_compile "$RUNNER_TEMP/ratios.py"
          cat > "$RUNNER_TEMP/gate.py" <<'EOF'
          import re, sys

          cond, before, old = sys.argv[1:4]


          def rows(path):
              """Reads the ROW lines of one ratios output. Input: its path. Output: name -> fields."""
              out = {}
              for line in open(path):
                  if line.startswith("ROW "):
                      out[line.split()[1]] = dict(re.findall(r"\b(ratio|p95_ratio|aa_gap)=(\S+)", line))
              return out


          def num(text):
              """A ratio field as a number, None for a missing one. Input: the text. Output: the value."""
              return None if text in (None, "-") else float(text)


          b, o = rows(before), rows(old)
          k = [n for n in b if n.endswith(".extra_paths.checked_all")]
          g = [n for n in o if n.endswith(".profile.guard_engine_launch")]
          assert len(k) == 1 and len(g) == 1, (k, g)
          r = b[k[0]]
          ratio, p95, gap = num(r.get("ratio")), num(r.get("p95_ratio")), num(r.get("aa_gap"))
          band = abs(gap - 1) if gap else 0.0
          ok = ratio is not None and p95 is not None and ratio <= 1 + band and p95 <= 1 + band
          print(f"GATE {cond} checked_all 2.5/before p50_ratio={ratio} p95_ratio={p95} aa_gap={gap} band=+{band:.2f} {'WITHIN' if ok else 'OUTSIDE'}")
          lb = [n for n in b if n.endswith(".profile.guard_engine_launch")]
          assert len(lb) == 1, lb
          r = b[lb[0]]
          ratio, p95, gap = num(r.get("ratio")), num(r.get("p95_ratio")), num(r.get("aa_gap"))
          band = abs(gap - 1) if gap else 0.0
          ok = ratio is not None and p95 is not None and ratio <= 1 + band and p95 <= 1 + band
          print(f"GATE {cond} guard_engine_launch 2.5/before p50_ratio={ratio} p95_ratio={p95} aa_gap={gap} band=+{band:.2f} {'WITHIN' if ok else 'OUTSIDE'}")
          r = o[g[0]]
          ratio, p95 = num(r.get("ratio")), num(r.get("p95_ratio"))
          ok = ratio is not None and p95 is not None and ratio <= 1.0 and p95 <= 1.0
          print(f"GATE {cond} guard_engine_launch 2.5/2.4.4 p50_ratio={ratio} p95_ratio={p95} {'PASS' if ok else 'FAIL'}")
          EOF
          for build in 2.5 before 2.4.4; do echo "SCOPE $build $(bash "$RUNNER_TEMP/scope.sh" "$build" | tr '\n' ';')"; done
      - name: Fetch the locked crates for both trees
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          (cd "$OLD_DIR" && cargo fetch --locked)
          (cd "$BEFORE_DIR" && cargo fetch --locked)
      - name: Build the three bench binaries (release, one tree at a time; before starts from a clone of the 2.5 target)
        timeout-minutes: 160
        run: |
          set +e
          set -uo pipefail
          for build in 2.5 before 2.4.4; do
            case "$build" in 2.5) dir=$NEW_DIR ;; before) dir=$BEFORE_DIR ;; *) dir=$OLD_DIR ;; esac
            if [ "$build" = before ]; then cp -cR "$RUNNER_TEMP/target-2.5" "$RUNNER_TEMP/target-before"; fi
            total=0
            while read -r package filter; do
              (cd "$dir" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$build" cargo test --release --locked -p "$package" --lib --no-run) > "$RUNNER_TEMP/build-$build-$package.log" 2>&1
              rc=$?
              grep -E '^(error|warning)(\[|:)|^ +--> ' "$RUNNER_TEMP/build-$build-$package.log" | head -n 60 || true
              tail -n 5 "$RUNNER_TEMP/build-$build-$package.log"
              echo "BUILD $build $package rc $rc compiled $(grep -cE '^ +Compiling ' "$RUNNER_TEMP/build-$build-$package.log") gate $(grep -cE "^ +Compiling $package v" "$RUNNER_TEMP/build-$build-$package.log" || true)"
              [ "$rc" = 0 ] || { echo "::error::the $build $package bench binaries did not build"; exit 1; }
              listed=$(cd "$dir" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$build" cargo test --release --locked -p "$package" --lib "$filter" -- --ignored --list 2>/dev/null | grep -c ': test$' || true)
              echo "LISTED $build $package $filter $listed"
              total=$((total + listed))
            done < <(bash "$RUNNER_TEMP/scope.sh" "$build")
            echo "LISTED-TOTAL $build $total of $ROWS"
            [ "$total" = "$ROWS" ] || { echo "::error::the $build side lists $total perf rows, not $ROWS"; exit 1; }
          done
      - name: Quiet sitting (the runner alone)
        timeout-minutes: 75
        run: |
          set -uo pipefail
          echo "QUIET-START load=$(sysctl -n vm.loadavg)"
          bash "$RUNNER_TEMP/sitting.sh" quiet
          echo "QUIET-END load=$(sysctl -n vm.loadavg)"
          grep -E '^PERF-RUN-END' "$RUNNER_TEMP/quiet.log"
      - name: Loaded sitting (the same runner with a parallel cargo build of the workspace)
        timeout-minutes: 120
        run: |
          set -uo pipefail
          stop="$RUNNER_TEMP/load.stop"
          rm -f "$stop"
          set -m
          (
            n=0
            while [ ! -e "$stop" ]; do
              n=$((n + 1))
              (cd "$NEW_DIR" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-load" cargo build --workspace --locked --exclude crazyagent-desktop) > "$RUNNER_TEMP/load-$n.log" 2>&1
              echo "LOAD-BUILD $n rc $? $(date -u +%H:%M:%S)" >> "$RUNNER_TEMP/load.log"
              rm -rf "$RUNNER_TEMP/target-load"
            done
          ) &
          loader=$!
          set +m
          sleep 90
          echo "LOADED-START load=$(sysctl -n vm.loadavg)"
          bash "$RUNNER_TEMP/sitting.sh" loaded
          echo "LOADED-END load=$(sysctl -n vm.loadavg)"
          touch "$stop"
          kill -TERM -- "-$loader" 2>/dev/null || true
          wait "$loader" || true
          cat "$RUNNER_TEMP/load.log" 2>/dev/null || true
          echo "LOAD-STOPPED builds_finished=$(grep -c '^LOAD-BUILD' "$RUNNER_TEMP/load.log" 2>/dev/null || echo 0) builds_started=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'load-*.log' | wc -l | tr -d ' ')"
          [ "$(find "$RUNNER_TEMP" -maxdepth 1 -name 'load-*.log' | wc -l | tr -d ' ')" -ge 1 ] || { echo "::error::the loader never ran"; exit 1; }
          grep -E '^PERF-RUN-END' "$RUNNER_TEMP/loaded.log"
      - name: Ratios per row, per block, with the A/A gap
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for condition in quiet loaded; do
            [ -f "$RUNNER_TEMP/$condition.log" ] || { echo "NO $condition log"; continue; }
            echo "== $condition (image ${ImageOS:-unknown} ${ImageVersion:-unknown}, run $GITHUB_RUN_ID, 2.5 ${NEW:0:10}, before ${BEFORE:0:10}, 2.4.4 ${OLD:0:10})"
            echo "-- 2.5 vs 2.4.4"
            python3 -I "$RUNNER_TEMP/ratios.py" "$RUNNER_TEMP/$condition.log" | tee "$RUNNER_TEMP/$condition-old.ratios"
            echo "-- 2.5 vs before (b36 tip, A-only)"
            python3 -I "$RUNNER_TEMP/ratios.py" "$RUNNER_TEMP/$condition.log" --pair 2.5,before | tee "$RUNNER_TEMP/$condition-before.ratios"
            python3 -I "$RUNNER_TEMP/gate.py" "$condition" "$RUNNER_TEMP/$condition-before.ratios" "$RUNNER_TEMP/$condition-old.ratios"
            grep -E '^PERF-RUN-END' "$RUNNER_TEMP/$condition.log" | awk '{print "LOAD1 " $2 " " $3 " " $5 " " $6}'
          done
      - name: Keep the raw sitting logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sitting-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quiet.log
            ${{ runner.temp }}/loaded.log
            ${{ runner.temp }}/load.log
            ${{ runner.temp }}/*-warmup-*.out
          retention-days: 14
