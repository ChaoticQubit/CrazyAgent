name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  UV_VERSION: "0.13.5"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  linux-clippy:
    name: Batch b24 FINAL clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      FARM_OS: ubuntu-22.04
      BASE_PREP: cargo build -p crazyagent --bin crazyagent-landlock --locked
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Install tmux from the pinned source build into a root-owned folder
        timeout-minutes: 30
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          if dpkg -s tmux >/dev/null 2>&1; then sudo apt-get remove -y tmux; fi
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target x86_64-unknown-linux-gnu --work "$work/build" --out "$work/tmux"
          clean() {
            local p="$1"
            while :; do
              [ -e "$p" ] || return 1
              stat -c '%A %U:%G %n' "$p"
              [ -z "$(find "$p" -maxdepth 0 -perm /022)" ] || return 1
              [ "$(stat -c %u "$p")" = 0 ] || return 1
              [ "$p" = / ] && return 0
              p=$(dirname "$p")
            done
          }
          dir=""
          for root in /usr/lib /usr/libexec /srv; do
            if clean "$root"; then dir="$root/farm-tools/bin"; break; fi
            echo "$root has a group or world writable or foreign-owned hop"
          done
          [ -n "$dir" ] || { echo "::error::no root-owned folder without a writable hop"; exit 1; }
          sudo install -d -m 0755 -o root -g root "$(dirname "$dir")" "$dir"
          sudo install -m 0755 -o root -g root "$work/tmux" "$dir/tmux"
          clean "$dir/tmux" || { echo "::error::$dir/tmux has a group or world writable or foreign-owned hop"; exit 1; }
          [ ! -e /usr/local/bin/tmux ] || { echo "::error::/usr/local/bin/tmux exists"; exit 1; }
          echo "$dir" >> "$GITHUB_PATH"
          echo "FARM_TMUX_DIR=$dir" >> "$GITHUB_ENV"
          test "$("$dir/tmux" -V)" = "tmux $TMUX_VERSION"
      - name: Install uv at the pinned version
        run: |
          set -euo pipefail
          python3 -m pip install --user "uv==$UV_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.local/bin/uv" --version | cut -d' ' -f2)" = "$UV_VERSION"
      - name: Check the tools the rows find
        run: |
          set -euo pipefail
          test "$(command -v tmux)" = "$FARM_TMUX_DIR/tmux"
          stat -c '%A %U:%G %n' /home "$HOME" "$HOME/.local" "$HOME/.local/bin"
          tmux -V
          command -v uv
          uv --version
      - name: Build the Linux landlock helper
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          ls -l target/debug/crazyagent-landlock
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Install the desktop build packages
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Write the stub frontend the desktop crate embeds
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
      - name: Clippy per crate, lib and tests, deny warnings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 240
        run: |
          set +e
          worst=0
          for p in crazyagent crazyagent-kernel-common crazyagent-kernel-security crazyagent-kernel-storage crazyagent-kernel-processes crazyagent-kernel-sandbox crazyagent-kernel-plugin-host crazyagent-bus-gateway crazyagent-capgen crazyagent-sdk crazyagent-sdk-host crazyagent-desktop crazyagent-plugin-check crazyagent-cap crazyagent-plugin-agent-quit crazyagent-linux-supervisor; do
            log="$RUNNER_TEMP/clippy-$p.log"
            cargo clippy -p "$p" --lib --tests --locked -- -D warnings > "$log" 2>&1
            rc=$?
            checked=$(grep -c -E "^ +(Checking|Compiling) $p v" "$log")
            echo "clippy $FARM_OS $p rc=$rc checked=$checked"
            if [ "$checked" -eq 0 ]; then
              echo "::error::clippy did not check $p, so its rc proves nothing"
              worst=1
            fi
            echo "$FARM_OS $p rc=$rc" >> "$RUNNER_TEMP/clippy.txt"
            if [ "$rc" -ne 0 ]; then
              worst=1
              grep -E -A 8 '^(error|warning)(\[[A-Za-z0-9_:]+\])?:' "$log" | head -n 120
            fi
          done
          echo "clippy summary on $FARM_OS:"
          cat "$RUNNER_TEMP/clippy.txt"
          exit "$worst"

  windows-clippy:
    name: Batch b24 FINAL clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      FARM_OS: windows-2022
      BASE_PREP: cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked && cp "$CARGO_TARGET_DIR/debug/crazyagent-win-boundary.exe" "$CARGO_TARGET_DIR/debug/deps/crazyagent-win-boundary.exe"; mkdir -p apps/desktop/dist; printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Build the Windows boundary helper
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Write the stub frontend the desktop crate embeds
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
      - name: Clippy per crate, lib and tests, deny warnings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 240
        run: |
          set +e
          worst=0
          for p in crazyagent crazyagent-kernel-common crazyagent-kernel-security crazyagent-kernel-storage crazyagent-kernel-processes crazyagent-kernel-sandbox crazyagent-kernel-plugin-host crazyagent-bus-gateway crazyagent-capgen crazyagent-sdk crazyagent-sdk-host crazyagent-desktop crazyagent-plugin-check crazyagent-cap crazyagent-plugin-agent-quit crazyagent-win-sandbox; do
            log="$RUNNER_TEMP/clippy-$p.log"
            cargo clippy -p "$p" --lib --tests --locked -- -D warnings > "$log" 2>&1
            rc=$?
            checked=$(grep -c -E "^ +(Checking|Compiling) $p v" "$log")
            echo "clippy $FARM_OS $p rc=$rc checked=$checked"
            if [ "$checked" -eq 0 ]; then
              echo "::error::clippy did not check $p, so its rc proves nothing"
              worst=1
            fi
            echo "$FARM_OS $p rc=$rc" >> "$RUNNER_TEMP/clippy.txt"
            if [ "$rc" -ne 0 ]; then
              worst=1
              grep -E -A 8 '^(error|warning)(\[[A-Za-z0-9_:]+\])?:' "$log" | head -n 120
            fi
          done
          echo "clippy summary on $FARM_OS:"
          cat "$RUNNER_TEMP/clippy.txt"
          exit "$worst"

  macos-clippy:
    name: Batch b24 FINAL clippy on macos-15
    runs-on: macos-15
    timeout-minutes: 330
    env:
      FARM_OS: macos-15
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
          bash --version | head -n 1
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Write the stub frontend the desktop crate embeds
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
      - name: Clippy per crate, lib and tests, deny warnings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 240
        run: |
          set +e
          worst=0
          for p in crazyagent crazyagent-kernel-common crazyagent-kernel-security crazyagent-kernel-storage crazyagent-kernel-processes crazyagent-kernel-sandbox crazyagent-kernel-plugin-host crazyagent-bus-gateway crazyagent-capgen crazyagent-sdk crazyagent-sdk-host crazyagent-desktop crazyagent-plugin-check crazyagent-cap crazyagent-plugin-agent-quit crazyagent-macos-fs; do
            log="$RUNNER_TEMP/clippy-$p.log"
            cargo clippy -p "$p" --lib --tests --locked -- -D warnings > "$log" 2>&1
            rc=$?
            checked=$(grep -c -E "^ +(Checking|Compiling) $p v" "$log")
            echo "clippy $FARM_OS $p rc=$rc checked=$checked"
            if [ "$checked" -eq 0 ]; then
              echo "::error::clippy did not check $p, so its rc proves nothing"
              worst=1
            fi
            echo "$FARM_OS $p rc=$rc" >> "$RUNNER_TEMP/clippy.txt"
            if [ "$rc" -ne 0 ]; then
              worst=1
              grep -E -A 8 '^(error|warning)(\[[A-Za-z0-9_:]+\])?:' "$log" | head -n 120
            fi
          done
          echo "clippy summary on $FARM_OS:"
          cat "$RUNNER_TEMP/clippy.txt"
          exit "$worst"

