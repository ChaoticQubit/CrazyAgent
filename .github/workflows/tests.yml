name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: BWRAP-ROOT-SWAP red rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the red commit's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='red %H %s' HEAD^
          git log -1 --format='base %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = 25373789a82ef6ca344b395b6b62f5124f4277dd ] || { echo "::error::the grandparent is not b23 25373789a8"; exit 1; }
          [ "$(git rev-parse HEAD^)" = 0debaf93d190c3f854a1fb6933256061e6a76594 ] || { echo "::error::the parent is not the red commit 0debaf93d1"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the red commit"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Runner facts
        run: |
          set +e
          uname -r
          bwrap --version
          echo "tmp filesystem: $(stat -f -c %T /tmp)"
          echo "runner temp filesystem: $(stat -f -c %T "$RUNNER_TEMP")"
      - name: Bubblewrap root swap rows and controls (expected red on the two swap rows)
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --test linux_sandbox --locked -- --test-threads 1 root_swap:: bubblewrap_holds_the_same_project_boundary > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ tests|^test |panicked at|exit Some|exit None|test result|^error' "$log" | head -n 60 || true
          tail -n 3 "$log"
          echo "rows rc $code"
