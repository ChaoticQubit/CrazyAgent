name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 2d20ff69c6979453abc4f0962bac2b92f2bac2ba
  BASE: 709ee9a893ebecf38721239bbcd6e522746b0e58
  FILE: crates/crazyagent/src/tui/screens/project_tests.rs
  RED_ROW: tui::screens::project_tests::a_failed_move_read_says_the_move_downloads_everything_and_sends_it

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: B29-MOVE-UNREAD-ROW red then tip, clippy, caps on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE" ] || { echo "::error::HEAD~2 is not 709ee9a893"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILE " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: rustfmt --check on the touched file (expect rc 0)
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check "$FILE"
      - name: Line caps and sleeps at the base and the tip (expect no file new to the problem list, sleeps rc 0)
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; echo "caps tip rc $?"
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1; st=$?; echo "sleeps tip rc $st"
          git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; echo "caps base rc $?"; node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-base.txt" 2>&1; echo "sleeps base rc $?")
          git worktree remove --force "$RUNNER_TEMP/base"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-base.txt" | sort > "$RUNNER_TEMP/cb.txt"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-tip.txt" | sort > "$RUNNER_TEMP/ct.txt"
          comm -13 "$RUNNER_TEMP/cb.txt" "$RUNNER_TEMP/ct.txt" > "$RUNNER_TEMP/caps-new.txt"
          echo "caps new at tip $(wc -l < "$RUNNER_TEMP/caps-new.txt" | tr -d ' ')"; cat "$RUNNER_TEMP/caps-new.txt"
          [ ! -s "$RUNNER_TEMP/caps-new.txt" ] && [ "$st" = 0 ] || exit 1
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Write the row runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          set +e
          set -u
          name=$1
          filter=$2
          log="$RUNNER_TEMP/rows-$name.log"
          cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
          rc=$?
          grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$name.txt"
          echo "$name FAILED $(wc -l < "$RUNNER_TEMP/failed-$name.txt" | tr -d ' '):"
          cat "$RUNNER_TEMP/failed-$name.txt"
          awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' | head -n 40 || true
          grep -E '^ +Compiling crazyagent v' "$log" || true
          ok=$(grep -cE '^test .* \.\.\. ok$' "$log")
          echo "$name filter $filter rc $rc ok $ok $(grep -E '^test result:' "$log" | tr '\n' ' ')"
          echo "$ok" > "$RUNNER_TEMP/ok-$name.txt"
          echo "$rc" > "$RUNNER_TEMP/rc-$name.txt"
          ROWS
          sed -i.bak 's/^          //' "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Red, 709ee9a893's project_tests.rs (expect exactly the named row FAILED, the rest ok)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          git checkout "$BASE" -- "$FILE"
          git diff --stat HEAD^ -- crates
          bash "$RUNNER_TEMP/rows.sh" red tui::screens::project_tests::
          git checkout HEAD^ -- "$FILE"
          git diff --quiet HEAD^ -- crates || { echo "::error::the tip project_tests.rs was not put back"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/failed-red.txt")" = "$RED_ROW" ] || { echo "::error::the red set is not exactly $RED_ROW"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/ok-red.txt")" -ge 1 ] || exit 1
      - name: Tip, the project_tests and project row filters (expect each rc 0, ok > 0, FAILED 0)
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          bad=0
          for name in tests project; do
            if [ "$name" = tests ]; then filter=tui::screens::project_tests::; else filter=tui::screens::project::; fi
            bash "$RUNNER_TEMP/rows.sh" "tip-$name" "$filter"
            [ "$(cat "$RUNNER_TEMP/rc-tip-$name.txt")" = 0 ] && [ ! -s "$RUNNER_TEMP/failed-tip-$name.txt" ] && [ "$(cat "$RUNNER_TEMP/ok-tip-$name.txt")" -ge 1 ] || bad=1
          done
          exit "$bad"
  macos:
    name: B29-MOVE-UNREAD-ROW tip rows on macos-15
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE" ] || { echo "::error::HEAD~2 is not 709ee9a893"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILE " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - name: Write the row runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          set +e
          set -u
          name=$1
          filter=$2
          log="$RUNNER_TEMP/rows-$name.log"
          cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
          rc=$?
          grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$name.txt"
          echo "$name FAILED $(wc -l < "$RUNNER_TEMP/failed-$name.txt" | tr -d ' '):"
          cat "$RUNNER_TEMP/failed-$name.txt"
          awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' | head -n 40 || true
          grep -E '^ +Compiling crazyagent v' "$log" || true
          ok=$(grep -cE '^test .* \.\.\. ok$' "$log")
          echo "$name filter $filter rc $rc ok $ok $(grep -E '^test result:' "$log" | tr '\n' ' ')"
          echo "$ok" > "$RUNNER_TEMP/ok-$name.txt"
          echo "$rc" > "$RUNNER_TEMP/rc-$name.txt"
          ROWS
          sed -i.bak 's/^          //' "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Tip, the project_tests and project row filters (expect each rc 0, ok > 0, FAILED 0)
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          bad=0
          for name in tests project; do
            if [ "$name" = tests ]; then filter=tui::screens::project_tests::; else filter=tui::screens::project::; fi
            bash "$RUNNER_TEMP/rows.sh" "tip-$name" "$filter"
            [ "$(cat "$RUNNER_TEMP/rc-tip-$name.txt")" = 0 ] && [ ! -s "$RUNNER_TEMP/failed-tip-$name.txt" ] && [ "$(cat "$RUNNER_TEMP/ok-tip-$name.txt")" -ge 1 ] || bad=1
          done
          exit "$bad"
