name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  seam-macos:
    name: native switch-time seam ddbeb380a browser node rows with Chrome for Testing, red and tip, macos-15
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TIP: ddbeb380ace63fcd135ed18740be5cf373a79e08
      RED: 945179b45b3f12c3f1f8f8307a0f9ab818950ec9
      ROWS: 33f56da1919bcb8b8ce2672e1bb9480fcc6d20be
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies at the tip
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        env:
          CHROME_PLATFORM: mac-arm64
          CHROME_SHA256: 01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/$CHROME_PLATFORM/chrome-$CHROME_PLATFORM.zip"
          echo "$CHROME_SHA256  $work/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$work/chrome.zip" "$work"
          chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Node red panel rows at the red commit with the rows of the fix, wanted non-zero on those rows
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set +e
          set -u
          rt="$RUNNER_TEMP/red-tree"
          mkdir -p "$rt"
          git archive "$RED" apps/desktop | tar -x -C "$rt"
          git archive "$ROWS" apps/desktop/test/native-panel.test.mjs apps/desktop/test/fixtures/native-panel.mjs | tar -x -C "$rt"
          ln -s "$GITHUB_WORKSPACE/apps/desktop/node_modules" "$rt/apps/desktop/node_modules"
          log="$RUNNER_TEMP/red-panel.log"
          (cd "$rt/apps/desktop" && node --test --test-reporter=spec --test-name-pattern "V243-NATIVE-SWITCH-TIME" test/native-panel.test.mjs) > "$log" 2>&1
          rc=$?
          echo "STEP node red panel at ${RED:0:9} with the rows of ${ROWS:0:9} rc=$rc (want non-zero on the V243 rows) $(grep -E '^[^ ]+ (tests|pass|fail) [0-9]+$' "$log" | tr '\n' ' ')"
          awk '/failing tests:/ { on = 1 } on { print }' "$log" | cut -c1-300 | head -80
          [ $rc -ne 0 ]
      - name: Node rows at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          set +e
          set -u
          git diff --quiet "$TIP" || { echo "STEP tree is not the tip"; exit 15; }
          log="$RUNNER_TEMP/tip-node.log"
          node --test --test-reporter=spec test/native-panel.test.mjs test/native/switch-time-native.test.mjs test/native/switch-time-kit.test.mjs \
            test/no-opaque-failures.test.mjs test/command-wiring.test.mjs test/command-registration.test.mjs test/process.test.mjs test/setup.test.mjs \
            test/team-events.test.mjs test/plugins.test.mjs test/project-access.test.mjs test/run-command.test.mjs test/overview-tabs.test.mjs \
            test/ide-extensions.test.mjs test/native/log-producers.test.mjs test/native/run-layout.test.mjs > "$log" 2>&1
          rc=$?
          echo "STEP node tip rc=$rc $(grep -E '^[^ ]+ (tests|pass|fail) [0-9]+$' "$log" | tr '\n' ' ')"
          echo "STEP node tip V243 rows passed=$(grep -cE '^ *✔ V243-NATIVE-SWITCH-TIME' "$log") failed=$(grep -cE '^ *✖ V243-NATIVE-SWITCH-TIME' "$log")"
          awk '/failing tests:/ { on = 1 } on { print }' "$log" | cut -c1-300 | head -80
          exit $rc
