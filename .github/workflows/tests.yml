name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 0cf5de26e92f4ba9f3a98789830a4a1456553e3a
  MEASURE_FILES: "crates/crazyagent/src/agent_home/held_home.rs crates/crazyagent/src/engine/bootstrap/held.rs crates/crazyagent/src/engine/bootstrap/held_tests.rs crates/crazyagent/src/launch_context/windows_tests.rs "
  HELD: "engine::bootstrap::held::tests::"
  LAUNCH: "launch_context::windows_tests::"
  UNIX_LAUNCH: "launch_context::tests::"
  HOME_WINDOWS: "agent_home::windows_tests::"
  NEW_HELD: "a_sole_inherited_file_refuses_a_second_writer_while_it_is_open an_unjudged_file_open_reads_a_plain_file_and_refuses_a_link_or_folder"
  PRIVATE_ROW: "a_private_make_over_another_kind_of_entry_is_unsafe"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  NEW_WINDOWS: "a_windows_process_install_prepares_the_home_through_the_held_root a_windows_process_install_removes_planted_junctions_in_the_home_as_themselves a_windows_process_install_replaces_a_link_or_folder_at_the_instruction_file a_windows_process_install_with_no_text_removes_the_instruction_file a_windows_process_install_keeps_or_clears_the_caches_by_the_choice a_windows_process_install_clears_project_memory_and_links_but_keeps_transcripts a_windows_process_install_keeps_a_kept_file_it_cannot_open a_windows_install_it_cannot_write_yet_is_refused_before_it_changes_the_home"

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: S9B-6 measure 1 kept-file open on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          changed="$(git diff --name-only HEAD^ | sort | tr '\n' ' ')"
          echo "measure files: $changed"
          [ "$changed" = "$MEASURE_FILES" ] || { echo "::error::the tree differs from the tip by other files"; exit 1; }
      - name: Show the runner token's backup and restore privileges
        run: |
          set -euo pipefail
          whoami
          MSYS_NO_PATHCONV=1 /c/Windows/System32/whoami.exe /priv
          MSYS_NO_PATHCONV=1 /c/Windows/System32/whoami.exe /groups | grep -iE 'Mandatory Label|Administrators' || true
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Measure, not gated - held no-share row, then the kept-file row and the prepare row with their DIAG lines
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          for row in "engine::bootstrap::held::tests::an_unjudged_file_open_of_a_file_held_without_sharing_is_in_use" "launch_context::windows_tests::a_windows_process_install_keeps_a_kept_file_it_cannot_open" "launch_context::windows_tests::a_windows_process_install_prepares_the_home_through_the_held_root"; do
            log="$RUNNER_TEMP/measure.log"
            cargo test -p crazyagent --lib --locked -- "$row" --exact --nocapture --test-threads 1 > "$log" 2>&1
            code=$?
            echo "=== $row rc $code"
            grep -E '^ +(Checking|Compiling) crazyagent v|DIAG|panicked|^test |test result|called `' "$log" | head -n 80 || true
          done
          exit 0
