name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: c8d64ab888206554a481da560874faf25aec8dad
  BASE_FULL: fe0a3f6bac60c4af1baa7491c9146d76827024c6
  K: crazyagent-kernel-sandbox
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: ENTRIES-CAP A tip 4 c8d64ab888 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a full sha that is not 40 hex
        run: |
          set -euo pipefail
          n=0
          while IFS='=' read -r k v; do
            n=$((n + 1))
            [[ "$v" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$k is not a 40-hex sha: $v"; exit 1; }
            echo "$k ok"
          done < <(env | grep -E '^[A-Z_]+_FULL=' | sort)
          [ "$n" = 2 ] || { echo "::error::want 2 *_FULL shas, got $n"; exit 1; }
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 13
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~11)" = "$BASE_FULL" ] || { echo "::error::HEAD~11 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/crazyagent-clippy.log"
          cargo clippy -p "crazyagent" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "crazyagent-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: Build the boundary helpers the rows run, beside the test binaries
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock.exe target/debug/deps/crazyagent-landlock.exe
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
          ls -l target/debug/deps/crazyagent-landlock.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: kernel_sandbox lib, every row (expect rc 0, failed 0, passed == listed - ignored, new rows ok 7)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-lib.log"
          list="$RUNNER_TEMP/kernel-lib.list"
          cargo test -p "$K" --lib --locked -- --list > "$list" 2>/dev/null
          listed="$(grep -cE ': test$' "$list" || true)"
          cargo test -p "$K" --lib --locked > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log"
          summary="$(grep -E '^test result: ' "$log" | tail -n 1)"
          passed="$(printf '%s\n' "$summary" | sed -nE 's/.* ([0-9]+) passed;.*/\1/p')"
          ignored="$(printf '%s\n' "$summary" | sed -nE 's/.* ([0-9]+) ignored;.*/\1/p')"
          [ -n "$passed" ] && [ -n "$ignored" ] || { echo "::error::no test result line"; passed=x; }
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "kernel-lib windows-2022 rc $code listed $listed passed $passed ignored $ignored failed $failed"
          fail=0
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$((listed - ignored))" ] || fail=1
          grep -E '(^test engine_scratch::tests::a_scratch_(is_a_new_private_folder_at_its_place_in_the_engine_folder|name_already_there_is_refused|part_that_is_not_one_plain_name_is_refused|in_a_record_folder_trips_the_assert - should panic|named_as_a_record_folder_trips_the_assert - should panic)|^test engine_scratch::tests::a_windows_scratch_is_judged_private_by_w1_in_a_private_engine_folder|^test windows::engine_rows::owner_git_rows::owner_git_refuses_a_project_that_holds_the_engine_folder_before_any_profile) \.\.\. ok$' "$log" || true
          new="$(grep -cE '(^test engine_scratch::tests::a_scratch_(is_a_new_private_folder_at_its_place_in_the_engine_folder|name_already_there_is_refused|part_that_is_not_one_plain_name_is_refused|in_a_record_folder_trips_the_assert - should panic|named_as_a_record_folder_trips_the_assert - should panic)|^test engine_scratch::tests::a_windows_scratch_is_judged_private_by_w1_in_a_private_engine_folder|^test windows::engine_rows::owner_git_rows::owner_git_refuses_a_project_that_holds_the_engine_folder_before_any_profile) \.\.\. ok$' "$log" || true)"
          echo "new rows ok $new want 7"
          [ "$new" = 7 ] || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: kernel_sandbox doc tests, the EngineScratch compile_fail included (expect rc 0, failed 0, compile fail ok 1)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-doc.log"
          cargo test -p "$K" --doc --locked > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ignored)$|engine_scratch' "$log" | head -n 20 || true
          grep -E '^test result:' "$log"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          cf="$(grep -cE ' - engine_scratch::EngineScratch \(line [0-9]+\) - compile fail \.\.\. ok$' "$log" || true)"
          echo "kernel-doc windows-2022 rc $code failed $failed compile-fail-ok $cf want 1"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$cf" = 1 ] || exit 1
      - name: crazyagent R2 rows, the plugins and context-mode modules (expect rc 0, failed 0, new rows ok 2)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/ca-r2.log"
          cargo test -p crazyagent --lib --locked -- engine::owner::transport::plugins::tests:: context_mode::windows_tests:: > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          ran="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
          new="$(grep -cE '^test engine::owner::transport::plugins::tests::(a_second_check_of_a_running_server_is_busy_and_leaves_its_folder|a_failed_check_frees_its_server_for_the_next_check) \.\.\. ok$' "$log" || true)"
          echo "ca-r2 windows-2022 rc $code ok $ran failed $failed new rows ok $new want 2"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$ran" -ge 1 ] && [ "$new" = 2 ] || exit 1

  linux:
    name: ENTRIES-CAP A tip 4 c8d64ab888 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
