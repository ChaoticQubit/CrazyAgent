name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: ddf9d574e3f23492b0d38af98fc745e339cfab98
  BASE_FULL: cae403031ba4391d22ce8cbb36a1d6bf044ebd75

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: B40-R2 fmt, clippy, the two process rows at the old fixture and at the tip, and the rows, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -5 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = c848ba1bed08affa6bf4c40ca5e150bba8f930ef ] || { echo "::error::HEAD~2 is not the revert c848ba1bed"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = cb7dc44b73db7288b62493ca9e921b47354758dd ] || { echo "::error::HEAD~3 is not the reverted row cb7dc44b73"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE_FULL" ] || { echo "::error::HEAD~4 is not B40 cae403031b"; exit 1; }
          [ -z "$(git diff "$BASE_FULL" HEAD~2)" ] || { echo "::error::the revert does not give back B40's tree"; exit 1; }
          [ "$(git diff --name-only "$BASE_FULL" HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/engine/owner/transport/process_tests.rs " ] || { echo "::error::the tip differs from B40 beyond the process fixture"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of crazyagent (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt -p crazyagent -- --check > "$RUNNER_TEMP/fmt.log" 2>&1
          code=$?
          head -n 40 "$RUNNER_TEMP/fmt.log"
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, the crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent --tests -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g1" -ge 1 ] || exit 1
      - name: The two process rows at B40's fixture, then at the tip (expect 2 FAILED with process_save_unavailable at the old fixture, 2 listed and 2 passed at the tip)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          fixture=crates/crazyagent/src/engine/owner/transport/process_tests.rs
          filter=engine::owner::transport::process::tests::
          rows='^test engine::owner::transport::process::tests::(stale_agent_instructions_save_is_refused|a_save_the_store_keeps_busy_past_its_wait_saves_nothing_says_so_and_lands_when_saved_again) \.\.\. '
          two() {
            local log="$RUNNER_TEMP/two-$1.log"
            cargo test --locked -p crazyagent --lib "${filter}stale_agent_instructions_save_is_refused" > "$log" 2>&1
            local first=$?
            cargo test --locked -p crazyagent --lib "${filter}a_save_the_store_keeps_busy_past_its_wait_saves_nothing_says_so_and_lands_when_saved_again" >> "$log" 2>&1
            local second=$?
            grep -E '^test engine::owner::transport::process::tests::|^test result|panicked at|process_save_unavailable|^error(\[|:)' "$log" | head -n 40 || true
            failed="$(grep -cE "${rows}FAILED$" "$log" || true)"
            passed="$(grep -cE "${rows}ok$" "$log" || true)"
            unavailable="$(grep -c 'process_save_unavailable' "$log" || true)"
            gate="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
            echo "two at $1 rc $first $second failed $failed passed $passed unavailable_lines $unavailable gate crazyagent $gate"
            eval "$1_first=$first $1_second=$second $1_failed=$failed $1_passed=$passed $1_unavailable=$unavailable $1_gate=$gate"
          }
          git checkout "$BASE_FULL" -- "$fixture"
          [ "$(git diff --name-only "$BASE_FULL" -- "$fixture" | wc -l)" = 0 ] || { echo "::error::the fixture is not B40's"; exit 1; }
          two old
          git checkout HEAD^ -- "$fixture"
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip after the old fixture"; exit 1; }
          touch "$fixture"
          two tip
          list="$RUNNER_TEMP/list.log"
          cargo test --locked -p crazyagent --lib "$filter" -- --list > "$list" 2>&1
          listed="$(grep -cE '^engine::owner::transport::process::tests::(stale_agent_instructions_save_is_refused|a_save_the_store_keeps_busy_past_its_wait_saves_nothing_says_so_and_lands_when_saved_again): test$' "$list" || true)"
          echo "listed $listed"
          [ "$old_first" != 0 ] && [ "$old_second" != 0 ] && [ "$old_failed" = 2 ] && [ "$old_passed" = 0 ] && [ "$old_unavailable" -ge 2 ] && [ "$old_gate" -ge 1 ] || { echo "::error::the old fixture did not fail as expected"; exit 1; }
          [ "$tip_first" = 0 ] && [ "$tip_second" = 0 ] && [ "$tip_failed" = 0 ] && [ "$tip_passed" = 2 ] && [ "$tip_gate" -ge 1 ] && [ "$listed" = 2 ] || exit 1
      - name: The process tests and sessions_log rows at the tip (expect rc 0 and 0 failed each)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          ok=1
          for filter in engine::owner::transport::process::tests:: sessions_log::; do
            log="$RUNNER_TEMP/set.log"
            cargo test --locked -p crazyagent --lib "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|^test result' "$log" | head -n 20 || true
            failed="$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)"
            passed="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
            results="$(grep -cE '^test result: ' "$log" || true)"
            echo "set $filter rc $code failed $failed passed $passed results $results"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] && [ "$results" = 1 ] || ok=0
          done
          [ "$ok" = 1 ] || exit 1
