name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 2c3214d009b0907a4f952f2adf482fbbbdf54bdb
  RED_FULL: eb1586a0933d089df4e7b775ad6bb057b9108d1f
  BASE_FULL: ba4893b0bb142e80d3e9add19dab2baad2676072
  RUST_FILES: crates/crazyagent/src/tui/screens/settings/app_plugins/sentence.rs crates/crazyagent/src/tui/screens/settings/app_plugins/tests.rs crates/kernel/plugin_host/src/problem.rs crates/kernel/plugin_host/src/problem_tests.rs
  KERNEL_ROWS: "problem_tests::"
  KERNEL_RED_ROW: "problem_tests::a_taken_name_says_a_built_in_plugin_holds_it"
  TUI_ROWS: "tui::screens::settings::app_plugins::tests::"
  TUI_RED_ONE: "tui::screens::settings::app_plugins::tests::a_refusal_shows_its_sentence_and_every_app_plugin_code_has_one"
  TUI_RED_TWO: "tui::screens::settings::app_plugins::tests::remove_confirms_naming_the_entered_key_and_bundled_rows_offer_no_x"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Name taken built-in copy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the name-used fix"; exit 1; }
          changed="$(git diff --name-only "$BASE_FULL" HEAD^ | sort | tr '\n' ' ')"
          read -ra files <<< "$RUST_FILES"
          wanted="$(printf '%s\n' "${files[@]}" | sort | tr '\n' ' ')"
          [ "$changed" = "$wanted" ] || { echo "::error::the ticket range is not the four ticket files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache, so cargo rebuilds both crates
        run: |
          set -euo pipefail
          read -ra files <<< "$RUST_FILES"
          sleep 2
          touch "${files[@]}"
          ls -l "${files[@]}"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt check of the four ticket Rust files (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          read -ra files <<< "$RUST_FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent and crazyagent-kernel-plugin-host --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, both crates checked)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent -p crazyagent-kernel-plugin-host --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          host="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings crazyagent checked $app plugin-host checked $host"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$app" -ge 1 ] && [ "$host" -ge 1 ] || exit 1
      - name: plugin-host problem rows at tip (expect listed 7, passed 7, failed 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/kernel.log"
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- "$KERNEL_ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE '^problem_tests::[a-z_]+: test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- "$KERNEL_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 40 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "kernel rows rc $code listed $listed passed $passed failed $failed built $built"
          [ "$code" = 0 ] && [ "$listed" = 7 ] && [ "$passed" = 7 ] && [ "$failed" = 0 ] && [ "$built" -ge 1 ] || exit 1
      - name: The new plugin-host row over the base problem.rs (expect failed 1 at its assert)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          file=crates/kernel/plugin_host/src/problem.rs
          git checkout "$BASE_FULL" -- "$file"
          git diff --stat HEAD^
          log="$RUNNER_TEMP/kernel-red.log"
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- --exact "$KERNEL_RED_ROW" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked at|left:|right:|assertion' "$log" | head -n 40 || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          at="$(grep -cE 'panicked at crates/kernel/plugin_host/src/problem_tests.rs:[0-9]+:[0-9]+:$' "$log" || true)"
          echo "kernel red rc $code passed $passed failed $failed panics-in-rows $at built $built"
          git checkout HEAD^ -- "$file"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 1 ] && [ "$passed" = 0 ] && [ "$at" = 1 ] && [ "$built" -ge 1 ] || exit 1
      - name: TUI App plugins rows at tip (expect listed 27, passed 27, failed 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 150
        run: |
          set +e
          log="$RUNNER_TEMP/tui.log"
          cargo test -p crazyagent --lib --locked -- "$TUI_ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE '^tui::screens::settings::app_plugins::tests::[a-z0-9_]+: test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- "$TUI_ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 60 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "tui rows rc $code listed $listed passed $passed failed $failed built $built"
          [ "$code" = 0 ] && [ "$listed" = 27 ] && [ "$passed" = 27 ] && [ "$failed" = 0 ] && [ "$built" -ge 1 ] || exit 1
      - name: The two changed TUI rows over the base sentence.rs (expect failed 2 at their asserts)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          file=crates/crazyagent/src/tui/screens/settings/app_plugins/sentence.rs
          git checkout "$BASE_FULL" -- "$file"
          git diff --stat HEAD^
          log="$RUNNER_TEMP/tui-red.log"
          cargo test -p crazyagent --lib --locked -- --exact "$TUI_RED_ONE" "$TUI_RED_TWO" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked at|left:|right:|assertion' "$log" | head -n 40 || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          at="$(grep -cE 'panicked at crates/crazyagent/src/tui/screens/settings/app_plugins/tests.rs:[0-9]+:[0-9]+:$' "$log" || true)"
          echo "tui red rc $code passed $passed failed $failed panics-in-rows $at built $built"
          git checkout HEAD^ -- "$file"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 2 ] && [ "$passed" = 0 ] && [ "$at" = 2 ] && [ "$built" -ge 1 ] || exit 1
