name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 06d666483a2d3d7099d933bc0b3671922bb1ba67
  C1_FULL: d70d7a47ad239e28c30c7d03c7af53fcb5bdc735
  BASE_FULL: 9af0fed035548e0468d31f5db66792da23bf7496
  PH_ASSETS: crates/kernel/plugin_host/src/assets.rs
  CALLER_FILTERS: "assets:: storage::settings:: storage::master_session:: storage::worker_dispatch:: worktrees:: usage::capture:: engine::bootstrap::native_profiles:: engine::owner::transport::dispatch_identity_tests::"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: FILE-IDENTITY-KERNEL ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
          - os: windows-2022
            leg: win
            cache: Windows
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$C1_FULL" ] || { echo "::error::HEAD~2 is not c1"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not chore/v250 9af0fed035"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the three crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-common -p crazyagent-kernel-plugin-host -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-kernel.log"
          cargo clippy -p crazyagent-kernel-common -p crazyagent-kernel-plugin-host --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-common v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log" || true)"
          echo "clippy kernel rc $code errors $errors warnings $warnings gates crazyagent-kernel-common $g0 crazyagent-kernel-plugin-host $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: clippy crazyagent-lib-bins with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-crazyagent-lib-bins.log"
          cargo clippy -p crazyagent --lib --bins --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent-lib-bins rc $code errors $errors warnings $warnings gates crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: clippy crazyagent-tests with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-crazyagent-tests.log"
          cargo clippy -p crazyagent --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent-tests rc $code errors $errors warnings $warnings gates crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: kernel rows, kernel_common file_identity (6 on unix) and plugin_host assets (expect failed 0, the 3 replaced rows ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows-common.log"
          cargo test -p crazyagent-kernel-common --lib --locked -- file_identity:: > "$log" 2>&1
          code=$?
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true; tail -n 20 "$log"; }
          echo "rows kernel_common file_identity:: rc $code passed $passed failed $failed"
          c_code=$code; c_passed=$passed; c_failed=$failed
          log="$RUNNER_TEMP/rows-ph.log"
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- assets::tests:: > "$log" 2>&1
          code=$?
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true; tail -n 20 "$log"; }
          named=0
          for r in the_sources_are_checked_as_one_set_not_one_by_one a_source_moved_to_another_volume_is_refused_as_replaced a_whole_volume_renumbered_at_mount_is_still_accepted; do
            n="$(grep -cxF "test assets::tests::$r ... ok" "$log" || true)"
            echo "  $r ok $n"
            named=$((named + n))
          done
          echo "rows plugin_host assets::tests:: rc $code passed $passed failed $failed named-ok $named"
          if [ "${{ matrix.leg }}" != win ]; then [ "$c_code" = 0 ] && [ "$c_passed" = 6 ] && [ "$c_failed" = 0 ] || exit 1; fi
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$named" = 3 ] || exit 1
      - name: crazyagent caller rows (expect failed 0, each filter listed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          read -r -a filters <<< "$CALLER_FILTERS"
          list="$RUNNER_TEMP/app.list"
          cargo test -p crazyagent --lib --locked -- --list > "$list" 2>&1
          for f in "${filters[@]}"; do echo "  listed $f $(grep -F "$f" "$list" | grep -c ': test$' || true)"; done
          log="$RUNNER_TEMP/rows-app.log"
          cargo test -p crazyagent --lib --locked -- "${filters[@]}" > "$log" 2>&1
          code=$?
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true; tail -n 20 "$log"; }
          echo "rows crazyagent callers rc $code passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] || exit 1
      - name: Red, plugin_host assets.rs from the base under the tip rows (expect a compile failure naming replaced and same_files)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        timeout-minutes: 60
        run: |
          set +e
          git show "$BASE_FULL:$PH_ASSETS" > "$PH_ASSETS"
          sleep 2
          touch "$PH_ASSETS"
          log="$RUNNER_TEMP/red.log"
          cargo test -p crazyagent-kernel-plugin-host --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^error(\[|:)' "$log" | sort | uniq -c | head -n 10 || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          replaced="$(grep -cE 'cannot find function .replaced.' "$log" || true)"
          field="$(grep -cE 'missing field .same_files.' "$log" || true)"
          echo "red rc $code errors $errors replaced-missing $replaced field-missing $field"
          git checkout HEAD^ -- "$PH_ASSETS"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$replaced" -ge 1 ] && [ "$field" -ge 1 ] || exit 1
      - name: c1 builds on its own (cargo check crazyagent lib and bins at HEAD~2, expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        timeout-minutes: 90
        run: |
          set +e
          git checkout --detach -q HEAD~2
          git log -1 --format='c1 %H %s'
          git diff --name-only "$BASE_FULL" HEAD -- '*.rs' | xargs touch
          log="$RUNNER_TEMP/c1.log"
          cargo check -p crazyagent --lib --bins --locked > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          common="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-common v' "$log" || true)"
          echo "c1 check rc $code errors $errors gates crazyagent $app kernel-common $common"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$app" -ge 1 ] && [ "$common" -ge 1 ] || exit 1
