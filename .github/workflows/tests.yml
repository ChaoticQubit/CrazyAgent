name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  TIP_FULL: d7e16b6947a9f24ae3d564f7b4a33a39942c4817
  RED_FULL: 6a02563fbbde53bf431cd5bccb683ed94c0ec533
  BASE_FULL: c6c672b4726b8226a35e486089704f41e4f66230
  SRC_FILES: apps/desktop/src/api.ts apps/desktop/src/api-questions.ts apps/desktop/src/api-recovery.ts apps/desktop/src/api-usage.ts apps/desktop/src/native-auth.ts
  MOVED_FILE: apps/desktop/src/pool-id.ts
  TEST_FILES: apps/desktop/test/no-opaque-failures.test.mjs apps/desktop/test/questions.test.mjs
  ROW_FILES: apps/desktop/test/no-opaque-failures.test.mjs apps/desktop/test/questions.test.mjs apps/desktop/test/recovery-banner.test.mjs apps/desktop/test/metrics-usage.test.mjs apps/desktop/test/app-metrics.test.mjs apps/desktop/test/native-auth.test.mjs apps/desktop/test/settings-app-plugins.test.mjs

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Desktop owner_busy copy r2 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -6 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$RED_FULL" ] || { echo "::error::HEAD~5 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~6)" = "$BASE_FULL" ] || { echo "::error::HEAD~6 is not the b24 base"; exit 1; }
          git show "$BASE_FULL:apps/desktop/src/api.ts" | awk '/^\/\*\* Makes the id of a new pool/{f=1} f{print} f&&/^}$/{exit}' | cmp - "$MOVED_FILE" || { echo "::error::the moved helper is not byte-equal to the base"; exit 1; }
          echo "moved helper byte-equal to the base"
          changed="$(git diff --name-only "$BASE_FULL" HEAD^ | sort | tr '\n' ' ')"
          read -ra files <<< "$SRC_FILES $MOVED_FILE $TEST_FILES"
          wanted="$(printf '%s\n' "${files[@]}" | sort | tr '\n' ' ')"
          [ "$changed" = "$wanted" ] || { echo "::error::the ticket range is not the eight ticket files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Desktop typecheck at tip (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        working-directory: apps/desktop
        run: |
          set +e
          npm run typecheck
          code=$?
          echo "tsc rc $code"
          [ "$code" = 0 ] || exit 1
      - name: Desktop rows of the seven files at tip (expect tests 151, pass 151, fail 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          read -ra files <<< "$ROW_FILES"
          log="$RUNNER_TEMP/desktop.log"
          node --test --test-reporter=spec "${files[@]}" > "$log" 2>&1
          code=$?
          grep -E '^✖|^ℹ (tests|pass|fail) ' "$log" || true
          tests="$(grep -E '^ℹ tests [0-9]+' "$log" | awk '{print $3}')"
          pass="$(grep -E '^ℹ pass [0-9]+' "$log" | awk '{print $3}')"
          fail="$(grep -E '^ℹ fail [0-9]+' "$log" | awk '{print $3}')"
          echo "desktop tip rc $code tests $tests pass $pass fail $fail"
          [ "$code" = 0 ] && [ "$tests" = 151 ] && [ "$pass" = 151 ] && [ "$fail" = 0 ] || { cat "$log"; exit 1; }
      - name: The same rows over the base sources (expect tests 151, pass 150, fail 1, the shared-sentence row)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          read -ra src <<< "$SRC_FILES"
          git checkout "$BASE_FULL" -- "${src[@]}"
          git diff --stat HEAD^
          read -ra files <<< "$ROW_FILES"
          log="$RUNNER_TEMP/desktop-red.log"
          node --test --test-reporter=spec "${files[@]}" > "$log" 2>&1
          code=$?
          grep -E '^✖|^ℹ (tests|pass|fail) |expected|actual' "$log" | head -n 40 || true
          tests="$(grep -E '^ℹ tests [0-9]+' "$log" | awk '{print $3}')"
          pass="$(grep -E '^ℹ pass [0-9]+' "$log" | awk '{print $3}')"
          fail="$(grep -E '^ℹ fail [0-9]+' "$log" | awk '{print $3}')"
          named="$(grep -cE '^✖ owner_busy reads the one shared sentence on every page' "$log" || true)"
          echo "desktop red rc $code tests $tests pass $pass fail $fail named-failed $named"
          git checkout HEAD^ -- "${src[@]}"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 1 ] && [ "$tests" = 151 ] && [ "$pass" = 150 ] && [ "$fail" = 1 ] && [ "$named" -ge 1 ] || exit 1
      - name: caps.mjs problem paths at tip equal the base's (expect NEW 0, api.ts no longer than the base)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          base="$RUNNER_TEMP/base"
          git worktree add -q --detach "$base" "$BASE_FULL"
          (cd "$base" && node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1)
          git worktree remove --force "$base"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt" "$RUNNER_TEMP/caps-tip.txt"
          grep -E 'api\.ts:|pools\.tsx:|pool-id\.ts:' "$RUNNER_TEMP/caps-base.txt" "$RUNNER_TEMP/caps-tip.txt" || true
          base_lines="$(git show "$BASE_FULL:apps/desktop/src/api.ts" | wc -l)"
          tip_lines="$(wc -l < apps/desktop/src/api.ts)"
          if diff <(cut -d: -f1 "$RUNNER_TEMP/caps-base.txt" | sort) <(cut -d: -f1 "$RUNNER_TEMP/caps-tip.txt" | sort); then echo "caps problem paths identical, NEW 0"; else exit 1; fi
          echo "api.ts lines base $base_lines tip $tip_lines"
          [ "$tip_lines" -le "$base_lines" ] || { echo "::error::api.ts grew: $base_lines to $tip_lines"; exit 1; }
