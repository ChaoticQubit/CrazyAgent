name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 3fdf1c2ea92587fa1c05a59209e777fc07ae6704

defaults:
  run:
    shell: bash

jobs:
  leak:
    name: FREE-SCAN-UNINIT red by leak patch ${{ matrix.patch }} on macos-15
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - patch: format-5f66031b8a
            test: secret_format_copies
            rows: "a_curl_request_frees_no_copy_of_its_token,a_relayed_request_frees_no_copy_of_the_key"
          - patch: mcp-9d5f01854e
            test: mcp_config_secret_copies
            rows: "a_claude_mcp_config_frees_no_copy_of_a_secret"
          - patch: drops-9f6b5f8783
            test: secret_drops_wipe
            rows: "secret_types_free_only_zeros"
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install tmux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Apply only the leak patch on the fix tip
        env:
          PATCH: ${{ matrix.patch }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git log -1 --format='branch tip %H %s' HEAD^
          git apply ".github/farm/free-scan-leaks/$PATCH.patch"
          git diff --stat
          git diff
          git diff --name-only | grep -vqE '^crates/crazyagent/src/' && { echo "::error::the patch touches more than product code"; exit 1; }
          git diff --quiet -- crates/crazyagent/tests crates/kernel || { echo "::error::the patch touches a test or kernel file"; exit 1; }
          true
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Red rows
        timeout-minutes: 120
        env:
          TEST_NAME: ${{ matrix.test }}
          ROWS: ${{ matrix.rows }}
        run: |
          set +e
          want="$(printf '%s' "$ROWS" | tr ',' '\n' | sort)"
          log="$RUNNER_TEMP/$TEST_NAME.log"
          cargo test -p crazyagent --test "$TEST_NAME" --locked > "$log" 2>&1
          code=$?
          grep -E '^test |test result:|panicked at|left:|right:' "$log" || true
          got="$(grep -E '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          echo "RED $TEST_NAME rc $code failed: $(printf '%s' "$got" | tr '\n' ' ')"
          [ "$got" = "$want" ] || { echo "::error::$TEST_NAME red rows differ; want: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; exit 1; }
