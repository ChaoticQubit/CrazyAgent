name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 9cbe10c75cd59fa70e8247a4055913fda2eacc7f
  BASE: ecef0204e092aaded62f9ae1407d655ddc7afffc
  ROWS: landing::tests::repository_hooks_filters_merge_drivers_textconv_and_fsmonitor_never_run landing::tests::update_merges_a_lead_worker_s_set_with_its_lead_s_branch_and_names_it landing::tests::update_merges_a_clone_lead_s_newest_tip_into_its_worker_s_set

defaults:
  run:
    shell: bash

jobs:
  landing-turn-rows:
    name: Landing turn rows on Linux at the ${{ matrix.at }}, alone, the whole module, and beside the shared set
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        at: [tip, base]
    env:
      AT: ${{ matrix.at }}
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the commit this job runs
        run: |
          set -euo pipefail
          case "$AT" in tip) want="$TIP" ;; base) want="$BASE" ;; *) echo "UNKNOWN AT $AT"; exit 1 ;; esac
          git merge-base --is-ancestor "$want" HEAD
          git checkout --detach "$want"
          test "$(git rev-parse HEAD)" = "$want"
          test -z "$(git status --porcelain)"
          git log --oneline -1
          /usr/bin/git --version
          ls -l /usr/bin/false /dev/null
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - name: Build the engine library tests
        id: lib
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: The three landing rows alone on one thread
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --test-threads=1 $ROWS > "$RUNNER_TEMP/alone.txt" 2>&1
          rc=$?
          grep -E "^test |^test result" "$RUNNER_TEMP/alone.txt"
          sed -n '/^failures:$/,/^test result/p' "$RUNNER_TEMP/alone.txt" | head -150
          echo "ALONE EXIT $rc AT $AT"
      - name: The whole landing tests module
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- landing::tests:: > "$RUNNER_TEMP/module.txt" 2>&1
          rc=$?
          grep -E "^test result" "$RUNNER_TEMP/module.txt"
          grep -E "^test .* FAILED$" "$RUNNER_TEMP/module.txt" | head -60
          grep -cE "^test .* FAILED$" "$RUNNER_TEMP/module.txt"
          sed -n '/^failures:$/,/^failures:$/p' "$RUNNER_TEMP/module.txt" | grep -A4 "^---- \|panicked" | head -120
          echo "MODULE EXIT $rc AT $AT"
      - name: The three landing rows beside the shared set
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- ide::git::tests:: ide::env:: landing::signature_tests:: worktrees::tests:: $ROWS > "$RUNNER_TEMP/shared.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED" "$RUNNER_TEMP/shared.txt" | head -40
          sed -n '/^failures:$/,/^test result/p' "$RUNNER_TEMP/shared.txt" | head -150
          echo "SHARED EXIT $rc AT $AT"
