name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a30-links:
    name: ASK-0030 inbox tool hard links on windows-2022
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: List the names and owner of each inbox tool
        shell: pwsh
        run: |
          [Environment]::OSVersion.VersionString
          foreach ($name in 'curl.exe', 'tar.exe', 'icacls.exe', 'cmd.exe') {
            $tool = Join-Path $env:SystemRoot "System32\$name"
            $names = @(fsutil hardlink list $tool)
            "CASE $name names $($names.Count) owner $((Get-Acl $tool).Owner)"
            $names | ForEach-Object { "CASE $name name $_" }
          }
