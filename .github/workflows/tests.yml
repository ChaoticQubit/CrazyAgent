name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  BASE_FULL: f0a086aaedf8fb960af9ad174abf7381706b2077
  TIP_FULL: a9b77673193d4a5370669053b4f8972c54ab13b2
  ROW: tests::files_panics_naming_a_folder_it_cannot_read

defaults:
  run:
    shell: bash

jobs:
  root:
    name: "B23 CR13 the 000-folder row as root and as the runner user on ubuntu-22.04 at base and tip"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the farm commit sits on the fix tip
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit touches more than tests.yml"; exit 1; }
          git merge-base --is-ancestor "$BASE_FULL" "$TIP_FULL" || { echo "::error::the base is not an ancestor of the tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: The row at base and tip, as root and as the runner user
        timeout-minutes: 70
        run: |
          set +e
          fail=0
          echo "ROOT-ID $(sudo id -u)"
          echo "USER-ID $(id -u)"
          for side in base tip; do
            if [ "$side" = base ]; then sha="$BASE_FULL"; else sha="$TIP_FULL"; fi
            git checkout -q --detach "$sha"
            echo "SIDE $side $(git rev-parse HEAD)"
            cargo fetch --locked > "$RUNNER_TEMP/fetch-$side.log" 2>&1
            echo "FETCH $side rc $?"
            cargo test -p crazyagent-kernel-storage --lib --locked --no-run --message-format=json > "$RUNNER_TEMP/build-$side.json" 2> "$RUNNER_TEMP/build-$side.log"
            echo "BUILD $side rc $?"
            bin="$(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and (.target.kind | index("lib")) and .executable != null) | .executable' "$RUNNER_TEMP/build-$side.json" | tail -n 1)"
            echo "BIN $side $bin"
            [ -x "$bin" ] || { echo "::error::no test binary at $side"; tail -n 40 "$RUNNER_TEMP/build-$side.log"; fail=1; continue; }
            for who in root user; do
              log="$RUNNER_TEMP/row-$side-$who.log"
              if [ "$who" = root ]; then
                sudo "$bin" "$ROW" --exact 2>&1 | tee "$log" > /dev/null
              else
                "$bin" "$ROW" --exact 2>&1 | tee "$log" > /dev/null
              fi
              code=${PIPESTATUS[0]}
              grep -E '^test |test result:|panicked at|proves nothing' "$log" || true
              row="$(grep -E "^test $ROW \.\.\. (ok|FAILED)\$" "$log" | sed -E 's/.* \.\.\. //')"
              echo "ROW $side $who rc $code: ${row:-none}"
              if [ "$side" = base ] && [ "$who" = root ]; then want=FAILED; else want=ok; fi
              if [ "$row" != "$want" ]; then
                echo "::error::$side as $who: want $want, got ${row:-none}"
                tail -n 40 "$log"
                fail=1
              fi
              if [ "$want" = FAILED ] && ! grep -q 'this user reads a 000 folder, so the row proves nothing' "$log"; then
                echo "::error::$side as $who failed without the 000-folder message"
                fail=1
              fi
            done
          done
          echo "PROBE-END fail $fail"
          exit "$fail"
