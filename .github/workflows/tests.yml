name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  BUN_DARWIN_ARM64_SHA256: 80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403
  NODE_DARWIN_ARM64_SHA256: 1901d539912c02afa10d1cc126943a8855a7eedebe830119463470db5e6c59e8
  RUSTC_DARWIN_ARM64_SHA256: 738e3f60114b20550fcf4f8a57c9cea0544239f214709f45594ff3fde327f577
  CARGO_DARWIN_ARM64_SHA256: de51d4fade4f31ad8ec405261cc96bedc000d905f98980027610d6e288dbe21b
  RUST_STD_DARWIN_ARM64_SHA256: 2de831ef563ce772519a4d18ba2659f0f7428d497ef66dad24b5a35e8f8cd177
  CLIPPY_DARWIN_ARM64_SHA256: 1ad080040ff0f4f8af0751bd7fa1fb1901212f8d164cecaa3c47b0654e0916f2
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ENGINE_TESTS_EXCLUDE: >-
    e2e_tui research_engine team_engine onboarding research_runner research_service tui_v1_e2e codex_app_server_live launch_context_live codex_bridge_live agents_live
    qualification_boundary worker_engine_boundary accounts_binary e2e_add_existing setup_network harness_catalog_bundled_rcli acceptance_v2_rcli_usage
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
  DESKTOP_TESTS_EXCLUDE: picker_windows accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: POD-E E14 sandbox budget bisect on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: "Budget rows at probe 1 b43279c83 - control: the before commit (E0, run 45101887786)"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          PROBE: b43279c83
        run: |
          set +e
          git checkout --quiet --force --detach "$PROBE"
          git log -1 --format='probe %h %s'
          cargo test -p crazyagent --test sandbox_budget --locked -- --ignored --nocapture --test-threads=1 > "$RUNNER_TEMP/rows-$PROBE.log" 2>&1
          code=$?
          set -e
          echo "probe $PROBE rc=$code"
          grep -E "budget [a-z0-9_]+ p95_us=|^test result|could not compile|panicked" "$RUNNER_TEMP/rows-$PROBE.log" || true
      - name: "Budget rows at probe 2 93ba6ace1a - tip: b22, run 45308004006"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          PROBE: 93ba6ace1a
        run: |
          set +e
          git checkout --quiet --force --detach "$PROBE"
          git log -1 --format='probe %h %s'
          cargo test -p crazyagent --test sandbox_budget --locked -- --ignored --nocapture --test-threads=1 > "$RUNNER_TEMP/rows-$PROBE.log" 2>&1
          code=$?
          set -e
          echo "probe $PROBE rc=$code"
          grep -E "budget [a-z0-9_]+ p95_us=|^test result|could not compile|panicked" "$RUNNER_TEMP/rows-$PROBE.log" || true
      - name: "Budget rows at probe 3 92ede61e87 - b13 E11-H, B1, N merged"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          PROBE: 92ede61e87
        run: |
          set +e
          git checkout --quiet --force --detach "$PROBE"
          git log -1 --format='probe %h %s'
          cargo test -p crazyagent --test sandbox_budget --locked -- --ignored --nocapture --test-threads=1 > "$RUNNER_TEMP/rows-$PROBE.log" 2>&1
          code=$?
          set -e
          echo "probe $PROBE rc=$code"
          grep -E "budget [a-z0-9_]+ p95_us=|^test result|could not compile|panicked" "$RUNNER_TEMP/rows-$PROBE.log" || true
      - name: "Budget rows at probe 4 76c08a9beb - b14 E11-B2, A2a, A2b merged"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          PROBE: 76c08a9beb
        run: |
          set +e
          git checkout --quiet --force --detach "$PROBE"
          git log -1 --format='probe %h %s'
          cargo test -p crazyagent --test sandbox_budget --locked -- --ignored --nocapture --test-threads=1 > "$RUNNER_TEMP/rows-$PROBE.log" 2>&1
          code=$?
          set -e
          echo "probe $PROBE rc=$code"
          grep -E "budget [a-z0-9_]+ p95_us=|^test result|could not compile|panicked" "$RUNNER_TEMP/rows-$PROBE.log" || true
      - name: "Budget rows at probe 5 9527316416 - b18 E11-C r1, C-rows, G merged"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          PROBE: 9527316416
        run: |
          set +e
          git checkout --quiet --force --detach "$PROBE"
          git log -1 --format='probe %h %s'
          cargo test -p crazyagent --test sandbox_budget --locked -- --ignored --nocapture --test-threads=1 > "$RUNNER_TEMP/rows-$PROBE.log" 2>&1
          code=$?
          set -e
          echo "probe $PROBE rc=$code"
          grep -E "budget [a-z0-9_]+ p95_us=|^test result|could not compile|panicked" "$RUNNER_TEMP/rows-$PROBE.log" || true
      - name: Bisect summary
        if: ${{ !cancelled() }}
        run: |
          set +e
          for log in "$RUNNER_TEMP"/rows-*.log; do
            probe=${log##*/rows-}
            echo "${probe%.log}: $(grep -oE 'budget [a-z0-9_]+ p95_us=[0-9]+' "$log" | tr '\n' ' ')"
          done
