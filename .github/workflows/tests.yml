name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: a6aa826862e367e5ab4059b1360760e3b7981b04
  BASE_FULL: af1b6b99ae9939e8fa514e6fe5e14cacbf17b3c1
  TICKET_FILES: apps/desktop/src/screens/team/terminal-io.ts apps/desktop/test/terminal-ended.test.mjs crates/crazyagent/src/tui/screens/team.rs crates/crazyagent/src/tui/screens/team/closed_words_tests.rs
  RUST_FILES: crates/crazyagent/src/tui/screens/team.rs crates/crazyagent/src/tui/screens/team/closed_words_tests.rs
  ROWS: "tui::screens::team::closed_words_tests::"
  LINUX_ROW: "tui::screens::team::closed_words_tests::on_linux_a_terminal_with_no_tmux_says_to_install_it_with_the_package_manager"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: G8 Linux tmux copy ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -7 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~7)" = "$BASE_FULL" ] || { echo "::error::HEAD~7 is not the b24 base"; exit 1; }
          changed="$(git diff --name-only "$BASE_FULL" HEAD^ | sort | tr '\n' ' ')"
          read -ra files <<< "$TICKET_FILES"
          wanted="$(printf '%s\n' "${files[@]}" | sort | tr '\n' ' ')"
          [ "$changed" = "$wanted" ] || { echo "::error::the ticket range is not the four ticket files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Desktop typecheck at tip (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        working-directory: apps/desktop
        run: |
          set +e
          npm run typecheck
          code=$?
          echo "tsc rc $code"
          [ "$code" = 0 ] || exit 1
      - name: Desktop terminal-ended rows at tip (expect tests 6, pass 6, fail 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          log="$RUNNER_TEMP/desktop.log"
          node --test --test-reporter=spec apps/desktop/test/terminal-ended.test.mjs > "$log" 2>&1
          code=$?
          cat "$log"
          tests="$(grep -E '^ℹ tests [0-9]+' "$log" | awk '{print $3}')"
          pass="$(grep -E '^ℹ pass [0-9]+' "$log" | awk '{print $3}')"
          fail="$(grep -E '^ℹ fail [0-9]+' "$log" | awk '{print $3}')"
          echo "desktop tip rc $code tests $tests pass $pass fail $fail"
          [ "$code" = 0 ] && [ "$tests" = 6 ] && [ "$pass" = 6 ] && [ "$fail" = 0 ] || exit 1
      - name: Desktop terminal-ended rows over the base terminal-io.ts (expect tests 6, pass 5, fail 1, the Linux row)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          git checkout "$BASE_FULL" -- apps/desktop/src/screens/team/terminal-io.ts
          git diff --stat HEAD^
          log="$RUNNER_TEMP/desktop-red.log"
          node --test --test-reporter=spec apps/desktop/test/terminal-ended.test.mjs > "$log" 2>&1
          code=$?
          cat "$log"
          tests="$(grep -E '^ℹ tests [0-9]+' "$log" | awk '{print $3}')"
          pass="$(grep -E '^ℹ pass [0-9]+' "$log" | awk '{print $3}')"
          fail="$(grep -E '^ℹ fail [0-9]+' "$log" | awk '{print $3}')"
          linux="$(grep -cE '^✖ on Linux a terminal with no tmux' "$log" || true)"
          echo "desktop red rc $code tests $tests pass $pass fail $fail linux-row-failed $linux"
          git checkout HEAD^ -- apps/desktop/src/screens/team/terminal-io.ts
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 1 ] && [ "$tests" = 6 ] && [ "$pass" = 5 ] && [ "$fail" = 1 ] && [ "$linux" -ge 1 ] || exit 1
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache, so cargo rebuilds crazyagent
        run: |
          set -euo pipefail
          read -ra files <<< "$RUST_FILES"
          sleep 2
          touch "${files[@]}"
          ls -l "${files[@]}"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt check of the two ticket Rust files (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          read -ra files <<< "$RUST_FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent --lib --tests with warnings denied on this system (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings crazyagent checked $app"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$app" -ge 1 ] || exit 1
      - name: closed_words rows at tip (expect listed 1, passed 1, this system's row)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 150
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- "$ROWS" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log.list" || true)"
          echo "rows listed $listed, crazyagent built $built"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- "$ROWS" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 40 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "rows rc $code listed $listed passed $passed failed $failed built $built"
          [ "$code" = 0 ] && [ "$listed" = 1 ] && [ "$passed" = 1 ] && [ "$failed" = 0 ] && [ "$built" -ge 1 ] || exit 1
      - name: The Linux row over the base team.rs with only the rows' module declared (expect failed 1 at its assert)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 120
        run: |
          set +e
          team=crates/crazyagent/src/tui/screens/team.rs
          git show "$BASE_FULL:$team" > "$team"
          printf '\n#[cfg(test)]\nmod closed_words_tests;\n' >> "$team"
          git diff HEAD^ -- "$team" | head -n 60
          log="$RUNNER_TEMP/red.log"
          cargo test -p crazyagent --lib --locked -- --exact "$LINUX_ROW" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked at|left:|right:|assertion' "$log" | head -n 40 || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          at="$(grep -cE "panicked at crates/crazyagent/src/tui/screens/team/closed_words_tests.rs:[0-9]+:[0-9]+:$" "$log" || true)"
          echo "red rc $code passed $passed failed $failed panics-in-rows $at built $built"
          git checkout HEAD^ -- "$team"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 1 ] && [ "$passed" = 0 ] && [ "$at" = 1 ] && [ "$built" -ge 1 ] || exit 1
