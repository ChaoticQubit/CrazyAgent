name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 57f776af31bbc0683b3d0c627b5f566b80cd99a0
  RED_FULL: 936d18a893cc70ce912b3be27699b9f3181ac9e7

defaults:
  run:
    shell: bash

jobs:
  green:
    name: B23-CR3-MINORS rows and clippy at the tip on macos-15
    runs-on: macos-15
    strategy:
      matrix:
        specs: ["crazyagent@ok@research::runner::tests::read_only::a_read_only_run_failing_right_after_a_folder_is_saved_hidden_ends_stopped,research::runner::tests::read_only::a_read_only_run_stops_once_a_folder_it_did_not_hide_is_saved_hidden,research::runner::tests::read_only::a_read_only_run_answering_right_after_a_folder_is_saved_hidden_ends_stopped,landing::tests::polish::a_folder_hidden_during_a_lockfile_run_that_then_exits_on_its_own_still_refuses_the_set"]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install tmux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Rows
        timeout-minutes: 120
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set +e
          fail=0
          for spec in $SPECS; do
            package="$(echo "$spec" | cut -d@ -f1)"
            outcome="$(echo "$spec" | cut -d@ -f2)"
            names="$(echo "$spec" | cut -d@ -f3 | tr ',' ' ')"
            want="$(echo "$names" | tr ' ' '\n' | sort)"
            log="$RUNNER_TEMP/$package.log"
            read -r -a filters <<< "$names"
            cargo test -p "$package" --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
            code=$?
            grep -E '^test |test result:|panicked at|^thread ' "$log" || true
            ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            got="$(grep -E "^test [a-z_0-9:]+ \.\.\. $outcome\$" "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            echo "ROWS $package $outcome rc $code: $(printf '%s' "$got" | tr '\n' ' ')"
            [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::$package rows differ; want $outcome: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
          done
          exit "$fail"

      - name: Mac clippy at the tip
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          git log -1 --format='clippy at %H %s'
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          grep -E '^(error|warning)' "$RUNNER_TEMP/clippy.log" | head -n 40 || true
          tail -n 3 "$RUNNER_TEMP/clippy.log"
          echo "CLIPPY rc $code"
          exit "$code"

  red:
    name: B23-CR3-MINORS red at 936d18a893 on macos-15
    runs-on: macos-15
    strategy:
      matrix:
        specs: ["crazyagent@FAILED@research::runner::tests::read_only::a_read_only_run_failing_right_after_a_folder_is_saved_hidden_ends_stopped"]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Check out the red sha
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git merge-base --is-ancestor "$RED_FULL" "$TIP_FULL" || { echo "::error::the red commit is not below the tip"; exit 1; }
          git checkout --detach "$RED_FULL"
          git log -1 --format='red %H %s'
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Rows
        timeout-minutes: 120
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set +e
          fail=0
          for spec in $SPECS; do
            package="$(echo "$spec" | cut -d@ -f1)"
            outcome="$(echo "$spec" | cut -d@ -f2)"
            names="$(echo "$spec" | cut -d@ -f3 | tr ',' ' ')"
            want="$(echo "$names" | tr ' ' '\n' | sort)"
            log="$RUNNER_TEMP/$package.log"
            read -r -a filters <<< "$names"
            cargo test -p "$package" --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
            code=$?
            grep -E '^test |test result:|panicked at|^thread ' "$log" || true
            ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            got="$(grep -E "^test [a-z_0-9:]+ \.\.\. $outcome\$" "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            echo "ROWS $package $outcome rc $code: $(printf '%s' "$got" | tr '\n' ' ')"
            [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::$package rows differ; want $outcome: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
          done
          exit "$fail"
