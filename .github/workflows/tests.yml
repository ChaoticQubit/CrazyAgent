name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: a0367171c4
  GATE_USER: cagate
  ROW_ONE: a_standard_user_is_not_elevated_and_owns_what_it_makes
  ROW_TWO: a_standard_user_installs_checks_and_updates_an_npm_harness_into_the_engine_prefix

defaults:
  run:
    shell: bash

jobs:
  standard-user:
    name: V250-WIN-HARNESS-NONELEVATED-E2E standard-user rows on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a probe whose parent is not the ticket tip
        run: |
          set -euo pipefail
          parent=$(git rev-parse --short=10 HEAD^)
          echo "CASE head $(git rev-parse HEAD) parent $parent"
          [ "$parent" = "$TIP" ] || { echo "::error::HEAD^ is $parent, not the tip $TIP"; exit 1; }
          changed=$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')
          allowed=".github/workflows/tests.yml crates/crazyagent/tests/windows_standard_user_diag.rs "
          [ "$changed" = "$allowed" ] || { echo "::error::the probe commit changes more than the workflow and the diagnostic row: $changed"; exit 1; }
          echo "CASE builds at $(git rev-parse HEAD): the ticket tip plus the workflow and the probe-only diagnostic row"
      - name: Create the gate standard user and prove it before any build
        shell: pwsh
        env:
          GATE_STAGE: create
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [byte[]]::new(24)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $plain = 'Ca' + [Convert]::ToHexString($bytes) + 'z1!'
          Write-Output "::add-mask::$plain"
          $machine = "WinNT://$env:COMPUTERNAME"
          try {
            if ($env:GATE_STAGE -eq 'create') {
              $account = ([ADSI]$machine).Create('User', $env:GATE_USER)
              $account.SetPassword($plain)
              $account.SetInfo()
              ([ADSI]"$machine/Users,group").Add("$machine/$($env:GATE_USER),user")
            } else {
              ([ADSI]"$machine/$($env:GATE_USER),user").SetPassword($plain)
            }
          } catch {
            throw "the gate user's $($env:GATE_STAGE) step failed: $($_.Exception.InnerException.Message) $($_.Exception.Message)"
          }
          if ($env:GATE_STAGE -eq 'create') {
            New-Item -ItemType Directory -Force C:\gate | Out-Null
            icacls C:\gate /grant "$($env:GATE_USER):(OI)(CI)M" | Out-Null
          }
          $admins = (net localgroup Administrators) -join ' '
          Write-Output "CASE administrators $admins"
          if ($admins -match "(^|\s|\\)$($env:GATE_USER)(\s|$)") { throw "$env:GATE_USER is an administrator" }
          $secure = ConvertTo-SecureString $plain -AsPlainText -Force
          $cred = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$env:GATE_USER", $secure)
          function Invoke-AsGateUser([string]$program, [string[]]$arguments, [string]$name) {
            $out = "C:\gate\$name.out"
            $err = "C:\gate\$name.err"
            $started = Get-Date
            $run = Start-Process -FilePath $program -ArgumentList $arguments -Credential $cred -LoadUserProfile -UseNewEnvironment -WorkingDirectory C:\gate -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
            foreach ($file in @($out, $err)) {
              if (Test-Path $file) { Get-Content $file | ForEach-Object { Write-Host "CASE $name $_" } }
            }
            Write-Host "ROW $name rc=$($run.ExitCode) seconds=$([int]((Get-Date) - $started).TotalSeconds)"
            $run.ExitCode
          }
          $code = Invoke-AsGateUser 'C:\Windows\System32\cmd.exe' @('/d', '/c', 'exit 7') 'exit-code'
          if ($code -ne 7) { throw "an exit code read back from the gate user is $code, not 7" }
          $null = Invoke-AsGateUser 'C:\Windows\System32\whoami.exe' @('/groups') 'whoami'
          $groups = Get-Content C:\gate\whoami.out -Raw
          if ($groups -notmatch 'Medium Mandatory Level') { throw 'the gate user does not run at medium integrity' }
          if ($groups -match 'S-1-5-32-544') { throw 'the gate user holds the Administrators group' }
          $null = Invoke-AsGateUser 'C:\Windows\System32\cmd.exe' @('/d', '/c', 'set') 'environment'
          $lines = Get-Content C:\gate\environment.out
          $userHome = ($lines | Where-Object { $_ -like 'USERPROFILE=*' }) -replace '^USERPROFILE=', ''
          $temp = ($lines | Where-Object { $_ -like 'TEMP=*' }) -replace '^TEMP=', ''
          $local = ($lines | Where-Object { $_ -like 'LOCALAPPDATA=*' }) -replace '^LOCALAPPDATA=', ''
          Write-Host "CASE gate profile=$userHome temp=$temp localappdata=$local"
          if (-not $userHome -or $userHome -notmatch "\\$($env:GATE_USER)") { throw 'the gate user runs with another account''s profile' }
          foreach ($folder in @($temp, $local)) {
            if (-not $folder.StartsWith($userHome, [StringComparison]::OrdinalIgnoreCase)) { throw "the gate user's $folder lies outside its profile" }
          }
          if ($env:GATE_STAGE -eq 'create') { exit 0 }
          $failed = $false
          $diag = 'the_node_folder_on_path_as_the_engine_reads_it'
          $null = Invoke-AsGateUser 'C:\gate\diag.exe' @('--ignored', '--exact', $diag, '--test-threads=1', '--nocapture') 'diag-cagate'
          & C:\gate\diag.exe --ignored --exact $diag --test-threads=1 --nocapture *> C:\gate\diag-admin.log
          Get-Content C:\gate\diag-admin.log | ForEach-Object { Write-Host "CASE diag-runneradmin $_" }
          foreach ($row in @($env:ROW_ONE, $env:ROW_TWO)) {
            $rc = Invoke-AsGateUser 'C:\gate\rows.exe' @('--ignored', '--exact', $row, '--test-threads=1', '--nocapture') $row
            $ran = Select-String -Path "C:\gate\$row.out" -Pattern '^test result: ok\. 1 passed' -Quiet
            if ($rc -ne 0 -or -not $ran) { Write-Host "::error::$row failed as the gate user (rc $rc)"; $failed = $true }
          }
          & C:\gate\rows.exe --ignored --exact $env:ROW_ONE --test-threads=1 *> C:\gate\control.log
          $control = $LASTEXITCODE
          Get-Content C:\gate\control.log | ForEach-Object { Write-Host "CASE control $_" }
          $refused = Select-String -Path C:\gate\control.log -Pattern 'this row runs only as a standard user' -Quiet
          Write-Host "ROW elevated-control $($env:ROW_ONE) rc=$control refused=$refused (must fail with the refusal)"
          if ($control -eq 0 -or -not $refused) { Write-Host '::error::the elevated control did not fail with its refusal, so the gate cannot read red'; $failed = $true }
          if ($failed) { exit 1 }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Clippy the rows with warnings denied
        run: |
          set +e
          set -u
          started=$(date +%s)
          cargo clippy --locked --keep-going -p crazyagent --test windows_standard_user --test windows_standard_user_diag -- -D warnings > clippy.log 2>&1
          rc=$?
          cat clippy.log
          built=$(grep -c -E "^ *(Checking|Compiling) crazyagent v" clippy.log)
          echo "CASE clippy crazyagent --test windows_standard_user --test windows_standard_user_diag rc=$rc built=$built seconds=$(( $(date +%s) - started ))"
          [ "$built" -ge 1 ] || { echo "::error::clippy never checked crazyagent"; exit 1; }
          exit "$rc"
      - name: Build the rows into a folder the gate user can read
        run: |
          set +e
          set -uo pipefail
          started=$(date +%s)
          cargo test --locked -p crazyagent --test windows_standard_user --test windows_standard_user_diag --no-run --message-format=json > build.json 2> build.log
          rc=$?
          tail -20 build.log
          jq -r 'select(.reason == "compiler-message") | .message.rendered' build.json | head -200
          built=$(grep -c -E "^ *Compiling crazyagent v" build.log)
          echo "CASE build rc=$rc built=$built seconds=$(( $(date +%s) - started ))"
          [ "$rc" = 0 ] || exit 1
          exe=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "windows_standard_user" and .executable != null) | .executable' build.json | tail -1)
          [ -n "$exe" ] || { echo "::error::no rows executable in the build output"; exit 1; }
          mkdir -p /c/gate
          cp "$(cygpath -u "$exe")" /c/gate/rows.exe
          diag=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "windows_standard_user_diag" and .executable != null) | .executable' build.json | tail -1)
          [ -n "$diag" ] || { echo "::error::no diagnostic executable in the build output"; exit 1; }
          cp "$(cygpath -u "$diag")" /c/gate/diag.exe
          for level in "C:\\" 'C:\Program Files' 'C:\Program Files\nodejs' 'C:\Program Files\nodejs\node.exe' 'C:\Program Files\nodejs\npm.cmd'; do
            echo "CASE icacls $level"
            icacls "$level" | sed 's/^/CASE icacls   /' || echo "CASE icacls rc=$? for $level"
          done
          listed=$(/c/gate/rows.exe --list --ignored 2>/dev/null | grep -c -E ': test$')
          /c/gate/rows.exe --list --ignored
          echo "CASE listed ignored rows=$listed"
          [ "$listed" = 2 ] || { echo "::error::expected 2 ignored rows, listed $listed"; exit 1; }
      - name: Run the rows as the gate standard user, with an elevated control
        shell: pwsh
        env:
          GATE_STAGE: run
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [byte[]]::new(24)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $plain = 'Ca' + [Convert]::ToHexString($bytes) + 'z1!'
          Write-Output "::add-mask::$plain"
          $machine = "WinNT://$env:COMPUTERNAME"
          try {
            if ($env:GATE_STAGE -eq 'create') {
              $account = ([ADSI]$machine).Create('User', $env:GATE_USER)
              $account.SetPassword($plain)
              $account.SetInfo()
              ([ADSI]"$machine/Users,group").Add("$machine/$($env:GATE_USER),user")
            } else {
              ([ADSI]"$machine/$($env:GATE_USER),user").SetPassword($plain)
            }
          } catch {
            throw "the gate user's $($env:GATE_STAGE) step failed: $($_.Exception.InnerException.Message) $($_.Exception.Message)"
          }
          if ($env:GATE_STAGE -eq 'create') {
            New-Item -ItemType Directory -Force C:\gate | Out-Null
            icacls C:\gate /grant "$($env:GATE_USER):(OI)(CI)M" | Out-Null
          }
          $admins = (net localgroup Administrators) -join ' '
          Write-Output "CASE administrators $admins"
          if ($admins -match "(^|\s|\\)$($env:GATE_USER)(\s|$)") { throw "$env:GATE_USER is an administrator" }
          $secure = ConvertTo-SecureString $plain -AsPlainText -Force
          $cred = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$env:GATE_USER", $secure)
          function Invoke-AsGateUser([string]$program, [string[]]$arguments, [string]$name) {
            $out = "C:\gate\$name.out"
            $err = "C:\gate\$name.err"
            $started = Get-Date
            $run = Start-Process -FilePath $program -ArgumentList $arguments -Credential $cred -LoadUserProfile -UseNewEnvironment -WorkingDirectory C:\gate -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
            foreach ($file in @($out, $err)) {
              if (Test-Path $file) { Get-Content $file | ForEach-Object { Write-Host "CASE $name $_" } }
            }
            Write-Host "ROW $name rc=$($run.ExitCode) seconds=$([int]((Get-Date) - $started).TotalSeconds)"
            $run.ExitCode
          }
          $code = Invoke-AsGateUser 'C:\Windows\System32\cmd.exe' @('/d', '/c', 'exit 7') 'exit-code'
          if ($code -ne 7) { throw "an exit code read back from the gate user is $code, not 7" }
          $null = Invoke-AsGateUser 'C:\Windows\System32\whoami.exe' @('/groups') 'whoami'
          $groups = Get-Content C:\gate\whoami.out -Raw
          if ($groups -notmatch 'Medium Mandatory Level') { throw 'the gate user does not run at medium integrity' }
          if ($groups -match 'S-1-5-32-544') { throw 'the gate user holds the Administrators group' }
          $null = Invoke-AsGateUser 'C:\Windows\System32\cmd.exe' @('/d', '/c', 'set') 'environment'
          $lines = Get-Content C:\gate\environment.out
          $userHome = ($lines | Where-Object { $_ -like 'USERPROFILE=*' }) -replace '^USERPROFILE=', ''
          $temp = ($lines | Where-Object { $_ -like 'TEMP=*' }) -replace '^TEMP=', ''
          $local = ($lines | Where-Object { $_ -like 'LOCALAPPDATA=*' }) -replace '^LOCALAPPDATA=', ''
          Write-Host "CASE gate profile=$userHome temp=$temp localappdata=$local"
          if (-not $userHome -or $userHome -notmatch "\\$($env:GATE_USER)") { throw 'the gate user runs with another account''s profile' }
          foreach ($folder in @($temp, $local)) {
            if (-not $folder.StartsWith($userHome, [StringComparison]::OrdinalIgnoreCase)) { throw "the gate user's $folder lies outside its profile" }
          }
          if ($env:GATE_STAGE -eq 'create') { exit 0 }
          $failed = $false
          $diag = 'the_node_folder_on_path_as_the_engine_reads_it'
          $null = Invoke-AsGateUser 'C:\gate\diag.exe' @('--ignored', '--exact', $diag, '--test-threads=1', '--nocapture') 'diag-cagate'
          & C:\gate\diag.exe --ignored --exact $diag --test-threads=1 --nocapture *> C:\gate\diag-admin.log
          Get-Content C:\gate\diag-admin.log | ForEach-Object { Write-Host "CASE diag-runneradmin $_" }
          foreach ($row in @($env:ROW_ONE, $env:ROW_TWO)) {
            $rc = Invoke-AsGateUser 'C:\gate\rows.exe' @('--ignored', '--exact', $row, '--test-threads=1', '--nocapture') $row
            $ran = Select-String -Path "C:\gate\$row.out" -Pattern '^test result: ok\. 1 passed' -Quiet
            if ($rc -ne 0 -or -not $ran) { Write-Host "::error::$row failed as the gate user (rc $rc)"; $failed = $true }
          }
          & C:\gate\rows.exe --ignored --exact $env:ROW_ONE --test-threads=1 *> C:\gate\control.log
          $control = $LASTEXITCODE
          Get-Content C:\gate\control.log | ForEach-Object { Write-Host "CASE control $_" }
          $refused = Select-String -Path C:\gate\control.log -Pattern 'this row runs only as a standard user' -Quiet
          Write-Host "ROW elevated-control $($env:ROW_ONE) rc=$control refused=$refused (must fail with the refusal)"
          if ($control -eq 0 -or -not $refused) { Write-Host '::error::the elevated control did not fail with its refusal, so the gate cannot read red'; $failed = $true }
          if ($failed) { exit 1 }
