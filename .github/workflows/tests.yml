name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: aef8184398bf1828e4e65e29535e2265b20226af
  RED_FULL: 1ba8656c87ef9d767938a5f45b9e7c1e14c0080e
  BASE_FULL: ec22db84c2445d37322e1515f2ff372454ef1275
  K: crazyagent-kernel-sandbox
  OWNER_GIT: "windows::engine_rows::owner_git_rows::"
  OWNER_GIT_RED: "windows::engine_rows::owner_git_rows::owner_git_refuses_a_project_that_is_the_engine_root_before_any_profile"
  PUBLISH: "github::publish::publish_windows_tests::"
  SANDBOX_WIN: "sandbox::windows_tests::"
  EDITOR: "editor::tests::profile_rows::an_ide_profile_refuses_a_project_"
  LINUX_GRAPH: "onboarding::tests::a_graph_build_on_linux_ends_failed_and_writes_nothing"
  LINUX_REFUSES: "onboarding::tests::only_linux_refuses_the_graph_build_with_a_plain_line"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: GRANT engine root guard on windows-2022
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 18
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~11)" = "$RED_FULL" ] || { echo "::error::HEAD~11 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~12)" = "$BASE_FULL" ] || { echo "::error::HEAD~12 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          rows() {
            local pkg="$1" filter="$2" label="$3" want="$4" wantfail="${5:-0}" log="$RUNNER_TEMP/$3.log" list="$RUNNER_TEMP/$3.list" matched listed code failed passed ignored
            cargo test -p "$pkg" --lib --locked -- "$filter" --list > "$list" 2>/dev/null
            matched="$(grep -cE ': test$' "$list" || true)"
            listed="$(grep -cE "^${filter}.*: test$" "$list" || true)"
            echo "$label filter $filter matches these modules (rows per module):"
            grep -E ': test$' "$list" | sed -E 's/::[^:]+: test$//' | sort | uniq -c || true
            cargo test -p "$pkg" --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(grep -cE "^test ${filter}.* \.\.\. ok$" "$log" || true)"
            ignored="$(grep -cE "^test ${filter}.* \.\.\. ignored" "$log" || true)"
            echo "$label rc $code matched $matched listed under $filter $listed want $want passed $passed ignored $ignored failed $failed want failed $wantfail"
            [ "$failed" = "$wantfail" ] && [ "$listed" = "$want" ] && [ "$matched" = "$listed" ] && [ "$passed" = "$((listed - ignored - failed))" ] || return 1
            [ "$wantfail" != 0 ] || [ "$code" = 0 ]
          }
          ROWS
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/crazyagent-clippy.log"
          cargo clippy -p "crazyagent" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "crazyagent-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent lib test build, logged (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/norun.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "test build windows-2022 rc $code errors $errors gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: Build the boundary helper beside the test binaries
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Tip, owner git rows == list (9), sandbox windows rows == list (3), publish windows rows == list (12)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          fail=0
          rows "$K" "$OWNER_GIT" owner-git 9 || fail=1
          rows crazyagent "$SANDBOX_WIN" sandbox-windows 3 || fail=1
          rows crazyagent "$PUBLISH" publish-windows 12 || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: Red, the engine root owner git row fails alone (want 1 listed, 1 failed), the other owner git rows (9 listed, 1 failed), publish windows rows == list (12) all ok
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          set +e
          added="$(git diff --name-only --diff-filter=A "$RED_FULL" HEAD -- crates)"
          echo "added since the red commit, removed for this leg: ${added:-none}"
          [ -z "$added" ] || printf '%s\n' "$added" | xargs git rm -q -f --
          git checkout "$RED_FULL" -- crates
          changed="$(git diff --name-only "$RED_FULL" -- crates | wc -l | tr -d ' ')"
          echo "crates changed vs the red commit: $changed files"
          [ "$changed" = 0 ] || { echo "::error::the crates are not at the red commit"; exit 1; }
          git checkout HEAD -- crates/kernel/sandbox/src/windows/engine_rows.rs
          overlaid="$(git diff --name-only "$RED_FULL" -- crates | tr '\n' ' ')"
          echo "red with the tip's owner git rows overlaid: $overlaid"
          [ "$overlaid" = "crates/kernel/sandbox/src/windows/engine_rows.rs " ] || { echo "::error::the red overlay is not the owner git rows file alone"; exit 1; }
          fail=0
          rows "$K" "$OWNER_GIT_RED" red-owner-git-engine 1 1 || fail=1
          grep -E 'expected the engine root refusal, got Ok' "$RUNNER_TEMP/red-owner-git-engine.log" || { echo "::error::the red row did not fail on an Ok install"; fail=1; }
          rows "$K" "$OWNER_GIT" red-owner-git 9 1 || fail=1
          rows crazyagent "$PUBLISH" red-publish-windows 12 || fail=1
          git checkout HEAD -- crates
          [ "$fail" = 0 ] || exit 1
      - name: Base control, owner git rows at the base == list (8), all ok
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          set +e
          added="$(git diff --name-only --diff-filter=A "$BASE_FULL" HEAD -- crates)"
          echo "added since the base, removed for this leg: ${added:-none}"
          [ -z "$added" ] || printf '%s\n' "$added" | xargs git rm -q -f --
          git checkout "$BASE_FULL" -- crates
          changed="$(git diff --name-only "$BASE_FULL" -- crates | wc -l | tr -d ' ')"
          echo "crates changed vs the base: $changed files"
          [ "$changed" = 0 ] || { echo "::error::the crates are not at the base"; exit 1; }
          fail=0
          rows "$K" "$OWNER_GIT" base-owner-git 8 || fail=1
          git checkout HEAD -- crates
          [ "$fail" = 0 ] || exit 1

  linux:
    name: GRANT engine root guard on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 18
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~11)" = "$RED_FULL" ] || { echo "::error::HEAD~11 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~12)" = "$BASE_FULL" ] || { echo "::error::HEAD~12 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          rows() {
            local pkg="$1" filter="$2" label="$3" want="$4" wantfail="${5:-0}" log="$RUNNER_TEMP/$3.log" list="$RUNNER_TEMP/$3.list" matched listed code failed passed ignored
            cargo test -p "$pkg" --lib --locked -- "$filter" --list > "$list" 2>/dev/null
            matched="$(grep -cE ': test$' "$list" || true)"
            listed="$(grep -cE "^${filter}.*: test$" "$list" || true)"
            echo "$label filter $filter matches these modules (rows per module):"
            grep -E ': test$' "$list" | sed -E 's/::[^:]+: test$//' | sort | uniq -c || true
            cargo test -p "$pkg" --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(grep -cE "^test ${filter}.* \.\.\. ok$" "$log" || true)"
            ignored="$(grep -cE "^test ${filter}.* \.\.\. ignored" "$log" || true)"
            echo "$label rc $code matched $matched listed under $filter $listed want $want passed $passed ignored $ignored failed $failed want failed $wantfail"
            [ "$failed" = "$wantfail" ] && [ "$listed" = "$want" ] && [ "$matched" = "$listed" ] && [ "$passed" = "$((listed - ignored - failed))" ] || return 1
            [ "$wantfail" != 0 ] || [ "$code" = 0 ]
          }
          ROWS
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: The engine guard ratchet and its tests (expect rc 0 each)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set +e
          make engine-guard-check; check=$?
          make test-engine-guard-script > "$RUNNER_TEMP/guard-tests.log" 2>&1; tests=$?
          grep -E '^(not ok|ℹ (pass|fail))' "$RUNNER_TEMP/guard-tests.log"
          make sleeps-check; sleeps=$?
          make test-sleeps-script > "$RUNNER_TEMP/sleeps-tests.log" 2>&1; sleeps_tests=$?
          grep -E '^(not ok|ℹ (pass|fail))' "$RUNNER_TEMP/sleeps-tests.log"
          echo "engine-guard ubuntu-22.04 check rc $check tests rc $tests sleeps rc $sleeps sleeps tests rc $sleeps_tests"
          [ "$check" = 0 ] && [ "$tests" = 0 ] && [ "$sleeps" = 0 ] && [ "$sleeps_tests" = 0 ] || exit 1
      - name: kernel clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/crazyagent-clippy.log"
          cargo clippy -p "crazyagent" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "crazyagent-clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent lib test build, logged (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/norun.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "test build ubuntu-22.04 rc $code errors $errors gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: Tip, editor engine root rows == list (2), the Linux graph rows (1 + 1)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          fail=0
          rows "$K" "$EDITOR" editor 2 || fail=1
          rows crazyagent "$LINUX_GRAPH" linux-graph 1 || fail=1
          rows crazyagent "$LINUX_REFUSES" linux-refuses 1 || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: Base control, editor engine root rows at the base == list (1), the Linux graph rows (1 + 1)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          set +e
          added="$(git diff --name-only --diff-filter=A "$BASE_FULL" HEAD -- crates)"
          echo "added since the base, removed for this leg: ${added:-none}"
          [ -z "$added" ] || printf '%s\n' "$added" | xargs git rm -q -f --
          git checkout "$BASE_FULL" -- crates
          changed="$(git diff --name-only "$BASE_FULL" -- crates | wc -l | tr -d ' ')"
          echo "crates changed vs the base: $changed files"
          [ "$changed" = 0 ] || { echo "::error::the crates are not at the base"; exit 1; }
          fail=0
          rows "$K" "$EDITOR" base-editor 1 || fail=1
          rows crazyagent "$LINUX_GRAPH" base-linux-graph 1 || fail=1
          rows crazyagent "$LINUX_REFUSES" base-linux-refuses 1 || fail=1
          git checkout HEAD -- crates
          [ "$fail" = 0 ] || exit 1
