name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  C_RED: team::runtime::tests::hidden_seers_tests::a_held_live_master_starts_again_as_a_planned_restart
  C_GUARD: team::runtime::tests::hidden_seers_tests::a_held_sub_agent_or_master_that_is_not_live_plans_no_master_restart
  B_RED: team::runtime::tests::hidden_seers_tests::a_held_live_master_stays_down_until_restart_them
  B_GUARD: team::runtime::tests::hidden_seers_tests::a_live_master_that_is_not_held_still_starts
  TAKE: team::runtime::tests::hidden_seers_tests::a_pane_taken_over_after_a_folder_was_hidden_is_listed_by_what_its_record_hid
  PRODUCT: crates/crazyagent/src/team/runtime.rs crates/crazyagent/src/team/runtime/narrowing.rs
  GATE_SH: |
    set -uo pipefail
    name=$1
    log=$2
    n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
    echo "crate gate $name $n"
    [ "$n" -ge 1 ] || { echo "::error::$name did not build crazyagent"; exit 1; }
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -60 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red[0-9]*)
        line=${expect#red}
        [ "$rc" != 0 ] && grep -q "panicked at crates/crazyagent/src/team/runtime/hidden_seers_tests.rs:$line:" "$log" || { echo "::error::$name is not red at hidden_seers_tests.rs:$line"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: B23 held live master C and B rows on macos-15, two reds then tip
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='B fix %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = fc0ef5bca35dc4249e8dff6553296bf1a1041af5 ] || { echo "::error::the parent is not the B fix"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = 4b3ed9c0049970cc73442352d4b8f3faec35402b ] || { echo "::error::HEAD~2 is not the B rows"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = 49c3e164a6ed5cd3db87994c7f29a17b134c370d ] || { echo "::error::HEAD~3 is not the C fix"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = 5b6ea4327308a4b3df0451b4940ed81177ea3026 ] || { echo "::error::HEAD~4 is not the C rows"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = b2a48c0a537cb3e7e139bdb38f24272d6e8f46a2 ] || { echo "::error::HEAD~5 is not the base (reload fix)"; exit 1; }
          [ "$(git diff --name-only HEAD~5 HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/team/runtime.rs crates/crazyagent/src/team/runtime/hidden_seers_tests.rs crates/crazyagent/src/team/runtime/narrowing.rs scripts/quality/caps-allow.json " ] || { echo "::error::the range touches more than runtime.rs, narrowing.rs, hidden_seers_tests.rs and caps-allow.json"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the B tip"; exit 1; }
      - name: Write the row runner and the crate gate
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          printf '%s\n' "$GATE_SH" > "$RUNNER_TEMP/gate.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/gate.sh"
      - name: Line caps and sleeps at the base and the tip
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" HEAD~5
          set +e
          node scripts/quality/caps.mjs "$RUNNER_TEMP/base" > "$RUNNER_TEMP/caps-base.txt" 2>&1
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          node scripts/quality/sleeps.mjs "$RUNNER_TEMP/base" > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          set -e
          for f in caps-base caps-tip sleeps-base sleeps-tip; do echo "== $f"; cat "$RUNNER_TEMP/$f.txt"; done
          new=$(grep -v 'problem(s)' "$RUNNER_TEMP/caps-tip.txt" | grep -vxF -f "$RUNNER_TEMP/caps-base.txt" | grep -c . || true)
          snew=$(grep -v 'problem(s)' "$RUNNER_TEMP/sleeps-tip.txt" | grep -vxF -f "$RUNNER_TEMP/sleeps-base.txt" | grep -c . || true)
          touched=$(grep -cE 'team/runtime\.rs|runtime/narrowing\.rs|hidden_seers_tests\.rs' "$RUNNER_TEMP/caps-tip.txt" "$RUNNER_TEMP/sleeps-tip.txt" | awk -F: '{t+=$NF} END {print t+0}')
          echo "caps new lines $new sleeps new lines $snew caps lines naming touched files $touched"
          [ "$new" = 0 ] && [ "$snew" = 0 ] && [ "$touched" = 0 ] || { echo "::error::caps or sleeps report something new at the tip"; exit 1; }
          git worktree remove --force "$RUNNER_TEMP/base"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red for C, the product at b2a48c0a53 with the tip tests file
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git checkout b2a48c0a537cb3e7e139bdb38f24272d6e8f46a2 -- crates/crazyagent/src/team/runtime.rs crates/crazyagent/src/team/runtime/narrowing.rs
          [ "$(git diff --name-only HEAD^ | tr '\n' ' ')" = "$PRODUCT " ] || { echo "::error::the red tree differs from the tip in more than the product files"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build-red-c.log"
          bash "$RUNNER_TEMP/gate.sh" red-c-build "$RUNNER_TEMP/build-red-c.log"
          set +e
          all=0
          bash "$RUNNER_TEMP/rows.sh" c-red-at-base red297 --exact "$C_RED"
          rc=$?
          echo "c-red-at-base rc $rc"
          [ "$rc" = 0 ] || all=1
          bash "$RUNNER_TEMP/rows.sh" c-guard-at-base pass --exact "$C_GUARD"
          rc=$?
          echo "c-guard-at-base rc $rc"
          [ "$rc" = 0 ] || all=1
          bash "$RUNNER_TEMP/rows.sh" b-guard-at-base pass --exact "$B_GUARD"
          rc=$?
          echo "b-guard-at-base rc $rc"
          [ "$rc" = 0 ] || all=1
          git checkout HEAD^ -- crates/crazyagent/src/team/runtime.rs crates/crazyagent/src/team/runtime/narrowing.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the B tip"; exit 1; }
          echo "red-c step all $all"
          [ "$all" = 0 ]
      - name: Red for B, the product at the C tip 49c3e164a6 with the tip tests file
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git checkout 49c3e164a6ed5cd3db87994c7f29a17b134c370d -- crates/crazyagent/src/team/runtime.rs crates/crazyagent/src/team/runtime/narrowing.rs
          [ "$(git diff --name-only HEAD^ | tr '\n' ' ')" = "$PRODUCT " ] || { echo "::error::the red tree differs from the tip in more than the product files"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build-red-b.log"
          bash "$RUNNER_TEMP/gate.sh" red-b-build "$RUNNER_TEMP/build-red-b.log"
          set +e
          all=0
          bash "$RUNNER_TEMP/rows.sh" b-red-at-c red356 --exact "$B_RED"
          rc=$?
          echo "b-red-at-c rc $rc"
          [ "$rc" = 0 ] || all=1
          bash "$RUNNER_TEMP/rows.sh" b-guard-at-c pass --exact "$B_GUARD"
          rc=$?
          echo "b-guard-at-c rc $rc"
          [ "$rc" = 0 ] || all=1
          bash "$RUNNER_TEMP/rows.sh" c-red-at-c pass --exact "$C_RED"
          rc=$?
          echo "c-red-at-c rc $rc"
          [ "$rc" = 0 ] || all=1
          bash "$RUNNER_TEMP/rows.sh" c-guard-at-c pass --exact "$C_GUARD"
          rc=$?
          echo "c-guard-at-c rc $rc"
          [ "$rc" = 0 ] || all=1
          git checkout HEAD^ -- crates/crazyagent/src/team/runtime.rs crates/crazyagent/src/team/runtime/narrowing.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the B tip"; exit 1; }
          echo "red-b step all $all"
          [ "$all" = 0 ]
      - name: Build the engine lib tests at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the B tip"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build-tip.log"
          bash "$RUNNER_TEMP/gate.sh" tip-build "$RUNNER_TEMP/build-tip.log"
      - name: Tip, c-red-at-tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" c-red-at-tip pass --exact "$C_RED"
      - name: Tip, c-guard-at-tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" c-guard-at-tip pass --exact "$C_GUARD"
      - name: Tip, b-red-at-tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" b-red-at-tip pass --exact "$B_RED"
      - name: Tip, b-guard-at-tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" b-guard-at-tip pass --exact "$B_GUARD"
      - name: Tip, take-at-tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" take-at-tip pass --exact "$TAKE"
      - name: Tip, hidden_seers_tests, twelve rows
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/rows.sh" hidden-seers pass team::runtime::tests::hidden_seers_tests:: | tee "$RUNNER_TEMP/hidden-seers.out"
          grep -q '^hidden-seers expect pass listed 12 ' "$RUNNER_TEMP/hidden-seers.out" || { echo "::error::hidden_seers_tests did not list 12 rows"; exit 1; }
      - name: Tip, team graph tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" graph pass team::graph::tests::
      - name: Tip, clippy on the engine lib and its tests
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the B tip"; exit 1; }
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          bash "$RUNNER_TEMP/gate.sh" clippy "$RUNNER_TEMP/clippy.log"
          echo "clippy errors $(grep -cE '^error(\[|:)' "$RUNNER_TEMP/clippy.log" || true) warnings $(grep -cE '^warning(\[|:)' "$RUNNER_TEMP/clippy.log" || true)"
