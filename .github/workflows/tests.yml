name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"

defaults:
  run:
    shell: bash

jobs:
  runner-probe-linux:
    name: Runner facts for the G1 Linux reds (read-only, no tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on a self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Account, kernel, namespaces and ports
        run: |
          set -uo pipefail
          fact() { printf '== %s\n' "$1"; shift; "$@" 2>&1 || printf 'rc=%s\n' "$?"; }
          fact id id
          fact primary-group getent group "$(id -gn)"
          fact umask sh -c umask
          fact kernel uname -r
          fact os sed -n 1,2p /etc/os-release
          fact ptrace_scope cat /proc/sys/kernel/yama/ptrace_scope
          fact lsm cat /sys/kernel/security/lsm
          fact apparmor-enabled cat /sys/module/apparmor/parameters/enabled
          fact unprivileged_userns_clone cat /proc/sys/kernel/unprivileged_userns_clone
          fact apparmor_restrict_unprivileged_userns cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fact max_user_namespaces cat /proc/sys/user/max_user_namespaces
          fact ip_local_port_range cat /proc/sys/net/ipv4/ip_local_port_range
          fact tmp-mode stat -c '%a %U %G %n' /tmp
          printf '== tmpdir-set\n%s\n' "${TMPDIR:-unset}"
          scratch=$(mktemp -d)
          fact scratch-mode stat -c '%a %U %G' "$scratch"
          rmdir "$scratch"
      - name: Sandbox tools the Linux rows look for
        run: |
          set -uo pipefail
          fact() { printf '== %s\n' "$1"; shift; "$@" 2>&1 || printf 'rc=%s\n' "$?"; }
          fact bwrap command -v bwrap
          fact bwrap-version bwrap --version
          fact slirp4netns ls -l /usr/bin/slirp4netns
          fact slirp4netns-version /usr/bin/slirp4netns --version
          fact iptables-restore /usr/sbin/iptables-restore --version
          fact ip6tables-restore /usr/sbin/ip6tables-restore --version
          fact unshare-user-net unshare -Urn true
          fact bwrap-user-net bwrap --unshare-user --unshare-net --dev-bind / / true
          fact bwrap-nest bwrap --die-with-parent --unshare-user --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / --proc /proc true
          fact tmux command -v tmux
          fact tmux-version tmux -V
      - name: Does bwrap die with the thread that started it
        run: |
          set -uo pipefail
          python3 -I - <<'PY'
          import subprocess, threading, time
          def alive_after_thread(args):
              held = {}
              def start():
                  held["p"] = subprocess.Popen(args)
              t = threading.Thread(target=start)
              t.start()
              t.join()
              time.sleep(1)
              alive = held["p"].poll() is None
              held["p"].kill()
              held["p"].wait()
              return alive
          base = ["bwrap", "--unshare-user", "--unshare-pid", "--dev-bind", "/", "/", "sleep", "5"]
          print("== bwrap without --die-with-parent alive 1 s after its starting thread ended:", alive_after_thread(base))
          print("== bwrap with --die-with-parent alive 1 s after its starting thread ended:", alive_after_thread(base[:1] + ["--die-with-parent"] + base[1:]))
          PY
      - name: Descriptors a test inherits, plain and under the shard's keyring wrapper
        run: |
          set -uo pipefail
          echo "== plain"
          ls -l /proc/self/fd
          echo "== wrapped as scripts/ci/farm-rust-shard.sh runs nextest"
          dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' probe ls -l /proc/self/fd || echo "rc=$?"
      - name: Install Claude Code and Codex as the shards do
        run: bash scripts/ci/install-harnesses.sh
      - name: Harnesses a later step finds
        run: |
          set -uo pipefail
          for tool in claude codex node; do printf '== %s ' "$tool"; command -v "$tool" || echo missing; done
          printf '== CRAZYAGENT_CLAUDE set: %s\n' "${CRAZYAGENT_CLAUDE:+yes}"
          printf '== CRAZYAGENT_CODEX set: %s\n' "${CRAZYAGENT_CODEX:+yes}"
