name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: fc85d33786129e5245513b9e558d4d0c58fe2117
  BASE: 54e9bd33ff4827e9b1c8a5181dcdfea7a481cb46

defaults:
  run:
    shell: bash

jobs:
  owner-timeout-windows:
    name: owner-timeout windows fix fc85d3378, base 54e9bd33f red, clippy and bootstrap rows, windows-2022
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The crates are the tip
        run: git diff --quiet "$TIP" -- crates apps
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy at the base, red with E0425 on OWNER_TIMEOUT
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -u
          git checkout -q -f --detach "$BASE"
          echo "== BASE $(git log --oneline -1 | cut -c1-100)"
          out=$(cargo clippy -p crazyagent --lib --locked -- -D warnings 2>&1)
          rc=$?
          echo "  BASE clippy --lib rc=$rc E0425=$(printf '%s\n' "$out" | grep -c 'E0425') OWNER_TIMEOUT=$(printf '%s\n' "$out" | grep -c 'OWNER_TIMEOUT')"
          printf '%s\n' "$out" | grep -E -A8 '^error' | head -40 | cut -c1-300
          exit 0
      - name: Clippy at the fix, one target set per call
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -u
          git checkout -q -f --detach "$TIP"
          echo "== TIP $(git log --oneline -1 | cut -c1-100)"
          for set in "--lib" "--lib --tests"; do
            out=$(cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1)
            rc=$?
            echo "  TIP clippy $set rc=$rc"
            printf '%s\n' "$out" | grep -E -A8 '^(error|warning)' | head -40 | cut -c1-300
          done
          exit 0
      - name: The bootstrap rows at the fix
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -u
          git checkout -q -f --detach "$TIP"
          out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
          rc=$?
          echo "  TIP lib tests build rc=$rc"
          [ "$rc" -eq 0 ] || { printf '%s\n' "$out" | grep -E -m20 -A6 '^error' | cut -c1-300; exit 0; }
          exe=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src[\/\\]lib.rs (\(.*\))/\1/p' | tail -1)
          exe=${exe//\\//}
          echo "  exe $exe"
          "$exe" engine::bootstrap:: --list 2>/dev/null | grep -c ': test$' | sed 's/^/  bootstrap rows listed: /'
          "$exe" engine::bootstrap:: > "$RUNNER_TEMP/bootstrap.log" 2>&1
          echo "  TIP bootstrap rc=$? $(grep -m1 '^test result' "$RUNNER_TEMP/bootstrap.log" | cut -c1-120)"
          grep '^test .* FAILED$' "$RUNNER_TEMP/bootstrap.log" | sed 's/^/    /'
          exit 0
  owner-timeout-linux:
    name: owner-timeout windows fix fc85d3378 clippy lib and lib tests, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TIP: fc85d33786129e5245513b9e558d4d0c58fe2117
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy on the tip lib, then its lib tests
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -u
          bad=0
          for targets in "--lib" "--lib --tests"; do
            out=$(cargo clippy -p crazyagent $targets --locked -- -D warnings 2>&1)
            rc=$?
            echo "clippy $targets rc=$rc"
            printf '%s\n' "$out" | grep -E -A6 '^(error|warning)' | head -60 | cut -c1-300
            [ "$rc" -eq 0 ] || bad=1
          done
          exit "$bad"


