name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 06c4a0c5b05172cf0d276bdcc798b83c8d1acae7
  BASE: cb1e32eeec0f70f9e5b2478434e83e1579b2dbe1
  FILES: ".github/workflows/ci.yml Makefile crates/crazyagent/src/engine/native_auth_host/claude_auth/channel.rs crates/crazyagent/src/engine/native_auth_host/claude_auth/channel_actor_tests.rs crates/crazyagent/src/engine/owner/transport.rs crates/crazyagent/src/engine/owner/transport/account_profile.rs crates/crazyagent/src/engine/owner/transport/accounts.rs crates/crazyagent/src/engine/owner/transport/agents.rs crates/crazyagent/src/engine/owner/transport/app_plugins.rs crates/crazyagent/src/engine/owner/transport/barrier_tests.rs crates/crazyagent/src/engine/owner/transport/changes.rs crates/crazyagent/src/engine/owner/transport/cleanup.rs crates/crazyagent/src/engine/owner/transport/github.rs crates/crazyagent/src/engine/owner/transport/harness_catalog.rs crates/crazyagent/src/engine/owner/transport/harness_catalog/updates.rs crates/crazyagent/src/engine/owner/transport/icloud.rs crates/crazyagent/src/engine/owner/transport/ide.rs crates/crazyagent/src/engine/owner/transport/ide_extensions.rs crates/crazyagent/src/engine/owner/transport/ide_tab.rs crates/crazyagent/src/engine/owner/transport/intake.rs crates/crazyagent/src/engine/owner/transport/intake_parallel_tests.rs crates/crazyagent/src/engine/owner/transport/master_auto_dispatch_tests.rs crates/crazyagent/src/engine/owner/transport/master_dispatch_tests.rs crates/crazyagent/src/engine/owner/transport/master_runtime/routing_tests.rs crates/crazyagent/src/engine/owner/transport/native_auth.rs crates/crazyagent/src/engine/owner/transport/native_auth_channel.rs crates/crazyagent/src/engine/owner/transport/native_auth_channel_tests.rs crates/crazyagent/src/engine/owner/transport/native_auth_dispatch_lifetime_tests.rs crates/crazyagent/src/engine/owner/transport/overview.rs crates/crazyagent/src/engine/owner/transport/owner_server_tests.rs crates/crazyagent/src/engine/owner/transport/plugins.rs crates/crazyagent/src/engine/owner/transport/process.rs crates/crazyagent/src/engine/owner/transport/questions.rs crates/crazyagent/src/engine/owner/transport/recovery.rs crates/crazyagent/src/engine/owner/transport/recovery_tests.rs crates/crazyagent/src/engine/owner/transport/reply_skew_tests.rs crates/crazyagent/src/engine/owner/transport/roadmap.rs crates/crazyagent/src/engine/owner/transport/secret_storage_wait_tests.rs crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/engine/owner/transport/usage.rs crates/crazyagent/src/engine/owner/transport/usage_tests.rs crates/crazyagent/src/engine/owner/transport/watch.rs crates/crazyagent/src/engine/owner/transport/watch_tests.rs crates/crazyagent/src/engine/secret_frame.rs crates/crazyagent/src/ide/bridge.rs crates/crazyagent/src/ide/bridge/terminal.rs crates/crazyagent/src/ide/bridge/tests.rs crates/crazyagent/src/ide/server/tests.rs crates/crazyagent/tests/owner_bootstrap.rs crates/crazyagent/tests/owner_client.rs crates/crazyagent/tests/project_conversation.rs crates/crazyagent/tests/trusted_worker_dispatch.rs scripts/quality/caps-allow.json scripts/quality/owner-packets.mjs scripts/quality/owner-packets.test.mjs "

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: OWNER-PACKET clippy on windows-2022 (no rows step, no new row in this ticket)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, Windows clippy on the crazyagent lib and its tests (expect rc 0 and 0 errors under -D warnings, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/tip-clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
          echo "CLIPPY rc $rc errors $errors warnings $warnings checked crazyagent $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Gate, clippy checked crazyagent (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$RUNNER_TEMP"/tip-clippy.log || true)
          echo "GATE Checking or Compiling crazyagent $n"
          [ "$n" -ge 1 ]
  macos:
    name: OWNER-PACKET clippy on macos-15 (no rows step, no new row in this ticket)
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, macOS clippy on the crazyagent lib and its tests (expect rc 0 and 0 errors under -D warnings, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/tip-clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
          echo "CLIPPY rc $rc errors $errors warnings $warnings checked crazyagent $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Gate, clippy checked crazyagent (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$RUNNER_TEMP"/tip-clippy.log || true)
          echo "GATE Checking or Compiling crazyagent $n"
          [ "$n" -ge 1 ]
