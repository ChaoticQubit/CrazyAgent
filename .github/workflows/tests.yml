name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  LAND_TIP: 731aea438
  R1_LAND: e565c2a70

defaults:
  run:
    shell: bash

jobs:
  n2a-land:
    name: V244 N2a land tips e565c2a70 and 731aea438 on ${{ matrix.runner }}, held rows and clippy
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Keep the row checker outside the tree
        run: |
          set -euo pipefail
          cp .github/farm/v244-win-signin-n2a-r2-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the r2 land tip, which contains the r1 land tip
        run: |
          set -euo pipefail
          git diff --quiet "$LAND_TIP" -- crates
          git merge-base --is-ancestor "$R1_LAND" "$LAND_TIP"
          rustc --version
          echo "crates at $LAND_TIP, which contains $R1_LAND"
      - name: Clippy on the crazyagent library at 731aea438
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$LAND_TIP" -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows at 731aea438
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$LAND_TIP" -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Clippy on crazyagent-win-sandbox, all targets, at 731aea438
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$LAND_TIP" -- crates
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: N2a held rows at 731aea438
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$LAND_TIP" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: > "$RUNNER_TEMP/tip.log" 2>&1
          set -e
          bash "$RUNNER_TEMP/rows.sh" tip "$RUNNER_TEMP/tip.log"
