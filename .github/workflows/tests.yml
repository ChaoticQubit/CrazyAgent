name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: a55d4a3cdfd643a79597237ba096784d007fbab0
  BASE_FULL: 109dd3595d5e70b344ff05450e4edaa01654e418
  WORDS_FILE: crates/crazyagent/src/app_plugins/words.rs
  WORDS_ROW: "app_plugins::words_tests::every_permission_has_plain_words_and_no_row_is_stale"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: PERMISSION-WORDS-SANDBOX ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
          - os: windows-2022
            leg: win
            cache: Windows
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -2 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE_FULL" ] || { echo "::error::HEAD~2 is not chore/v250 109dd3595d"; exit 1; }
          changed="$(git diff --name-only "$BASE_FULL" HEAD^ | tr '\n' ' ')"
          [ "$changed" = "$WORDS_FILE " ] || { echo "::error::the ticket range is not words.rs alone: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark words.rs newer than the restored cache, so cargo rebuilds crazyagent
        run: |
          set -euo pipefail
          sleep 2
          touch "$WORDS_FILE"
          ls -l "$WORDS_FILE"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt check of words.rs (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg == 'linux' }}
        run: |
          set +e
          rustfmt --edition 2024 --check "$WORDS_FILE"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent --lib --tests with warnings denied on this system (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings crazyagent checked $app"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$app" -ge 1 ] || exit 1
      - name: The words row at tip by exact name (expect passed 1)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/words.log"
          cargo test -p crazyagent --lib --locked -- --exact "$WORDS_ROW" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|has no words|is no permission|left:|right:' "$log" | head -n 20 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true; tail -n 20 "$log"; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "words tip rc $code passed $passed failed $failed built $built"
          [ "$code" = 0 ] && [ "$passed" = 1 ] && [ "$failed" = 0 ] && [ "$built" -ge 1 ] || exit 1
      - name: Red, the words row over the base words.rs (expect failed 1, sandbox.save_settings has no words)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          git show "$BASE_FULL:$WORDS_FILE" > "$WORDS_FILE"
          git diff --stat HEAD^
          sleep 2
          touch "$WORDS_FILE"
          log="$RUNNER_TEMP/words-red.log"
          cargo test -p crazyagent --lib --locked -- --exact "$WORDS_ROW" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|has no words|is no permission|left:|right:' "$log" | head -n 20 || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          named="$(grep -cxF "test $WORDS_ROW ... FAILED" "$log" || true)"
          said="$(grep -cxF "sandbox.save_settings has no words" "$log" || true)"
          echo "red rc $code failed $failed named $named said $said built $built"
          git checkout HEAD^ -- "$WORDS_FILE"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 1 ] && [ "$named" = 1 ] && [ "$said" -ge 1 ] && [ "$built" -ge 1 ] || exit 1
