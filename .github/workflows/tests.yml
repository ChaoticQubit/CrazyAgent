---
name: Tests
true:
  push:
    branches:
    - test-farm/**
  workflow_dispatch: 
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
defaults:
  run:
    shell: bash
jobs:
  linux:
    name: POD-D D2b rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Refuse a runner that is not GitHub-hosted
      run: |
        set -euo pipefail
        [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Show the commit under test
      run: |
        set -euo pipefail
        git log -1 --format='%H %s'
    - name: Install Linux packages
      timeout-minutes: 10
      run: bash scripts/ci/linux-packages.sh
    - name: Install Rust toolchain
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
          [ "$attempt" -lt 3 ] || exit 1
          sleep 20
        done
        [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
        {
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
          echo "CARGO_PROFILE_DEV_DEBUG=0"
          echo "CARGO_PROFILE_TEST_DEBUG=0"
        } >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: farm
        shared-key: linux
        add-job-id-key: false
        add-rust-environment-hash-key: false
        cache-bin: false
        save-if: false
    - name: clippy kernel security and common
      if: "${{ !cancelled() }}"
      timeout-minutes: 75
      run: |
        set +e
        cargo clippy -p crazyagent-kernel-security -p crazyagent-kernel-common --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rows.log"
        code=${PIPESTATUS[0]}
        set -e
        echo "clippy kernel security and common on ubuntu-22.04: rc $code"
        grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
        [ "$code" -eq 0 ]
    - name: clippy engine
      if: "${{ !cancelled() }}"
      timeout-minutes: 75
      run: |
        set +e
        cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rows.log"
        code=${PIPESTATUS[0]}
        set -e
        echo "clippy engine on ubuntu-22.04: rc $code"
        grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
        [ "$code" -eq 0 ]
    - name: kernel security rows
      if: "${{ !cancelled() }}"
      timeout-minutes: 75
      run: |
        set +e
        cargo test -p crazyagent-kernel-security --locked 2>&1 | tee "$RUNNER_TEMP/rows.log"
        code=${PIPESTATUS[0]}
        set -e
        echo "kernel security rows on ubuntu-22.04: rc $code"
        grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
        [ "$code" -eq 0 ]
    - name: kernel common rows
      if: "${{ !cancelled() }}"
      timeout-minutes: 75
      run: |
        set +e
        cargo test -p crazyagent-kernel-common --locked 2>&1 | tee "$RUNNER_TEMP/rows.log"
        code=${PIPESTATUS[0]}
