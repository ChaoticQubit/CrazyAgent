name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED1_SHA: 313b41dee137ca67142263377f453dd9fe44a4d3
  RED2_SHA: a6c594307c3f8594a5edf15c28a74e9489d71a8e
  ROWS: planning::prompt::windows_tests memory::import::windows_tests usage::capture::windows_tests ide::extensions::windows_tests agent_home::tests::an_instruction_file_that_is_a_link

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows plain-read rows, ${{ matrix.side }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red1, red2, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'red1' && env.RED1_SHA || matrix.side == 'red2' && env.RED2_SHA || github.sha }}
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rows, and clippy on the green side
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/plain-reads-windows-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          read -ra rows <<< "$ROWS"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- "${rows[@]}" 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          prompt="planning::prompt::windows_tests::a_prompt_file_swapped_for_a_link_opens_as_the_link_and_is_no_regular_file"
          memory="memory::import::windows_tests::a_memory_file_that_is_a_link_is_not_read"
          usage="usage::capture::windows_tests::a_usage_record_that_is_a_link_is_not_opened"
          extension="ide::extensions::windows_tests::an_extension_file_that_is_a_link_is_not_opened"
          home="agent_home::tests::an_instruction_file_that_is_a_link_is_refused_and_never_read_through"
          if [ "$SIDE" = red1 ]; then
            grep -q "^test $prompt \.\.\. FAILED" "$out" && grep -q "^test $memory \.\.\. ok" "$out" && grep -q "^test $usage \.\.\. ok" "$out"
            want=$?
            printf '| red1 side 313b41dee | exit |\n| --- | --- |\n| rows (prompt row must fail, memory and usage pass) | %s |\n| expectation met (0 = yes) | %s |\n' "$rc" "$want" >> "$GITHUB_STEP_SUMMARY"
            exit "$want"
          fi
          if [ "$SIDE" = red2 ]; then
            grep -q "^test $extension \.\.\. FAILED" "$out" && grep -q "^test $home \.\.\. ok" "$out" && grep -q "^test $prompt \.\.\. ok" "$out"
            want=$?
            printf '| red2 side a6c594307 | exit |\n| --- | --- |\n| rows (extension row must fail, instruction and r1 rows pass) | %s |\n| expectation met (0 = yes) | %s |\n' "$rc" "$want" >> "$GITHUB_STEP_SUMMARY"
            exit "$want"
          fi
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --all-targets --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          printf '| green side | exit |\n| --- | --- |\n| rows | %s |\n| clippy -p crazyagent --all-targets -D warnings | %s |\n' "$rc" "$clip" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] && [ "$clip" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-plain-reads-windows-${{ matrix.side }}
          path: ${{ runner.temp }}/plain-reads-windows-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux rows of the changed reads and clippy, green side
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rows and clippy
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/plain-reads-linux.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- memory::import planning::tests::a_prompt_file usage::capture agent_home 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --all-targets --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          printf '| Linux | exit |\n| --- | --- |\n| memory::import + planning prompt FIFO row + usage::capture + agent_home | %s |\n| clippy -p crazyagent --all-targets -D warnings | %s |\n' "$rc" "$clip" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] && [ "$clip" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-plain-reads-linux
          path: ${{ runner.temp }}/plain-reads-linux.txt
          if-no-files-found: warn
          retention-days: 14
