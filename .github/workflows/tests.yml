name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  busy-clippy-linux:
    name: storage-busy tip 78eedb379 clippy lib and lib tests, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TIP: 78eedb3797c70e67b387060aeb102f1c5971646e
      BASE: 8a3fec97383a266417279aa926d69f91d85dacf0
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy on the tip lib, then its lib tests
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -u
          bad=0
          for profile in dev test; do
            out=$(cargo clippy -p crazyagent --lib --profile "$profile" --locked -- -D warnings 2>&1)
            rc=$?
            echo "clippy lib profile $profile rc=$rc"
            printf '%s\n' "$out" | grep -E -A6 '^(error|warning)' | head -60 | cut -c1-300
            [ "$rc" -eq 0 ] || bad=1
          done
          exit "$bad"

  busy-import-linux:
    name: r2 rows and modules once at tip 78eedb379, home row red without 71b10c000, record row red at 48ba3c750, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TIP: 78eedb3797c70e67b387060aeb102f1c5971646e
      BASE: 8a3fec97383a266417279aa926d69f91d85dacf0
      ROW_FIX: 78eedb3797c70e67b387060aeb102f1c5971646e
      RECORD_RED: 48ba3c7506def8b1510fe5217932284052a3fbe1
      HOME_RED: c532e2da6a84b00ecc068a53706fbd8e86a5f7b1
      MODULES: "engine::owner::transport:: storage:: project_setup:: projects_home:: engine::tests::"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Tip rows, then the modules once, under the keyring
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          set -u
          bad=0
          at=TIP
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          libbin() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
            rc=$?
            echo "  lib build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error\|^warning" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)"
          }
          bins() {
            for bin in crazyagent crazyagent-landlock; do
              cargo build -p crazyagent --bin "$bin" --locked > "$RUNNER_TEMP/bin.log" 2>&1
              rc=$?
              echo "  bin $bin rc=$rc"
              [ "$rc" -eq 0 ] || { tail -20 "$RUNNER_TEMP/bin.log" | cut -c1-300; return 1; }
            done
            export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent"
          }
          runs() {
            name=$1
            times=$2
            want=$3
            fails=0
            shown=0
            for i in $(seq 1 "$times"); do
              out=$(keyring "$lib" --exact "$name" 2>&1)
              rc=$?
              if ! printf '%s\n' "$out" | grep -qx 'running 1 test'; then
                echo "    ${name##*::}: not exactly one test at $at"
                bad=1
                return
              fi
              if [ "$rc" -ne 0 ]; then
                fails=$((fails + 1))
                if [ "$shown" -eq 0 ]; then
                  printf '%s\n' "$out" | grep -A8 'panicked at' | head -12 | cut -c1-300 | sed 's/^/      /'
                  shown=1
                fi
              fi
            done
            echo "    ${name##*::} at $at: $fails of $times failed (want $want)"
            case "$want" in
              green) [ "$fails" -eq 0 ] || bad=1 ;;
              red) [ "$fails" -eq "$times" ] || bad=1 ;;
            esac
          }
          T=engine::owner::transport
          W=$T::secret_storage_wait_tests
          D=$T::owner_deadline_tests
          E=engine::tests
          old=(
            "$D::a_skill_import_slower_than_the_owner_deadline_answers_with_the_skill red"
            "$W::a_server_added_with_secrets_while_storage_is_busy_is_withdrawn_with_every_one_of_them red"
            "$W::a_server_secret_replaced_while_storage_is_busy_is_withdrawn_and_keeps_only_the_old_one red"
            "$W::an_account_removed_while_storage_is_busy_leaves_no_key_on_disk red"
            "$W::a_server_removed_while_storage_is_busy_leaves_none_of_its_secrets_on_disk any"
            "$W::a_server_secret_removed_while_storage_is_busy_leaves_no_file_on_disk any"
            "$W::a_checked_server_removed_while_storage_is_busy_leaves_no_check_folder any"
          )
          control=$W::an_account_added_while_storage_is_busy_is_withdrawn_and_leaves_no_key
          dropped=$E::an_apply_its_caller_drops_while_queued_is_withdrawn_and_never_lands
          dropped_narrowing=$E::a_narrowing_job_its_caller_drops_while_queued_still_lands
          cut=$E::an_apply_behind_busy_storage_is_refused_before_its_requests_cut
          cut_narrowing=$E::a_narrowing_job_behind_busy_storage_is_pending_before_its_requests_cut_and_lands
          import_bound=$D::a_skill_import_storage_never_takes_is_refused_before_its_serve_bound_cuts_it
          import_slow=$D::a_skill_import_slower_than_the_owner_deadline_answers_with_the_skill
          home_cut=$T::barrier_tests::a_folder_add_whose_plan_storage_cannot_take_is_refused_unsent_and_moves_nothing
          plugin_flight=$T::barrier_tests::a_revocation_waits_for_a_plugin_change_in_flight_and_refuses_the_next
          new_record=$T::barrier_tests::a_new_project_record_its_cut_drops_lands_once_storage_is_free
          git merge-base --is-ancestor "$ROW_FIX" "$TIP" || exit 1
          echo "== TIP $(git log --oneline -1 | cut -c1-100)"
          lib=$(libbin) || exit 1
          bins || exit 1
          runs "$new_record" 5 green
          runs "$home_cut" 5 green
          read -r -a filters <<< "$MODULES"
          out=$(keyring "$lib" "${filters[@]}" 2>&1)
          rc=$?
          echo "  modules rc=$rc $(printf '%s\n' "$out" | grep -m1 '^test result' | cut -c1-140)"
          printf '%s\n' "$out" | grep '^test .* FAILED$' | cut -c1-200 | sed 's/^/    /'
          printf '%s\n' "$out" | grep -A8 'panicked at' | head -60 | cut -c1-6000 | sed 's/^/      /'
          [ "$rc" -eq 0 ] || bad=1
          exit "$bad"
      - name: The folder add row red at the tip with projects_home.rs before 71b10c000
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        run: |
          set +e
          set -u
          bad=0
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          libbin() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
            rc=$?
            echo "  lib build rc=$rc" >&2
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error\|^warning" | cut -c1-300 | sed 's/^/    /' >&2
            [ "$rc" -eq 0 ] || return 1
            realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)"
          }
          bins() {
            for bin in crazyagent crazyagent-landlock; do
              cargo build -p crazyagent --bin "$bin" --locked > "$RUNNER_TEMP/bin.log" 2>&1
              rc=$?
              echo "  bin $bin rc=$rc"
              [ "$rc" -eq 0 ] || { tail -20 "$RUNNER_TEMP/bin.log" | cut -c1-300; return 1; }
            done
            export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent"
          }
          runs() {
            name=$1
            times=$2
            want=$3
            fails=0
            shown=0
            for i in $(seq 1 "$times"); do
              out=$(keyring "$lib" --exact "$name" 2>&1)
              rc=$?
              if ! printf '%s\n' "$out" | grep -qx 'running 1 test'; then
                echo "    ${name##*::}: not exactly one test at $at"
                bad=1
                return
              fi
              if [ "$rc" -ne 0 ]; then
                fails=$((fails + 1))
                if [ "$shown" -eq 0 ]; then
                  printf '%s\n' "$out" | grep -A8 'panicked at' | head -12 | cut -c1-300 | sed 's/^/      /'
                  shown=1
                fi
              fi
            done
            echo "    ${name##*::} at $at: $fails of $times failed (want $want)"
            case "$want" in
              green) [ "$fails" -eq 0 ] || bad=1 ;;
              red) [ "$fails" -eq "$times" ] || bad=1 ;;
            esac
          }
          T=engine::owner::transport
          W=$T::secret_storage_wait_tests
          D=$T::owner_deadline_tests
          E=engine::tests
          old=(
            "$D::a_skill_import_slower_than_the_owner_deadline_answers_with_the_skill red"
            "$W::a_server_added_with_secrets_while_storage_is_busy_is_withdrawn_with_every_one_of_them red"
            "$W::a_server_secret_replaced_while_storage_is_busy_is_withdrawn_and_keeps_only_the_old_one red"
            "$W::an_account_removed_while_storage_is_busy_leaves_no_key_on_disk red"
            "$W::a_server_removed_while_storage_is_busy_leaves_none_of_its_secrets_on_disk any"
            "$W::a_server_secret_removed_while_storage_is_busy_leaves_no_file_on_disk any"
            "$W::a_checked_server_removed_while_storage_is_busy_leaves_no_check_folder any"
          )
          control=$W::an_account_added_while_storage_is_busy_is_withdrawn_and_leaves_no_key
          dropped=$E::an_apply_its_caller_drops_while_queued_is_withdrawn_and_never_lands
          dropped_narrowing=$E::a_narrowing_job_its_caller_drops_while_queued_still_lands
          cut=$E::an_apply_behind_busy_storage_is_refused_before_its_requests_cut
          cut_narrowing=$E::a_narrowing_job_behind_busy_storage_is_pending_before_its_requests_cut_and_lands
          import_bound=$D::a_skill_import_storage_never_takes_is_refused_before_its_serve_bound_cuts_it
          import_slow=$D::a_skill_import_slower_than_the_owner_deadline_answers_with_the_skill
          home_cut=$T::barrier_tests::a_folder_add_whose_plan_storage_cannot_take_is_refused_unsent_and_moves_nothing
          plugin_flight=$T::barrier_tests::a_revocation_waits_for_a_plugin_change_in_flight_and_refuses_the_next
          new_record=$T::barrier_tests::a_new_project_record_its_cut_drops_lands_once_storage_is_free
          at=HOME_RED
          git checkout -q -f --detach "$TIP"
          file=crates/crazyagent/src/engine/owner/transport/projects_home.rs
          git checkout -q "$HOME_RED" -- "$file"
          changed=$(git diff --name-only HEAD)
          uses=$(grep -c 'by_deadline' "$file")
          echo "== $at $(git log --oneline -1 | cut -c1-80) with $file from $(git log --oneline -1 "$HOME_RED" | cut -c1-12): changed [$changed], by_deadline uses $uses"
          git diff --stat HEAD | cat
          [ "$changed" = "$file" ] && [ "$uses" -eq 0 ] || exit 1
          lib=$(libbin) || exit 1
          bins || exit 1
          runs "$home_cut" 2 red
          git checkout -q -f "$TIP"
          exit "$bad"
      - name: The New Project record row red at its red commit 48ba3c750
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        run: |
          set +e
          set -u
          bad=0
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          libbin() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
