name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  BASE_SHA: 21edbc379a8b6cf3196260d493f9279a7f0ce994
  ROW: engine::owner::transport::setup::install_tests::fixes_of_two_tools_run_together_and_the_same_tool_twice_is_busy
  RUNS: "10"

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux two-fixes row, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [base, tip]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the side
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          [ "$SIDE" = base ] && git checkout --detach "$BASE_SHA"
          git log --oneline -1
          grep -n "fn note" -A 8 crates/crazyagent/src/engine/owner/transport/setup.rs | grep -E "writeln!|write_all"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The row RUNS times and its expected results
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          out="$RUNNER_TEMP/two-fixes-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib --no-run 2>&1 | tail -3
          for i in $(seq 1 "$RUNS"); do
            cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib -- --exact "$ROW" 2>&1 | tee -a "$out"
          done
          ok=$(grep -cE "^test $ROW \.\.\. ok$" "$out")
          failed=$(grep -cE "^test $ROW \.\.\. FAILED$" "$out")
          verdict=pass
          case "$SIDE" in
            base) [ "$failed" -ge 1 ] && [ $((ok + failed)) = "$RUNS" ] || verdict=fail ;;
            tip) [ "$ok" = "$RUNS" ] && [ "$failed" = 0 ] || verdict=fail ;;
          esac
          grep -m3 -E "start fix [a-z]+start fix" "$out"
          { echo "| side | ok | failed | runs | verdict |"; echo "| --- | --- | --- | --- | --- |"; echo "| $SIDE | $ok | $failed | $RUNS | $verdict |"; } >> "$GITHUB_STEP_SUMMARY"
          echo "VERDICT $SIDE ok=$ok failed=$failed runs=$RUNS verdict=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-two-fixes-${{ matrix.side }}
          path: ${{ runner.temp }}/two-fixes-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
