name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    if: false
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}

  build-macos:
    if: false
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      matrix:
        include:
          - os: macos
            runner: macos-15
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}

  build-windows:
    if: false
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-2022
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}

  rust-linux:
    name: Rust ${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }}
    needs: build-linux
    if: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            part: 1
            parts: 4
          - os: linux
            runner: ubuntu-22.04
            part: 2
            parts: 4
          - os: linux
            runner: ubuntu-22.04
            part: 3
            parts: 4
          - os: linux
            runner: ubuntu-22.04
            part: 4
            parts: 4
    env:
      FARM_JUNIT: target/nextest/farm/junit.xml
      FARM_PART: ${{ matrix.os }}-rust-${{ matrix.part }}
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: ./.github/actions/rust-shard
        with:
          os: ${{ matrix.os }}
          part: ${{ matrix.part }}
          parts: ${{ matrix.parts }}
          node-version: ${{ env.NODE_VERSION }}

  rust-macos:
    name: Rust ${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }}
    needs: build-macos
    if: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            part: 1
            parts: 3
          - os: macos
            runner: macos-15
            part: 2
            parts: 3
          - os: macos
            runner: macos-15
            part: 3
            parts: 3
    env:
      FARM_JUNIT: target/nextest/farm/junit.xml
      FARM_PART: ${{ matrix.os }}-rust-${{ matrix.part }}
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
          echo "confined-step git, which xcode-select does not move: $(/Library/Developer/CommandLineTools/usr/bin/git --version || echo missing)"
      - uses: ./.github/actions/rust-shard
        with:
          os: ${{ matrix.os }}
          part: ${{ matrix.part }}
          parts: ${{ matrix.parts }}
          node-version: ${{ env.NODE_VERSION }}

  rust-windows:
    name: Rust ${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }}
    needs: build-windows
    if: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
            part: 1
            parts: 3
          - os: windows
            runner: windows-2022
            part: 2
            parts: 3
          - os: windows
            runner: windows-2022
            part: 3
            parts: 3
    env:
      FARM_JUNIT: target/nextest/farm/junit.xml
      FARM_PART: ${{ matrix.os }}-rust-${{ matrix.part }}
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-shard
        with:
          os: ${{ matrix.os }}
          part: ${{ matrix.part }}
          parts: ${{ matrix.parts }}
          node-version: ${{ env.NODE_VERSION }}

  node:
    if: false
    name: Node ${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            part: 1
            parts: 2
            chrome: linux64
            chrome_sha256: ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8
            headless_sha256: 3cfc2bd00d1bafcf8a68dc74c9c92bb7150ddc8d26ade948a776316e1cec4f14
          - os: linux
            runner: ubuntu-22.04
            part: 2
            parts: 2
            chrome: linux64
            chrome_sha256: ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8
            headless_sha256: 3cfc2bd00d1bafcf8a68dc74c9c92bb7150ddc8d26ade948a776316e1cec4f14
          - os: macos
            runner: macos-15
            part: 1
            parts: 1
            chrome: mac-arm64
            chrome_sha256: 01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef
            headless_sha256: cb46a336dbe3d6f1339c5039c3083e4e5dd8e4379710790e34f8f4a865e2452d
    env:
      FARM_JUNIT: ${{ github.workspace }}/farm-junit/node.xml
      FARM_PART: ${{ matrix.os }}-node-${{ matrix.part }}
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.RCLI_SOURCE_REPOSITORY }}
          ref: ${{ env.RCLI_SOURCE_REVISION }}
          path: .local-state/tools/rcli-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install IDE extension dependencies
        working-directory: apps/ide-extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install rcli source dependencies
        working-directory: .local-state/tools/rcli-source
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Install the pinned Chrome for Testing
        env:
          CHROME_PLATFORM: ${{ matrix.chrome }}
          CHROME_SHA256: ${{ matrix.chrome_sha256 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/$CHROME_PLATFORM/chrome-$CHROME_PLATFORM.zip"
          echo "$CHROME_SHA256  $work/chrome.zip" | shasum -a 256 -c -
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "$work/chrome.zip" "$work"
            chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          else
            unzip -q "$work/chrome.zip" -d "$work"
            chrome="$work/chrome-linux64/chrome"
          fi
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Install Linux packages
        if: matrix.os == 'linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install tmux on macOS
        if: matrix.os == 'macos'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install the pinned Chrome headless shell for the PDF rows
        env:
          HEADLESS_PLATFORM: ${{ matrix.chrome }}
          HEADLESS_SHA256: ${{ matrix.headless_sha256 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome-headless-shell"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/headless.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/$HEADLESS_PLATFORM/chrome-headless-shell-$HEADLESS_PLATFORM.zip"
          echo "$HEADLESS_SHA256  $work/headless.zip" | shasum -a 256 -c -
          if [ "$RUNNER_OS" = macOS ]; then ditto -x -k "$work/headless.zip" "$work"; else unzip -q "$work/headless.zip" -d "$work"; fi
          shell="$work/chrome-headless-shell-$HEADLESS_PLATFORM/chrome-headless-shell"
          "$shell" --version
          echo "CRAZYAGENT_PDF_CHROME=$shell" >> "$GITHUB_ENV"
      - name: Run this share of the node suites
        timeout-minutes: 60
        env:
          BUN: ${{ steps.bun.outputs.bun-path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FARM_JUNIT")"
          limit=""
          if [ "$RUNNER_OS" = macOS ]; then limit="--test-timeout=$NODE_TEST_TIMEOUT_MACOS_MS"; fi
          make test-node BUN="$BUN" NODE_TEST_ARGS="--test-shard=${{ matrix.part }}/${{ matrix.parts }} --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=$FARM_JUNIT $limit"
      - name: Keep a JUnit report for this part
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FARM_JUNIT")"
          if [ ! -s "$FARM_JUNIT" ]; then
            printf '<testsuites><testcase classname="farm" name="%s wrote no JUnit report"><failure/></testcase></testsuites>\n' "$FARM_PART" > "$FARM_JUNIT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-junit-${{ env.FARM_PART }}
          path: ${{ env.FARM_JUNIT }}
          if-no-files-found: error
          retention-days: 14

  typecheck:
    if: false
    name: Desktop typecheck and Bun suites
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FARM_JUNIT: ${{ github.workspace }}/farm-junit/bun.xml
      FARM_PART: linux-bun-1
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.RCLI_SOURCE_REPOSITORY }}
          ref: ${{ env.RCLI_SOURCE_REVISION }}
          path: .local-state/tools/rcli-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Install rcli source dependencies
        if: always()
        working-directory: .local-state/tools/rcli-source
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the Bun suites
        if: always()
        env:
          BUN: ${{ steps.bun.outputs.bun-path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FARM_JUNIT")"
          make test-bun BUN="$BUN" BUN_TEST_ARGS="--reporter=junit --reporter-outfile=$FARM_JUNIT"
      - name: Keep a JUnit report for this part
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FARM_JUNIT")"
          if [ ! -s "$FARM_JUNIT" ]; then
            printf '<testsuites><testcase classname="farm" name="%s wrote no JUnit report"><failure/></testcase></testsuites>\n' "$FARM_PART" > "$FARM_JUNIT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-junit-${{ env.FARM_PART }}
          path: ${{ env.FARM_JUNIT }}
          if-no-files-found: error
          retention-days: 14

  report:
    name: Test farm report
    needs: [build-linux, build-macos, build-windows, rust-linux, rust-macos, rust-windows, node, typecheck]
    if: false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: farm-junit-*
          path: ${{ runner.temp }}/junit
      - name: Write the summary table
        env:
          FARM_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/junit"
          node scripts/ci/junit-summary.mjs "$RUNNER_TEMP/junit" | tee -a "$GITHUB_STEP_SUMMARY"

  npm-boundary-proof:
    name: Npm boundary proof ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Put back the base workflow so the tree is the base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = 691d62fa44d92550df2878a070531e470d19fd28
          test "$(git diff --name-only HEAD~1 HEAD)" = .github/workflows/tests.yml
          git checkout HEAD~1 -- .github/workflows/tests.yml
          git diff --quiet HEAD~1
      - name: Show the Node folder and Program Files access lists
        shell: pwsh
        run: |
          foreach ($path in @($env:ProgramFiles, (Join-Path $env:ProgramFiles 'nodejs'))) {
            Write-Host "==== $path"
            icacls $path
            $acl = Get-Acl -LiteralPath $path
            Write-Host "owner $($acl.Owner) protected $($acl.AreAccessRulesProtected)"
          }
          where.exe node
          node -v
          $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Node.js*' } | Format-List DisplayName, DisplayVersion, InstallLocation, InstallSource, InstallDate, Publisher
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the engine lib tests and the boundary helper beside them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = cargo test -p crazyagent --lib --no-run --locked --message-format=json
          if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed with $LASTEXITCODE" }
          $exe = $lines | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'crazyagent' -and $_.profile.test -and $_.executable } | Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe) { throw 'no crazyagent lib test binary' }
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          if ($LASTEXITCODE -ne 0) { throw "helper build failed with $LASTEXITCODE" }
          Copy-Item -LiteralPath target\debug\crazyagent-win-boundary.exe -Destination (Split-Path -Parent $exe) -Force
          Write-Host "engine tests $exe"
          "ENGINE_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Run the npm row as a standard local user, then again once all packages read the Node folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'castd'
          $alphabet = [char[]]'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = (-join (1..24 | ForEach-Object { $alphabet | Get-Random })) + 'aZ7!'
          net user $user $password /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net user failed with $LASTEXITCODE" }
          $admins = net localgroup Administrators
          if ($admins -contains $user) { throw "$user is an administrator" }
          icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)(RX)" /C /Q | Out-Null
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $logs = Join-Path $env:RUNNER_TEMP 'standard-user'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $script:codes = [ordered]@{}
          function Invoke-AsUser([string]$name, [string]$program, [string[]]$arguments) {
            $start = [System.Diagnostics.ProcessStartInfo]::new($program)
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $start.UserName = $user
            $start.Domain = '.'
            $start.Password = $secure
            $start.LoadUserProfile = $true
            $start.UseShellExecute = $false
            $start.WorkingDirectory = $env:GITHUB_WORKSPACE
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            try {
              $process = [System.Diagnostics.Process]::Start($start)
            } catch {
              Write-Host "==== $name did not start: $($_.Exception.Message)"
              $script:codes[$name] = 'not started'
              return
            }
            $out = $process.StandardOutput.ReadToEndAsync()
            $err = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(1800000)) { $process.Kill($true) }
            $process.WaitForExit()
            Set-Content -LiteralPath (Join-Path $logs "$name.out.txt") -Value $out.Result
            Set-Content -LiteralPath (Join-Path $logs "$name.err.txt") -Value $err.Result
            Write-Host "==== $name exit $($process.ExitCode)"
            Write-Host $out.Result
            Write-Host $err.Result
            $script:codes[$name] = $process.ExitCode
          }
          $row = 'context_mode::windows_tests::npm_installs_into_a_fresh_staging_folder'
          $control = 'context_mode::windows_tests::the_node_probe_leaves_no_container_behind'
          Invoke-AsUser 'whoami' "$env:SystemRoot\System32\whoami.exe" @('/all')
          Invoke-AsUser 'control' $env:ENGINE_EXE @($control, '--exact', '--test-threads', '1')
          Invoke-AsUser 'npm-as-is' $env:ENGINE_EXE @($row, '--exact', '--ignored', '--test-threads', '1', '--nocapture')
          $node = Join-Path $env:ProgramFiles 'nodejs'
          icacls $node /grant '*S-1-15-2-1:(OI)(CI)(RX)'
          if ($LASTEXITCODE -ne 0) { throw "icacls grant failed with $LASTEXITCODE" }
          icacls $node
          Invoke-AsUser 'npm-packages-read' $env:ENGINE_EXE @($row, '--exact', '--ignored', '--test-threads', '1', '--nocapture')
          $rows = $script:codes.GetEnumerator() | ForEach-Object { "| $($_.Key) | $($_.Value) |" }
          @('| run as castd | exit |', '| --- | --- |') + $rows | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $rows | ForEach-Object { Write-Host $_ }
          exit 0
      - name: Show the access list a fresh Node MSI gives its folder
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "v$env:NODE_VERSION"
          $msi = "node-$version-x64.msi"
          $work = Join-Path $env:RUNNER_TEMP 'node-msi'
          New-Item -ItemType Directory -Force $work | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$version/SHASUMS256.txt" -OutFile (Join-Path $work 'sums.txt')
          Invoke-WebRequest "https://nodejs.org/dist/$version/$msi" -OutFile (Join-Path $work $msi)
          $want = ((Select-String -LiteralPath (Join-Path $work 'sums.txt') -Pattern "  $msi$").Line -split '\s+')[0]
          $got = (Get-FileHash -LiteralPath (Join-Path $work $msi) -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "msi sha256 $got is not $want" }
          $dir = Join-Path $env:ProgramFiles 'nodejs-msi-probe'
          $installed = Start-Process msiexec.exe -ArgumentList @('/i', (Join-Path $work $msi), '/qn', '/norestart', "INSTALLDIR=$dir") -Wait -PassThru
          Write-Host "msiexec exit $($installed.ExitCode)"
          icacls $dir
          $acl = Get-Acl -LiteralPath $dir
          Write-Host "owner $($acl.Owner) protected $($acl.AreAccessRulesProtected)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: npm-boundary-proof-${{ matrix.runner }}
          path: ${{ runner.temp }}/standard-user
          if-no-files-found: warn
          retention-days: 14
