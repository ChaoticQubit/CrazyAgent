name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 8d0120b62b0781c798151fcd19ff7bba4e89a589
  ROWS_FULL: 3c579a15425b55cf15ad151f1b1059da26b32393
  BASE_FULL: cecd6fe956ae0eafcb9ef2baa7762bae1ed7ecd8
  K: crazyagent-kernel-sandbox
  ASSERT_TEXT: "a grant is checked against every harness home"
  TEAM_ROWS: "team::runtime::tests::a_task_stays_open_until_the_background_command_it_started_ends team::runtime::tests::a_task_whose_agent_stopped_its_background_command_ends_with_its_reply team::runtime::tests::a_task_whose_background_command_ends_during_its_turn_ends_with_that_turn team::runtime::tests::a_team_agent_starts_with_the_tool_cache_its_policy_gives team::runtime::tests::a_team_claude_code_terminal_gets_the_display_the_owner_chose_last team::runtime::tests::a_team_claude_code_terminal_starts_fullscreen_by_default team::runtime::tests::a_saved_master_harness_switch_waits_while_the_owner_holds_an_unsent_line team::runtime::tests::a_saved_master_harness_switch_waits_until_the_live_masters_turn_ends team::runtime::tests::a_tools_off_claude_code_master_delegates_through_the_task_block_only team::runtime::tests::an_interrupted_master_run_waits_when_its_live_master_s_pane_has_just_ended team::runtime::tests::endpoint_claude_agent_is_hookless_and_refused_under_block team::runtime::tests::endpoint_claude_agent_is_hookless_and_refused_under_wait team::runtime::tests::an_owner_interrupt_ends_a_held_task_and_stops_its_background_command team::runtime::tests::at_a_full_limit_a_task_of_another_harness_stops_one_idle_agent team::runtime::tests::at_a_full_limit_an_idle_agent_of_the_tasks_own_harness_stops_first team::runtime::tests::at_a_full_harness_slot_an_idle_agent_of_another_harness_stays"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: RECHECK-OWNER assertion tip 1 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$ROWS_FULL" ] || { echo "::error::HEAD~2 is not the rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/crazyagent-clippy.log"
          cargo clippy -p "crazyagent" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "crazyagent-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: kernel_sandbox lib, every row (expect rc 0, failed 0, passed == listed - ignored)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-lib.log"
          list="$RUNNER_TEMP/kernel-lib.list"
          cargo test -p "$K" --lib --locked -- --list > "$list" 2>/dev/null
          listed="$(grep -cE ': test$' "$list" || true)"
          cargo test -p "$K" --lib --locked > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log"
          passed="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
          ignored="$(grep -cE '^test .* \.\.\. ignored' "$log" || true)"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "kernel-lib windows-2022 rc $code listed $listed passed $passed ignored $ignored failed $failed"
          fail=0
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$((listed - ignored))" ] || fail=1
          new="$(grep -cE 'after_the_build_is_refused_at_install|without_a_harness_home_trips_the_build' "$log" || true)"
          echo "new rows (unix only) seen $new want 0"
          [ "$new" = 0 ] || fail=1
          [ "$fail" = 0 ] || exit 1

  linux:
    name: RECHECK-OWNER assertion tip 1 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$ROWS_FULL" ] || { echo "::error::HEAD~2 is not the rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/crazyagent-clippy.log"
          cargo clippy -p "crazyagent" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "crazyagent-clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: kernel_sandbox lib, every row (expect rc 0, failed 0, passed == listed - ignored)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-lib.log"
          list="$RUNNER_TEMP/kernel-lib.list"
          cargo test -p "$K" --lib --locked -- --list > "$list" 2>/dev/null
          listed="$(grep -cE ': test$' "$list" || true)"
          cargo test -p "$K" --lib --locked > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log"
          passed="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
          ignored="$(grep -cE '^test .* \.\.\. ignored' "$log" || true)"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "kernel-lib ubuntu-22.04 rc $code listed $listed passed $passed ignored $ignored failed $failed"
          fail=0
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$((listed - ignored))" ] || fail=1
          new="$(grep -cE '^test paths::tests::(a_harness_home_made_a_link_to_a_granted_root_after_the_build_is_refused_at_install|an_owner_home_moved_into_a_granted_root_after_the_build_is_refused_at_install) \.\.\. ok$|^test paths::tests::a_grant_against_a_list_without_a_harness_home_trips_the_build - should panic \.\.\. ok$' "$log" || true)"
          echo "new rows ok $new want 3"
          [ "$new" = 3 ] || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: Rows 1-2 at the rows commit (cecd6fe956 + rows, no assertion), expect 2 of 2 ok
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          git checkout "$ROWS_FULL" -- crates/kernel/sandbox/src
          changed="$(git diff --name-only "$ROWS_FULL" -- crates/kernel/sandbox/src | wc -l | tr -d ' ')"
          echo "kernel sources vs the rows commit: $changed files changed"
          log="$RUNNER_TEMP/rows12.log"
          cargo test -p "$K" --lib --locked -- after_the_build_is_refused_at_install > "$log" 2>&1
          code=$?
          grep -E '^test .*after_the_build|panicked at|^test result:' "$log"
          ok="$(grep -cE '^test paths::tests::.*after_the_build_is_refused_at_install \.\.\. ok$' "$log" || true)"
          echo "rows 1-2 at $ROWS_FULL rc $code ok $ok want 2"
          git checkout HEAD -- crates/kernel/sandbox/src
          [ "$changed" = 0 ] && [ "$code" = 0 ] && [ "$ok" = 2 ] || exit 1

  macos:
    name: RECHECK-OWNER 16 team rows tip and base on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$ROWS_FULL" ] || { echo "::error::HEAD~2 is not the rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          echo "engine git: $(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: The 16 team rows red on the Mac, at the tip then at the base, FAILED-name diff (expect no row red at the tip only, assertion text 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          read -r -a names <<< "$TEAM_ROWS"
          echo "rows ${#names[@]} want 16"
          [ "${#names[@]}" = 16 ] || exit 1
          run() {
            local label="$1" log="$RUNNER_TEMP/team-$1.log"
            cargo test -p crazyagent --lib --locked -- --exact "${names[@]}" --test-threads=1 > "$log" 2>&1
            echo "team-$label rc $? $(grep -E '^test result:' "$log")"
            grep -E '^test .* FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/red-$label.txt"
            grep -E '^test .* \.\.\. ok$' "$log" | sed -E 's/^test (.*) \.\.\. ok$/\1/' | sort > "$RUNNER_TEMP/ok-$label.txt"
            echo "team-$label ok $(wc -l < "$RUNNER_TEMP/ok-$label.txt" | tr -d ' ') red $(wc -l < "$RUNNER_TEMP/red-$label.txt" | tr -d ' ') assertion text $(grep -cF "$ASSERT_TEXT" "$log")"
            sed "s/^/  red-$label /" "$RUNNER_TEMP/red-$label.txt"
            grep -E -A8 '^---- .* stdout ----' "$log" | grep -E 'panicked at|^[a-z].*(unavailable|hangs|Err)' | head -n 40 || true
          }
          run tip
          git checkout "$BASE_FULL" -- crates/kernel/sandbox/src
          changed="$(git diff --name-only "$BASE_FULL" -- crates/kernel/sandbox/src | wc -l | tr -d ' ')"
          echo "kernel sources vs the base: $changed files changed"
          [ "$changed" = 0 ] || exit 1
          run base
          git checkout HEAD -- crates/kernel/sandbox/src
          only_tip="$(comm -23 "$RUNNER_TEMP/red-tip.txt" "$RUNNER_TEMP/red-base.txt")"
          only_base="$(comm -13 "$RUNNER_TEMP/red-tip.txt" "$RUNNER_TEMP/red-base.txt")"
          echo "red at the tip only: ${only_tip:-none}"
          echo "red at the base only: ${only_base:-none}"
          tipassert="$(grep -cF "$ASSERT_TEXT" "$RUNNER_TEMP/team-tip.log")"
          ran="$(( $(wc -l < "$RUNNER_TEMP/ok-tip.txt") + $(wc -l < "$RUNNER_TEMP/red-tip.txt") ))"
          echo "tip rows run $ran want 16"
          [ -z "$only_tip" ] && [ "$tipassert" = 0 ] && [ "$ran" = 16 ] || exit 1
