name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  v243-g1-mac-rows-2-merge:
    name: G1 macOS compile only (macos-15, fix/v243-g1-mac-rows-2 17ce3ccd5 = 2ad06b275 + chore/v243 ecef0204e)
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The crates are the merge
        run: git diff --quiet 17ce3ccd54c24a9bf8db23c912f842b2e1846dcf -- crates
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install Rust toolchain, with no debug info for the runner's disk
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the engine lib tests (no run)
        timeout-minutes: 140
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --no-run --locked
          echo "| macOS lib test build at 17ce3ccd5 | ok |" >> "$GITHUB_STEP_SUMMARY"
      - name: Build every engine integration test target, harness_launch included (no run)
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        run: |
          set -euo pipefail
          cargo test -p crazyagent --test '*' --no-run --locked
          echo "| macOS integration test build at 17ce3ccd5 | ok |" >> "$GITHUB_STEP_SUMMARY"
      - name: The merged fast-orphan row is in the harness_launch binary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test -p crazyagent --test harness_launch --locked -- --list 2>/dev/null | grep -F 'a_full_access_headless_stop_names_or_misses_an_orphan_made_between_two_tables: test'
