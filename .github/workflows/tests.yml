name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  SQ: 5a7742a6d11d2a2300800bdec31fb69bc69cae2c
  SQTWIN: 5341d874f8e2567bcaecfb38e9845db3ca635ae2
  ST25: c8dcbbcc596f39ae0c9a1ae6886d73f0fd771477
  STTWIN: ac049b137bf0cdd8cbf864a634602b4dc93d38ac
  STPB: b0b7ac84979cf7f70f9aee50fba0eba1360eb1cf

defaults:
  run:
    shell: bash

jobs:
  flame:
    name: Pod B flames on macos-15, ${{ matrix.set }} (both sides on this runner, quiet then loaded)
    runs-on: macos-15
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        set: [storage, sdk]
    env:
      FLAME_OUT: ${{ github.workspace }}/flame-out
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check the five parents and lay out the trees
        id: trees
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          i=1
          for want in "$SQ" "$SQTWIN" "$ST25" "$STTWIN" "$STPB"; do
            [ "$(git rev-parse "HEAD^$i")" = "$want" ] || { echo "::error::parent $i is not $want"; exit 1; }
            i=$((i+1))
          done
          [ "$(git rev-parse --verify -q 'HEAD^6' || true)" = "" ] || { echo "::error::more than five parents"; exit 1; }
          [ "$(git diff --name-only HEAD^1 HEAD | sort | tr '\n' ' ')" = ".github/probe/flame-farm.sh .github/probe/flame.py .github/probe/split.py .github/probe/sysc.py .github/workflows/tests.yml " ] || { echo "::error::the farm commit changes more than the probe files"; exit 1; }
          cp -R .github/probe "$RUNNER_TEMP/probe"
          for t in sq:$SQ sqtwin:$SQTWIN st25:$ST25 sttwin:$STTWIN stpb:$STPB; do
            git worktree add --detach "$RUNNER_TEMP/${t%%:*}" "${t#*:}"
            [ "$(git -C "$RUNNER_TEMP/${t%%:*}" rev-parse HEAD)" = "${t#*:}" ] || { echo "::error::tree ${t%%:*} is not ${t#*:}"; exit 1; }
          done
      - name: Record the runner
        run: |
          set -euo pipefail
          echo "RUNNER image=${ImageOS:-unknown} version=${ImageVersion:-unknown} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT set=${{ matrix.set }}"
          echo "RUNNER $(sw_vers -productVersion) $(uname -m) ncpu=$(sysctl -n hw.ncpu) mem_gb=$(( $(sysctl -n hw.memsize) / 1073741824 )) load=$(sysctl -n vm.loadavg)"
          xcrun xctrace version
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the release test binaries
        timeout-minutes: 150
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/probe/flame-farm.sh"
          if [ "${{ matrix.set }}" = storage ]; then
            bash "$f" build 25 "$RUNNER_TEMP/st25" crazyagent-kernel-storage
            bash "$f" build pb "$RUNNER_TEMP/stpb" crazyagent-kernel-storage
            bash "$f" build twin "$RUNNER_TEMP/sttwin" crazyagent
          else
            bash "$f" build sq "$RUNNER_TEMP/sq" crazyagent
            bash "$f" build sqtwin "$RUNNER_TEMP/sqtwin" crazyagent
          fi
          cat "$FLAME_OUT/BINS.txt"
      - name: Quiet samples (no loader)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          f="$RUNNER_TEMP/probe/flame-farm.sh"
          if [ "${{ matrix.set }}" = storage ]; then
            for r in "restore.restore_pinned restore-pinned sized" "restore.recovery.put_back put-back sized" "upgrade.upgrade.one_step one-step sized" "migrations.backup backup sized" "restore.write_restore_record write-restore-record root" "events.persist events-persist store"; do
              read -r row slug t <<< "$r"
              case $t in sized) a=perf_tests::sized::storage_sized_database_calls b=perf_tests::storage::storage_sized_database_calls;; root) a=perf_tests::root_files::storage_root_file_calls b=perf_tests::storage::storage_root_file_calls;; store) a=perf_tests::store::storage_store_calls b=perf_tests::storage::storage_store_calls;; esac
              bash "$f" sample 25 "$a" "$row" "$slug" quiet 10
              bash "$f" sample twin "$b" "$row" "$slug" quiet 10
            done
            bash "$f" sample pb perf_tests::sized::storage_sized_database_calls restore.recovery.put_back put-back quiet 10
          else
            for r in "provider.settings.save_quit save-quit 30" "provider.update.set_channel set-channel 10"; do
              read -r row slug secs <<< "$r"
              bash "$f" sample sq perf_tests::sdk_provider_calls "$row" "$slug" quiet "$secs"
              bash "$f" sample sqtwin perf_tests::sdk::sdk_provider_calls "$row" "$slug" quiet "$secs"
            done
          fi
          exit 0
      - name: Syscalls per call, xctrace System Trace CALLS=K and CALLS=0 (storage, no loader)
        if: ${{ !cancelled() && matrix.set == 'storage' }}
        timeout-minutes: 120
        run: |
          set +e
          f="$RUNNER_TEMP/probe/flame-farm.sh"
          for r in "restore.restore_pinned restore-pinned sized 100" "restore.recovery.put_back put-back sized 100" "upgrade.upgrade.one_step one-step sized 200" "migrations.backup backup sized 200" "restore.write_restore_record write-restore-record root 200" "events.persist events-persist store 20000"; do
            read -r row slug t k <<< "$r"
            case $t in sized) a=perf_tests::sized::storage_sized_database_calls b=perf_tests::storage::storage_sized_database_calls;; root) a=perf_tests::root_files::storage_root_file_calls b=perf_tests::storage::storage_root_file_calls;; store) a=perf_tests::store::storage_store_calls b=perf_tests::storage::storage_store_calls;; esac
            for side in 25 twin; do
              test=$a; [ "$side" = twin ] && test=$b
              bash "$f" xrec "$side" "$test" "$row" "$slug" "$k"
              bash "$f" xrec "$side" "$test" "$row" "$slug" 0
            done
          done
          bash "$f" xrec pb perf_tests::sized::storage_sized_database_calls restore.recovery.put_back put-back 100
          bash "$f" xrec pb perf_tests::sized::storage_sized_database_calls restore.recovery.put_back put-back 0
          exit 0
      - name: Loaded samples (a looping kernel-storage release build on this runner)
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          f="$RUNNER_TEMP/probe/flame-farm.sh"
          bash "$f" loader start "$RUNNER_TEMP/st25"
          if [ "${{ matrix.set }}" = storage ]; then
            for r in "restore.restore_pinned restore-pinned sized" "restore.recovery.put_back put-back sized" "upgrade.upgrade.one_step one-step sized" "migrations.backup backup sized" "restore.write_restore_record write-restore-record root" "events.persist events-persist store"; do
              read -r row slug t <<< "$r"
              case $t in sized) a=perf_tests::sized::storage_sized_database_calls b=perf_tests::storage::storage_sized_database_calls;; root) a=perf_tests::root_files::storage_root_file_calls b=perf_tests::storage::storage_root_file_calls;; store) a=perf_tests::store::storage_store_calls b=perf_tests::storage::storage_store_calls;; esac
              bash "$f" sample 25 "$a" "$row" "$slug" loaded 10
              bash "$f" sample twin "$b" "$row" "$slug" loaded 10
            done
            bash "$f" sample pb perf_tests::sized::storage_sized_database_calls restore.recovery.put_back put-back loaded 10
          else
            for r in "provider.settings.save_quit save-quit" "provider.update.set_channel set-channel"; do
              read -r row slug <<< "$r"
              bash "$f" sample sq perf_tests::sdk_provider_calls "$row" "$slug" loaded 10
              bash "$f" sample sqtwin perf_tests::sdk::sdk_provider_calls "$row" "$slug" loaded 10
            done
          fi
          bash "$f" loader stop
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pod-b-flame-${{ matrix.set }}
          path: flame-out
          if-no-files-found: warn
      - name: Gates (expect 0 GATE FAIL and 0 XREC VOID)
        if: always()
        run: |
          set -euo pipefail
          s="$FLAME_OUT/RUNS.txt"
          [ -f "$s" ] || { echo "::error::no RUNS.txt"; exit 1; }
          grep -E '^(RUN|FLAME|XREC|XPARSE|GATE|RETRY|LOADER|QUIET|LOADED)' "$s"
          fails="$(grep -c '^GATE FAIL' "$s" || true)"
          voids="$(grep -c '^XREC VOID' "$s" || true)"
          graphs="$(grep -c '^FLAME ' "$s" || true)"
          echo "gates set=${{ matrix.set }} graphs $graphs gate_fail $fails xrec_void $voids"
          [ "$fails" = 0 ] && [ "$voids" = 0 ] || exit 1
