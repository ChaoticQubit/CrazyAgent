name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: aa4effba65a81e5adfb0c11cbcf66514ccc0f526
  RED_FULL: daa710f1a72b5cd39c9701dfb2a2f66c1eb73e8d
  RUST_FILES: crates/crazyagent/src/landing.rs crates/crazyagent/src/landing/ignored.rs crates/crazyagent/src/landing/retire.rs crates/crazyagent/src/team/cleanup.rs crates/crazyagent/src/team/cleanup/sweep.rs crates/crazyagent/src/team/cleanup/tests.rs crates/crazyagent/src/team/cleanup/tests/sweep.rs

defaults:
  run:
    shell: bash

jobs:
  green:
    name: LANDING-IGNORED-SWEPT rows and Mac clippy at the tip on macos-15
    runs-on: macos-15
    strategy:
      matrix:
        specs: ["crazyagent@ok@team::cleanup::tests::sweep::a_swept_worktree_holding_ignored_files_is_noted_with_their_names,team::cleanup::tests::sweep::a_swept_worktree_with_no_ignored_file_is_not_noted,team::cleanup::tests::sweep::a_kept_worktree_holding_ignored_files_is_not_noted,team::cleanup::tests::sweep::a_swept_worktree_holding_many_ignored_files_names_some_and_counts_the_rest,team::cleanup::tests::sweep::a_swept_ignored_name_with_a_control_character_is_shown_replaced,team::cleanup::tests::sweep::the_sweep_after_n_days_removes_only_agents_past_their_wait,team::cleanup::tests::sweep::the_sweep_once_landed_removes_a_landed_agent_at_once,team::cleanup::tests::sweep::the_sweep_set_to_manual_removes_nothing,team::cleanup::tests::sweep::a_sweep_pass_removes_at_most_its_bound_and_the_next_pass_takes_the_rest,team::cleanup::tests::sweep::agents_a_check_keeps_never_hold_the_sweep_back_from_a_newer_one"]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install tmux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Rows
        timeout-minutes: 120
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set +e
          fail=0
          for spec in $SPECS; do
            package="$(echo "$spec" | cut -d@ -f1)"
            outcome="$(echo "$spec" | cut -d@ -f2)"
            names="$(echo "$spec" | cut -d@ -f3 | tr ',' ' ')"
            want="$(echo "$names" | tr ' ' '\n' | sort)"
            log="$RUNNER_TEMP/$package.log"
            read -r -a filters <<< "$names"
            cargo test -p "$package" --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
            code=$?
            built="$(grep -cE "^ +(Checking|Compiling) $package v" "$log")"
            echo "BUILT $package $built"
            [ "$built" -gt 0 ] || { echo "::error::$package was not compiled, the cache was read as fresh"; fail=1; }
            grep -E '^test |test result:|panicked at|^thread ' "$log" || true
            ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            got="$(grep -E "^test [a-z_0-9:]+ \.\.\. $outcome\$" "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            echo "ROWS $package $outcome rc $code: $(printf '%s' "$got" | tr '\n' ' ')"
            [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::$package rows differ; want $outcome: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
          done
          exit "$fail"

      - name: Mac clippy at the tip
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          git log -1 --format='clippy at %H %s'
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$RUNNER_TEMP/clippy.log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E '^(error|warning)' "$RUNNER_TEMP/clippy.log" | head -n 40 || true
          tail -n 3 "$RUNNER_TEMP/clippy.log"
          echo "CLIPPY rc $code"
          exit "$code"

  red:
    name: LANDING-IGNORED-SWEPT red at daa710f1a7 on macos-15
    runs-on: macos-15
    strategy:
      matrix:
        specs: ["crazyagent@FAILED@team::cleanup::tests::sweep::a_swept_worktree_holding_ignored_files_is_noted_with_their_names,team::cleanup::tests::sweep::a_swept_worktree_holding_many_ignored_files_names_some_and_counts_the_rest,team::cleanup::tests::sweep::a_swept_ignored_name_with_a_control_character_is_shown_replaced"]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Check out the red sha
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git merge-base --is-ancestor "$RED_FULL" "$TIP_FULL" || { echo "::error::the red commit is not below the tip"; exit 1; }
          git checkout --detach "$RED_FULL"
          git log -1 --format='red %H %s'
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Rows
        timeout-minutes: 120
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set +e
          fail=0
          for spec in $SPECS; do
            package="$(echo "$spec" | cut -d@ -f1)"
            outcome="$(echo "$spec" | cut -d@ -f2)"
            names="$(echo "$spec" | cut -d@ -f3 | tr ',' ' ')"
            want="$(echo "$names" | tr ' ' '\n' | sort)"
            log="$RUNNER_TEMP/$package.log"
            read -r -a filters <<< "$names"
            cargo test -p "$package" --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
            code=$?
            built="$(grep -cE "^ +(Checking|Compiling) $package v" "$log")"
            echo "BUILT $package $built"
            [ "$built" -gt 0 ] || { echo "::error::$package was not compiled, the cache was read as fresh"; fail=1; }
            grep -E '^test |test result:|panicked at|^thread ' "$log" || true
            ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            got="$(grep -E "^test [a-z_0-9:]+ \.\.\. $outcome\$" "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            echo "ROWS $package $outcome rc $code: $(printf '%s' "$got" | tr '\n' ' ')"
            [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::$package rows differ; want $outcome: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
          done
          exit "$fail"

  cross-clippy:
    name: LANDING-IGNORED-SWEPT clippy at the tip on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache, so cargo rebuilds crazyagent
        run: |
          set -euo pipefail
          read -ra files <<< "$RUST_FILES"
          sleep 2
          touch "${files[@]}"
          ls -l "${files[@]}"
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          cargo clippy -p crazyagent --lib --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "crazyagent lib clippy rc $code"
          exit $code
