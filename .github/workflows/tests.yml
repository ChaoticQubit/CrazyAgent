name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  clippy-windows-desktop:
    name: V243 native end focus back, Windows clippy -D warnings on the desktop crate, lib and tests, default and native-webdriver
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Windows clippy on the desktop crate, one target set per cargo call
        run: |
          set -uo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
          out="$RUNNER_TEMP/clippy-windows-desktop.txt"
          : > "$out"
          echo "tip $(git rev-parse --short=9 HEAD) rustc $(rustc -V)" | tee -a "$out"
          all=0
          for features in default native-webdriver; do
            for targets in --lib --tests; do
              if [ "$features" = default ]; then set -- ; else set -- --features "$features"; fi
              echo "== clippy -p crazyagent-desktop $targets features $features" | tee -a "$out"
              cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent-desktop --locked "$targets" "$@" -- -D warnings 2>&1 | tee -a "$out"
              rc=${PIPESTATUS[0]}
              warned=$(grep -cE '^(warning|error)(\[|:)' "$out")
              echo "RESULT clippy $targets features $features rc=$rc warning-or-error-lines-so-far=$warned" | tee -a "$out"
              [ "$rc" = 0 ] || all=1
            done
          done
          grep '^RESULT' "$out"
          exit "$all"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-clippy-windows-desktop
          path: ${{ runner.temp }}/clippy-windows-desktop.txt
          if-no-files-found: warn
          retention-days: 14
