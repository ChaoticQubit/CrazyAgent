name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: c8d64ab888206554a481da560874faf25aec8dad
  BASE_FULL: fe0a3f6bac60c4af1baa7491c9146d76827024c6
  K: crazyagent-kernel-sandbox
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: ENTRIES-CAP A probe 7, 2 context_mode rows at tip c8d64ab888 and base fe0a3f6bac on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a full sha that is not 40 hex
        run: |
          set -euo pipefail
          n=0
          while IFS='=' read -r k v; do
            n=$((n + 1))
            [[ "$v" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$k is not a 40-hex sha: $v"; exit 1; }
            echo "$k ok"
          done < <(env | grep -E '^[A-Z_]+_FULL=' | sort)
          [ "$n" = 2 ] || { echo "::error::want 2 *_FULL shas, got $n"; exit 1; }
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 13
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~11)" = "$BASE_FULL" ] || { echo "::error::HEAD~11 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Check out the ticket base beside the tip
        id: base
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL"
          [ "$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)" = "$BASE_FULL" ] || { echo "::error::the base checkout is not BASE_FULL"; exit 1; }
          (cd "$RUNNER_TEMP/base" && cargo fetch --locked)
      - name: The 2 context_mode rows at the tip, exact, nocapture, backtrace (print in full)
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          echo "tip head $(git rev-parse HEAD)"
          log="$RUNNER_TEMP/tip-rows.log"
          RUST_BACKTRACE=1 cargo test -p crazyagent --lib --locked -- --exact --nocapture \
            context_mode::tests::npm_linked_into_its_package_outside_every_granted_root_starts_under_the_install_profile \
            context_mode::tests::the_engine_s_own_node_passes_the_node_check_and_starts_npm_under_the_install_profile > "$log" 2>&1
          code=$?
          sed -n '/^running [0-9]/,$p' "$log" | head -n 600
          ran="$(grep -cE '^running 2 tests$' "$log" || true)"
          echo "tip-rows ubuntu-22.04 rc $code running-2-tests $ran want 1 $(grep -E '^test result:' "$log" | tail -n 1)"
          [ "$ran" = 1 ] || { echo "::error::the tip did not run the 2 rows (a renamed or missing row)"; exit 1; }
      - name: The 2 context_mode rows at the base, exact, nocapture, backtrace (print in full)
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          cd "$RUNNER_TEMP/base"
          echo "base head $(git rev-parse HEAD)"
          log="$RUNNER_TEMP/base-rows.log"
          RUST_BACKTRACE=1 cargo test -p crazyagent --lib --locked -- --exact --nocapture \
            context_mode::tests::npm_linked_into_its_package_outside_every_granted_root_starts_under_the_install_profile \
            context_mode::tests::the_engine_s_own_node_passes_the_node_check_and_starts_npm_under_the_install_profile > "$log" 2>&1
          code=$?
          sed -n '/^running [0-9]/,$p' "$log" | head -n 600
          ran="$(grep -cE '^running 2 tests$' "$log" || true)"
          echo "base-rows ubuntu-22.04 rc $code running-2-tests $ran want 1 $(grep -E '^test result:' "$log" | tail -n 1)"
          [ "$ran" = 1 ] || { echo "::error::the base did not run the 2 rows (a renamed or missing row)"; exit 1; }
      - name: FAILED-name diff of the 2 rows, tip minus base (printed; each list from the failures block, its count = the result line)
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: |
          set +e
          bad=0
          for side in tip base; do
            log="$RUNNER_TEMP/$side-rows.log"
            awk '/^failures:$/ {n++; next} n>=2 && /^test result:/ {exit} n>=2 && /^    [^ ]+$/ {sub(/^    /, ""); print}' "$log" | sort > "$RUNNER_TEMP/$side-failed.txt"
            listed="$(wc -l < "$RUNNER_TEMP/$side-failed.txt" | tr -d ' ')"
            said="$(grep -E '^test result:' "$log" | tail -n 1 | sed -nE 's/.* ([0-9]+) failed;.*/\1/p')"
            echo "$side FAILED listed $listed result-line failed ${said:-none}"
            sed "s/^/  $side: /" "$RUNNER_TEMP/$side-failed.txt"
            [ -n "$said" ] && [ "$listed" = "$said" ] || { echo "::error::the $side failures block does not match its result line"; bad=1; }
          done
          echo "tip minus base (failing at the tip only):"
          comm -23 "$RUNNER_TEMP/tip-failed.txt" "$RUNNER_TEMP/base-failed.txt" | sed 's/^/  /'
          echo "failing at both:"
          comm -12 "$RUNNER_TEMP/tip-failed.txt" "$RUNNER_TEMP/base-failed.txt" | sed 's/^/  /'
          [ "$bad" = 0 ] || exit 1
