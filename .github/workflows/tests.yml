name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: fe22a6be5ba5338d981dd7545415726f33cc01cb
  RED1: 62bef9b5f5ae7dba30998e5e35dc06f80c85db58
  RED2: 8ecb292a107ef2ae8501e4567e027d2443f02fe8
  FIX: 97b0ff3f2e7d93efe3e24c38b528c5a65cfd29ac
  BASE: 7537cda1ed6572d6574bb754cc0be2db00212bf2

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows hidden boundary assertion trips windows-2022 (tip fe22a6be5)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the trip scripts outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-win-hidden-boundary-2-trips.sh "$RUNNER_TEMP/trips.sh"
          cp .github/farm/v244-win-hidden-boundary-2-trips.py "$RUNNER_TEMP/trips.py"
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Each new assertion of the fix trips on a scratch copy of the tip
        timeout-minutes: 120
        run: bash "$RUNNER_TEMP/trips.sh" "$TIP"

  linux:
    name: Windows hidden boundary assertion trips ubuntu-22.04 (tip fe22a6be5)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the trip scripts outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-win-hidden-boundary-2-trips.sh "$RUNNER_TEMP/trips.sh"
          cp .github/farm/v244-win-hidden-boundary-2-trips.py "$RUNNER_TEMP/trips.py"
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Each new assertion of the fix trips on a scratch copy of the tip
        timeout-minutes: 80
        run: bash "$RUNNER_TEMP/trips.sh" "$TIP"
