name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  N2A_TIP: b3b1c6f51
  HELD_RED: 7afb7d50e
  W1_RED: be4d85422

defaults:
  run:
    shell: bash

jobs:
  n2a:
    name: V244 N2a held-folder layer, red held.rs at 7afb7d50e and W1 at be4d85422, tip b3b1c6f51, on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the N2a tip
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          echo "crates at $N2A_TIP"
      - name: Build the boundary helper beside the test binary
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/
          ls -l target/debug/crazyagent-win-boundary.exe
      - name: N2a red, the tip's rows over the red held.rs at 7afb7d50e and the red W1 private.rs at be4d85422
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$HELD_RED" -- crates/crazyagent/src/engine/bootstrap/held.rs
          git checkout -q "$W1_RED" -- crates/crazyagent-win-sandbox/src/win/private.rs
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: 2>&1 | tee "$RUNNER_TEMP/red-held.log"
          held_rc=${PIPESTATUS[0]}
          w1_rc=1
          if [ "$RUNNER_OS" = Windows ]; then
            cargo test -p crazyagent-win-sandbox --test private_windows --locked -- --test-threads 1 new_dir_makes_only_a_missing_private_folder 2>&1 | tee "$RUNNER_TEMP/red-w1.log"
            w1_rc=${PIPESTATUS[0]}
          fi
          set -e
          git checkout -q "$N2A_TIP" -- crates
          git diff --quiet "$N2A_TIP" -- crates
          grep -E '^test .*held::tests|test result' "$RUNNER_TEMP/red-held.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/red-held.log" || true
          [ "$held_rc" -ne 0 ]
          if [ "$RUNNER_OS" = Windows ]; then
            grep -qE 'test result: FAILED\. 0 passed; 8 failed' "$RUNNER_TEMP/red-held.log"
            grep -E 'test result|panicked' "$RUNNER_TEMP/red-w1.log" || true
            [ "$w1_rc" -ne 0 ]
            grep -qE 'test result: FAILED\. 0 passed; 1 failed' "$RUNNER_TEMP/red-w1.log"
            echo "red as expected: 8 of 8 held rows and the new_dir row fail at the red stubs"
          else
            grep -qE 'test result: FAILED\. 0 passed; 5 failed' "$RUNNER_TEMP/red-held.log"
            echo "red as expected: 5 of 5 held rows fail at the red stub"
          fi
      - name: N2a clippy on the crazyagent library at b3b1c6f51
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: N2a clippy on the crazyagent test rows at b3b1c6f51
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: N2a clippy on win-sandbox, every target, at b3b1c6f51
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: N2a held rows at b3b1c6f51
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: 2>&1 | tee "$RUNNER_TEMP/held.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*held::tests|test result' "$RUNNER_TEMP/held.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/held.log" || true
          [ "$rc" -eq 0 ]
          if [ "$RUNNER_OS" = Windows ]; then rows="a_held_folder_makes_opens_and_pins_its_children a_linked_swapped_open_or_hard_linked_child_is_refused a_name_that_is_not_one_plain_component_trips_the_layer shared_locks_meet_an_exclusive_one_waits_and_unlock_frees_it making_a_folder_over_an_existing_one_is_refused_and_keeps_it a_verbatim_root_trips_the_layer_and_the_plain_spelling_holds the_folder_above_a_held_chain_cannot_be_renamed retargeting_a_junction_above_the_root_leaves_opens_in_the_held_tree"; count=8; else rows="a_held_folder_makes_opens_and_pins_its_children a_linked_swapped_open_or_hard_linked_child_is_refused a_name_that_is_not_one_plain_component_trips_the_layer shared_locks_meet_an_exclusive_one_waits_and_unlock_frees_it making_a_folder_over_an_existing_one_is_refused_and_keeps_it"; count=5; fi
          grep -qE "test result: ok\. $count passed; 0 failed" "$RUNNER_TEMP/held.log"
          for row in $rows; do
            grep -qE "held::tests::$row " "$RUNNER_TEMP/held.log" || { echo "::error::$row did not run"; exit 1; }
          done
          echo "N2a at $N2A_TIP: $count of $count held rows pass, each named row ran"
      - name: W1 private rows, new_dir among them, at b3b1c6f51
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          set +e
          cargo test -p crazyagent-win-sandbox --test private_windows --locked -- --test-threads 1 2>&1 | tee "$RUNNER_TEMP/w1.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'test result' "$RUNNER_TEMP/w1.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/w1.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 30 passed; 0 failed' "$RUNNER_TEMP/w1.log"
          grep -qE 'new_dir_makes_only_a_missing_private_folder ' "$RUNNER_TEMP/w1.log"
          echo "W1 at $N2A_TIP: 30 of 30 private rows pass, new_dir among them"
      - name: Storage Windows rows over the changed W1 dir and store_dir at b3b1c6f51
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 storage::windows_tests:: 2>&1 | tee "$RUNNER_TEMP/storage.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'test result' "$RUNNER_TEMP/storage.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/storage.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/storage.log"
          echo "storage Windows rows pass at $N2A_TIP"
