name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FIX_FULL: ddedac31f20269c06f43ca156dc795a4d60db1f6
  TWIN_FULL: ac049b137bf0cdd8cbf864a634602b4dc93d38ac
  ROW: restore.read_restore_record
  CALLS: "10000"

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: Pod B syscalls per call of restore.read_restore_record, 2.5 fix flame tree vs the 2.4.4 twin flame tree, on macos-15
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Refuse a full sha that is not 40 hex
        run: |
          set -euo pipefail
          n=0
          while IFS='=' read -r k v; do
            n=$((n + 1))
            [[ "$v" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$k is not a 40-hex sha: $v"; exit 1; }
            echo "$k ok"
          done < <(env | grep -E '^[A-Z_]+_FULL=' | sort)
          [ "$n" -ge 1 ] || { echo "::error::no *_FULL sha in the env"; exit 1; }
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the two parents, restore the fix flame tree and lay out the twin tree
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^1)" = "$FIX_FULL" ] || { echo "::error::parent 1 is not the fix flame tree"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$TWIN_FULL" ] || { echo "::error::parent 2 is not the twin flame tree"; exit 1; }
          [ "$(git rev-parse --verify -q 'HEAD^3' || true)" = "" ] || { echo "::error::more than two parents"; exit 1; }
          [ "$(git diff --name-only HEAD^1 HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit changes more than tests.yml"; exit 1; }
          git grep -q CRAZYAGENT_PERF_FLAME_CALLS HEAD^1 -- crates/kernel/common/src/perf_kit.rs || { echo "::error::the fix tree has no flame call-count mode"; exit 1; }
          git grep -q CRAZYAGENT_PERF_FLAME_CALLS HEAD^2 -- crates/crazyagent/src/perf_kit.rs || { echo "::error::the twin tree has no flame call-count mode"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the fix flame tree"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/twin" "$TWIN_FULL"
          [ "$(git -C "$RUNNER_TEMP/twin" rev-parse HEAD)" = "$TWIN_FULL" ] || { echo "::error::the twin tree is not the twin commit"; exit 1; }
          echo "TWIN_DIR=$RUNNER_TEMP/twin" >> "$GITHUB_ENV"
      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcrun xctrace version
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates for both trees
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          (cd "$TWIN_DIR" && cargo fetch --locked)
      - name: Build both release test binaries (the flame build), one tree at a time
        id: build
        if: ${{ steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          for side in fix twin; do
            if [ "$side" = fix ]; then dir=$PWD pkg=crazyagent-kernel-storage; else dir=$TWIN_DIR pkg=crazyagent; fi
            (cd "$dir" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$side" cargo test --release --locked -p "$pkg" --lib --no-run --message-format=json) > "$RUNNER_TEMP/build-$side.json"
            bin="$(python3 -I -c 'import json,sys
          for line in open(sys.argv[1]):
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["kind"] == ["lib"]:
                  print(m["executable"])' "$RUNNER_TEMP/build-$side.json" | tail -n 1)"
            [ -x "$bin" ] || { echo "::error::no $side test binary"; exit 1; }
            echo "test binary $side $bin $(shasum -a 256 "$bin" | cut -c1-64)"
            echo "BIN_$(echo "$side" | tr "[:lower:]" "[:upper:]")=$bin" >> "$GITHUB_ENV"
          done
      - name: Write the syscall counter and the trace helper
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/syscount.py" <<'PY'
          """Counts the syscalls of one process in an `xctrace export` of a System Trace syscall
          table. Inputs: the XML path and a process-name substring. Output: one `name count` line per
          syscall, most first, and a TOTAL line."""
          import collections, sys, xml.etree.ElementTree as ET
          path, want = sys.argv[1], sys.argv[2]
          ids = {}
          counts = collections.Counter()
          procs = collections.Counter()
          for _, el in ET.iterparse(path, events=("end",)):
              if "id" in el.attrib:
                  ids[el.attrib["id"]] = el.attrib.get("fmt", "")
              if el.tag != "row":
                  continue
              def val(tag):
                  c = el.find(tag)
                  if c is None:
                      return ""
                  return c.attrib.get("fmt") or ids.get(c.attrib.get("ref", ""), "")
              proc, name = val("process"), val("syscall")
              procs[proc] += 1
              if want in proc:
                  counts[name] += 1
              el.clear()
          assert counts or procs, "no rows"
          for name, n in counts.most_common():
              print(name, n)
          print("TOTAL", sum(counts.values()))
          if not counts:
              print("processes seen:", procs.most_common(5), file=sys.stderr)
          PY
          cat > "$RUNNER_TEMP/trace.sh" <<'SH'
          S="$RUNNER_TEMP/sys"
          mkdir -p "$S"
          trace() {
            local tag=$1 t rc name
            shift
            t="$S/$tag.trace"
            touch "$S/.mark"
            echo "$tag start $(date +%H:%M:%S) load1 $(sysctl -n vm.loadavg | awk '{print $2}') df $(df -g "$RUNNER_TEMP" | awk 'NR==2{print $4}') GB"
            $SUDO xcrun xctrace record --template 'System Trace' --time-limit 120s --output "$t" "$@" > "$S/$tag.rec" 2>&1
            rc=$?
            name=$(basename "$BIN" | cut -c1-14)
            $SUDO xcrun xctrace export --input "$t" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="syscall"]' > "$S/sys.xml" 2>/dev/null
            python3 -I "$RUNNER_TEMP/syscount.py" "$S/sys.xml" "$name" > "$S/$tag.txt" 2>&1
            echo "$tag xctrace rc $rc $(grep TOTAL "$S/$tag.txt")"
            [ "$rc" = 0 ] || tail -n 5 "$S/$tag.rec"
            $SUDO rm -rf "$t" "$S/sys.xml"
            for tmp in "$(getconf DARWIN_USER_TEMP_DIR)" "$($SUDO getconf DARWIN_USER_TEMP_DIR)"; do
              $SUDO find "$tmp" -maxdepth 1 -name 'instruments*.ktrace' -newer "$S/.mark" -print -delete | sed 's/^/  removed temp /'
            done
          }
          SH
          if xcrun xctrace record --template 'System Trace' --time-limit 2s --output "$RUNNER_TEMP/probe.trace" --launch -- /usr/bin/true > "$RUNNER_TEMP/probe.log" 2>&1; then
            echo "SUDO=" >> "$GITHUB_ENV"; echo "xctrace records as the runner user"
          else
            tail -n 5 "$RUNNER_TEMP/probe.log"; echo "SUDO=sudo" >> "$GITHUB_ENV"; echo "xctrace needs root here: traces run under sudo"
          fi
          rm -rf "$RUNNER_TEMP/probe.trace"
      - name: Per-call syscalls of the read row, each side with 3 own 0-call baselines (order z1, full, z2, z3), per call = (full - mean of the 3) / $CALLS
        if: ${{ steps.build.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          source "$RUNNER_TEMP/trace.sh"
          seq=0
          for side in fix twin; do
            if [ "$side" = fix ]; then BIN=$BIN_FIX test=perf_tests::root_files::storage_root_file_calls; else BIN=$BIN_TWIN test=perf_tests::storage::storage_root_file_calls; fi
            for tag in z1 full z2 z3; do
              seq=$((seq + 1))
              n=0; [ "$tag" = full ] && n="$CALLS"
              echo "TRACE seq=$seq side=$side row=$ROW tag=$tag calls=$n start=$(date -u +%H:%M:%S)"
              trace "$side-$tag" --env CRAZYAGENT_PERF_FLAME="$ROW" --env CRAZYAGENT_PERF_FLAME_CALLS="$n" --launch -- "$BIN" --exact "$test" --ignored --nocapture --test-threads=1
            done
            python3 -I - "$S/$side-z1.txt" "$S/$side-z2.txt" "$S/$side-z3.txt" "$S/$side-full.txt" "$CALLS" "$side" <<'PY'
          import sys
          def read(p):
              out = {}
              for line in open(p):
                  name, _, n = line.rpartition(" ")
                  if name and n.strip().isdigit():
                      out[name] = int(n)
              return out
          zeros = [read(p) for p in sys.argv[1:4]]
          full, k, side = read(sys.argv[4]), int(sys.argv[5]), sys.argv[6]
          if any("TOTAL" not in z for z in zeros) or "TOTAL" not in full:
              print(f"PERCALL {side} NOT MEASURED (a trace gave no TOTAL)")
              sys.exit(0)
          totals = [z["TOTAL"] for z in zeros]
          base = sum(totals) / 3
          per = (full["TOTAL"] - base) / k
          print(f"PERCALL {side} TOTAL {per:.3f} (z1={totals[0]} z2={totals[1]} z3={totals[2]} mean={base:.1f} spread={max(totals) - min(totals)} {k}={full['TOTAL']})")
          named = ["open", "openat", "open_nocancel", "openat_nocancel", "read", "read_nocancel", "pread", "pread_nocancel", "fstat", "fstat64", "close", "close_nocancel", "flock", "fcntl", "fcntl_nocancel"]
          for n in named:
              d = (full.get(n, 0) - sum(z.get(n, 0) for z in zeros) / 3) / k
              print(f"PERCALL {side} {n} {d:.3f} (full={full.get(n, 0)} zeros={[z.get(n, 0) for z in zeros]})")
          names = set(full).union(*zeros) - {"TOTAL"} - set(named)
          rest = sorted(((full.get(n, 0) - sum(z.get(n, 0) for z in zeros) / 3) / k, n) for n in names)
          print(f"PERCALL {side} other: " + ", ".join(f"{n} {d:.3f}" for d, n in reversed(rest[-6:]) if d > 0.005))
          PY
          done
      - name: Open paths per side with fs_usage, if the runner allows it (20 calls each, best effort)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set +e
          for side in fix twin; do
            if [ "$side" = fix ]; then BIN=$BIN_FIX test=perf_tests::root_files::storage_root_file_calls; else BIN=$BIN_TWIN test=perf_tests::storage::storage_root_file_calls; fi
            name=$(basename "$BIN")
            sudo fs_usage -w -f filesys "$name" 2>&1 | tee "$RUNNER_TEMP/fs-$side.txt" > /dev/null &
            fs=$!
            sleep 3
            CRAZYAGENT_PERF_FLAME="$ROW" CRAZYAGENT_PERF_FLAME_CALLS=20 "$BIN" --exact "$test" --ignored --nocapture --test-threads=1 > "$RUNNER_TEMP/fs-run-$side.log" 2>&1
            echo "FSRUN $side rc $? $(grep -oE 'FLAME-END .*' "$RUNNER_TEMP/fs-run-$side.log")"
            sleep 2
            sudo pkill -INT -x fs_usage; wait "$fs" 2>/dev/null
            [ -z "$(pgrep -x fs_usage)" ] || { sudo pkill -KILL -x fs_usage; echo "FSUSAGE $side needed a KILL"; }
            echo "FSUSAGE $side lines $(wc -l < "$RUNNER_TEMP/fs-$side.txt")"
            grep -E ' (open|open_nocancel|openat|flock|fcntl|fstat64|close|pread|read) ' "$RUNNER_TEMP/fs-$side.txt" | grep -E 'engine|restore-record|backup-failed|flock|fcntl' | sed -E 's/ +/ /g' | cut -c1-200 | sort | uniq -c | sort -rn | head -n 25
          done
