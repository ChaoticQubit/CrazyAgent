        [ "$code" -eq 0 ]
    - name: e2e_clone
      if: "${{ !cancelled() }}"
      timeout-minutes: 75
      run: |
        set +e
        cargo test -p crazyagent --locked --test e2e_clone 2>&1 | tee "$RUNNER_TEMP/rows.log"
        code=${PIPESTATUS[0]}
        set -e
        echo "e2e_clone on ubuntu-22.04: rc $code"
        grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
        [ "$code" -eq 0 ]
    - name: credential_platforms
      if: "${{ !cancelled() }}"
      timeout-minutes: 75
      run: |
        set +e
        sudo apt-get install -y --no-install-recommends libsecret-tools >/dev/null
        cat > "$RUNNER_TEMP/keyring-run.sh" <<'SCRIPT'
        set -u
        printf 'farm-keyring\n' | gnome-keyring-daemon --unlock --components=secrets
        echo "keyring daemons: $(pgrep -c gnome-keyring || true)"
        busctl --user list 2>/dev/null | grep -i secrets || echo "no org.freedesktop.secrets on the session bus"
        printf 'probe-value' | secret-tool store --label=farm-probe farm probe && echo "secret-tool store rc 0"
        echo "secret-tool lookup: $(secret-tool lookup farm probe || echo FAILED)"
        cargo test -p crazyagent --locked --test credential_platforms
        SCRIPT
        dbus-run-session -- bash "$RUNNER_TEMP/keyring-run.sh" 2>&1 | tee "$RUNNER_TEMP/rows.log"
        code=${PIPESTATUS[0]}
        set -e
        echo "credential_platforms on ubuntu-22.04: rc $code"
        grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
        [ "$code" -eq 0 ]
  windows:
