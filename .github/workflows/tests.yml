name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  GREEN_SHA: 0f955a5e2

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: V244 H5c-A on ${{ matrix.runner }}, the display first, then the real app and frontend at 0f955a5e2 through wdio, native views off and the open refused at the guard, red with the flag on
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Display, real frontend, app build with native-webdriver, green suite, red with the flag on
        run: |
          set -euo pipefail
          git diff --quiet "$GREEN_SHA" HEAD -- apps crates Cargo.toml Cargo.lock
          mkdir -p "$RUNNER_TEMP/h5c-a"
          cp .github/farm/h5c-a/* "$RUNNER_TEMP/h5c-a/"
          bash "$RUNNER_TEMP/h5c-a/v244-h5c-a.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-h5c-a-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/v244-h5c-a-*.txt
            ${{ runner.temp }}/green-wdio.txt
            ${{ runner.temp }}/red-wdio.txt
            ${{ runner.temp }}/wd-build.txt
            ${{ runner.temp }}/red-build.txt
            ${{ runner.temp }}/npm-ci.txt
            ${{ runner.temp }}/front-build.txt
          if-no-files-found: warn
          retention-days: 14
