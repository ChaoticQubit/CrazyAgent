name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 359a17737ce6f43cacfc24c65fc22a3b9bb28cfb
  TWIN_FULL: 41dc81573857992a834eb5c87ad1d7e958ba3632
  NEW_ROWS_ALL: run::tests::a_setup_command_that_exits_is_heard_through_one_watch
  NEW_ROWS_UNIX: run::tests::a_setup_command_past_its_limit_is_received_then_reaped_once
  NEW_ROWS_LINUX: run::tests::a_refused_pidfd_still_hears_the_exit
  NEW_ROWS_WINDOWS: run::tests::a_setup_command_past_its_limit_is_ended_and_reaped_once_on_windows

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: EXIT-WAIT run rows, mutants m1 m2 on macos-15
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the fix tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^1)" = "$TIP_FULL" ] || { echo "::error::the first parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$TWIN_FULL" ] || { echo "::error::the second parent is not the twin"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain
        run: &toolchain |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Rows, red under m1 and m2
        timeout-minutes: 75
        run: &rows |
          set +e
          echo "$NEW_ROWS_ALL" > "$RUNNER_TEMP/want"
          [ "$RUNNER_OS" = Windows ] || echo "$NEW_ROWS_UNIX" >> "$RUNNER_TEMP/want"
          [ "$RUNNER_OS" = Linux ] && echo "$NEW_ROWS_LINUX" >> "$RUNNER_TEMP/want"
          [ "$RUNNER_OS" = Windows ] && echo "$NEW_ROWS_WINDOWS" >> "$RUNNER_TEMP/want"
          f=crates/kernel/processes/src/run.rs; e=crates/kernel/processes/src/exit_wait.rs
          run_rows() {
            log="$RUNNER_TEMP/rows-$1.log"
            cargo test -p crazyagent-kernel-processes --lib --locked -- --test-threads=4 run::tests:: exit_wait:: > "$log" 2>&1
            code=$?
            built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
            failed="$(grep -E '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort | tr '\n' ' ')"
            okn="$(grep -cE '^test [a-z_0-9:]+ \.\.\. ok$' "$log")"
            echo "ROWS $1 BUILT $built rc $code ok $okn FAILED: $failed"
            grep -E 'test result:|panicked at' "$log" | head -n 20
          }
          mutate() {
            python3 - "$1" "$2" "$3" <<'PY'
          import sys
          p, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
          s = open(p).read()
          assert s.count(old) == 1, "mutant anchor"
          open(p, "w").write(s.replace(old, new))
          PY
          }
          touch crates/kernel/processes/src/lib.rs
          run_rows tip
          [ "$built" -gt 0 ] && [ "$code" = 0 ] || { echo "::error::rows red at the tip"; tail -n 40 "$log"; exit 1; }
          while read -r want; do grep -qE "^test $want \.\.\. ok$" "$log" || { echo "::error::new row $want not ok"; exit 1; }; done < "$RUNNER_TEMP/want"
          echo "NEW ROWS ok $(wc -l < "$RUNNER_TEMP/want" | tr -d ' ')"
          bad=0
          if [ "$RUNNER_OS" != Windows ]; then
            mutate $f '                Some(watch) => drop(watch.reap(&mut child)),' $'                Some(watch) => {\n                    let _ = child.wait();\n                    drop(watch.reap(&mut child))\n                }' || exit 1
            run_rows m1; git checkout -q -- $f
            echo "$failed" | grep -q "run::tests::a_setup_command_past_its_limit_is_received_then_reaped_once " || { echo "::error::m1 left r2 green"; bad=1; }
          fi
          mutate $f '        (Ok(true), Some(watch)) => watch.reap(&mut child),' '        (Ok(_), Some(watch)) => watch.reap(&mut child),' || exit 1
          run_rows m2; git checkout -q -- $f
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$failed" | grep -q "run::tests::a_setup_command_past_its_limit_is_ended_and_reaped_once_on_windows " || { echo "::error::m2 left the Windows past-limit row green"; bad=1; }
          else
            echo "$failed" | grep -q "run::tests::a_setup_command_past_its_limit_is_received_then_reaped_once " || { echo "::error::m2 left r2 green"; bad=1; }
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            mutate $e $'            fallback_noted(error);\n            waiter(pid)' '            Err(std::io::Error::from(error))' || exit 1
            run_rows m3; git checkout -q -- $e
            echo "$failed" | grep -q "run::tests::a_refused_pidfd_still_hears_the_exit " || { echo "::error::m3 left r3 green"; bad=1; }
          fi
          git diff --quiet HEAD^1 -- crates || { echo "::error::a mutant was left in the tree"; exit 1; }
          exit $bad
  linux:
    name: EXIT-WAIT run rows, mutants m1 m2 m3, clippy, ABBA vs 2.4.4 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the fix tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^1)" = "$TIP_FULL" ] || { echo "::error::the first parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$TWIN_FULL" ] || { echo "::error::the second parent is not the twin"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Linux packages
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: *toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows, red under m1 m2 m3
        timeout-minutes: 75
        run: *rows
      - name: Clippy kernel processes lib and tests, rc 0
        if: always()
        timeout-minutes: 45
        run: &clippy |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/kernel/processes/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent-kernel-processes --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 100 || true
          tail -n 3 "$log"
          echo "CLIPPY $RUNNER_OS crazyagent-kernel-processes --lib --tests rc $code checked $checked"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked, the cache was read as fresh"; exit 1; }
          [ "$code" = 0 ] || { echo "::error::clippy rc $code"; exit 1; }
      - name: ABBA run_bounded timing, 2.5 tip against the 2.4.4 twin
        timeout-minutes: 90
        run: &abba |
          set +e
          git worktree add -q "$RUNNER_TEMP/twin" "$TWIN_FULL" || exit 1
          build() {
            ( cd "$1" && cargo test --release -p "$2" --lib --locked --no-run --message-format short > "$RUNNER_TEMP/release-$2.log" 2>&1 ) || { echo "::error::release build $2" >&2; tail -n 40 "$RUNNER_TEMP/release-$2.log" >&2; exit 1; }
            bin="$(grep -oE 'Executable unittests src/lib.rs \([^)]+\)' "$RUNNER_TEMP/release-$2.log" | sed -E 's/.*\(//; s/\)$//' | tr "\\\\" "/" | tail -n 1)"
            [ -n "$bin" ] || { echo "::error::no lib test binary for $2" >&2; exit 1; }
            echo "$1/$bin"
          }
          tip_bin="$(build "$PWD" crazyagent-kernel-processes)" || exit 1
          twin_bin="$(build "$RUNNER_TEMP/twin" crazyagent)" || exit 1
          echo "BIN tip $tip_bin twin $twin_bin"
          log="$RUNNER_TEMP/abba.log"; : > "$log"
          for blk in 1 2; do for side in tip twin twin tip; do
            case $side in
              tip) d="$PWD"; b="$tip_bin"; row=perf_tests::run::run_calls ;;
              twin) d="$RUNNER_TEMP/twin"; b="$twin_bin"; row=perf_tests::processes_run::run_calls ;;
            esac
            echo "PERF-RUN build=$side os=$RUNNER_OS block=$blk" >> "$log"
            ( cd "$d" && "$b" "$row" --exact --ignored --nocapture --test-threads=1 ) > "$RUNNER_TEMP/one.log" 2>&1
            rc=$?
            sed -E 's/^test [^ ]+ \.\.\. ((PERF|NOTE) )/\1/' "$RUNNER_TEMP/one.log" | grep -E '^PERF |test result|panicked' >> "$log"
            [ "$rc" = 0 ] || { echo "::error::abba $side block $blk rc $rc"; tail -n 20 "$RUNNER_TEMP/one.log"; exit 1; }
          done; done
          cat "$log"
          echo "ABBA runs $(grep -c '^PERF-RUN' "$log") perf lines $(grep -c '^PERF ' "$log")"
  windows:
    name: EXIT-WAIT run rows, mutant m2, clippy, ABBA vs 2.4.4 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the fix tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^1)" = "$TIP_FULL" ] || { echo "::error::the first parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$TWIN_FULL" ] || { echo "::error::the second parent is not the twin"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: *toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows, red under m2
        timeout-minutes: 75
        run: *rows
      - name: Clippy kernel processes lib and tests, rc 0
        if: always()
        timeout-minutes: 45
        run: *clippy
      - name: ABBA run_bounded timing, 2.5 tip against the 2.4.4 twin
        timeout-minutes: 120
        run: *abba
