name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 8da305e88251aa8ea58c652942b7ca8522ec399b
  RED: ba86005d79c11f6d77d59da001d0fb555a9c0572
  ROOTS: sandbox::windows::owner_git::tests::git_for_windows_install_folders_are_found_from_its_programs_only
  PROFILE: sandbox::windows::owner_git::tests::owner_git_has_no_capability_writes_only_the_project_and_its_folders_and_is_no_agents_container
  REFUSE: sandbox::windows::owner_git::tests::owner_git_refuses_a_git_outside_a_git_for_windows_install_before_any_profile
  WRAP: sandbox::windows::owner_git::tests::a_wrapped_git_starts_through_the_helper_in_its_own_home_with_no_global_config
  WRAP_REFUSES: sandbox::windows::owner_git::tests::a_wrapped_git_refuses_another_program_a_global_config_or_a_folder_outside_the_project
  MARKERS: sandbox::windows::owner_git::tests::owner_git_reads_only_a_folder_that_holds_git_for_windows_markers
  HOLDS: sandbox::windows::owner_git::tests::owner_git_refuses_an_install_folder_that_holds_the_project_or_its_own_folder
  JUNCTION_LIST: project_files::windows_tests::the_declined_windows_list_names_its_tracked_files_only_and_none_through_a_junction
  NESTED_LIST: project_files::windows_tests::the_declined_windows_list_names_tracked_files_only_and_never_opens_a_nested_git_file
  ORDER: project_files::windows_tests::the_git_folder_walk_runs_before_any_check_that_reads_through_its_folders
  OUTSIDE: github::publish::publish_windows_tests::a_windows_publish_opens_no_file_the_repository_config_names_outside_the_tree
  EVERY_STEP: github::publish::publish_windows_tests::every_windows_publish_step_refuses_a_git_folder_that_points_elsewhere
  NESTED: github::publish::publish_windows_tests::a_windows_publish_refuses_a_nested_git_entry_naming_its_folder_before_git_walks_the_tree
  STILL_COMMITS: github::publish::publish_windows_tests::a_windows_publish_of_a_project_with_no_nested_git_entry_still_commits

defaults:
  run:
    shell: bash

jobs:
  win-red:
    name: UNC owner git profile r2 windows-2022 at the red commit, both new rows fail on the missing refusal and the five r1 rows pass
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the red commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$RED" -- .
          git diff --quiet "$RED" || { echo "TREE IS NOT THE RED COMMIT"; git diff --stat "$RED"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Build the engine library tests at the red commit
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Both new rows fail on the missing refusal, the five r1 rows pass
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          rc=0
          red() {
            local row="$1" want="$2" out="$RUNNER_TEMP/red-$3.txt"
            cargo test -p crazyagent --lib --locked -- --exact "$row" > "$out" 2>&1
            local code=$?
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -8
            grep -A4 "panicked at" "$out" | cut -c1-400 | head -10
            [ "$code" -ne 0 ] || { echo "RED ROW PASSED: $row"; rc=1; return; }
            grep -q "^test $row \.\.\. FAILED" "$out" || { echo "RED ROW DID NOT RUN: $row"; rc=1; return; }
            grep -qF -- "$want" "$out" || { echo "RED ROW FAILED FOR ANOTHER REASON: $row (wanted a line holding: $want)"; rc=1; }
          }
          guard() {
            local row="$1" out="$RUNNER_TEMP/guard-$2.txt"
            cargo test -p crazyagent --lib --locked -- --exact "$row" > "$out" 2>&1
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -6
            grep -A4 "panicked at" "$out" | cut -c1-400 | head -10
            grep -q "^test $row \.\.\. ok" "$out" || { echo "GUARD ROW NOT OK AT RED: $row"; rc=1; }
          }
          red "$MARKERS" 'expected a refusal naming Git for Windows, got Ok(' markers
          red "$HOLDS" 'expected a refusal naming holds, got Ok(' holds
          guard "$ROOTS" roots
          guard "$PROFILE" profile
          guard "$REFUSE" refuse
          guard "$WRAP" wrap
          guard "$WRAP_REFUSES" wrap-refuses
          [ "$rc" -eq 0 ] && echo "red ok: both new rows failed on the missing refusal, five guards passed"
          exit "$rc"

  win-tip:
    name: UNC owner git profile r2 ${{ matrix.runner }} at the tip, clippy lib and tests on windows-2022, every owner git and declined path row
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Clippy crazyagent lib
        if: matrix.runner == 'windows-2022'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Every owner git, project_files, publish and intake row at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- sandbox::windows::owner_git:: project_files:: github::publish:: tui::screens::intake:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | cut -c1-300 | head -40
          grep -A4 "panicked at" "$RUNNER_TEMP/tip.txt" | cut -c1-600 | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "owner_git|windows_tests|intake::tests::the_publish" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$MARKERS" "$HOLDS" "$ROOTS" "$PROFILE" "$REFUSE" "$WRAP" "$WRAP_REFUSES" "$JUNCTION_LIST" "$NESTED_LIST" "$ORDER" "$OUTSIDE" "$EVERY_STEP" "$NESTED" "$STILL_COMMITS"; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"
