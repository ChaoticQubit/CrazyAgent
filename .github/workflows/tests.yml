name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 44de9b405be2a53b930d727a2f2129f579a42cd5
  RED_FULL: d519fe9301608a240f7cf1363d81ddfef5bdfc50
  BASE_FULL: ec22db84c2445d37322e1515f2ff372454ef1275

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: CUSTODY light, fmt and clippy of both crates and the restore, held_files and engine_fd_tests rows at the tip, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 14
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -12 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~10)" = "$RED_FULL" ] || { echo "::error::HEAD~10 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~11)" = "$BASE_FULL" ] || { echo "::error::HEAD~11 is not chore ec22db84c2"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the two crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-storage -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel-storage and crazyagent --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage -p crazyagent --tests --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gates crazyagent-kernel-storage $g0 crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: The restore, held_files and engine_fd_tests rows at the tip (expect rc 0 and 0 failed each; engine_fd_tests 4 passed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          ok=1
          for row in "crazyagent-kernel-storage restore::" "crazyagent-kernel-storage held_files::" "crazyagent engine::bootstrap::native_profiles::engine_fd_tests::"; do
            read -r crate filter <<< "$row"
            set -- "$crate" "$filter"
            log="$RUNNER_TEMP/set.log"
            cargo test --locked -p "$1" --lib "$2" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|^test result' "$log" | head -n 20 || true
            failed="$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)"
            passed="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
            echo "set $2 rc $code failed $failed passed $passed"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] || ok=0
            case "$2" in *engine_fd_tests::) [ "$passed" = 4 ] || ok=0 ;; esac
          done
          [ "$ok" = 1 ] || exit 1
      - name: The whole crazyagent lib at the tip, then at base ec22db84c2, on this runner (gate, each run ends in exactly one test result line after compiling crazyagent, and no test fails only at the tip)
        id: lib
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 200
        run: |
          set +e
          out="$RUNNER_TEMP/lib-lists"
          mkdir -p "$out"
          lib() {
            local log="$RUNNER_TEMP/lib-$1.log"
            cargo test --locked -p crazyagent --lib > "$log" 2>&1
            local code=$?
            grep -E '^test result' "$log" | tail -n 1 || true
            grep -E '^test [^ ]+ \.\.\. FAILED$' "$log" | sed -E 's/^test ([^ ]+) \.\.\. FAILED$/\1/' | sort -u > "$out/$1.txt"
            local results gate
            results="$(grep -cE '^test result: ' "$log" || true)"
            gate="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
            echo "lib at $1 $(git rev-parse --short=10 HEAD) rc $code failed_names $(wc -l < "$out/$1.txt") results $results gate crazyagent $gate"
            eval "$1_results=$results $1_gate=$gate"
          }
          touch crates/crazyagent/src/lib.rs
          lib tip
          git checkout -q -f --detach "$BASE_FULL"
          [ "$(git rev-parse HEAD)" = "$BASE_FULL" ] || { echo "::error::the tree is not the base"; exit 1; }
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
          lib base
          tip_only="$(comm -13 "$out/base.txt" "$out/tip.txt" | wc -l)"
          base_only="$(comm -23 "$out/base.txt" "$out/tip.txt" | wc -l)"
          comm -13 "$out/base.txt" "$out/tip.txt" | head -n 60 || true
          echo "failed at base $(wc -l < "$out/base.txt") at tip $(wc -l < "$out/tip.txt") tip_only $tip_only base_only $base_only"
          [ -s "$out/base.txt" ] || [ -s "$out/tip.txt" ] || echo "no failures at either"
          [ "$tip_results" = 1 ] && [ "$tip_gate" -ge 1 ] && [ "$base_results" = 1 ] && [ "$base_gate" -ge 1 ] && [ "$tip_only" = 0 ] || exit 1
      - name: Upload the FAILED-name lists
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: custody-4-lib-failed-names
          path: ${{ runner.temp }}/lib-lists
          if-no-files-found: error
