name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    windows-rust-1 windows-rust-2 windows-rust-3

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build the ${{ matrix.os }} test archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-2022
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-archive
        with:
          os: ${{ matrix.os }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Clippy on the Windows boundary crate
        continue-on-error: true
        run: |
          set -euo pipefail
          rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy-win-sandbox.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-clippy-windows
          path: ${{ runner.temp }}/clippy-win-sandbox.txt
          if-no-files-found: warn
          retention-days: 14

  windows-standard-user:
    name: WIN-1 step 1 rows as a standard local user on ${{ matrix.runner }}
    needs: build-windows
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: farm-archive-windows
          path: ${{ runner.temp }}/archive
      - name: Extract the archive and find the sandbox test binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'archive\farm-windows.tar.zst'
          $filter = 'binary_id(crazyagent) | binary_id(crazyagent-win-sandbox) | binary_id(crazyagent-win-sandbox::boundary)'
          $json = cargo nextest list --archive-file $archive --workspace-remap $env:GITHUB_WORKSPACE --extract-to $env:GITHUB_WORKSPACE --extract-overwrite --message-format json -E $filter
          if ($LASTEXITCODE -ne 0) { throw "nextest list failed with $LASTEXITCODE" }
          $suites = ($json | Out-String | ConvertFrom-Json).'rust-suites'
          foreach ($pair in @(@('ENGINE', 'crazyagent'), @('UNIT', 'crazyagent-win-sandbox'), @('BOUNDARY', 'crazyagent-win-sandbox::boundary'))) {
            $suite = $suites.($pair[1])
            if (-not $suite -or -not (Test-Path -LiteralPath $suite.'binary-path')) { throw "no test binary for $($pair[1])" }
            $cwd = if ($suite.cwd) { $suite.cwd } else { $env:GITHUB_WORKSPACE }
            "SBX_$($pair[0])_EXE=$($suite.'binary-path')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "SBX_$($pair[0])_CWD=$cwd" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "$($pair[1]) => $($suite.'binary-path') in $cwd"
          }
      - name: Run the sandbox rows as a standard local user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'castd'
          $alphabet = [char[]]'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = (-join (1..24 | ForEach-Object { $alphabet | Get-Random })) + 'aZ7!'
          net user $user $password /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net user failed with $LASTEXITCODE" }
          $admins = net localgroup Administrators
          if ($admins -contains $user) { throw "$user is an administrator" }
          icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)(RX)" /C /Q | Out-Null
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $logs = Join-Path $env:RUNNER_TEMP 'standard-user'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $script:codes = [ordered]@{}
          function Invoke-AsUser([string]$name, [string]$program, [string]$cwd, [string[]]$arguments) {
            $start = [System.Diagnostics.ProcessStartInfo]::new($program)
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $start.UserName = $user
            $start.Domain = '.'
            $start.Password = $secure
            $start.LoadUserProfile = $true
            $start.UseShellExecute = $false
            $start.WorkingDirectory = $cwd
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            try {
              $process = [System.Diagnostics.Process]::Start($start)
            } catch {
              Write-Host "==== $name did not start: $($_.Exception.Message)"
              $script:codes[$name] = 'not started'
              return
            }
            $out = $process.StandardOutput.ReadToEndAsync()
            $err = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(2400000)) { $process.Kill($true) }
            $process.WaitForExit()
            Set-Content -LiteralPath (Join-Path $logs "$name.out.txt") -Value $out.Result
            Set-Content -LiteralPath (Join-Path $logs "$name.err.txt") -Value $err.Result
            Write-Host "==== $name exit $($process.ExitCode)"
            Write-Host $out.Result
            Write-Host $err.Result
            $script:codes[$name] = $process.ExitCode
          }
          Invoke-AsUser 'whoami' "$env:SystemRoot\System32\whoami.exe" $env:GITHUB_WORKSPACE @('/all')
          Invoke-AsUser 'profile' "$env:SystemRoot\System32\cmd.exe" $env:GITHUB_WORKSPACE @('/C', 'echo', '%USERNAME%', '%USERPROFILE%', '%TEMP%')
          Invoke-AsUser 'unit' $env:SBX_UNIT_EXE $env:SBX_UNIT_CWD @()
          Invoke-AsUser 'boundary' $env:SBX_BOUNDARY_EXE $env:SBX_BOUNDARY_CWD @('--test-threads', '4')
          Invoke-AsUser 'engine' $env:SBX_ENGINE_EXE $env:SBX_ENGINE_CWD @('sandbox::windows::tests', '--test-threads', '2')
          $rows = $script:codes.GetEnumerator() | ForEach-Object { "| $($_.Key) | $($_.Value) |" }
          @('| run as a standard local user | exit |', '| --- | --- |') + $rows | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-standard-user-${{ matrix.runner }}
          path: ${{ runner.temp }}/standard-user
          if-no-files-found: warn
          retention-days: 14
