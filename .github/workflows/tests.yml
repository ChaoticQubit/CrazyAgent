name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 064325a716f7434014fe892bf2e269eadcf44435
  RED: 50a8437eefc96242425eaf25fe699054ad705f62
  BASE: 3d3992d3f37f3f50bccb3f81d09bf779050818c4
  FILES: "crates/kernel/storage/src/namespace/tests.rs "

defaults:
  run:
    shell: bash

jobs:
  mac:
    name: NAMESPACE-GUARD-PERF kernel-storage fmt, clippy and rows on macos-15 at the tip
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED" ] || { echo "::error::HEAD~3 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE" ] || { echo "::error::HEAD~4 is not the b25 base"; exit 1; }
          [ "$(git diff --name-only HEAD~4 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain with clippy and rustfmt, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: cargo fmt --check (expect rc 0)
        run: |
          set +e
          cargo fmt --check
          code=$?
          echo "FMT rc $code"
          [ "$code" = 0 ]
      - name: kernel-storage clippy --lib --tests (expect rc 0, 0 warnings, 0 errors)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage --lib --tests -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(warning|error)' "$log" | head -40 || true
          warnings=$(grep -cE '^warning' "$log" || true)
          errors=$(grep -cE '^error' "$log" || true)
          gate=$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)
          echo "CLIPPY rc $code warnings $warnings errors $errors gate $gate"
          [ "$code" = 0 ] && [ "$warnings" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ]
      - name: kernel-storage lib rows (expect 136 listed, 0 failed)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test --locked -p crazyagent-kernel-storage --lib > "$log" 2>&1
          rc=$?
          gate=$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)
          listed=$(cargo test --locked -p crazyagent-kernel-storage --lib -- --list 2>/dev/null | grep -cE ': test$' || true)
          grep -E 'FAILED|panicked at|^test result:' "$log" | head -40 || true
          passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
          failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
          ignored=$(grep -E '^test result:' "$log" | awk '{i+=$8} END {print i+0}')
          echo "ROWS rc $rc listed $listed passed $passed failed $failed ignored $ignored gate $gate"
          [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$listed" = 136 ] && [ $((passed + ignored)) = "$listed" ] && [ "$gate" -ge 1 ]
