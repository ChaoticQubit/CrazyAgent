name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 587ab830893b35ca811b505ee5d01b69a76ba623
  TWIN_FULL: 3b1ad484b641e076b96331288091eb2b77c98dfb
  PAIRS: "events.logged events.persist migrations.backup migrations.backup_failure migrations.backup_time migrations.backups_in migrations.stamp restore.read_restore_record restore.recovery.put_back restore.restore_failed restore.restore_pinned restore.write_restore_record state_log.Clock.now_ms state_log.replay.checkpoint upgrade.check upgrade.upgrade.newest upgrade.upgrade.one_step"
  B_ONLY: "restore.recovery.finish"

defaults:
  run:
    shell: bash

jobs:
  sitting:
    name: 1445 perf sitting, 2.4.4 twin vs 2.5 tip, quiet and loaded ABBA on macos-15
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Check the parents and add the 2.4.4 twin worktree
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %P %s'
          [ "$(git rev-parse HEAD^1)" = "$TIP_FULL" ] || { echo "::error::HEAD^1 is not the 1445 tip 587ab83089"; exit 1; }
          [ "$(git rev-parse HEAD^2)" = "$TWIN_FULL" ] || { echo "::error::HEAD^2 is not the 2.4.4 twin 3b1ad484b6"; exit 1; }
          git checkout HEAD^1 -- .github/workflows/tests.yml
          git diff --quiet HEAD^1 || { echo "::error::the tree is not the 1445 tip"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/twin" "$TWIN_FULL"
          [ "$(git -C "$RUNNER_TEMP/twin" rev-parse HEAD)" = "$TWIN_FULL" ] || exit 1
          [ -d "$RUNNER_TEMP/twin/crates/kernel" ] && { echo "::error::the twin tree has crates/kernel, so it is not 2.4.4"; exit 1; }
          [ -d crates/kernel/storage ] || { echo "::error::the tip tree has no crates/kernel/storage"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sitting"
      - name: Record the runner, the run and both commits
        run: |
          set -euo pipefail
          {
            echo "image $ImageOS $ImageVersion"
            sw_vers
            echo "cpu $(sysctl -n machdep.cpu.brand_string) ncpu $(sysctl -n hw.ncpu) memsize $(sysctl -n hw.memsize)"
            echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "A 2.4.4 twin $TWIN_FULL"
            echo "B 2.5 tip $TIP_FULL"
            echo "load at record $(sysctl -n vm.loadavg)"
          } | tee "$RUNNER_TEMP/sitting/record.txt"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup run "$RUST_TOOLCHAIN" rustc -V | tee -a "$RUNNER_TEMP/sitting/record.txt"
      - name: Fetch the locked crates of both trees
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          (cd "$RUNNER_TEMP/twin" && cargo fetch --locked)
      - name: Build side B, the 2.5 kernel-storage perf binary, into its own target
        timeout-minutes: 60
        run: |
          set -euo pipefail
          df -h /
          log="$RUNNER_TEMP/sitting/build-b.log"
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-b" cargo test --release --locked -p crazyagent-kernel-storage --lib --no-run --message-format=json > "$RUNNER_TEMP/build-b.json" 2> "$log"
          code=$?
          set -e
          tail -n 5 "$log"
          gate="$(grep -cE '^ +Compiling crazyagent-kernel-storage v' "$log" || true)"
          bin="$(python3 -I -c 'import json,sys
          for line in open(sys.argv[1]):
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m["target"]["name"] == "crazyagent_kernel_storage" and m["profile"]["test"] and m.get("executable"):
                  print(m["executable"])' "$RUNNER_TEMP/build-b.json")"
          echo "build B rc $code gate crazyagent-kernel-storage $gate binary $(basename "$bin")"
          [ "$code" = 0 ] && [ "$gate" -ge 1 ] && [ -x "$bin" ] || exit 1
          echo "BIN_B=$bin" >> "$GITHUB_ENV"
      - name: Build side A, the 2.4.4 crazyagent perf binary, into its own target
        timeout-minutes: 90
        run: |
          set -euo pipefail
          df -h /
          log="$RUNNER_TEMP/sitting/build-a.log"
          cd "$RUNNER_TEMP/twin"
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-a" cargo test --release --locked -p crazyagent --lib --no-run --message-format=json > "$RUNNER_TEMP/build-a.json" 2> "$log"
          code=$?
          set -e
          tail -n 5 "$log"
          gate="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          bin="$(python3 -I -c 'import json,sys
          for line in open(sys.argv[1]):
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m["target"]["name"] == "crazyagent" and "lib" in m["target"]["kind"] and m["profile"]["test"] and m.get("executable"):
                  print(m["executable"])' "$RUNNER_TEMP/build-a.json")"
          echo "build A rc $code gate crazyagent $gate binary $(basename "$bin")"
          [ "$code" = 0 ] && [ "$gate" -ge 1 ] && [ -x "$bin" ] || exit 1
          echo "BIN_A=$bin" >> "$GITHUB_ENV"
          df -h /
      - name: Write the block runner and the report script
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/block.sh" <<'SH'
          set -uo pipefail
          set_name=$1 index=$2 side=$3
          out="$RUNNER_TEMP/sitting/$set_name-$index-$side.log"
          if [ "$side" = A ]; then bin=$BIN_A; dir="$RUNNER_TEMP/twin/crates/crazyagent"; filter=perf_tests::storage::
          else bin=$BIN_B; dir="$GITHUB_WORKSPACE/crates/kernel/storage"; filter=perf_tests::; fi
          load_start="$(sysctl -n vm.loadavg | awk '{print $2}')"
          started=$(date +%s)
          (cd "$dir" && "$bin" --ignored --nocapture --test-threads=1 "$filter") > "$out.raw" 2>&1
          code=$?
          load_end="$(sysctl -n vm.loadavg | awk '{print $2}')"
          seconds=$(( $(date +%s) - started ))
          { echo "BLOCK set=$set_name index=$index side=$side rc=$code load1_start=$load_start load1_end=$load_end seconds=$seconds"; cat "$out.raw"; } > "$out"
          rm -f "$out.raw"
          python3 -I "$RUNNER_TEMP/report.py" block "$out"
          [ "$code" = 0 ] || { tail -n 30 "$out"; exit 1; }
          SH
          cat > "$RUNNER_TEMP/report.py" <<'PY'
          import os
          import statistics
          import sys

          PAIRS = os.environ["PAIRS"].split()
          B_ONLY = os.environ["B_ONLY"].split()
          WANTED = PAIRS + B_ONLY


          def parse(path):
              head, rows = None, {}
              for raw in open(path):
                  line = raw.rstrip("\n")
                  if line.startswith("BLOCK "):
                      head = dict(pair.split("=", 1) for pair in line.split()[1:])
                      continue
                  at = line.find("PERF ")
                  if at < 0 or line.startswith("PERF-RUN"):
                      continue
                  words = line[at:].split()
                  if len(words) < 5 or words[2] != "storage":
                      continue
                  values = dict(pair.split("=", 1) for pair in words[4:] if "=" in pair)
                  if "p50_ns" in values:
                      p50, p95 = int(values["p50_ns"]), int(values["p95_ns"])
                  else:
                      p50, p95 = int(values["p50"]) * 1000, int(values["p95"]) * 1000
                  rows[words[3]] = (p50, p95, int(values["n"]))
              assert head is not None, path
              return head, rows


          def block(path):
              head, rows = parse(path)
              print(" ".join(f"{k}={v}" for k, v in head.items()))
              for name in WANTED:
                  if name in rows:
                      p50, p95, n = rows[name]
                      print(f"  {name} p50_ns={p50} p95_ns={p95} n={n}")
              missing = [name for name in (PAIRS if head["side"] == "A" else WANTED) if name not in rows]
              print(f"  rows {len(rows)} wanted-missing {len(missing)} {' '.join(missing)}")


          def load(folder, set_name):
              blocks = []
              for name in sorted(os.listdir(folder)):
                  if name.startswith(set_name + "-") and name.endswith(".log"):
                      blocks.append(parse(os.path.join(folder, name)))
              blocks.sort(key=lambda b: int(b[0]["index"]))
              return blocks


          PERCENTILES = (("p50", 0), ("p95", 1))


          def medians(blocks, side, name, k):
              return [rows[name][k] for head, rows in blocks if head["side"] == side and name in rows]


          def gap(values):
              if len(values) != 2:
                  return None
              mean = (values[0] + values[1]) / 2
              return abs(values[0] - values[1]) / mean * 100


          def ratio(blocks, name, k):
              a, b = medians(blocks, "A", name, k), medians(blocks, "B", name, k)
              return statistics.median(b) / statistics.median(a) if a and b else None


          def shown(value, form):
              return "none" if value is None else form.format(value)


          def table(blocks, title):
              print(f"== {title}: {len(blocks)} blocks, order {' '.join(h['side'] for h, _ in blocks)}")
              for head, rows in blocks:
                  ns = sorted({rows[n][2] for n in WANTED if n in rows})
                  print(f"  block {head['index']} {head['side']} load1 {head['load1_start']} -> {head['load1_end']} seconds {head['seconds']} rc {head['rc']} samples per row {ns}")
              ratios = {}
              for name in WANTED:
                  ratios[name] = {}
                  for label, k in PERCENTILES:
                      r = ratio(blocks, name, k)
                      ratios[name][label] = r
                      print(f"  {name} {label} A {medians(blocks, 'A', name, k)} B {medians(blocks, 'B', name, k)} B/A {shown(r, '{:.3f}')}")
              return ratios


          def word(r, floor):
              if r is None or floor is None:
                  return "none"
              return "inside" if abs(r - 1) * 100 <= floor else "outside"


          def report(folder):
              aa = load(folder, "aa")
              gaps = {}
              print(f"== aa: {len(aa)} blocks, order {' '.join(h['side'] for h, _ in aa)}")
              for name in WANTED:
                  gaps[name] = {}
                  for label, k in PERCENTILES:
                      va, vb = medians(aa, "A", name, k), medians(aa, "B", name, k)
                      ga, gb = gap(va), gap(vb)
                      known = [g for g in (ga, gb) if g is not None]
                      gaps[name][label] = (ga, gb, max(known) if known else None)
                      print(f"  {name} {label} A {va} gap {shown(ga, '{:.2f}%')} B {vb} gap {shown(gb, '{:.2f}%')}")
              sets = {set_name: load(folder, set_name) for set_name in ("quiet", "loaded")}
              quiet = table(sets["quiet"], "quiet")
              loaded = table(sets["loaded"], "loaded")
              for name in WANTED:
                  parts = [f"ROW {name}"]
                  for set_name, ratios in (("quiet", quiet), ("loaded", loaded)):
                      parts.append(set_name)
                      for label, _ in PERCENTILES:
                          r = ratios[name][label]
                          parts.append(f"{label} {shown(r, '{:.3f}')} {word(r, gaps[name][label][2])}")
                  parts.append("aa")
                  for label, _ in PERCENTILES:
                      ga, gb, _ = gaps[name][label]
                      parts.append(f"{label} {shown(ga, '{:.2f}%')}/{shown(gb, '{:.2f}%')}")
                  print(" ".join(parts))
              for name in B_ONLY:
                  parts = [f"BONLY {name}"]
                  for set_name in ("quiet", "loaded"):
                      parts.append(set_name)
                      for label, k in PERCENTILES:
                          values = medians(sets[set_name], "B", name, k)
                          parts.append(f"{label}_ns {shown(statistics.median(values) if values else None, '{:.0f}')}")
                  print(" ".join(parts))


          if sys.argv[1] == "block":
              block(sys.argv[2])
          else:
              report(sys.argv[2])
          PY
      - name: Warm-up run of each binary (not measured)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/block.sh" warm 0 A
          bash "$RUNNER_TEMP/block.sh" warm 0 B
      - name: Quiet set, runner alone, A B B A A B B A
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          index=0
          for side in A B B A A B B A; do
            index=$((index + 1))
            bash "$RUNNER_TEMP/block.sh" quiet "$index" "$side"
          done
          python3 -I "$RUNNER_TEMP/report.py" report "$RUNNER_TEMP/sitting" > "$RUNNER_TEMP/sitting/report-after-quiet.txt" || true
          cat "$RUNNER_TEMP/sitting/report-after-quiet.txt"
      - name: Same-binary A/A gap, A A then B B
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          index=0
          for side in A A B B; do
            index=$((index + 1))
            bash "$RUNNER_TEMP/block.sh" aa "$index" "$side"
          done
          python3 -I "$RUNNER_TEMP/report.py" report "$RUNNER_TEMP/sitting" > "$RUNNER_TEMP/sitting/report-after-aa.txt" || true
          cat "$RUNNER_TEMP/sitting/report-after-aa.txt"
      - name: Loaded set, A B B A A B B A beside a workspace build in a third target
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 150
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html>\n' > apps/desktop/dist/index.html
          df -h /
          stop="$RUNNER_TEMP/load.stop"
          rm -f "$stop"
          (
            round=0
            while [ ! -f "$stop" ]; do
              round=$((round + 1))
              echo "LOAD build round $round start $(date +%H:%M:%S)"
              CARGO_TARGET_DIR="$RUNNER_TEMP/target-load" cargo build --workspace --locked > "$RUNNER_TEMP/sitting/load-build-$round.log" 2>&1
              echo "LOAD build round $round end rc $? $(date +%H:%M:%S)"
              [ -f "$stop" ] && break
              echo "LOAD restart: cargo clean -p crazyagent, build again"
              CARGO_TARGET_DIR="$RUNNER_TEMP/target-load" cargo clean -p crazyagent > /dev/null 2>&1 || true
            done
          ) &
          loader=$!
          echo "LOAD loader pid $loader"
          sleep 30
          kill_tree() { local c; for c in $(pgrep -P "$1"); do kill_tree "$c"; done; kill "$1" 2>/dev/null || true; }
          index=0
          status=0
          for side in A B B A A B B A; do
            index=$((index + 1))
            alive=no
            kill -0 "$loader" 2>/dev/null && alive=yes
            echo "LOAD before block $index loader alive $alive cargo $(pgrep -f 'cargo build --workspace' | wc -l | tr -d ' ')"
            bash "$RUNNER_TEMP/block.sh" loaded "$index" "$side" || status=1
          done
          echo "LOAD at the last block's end loader alive $(kill -0 "$loader" 2>/dev/null && echo yes || echo no)"
          touch "$stop"
          kill_tree "$loader"
          wait "$loader" 2>/dev/null || true
          echo "LOAD loader stopped"
          df -h /
          exit "$status"
      - name: Report tables and gate lines (printed, never failed)
        if: ${{ !cancelled() }}
        run: |
          set +e
          python3 -I "$RUNNER_TEMP/report.py" report "$RUNNER_TEMP/sitting" | tee "$RUNNER_TEMP/sitting/report.txt" || true
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: sitting-1445-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sitting
          retention-days: 14
