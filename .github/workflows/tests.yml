name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  DIAG: 6e41f1bc65838a1e05a06b2cd20fe76d7afc942a
  CHORE: 9af0fed035548e0468d31f5db66792da23bf7496
  DIAG_FILE: crates/crazyagent/src/tui/screens/project_page_tests.rs
  GROUP_A: |
    tui::screens::project_page_tests::a_project_page_counts_its_own_change_sets_and_the_rest_as_other_projects
    tui::screens::project_page_tests::the_status_line_counts_the_change_sets_that_wait_for_the_owner
    tui::screens::project_page_tests::the_tools_page_switches_real_tools_and_ignores_reads_for_another_scope
  ROWS: |
    tui::screens::project_page_tests::a_creation_run_in_the_background_finishes_after_its_page_is_gone
    tui::screens::project_page_tests::a_draft_refused_while_another_wizard_is_open_is_kept_ahead_of_that_wizards_draft
    tui::screens::project_page_tests::a_made_project_starts_its_github_publish_once_its_pool_is_assigned_and_says_its_reply
    tui::screens::project_page_tests::a_project_folder_the_engine_cannot_make_says_why_in_the_wizard
    tui::screens::project_page_tests::a_project_page_counts_its_own_change_sets_and_the_rest_as_other_projects
    tui::screens::project_page_tests::create_while_a_move_holds_the_job_waits_its_turn_and_is_made_once_the_move_stops
    tui::screens::project_page_tests::the_status_line_counts_the_change_sets_that_wait_for_the_owner
    tui::screens::project_page_tests::the_team_settings_screen_reads_the_harness_catalog_and_saves_the_picked_master
    tui::screens::project_page_tests::the_tools_page_switches_real_tools_and_ignores_reads_for_another_scope
    tui::screens::project_page_tests::the_wizard_creates_a_real_project_assigns_its_pool_and_opens_it

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: TICKET-0900 project page Linux diagnostic on ubuntu-22.04 (report only)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the diagnostic commit's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='diagnostic %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$DIAG" ] || { echo "::error::the parent is not the diagnostic commit"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$CHORE" ] || { echo "::error::HEAD~2 is not chore/v250 9af0fed035"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^)" = "$DIAG_FILE" ] || { echo "::error::the diagnostic commit touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the diagnostic commit"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        timeout-minutes: 15
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: rustfmt --check on the diagnostic file (expect rc 0)
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check "$DIAG_FILE"
          echo "rustfmt rc 0"
      - name: Build crazyagent-landlock (as the b25 job does)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          test -x "$CARGO_TARGET_DIR/debug/crazyagent-landlock"
          echo "landlock helper built"
      - name: The 10 project page rows with the helper (report only)
        timeout-minutes: 75
        run: |
          set -uo pipefail
          mapfile -t rows < <(printf '%s' "$ROWS" | sed '/^$/d')
          [ "${#rows[@]}" = 10 ] || { echo "::error::expected 10 rows, got ${#rows[@]}"; exit 1; }
          log="$RUNNER_TEMP/rows.log"
          listed=$(cargo test -p crazyagent --lib --locked -- --exact "${rows[@]}" --list 2>/dev/null | grep -cE ': test$' || true)
          echo "listed $listed"
          [ "$listed" = 10 ] || { echo "::error::the filter lists $listed rows, not 10"; exit 1; }
          cargo test -p crazyagent --lib --locked -- --exact "${rows[@]}" > "$log" 2>&1
          rc=$?
          echo "rows rc $rc $(grep -E '^test result:' "$log" | tail -n 1)"
          grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed.txt"
          echo "FAILED $(wc -l < "$RUNNER_TEMP/failed.txt" | tr -d ' '):"
          cat "$RUNNER_TEMP/failed.txt"
          grep -E '^test .* \.\.\. ok$' "$log" || true
          printf '%s' "$GROUP_A" | sed '/^$/d' | sort > "$RUNNER_TEMP/group-a.txt"
          echo "group A rows still red with the helper $(comm -12 "$RUNNER_TEMP/group-a.txt" "$RUNNER_TEMP/failed.txt" | wc -l | tr -d ' '):"
          comm -12 "$RUNNER_TEMP/group-a.txt" "$RUNNER_TEMP/failed.txt"
          echo "== every failure, in full =="
          awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log"
          tail -n 5 "$log"
          exit 0
