name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 940bce1e4796a49bfaa4ac780f2d508d331453f6
  BASE_FULL: 3d3992d3f37f3f50bccb3f81d09bf779050818c4
  FIX_FILES: crates/crazyagent/src/app_plugins.rs crates/crazyagent/src/storage/migrations.rs
  GUARD_ROW: "app_plugins::log_tests::only_app_plugins_code_reaches_the_plugin_store_writers"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: B25-STORE-WRITERS ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -2 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE_FULL" ] || { echo "::error::HEAD~2 is not batch b25 3d3992d3f3"; exit 1; }
          changed="$(git diff --name-only "$BASE_FULL" HEAD^ | tr '\n' ' ')"
          [ "$changed" = "$FIX_FILES " ] || { echo "::error::the ticket range is not the two fix files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the fix files newer than the restored cache, so cargo rebuilds crazyagent
        run: |
          set -euo pipefail
          sleep 2
          read -r -a fixed <<< "$FIX_FILES"
          touch "${fixed[@]}"
          ls -l "${fixed[@]}"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the two fix files (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          read -r -a fixed <<< "$FIX_FILES"
          rustfmt --edition 2024 --check --config skip_children=true "${fixed[@]}"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent --lib --tests with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings crazyagent checked $app"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$app" -ge 1 ] || exit 1
      - name: Rows at tip, the guard rows and the sweep rows (expect failed 0, the guard and the 3 sweep rows ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- app_plugins::log_tests:: app_plugins::host_tests:: storage::migrations:: > "$log" 2>&1
          code=$?
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          grep -E '^test .* FAILED$|panicked at|store writers reached' "$log" | head -n 20 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true; tail -n 20 "$log"; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          named=0
          for r in log_tests::only_app_plugins_code_reaches_the_plugin_store_writers log_tests::the_store_writer_scan_counts_functions_and_modules_not_types host_tests::the_start_sweep_removes_only_unreferenced_plugin_key_files host_tests::a_key_a_kept_replaced_copy_names_survives_the_start_sweep host_tests::an_unreadable_replaced_copy_keeps_every_plugin_key; do
            n="$(grep -cxF "test app_plugins::$r ... ok" "$log" || true)"
            echo "  $r ok $n"
            named=$((named + n))
          done
          echo "rows tip rc $code passed $passed failed $failed named-ok $named built $built"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$named" = 5 ] && [ "$built" -ge 1 ] || exit 1
      - name: Red, the guard row over the base fix files (expect failed 1 naming storage/migrations.rs)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          read -r -a fixed <<< "$FIX_FILES"
          for f in "${fixed[@]}"; do git show "$BASE_FULL:$f" > "$f"; done
          git diff --stat HEAD^
          sleep 2
          touch "${fixed[@]}"
          log="$RUNNER_TEMP/red.log"
          cargo test -p crazyagent --lib --locked -- --exact "$GUARD_ROW" > "$log" 2>&1
          code=$?
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          grep -E '^test .* FAILED$|panicked at|store writers reached' "$log" | head -n 20 || true
          grep -qE '^test result:' "$log" || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true; tail -n 20 "$log"; }
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          named="$(grep -cxF "test $GUARD_ROW ... FAILED" "$log" || true)"
          said="$(grep -cE 'store writers reached from .*storage/migrations\.rs' "$log" || true)"
          echo "red rc $code passed $passed failed $failed named $named said $said built $built"
          git checkout HEAD^ -- "${fixed[@]}"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$code" = 101 ] && [ "$failed" = 1 ] && [ "$named" = 1 ] && [ "$said" -ge 1 ] && [ "$built" -ge 1 ] || exit 1
