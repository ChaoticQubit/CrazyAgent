name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 95d322e48698edd4a30c5aa4ec9133befe1bd00a
  RED_FULL: f92074d9cbedf5846fa1a96ea0fd58b6d30b4965
  BASE_FULL: dc2024fa4d3dd73dc02bf06345895c82ab286840
  GUARD_RED_FULL: cb99d5ff79ecd36f4b3150acc50a1f41df8e9033
  K: crazyagent-kernel-sandbox
  OWNER_GIT: "windows::engine_rows::owner_git_rows::"
  ENTRIES: "profile::engine_entries_tests::"
  CODES: "team::runtime::tests::launch_codes::"
  RUNNER: "research::runner::"
  TEAM: "team::runtime::"
  ONBOARDING: "onboarding::"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: ENTRIES-CAP and GRANT CR fixes on windows-2022
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 18
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$RED_FULL" ] || { echo "::error::HEAD~4 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$BASE_FULL" ] || { echo "::error::HEAD~5 is not the ticket base"; exit 1; }
          [ "$(git rev-parse HEAD^^2^)" = "$GUARD_RED_FULL" ] || { echo "::error::the merged GRANT tip's parent is not the ratchet red"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          rows() {
            local pkg="$1" filter="$2" label="$3" want="$4" wantfail="${5:-0}" log="$RUNNER_TEMP/$3.log" list="$RUNNER_TEMP/$3.list" matched listed code failed passed ignored
            cargo test -p "$pkg" --lib --locked -- "$filter" --list > "$list" 2>/dev/null
            matched="$(grep -cE ': test$' "$list" || true)"
            listed="$(grep -cE "^${filter}.*: test$" "$list" || true)"
            echo "$label filter $filter matches these modules (rows per module):"
            grep -E ': test$' "$list" | sed -E 's/::[^:]+: test$//' | sort | uniq -c || true
            cargo test -p "$pkg" --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(grep -cE "^test ${filter}.* \.\.\. ok$" "$log" || true)"
            ignored="$(grep -cE "^test ${filter}.* \.\.\. ignored" "$log" || true)"
            echo "$label rc $code matched $matched listed under $filter $listed want $want passed $passed ignored $ignored failed $failed want failed $wantfail"
            [ "$failed" = "$wantfail" ] && [ "$listed" = "$want" ] && [ "$matched" = "$listed" ] && [ "$passed" = "$((listed - ignored - failed))" ] || return 1
            [ "$wantfail" != 0 ] || [ "$code" = 0 ]
          }
          ROWS
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/crazyagent-clippy.log"
          cargo clippy -p "crazyagent" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "crazyagent-clippy windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent lib test build, logged (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/norun.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "test build windows-2022 rc $code errors $errors gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: Build the boundary helper beside the test binaries
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Tip, owner git rows == list (9); launch_codes is in team runtime tests, cfg(all(test, unix)), so none on windows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          fail=0
          rows "$K" "$OWNER_GIT" owner-git 9 || fail=1
          [ "$fail" = 0 ] || exit 1

  linux:
    name: ENTRIES-CAP and GRANT CR fixes on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 18
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$RED_FULL" ] || { echo "::error::HEAD~4 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$BASE_FULL" ] || { echo "::error::HEAD~5 is not the ticket base"; exit 1; }
          [ "$(git rev-parse HEAD^^2^)" = "$GUARD_RED_FULL" ] || { echo "::error::the merged GRANT tip's parent is not the ratchet red"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          rows() {
            local pkg="$1" filter="$2" label="$3" want="$4" wantfail="${5:-0}" log="$RUNNER_TEMP/$3.log" list="$RUNNER_TEMP/$3.list" matched listed code failed passed ignored
            cargo test -p "$pkg" --lib --locked -- "$filter" --list > "$list" 2>/dev/null
            matched="$(grep -cE ': test$' "$list" || true)"
            listed="$(grep -cE "^${filter}.*: test$" "$list" || true)"
            echo "$label filter $filter matches these modules (rows per module):"
            grep -E ': test$' "$list" | sed -E 's/::[^:]+: test$//' | sort | uniq -c || true
            cargo test -p "$pkg" --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(grep -cE "^test ${filter}.* \.\.\. ok$" "$log" || true)"
            ignored="$(grep -cE "^test ${filter}.* \.\.\. ignored" "$log" || true)"
            echo "$label rc $code matched $matched listed under $filter $listed want $want passed $passed ignored $ignored failed $failed want failed $wantfail"
            [ "$failed" = "$wantfail" ] && [ "$listed" = "$want" ] && [ "$matched" = "$listed" ] && [ "$passed" = "$((listed - ignored - failed))" ] || return 1
            [ "$wantfail" != 0 ] || [ "$code" = 0 ]
          }
          ROWS
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: The engine guard ratchet and its tests (expect rc 0 each)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set +e
          make engine-guard-check; check=$?
          make test-engine-guard-script > "$RUNNER_TEMP/guard-tests.log" 2>&1; tests=$?
          grep -E '^(not ok|ℹ (pass|fail))' "$RUNNER_TEMP/guard-tests.log"
          make sleeps-check; sleeps=$?
          make test-sleeps-script > "$RUNNER_TEMP/sleeps-tests.log" 2>&1; sleeps_tests=$?
          grep -E '^(not ok|ℹ (pass|fail))' "$RUNNER_TEMP/sleeps-tests.log"
          echo "engine-guard ubuntu-22.04 check rc $check tests rc $tests sleeps rc $sleeps sleeps tests rc $sleeps_tests"
          [ "$check" = 0 ] && [ "$tests" = 0 ] && [ "$sleeps" = 0 ] && [ "$sleeps_tests" = 0 ] || exit 1
      - name: kernel clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/crazyagent-clippy.log"
          cargo clippy -p "crazyagent" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "crazyagent-clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent lib test build, logged (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/norun.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "test build ubuntu-22.04 rc $code errors $errors gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: The engine guard ratchet at the GRANT ratchet red refuses the two if-branch guards (expect rc 1, those lines)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set +e
          added="$(git diff --name-only --diff-filter=A "$GUARD_RED_FULL" HEAD -- crates scripts)"
          echo "added since the ratchet red, removed for this leg: ${added:-none}"
          [ -z "$added" ] || printf '%s\n' "$added" | xargs git rm -q -f --
          git checkout "$GUARD_RED_FULL" -- crates scripts
          changed="$(git diff --name-only "$GUARD_RED_FULL" -- crates scripts | wc -l | tr -d ' ')"
          [ "$changed" = 0 ] || { echo "::error::crates and scripts are not at the ratchet red"; exit 1; }
          node scripts/quality/engine-guard.mjs > "$RUNNER_TEMP/guard-red.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/guard-red.log"
          git checkout HEAD -- crates scripts
          git diff --quiet HEAD || { echo "::error::the tree is not back at the tip"; exit 1; }
          launch="$(grep -c 'runner.rs#launch_leased: 3 unguarded installs (lines 1309,1361,1391), entry pins 1' "$RUNNER_TEMP/guard-red.log")"
          prepare="$(grep -c 'team/runtime.rs:9417,9589,9595: fn prepare installs a sandbox with no guard_engine' "$RUNNER_TEMP/guard-red.log")"
          echo "guard-red ubuntu-22.04 rc $code launch_leased $launch prepare $prepare"
          [ "$code" = 1 ] && [ "$launch" = 1 ] && [ "$prepare" = 1 ] || exit 1
      - name: Tip, engine entry rows == list (5), launch code rows == list (2)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          fail=0
          rows "$K" "$ENTRIES" entries 5 || fail=1
          rows crazyagent "$CODES" launch-codes 2 || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: Red, engine entry rows (4 listed, 2 failed) with the tip's spawn gate bind, launch code rows (2 listed, 1 failed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          set +e
          added="$(git diff --name-only --diff-filter=A "$RED_FULL" HEAD -- crates)"
          echo "added since the red commit, removed for this leg: ${added:-none}"
          [ -z "$added" ] || printf '%s\n' "$added" | xargs git rm -q -f --
          git checkout "$RED_FULL" -- crates
          changed="$(git diff --name-only "$RED_FULL" -- crates | wc -l | tr -d ' ')"
          [ "$changed" = 0 ] || { echo "::error::the crates are not at the red commit"; exit 1; }
          sed -i 's/std::os::unix::net::UnixListener::bind(/kernel_processes::spawn_gate::bind_unix_std(/' crates/kernel/sandbox/src/profile/engine_entries_tests.rs
          echo "red overlay: $(git diff --stat "$RED_FULL" -- crates | tail -n 1)"
          fail=0
          rows "$K" "$ENTRIES" red-entries 4 2 || fail=1
          grep -E 'engine runtime folder has too many entries' "$RUNNER_TEMP/red-entries.log" | head -n 2 || { echo "::error::the red rows did not fail on the old refusal"; fail=1; }
          rows crazyagent "$CODES" red-launch-codes 2 1 || fail=1
          grep -E 'left: "sandbox_refused"' "$RUNNER_TEMP/red-launch-codes.log" || { echo "::error::the red launch code row did not read sandbox_refused"; fail=1; }
          git checkout HEAD -- crates
          git diff --quiet HEAD || { echo "::error::the tree is not back at the tip"; exit 1; }
          [ "$fail" = 0 ] || exit 1
      - name: Tip and base, research runner, team runtime and onboarding rows, each all ok and listed as many at tip as at base
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          set +e
          source "$RUNNER_TEMP/rows.sh"
          count() { cargo test -p crazyagent --lib --locked -- "$1" --list 2>/dev/null | grep -cE "^$1.*: test$"; }
          declare -A tip
          for filter in "$RUNNER" "$TEAM" "$ONBOARDING"; do tip[$filter]="$(count "$filter")"; done
          added="$(git diff --name-only --diff-filter=A "$BASE_FULL" HEAD -- crates)"
          [ -z "$added" ] || printf '%s\n' "$added" | xargs git rm -q -f --
          git checkout "$BASE_FULL" -- crates
          declare -A base
          for filter in "$RUNNER" "$TEAM" "$ONBOARDING"; do base[$filter]="$(count "$filter")"; done
          git checkout HEAD -- crates
          git diff --quiet HEAD || { echo "::error::the tree is not back at the tip"; exit 1; }
          fail=0
          for filter in "$RUNNER" "$TEAM" "$ONBOARDING"; do
            echo "$filter listed tip ${tip[$filter]} base ${base[$filter]}"
            want="${tip[$filter]}"
            [ "$filter" != "$TEAM" ] || want="$((base[$filter] + 1))"
            [ "${tip[$filter]}" = "$want" ] || { echo "::error::$filter lists ${tip[$filter]} at tip, want $want"; fail=1; }
            rows crazyagent "$filter" "tip-$(echo "$filter" | tr -c 'a-z\n' '-')" "${tip[$filter]}" || fail=1
          done
          [ "$fail" = 0 ] || exit 1
