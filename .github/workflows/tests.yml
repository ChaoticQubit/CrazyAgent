name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "26.12.1"
  TIP_FULL: b947710705831bc137b812173dbb13e85ca65a64
  RED_FULL: 39e935d2cd82a94ce435bbd5600f16617e93af4d
  BASE_FULL: c6f139883806b94c9f7e3ea9d8c5ee3529081ea8
  FIX_RS: "crates/crazyagent/src/tui/theme.rs crates/crazyagent/src/tui/theme/appearance.rs crates/crazyagent/src/tui/prefs.rs crates/crazyagent/src/tui/run.rs crates/crazyagent/src/tui/screens/profile_form.rs"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: THEME-FOLLOW-SYSTEM ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
            want: "tui::theme::appearance::tests::macos_reads_defaults_at_its_absolute_path tui::theme::appearance::tests::windows_reads_reg_exe_under_system_root tui::theme::appearance::tests::windows_without_a_drive_system_root_uses_c_windows tui::theme::appearance::tests::windows_light_or_unknown_answers_read_light tui::theme::appearance::tests::linux_gnome_reads_gsettings_at_its_absolute_path_never_from_path tui::theme::appearance::tests::linux_gnome_default_light_or_failure_reads_light tui::theme::appearance::tests::linux_unknown_desktop_asks_gsettings_and_reads_light_when_it_fails tui::theme::appearance::tests::linux_kde_reads_kdeglobals_without_starting_a_program tui::theme::appearance::tests::linux_kde_reads_the_general_section_under_home_config tui::theme::appearance::tests::a_program_that_is_not_an_absolute_path_is_never_started tui::theme::appearance::tests::a_real_read_answers_within_five_seconds tui::theme::tests::the_follow_choice_names_the_system_off_macos tui::prefs::tests::the_follow_choice_is_saved_as_follow_system_and_the_old_word_still_reads tui::prefs::tests::colors_round_trip_and_bad_files_fall_back tui::render_tests::settings_frames_match_the_design tui::theme::appearance::tests::this_build_reads_the_linux_desktop_setting"
          - os: windows-2022
            leg: win
            cache: Windows
            want: "tui::theme::appearance::tests::macos_reads_defaults_at_its_absolute_path tui::theme::appearance::tests::windows_reads_reg_exe_under_system_root tui::theme::appearance::tests::windows_without_a_drive_system_root_uses_c_windows tui::theme::appearance::tests::windows_light_or_unknown_answers_read_light tui::theme::appearance::tests::linux_gnome_reads_gsettings_at_its_absolute_path_never_from_path tui::theme::appearance::tests::linux_gnome_default_light_or_failure_reads_light tui::theme::appearance::tests::linux_unknown_desktop_asks_gsettings_and_reads_light_when_it_fails tui::theme::appearance::tests::linux_kde_reads_kdeglobals_without_starting_a_program tui::theme::appearance::tests::linux_kde_reads_the_general_section_under_home_config tui::theme::appearance::tests::a_program_that_is_not_an_absolute_path_is_never_started tui::theme::appearance::tests::a_real_read_answers_within_five_seconds tui::theme::tests::the_follow_choice_names_the_system_off_macos tui::prefs::tests::the_follow_choice_is_saved_as_follow_system_and_the_old_word_still_reads tui::prefs::tests::colors_round_trip_and_bad_files_fall_back tui::render_tests::settings_frames_match_the_design tui::theme::appearance::tests::this_build_reads_the_windows_setting"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not chore/v250 c6f1398838"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: caps and sleeps ratchets at the base and the tip (expect sleeps rc 0 both; no tip caps problem missing at the base, none naming a ticket file)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          ct=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          st=$?
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL" > /dev/null 2>&1
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs) > "$RUNNER_TEMP/caps-base.txt" 2>&1
          cb=$?
          (cd "$RUNNER_TEMP/base" && node scripts/quality/sleeps.mjs) > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          sb=$?
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-tip.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-tip-files.txt" || true
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-base.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-base-files.txt" || true
          git diff --name-only "$BASE_FULL" HEAD^ | sort > "$RUNNER_TEMP/ticket-files.txt"
          new="$(comm -23 <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-tip.txt" | sort) <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-base.txt" | sort) | grep -c . || true)"
          ticket="$(comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" | grep -c . || true)"
          tail -n 1 "$RUNNER_TEMP/caps-tip.txt"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt"
          tail -n 1 "$RUNNER_TEMP/sleeps-tip.txt"
          comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" || true
          echo "caps rc tip $ct base $cb problems tip $(grep -c . "$RUNNER_TEMP/caps-tip-files.txt") base $(grep -c . "$RUNNER_TEMP/caps-base-files.txt") new-at-tip $new on-ticket-files $ticket sleeps rc tip $st base $sb"
          [ "$st" = 0 ] && [ "$sb" = 0 ] && [ "$ticket" = 0 ] && [ "$new" = 0 ] || exit 1
      - name: node theme-help rows at the tip, then red with the red commit's keys.ts (expect tip pass, red fail)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log"
          (cd apps/desktop && node --test --test-reporter=tap test/theme-help-words.test.mjs) > "$RUNNER_TEMP/node-tip.log" 2>&1
          tip=$?
          grep -E '^# (pass|fail)|^not ok' "$RUNNER_TEMP/node-tip.log" || true
          git checkout "$RED_FULL" -- apps/desktop/src/ui/keys.ts
          (cd apps/desktop && node --test --test-reporter=tap test/theme-help-words.test.mjs) > "$RUNNER_TEMP/node-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/ui/keys.ts
          grep -E '^# (pass|fail)|^not ok' "$RUNNER_TEMP/node-red.log" || true
          named="$(grep -cE "^not ok [0-9]+ - the Theme help names the computer's own setting on Windows and Linux" "$RUNNER_TEMP/node-red.log" || true)"
          echo "node npm rc $ci tip rc $tip red rc $red red names the row $named"
          [ "$ci" = 0 ] && [ "$tip" = 0 ] && [ "$red" != 0 ] && [ "$named" -ge 1 ] || exit 1
      - name: rustfmt of crazyagent (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent lib with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent lib rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: clippy crazyagent lib test target with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-libtest.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent tests rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: ticket rows at the tip by want list, plus the elapsed ms of one real system_appearance (expect each wanted row ok, failed 0, crate gate)
        id: tiprows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        env:
          WANT: ${{ matrix.want }}
        run: |
          set +e
          log="$RUNNER_TEMP/rows-tip.log"
          cargo test -p crazyagent --lib --locked -- tui::theme:: tui::prefs:: tui::render_tests::settings_frames_match_the_design tui::screens::profile_form:: > "$log" 2>&1
          c1=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          read -r -a want <<< "$WANT"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.} \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          cargo test -p crazyagent --lib --locked -- tui::theme::appearance::tests::a_real_read_answers_within_five_seconds --exact --nocapture > "$RUNNER_TEMP/perf.log" 2>&1
          c2=$?
          grep -E '^system_appearance ms ' "$RUNNER_TEMP/perf.log" || echo "  no system_appearance line"
          echo "tip rows rc $c1 $c2 failed $failed wanted ${#want[@]} ok $ok gates crazyagent $g1"
          [ "$c1" = 0 ] && [ "$c2" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "${#want[@]}" = 16 ] && [ "$g1" -ge 1 ] || exit 1
      - name: Red B, three one-line mutations at the tip (label back to Follow macOS, stored word back to follow-macos, gsettings without its path; expect the four guard rows FAILED)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          t=crates/crazyagent/src/tui/theme.rs
          p=crates/crazyagent/src/tui/prefs.rs
          a=crates/crazyagent/src/tui/theme/appearance.rs
          m1="$(grep -cF 'const FOLLOW_LABEL: &str = "Follow system";' "$t" || true)"
          m2="$(grep -cF 'Colors::FollowSystem => "follow-system",' "$p" || true)"
          m3="$(grep -cF 'const GSETTINGS: &str = "/usr/bin/gsettings";' "$a" || true)"
          sed -i 's|const FOLLOW_LABEL: &str = "Follow system";|const FOLLOW_LABEL: \&str = "Follow macOS";|' "$t"
          sed -i 's|Colors::FollowSystem => "follow-system",|Colors::FollowSystem => "follow-macos",|' "$p"
          sed -i 's|const GSETTINGS: &str = "/usr/bin/gsettings";|const GSETTINGS: \&str = "gsettings";|' "$a"
          git diff --stat -- "$t" "$p" "$a" | tail -n 1
          sleep 2
          touch "$t" "$p" "$a"
          log="$RUNNER_TEMP/rows-mut.log"
          cargo test -p crazyagent --lib --locked -- tui::theme:: tui::prefs:: tui::render_tests::settings_frames_match_the_design > "$log" 2>&1
          c1=$?
          git checkout HEAD^ -- "$t" "$p" "$a"
          grep -E '^test .* FAILED$' "$log" | head -n 20 || true
          red=0
          for row in tui::theme::tests::the_follow_choice_names_the_system_off_macos tui::render_tests::settings_frames_match_the_design tui::prefs::tests::the_follow_choice_is_saved_as_follow_system_and_the_old_word_still_reads tui::theme::appearance::tests::linux_gnome_reads_gsettings_at_its_absolute_path_never_from_path; do
            n="$(grep -cE "^test ${row//./\\.} \.\.\. FAILED$" "$log" || true)"
            [ "$n" = 1 ] || echo "  not FAILED: $row ($n)"
            red=$((red + n))
          done
          echo "mutation rows rc $c1 lines found $m1 $m2 $m3 failed-as-wanted $red of 4"
          [ "$m1" = 1 ] && [ "$m2" = 1 ] && [ "$m3" = 1 ] && [ "$c1" != 0 ] && [ "$red" = 4 ] || exit 1
      - name: Red A, the red commit's five fix files under the tip rows (expect a compile failure naming the new reader or the renamed choice)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          read -r -a files <<< "$FIX_RS"
          git checkout "$RED_FULL" -- "${files[@]}"
          git diff --cached --stat HEAD^ | tail -n 1
          sleep 2
          touch "${files[@]}"
          log="$RUNNER_TEMP/rows-red.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          c1=$?
          grep -E '^error(\[|:)' "$log" | head -n 10 || true
          named="$(grep -cE 'appearance_on|this_os|FollowSystem' "$log" || true)"
          echo "red rows rc $c1 compile errors naming the reader or choice $named"
          [ "$c1" != 0 ] && [ "$named" -ge 1 ] || exit 1
