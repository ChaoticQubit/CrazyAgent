name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  probe-rows-windows:
    name: Windows G1 rows and clippy at fix/v243-g1-win-probe a2aca2129 (r2)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Windows G1 rows and clippy at a2aca2129
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/probe-rows-windows.txt"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- harnesses::probe_tests research::accounts::accounts_tests 2>&1 | tee "$out"
          lib=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --test team_tool_binary --locked --no-fail-fast 2>&1 | tee -a "$out"
          tool=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" clippy -p crazyagent --all-targets --locked --keep-going -- -D warnings 2>&1 | tee -a "$out"
          clip=${PIPESTATUS[0]}
          printf '| check | exit |\n| --- | --- |\n| lib probe_tests + research accounts | %s |\n| test team_tool_binary | %s |\n| clippy -p crazyagent --all-targets -D warnings | %s |\n' "$lib" "$tool" "$clip" >> "$GITHUB_STEP_SUMMARY"
          [ "$lib" = 0 ] && [ "$tool" = 0 ] && [ "$clip" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-probe-rows-windows
          path: ${{ runner.temp }}/probe-rows-windows.txt
          if-no-files-found: warn
          retention-days: 14
