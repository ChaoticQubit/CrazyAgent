name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  BUN_DARWIN_ARM64_SHA256: 80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403
  NODE_DARWIN_ARM64_SHA256: 1901d539912c02afa10d1cc126943a8855a7eedebe830119463470db5e6c59e8
  RUSTC_DARWIN_ARM64_SHA256: 738e3f60114b20550fcf4f8a57c9cea0544239f214709f45594ff3fde327f577
  CARGO_DARWIN_ARM64_SHA256: de51d4fade4f31ad8ec405261cc96bedc000d905f98980027610d6e288dbe21b
  RUST_STD_DARWIN_ARM64_SHA256: 2de831ef563ce772519a4d18ba2659f0f7428d497ef66dad24b5a35e8f8cd177
  CLIPPY_DARWIN_ARM64_SHA256: 1ad080040ff0f4f8af0751bd7fa1fb1901212f8d164cecaa3c47b0654e0916f2
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ENGINE_TESTS_EXCLUDE: >-
    e2e_tui research_engine team_engine onboarding research_runner research_service tui_v1_e2e codex_app_server_live launch_context_live codex_bridge_live agents_live
    qualification_boundary worker_engine_boundary accounts_binary e2e_add_existing setup_network harness_catalog_bundled_rcli acceptance_v2_rcli_usage
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
  DESKTOP_TESTS_EXCLUDE: picker_windows accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: V250 catch-up 244 Windows rows at ${{ matrix.at }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            at: tip
            ref: ''
          - runner: windows-2025
            at: tip
            ref: ''
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Keep the parent arity patch outside the code checkout
        run: |
          set -euo pipefail
          cp .github/farm-parent-arity.patch "$RUNNER_TEMP/parent-arity.patch"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ matrix.ref != '' }}
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ matrix.ref }}
      - name: Apply the start_store arity fix the parent's test rows need to compile
        if: ${{ startsWith(matrix.at, 'parent') }}
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/parent-arity.patch"
          git diff --stat
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy on the crazyagent library
        if: ${{ matrix.at == 'tip' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() && matrix.at == 'tip' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the boundary helper beside the test binaries, as the farm archive does
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Storage, log, service and launch rows, the 8 rows red at 129071a94 skipped (V250-WINDOWS-PARENT-REDS)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- storage:: app_plugins::store:: memory:: worktrees:: settings_log:: sessions_log:: landing_log:: launch_context:: service::tests:: harnesses::launch:: --skip current_holds_only_for_the_definition_install_would_write_now --skip a_definition_that_runs_another_program_is_told_apart_from_one_with_another_path --skip an_executable_path_with_escaped_characters_is_still_found_in_its_definition --skip stale_replaces_a_definition_only_for_a_private_copy_of_the_bundled_engine --skip launchd_plist_gives_the_engine_the_defining_home_escaped --skip an_acp_driver_hands_prompts_interrupts_and_lines_to_its_protocol --skip an_acp_driver_opens_its_session_with_the_engine_servers_it_is_given --skip a_demo_clear_tombstones_every_sessions_event_of_its_project_and_no_other 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "rows at ${{ matrix.at }}:"
          grep -E '^test result|^test .* FAILED$|could not compile' "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
