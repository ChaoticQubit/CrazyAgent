name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 39221a7edf00ab781e7722359cada80a19af6875
  BASE: 0202af53353164420170fce3f9073b85a3094bcd
  FILES: "crates/crazyagent/src/storage/windows_tests.rs "
  FILTER: "storage::windows_tests::"
  ROWS: "13"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: B03-CR8 storage windows_tests rows on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE" ] || { echo "::error::HEAD~2 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, Windows clippy on the crazyagent lib and its tests (expect rc 0 and 0 errors under -D warnings, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/tip-clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
          echo "CLIPPY rc $rc errors $errors warnings $warnings checked crazyagent $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Tip, the storage windows_tests rows (expect listed 13, 13 passed)
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run > "$RUNNER_TEMP/tip-build.log" 2>&1
          brc=$?
          tail -n 20 "$RUNNER_TEMP/tip-build.log"
          listed=$(cargo test -p crazyagent --lib --locked -- --list "$FILTER" 2>/dev/null | grep -cE ': test$' || true)
          log="$RUNNER_TEMP/tip-rows.log"
          cargo test -p crazyagent --lib --locked -- "$FILTER" > "$log" 2>&1
          rc=$?
          grep -E '^test .*(ok|FAILED|ignored)$|panicked at|^test result:' "$log" || true
          grep -A3 'panicked at' "$log" | cut -c1-400 | head -20 || true
          passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
          failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
          echo "TIP build rc $brc listed $listed rc $rc passed $passed failed $failed expected $ROWS"
          [ "$brc" = 0 ] || { echo "::error::the lib tests did not build"; exit 1; }
          [ "$listed" = "$ROWS" ] || { echo "::error::the filter lists $listed rows, not $ROWS"; exit 1; }
          [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$ROWS" ] || { echo "::error::the rows are not green"; exit 1; }
      - name: Gate, crazyagent was built (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          n=$(cat "$RUNNER_TEMP"/tip-clippy.log "$RUNNER_TEMP"/tip-build.log "$RUNNER_TEMP"/tip-rows.log 2>/dev/null | grep -cE '^ +Compiling crazyagent v' || true)
          echo "GATE Compiling crazyagent $n"
          [ "$n" -ge 1 ]
