name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ROW: spawn_gate::tests::a_kept_start_inside_the_gate_panics_instead_of_waiting_for_its_keeper

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux spawn_gate rows, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Red removes the kept guard
        if: matrix.side == 'red'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = "crates/crazyagent/src/spawn_gate.rs"
          s = open(p).read()
          o = '    assert!(\n        !HELD.get(),\n        "a kept start waits on a thread that already holds the spawn gate"\n    );\n'
          assert s.count(o) == 1
          open(p, "w").write(s.replace(o, ""))
          PY
          git diff
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows and their expected results
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          out="$RUNNER_TEMP/spawn-gate-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib -- spawn_gate:: 2>&1 | tee -a "$out"
          row=$(grep -E "^test $ROW( - should panic)? \.\.\. " "$out" | sed -E 's/.* \.\.\. //')
          verdict=pass
          if [ "$SIDE" = red ]; then
            [ "$row" = FAILED ] || verdict=fail
            grep -q "note: test did not panic as expected" "$out" || verdict=fail
          else
            [ "$row" = ok ] || verdict=fail
            grep -qE "^test result: ok\." "$out" || verdict=fail
          fi
          { echo "| side | row | verdict |"; echo "| --- | --- | --- |"; echo "| $SIDE | ${row:-none} | $verdict |"; } >> "$GITHUB_STEP_SUMMARY"
          echo "VERDICT $SIDE row=${row:-none} verdict=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-spawn-gate-${{ matrix.side }}
          path: ${{ runner.temp }}/spawn-gate-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
