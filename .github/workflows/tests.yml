name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 8bb187931865c4db589cc06af96e09a5010272ac
  ROW: project_list_pages_the_full_store_in_id_order

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: LIST-CUT row and clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the fix tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "${#TIP_FULL}" = 40 ] || { echo "::error::TIP_FULL is not a full sha"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch the locked crates
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: The list-cut row at the fix tip
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/row.log"
          touch crates/crazyagent/tests/project_list_cut.rs
          dbus-run-session -- bash -c 'printf "farm-keyring\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; exec "$@"' row cargo test -p crazyagent --locked --test project_list_cut -- > "$log" 2>&1
          code=$?
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          ok="$(grep -cE "^test ${ROW} \.\.\. ok$" "$log")"
          one="$(grep -cE '^test result: ok\. 1 passed; 0 failed;' "$log")"
          echo "BUILT $built ROW rc $code ok $ok one-passed $one"
          [ "$built" -gt 0 ] && [ "$code" = 0 ] && [ "$ok" = 1 ] && [ "$one" = 1 ] || { echo "::error::the row is not green with 1 passed"; tail -n 40 "$log"; exit 1; }
      - name: Clippy the list-cut test
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/crazyagent/tests/project_list_cut.rs
          cargo clippy -p crazyagent --test project_list_cut --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 100 || true
          tail -n 5 "$log"
          echo "CHECKED crazyagent $checked CLIPPY rc $code"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked, the cache was read as fresh"; exit 1; }
          [ "$code" = 0 ] || { echo "::error::clippy -D failed"; exit 1; }
