name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: aa234bc5ccf61a96775a0229b413e110dbf04b68
  RED_FULL: 1c09ffb784bce872945864c9aeb409e1fbfc7d13
  BASE_FULL: ef8f215ca9d869b317a2e25e74ebee80dd09b487
  WIN_FILE: crates/kernel/plugin_host/src/registry_folder_windows_tests.rs
  NEW_ROW: registry_folder_windows_tests::windows_mklink_takes_a_path_with_parentheses

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: PF-TEST-HELPERS-WIN plugin-host on ${{ matrix.os }} at ${{ matrix.side }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            side: tip
          - os: windows-2022
            side: red
          - os: ubuntu-22.04
            side: tip
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red row commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~3 HEAD^ | tr '\n' ' ')" = "crates/kernel/plugin_host/src/assets_tests.rs crates/kernel/plugin_host/src/registry_folder_windows_tests.rs " ] || { echo "::error::the range touches more than the two test files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          if [ "${{ matrix.side }}" = red ]; then
            git checkout HEAD~2 -- "$WIN_FILE"
            git diff --quiet HEAD~2 -- "$WIN_FILE" || { echo "::error::the Windows test file is not the red commit"; exit 1; }
            git diff --stat HEAD^
            echo "side red: the base helper with the new row only"
          fi
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt check of the two touched test files at tip (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          rustfmt --edition 2024 --check crates/kernel/plugin_host/src/assets_tests.rs "$WIN_FILE"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: plugin-host clippy --lib --tests with warnings denied at tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-plugin-host --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +Checking crazyagent-kernel-plugin-host ' "$log" || true)"
          echo "clippy ${{ matrix.os }} rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: New Windows row at red, base helper (expect listed 1, failed 1 at the refused-set assert line 179)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'red' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/red-row.log"
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- --exact "$NEW_ROW" --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- --exact "$NEW_ROW" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 40 || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "red row rc $code listed $listed failed $failed"
          [ "$listed" = 1 ] && [ "$failed" = 1 ] && grep -qE 'panicked at crates.kernel.plugin_host.src.registry_folder_windows_tests\.rs:179:' "$log" || exit 1
      - name: Every Windows registry folder row at tip (expect listed 13, passed 13)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'windows-2022' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/win-rows.log"
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- registry_folder_windows_tests:: --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-plugin-host --lib --locked -- registry_folder_windows_tests:: > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 60 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          new="$(grep -cE "^test $NEW_ROW \.\.\. ok$" "$log" || true)"
          echo "win rows rc $code listed $listed passed $passed failed $failed new-row-ok $new"
          [ "$code" = 0 ] && [ "$listed" = 13 ] && [ "$passed" = 13 ] && [ "$failed" = 0 ] && [ "$new" = 1 ] || exit 1
