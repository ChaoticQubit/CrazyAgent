name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FIX_TIP: a1fb7713b5dd4307072eef086177541b1466ef4a
  PROBE_PICK: 952bf21195b30fa9da41b882a2ab0602fb22e641

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: sandbox and crazyagent clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the probe pick's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe pick %H %s' HEAD^
          git log -1 --format='fix tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^)" = "$PROBE_PICK" ] || { echo "::error::the parent is not the probe pick"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = "$FIX_TIP" ] || { echo "::error::the grandparent is not the fix tip"; exit 1; }
          git diff --stat HEAD^^ HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the probe pick"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy kernel sandbox
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-sandbox.log"
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "sandbox clippy rc $code"
          exit $code
      - name: Clippy crazyagent
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-crazyagent.log"
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "crazyagent clippy rc $code"
          exit $code
  windows:
    name: sandbox and crazyagent clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the probe pick's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe pick %H %s' HEAD^
          git log -1 --format='fix tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^)" = "$PROBE_PICK" ] || { echo "::error::the parent is not the probe pick"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = "$FIX_TIP" ] || { echo "::error::the grandparent is not the fix tip"; exit 1; }
          git diff --stat HEAD^^ HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the probe pick"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy kernel sandbox
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-sandbox.log"
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(warning|error)|-->' "$log" | sort -u | head -n 60 || true
          echo "sandbox clippy rc $code"
          exit $code
      - name: Clippy crazyagent
        if: always()
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-crazyagent.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(warning|error)|-->' "$log" | sort -u | head -n 60 || true
          echo "crazyagent clippy rc $code"
          exit $code
