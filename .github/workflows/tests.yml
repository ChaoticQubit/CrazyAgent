name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RELOAD: team::runtime::tests::hidden_seers_tests::a_seer_held_before_an_engine_restart_stays_listed_and_restarts
  GUARD: team::runtime::tests::hidden_seers_tests::a_listed_agent_started_again_gone_or_ended_otherwise_is_not_listed_after_a_restart
  GATE_SH: |
    set -uo pipefail
    name=$1
    log=$2
    n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
    echo "crate gate $name $n"
    [ "$n" -ge 1 ] || { echo "::error::$name did not build crazyagent"; exit 1; }
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -60 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red225)
        [ "$rc" != 0 ] && grep -q 'panicked at crates/crazyagent/src/team/runtime/hidden_seers_tests.rs:225:' "$log" || { echo "::error::$name is not red at hidden_seers_tests.rs:225"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: B23 SEERS reload rows on macos-15, red then tip
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='SEERS reload tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = b2a48c0a537cb3e7e139bdb38f24272d6e8f46a2 ] || { echo "::error::the parent is not the reload fix"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = 865e26a46362cff8a451d1ed2a10cf7fa49ce24f ] || { echo "::error::HEAD~2 is not the reload rows"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = d27c391370426491f05aa0fd111225fc48a6a74c ] || { echo "::error::HEAD~3 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~3 HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/team/runtime/hidden_seers_tests.rs crates/crazyagent/src/team/runtime/narrowing.rs " ] || { echo "::error::the range touches more than hidden_seers_tests.rs and narrowing.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the reload tip"; exit 1; }
      - name: Write the row runner and the crate gate
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          printf '%s\n' "$GATE_SH" > "$RUNNER_TEMP/gate.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/gate.sh"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, narrowing.rs at the base with the tip tests file
        timeout-minutes: 120
        run: |
          set -euo pipefail
          git checkout d27c391370426491f05aa0fd111225fc48a6a74c -- crates/crazyagent/src/team/runtime/narrowing.rs
          [ "$(git diff --name-only HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/team/runtime/narrowing.rs " ] || { echo "::error::the red tree differs from the tip in more than the fix"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build-red.log"
          bash "$RUNNER_TEMP/gate.sh" red-build "$RUNNER_TEMP/build-red.log"
          set +e
          bash "$RUNNER_TEMP/rows.sh" guard-at-red pass --exact "$GUARD"
          guard=$?
          bash "$RUNNER_TEMP/rows.sh" reload-at-red red225 --exact "$RELOAD"
          reload=$?
          git checkout HEAD^ -- crates/crazyagent/src/team/runtime/narrowing.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the reload tip"; exit 1; }
          echo "red step guard rc $guard reload rc $reload"
          [ "$guard" = 0 ] && [ "$reload" = 0 ]
      - name: Build the engine lib tests at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the reload tip"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build-tip.log"
          bash "$RUNNER_TEMP/gate.sh" tip-build "$RUNNER_TEMP/build-tip.log"
      - name: Tip, reload row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" reload-at-tip pass --exact "$RELOAD"
      - name: Tip, guard row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" guard-at-tip pass --exact "$GUARD"
      - name: Tip, hidden_seers_tests, six rows
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/rows.sh" hidden-seers pass team::runtime::tests::hidden_seers_tests:: | tee "$RUNNER_TEMP/hidden-seers.out"
          grep -q '^hidden-seers expect pass listed 6 ' "$RUNNER_TEMP/hidden-seers.out" || { echo "::error::hidden_seers_tests did not list 6 rows"; exit 1; }
      - name: Tip, clippy on the engine lib and its tests
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the reload tip"; exit 1; }
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          bash "$RUNNER_TEMP/gate.sh" clippy "$RUNNER_TEMP/clippy.log"
          echo "clippy errors $(grep -cE '^error(\[|:)' "$RUNNER_TEMP/clippy.log" || true) warnings $(grep -cE '^warning(\[|:)' "$RUNNER_TEMP/clippy.log" || true)"
