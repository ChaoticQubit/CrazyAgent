name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  CHORE: fc828c53f973919cbaa7ed4fadc3da20ac089016
  FILES: go-to pending-change project-publish sidebar-live settings-updates-layout chip-look native-auth

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: DESKTOP-ALLFILES-BASE-REDS each file alone on macos-15
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore chore's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$CHORE" ] || { echo "::error::the parent is not chore/v250 fc828c53f9"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not chore/v250 fc828c53f9"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
          echo "01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef  $work/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$work/chrome.zip" "$work"
          chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Print the macOS motion and display settings
        run: |
          set +e
          echo "reduceMotion $(defaults read com.apple.universalaccess reduceMotion 2>&1 | head -1)"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Resolution|UI Looks like' | head -3 || true
          exit 0
      - name: Each file alone (the result is the data; red only on a missing file or a step crash)
        run: |
          set +e
          set -u
          out="$RUNNER_TEMP/alone"; mkdir -p "$out"
          crash=0
          one() {
            file="apps/desktop/test/$1.test.mjs"
            [ -f "$file" ] || { echo "::error::missing $file"; crash=1; return; }
            node --test --test-timeout=60000 --test-reporter=spec "$file" > "$out/$1-$2.log" 2>&1
            rc=$?
            echo "== $1 try $2 rc $rc $(grep -E '^ℹ (tests|pass|fail) ' "$out/$1-$2.log" | tr '\n' ' ')"
            sed -n '/failing tests:/,$p' "$out/$1-$2.log" | grep -E '^✖ ' | grep -v 'failing tests:' | sort -u | sed 's/^/  not ok /'
            grep -qE '^ℹ tests ' "$out/$1-$2.log" || { echo "::error::$1 try $2 printed no test count"; tail -n 20 "$out/$1-$2.log"; crash=1; }
          }
          for name in $FILES; do one "$name" 1; done
          for try in 1 2 3; do one terminal-input "$try"; done
          for log in "$out"/*.log; do
            grep -q 'failing tests:' "$log" || continue
            echo "---- failures in $(basename "$log")"
            sed -n '/failing tests:/,$p' "$log" | grep -vE '^ℹ ' | head -n 80
          done
          exit "$crash"
