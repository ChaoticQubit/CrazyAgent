name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: c017e3d153016dd6bb03770840fe66eb04feba63
  BASE: ec22db84c2445d37322e1515f2ff372454ef1275
  FILES: "crates/crazyagent/src/ide/bridge/changes/tests.rs crates/crazyagent/src/ide/log/tests.rs crates/crazyagent/src/landing_turns/update_tests.rs crates/crazyagent/tests/landing_security.rs crates/crazyagent/tests/project_sandbox.rs crates/crazyagent/tests/project_sandbox/checked_clone.rs crates/crazyagent/tests/team_live_tools.rs scripts/quality/caps-allow.json "

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Fence commits 1+2 clippy -D on ubuntu-22.04, tip c017e3d153 only
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the line tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the line tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the line tip"; exit 1; }
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates at the tip and at the base
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          git diff --quiet "$BASE" HEAD^ -- Cargo.lock || { git show "$BASE:Cargo.lock" > "$RUNNER_TEMP/base.lock"; cp Cargo.lock "$RUNNER_TEMP/tip.lock"; cp "$RUNNER_TEMP/base.lock" Cargo.lock; cargo fetch --locked; cp "$RUNNER_TEMP/tip.lock" Cargo.lock; }
          git diff --quiet HEAD^ || { echo "::error::the tree is not the line tip"; exit 1; }
      - name: Write the rows script
        run: |
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS_EOF'
          set +e
          set -uo pipefail
          side=$1
          os=$2
          out="$RUNNER_TEMP/rows-$side"
          mkdir -p "$out"
          : > "$out/failed.txt"
          features="--features crazyagent/owner-trace"
          grep -Eq '^owner-trace[[:space:]]*=' crates/crazyagent/Cargo.toml || features=""
          echo "SIDE $side $(git rev-parse --short=10 HEAD) os $os features ${features:-none}"
          unset CRAZYAGENT_CONTEXT_MODE_INSTALL
          cargo clippy -p crazyagent $features --lib --tests --locked --offline -- -D warnings > "$out/clippy.log" 2>&1
          rc=$?
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$out/clippy.log" || true)
          echo "CLIPPY $side rc $rc errors $(grep -cE '^error' "$out/clippy.log" || true) warnings $(grep -cE '^warning' "$out/clippy.log" || true) checked crazyagent $checked"
          grep -A12 -E '^(error|warning)' "$out/clippy.log" | head -60 || true
          [ "$rc" = 0 ] && [ "$checked" -ge 1 ] || { echo "::error::clippy is not clean: rc $rc, crazyagent checked $checked"; exit 1; }
          echo "GATE 1"
          ROWS_EOF
      - name: Tip, crazyagent clippy -D warnings with the crate gate
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the line tip"; exit 1; }
          dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm bash "$RUNNER_TEMP/rows.sh" tip linux
