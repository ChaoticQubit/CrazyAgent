name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  busy-probe8-linux:
    name: probe 8, base 8a3fec973 and tip c1c6c59fd alternated, New Project row red at records_disk_work removed, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TIP: c1c6c59fd7e9e72e437a5a4db5d1502fc3aee3d9
      BASE: 8a3fec97383a266417279aa926d69f91d85dacf0
      NATIVE: engine::owner::transport::native_profile_tests::profile_preparation_changes_no_durable_engine_or_admission_state
      PLUGIN: engine::owner::transport::barrier_tests::a_revocation_waits_for_a_plugin_change_in_flight_and_refuses_the_next
      REVOKE: engine::owner::transport::barrier_tests::a_revocation_that_never_reaches_storage_still_refuses_the_client
      SETUP: project_setup::engine_tests::setup_job::a_setup_job_builds_the_project_and_ends_done_naming_it
      NEWREC: engine::owner::transport::barrier_tests::a_new_project_record_its_cut_drops_lands_once_storage_is_free
      FOLDER: engine::owner::transport::barrier_tests::a_folder_add_whose_plan_storage_cannot_take_is_refused_unsent_and_moves_nothing
      MODULES: "engine::owner::transport:: storage:: project_setup:: projects_home:: engine::tests::"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the tip, the tip without records_disk_work and the base, each copied aside
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          stash() {
            out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1) || { printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300; return 1; }
            lib=$(realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)")
            echo "  $1 lib build ok"
            printf '%s\n' "$out" | grep -m10 "^warning" | cut -c1-200 | sed 's/^/    /' || true
            mkdir -p "$RUNNER_TEMP/t/$1"
            cp "$lib" "$RUNNER_TEMP/t/$1/lib"
            for bin in crazyagent crazyagent-landlock; do
              cargo build -p crazyagent --bin "$bin" --locked > "$RUNNER_TEMP/bin.log" 2>&1 || { tail -20 "$RUNNER_TEMP/bin.log" | cut -c1-300; return 1; }
              cp "target/debug/$bin" "$RUNNER_TEMP/t/$1/$bin"
              echo "  $1 bin $bin ok"
            done
          }
          echo "== TIP $(git log --oneline -1 | cut -c1-100)"
          stash TIP
          sed -i 's/let kept = narrowing || job.records_disk_work();/let kept = narrowing;/' crates/crazyagent/src/storage.rs
          echo "== RED tip with kept = narrowing, records_disk_work uses: $(grep -c 'records_disk_work()' crates/crazyagent/src/storage.rs)"
          test "$(grep -c 'let kept = narrowing;' crates/crazyagent/src/storage.rs)" = 1
          stash RED
          git checkout -q -- crates/crazyagent/src/storage.rs
          git diff --quiet "$TIP"
          git checkout -q -f --detach "$BASE"
          echo "== BASE $(git log --oneline -1 | cut -c1-100)"
          stash BASE
          git checkout -q -f "$TIP"
          ls -l "$RUNNER_TEMP"/t/*
      - name: Rows alone, then modules x5 alternated base and tip, every failure's panic kept
        if: ${{ !cancelled() }}
        timeout-minutes: 140
        run: |
          set +e
          set -u
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          tree() {
            case "$1" in
              BASE) git checkout -q -f --detach "$BASE" ;;
              *) git checkout -q -f --detach "$TIP" ;;
            esac
            export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$RUNNER_TEMP/t/$1/crazyagent"
          }
          panics() {
            python3 -I - "$1" "$NATIVE" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          def entries(value):
              out, depth, quoted, escaped = {}, 0, False, False
              body = value.strip()
              if not (body.startswith("{") and body.endswith("}")):
                  return {"unparsed": body[:300]}
              parts, cur = [], []
              for ch in body[1:-1]:
                  if quoted:
                      cur.append(ch)
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          quoted = False
                      continue
                  if ch == '"':
                      quoted = True
                  elif ch in "[{":
                      depth += 1
                  elif ch in "]}":
                      depth -= 1
                  if ch == "," and depth == 0:
                      parts.append("".join(cur))
                      cur = []
                      continue
                  cur.append(ch)
              if cur:
                  parts.append("".join(cur))
              for part in parts:
                  key, _, rest = part.strip().partition(": ")
                  out[key] = rest
              return out
          for n, line in enumerate(text):
              m = re.match(r"^---- (\S+) stdout ----$", line)
              if not m:
                  continue
              name = m.group(1)
              print("      ---- " + name)
              block = []
              for follow in text[n + 1:n + 30]:
                  if follow.startswith("---- ") or follow.strip() == "failures:":
                      break
                  block.append(follow)
              sides = [l.split(":", 1)[1] for l in block if l.strip().startswith(("left:", "right:"))]
              for follow in block:
                  if name == sys.argv[2] and follow.strip().startswith(("left:", "right:")):
                      continue
                  print("        " + follow.rstrip()[:1500])
              if name == sys.argv[2] and len(sides) == 2:
                  before, after = entries(sides[0]), entries(sides[1])
                  for key in sorted(set(before) | set(after)):
                      if before.get(key) != after.get(key):
                          print("        table " + key)
                          print("          left:  " + str(before.get(key))[:900])
                          print("          right: " + str(after.get(key))[:900])
          PY
          }
          alone() {
            at=$1 row=$2 times=$3 want=$4 named=${5:-}
            tree "$at"
            fails=0 ran=0 matched=0
            for i in $(seq 1 "$times"); do
              log="$RUNNER_TEMP/alone-${row##*::}-$at-$i.log"
              keyring "$RUNNER_TEMP/t/$at/lib" --exact "$row" > "$log" 2>&1
              if grep -qx "test $row ... FAILED" "$log"; then
                fails=$((fails + 1)) ran=$((ran + 1))
                grep -m3 -A2 'panicked at' "$log" | cut -c1-600 | sed 's/^/      /'
                [ -n "$named" ] && grep -qF "$named" "$log" && matched=$((matched + 1))
              elif grep -qx "test $row ... ok" "$log"; then
                ran=$((ran + 1))
              else
                echo "    no result line in run $i"
                tail -5 "$log" | cut -c1-300
              fi
            done
            echo "    ${row##*::} at $at: $fails of $times failed, $ran ran, $matched failed at the named assert (want $want)"
          }
          declare -A failed
          modules() {
            at=$1 i=$2
            tree "$at"
            log="$RUNNER_TEMP/modules-$at-$i.log"
            keyring "$RUNNER_TEMP/t/$at/lib" "${filters[@]}" > "$log" 2>&1
            rc=$?
            echo "  $at modules $i rc=$rc $(grep -m1 '^test result' "$log" | cut -c1-120)"
            for name in $(grep '^test .* FAILED$' "$log" | sed 's/^test //; s/ \.\.\. FAILED$//'); do
              failed[$at:$name]=$(( ${failed[$at:$name]:-0} + 1 ))
              echo "    failed: $name"
            done
            for row in "$NATIVE" "$PLUGIN" "$REVOKE" "$SETUP" "$NEWREC" "$FOLDER"; do
              grep -q "^test $row \.\.\. \(ok\|FAILED\)$" "$log" || echo "    ${row##*::} has no result line"
            done
            panics "$log"
          }
          read -r -a filters <<< "$MODULES"
          echo "== rows alone"
          alone TIP "$NEWREC" 5 green
          alone RED "$NEWREC" 3 "red at the landing assert" "the record landed once storage was free"
          alone TIP "$SETUP" 5 green
          alone BASE "$SETUP" 5 green
          echo "== modules alternated"
          for i in 1 2 3 4 5; do
            modules BASE "$i"
            modules TIP "$i"
          done
          echo "== counts of 5 modules runs per tree"
          for key in "${!failed[@]}"; do
            echo "  ${key%%:*} ${key#*:} ${failed[$key]}"
          done | sort
          for row in "$NATIVE" "$PLUGIN" "$REVOKE" "$SETUP" "$NEWREC" "$FOLDER"; do
            echo "  ${row##*::}: BASE ${failed[BASE:$row]:-0}, TIP ${failed[TIP:$row]:-0}"
          done
          git checkout -q -f "$TIP"
