name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: V244 macOS checks moved off the local queue, H5 host a54cd7ffb first, then device-lost 4d30f24ee, seam a51e0fa51 and its red 6cfa8c202, librs 99feff82c and mouse 0ff0fd91b, clippy with and without native-webdriver and rows, with the pinned tmux
    runs-on: macos-15
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux 3.8"
      - name: Each tip in turn, clippy with and without native-webdriver, rows and lock checks
        run: |
          set -euo pipefail
          cp .github/farm/v244-mac-checks.sh "$RUNNER_TEMP/mac-checks.sh"
          bash "$RUNNER_TEMP/mac-checks.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-mac-checks-macos
          path: |
            ${{ runner.temp }}/v244-mac-checks-macos.txt
            ${{ runner.temp }}/red-import.txt
          if-no-files-found: warn
          retention-days: 14
