name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  rig-macos:
    name: V243 native end focus back, real-app native terminal rows red at d8230cf62 and green at aca7bde1e, macos-15
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TIP: aca7bde1ef15946acd474decc8a88c81fc4b392c
      RED: d8230cf626668dca45deb44ae0814209dc976595
      FIX_FILE: apps/desktop/src-tauri/src/native_term/host.rs
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Refuse a runner with no 1x display of at least 1340x960, which the test window needs
        run: |
          set -euo pipefail
          sw_vers
          listed=$(/usr/bin/osascript -l JavaScript -e 'ObjC.import("AppKit"); JSON.stringify(ObjC.unwrap($.NSScreen.screens).map((s) => ({ x: s.frame.origin.x, y: s.frame.origin.y, width: s.frame.size.width, height: s.frame.size.height, scale: s.backingScaleFactor })))')
          echo "displays $listed"
          fits=$(/usr/bin/osascript -l JavaScript -e 'ObjC.import("AppKit"); ObjC.unwrap($.NSScreen.screens).filter((s) => s.backingScaleFactor === 1 && s.frame.size.width >= 1340 && s.frame.size.height >= 960).length')
          echo "DISPLAY 1x displays of at least 1340x960: $fits"
          [ "$fits" -ge 1 ] || { echo "::error::no 1x display of at least 1340x960, so the rig window cannot open"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
          test "$(git diff --name-only "$RED" "$TIP")" = "$FIX_FILE"
          echo "tree is the tip ${TIP:0:9}; the red commit ${RED:0:9} differs by $FIX_FILE only"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies at the tip
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the desktop page at the tip
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Write the rig runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rig.sh" <<'RIG'
          #!/bin/bash
          set -u
          label=$1
          bin=$2
          root="$RUNNER_TEMP/ka-$label"
          ev="$RUNNER_TEMP/ev-$label"
          log="$RUNNER_TEMP/wdio-$label.log"
          port=$(python3 -I -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          cd "$GITHUB_WORKSPACE/apps/desktop" || exit 2
          started=$(date +%s)
          env -u CRAZYAGENT_E2E_HOME MS_ROOT="$root" MS_EVIDENCE="$ev" WD_APP="$bin/crazyagent-desktop" \
            MS_ENGINE="$bin/crazyagent" WD_PORT="$port" \
            node node_modules/@wdio/cli/bin/wdio.js run test/native/native-terminal.wdio.conf.mjs > "$log" 2>&1
          rc=$?
          sock="$root/engine/terminal/tmux.sock"
          [ -S "$sock" ] && tmux -S "$sock" kill-server 2>/dev/null
          echo "RIG $label rc=$rc elapsed $(( $(date +%s) - started ))s"
          grep -aE '✓|✖|passing|failing|AssertionError|END-FOCUS|N2 before|placement' "$log" | cut -c1-300 | head -60
          for row in "a focused view the engine ends gives the keyboard back to the page" \
            "a focused view the page closes gives the keyboard back to the page"; do
            echo "ROW $label passed=$(grep -acF "✓ $row" "$log") failed=$(grep -acF "✖ $row" "$log") $row"
          done
          echo "RIG $label $(grep -aoE '[0-9]+ passing' "$log" | head -1), $(grep -aoE '[0-9]+ failing' "$log" | head -1)"
          exit "$rc"
          RIG
          chmod 0700 "$RUNNER_TEMP/rig.sh"
          bash -n "$RUNNER_TEMP/rig.sh"
      - name: Build the app and the engine at the red commit
        timeout-minutes: 75
        run: |
          set -euo pipefail
          git checkout "$RED" -- "$FIX_FILE"
          git diff --quiet "$RED"
          started=$(date +%s)
          cargo build --release --locked -p crazyagent --bin crazyagent \
            -p crazyagent-desktop --features crazyagent-desktop/native-webdriver,crazyagent-desktop/e2e-bridge \
            --bin crazyagent-desktop
          echo "BUILD red ${RED:0:9} $(( $(date +%s) - started ))s"
          mkdir -p "$RUNNER_TEMP/bin-red"
          for b in crazyagent crazyagent-desktop; do cp -p "target/release/$b" "$RUNNER_TEMP/bin-red/$b"; done
          git checkout "$TIP" -- "$FIX_FILE"
          git diff --quiet "$TIP"
      - name: Build the app and the engine at the tip
        timeout-minutes: 45
        run: |
          set -euo pipefail
          git diff --quiet "$TIP"
          started=$(date +%s)
          cargo build --release --locked -p crazyagent --bin crazyagent \
            -p crazyagent-desktop --features crazyagent-desktop/native-webdriver,crazyagent-desktop/e2e-bridge \
            --bin crazyagent-desktop
          echo "BUILD tip ${TIP:0:9} $(( $(date +%s) - started ))s"
          mkdir -p "$RUNNER_TEMP/bin-tip"
          for b in crazyagent crazyagent-desktop; do cp -p "target/release/$b" "$RUNNER_TEMP/bin-tip/$b"; done
          cmp -s "$RUNNER_TEMP/bin-red/crazyagent-desktop" "$RUNNER_TEMP/bin-tip/crazyagent-desktop" && { echo "the tip app equals the red app"; exit 4; }
          echo "the tip app differs from the red app"
      - name: Native terminal rows at the red commit, wanted red on the two end-focus rows
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          set -u
          out="$RUNNER_TEMP/rig-red.txt"
          bash "$RUNNER_TEMP/rig.sh" red "$RUNNER_TEMP/bin-red" > "$out" 2>&1
          rc=$?
          cat "$out"
          log="$RUNNER_TEMP/wdio-red.log"
          ended=$(grep -cE '^ROW red passed=0 failed=[1-9][0-9]* a focused view the engine ends' "$out")
          closed=$(grep -cE '^ROW red passed=0 failed=[1-9][0-9]* a focused view the page closes' "$out")
          ended_cause=$(grep -acF 'a focused view that ended gave the keyboard back to the page' "$log")
          closed_cause=$(grep -acF 'a focused view that closed gave the keyboard back to the page' "$log")
          echo "STEP red rc=$rc ended-row-red=$ended closed-row-red=$closed ended-cause-lines=$ended_cause closed-cause-lines=$closed_cause (want rc non-zero, both rows 1, both causes at least 1)"
          [ "$rc" -ne 0 ] && [ "$ended" = 1 ] && [ "$closed" = 1 ] && [ "$ended_cause" -ge 1 ] && [ "$closed_cause" -ge 1 ]
      - name: Native terminal rows at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          set -u
          git diff --quiet "$TIP" || { echo "STEP tree is not the tip"; exit 15; }
          out="$RUNNER_TEMP/rig-tip.txt"
          bash "$RUNNER_TEMP/rig.sh" tip "$RUNNER_TEMP/bin-tip" > "$out" 2>&1
          rc=$?
          cat "$out"
          echo "STEP tip rc=$rc (want 0)"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-rig-macos-end-focus
          path: |
            ${{ runner.temp }}/rig-*.txt
            ${{ runner.temp }}/wdio-*.log
            ${{ runner.temp }}/ev-*/engine.err
            ${{ runner.temp }}/ev-*/*.png
          if-no-files-found: warn
          retention-days: 14
