name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: 1df6ba98010ea7d41651adad45385be2c2b7acdc
  ROW: engine::owner::transport::changes::tests::refusals_read_a_longer_code_whole_and_a_log_line_as_its_code
  COVERAGE: engine::owner::transport::changes::tests::changes_codes_cover_every_refusal_of_the_landing_engine_and_protocol

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux changes coverage rows, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Red checks out the red commit
        if: matrix.side == 'red'
        run: |
          set -euo pipefail
          git checkout --detach "$RED_SHA"
          git log --oneline -1
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows and their expected results
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          out="$RUNNER_TEMP/changes-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib --no-run 2>&1 | tail -3
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib -- engine::owner::transport::changes::tests:: 2>&1 | tee -a "$out"
          row=$(grep -E "^test $ROW \.\.\. " "$out" | sed -E 's/.* \.\.\. //')
          coverage=$(grep -E "^test $COVERAGE \.\.\. " "$out" | sed -E 's/.* \.\.\. //')
          verdict=pass
          [ "$coverage" = ok ] || verdict=fail
          if [ "$SIDE" = red ]; then
            [ "$row" = FAILED ] || verdict=fail
          else
            [ "$row" = ok ] || verdict=fail
            grep -qE "^test result: ok\." "$out" || verdict=fail
          fi
          { echo "| side | row | coverage | verdict |"; echo "| --- | --- | --- | --- |"; echo "| $SIDE | ${row:-none} | ${coverage:-none} | $verdict |"; } >> "$GITHUB_STEP_SUMMARY"
          echo "VERDICT $SIDE row=${row:-none} coverage=${coverage:-none} verdict=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-changes-${{ matrix.side }}
          path: ${{ runner.temp }}/changes-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
