name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: bd79c519431a890ea7aceb7709930870e3020544
  BASE_FULL: c58ccb8929bed5ad0b69df96ce75afec078a7b92
  HELD: "engine::bootstrap::held::tests::"
  LAUNCH: "launch_context::windows_tests::"
  NEW_WINDOWS: "a_windows_tools_off_claude_install_writes_its_two_files_and_holds_the_home a_windows_install_removes_a_planted_junction_as_itself a_windows_install_drop_never_follows_a_junction_planted_after_it a_windows_install_refuses_a_home_its_held_judge_refuses_before_a_lock the_held_home_judge_refuses_a_low_or_open_inherited_label a_windows_install_it_cannot_write_yet_is_refused_before_it_changes_the_home"

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: S9B-1 tools-off tip 1 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~8)" = "$BASE_FULL" ] || { echo "::error::HEAD~8 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: crazyagent clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylibtests.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib --tests windows-2022 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: launch_context Windows rows and held rows, then the 6 new ones 5 rounds (expect failed 0, 6 new ok each round, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          read -r -a new <<< "$NEW_WINDOWS"
          [ "${#new[@]}" = 6 ] || { echo "::error::want 6 new rows, have ${#new[@]}"; exit 1; }
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- "$LAUNCH" "$HELD" > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          launch="$(grep -cE "^test ${LAUNCH}[a-z_]+ \.\.\. ok$" "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          ok=0
          for row in "${new[@]}"; do
            n="$(grep -cE "^test $LAUNCH$row \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          echo "rows rc $code passed $passed failed $failed launch ok $launch new ok $ok of 6 gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$launch" -ge 14 ] && [ "$ok" = 6 ] && [ "$gate" -ge 1 ] || exit 1
          for round in 1 2 3 4 5; do
            rlog="$RUNNER_TEMP/round-$round.log"
            cargo test -p crazyagent --lib --locked -- "$LAUNCH" > "$rlog" 2>&1
            rcode=$?
            rok=0
            for row in "${new[@]}"; do
              rok=$((rok + $(grep -cE "^test $LAUNCH$row \.\.\. ok$" "$rlog" || true)))
            done
            rfailed="$(grep -E '^test result:' "$rlog" | awk '{f+=$6} END {print f+0}')"
            echo "round $round rc $rcode failed $rfailed new ok $rok of 6"
            grep -E '^test .* FAILED$|panicked at' "$rlog" | head -n 10 || true
            [ "$rcode" = 0 ] && [ "$rfailed" = 0 ] && [ "$rok" = 6 ] || exit 1
          done

  linux:
    name: S9B-1 tools-off tip 1 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~8)" = "$BASE_FULL" ] || { echo "::error::HEAD~8 is not the ticket base"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: crazyagent clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippylibtests.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy --lib --tests ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: held rows on Linux (expect failed 0, passed >= 1, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/held.log"
          cargo test -p crazyagent --lib --locked -- "$HELD" > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "held rc $code passed $passed failed $failed gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] && [ "$gate" -ge 1 ] || exit 1
