name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: B23 CR10 and CR9 sandbox rows on ${{ matrix.os }} at ${{ matrix.side }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            side: tip
          - os: ubuntu-22.04
            side: base
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='CR9 pick %H %s' HEAD^
          git log -1 --format='CR10 fix %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = ba209aa1366ed4902e233bedb6028ffa515e7e69 ] || { echo "::error::the grandparent is not the CR10 fix"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = 1fdea8a10a1eb3e4a707afb751ad7facb70db82a ] || { echo "::error::HEAD~3 is not the CR10 red rows"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = f0a086aaedf8fb960af9ad174abf7381706b2077 ] || { echo "::error::HEAD~4 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD^^ HEAD^)" = crates/kernel/sandbox/src/grants/tests.rs ] || { echo "::error::the CR9 pick touches more than grants/tests.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the CR9 pick on the CR10 fix"; exit 1; }
          if [ "${{ matrix.side }}" = base ]; then
            git checkout HEAD~3 -- crates/kernel/sandbox/src/paths.rs crates/kernel/sandbox/src/paths/tests.rs
            git checkout HEAD~4 -- crates/kernel/sandbox/src/grants/tests.rs
            git diff --quiet HEAD~3 -- crates/kernel/sandbox/src/paths.rs crates/kernel/sandbox/src/paths || { echo "::error::the paths files are not the red rows commit"; exit 1; }
            git diff --quiet HEAD~4 -- crates/kernel/sandbox/src/paths.rs crates/kernel/sandbox/src/grants || { echo "::error::paths.rs or grants is not the base"; exit 1; }
            git diff --stat HEAD^ -- crates/kernel/sandbox
            echo "side base: paths.rs and grants/tests.rs at the base, the CR10 rows from the red commit"
          fi
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: CR10 the 3 dangling-link rows at tip (expect listed 3, passed 3)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/cr10-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::a_root_holding_where_a_dangling_secret_link_leads_is_refused paths::tests::a_dangling_secret_link_refuses_only_the_folders_above_where_it_leads paths::tests::dangling_secret_links_in_a_cycle_or_a_long_chain_are_refused --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::a_root_holding_where_a_dangling_secret_link_leads_is_refused paths::tests::a_dangling_secret_link_refuses_only_the_folders_above_where_it_leads paths::tests::dangling_secret_links_in_a_cycle_or_a_long_chain_are_refused > "$log" 2>&1
          code=$?
          grep -E '^test |FAILED|test result:|panicked|left:|right:|grant_socket' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "cr10-rows side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" = 3 ] && [ "$passed" = 3 ] && [ "$failed" = 0 ] || exit 1
      - name: CR10 every paths row at tip (expect listed > 0, passed = listed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/cr10-paths.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- paths::tests:: --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- paths::tests:: > "$log" 2>&1
          code=$?
          grep -E '^test |FAILED|test result:|panicked|left:|right:|grant_socket' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "cr10-paths side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1
      - name: CR10 the 3 dangling-link rows at base (expect listed 3, failed 3)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'base' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/cr10-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::a_root_holding_where_a_dangling_secret_link_leads_is_refused paths::tests::a_dangling_secret_link_refuses_only_the_folders_above_where_it_leads paths::tests::dangling_secret_links_in_a_cycle_or_a_long_chain_are_refused --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact paths::tests::a_root_holding_where_a_dangling_secret_link_leads_is_refused paths::tests::a_dangling_secret_link_refuses_only_the_folders_above_where_it_leads paths::tests::dangling_secret_links_in_a_cycle_or_a_long_chain_are_refused > "$log" 2>&1
          code=$?
          grep -E '^test |FAILED|test result:|panicked|left:|right:|grant_socket' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "cr10-rows side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$listed" = 3 ] && [ "$failed" = 3 ] || exit 1
      - name: CR9 the 2 socket rows at base (expect listed 2, failed 2 on grant_socket_needs_macos)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'base' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/cr9-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact grants::tests::a_socket_below_a_folder_others_can_write_is_refused grants::tests::a_socket_in_a_closed_or_sticky_folder_of_the_user_is_held --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact grants::tests::a_socket_below_a_folder_others_can_write_is_refused grants::tests::a_socket_in_a_closed_or_sticky_folder_of_the_user_is_held > "$log" 2>&1
          code=$?
          grep -E '^test |FAILED|test result:|panicked|left:|right:|grant_socket' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "cr9-rows side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$listed" = 2 ] && [ "$failed" = 2 ] && [ "$(grep -c grant_socket_needs_macos "$log" || true)" -ge 2 ] || exit 1
      - name: CR9 the 2 socket rows at tip (expect listed 0, gated to macOS)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/cr9-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact grants::tests::a_socket_below_a_folder_others_can_write_is_refused grants::tests::a_socket_in_a_closed_or_sticky_folder_of_the_user_is_held --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact grants::tests::a_socket_below_a_folder_others_can_write_is_refused grants::tests::a_socket_in_a_closed_or_sticky_folder_of_the_user_is_held > "$log" 2>&1
          code=$?
          grep -E '^test |FAILED|test result:|panicked|left:|right:|grant_socket' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "cr9-rows side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$listed" = 0 ] && grep -qE "^0 tests, 0 benchmarks$" "$log.list" || exit 1
      - name: CR9 the unix ownership row at tip (expect listed 1, passed 1)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/cr9-owner.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact grants::tests::another_user_s_socket_in_root_s_sticky_folder_is_refused --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          grep -E ': test$' "$log.list" || true
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact grants::tests::another_user_s_socket_in_root_s_sticky_folder_is_refused > "$log" 2>&1
          code=$?
          grep -E '^test |FAILED|test result:|panicked|left:|right:|grant_socket' "$log" | head -n 80 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "cr9-owner side ${{ matrix.side }} rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" = 1 ] && [ "$passed" = 1 ] && [ "$failed" = 0 ] || exit 1
