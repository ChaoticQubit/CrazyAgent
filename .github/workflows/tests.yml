name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 61774cb67bec1641c786e2f7f8c5230f6d5f8525
  MERGE: 2fb31a3e2a32abe1a6f153c589381ae78e42f6b4

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: V243-NARROWING-DURABLE-REST r1f the r1d row set with and without the REST rows 5x each at the merge 2fb31a3e2 plus diag prints on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 25
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The diag commit only adds prints on the merge
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$TIP"
          test "$(git rev-parse "$TIP^")" = "$MERGE"
          test "$(git diff --name-only "$MERGE" "$TIP" | tr '\n' ' ')" = "crates/crazyagent/src/engine/owner/transport.rs crates/crazyagent/src/engine/owner/transport/barrier_tests.rs crates/crazyagent/src/engine/owner/transport/narrowing_rest_tests.rs "
          git diff "$MERGE" "$TIP"
      - name: Build the engine binaries the rows run, in cargo's deps layout
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent --bin crazyagent-landlock --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          echo "CRAZYAGENT_TEST_NATIVE_AUTH_HOST=$GITHUB_WORKSPACE/target/debug/crazyagent" >> "$GITHUB_ENV"
      - name: The r1d row set with the REST rows (A) and without them (B), 5x each, interleaved
        timeout-minutes: 200
        run: |
          set +e
          printf '| set | run | rc | result | red rows |\n| --- | --- | --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for run in 1 2 3 4 5; do
            for set in A B; do
              if [ "$set" = A ]; then filters="engine::owner::transport::narrowing_rest_tests engine::owner::transport::native_auth_restart_tests engine::owner::transport::barrier_tests engine::owner::transport::secret_storage_wait_tests storage::trash storage::plugins storage::narrowing storage::migrations storage::owner_actor_tests"; else filters="engine::owner::transport::native_auth_restart_tests engine::owner::transport::barrier_tests engine::owner::transport::secret_storage_wait_tests storage::trash storage::plugins storage::narrowing storage::migrations storage::owner_actor_tests"; fi
              log="$RUNNER_TEMP/rows-$set-$run.log"
              FILTERS="$filters" dbus-run-session -- bash -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec cargo test -p crazyagent --lib --locked --no-fail-fast -- $FILTERS --test-threads=4' > "$log" 2>&1
              rc=$?
              result=$(grep -E '^test result:' "$log" | tail -n 1)
              echo "set $set run $run rc=$rc $result"
              grep -E '^error(\[E[0-9]+\])?:' -A6 "$log" | head -n 30 || true
              reds=""
              for row in $(grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/'); do
                panic=$(awk -v h="---- $row stdout ----" '$0==h{p=1;next} p&&(/^---- /||/^failures:$/){p=0} p' "$log" | grep -m1 -A1 'panicked at' | sed -E 's/^thread .* panicked at //' | tr '\n' ' ' | cut -c1-400)
                echo "red set $set run $run $row first_panic=${panic:-none}"
                reds="$reds ${row##*::}"
                case "$row" in *changes_git_unsupported*|*a_change_set_discard_runs_without_the_owner_barrier*) ;; *)
                  echo "::group::captured output, set $set run $run, $row"
                  awk -v h="---- $row stdout ----" '$0==h{p=1} p&&(/^---- /&&$0!=h||/^failures:$/){p=0} p' "$log" | head -n 300
                  echo "::endgroup::" ;;
                esac
              done
              printf '| %s | %s | %s | %s | %s |\n' "$set" "$run" "$rc" "$result" "${reds:- none}" >> "$GITHUB_STEP_SUMMARY"
            done
          done
