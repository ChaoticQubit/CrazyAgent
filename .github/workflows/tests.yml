name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  modules-69-linux:
    name: modules once at chore/v243 2a48cf656 lib-only, native auth host, helper built, helper in deps, ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TIP: 2a48cf6566f5ccb112e3f265d7ec9df0dc7fb3a3
      MODULES: "engine::owner::transport:: storage:: project_setup:: projects_home::"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Modules once under four setups
        timeout-minutes: 200
        run: |
          set -u +e +o pipefail
          out=$(cargo test -p crazyagent --lib --locked --no-run 2>&1)
          rc=$?
          echo "lib build rc=$rc"
          printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300
          lib=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p' | tail -1)
          [ "$rc" -eq 0 ] && [ -n "$lib" ] || exit 1
          lib=$(realpath "$lib")
          echo "lib binary $lib"
          ls -la target/debug/crazyagent target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock 2>&1 | sed 's/^/  before: /'
          rm -f target/debug/crazyagent target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          setup() {
            label=$1
            out=$("$lib" $MODULES 2>&1)
            rc=$?
            printf '%s\n' "$out" | grep '^test .* FAILED$' | sed 's/^test //; s/ \.\.\. FAILED$//' | sort > "$RUNNER_TEMP/$label.txt"
            echo "== $label rc=$rc $(printf '%s\n' "$out" | grep -m1 'test result' | cut -c1-110)"
            echo "  failed by module:"
            awk -F'::' '{NF--; print}' OFS='::' "$RUNNER_TEMP/$label.txt" | sort | uniq -c | sort -rn | sed 's/^/    /'
            echo "  messages (count, module, place, first message line):"
            printf '%s\n' "$out" | awk '
              /^---- .* stdout ----$/ { name=$2; n=split(name, part, "::"); mod=part[n-1]; want=0; next }
              /panicked at/ && name != "" { sub(/.*panicked at /, ""); place=$0; want=1; next }
              want == 1 { print mod " | " place " | " substr($0, 1, 170); want=0; name="" }
            ' | sed -E 's/[0-9a-f]{12,}/H/g; s#/tmp/[^ "]*#/tmp/X#g; s#/home/runner/[^ "]*#/home/X#g' | sort | uniq -c | sort -rn | head -40 | sed 's/^/    /'
            echo "  first full failure block per module:"
            printf '%s\n' "$out" | awk '
              /^---- .* stdout ----$/ { name=$2; n=split(name, part, "::"); mod=part[n-1]; take=(seen[mod]++ == 0) ? 14 : 0; if (take) print "    " $0; next }
              take > 0 { print "      " substr($0, 1, 220); take--; if ($0 ~ /^note: run with/) take=0 }
            '
          }
          setup a-lib-only
          cargo build -p crazyagent --bin crazyagent --locked 2>&1 | tail -2
          export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent"
          setup b-native-auth-host
          cargo build -p crazyagent --bin crazyagent-landlock --locked 2>&1 | tail -2
          setup c-helper-built
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          setup d-helper-in-deps
          for pair in "a-lib-only b-native-auth-host" "b-native-auth-host c-helper-built" "c-helper-built d-helper-in-deps"; do
            set -- $pair
            echo "== fixed from $1 to $2: $(comm -23 "$RUNNER_TEMP/$1.txt" "$RUNNER_TEMP/$2.txt" | wc -l), new: $(comm -13 "$RUNNER_TEMP/$1.txt" "$RUNNER_TEMP/$2.txt" | wc -l)"
            comm -23 "$RUNNER_TEMP/$1.txt" "$RUNNER_TEMP/$2.txt" | awk -F'::' '{NF--; print}' OFS='::' | sort | uniq -c | sed 's/^/    fixed /'
            comm -13 "$RUNNER_TEMP/$1.txt" "$RUNNER_TEMP/$2.txt" | sed 's/^/    new /'
          done
          echo "== still failing with everything:"
          sed 's/^/    /' "$RUNNER_TEMP/d-helper-in-deps.txt"
      - name: Kernel log and memory after the run
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE "oom|killed process|out of memory|landlock|apparmor=\"DENIED\"" | tail -30 || true
