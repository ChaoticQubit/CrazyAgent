name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: f99948f04baf4c1d8a4da28e7ca8ff42de0a7bb3
  RED_FULL: 0d25942fca522cdca992e674e7dbc32130899548
  BASE_FULL: ec22db84c2445d37322e1515f2ff372454ef1275

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: PUTBACK registry fmt and clippy of both crates, the busy put-back red at red and at fix, and the restore and held_files rows, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 11
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -12 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$RED_FULL" ] || { echo "::error::HEAD~4 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~9)" = "$BASE_FULL" ] || { echo "::error::HEAD~9 is not chore ec22db84c2"; exit 1; }
          [ "$(git diff --name-only "$RED_FULL" HEAD^ | tr '\n' ' ')" = "crates/kernel/storage/src/held_files.rs crates/kernel/storage/src/lib.rs crates/kernel/storage/src/restore/recovery.rs " ] || { echo "::error::red and tip differ beyond held_files.rs, lib.rs and recovery.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the two crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-storage -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel-storage and crazyagent --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage -p crazyagent --tests --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gates crazyagent-kernel-storage $g0 crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: The busy put-back red at the red commit's recovery.rs with the tip's rows (expect 1 FAILED by name, the message once, left 5) and at the fix (expect 1 passed), then every restore and held_files row at the fix (expect 0 failed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          row=restore::recovery::tests::a_busy_put_back_leaves_an_idle_wal_engine_db_held
          file=crates/kernel/storage/src/restore/recovery.rs
          run() {
            local log="$RUNNER_TEMP/row-$1.log"
            cargo test --locked -p crazyagent-kernel-storage --lib "$row" -- --exact > "$log" 2>&1
            local code=$?
            grep -E '^test restore::|^test result|panicked at|^  left|^ right|another process took|storage_putback' "$log" | head -n 20 || true
            local failed passed gate message left5
            failed="$(grep -cE "^test $row \.\.\. FAILED" "$log" || true)"
            passed="$(grep -cE "^test $row \.\.\. ok" "$log" || true)"
            message="$(grep -c "another process took engine.db after a busy put-back" "$log" || true)"
            left5="$(grep -cE '^  left: 5$' "$log" || true)"
            gate="$(grep -cE '^ +Compiling crazyagent-kernel-storage v' "$log" || true)"
            echo "row at $1 rc $code failed $failed passed $passed message $message left_5 $left5 gate crazyagent-kernel-storage $gate"
            eval "$1_failed=$failed $1_passed=$passed $1_gate=$gate $1_message=$message $1_left5=$left5"
          }
          git checkout "$RED_FULL" -- "$file"
          git diff --quiet "$RED_FULL" -- "$file" || { echo "::error::recovery.rs is not the red one"; exit 1; }
          run red
          git checkout HEAD^ -- "$file"
          git diff --quiet HEAD^ || { echo "::error::the tree is not the tip again"; exit 1; }
          run fix
          ok=1
          for set in restore:: held_files::; do
            log="$RUNNER_TEMP/set.log"
            cargo test --locked -p crazyagent-kernel-storage --lib "$set" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|^test result' "$log" | head -n 20 || true
            failed="$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)"
            passed="$(grep -cE '^test .* \.\.\. ok$' "$log" || true)"
            echo "set $set at fix rc $code failed $failed passed $passed"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$passed" -ge 1 ] || ok=0
          done
          [ "$red_failed" = 1 ] && [ "$red_passed" = 0 ] && [ "$red_message" = 1 ] && [ "$red_left5" = 1 ] && [ "$red_gate" -ge 1 ] && [ "$fix_passed" = 1 ] && [ "$fix_failed" = 0 ] && [ "$fix_gate" -ge 1 ] && [ "$ok" = 1 ] || exit 1
