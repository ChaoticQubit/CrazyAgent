name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NEXTEST_VERSION: "0.9.152"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: V244-WIN-LINK-CLI-NEXTEST on ${{ matrix.image }}, real PATH watched, base 5e25980d6 once, tip e54f2788a x5 under nextest
    runs-on: ${{ matrix.image }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on a self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Base writes the real PATH, tip never does, clippy at tip
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          cp .github/farm/v244-link-cli.sh "$RUNNER_TEMP/v244-link-cli.sh"
          bash "$RUNNER_TEMP/v244-link-cli.sh" "$IMAGE"

  linux:
    name: V244-WIN-LINK-CLI-NEXTEST on ubuntu-22.04, pinned script row red at 92d07e0b2, green at e54f2788a
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on a self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Drop the Microsoft apt source the farm does not use
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Red then green, clippy at tip
        run: |
          cp .github/farm/v244-link-cli.sh "$RUNNER_TEMP/v244-link-cli.sh"
          bash "$RUNNER_TEMP/v244-link-cli.sh" ubuntu-22.04
