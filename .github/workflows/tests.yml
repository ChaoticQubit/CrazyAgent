name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 1e2b7401b179829c8c3d9ce7002501dae9ac7739
  RED_FULL: ceb6cc1f6b83c4bd95c302a4cedb93ba5bdee499
  BASE_FULL: ec22db84c2445d37322e1515f2ff372454ef1275

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: PUTBACK fmt, clippy, the put-back lock red at red and at fix, and the kept row, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -12 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$RED_FULL" ] || { echo "::error::HEAD~4 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$BASE_FULL" ] || { echo "::error::HEAD~5 is not chore ec22db84c2"; exit 1; }
          [ "$(git diff --name-only "$RED_FULL" HEAD^ | tr '\n' ' ')" = "crates/kernel/storage/src/restore/recovery.rs crates/kernel/storage/src/restore/recovery/tests.rs " ] || { echo "::error::red and fix differ beyond recovery.rs and its tests"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of kernel storage (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-storage
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel-storage --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage --tests --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent-kernel-storage $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: The put-back lock red at the red commit's recovery.rs (expect 1 FAILED by name, the assert message, left 5) and at the fix (expect 1 passed), then the kept row at the fix (expect 1 passed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          row=restore::recovery::tests::a_put_back_holds_engine_db_alone_from_its_copy_to_its_end
          run() {
            local log="$RUNNER_TEMP/row-$1.log"
            cargo test --locked -p crazyagent-kernel-storage --lib "$row" -- --exact > "$log" 2>&1
            local code=$?
            grep -E '^test restore::|^test result|panicked at|^  left|^ right|another process took' "$log" | head -n 20 || true
            local failed passed gate message left5
            failed="$(grep -cE "^test $row \.\.\. FAILED" "$log" || true)"
            message="$(grep -c "another process took engine.db's write lock while the put-back held it" "$log" || true)"
            left5="$(grep -cE '^  left: 5$' "$log" || true)"
            passed="$(grep -cE "^test $row \.\.\. ok" "$log" || true)"
            gate="$(grep -cE '^ +Compiling crazyagent-kernel-storage v' "$log" || true)"
            echo "row at $1 rc $code failed $failed passed $passed message $message left_5 $left5 gate crazyagent-kernel-storage $gate"
            eval "$1_failed=$failed $1_passed=$passed $1_gate=$gate $1_message=$message $1_left5=$left5"
          }
          git checkout "$RED_FULL" -- crates/kernel/storage/src/restore/recovery.rs
          git diff --quiet "$RED_FULL" -- crates/kernel/storage/src/restore/recovery.rs || { echo "::error::recovery.rs is not the red one"; exit 1; }
          run red
          git checkout HEAD^ -- crates/kernel/storage/src/restore/recovery.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix again"; exit 1; }
          run fix
          kept=restore::recovery::tests::a_put_back_keeps_damaged_live_data_byte_for_byte
          klog="$RUNNER_TEMP/row-kept.log"
          cargo test --locked -p crazyagent-kernel-storage --lib "$kept" -- --exact > "$klog" 2>&1
          kcode=$?
          grep -E '^test restore::|^test result|panicked at' "$klog" | head -n 10 || true
          kpassed="$(grep -cE "^test $kept \.\.\. ok" "$klog" || true)"
          echo "kept row at fix rc $kcode passed $kpassed"
          [ "$red_failed" = 1 ] && [ "$red_passed" = 0 ] && [ "$red_message" = 1 ] && [ "$red_left5" = 1 ] && [ "$red_gate" -ge 1 ] && [ "$fix_passed" = 1 ] && [ "$fix_failed" = 0 ] && [ "$fix_gate" -ge 1 ] && [ "$kcode" = 0 ] && [ "$kpassed" = 1 ] || exit 1
