name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  BUN_DARWIN_ARM64_SHA256: 80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403
  NODE_DARWIN_ARM64_SHA256: 1901d539912c02afa10d1cc126943a8855a7eedebe830119463470db5e6c59e8
  RUSTC_DARWIN_ARM64_SHA256: 738e3f60114b20550fcf4f8a57c9cea0544239f214709f45594ff3fde327f577
  CARGO_DARWIN_ARM64_SHA256: de51d4fade4f31ad8ec405261cc96bedc000d905f98980027610d6e288dbe21b
  RUST_STD_DARWIN_ARM64_SHA256: 2de831ef563ce772519a4d18ba2659f0f7428d497ef66dad24b5a35e8f8cd177
  CLIPPY_DARWIN_ARM64_SHA256: 1ad080040ff0f4f8af0751bd7fa1fb1901212f8d164cecaa3c47b0654e0916f2
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ENGINE_TESTS_EXCLUDE: >-
    e2e_tui research_engine team_engine onboarding research_runner research_service tui_v1_e2e codex_app_server_live launch_context_live codex_bridge_live agents_live
    qualification_boundary worker_engine_boundary accounts_binary e2e_add_existing setup_network harness_catalog_bundled_rcli acceptance_v2_rcli_usage
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
  DESKTOP_TESTS_EXCLUDE: picker_windows accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: V250 catch-up 244 Linux format, caps, typecheck and lint at tip ${{ github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PLATFORM_TESTS_EXCLUDE: >-
        credential_platforms windows_terminal agent_secret_walls setup team_project_root
        harness_launch launch_context project_sandbox sandbox_everywhere terminal_session
        terminal_tmux/a_pane_holds_only_its_declared_environment_whatever_the_engine_and_server_hold
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free disk on the GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo "::error::this step removes preinstalled toolsets and runs only on a GitHub-hosted runner"
            exit 1
          fi
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null && [ -x "$HOME/.cargo/bin/rustup" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v rustup >/dev/null || { echo "::error::rustup is not installed for the runner user; install it from https://rustup.rs and restart the runner service"; exit 1; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          command -v dpkg >/dev/null || { echo "::error::this job needs a Debian or Ubuntu runner with dpkg"; exit 1; }
          packages=(build-essential pkg-config curl libsqlite3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap libevent-dev libncurses-dev dbus gnome-keyring)
          missing=()
          for package in "${packages[@]}"; do
            [ "$(dpkg -s "$package" 2>/dev/null | sed -n 's/^Status: //p')" = "install ok installed" ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "all ${#packages[@]} build packages are installed"
            exit 0
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "::error::missing packages: ${missing[*]}. This runner has no passwordless sudo; provision it with: sudo apt-get install -y --no-install-recommends ${missing[*]}"
            exit 1
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          ubuntu_hosts=(azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com)
          unresolved() {
            local host
            for host in "${ubuntu_hosts[@]}"; do
              getent hosts "$host" >/dev/null || printf '%s ' "$host"
            done
          }
          lost=$(unresolved)
          if [ -n "$lost" ]; then
            if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
              echo "::error::the runner DNS does not resolve ${lost}and CI changes no DNS setting on a self-hosted runner; fix the runner's DNS"
              exit 1
            fi
            link=$(ip route show default | awk '{print $5; exit}')
            [ -n "$link" ] || { echo "::error::the runner DNS does not resolve ${lost}and the runner has no default route"; exit 1; }
            echo "::warning::the runner DNS does not resolve ${lost% }; asking 1.1.1.1 and 8.8.8.8 on $link instead"
            sudo resolvectl dns "$link" 1.1.1.1 8.8.8.8
            sudo resolvectl flush-caches
            lost=$(unresolved)
            [ -z "$lost" ] || { echo "::error::public DNS does not resolve ${lost}either"; exit 1; }
          fi
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$source" ] && grep -q 'packages\.microsoft\.com' "$source"; then
                sudo rm -f "$source"
                echo "::notice::removed the apt source $source, which names packages.microsoft.com; no package this job installs comes from it"
              fi
            done
          fi
          if ! sudo apt-get "${apt_options[@]}" update --error-on=any; then
            if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
              echo "::error::apt-get update failed and CI rewrites no mirror list on a self-hosted runner; fix the runner's package sources"
              exit 1
            fi
            echo "::warning::the runner Ubuntu mirror list failed; trying archive.ubuntu.com and security.ubuntu.com directly"
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' 'http://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo apt-get "${apt_options[@]}" update --error-on=any
          fi
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: ci-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Keep the Rust build cache under 20 GiB
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          target="$RUNNER_TOOL_CACHE/crazyagent-ci/target"
          mkdir -p "$target"
          size_kib="$(du -sk "$target" | cut -f1)"
          if (( size_kib > 20 * 1024 * 1024 )); then
            echo "pruning $target: ${size_kib} KiB"
            rm -rf "$target"
            mkdir -p "$target"
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - name: Check Rust formatting
        run: make fmt-check
      - name: Check the price snapshot script
        run: make test-price-script
      - name: Check the file line caps
        run: make caps-check
      - name: Check the file line cap script
        run: make test-caps-script
      - name: Check for new sleeps in test code
        run: make sleeps-check
      - name: Check the sleeps check script
        run: make test-sleeps-script
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lint workspace, the one clippy error red at 129071a94 allowed
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked --offline --keep-going --message-format short -- -D warnings > "$RUNNER_TEMP/lint.log" 2>&1
          code=$?
          set -e
          grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: error' "$RUNNER_TEMP/lint.log" | sort -u | tee "$RUNNER_TEMP/errors.txt" || true
          tail -5 "$RUNNER_TEMP/lint.log"
          known='crates/crazyagent/src/storage/master_session/sessions_tests/deleted.rs:460:6: error: very complex type used'
          other=$(grep -cvF "$known" "$RUNNER_TEMP/errors.txt" || true)
          echo "clippy exit $code, errors other than the parent red: $other"
          [ "$other" -eq 0 ]
          [ "$code" -eq 0 ] || [ -s "$RUNNER_TEMP/errors.txt" ]
      - name: Show the free disk and the Rust target size
        if: always()
        run: |
          set -euo pipefail
          df -h /
          target="${CARGO_TARGET_DIR:-target}"
          if [ -d "$target" ]; then
            du -sh "$target"
          fi

  windows:
    name: V250 catch-up 244 Windows rows at ${{ matrix.at }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            at: tip
            ref: ''
          - runner: windows-2025
            at: tip
            ref: ''
          - runner: windows-2022
            at: master 207d2f201
            ref: 207d2f20152f4166c877e90bc70254df1d4ed799
          - runner: windows-2022
            at: parent 129071a94
            ref: 129071a9452b346ad5f23ac70574793151b70fd4
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Keep the parent arity patch outside the code checkout
        run: |
          set -euo pipefail
          cp .github/farm-parent-arity.patch "$RUNNER_TEMP/parent-arity.patch"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ matrix.ref != '' }}
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ matrix.ref }}
      - name: Apply the start_store arity fix the parent's test rows need to compile
        if: ${{ startsWith(matrix.at, 'parent') }}
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/parent-arity.patch"
          git diff --stat
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy on the crazyagent library
        if: ${{ matrix.at == 'tip' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() && matrix.at == 'tip' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the boundary helper beside the test binaries, as the farm archive does
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Storage, log, service and launch rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- storage:: app_plugins::store:: memory:: worktrees:: settings_log:: sessions_log:: landing_log:: launch_context:: service::tests:: harnesses::launch:: 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "rows at ${{ matrix.at }}:"
          grep -E '^test result|^test .* FAILED$|could not compile' "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
