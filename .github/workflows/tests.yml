name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 4d6bd0a623
  RUST_FILES: >-
    crates/kernel/processes/src/exit_wait.rs
    crates/kernel/processes/src/exit_wait/tests.rs
    crates/kernel/processes/src/lib.rs
    crates/crazyagent-win-sandbox/src/win/exit_wait.rs
    crates/crazyagent-win-sandbox/src/win/mod.rs
    crates/crazyagent-win-sandbox/src/lib.rs

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: EXIT-WAIT helper rows, mutant m2 and clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ROWS: exit_wait::tests::an_exit_before_the_watch_is_heard_at_once exit_wait::tests::a_quick_exit_is_heard_and_reaped exit_wait::tests::another_child_s_exit_wakes_no_wrong_wait exit_wait::tests::a_deadline_at_the_exit_reaps_once_either_way exit_wait::tests::a_child_already_reaped_arms_nothing exit_wait::tests::a_running_child_meets_the_deadline_unreaped exit_wait::tests::the_reap_follows_the_waiter_s_answer exit_wait::tests::a_kept_watch_never_starts_a_second_waiter exit_wait::tests::a_dropped_watch_blocks_nobody_and_its_waiter_ends_at_the_exit exit_wait::tests::a_readable_descriptor_wakes_the_wait_first exit_wait::tests::a_refused_process_descriptor_falls_back_and_says_so_once exit_wait::tests::linux_waits_on_a_process_descriptor
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The helper rows by exact name
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          touch crates/kernel/processes/src/lib.rs
          read -r -a want <<< "$ROWS"
          cargo test -p crazyagent-kernel-processes --lib --locked -- --exact --test-threads=4 "${want[@]}" > "$log" 2>&1
          code=$?
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at|exit_wait:' "$log" || true
          wanted="$(printf '%s\n' "${want[@]}" | sort)"
          got="$(grep -E '^test [a-z_0-9:]+ \.\.\. ok$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          echo "BUILT $built ROWS rc $code wanted $(printf '%s\n' "$wanted" | grep -c .) ok $(printf '%s' "$got" | grep -c .)"
          [ "$built" -gt 0 ] && [ "$code" = 0 ] && [ "$got" = "$wanted" ] || { echo "::error::helper rows differ from the want list"; tail -n 40 "$log"; exit 1; }
      - name: Mutant m2 the fallback said every time turns its row red
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/mutant.log"
          if ! python3 - <<'PY'
          p = "crates/kernel/processes/src/exit_wait.rs"
          s = open(p).read()
          old = '        .compare_exchange(0, 1, Ordering::AcqRel, Ordering::Acquire)\n        .is_ok()'
          assert s.count(old) == 1, "mutant anchor"
          open(p, "w").write(s.replace(old, '        .fetch_add(1, Ordering::AcqRel)\n        < usize::MAX'))
          PY
          then
            echo "::error::the mutant did not apply"
            exit 1
          fi
          cargo test -p crazyagent-kernel-processes --lib --locked -- --exact "exit_wait::tests::a_refused_process_descriptor_falls_back_and_says_so_once" > "$log" 2>&1
          code=$?
          git checkout -q -- "crates/kernel/processes/src/exit_wait.rs"
          grep -E '^test |test result:|panicked at|left:|right:' "$log" || true
          failed="$(grep -cE '^test exit_wait::tests::a_refused_process_descriptor_falls_back_and_says_so_once \.\.\. FAILED$' "$log")"
          echo "MUTANT m2 the fallback said every time rc $code FAILED lines $failed"
          [ "$code" != 0 ] && [ "$failed" = 1 ] || { echo "::error::the row stayed green under the mutant"; exit 1; }
      - name: Clippy kernel processes tests, failing on a lint in the touched files
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/kernel/processes/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent-kernel-processes -p crazyagent-win-sandbox --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          echo "CHECKED crazyagent-kernel-processes $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          echo "linux clippy rc $code touched-file lints $moved"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] || { echo "::error::a lint in the touched files"; exit 1; }
  windows:
    name: EXIT-WAIT helper rows, mutant m4 and clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      ROWS: exit_wait::tests::a_quick_exit_is_heard_and_reaped exit_wait::tests::a_deadline_at_the_exit_reaps_once_either_way exit_wait::tests::a_child_already_reaped_arms_nothing exit_wait::tests::a_running_child_meets_the_deadline_unreaped
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The helper rows by exact name
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          touch crates/kernel/processes/src/lib.rs
          read -r -a want <<< "$ROWS"
          cargo test -p crazyagent-kernel-processes --lib --locked -- --exact --test-threads=4 "${want[@]}" > "$log" 2>&1
          code=$?
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at|exit_wait:' "$log" || true
          wanted="$(printf '%s\n' "${want[@]}" | sort)"
          got="$(grep -E '^test [a-z_0-9:]+ \.\.\. ok$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          echo "BUILT $built ROWS rc $code wanted $(printf '%s\n' "$wanted" | grep -c .) ok $(printf '%s' "$got" | grep -c .)"
          [ "$built" -gt 0 ] && [ "$code" = 0 ] && [ "$got" = "$wanted" ] || { echo "::error::helper rows differ from the want list"; tail -n 40 "$log"; exit 1; }
      - name: Mutant m4 the wait reads a timeout as an exit turns its row red
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/mutant.log"
          if ! python3 - <<'PY'
          p = "crates/crazyagent-win-sandbox/src/win/exit_wait.rs"
          s = open(p).read()
          old = 'WAIT_TIMEOUT if Instant::now() >= deadline => return Ok(false),'
          assert s.count(old) == 1, "mutant anchor"
          open(p, "w").write(s.replace(old, 'WAIT_TIMEOUT if Instant::now() >= deadline => return Ok(true),'))
          PY
          then
            echo "::error::the mutant did not apply"
            exit 1
          fi
          cargo test -p crazyagent-kernel-processes --lib --locked -- --exact "exit_wait::tests::a_running_child_meets_the_deadline_unreaped" > "$log" 2>&1
          code=$?
          git checkout -q -- "crates/crazyagent-win-sandbox/src/win/exit_wait.rs"
          grep -E '^test |test result:|panicked at|left:|right:' "$log" || true
          failed="$(grep -cE '^test exit_wait::tests::a_running_child_meets_the_deadline_unreaped \.\.\. FAILED$' "$log")"
          echo "MUTANT m4 the wait reads a timeout as an exit rc $code FAILED lines $failed"
          [ "$code" != 0 ] && [ "$failed" = 1 ] || { echo "::error::the row stayed green under the mutant"; exit 1; }
      - name: Clippy kernel processes tests, failing on a lint in the touched files
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/kernel/processes/src/lib.rs crates/crazyagent-win-sandbox/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent-kernel-processes -p crazyagent-win-sandbox --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log")"
          echo "CHECKED crazyagent-kernel-processes $checked"
          sandbox="$(grep -cE '^ +(Checking|Compiling) crazyagent-win-sandbox v' "$log")"
          echo "CHECKED crazyagent-win-sandbox $sandbox"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          echo "windows clippy rc $code touched-file lints $moved"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked, the cache was read as fresh"; exit 1; }
          [ "$sandbox" -gt 0 ] || { echo "::error::crazyagent-win-sandbox was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] || { echo "::error::a lint in the touched files"; exit 1; }
