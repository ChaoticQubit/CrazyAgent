name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_COPY_SHA: "296747674"
  RED_FAULT_SHA: 7abc350c9
  SEAM_FIX_SHA: 6cfa8c202
  DROP_FIX_BASE: 2c1b75e5c
  DROP_FIX_SHA: cb6088d31
  GREEN_SHA: 66102f50f

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: V244 H5 Windows host on ${{ matrix.runner }}, red 296747674 and 7abc350c9 then green 66102f50f, rows, display rows and clippy
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Red rows, then green rows, display rows and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          git diff --quiet "$GREEN_SHA" HEAD -- apps crates Cargo.toml Cargo.lock
          cp .github/farm/v244-native-windows-h5.sh "$RUNNER_TEMP/h5.sh"
          bash "$RUNNER_TEMP/h5.sh" windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-native-windows-h5-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/v244-native-windows-h5-windows-*.txt
            ${{ runner.temp }}/red-*.txt
            ${{ runner.temp }}/*.txt
          if-no-files-found: warn
          retention-days: 14
  linux:
    name: V244 H5 host on ubuntu-22.04 at 66102f50f, the stand-in host lib build and clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Drop the Microsoft apt source the farm does not use
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Green lib build and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          git diff --quiet "$GREEN_SHA" HEAD -- apps crates Cargo.toml Cargo.lock
          cp .github/farm/v244-native-windows-h5.sh "$RUNNER_TEMP/h5.sh"
          bash "$RUNNER_TEMP/h5.sh" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-native-windows-h5-ubuntu-22.04
          path: |
            ${{ runner.temp }}/v244-native-windows-h5-linux-*.txt
          if-no-files-found: warn
          retention-days: 14
