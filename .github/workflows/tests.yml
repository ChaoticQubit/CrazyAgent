name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  TIP_FULL: 639038633813cf04a4b37aa77b575b271664ea6d
  RED_FULL: 8da49e5f024c0b76a81e9ff5792691ba6fe11d92
  BASE_FULL: ee844fc1e8dcc49cef9e193efd4551292623b11e

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: B07-CR2 node ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip (the fix commit)"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not chore/v250 ee844fc1e8"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm ci, tsc, then the Restore 2.4 rows at the tip (expect each rc 0, fail 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log" || true
          (cd apps/desktop && npm run --silent typecheck) > "$RUNNER_TEMP/tsc.log" 2>&1
          tc=$?
          grep -E 'error TS' "$RUNNER_TEMP/tsc.log" | head -n 10 || true
          (cd apps/desktop && node --test --test-reporter=tap test/settings-restore.test.mjs) > "$RUNNER_TEMP/sr.log" 2>&1
          sr=$?
          (cd apps/desktop && node --test --test-reporter=tap test/restore-recovery.test.mjs) > "$RUNNER_TEMP/rr.log" 2>&1
          rr=$?
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/sr.log" || true
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/rr.log" || true
          f1="$(grep -E '^# fail ' "$RUNNER_TEMP/sr.log" | awk '{print $3}' || true)"
          f2="$(grep -E '^# fail ' "$RUNNER_TEMP/rr.log" | awk '{print $3}' || true)"
          row="$(grep -cE '^ok [0-9]+ - a save that ends after the page closed changes nothing on it' "$RUNNER_TEMP/sr.log" || true)"
          echo "tip npm rc $ci tsc rc $tc settings-restore rc $sr fail ${f1:-none} new-row-ok $row restore-recovery rc $rr fail ${f2:-none}"
          [ "$ci" = 0 ] && [ "$tc" = 0 ] && [ "$sr" = 0 ] && [ "$rr" = 0 ] && [ "$f1" = 0 ] && [ "$f2" = 0 ] && [ "$row" = 1 ] || exit 1
      - name: Red, the red commit's restore.tsx under the tip test (expect exactly the new row not ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set +e
          git checkout "$RED_FULL" -- apps/desktop/src/screens/settings/restore.tsx
          (cd apps/desktop && node --test --test-reporter=tap test/settings-restore.test.mjs) > "$RUNNER_TEMP/sr-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/screens/settings/restore.tsx
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/sr-red.log" || true
          bad="$(grep -cE '^not ok ' "$RUNNER_TEMP/sr-red.log" || true)"
          named="$(grep -cE '^not ok [0-9]+ - a save that ends after the page closed changes nothing on it' "$RUNNER_TEMP/sr-red.log" || true)"
          closed="$(grep -cF 'a closed page is left alone' "$RUNNER_TEMP/sr-red.log" || true)"
          echo "red rc $red not ok $bad named $named closed-page-assert $closed"
          [ "$red" != 0 ] && [ "$bad" = 1 ] && [ "$named" = 1 ] && [ "$closed" -ge 1 ] || exit 1
