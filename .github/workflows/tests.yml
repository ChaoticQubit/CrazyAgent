name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  clippy:
    name: B23 GITDENY kernel-sandbox clippy on ${{ matrix.os }} at tip
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='GITDENY tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = 9b36d49b4d5295a0faa91a5f84e1b114fb29473b ] || { echo "::error::the parent is not the GITDENY tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = 6edebf1418fd221d0eecfa448dcffaa5b78da62c ] || { echo "::error::HEAD~2 is not the GITDENY fix"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = 1b621a5928f12658c9addef4434caae9ea02a49a ] || { echo "::error::HEAD~3 is not the GITDENY red row"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = 88dafb94f448a07cb105d461b9df018e451d817c ] || { echo "::error::HEAD~4 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~4 HEAD^ | tr '\n' ' ')" = "crates/kernel/sandbox/src/profile/allows.rs crates/kernel/sandbox/src/profile/tests.rs " ] || { echo "::error::the range touches more than allows.rs and profile/tests.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the GITDENY tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: kernel-sandbox clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings)
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +Checking crazyagent-kernel-sandbox ' "$log" || true)"
          echo "clippy ${{ matrix.os }} rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
