name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  green:
    name: Durable narrowing r2 green at 5d3e6795e on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
          bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Durable narrowing r2 green at 5d3e6795e on ubuntu-22.04
        timeout-minutes: 150
        run: |
          export CARGO_BUILD_JOBS=2
          cp .github/farm/r2.sh "$RUNNER_TEMP/r2.sh"
          bash "$RUNNER_TEMP/r2.sh" green green 5d3e6795e \
            engine::owner::transport::barrier_tests::a_revocation_pending_when_the_engine_dies_lands_at_the_next_open \
            engine::owner::transport::barrier_tests::a_revocation_refused_at_the_barrier_lands_at_the_next_open_when_the_engine_dies_mid_drain \
            engine::owner::transport::barrier_tests::an_engine_whose_tui_is_revoked_starts_and_refuses_the_tui \
            engine::owner::transport::native_auth_restart_tests::a_sign_out_pending_when_the_engine_dies_signs_the_profile_out_at_the_next_start \
            engine::owner::transport::native_auth_restart_tests::a_leftover_sign_out_the_harness_cannot_finish_keeps_the_profile_blocked_and_says_why \
            engine::owner::transport::native_auth_restart_tests::a_sign_out_storage_refuses_keeps_no_intent_and_the_profile_launches_after_a_restart \
            engine::owner::transport::native_auth_restart_tests::an_owner_sign_in_ends_the_kept_sign_outs_of_its_profile_so_a_restart_keeps_it \
            engine::owner::transport::native_auth_restart_tests::a_drained_sign_out_whose_intent_is_gone_is_refused_and_the_sign_in_stays \
            engine::owner::transport::master_runtime::routing_tests::a_sign_out_that_outlasts_its_bound_is_pending_and_runs_while_the_host_stays_frozen \
            engine::owner::transport::native_auth_restart_tests::a_drained_sign_out_refused_by_name_keeps_its_intent_and_the_next_open_replays_it \
            engine::owner::transport::native_auth_restart_tests::a_sign_out_refused_after_the_owner_was_told_pending_keeps_its_intent_for_the_next_open \
            engine::owner::transport::barrier_tests::a_revocation_that_never_gets_the_owner_barrier_is_pending_and_lands_while_the_engine_runs \
            engine::owner::transport::barrier_tests::a_revocation_the_full_queue_refuses_is_pending_and_lands_while_the_engine_runs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-narrowing-green
          path: ${{ runner.temp }}/green
          if-no-files-found: warn
          retention-days: 14
  base:
    name: Durable narrowing r2 suites 5x at base 556987b36 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
          bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Durable narrowing r2 suites 5x at base 556987b36 on ubuntu-22.04
        timeout-minutes: 100
        run: |
          export CARGO_BUILD_JOBS=2
          cp .github/farm/r2.sh "$RUNNER_TEMP/r2.sh"
          bash "$RUNNER_TEMP/r2.sh" suites base 556987b36
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-narrowing-base
          path: ${{ runner.temp }}/base
          if-no-files-found: warn
          retention-days: 14
  red-c:
    name: Durable narrowing r2 late-refusal row red at e0c94125c on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
          bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Durable narrowing r2 late-refusal row red at e0c94125c on ubuntu-22.04
        timeout-minutes: 70
        run: |
          export CARGO_BUILD_JOBS=2
          cp .github/farm/r2.sh "$RUNNER_TEMP/r2.sh"
          export OVERLAY=5d3e6795e:crates/crazyagent/src/engine/owner/transport/native_auth_restart_tests.rs
          bash "$RUNNER_TEMP/r2.sh" red red-c e0c94125c \
            engine::owner::transport::native_auth_restart_tests::a_sign_out_refused_after_the_owner_was_told_pending_keeps_its_intent_for_the_next_open
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-narrowing-red-c
          path: ${{ runner.temp }}/red-c
          if-no-files-found: warn
          retention-days: 14
  narrowing-windows:
    name: Durable narrowing r2 on windows-2022 at 5d3e6795e
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: ci-windows
          save-if: false
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Clippy, the intent-store row 3x and the storage suite on Windows
        timeout-minutes: 130
        run: |
          cp .github/farm/win-r2.sh "$RUNNER_TEMP/win-r2.sh"
          bash "$RUNNER_TEMP/win-r2.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-narrowing-win-tip
          path: ${{ runner.temp }}/win-tip
          if-no-files-found: warn
          retention-days: 14
