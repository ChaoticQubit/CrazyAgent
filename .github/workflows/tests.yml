name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  N2A_TIP: b3b1c6f51

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: V244 N2a held-folder layer at b3b1c6f51 on macos-15, held rows, native_profiles rows, clippy lib and tests
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Check the tree is the N2a tip
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          echo "crates at $N2A_TIP"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux 3.8"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_BUILD_JOBS=2"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Build the crazyagent library test binary at b3b1c6f51
        timeout-minutes: 120
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo test -p crazyagent --lib --locked --no-run
          echo "built in $(( $(date +%s) - start )) s"
      - name: N2a clippy on the crazyagent library at b3b1c6f51
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: N2a clippy on the crazyagent test rows at b3b1c6f51
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: N2a held rows at b3b1c6f51
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::bootstrap::held::tests:: 2>&1 | tee "$RUNNER_TEMP/held.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*held::tests|test result' "$RUNNER_TEMP/held.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/held.log" || true
          [ "$rc" -eq 0 ]
          rows="a_held_folder_makes_opens_and_pins_its_children a_linked_swapped_open_or_hard_linked_child_is_refused a_name_that_is_not_one_plain_component_trips_the_layer shared_locks_meet_an_exclusive_one_waits_and_unlock_frees_it making_a_folder_over_an_existing_one_is_refused_and_keeps_it"
          grep -qE "test result: ok\. 5 passed; 0 failed" "$RUNNER_TEMP/held.log"
          for row in $rows; do
            grep -qE "held::tests::$row " "$RUNNER_TEMP/held.log" || { echo "::error::$row did not run"; exit 1; }
          done
          echo "N2a at $N2A_TIP on macos-15: 5 of 5 held rows pass, each named row ran"
      - name: native_profiles rows at b3b1c6f51, every listed row run
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet "$N2A_TIP" -- crates
          cargo test -p crazyagent --lib --locked -- --list engine::bootstrap::native_profiles > "$RUNNER_TEMP/profiles-list.txt"
          listed=$(grep -cE ': test$' "$RUNNER_TEMP/profiles-list.txt" || true)
          echo "listed $listed native_profiles rows"
          [ "$listed" -gt 0 ]
          set +e
          cargo test -p crazyagent --lib --locked -- engine::bootstrap::native_profiles 2>&1 | tee "$RUNNER_TEMP/profiles.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'test result|FAILED' "$RUNNER_TEMP/profiles.log" || true
          grep -E -A4 'panicked' "$RUNNER_TEMP/profiles.log" || true
          [ "$rc" -eq 0 ]
          result=$(grep -E '^test result: ok\. [0-9]+ passed; 0 failed; [0-9]+ ignored' "$RUNNER_TEMP/profiles.log")
          passed=$(echo "$result" | sed -E 's/.* ok\. ([0-9]+) passed.*/\1/')
          ignored=$(echo "$result" | sed -E 's/.* ([0-9]+) ignored.*/\1/')
          [ "$ignored" -eq 2 ] || { echo "::error::expected the 2 ignored renewal rows, got $ignored"; exit 1; }
          [ $(( passed + ignored )) -eq "$listed" ] || { echo "::error::$passed passed and $ignored ignored of $listed listed"; exit 1; }
          echo "native_profiles at $N2A_TIP on macos-15: $passed passed, the 2 ignored renewal rows ignored, of $listed listed"
