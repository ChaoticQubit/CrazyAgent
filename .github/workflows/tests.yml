  node:
    name: Batch b14 r2 node rows and caps on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: F6, F6 r2 desktop node rows
        id: node
        timeout-minutes: 15
        run: |
          set +e
          red=0
          : > "$RUNNER_TEMP/node.red"
          cd apps/desktop || exit 1
          npm ci --ignore-scripts --no-audit --no-fund || { echo "npm ci failed"; exit 1; }
          for f in test/settings-app-plugins.test.mjs test/native/bridge-routes.test.mjs test/command-wiring.test.mjs test/command-registration.test.mjs test/router.test.mjs test/settings-frame.test.mjs test/native/trial-kit.test.mjs; do
            tap="$RUNNER_TEMP/$(basename "$f").tap"
            node --test --test-reporter=tap "$f" > "$tap" 2>&1
            code=$?
            echo "$f on ubuntu-22.04: rc $code"
            grep -E '^# (tests|pass|fail)' "$tap" || true
            { grep -E '^[[:space:]]*not ok' "$tap" || true; } | sed -E 's/^[[:space:]]*not ok [0-9]+ - //' | awk -v f="$f" '!s[$0]++{print f "\t" $0}' >> "$RUNNER_TEMP/node.red"
            if [ "$code" -ne 0 ]; then red=1; grep -E -A 12 '^[[:space:]]*not ok' "$tap" | head -n 60; fi
            grep -qE '^# pass [1-9]' "$tap" || { echo "$f: no row passed"; red=1; }
          done
          cat "$RUNNER_TEMP/node.red"
          [ "$red" -eq 0 ]
      - name: Caps and sleeps gates and their tests at the b14 tip (F-SLEEPS-B14)
        id: caps
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set +e
          node scripts/quality/caps.mjs
          a=$?
          node --test scripts/quality/caps.test.mjs
          b=$?
          node scripts/quality/sleeps.mjs
          c=$?
          node --test scripts/quality/sleeps.test.mjs
          d=$?
