name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 064325a716f7434014fe892bf2e269eadcf44435
  RED: 50a8437eefc96242425eaf25fe699054ad705f62
  BASE: 3d3992d3f37f3f50bccb3f81d09bf779050818c4
  FILES: "crates/kernel/storage/src/namespace/tests.rs "
  NEW_ROWS: namespace::tests::a_storage_perf_row_is_exempt_and_product_code_is_not namespace::tests::namespace_is_made_only_by_the_bus_gateway

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: NAMESPACE-GUARD-PERF kernel-storage rows on ubuntu-22.04, red then tip
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED" ] || { echo "::error::HEAD~3 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE" ] || { echo "::error::HEAD~4 is not the b25 base"; exit 1; }
          [ "$(git diff --name-only HEAD~4 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Base row count at the b25 base
        timeout-minutes: 30
        run: |
          set +e
          set -uo pipefail
          git checkout "$BASE" -- crates || exit 1
          git diff --quiet "$BASE" -- crates || { echo "::error::the base tree is not b25"; exit 1; }
          cargo test -p crazyagent-kernel-storage --lib --locked --no-run > "$RUNNER_TEMP/base-build.log" 2>&1
          rc=$?
          listed=$(cargo test -p crazyagent-kernel-storage --lib --locked -- --list 2>/dev/null | grep -cE ': test$' || true)
          echo "$listed" > "$RUNNER_TEMP/base-listed"
          git checkout HEAD^ -- crates || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "BASE build rc $rc listed $listed"
          [ "$rc" = 0 ] && [ "$listed" -ge 1 ]
      - name: Red, the pin row and the guard row at the red commit (expect both FAILED)
        timeout-minutes: 30
        run: |
          set +e
          set -uo pipefail
          git checkout "$RED" -- crates || exit 1
          git diff --quiet "$RED" -- crates || { echo "::error::the red tree is not the red commit"; exit 1; }
          read -ra rows <<< "$NEW_ROWS"
          log="$RUNNER_TEMP/red.log"
          listed=$(cargo test -p crazyagent-kernel-storage --lib --locked -- --exact "${rows[@]}" --list 2>"$RUNNER_TEMP/red-build.log" | grep -cE ': test$' || true)
          cargo test -p crazyagent-kernel-storage --lib --locked -- --exact "${rows[@]}" > "$log" 2>&1
          rc=$?
          grep -E '^test .*(ok|FAILED)$|panicked at|^test result:' "$log" | head -40 || true
          grep -A3 'panicked at' "$log" | cut -c1-400 | head -20 || true
          passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
          failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
          git checkout HEAD^ -- crates || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "RED listed $listed rc $rc passed $passed failed $failed"
          [ "$rc" != 0 ] && [ "$listed" = 2 ] && [ "$failed" = 2 ] && [ "$passed" = 0 ] || { echo "::error::the red leg is not both rows FAILED"; exit 1; }
      - name: Tip, the two rows by name, then every kernel-storage lib row (expect green, listed = base + 1)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          set -uo pipefail
          git rev-parse HEAD^ > /dev/null
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          read -ra rows <<< "$NEW_ROWS"
          named="$RUNNER_TEMP/tip-named.log"
          cargo test -p crazyagent-kernel-storage --lib --locked -- --exact "${rows[@]}" > "$named" 2>&1
          nrc=$?
          grep -E '^test .*(ok|FAILED)$|panicked at|^test result:' "$named" || true
          npassed=$(grep -E '^test result:' "$named" | awk '{p+=$4} END {print p+0}')
          all="$RUNNER_TEMP/tip-all.log"
          listed=$(cargo test -p crazyagent-kernel-storage --lib --locked -- --list 2>"$RUNNER_TEMP/tip-build.log" | grep -cE ': test$' || true)
          cargo test -p crazyagent-kernel-storage --lib --locked > "$all" 2>&1
          rc=$?
          grep -E 'FAILED|panicked at|^test result:' "$all" | head -40 || true
          passed=$(grep -E '^test result:' "$all" | awk '{p+=$4} END {print p+0}')
          failed=$(grep -E '^test result:' "$all" | awk '{f+=$6} END {print f+0}')
          ignored=$(grep -E '^test result:' "$all" | awk '{i+=$8} END {print i+0}')
          base=$(cat "$RUNNER_TEMP/base-listed")
          echo "TIP named rc $nrc passed $npassed; all listed $listed base $base rc $rc passed $passed failed $failed ignored $ignored"
          [ "$nrc" = 0 ] && [ "$npassed" = 2 ] || { echo "::error::the two rows are not green at the tip"; exit 1; }
          [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ $((passed + ignored)) = "$listed" ] || { echo "::error::the storage rows are not green"; exit 1; }
          [ "$listed" = $((base + 1)) ] || { echo "::error::the listed count is not base + 1"; exit 1; }
      - name: Gate, kernel-storage was built (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          for leg in base-build red-build tip-build; do echo "$leg $(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$RUNNER_TEMP/$leg.log" 2>/dev/null || true)"; done
          n=$(cat "$RUNNER_TEMP"/base-build.log "$RUNNER_TEMP"/red-build.log "$RUNNER_TEMP"/red.log "$RUNNER_TEMP"/tip-build.log "$RUNNER_TEMP"/tip-named.log "$RUNNER_TEMP"/tip-all.log 2>/dev/null | grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' || true)
          echo "GATE Compiling crazyagent-kernel-storage $n"
          [ "$n" -ge 1 ]
