name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: c0a799866
  TIP_SHA: d879e547e

defaults:
  run:
    shell: bash

jobs:
  w3-4a:
    name: V244 W3-5b create_under, tree listing and copy, backlink on ${{ matrix.runner }}, red at c0a799866, tip d879e547e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 60
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on crazyagent-win-sandbox
        timeout-minutes: 40
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy on the crazyagent library
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: W1 private rows and the W3-5b create_under rows at the tip d879e547e
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent-win-sandbox --locked --test private_windows -- --test-threads 1 2>&1 | tee "$RUNNER_TEMP/w1.log"
          rc1=${PIPESTATUS[0]}
          cargo test -p crazyagent-win-sandbox --locked --test create_under_windows -- --test-threads 1 --show-output 2>&1 | tee "$RUNNER_TEMP/cu.log"
          rc2=${PIPESTATUS[0]}
          set -e
          grep -E '^test |^test result' "$RUNNER_TEMP/w1.log" "$RUNNER_TEMP/cu.log" || true
          [ "$rc1" -eq 0 ]
          [ "$rc2" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/w1.log"
          grep -qE 'test result: ok\. 8 passed; 0 failed' "$RUNNER_TEMP/cu.log"
      - name: W3-5b red rows at c0a799866
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$RED_SHA" -- crates
          set +e
          cargo test -p crazyagent-win-sandbox --locked --test create_under_windows -- --test-threads 1 2>&1 | tee "$RUNNER_TEMP/red-w1.log"
          rc1=${PIPESTATUS[0]}
          cargo test -p crazyagent --lib --locked -- --test-threads 1 worktrees::tree_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc2=${PIPESTATUS[0]}
          set -e
          git checkout -q "$TIP_SHA" -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test |^test result|panicked' "$RUNNER_TEMP/red-w1.log" "$RUNNER_TEMP/red.log" || true
          [ "$rc1" -ne 0 ]
          [ "$rc2" -ne 0 ]
          [ "$(grep -c '^error\[E' "$RUNNER_TEMP/red-w1.log" "$RUNNER_TEMP/red.log" | awk -F: '{n+=$2} END {print n+0}')" -eq 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 6 failed' "$RUNNER_TEMP/red-w1.log"
          for row in a_folder_and_a_file_are_made_private_relative_to_held_folders a_taken_or_case_only_name_is_refused_and_the_entry_stays a_made_file_is_written_synced_and_renamed_over_an_existing_name a_junction_at_the_name_is_refused_and_not_followed a_name_that_is_not_one_component_trips_the_assertion a_made_entry_is_owned_by_the_engine_user; do
            grep -qxF "test $row ... FAILED" "$RUNNER_TEMP/red-w1.log"
          done
          grep -qE 'test result: FAILED\. 1 passed; 3 failed' "$RUNNER_TEMP/red.log"
          for row in a_tree_naming_an_entry_windows_cannot_name_again_is_refused_before_any_file a_tree_is_written_under_the_held_root_and_its_link_is_left_out the_backlink_git_for_windows_writes_matches_the_lease_path; do
            grep -qxF "test worktrees::tree_windows_tests::$row ... FAILED" "$RUNNER_TEMP/red.log"
            grep -qxF -- "---- worktrees::tree_windows_tests::$row stdout ----" "$RUNNER_TEMP/red.log"
          done
          grep -qxF "test worktrees::tree_windows_tests::a_folder_or_file_with_a_null_access_list_is_untrusted ... ok" "$RUNNER_TEMP/red.log"
          echo "red as expected: create_under, the tree listing and copy and the backlink refuse or differ at c0a799866; the null-list row already passes there (W3-5a code)"
      - name: W3-5a, W3-4c, W3-4a, W3-2 and W3-1 rows plus the W3-5b rows at the tip d879e547e
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 --show-output engine::owner::transport::key_windows_tests:: engine::owner::transport::root_windows_tests:: engine::bootstrap::anchor_windows_tests:: storage::projects_home::engine_root_windows_tests:: projects_home::compare_windows_tests:: worktrees::canonical_windows_tests:: projects_home::move_project::spelling_windows_tests:: research::accounts::plain_folder_windows_tests:: worktrees::root_and_git_windows_tests:: worktrees::identity_windows_tests:: worktrees::tree_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*_windows_tests|^test result|panicked|bytes:|list as set' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 58 passed; 0 failed' "$RUNNER_TEMP/tip.log"
      - name: Unix projects-home, worktrees and accounts rows at the tip d879e547e
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- projects_home worktrees:: research::accounts 2>&1 | tee "$RUNNER_TEMP/unix.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test result|FAILED|panicked' "$RUNNER_TEMP/unix.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/unix.log"
