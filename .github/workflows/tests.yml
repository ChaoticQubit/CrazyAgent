name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED: 4945912f75fb5435c8082fefae6533daa23a13a0
  PATH_GIT: sandbox::windows::owner_git::tests::the_git_the_engine_finds_on_the_path_is_one_owner_git_installs_for
  ROOTS: sandbox::windows::owner_git::tests::git_for_windows_install_folders_are_found_from_its_programs_only
  MARKERS: sandbox::windows::owner_git::tests::owner_git_reads_only_a_folder_that_holds_git_for_windows_markers
  HOLDS: sandbox::windows::owner_git::tests::owner_git_refuses_an_install_folder_that_holds_the_project_or_its_own_folder
  PROFILE: sandbox::windows::owner_git::tests::owner_git_has_no_capability_writes_only_the_project_and_its_folders_and_is_no_agents_container
  REFUSE: sandbox::windows::owner_git::tests::owner_git_refuses_a_git_outside_a_git_for_windows_install_before_any_profile
  WRAP: sandbox::windows::owner_git::tests::a_wrapped_git_starts_through_the_helper_in_its_own_home_with_no_global_config
  WRAP_REFUSES: sandbox::windows::owner_git::tests::a_wrapped_git_refuses_another_program_a_global_config_or_a_folder_outside_the_project

defaults:
  run:
    shell: bash

jobs:
  win-red:
    name: UNC owner git ucrt64 ${{ matrix.runner }} at the red commit, the Git for Windows folder listing, ROOTS MARKERS and PATH-git red on ucrt64, five guards pass
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the red commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RED" HEAD
          test "$(git diff --name-only "$RED" HEAD)" = .github/workflows/tests.yml
          git checkout -q --detach "$RED"
          test "$(git rev-parse HEAD)" = "$RED"
          test -z "$(git status --porcelain)"
      - name: The Git for Windows install folder, top level and each platform's git
        run: |
          set +e -uo pipefail
          git --version
          cmd //c where git
          ls -la "/c/Program Files/Git"
          for platform in mingw64 ucrt64 clangarm64 clang64 mingw32; do
            if [ -e "/c/Program Files/Git/$platform" ]; then
              echo "PLATFORM $platform folder present; bin/git.exe $( [ -f "/c/Program Files/Git/$platform/bin/git.exe" ] && echo present || echo missing)"
            else
              echo "PLATFORM $platform folder missing"
            fi
          done
          for program in cmd/git.exe bin/git.exe; do
            echo "PROGRAM $program $( [ -f "/c/Program Files/Git/$program" ] && echo present || echo missing)"
          done
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the engine library tests at the red commit
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: ROOTS, MARKERS and PATH-git fail on ucrt64, five guards pass
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          rc=0
          red() {
            local row="$1" want="$2" out="$RUNNER_TEMP/red-$3.txt"
            cargo test -p crazyagent --lib --locked -- --exact "$row" > "$out" 2>&1
            local code=$?
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -8
            grep -A6 "panicked at" "$out" | cut -c1-600 | head -12
            [ "$code" -ne 0 ] || { echo "RED ROW PASSED: $row"; rc=1; return; }
            grep -q "^test $row \.\.\. FAILED" "$out" || { echo "RED ROW DID NOT RUN: $row"; rc=1; return; }
            grep -qF -- "$want" "$out" || { echo "RED ROW FAILED FOR ANOTHER REASON: $row (wanted a line holding: $want)"; rc=1; }
          }
          guard() {
            local row="$1" out="$RUNNER_TEMP/guard-$2.txt"
            cargo test -p crazyagent --lib --locked -- --exact "$row" > "$out" 2>&1
            grep -E "^test |^test result|panicked" "$out" | cut -c1-300 | head -6
            grep -A6 "panicked at" "$out" | cut -c1-600 | head -12
            grep -q "^test $row \.\.\. ok" "$out" || { echo "GUARD ROW NOT OK AT RED: $row"; rc=1; }
          }
          red "$ROOTS" 'C:\Programs\Git\ucrt64\bin\git.exe' roots
          red "$MARKERS" 'Ucrt: Invalid("git is not in a Git for Windows install folder")' markers
          cargo test -p crazyagent --lib --locked -- --exact "$PATH_GIT" > "$RUNNER_TEMP/path-git.txt" 2>&1
          echo "PATH-GIT REPORT, not gated at red:"
          grep -E "^test |gives the install folder" "$RUNNER_TEMP/path-git.txt" | cut -c1-400 | head -4
          guard "$HOLDS" holds
          guard "$PROFILE" profile
          guard "$REFUSE" refuse
          guard "$WRAP" wrap
          guard "$WRAP_REFUSES" wrap-refuses
          [ "$rc" -eq 0 ] && echo "red ok: ROOTS, MARKERS and PATH-git failed on ucrt64, five guards passed"
          exit "$rc"
