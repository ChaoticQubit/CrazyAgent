name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  seam-macos:
    name: native switch-time seam ddbeb380a local checks on the farm (leader 10.40), macos-15
    runs-on: macos-15
    timeout-minutes: 300
    env:
      TIP: ddbeb380ace63fcd135ed18740be5cf373a79e08
      RED: 945179b45b3f12c3f1f8f8307a0f9ab818950ec9
      ROWS: 33f56da1919bcb8b8ce2672e1bb9480fcc6d20be
      RED2: 50829646d1a985eb2ca32630208c31293476463c
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the base workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
          bash --version | head -1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the desktop frontend the desktop crate embeds
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: rustfmt of the native_term files
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -u
          cd apps/desktop/src-tauri/src/native_term
          rustfmt --edition 2024 --check misses.rs misses_tests.rs stamps.rs stamps_tests.rs host.rs probe.rs render.rs mod.rs
          rc=$?
          echo "STEP fmt rc=$rc"
          exit $rc
      - name: Node red rows at the two red commits, each wanted non-zero
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set +e
          set -u
          bad=0
          rt="$RUNNER_TEMP/red-tree"
          mkdir -p "$rt"
          git archive "$RED" apps/desktop | tar -x -C "$rt"
          git archive "$ROWS" apps/desktop/test/native-panel.test.mjs apps/desktop/test/fixtures/native-panel.mjs | tar -x -C "$rt"
          ln -s "$GITHUB_WORKSPACE/apps/desktop/node_modules" "$rt/apps/desktop/node_modules"
          log="$RUNNER_TEMP/red-panel.log"
          (cd "$rt/apps/desktop" && node --test --test-reporter=tap --test-name-pattern "V243-NATIVE-SWITCH-TIME" test/native-panel.test.mjs) > "$log" 2>&1
          rc=$?
          echo "STEP node red panel at ${RED:0:9} with the rows of ${ROWS:0:9} rc=$rc (want non-zero) $(grep -E '^# (pass|fail)' "$log" | tr '\n' ' ')"
          grep -E '^not ok' "$log" | head
          grep -E '^ +error: ' "$log" | cut -c1-200 | head -6
          [ $rc -ne 0 ] || bad=1
          log="$RUNNER_TEMP/red-kit.log"
          (cd "$rt/apps/desktop" && node --test --test-reporter=tap test/native/switch-time-native.test.mjs) > "$log" 2>&1
          rc=$?
          echo "STEP node red kit at ${RED:0:9} rc=$rc (want non-zero) $(grep -m1 -o 'does not provide an export named [^ ]*' "$log")"
          [ $rc -ne 0 ] || bad=1
          rt2="$RUNNER_TEMP/red2-tree"
          mkdir -p "$rt2"
          git archive "$RED2" apps/desktop | tar -x -C "$rt2"
          ln -s "$GITHUB_WORKSPACE/apps/desktop/node_modules" "$rt2/apps/desktop/node_modules"
          log="$RUNNER_TEMP/red2-kit.log"
          (cd "$rt2/apps/desktop" && node --test --test-reporter=tap test/native/switch-time-kit.test.mjs) > "$log" 2>&1
          rc=$?
          echo "STEP node red page read at ${RED2:0:9} rc=$rc (want non-zero) $(grep -m1 -o 'does not provide an export named [^ ]*' "$log")"
          [ $rc -ne 0 ] || bad=1
          exit $bad
      - name: Node rows and tsc at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: apps/desktop
        run: |
          set +e
          set -u
          bad=0
          log="$RUNNER_TEMP/tip-node.log"
          node --test --test-reporter=tap test/native-panel.test.mjs test/native/switch-time-native.test.mjs test/native/switch-time-kit.test.mjs \
            test/no-opaque-failures.test.mjs test/command-wiring.test.mjs test/command-registration.test.mjs test/process.test.mjs test/setup.test.mjs \
            test/team-events.test.mjs test/plugins.test.mjs test/project-access.test.mjs test/run-command.test.mjs test/overview-tabs.test.mjs \
            test/ide-extensions.test.mjs test/native/log-producers.test.mjs test/native/run-layout.test.mjs > "$log" 2>&1
          rc=$?
          echo "STEP node tip rc=$rc $(grep -E '^# (tests|pass|fail)' "$log" | tr '\n' ' ')"
          grep -E '^not ok' "$log" | head
          [ $rc -eq 0 ] || bad=1
          log="$RUNNER_TEMP/tip-tsc.log"
          node node_modules/typescript/bin/tsc --noEmit > "$log" 2>&1
          rc=$?
          echo "STEP tsc rc=$rc"
          head -20 "$log"
          [ $rc -eq 0 ] || bad=1
          exit $bad
      - name: Cargo compile of the red commit, wanted non-zero
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -u
          git checkout -q -f --detach "$RED"
          log="$RUNNER_TEMP/red-cargo.log"
          cargo test -p crazyagent-desktop --locked --lib --no-run > "$log" 2>&1
          rc=$?
          echo "STEP cargo compile red at ${RED:0:9} rc=$rc (want non-zero) $(date +%H:%M:%S)"
          grep -E '^error' -A 4 "$log" | cut -c1-200 | head -24
          git checkout -q -f --detach "$TIP"
          [ "$(git rev-parse HEAD)" = "$TIP" ] || { echo "STEP back at the wrong head"; exit 15; }
          git diff --quiet "$TIP" || { echo "STEP tree is not the tip"; exit 16; }
          [ $rc -ne 0 ] || exit 1
      - name: native_term rows at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -u
          [ "$(git rev-parse HEAD)" = "$TIP" ] || { echo "STEP head is not the tip"; exit 15; }
          log="$RUNNER_TEMP/tip-rows.log"
          cargo test -p crazyagent-desktop --locked --lib -- native_term:: > "$log" 2>&1
          rc=$?
          echo "STEP native_term rows rc=$rc ok=$(grep -cE '^test .* \.\.\. ok$' "$log") failed=$(grep -cE '^test .* \.\.\. FAILED$' "$log") $(date +%H:%M:%S)"
          grep -E '^test result:|FAILED' "$log" | head
          grep -A20 '^---- ' "$log" | cut -c1-300 | head -80
          exit $rc
      - name: clippy all targets at the tip, plain then native-webdriver
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          set -u
          bad=0
          for features in "" "--features native-webdriver"; do
            label=${features:+feature}
            label=${label:-plain}
            log="$RUNNER_TEMP/clippy-$label.log"
            cargo clippy -p crazyagent-desktop --locked --all-targets $features -- -D warnings > "$log" 2>&1
            rc=$?
            echo "STEP clippy $label rc=$rc warnings=$(grep -c '^warning' "$log") errors=$(grep -c '^error' "$log") $(date +%H:%M:%S)"
            grep -E -A6 '^(warning|error)' "$log" | cut -c1-220 | head -40
            [ $rc -eq 0 ] || bad=1
          done
          exit $bad
