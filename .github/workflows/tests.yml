name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: POD-D D1 rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: kernel security rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent-kernel-security --locked 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel security rows on ubuntu-22.04: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: launch_context an_mcp_secret_found_in_the_launch_command_refuses_the_launch_with_a_plain_code
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked launch_context::tests::an_mcp_secret_found_in_the_launch_command_refuses_the_launch_with_a_plain_code 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "launch_context an_mcp_secret_found_in_the_launch_command_refuses_the_launch_with_a_plain_code on ubuntu-22.04: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: launch_context secret_names_ride_only_on_a_secret_in_command_refusal
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked launch_context::tests::secret_names_ride_only_on_a_secret_in_command_refusal 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "launch_context secret_names_ride_only_on_a_secret_in_command_refusal on ubuntu-22.04: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: launch_context both_mcp_configs_hold_each_secret_exactly
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked launch_context::tests::both_mcp_configs_hold_each_secret_exactly 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "launch_context both_mcp_configs_hold_each_secret_exactly on ubuntu-22.04: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: mcp_config_secret_copies
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --locked --test mcp_config_secret_copies 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "mcp_config_secret_copies on ubuntu-22.04: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
  windows:
    name: POD-D D1 rows on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: clippy kernel security
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo clippy -p crazyagent-kernel-security --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "clippy kernel security on ${{ matrix.runner }}: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: clippy engine
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "clippy engine on ${{ matrix.runner }}: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: kernel security rows
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent-kernel-security --locked 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel security rows on ${{ matrix.runner }}: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: launch_context an_mcp_secret_found_in_the_launch_command_refuses_the_launch_with_a_plain_code
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked launch_context::tests::an_mcp_secret_found_in_the_launch_command_refuses_the_launch_with_a_plain_code 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "launch_context an_mcp_secret_found_in_the_launch_command_refuses_the_launch_with_a_plain_code on ${{ matrix.runner }}: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: launch_context secret_names_ride_only_on_a_secret_in_command_refusal
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked launch_context::tests::secret_names_ride_only_on_a_secret_in_command_refusal 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "launch_context secret_names_ride_only_on_a_secret_in_command_refusal on ${{ matrix.runner }}: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: launch_context both_mcp_configs_hold_each_secret_exactly
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --lib --locked launch_context::tests::both_mcp_configs_hold_each_secret_exactly 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "launch_context both_mcp_configs_hold_each_secret_exactly on ${{ matrix.runner }}: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: mcp_config_secret_copies
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: |
          set +e
          cargo test -p crazyagent --locked --test mcp_config_secret_copies 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "mcp_config_secret_copies on ${{ matrix.runner }}: rc $code"
          grep -E "^test |^test result|could not compile|panicked|^error" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
