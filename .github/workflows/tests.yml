name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 6fda8ed4f
  EXPORTED: the_exported_container_sid_is_the_one_a_launch_puts_on_a_granted_root
  REFUSED: a_container_name_the_check_refuses_gets_no_sid
  FIRST: the_container_sid_is_derived_before_the_first_launch_makes_a_profile

defaults:
  run:
    shell: bash

jobs:
  container-sid:
    name: V244-WIN-CONTAINER-SID ${{ matrix.runner }} at 6fda8ed4f, clippy win-sandbox lib and tests, the three container SID boundary rows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Check the tree is the tip plus this workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse --short=9 "$(git log -1 --format=%H HEAD -- . ':!.github')")" = "$TIP"
          test "$(git diff --name-only "$TIP" HEAD)" = ".github/workflows/tests.yml"
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Clippy win-sandbox lib
        timeout-minutes: 30
        run: cargo clippy -p crazyagent-win-sandbox --lib --locked -- -D warnings
      - name: Clippy win-sandbox tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo clippy -p crazyagent-win-sandbox --tests --locked -- -D warnings
      - name: The three container SID rows
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent-win-sandbox --test boundary --locked -- --exact "$EXPORTED" "$REFUSED" "$FIRST" > "$RUNNER_TEMP/rows.txt" 2>&1
          rc=$?
          grep -E "^test |^test result|panicked" "$RUNNER_TEMP/rows.txt" | cut -c1-300
          grep -A8 "panicked at" "$RUNNER_TEMP/rows.txt" | cut -c1-400 | head -30
          for row in "$EXPORTED" "$REFUSED" "$FIRST"; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/rows.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          [ "$rc" -eq 0 ] && echo "container SID ok at $TIP"
          exit "$rc"
