name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  TIP: cd81472f9c752fbd6d7d04d88da385ba93932405
  BASE: ee844fc1e8dcc49cef9e193efd4551292623b11e
  FILES: crates/crazyagent/src/coord/delivery/tests/tmux_quiet.rs crates/crazyagent/src/storage/migrations/tests/pins/restore.rs crates/crazyagent/src/tui/prefs.rs crates/kernel/security/src/perf_tests/keychain.rs

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: CR-TESTS-0225 rustfmt, caps, clippy, restore + prefs + tmux_quiet rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE" ] || { echo "::error::HEAD~2 is not chore/v250 ee844fc1e8"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: rustfmt --check on the touched files (expect rc 0)
        run: |
          set -euo pipefail
          for f in $FILES; do rustfmt --edition 2024 --check "$f"; done
      - name: Line caps and sleeps at the base and the tip (expect no file new to the problem list, sleeps rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; echo "caps tip rc $?"
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1; st=$?; echo "sleeps tip rc $st"
          git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; echo "caps base rc $?"; node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-base.txt" 2>&1; echo "sleeps base rc $?")
          git worktree remove --force "$RUNNER_TEMP/base"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-base.txt" | sort > "$RUNNER_TEMP/cb.txt"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-tip.txt" | sort > "$RUNNER_TEMP/ct.txt"
          comm -13 "$RUNNER_TEMP/cb.txt" "$RUNNER_TEMP/ct.txt" > "$RUNNER_TEMP/caps-new.txt"
          echo "caps new at tip $(wc -l < "$RUNNER_TEMP/caps-new.txt" | tr -d ' ')"; cat "$RUNNER_TEMP/caps-new.txt"
          [ ! -s "$RUNNER_TEMP/caps-new.txt" ] && [ "$st" = 0 ] || exit 1
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Write the row runner
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          set +e
          set -u
          name=$1
          filter=$2
          log="$RUNNER_TEMP/rows-$name.log"
          cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
          rc=$?
          grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$name.txt"
          echo "$name FAILED $(wc -l < "$RUNNER_TEMP/failed-$name.txt" | tr -d ' '):"
          cat "$RUNNER_TEMP/failed-$name.txt"
          awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' | head -n 40 || true
          grep -E '^ +Compiling crazyagent v' "$log" || true
          ok=$(grep -cE '^test .* \.\.\. ok$' "$log")
          echo "$name filter $filter rc $rc ok $ok $(grep -E '^test result:' "$log" | tr '\n' ' ')"
          echo "$ok" > "$RUNNER_TEMP/ok-$name.txt"
          echo "$rc" > "$RUNNER_TEMP/rc-$name.txt"
          ROWS
          sed -i.bak 's/^          //' "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: The touched rows at the tip (expect each filter rc 0, ok > 0, FAILED 0)
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          bad=0
          n=0
          for filter in storage::migrations::tests::pins::restore:: tui::prefs:: coord::delivery::tests::tmux_quiet::; do
            n=$((n + 1))
            bash "$RUNNER_TEMP/rows.sh" "tip-$n" "$filter"
            if [ "$(cat "$RUNNER_TEMP/rc-tip-$n.txt")" != 0 ] || [ -s "$RUNNER_TEMP/failed-tip-$n.txt" ] || [ "$(cat "$RUNNER_TEMP/ok-tip-$n.txt")" -lt 1 ]; then
              bad=1
            fi
          done
          exit "$bad"
  macos:
    name: CR-TESTS-0225 kernel-security clippy and the keychain perf row on macos-15
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE" ] || { echo "::error::HEAD~2 is not chore/v250 ee844fc1e8"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the kernel security sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/kernel/security/src -name '*.rs' -exec touch {} +
      - name: crazyagent-kernel-security clippy --lib --tests (expect rc 0, 0 errors, 0 warnings, the crate compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-sec.log"
          cargo clippy -p crazyagent-kernel-security --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-security v' "$log" || true)"
          echo "clippy crazyagent-kernel-security macos-15 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: The ignored keychain perf row by exact name (expect rc 0 and 1 passed)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/keychain.log"
          cargo test -p crazyagent-kernel-security --lib --locked -- --ignored --exact perf_tests::keychain::keychain_calls > "$log" 2>&1
          code=$?
          grep -E '^test |^PERF |panicked|^thread' "$log" | head -n 60 || true
          result="$(grep -E '^test result:' "$log" || true)"
          echo "keychain_calls rc $code $result"
          [ "$code" = 0 ] && echo "$result" | grep -q ' 1 passed; 0 failed' || exit 1
