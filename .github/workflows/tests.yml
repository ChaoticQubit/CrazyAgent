name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: caa607702
  TIP_SHA: a0b086ec6

defaults:
  run:
    shell: bash

jobs:
  s1:
    name: V244 WIN-MASTER S1 r2 Codex custody on ${{ matrix.runner }}, red at caa607702, tip a0b086ec6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Clippy on the win-sandbox library and its test rows
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --lib --locked -- -D warnings
          cargo clippy -p crazyagent-win-sandbox --tests --locked -- -D warnings
      - name: S1 r2 red rows, pump.rs, process_custody.rs and win/tree.rs at caa607702 on the tip's tree
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git restore -q --source="$RED_SHA" --staged --worktree -- crates/crazyagent/src/engine/codex_host/pump.rs crates/crazyagent/src/engine/codex_host/process_custody.rs crates/crazyagent-win-sandbox/src/win/tree.rs
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::codex_host::pump:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          if [ "$RUNNER_OS" = Windows ]; then
            cargo test -p crazyagent-win-sandbox --lib --locked -- --test-threads 1 win::tree::tests:: 2>&1 | tee "$RUNNER_TEMP/red-tree.log"
            tree_rc=${PIPESTATUS[0]}
          fi
          set -e
          git restore -q --source="$TIP_SHA" --staged --worktree -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test engine::codex_host::|^test result|panicked|left:|right:' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 7 passed; 2 failed' "$RUNNER_TEMP/red.log"
          for row in a_pumped_input_write_is_done_only_once_its_pipe_took_it_whole a_pumped_input_reports_the_failure_of_its_one_write; do
            grep -q "$row \.\.\. FAILED" "$RUNNER_TEMP/red.log"
          done
          if [ "$RUNNER_OS" = Windows ]; then
            grep -E '^test win::|^test result|panicked|left:|right:' "$RUNNER_TEMP/red-tree.log" || true
            [ "$tree_rc" -ne 0 ]
            grep -qE 'test result: FAILED\. 0 passed; 1 failed' "$RUNNER_TEMP/red-tree.log"
            grep -q 'a_held_tree_with_a_sleeping_child_says_ended_only_once_none_runs \.\.\. FAILED' "$RUNNER_TEMP/red-tree.log"
          fi
          echo "red as expected: the 2 new pump rows fail and the 7 others pass; on Windows the stand-in ended says true while ping still runs"
      - name: Build the Linux sandbox helper the custody rows start
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
          ls -l target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
      - name: S1 r2 Codex host rows at the tip a0b086ec6
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::codex_host:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test engine::codex_host::|^test result|panicked' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          if [ "$RUNNER_OS" = Windows ]; then
            grep -qE 'test result: ok\. 21 passed; 0 failed; 1 ignored' "$RUNNER_TEMP/tip.log"
          else
            grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/tip.log"
          fi
      - name: S1 r2 Codex host Windows rows, pump rows and the tree row five times at the tip
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set +e
          for round in 1 2 3 4 5; do
            cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::codex_host::process_windows_tests:: engine::codex_host::pump:: > "$RUNNER_TEMP/round-$round.log" 2>&1
            rc=$?
            echo "round $round rc=$rc"
            grep -E 'FAILED|panicked|^test result' "$RUNNER_TEMP/round-$round.log" || true
            [ "$rc" -eq 0 ] || exit 1
            grep -qE 'test result: ok\. 17 passed; 0 failed' "$RUNNER_TEMP/round-$round.log" || exit 1
            cargo test -p crazyagent-win-sandbox --lib --locked -- --test-threads 1 win::tree::tests:: > "$RUNNER_TEMP/tree-$round.log" 2>&1
            rc=$?
            echo "tree round $round rc=$rc"
            grep -E 'FAILED|panicked|^test result' "$RUNNER_TEMP/tree-$round.log" || true
            [ "$rc" -eq 0 ] || exit 1
            grep -qE 'test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/tree-$round.log" || exit 1
          done
      - name: Windows access refusal rows stay green at the tip
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 sandbox::policy::tests:: 2>&1 | tee "$RUNNER_TEMP/policy.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'windows|^test result' "$RUNNER_TEMP/policy.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
          grep -q 'full_access_on_windows_is_refused_with_its_own_reason_and_code \.\.\. ok' "$RUNNER_TEMP/policy.log"
