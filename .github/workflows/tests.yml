name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TMUX_VERSION: "3.8"
  RED_COMMIT: 5fae5bc28ab9b914d5efde21fff23007be95bf38
  MODULES: "team::cleanup::tests:: sandbox::toolchains::tests:: agent_home::tests:: team::runtime::tests::a_teammate_asking_after_its_lead_ended_is_held_not_taken_for_the_lead team::caller::tests::a_hook_asking_while_the_socket_is_bound_again_never_reads_alone storage::projects_home_tests:: project_overview::tests::delete_everything_removes_the_projects_overview_runs_and_no_other_projects roadmap_status::tests::delete_everything_removes_the_projects_roadmap_status_runs_and_no_other_projects engine::keychain::tests::removing_an_agents_files_takes_its_keychain_and_leaves_other_homes_untouched"
  LINUX_MODULES: "team::cleanup::tests:: sandbox::toolchains::tests:: agent_home::tests:: storage::projects_home_tests:: project_overview::tests::delete_everything_removes_the_projects_overview_runs_and_no_other_projects roadmap_status::tests::delete_everything_removes_the_projects_roadmap_status_runs_and_no_other_projects"
  KEPT_ROWS: "team::runtime::tests::a_teammate_asking_after_its_lead_ended_is_held_not_taken_for_the_lead team::caller::tests::a_hook_asking_while_the_socket_is_bound_again_never_reads_alone neither_a_native_lead_nor_its_teammates_touch_the_caller_socket_s_binding_name team::cleanup::tests::removing_an_agent_tree_clears_an_acl_that_refuses_a_look_at_a_shut_folder team::cleanup::tests::opening_up_a_shut_folder_swapped_for_a_link_to_an_owner_file_never_makes_it_writable sandbox::toolchains::tests::removing_an_agent_temp_folder_removes_what_the_agent_shut_and_pinned sandbox::toolchains::tests::removing_all_but_the_kept_socket_removes_what_the_agent_shut_and_pinned storage::projects_home_tests::delete_everything_removes_the_projects_tool_cache_and_leaves_dev_null_alone project_overview::tests::delete_everything_removes_the_projects_overview_runs_and_no_other_projects roadmap_status::tests::delete_everything_removes_the_projects_roadmap_status_runs_and_no_other_projects engine::keychain::tests::removing_an_agents_files_takes_its_keychain_and_leaves_other_homes_untouched"
  SWAP_RUNS: "20"
  SWAP_ROWS: "team::cleanup::tests::removing_an_agent_tree_never_changes_an_owner_folder_a_swapped_folder_points_to team::cleanup::tests::an_ide_terminal_cargo_cache_reset_never_changes_an_owner_folder_a_swapped_folder_points_to team::cleanup::tests::an_ide_terminal_cargo_cache_reset_never_opens_up_an_owner_folder_swapped_in_at_open_up"
  MUTANT_ROWS: "team::cleanup::tests::an_ide_terminal_cargo_cache_reset_never_opens_up_an_owner_folder_swapped_in_at_open_up"
  NEW_ROWS: "team::cleanup::tests::removing_an_agent_tree_whose_own_folder_refuses_a_look_clears_that_acl_and_removes_it team::cleanup::tests::removing_an_agent_tree_reports_an_owner_file_link_swapped_in_before_an_acl_clear team::cleanup::tests::removing_a_deleted_agent_s_files_removes_what_it_shut_and_pinned_in_its_home team::cleanup::tests::removing_a_deleted_project_s_run_folders_removes_what_their_agents_shut_and_pinned"

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS cleanup, toolchains, agent home and swap rows, ${{ matrix.side }}
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: [mutant-mode]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select the Xcode git the engine lands with
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Put the side in place
        env:
          SIDE: ${{ matrix.side }}
        run: bash .farm/side.sh
      - name: The rows and their expected results
        env:
          SIDE: ${{ matrix.side }}
          PLATFORM: macos
        run: bash .farm/rows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-open-up-macos-${{ matrix.side }}
          path: ${{ runner.temp }}/open-up-*.txt
          if-no-files-found: warn
          retention-days: 14
  linux:
    name: Linux cleanup, toolchains and agent home rows, ${{ matrix.side }}
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [tip]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Put the side in place
        env:
          SIDE: ${{ matrix.side }}
        run: bash .farm/side.sh
      - name: The rows and their expected results
        env:
          SIDE: ${{ matrix.side }}
          PLATFORM: linux
        run: bash .farm/rows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-open-up-linux-${{ matrix.side }}
          path: ${{ runner.temp }}/open-up-*.txt
          if-no-files-found: warn
          retention-days: 14
