name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: SAVE-SCHEMA-SCAN fence rows on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022]
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe pick %H %s' HEAD^
          git log -1 --format='branch tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = f30589b2833b664af8c16e75ac4e60c3a0fe86a3 ] || { echo "::error::the grandparent is not the SAVE-SCHEMA-SCAN tip f30589b283"; exit 1; }
          [ "$(git rev-parse HEAD^)" = 68d0a7f1ac6cbafa6f11b4b8b1543d7870ea8baf ] || { echo "::error::the parent is not the probe-only sdk_editor pick"; exit 1; }
          [ "$(git diff --name-only HEAD^^ HEAD^)" = crates/crazyagent/src/sdk_editor/tests.rs ] || { echo "::error::the pick touches more than sdk_editor/tests.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: the 4 fence rows by exact name (expect listed 4, passed 4)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/fence-rows.log"
          cargo test -p crazyagent --lib --locked -- --exact settings_log::tests::an_engine_settings_writer_is_refused_before_an_owner_runtime_starts sessions_log::tests::without_an_owner_runtime_an_engine_close_keeps_its_marks_and_an_own_close_is_refused landing::store::log_tests::a_store_without_a_running_host_refuses_an_agent_branch_write_and_leaves_nothing worktrees::log::tests::the_store_fence_tells_a_missing_owner_table_from_one_of_another_shape --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --lib --locked -- --exact settings_log::tests::an_engine_settings_writer_is_refused_before_an_owner_runtime_starts sessions_log::tests::without_an_owner_runtime_an_engine_close_keeps_its_marks_and_an_own_close_is_refused landing::store::log_tests::a_store_without_a_running_host_refuses_an_agent_branch_write_and_leaves_nothing worktrees::log::tests::the_store_fence_tells_a_missing_owner_table_from_one_of_another_shape > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked|left:|right:' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "fence-rows rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" = 4 ] && [ "$passed" = 4 ] && [ "$failed" = 0 ] || exit 1
      - name: every row of the 5 fence caller test modules (listed > 0, passed = listed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/fence-modules.log"
          cargo test -p crazyagent --lib --locked -- settings_log::tests:: sessions_log::tests:: landing::store::log_tests:: memory::log::tests:: worktrees::log::tests:: --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --lib --locked -- settings_log::tests:: sessions_log::tests:: landing::store::log_tests:: memory::log::tests:: worktrees::log::tests:: > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked|left:|right:' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "fence-modules rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1
