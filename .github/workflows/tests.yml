name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 977a2beed7e9b2197f8fb6d90924d50cf51113a4
  PICK_FULL: 6fa0459e6254d89b742b51272ed6b49d609ec5e1
  RED_FULL: ed7a02ce46cda34715b6678a1ea8eaec1cca4991
  ROW: research::runner::listed_tests::a_research_job_finishing_right_after_a_folder_is_saved_hidden_publishes_no_report

defaults:
  run:
    shell: bash

jobs:
  job-row:
    name: RV-B23-CR3 late-hide job row at the tip and at the red commit on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='pick %H %s' HEAD^
          git log -1 --format='branch tip %H %s' HEAD^^
          git log -1 --format='red %H %s' "$RED_FULL"
          [ "$(git rev-parse HEAD^)" = "$PICK_FULL" ] || { echo "::error::the parent is not the macOS-gate pick $PICK_FULL"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = "$TIP_FULL" ] || { echo "::error::the grandparent is not the fix tip $TIP_FULL"; exit 1; }
          git merge-base --is-ancestor "$RED_FULL" "$TIP_FULL" || { echo "::error::the red commit is not below the tip"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the pick on the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: Job row at the tip
        timeout-minutes: 60
        run: |
          set +e
          perl -0pi -e 's/#\[cfg\(all\(test, target_os = "macos"\)\)\]\n#\[path = "runner\/listed_tests.rs"\]/#[cfg(all(test, unix))]\n#[path = "runner\/listed_tests.rs"]/' crates/crazyagent/src/research/runner.rs
          grep -c '^#\[cfg(all(test, unix))\]$' crates/crazyagent/src/research/runner.rs
          git diff --stat
          cargo build -p crazyagent --locked --bin crazyagent-landlock > "$RUNNER_TEMP/bin-tip.log" 2>&1
          echo "landlock helper build rc $?"
          tail -n 3 "$RUNNER_TEMP/bin-tip.log"
          cargo test -p crazyagent --lib --locked -- --exact "$ROW" > "$RUNNER_TEMP/tip.log" 2>&1
          code=$?
          grep -E '^error|^test |panicked|^  left|^ right|ended before|never|^test result' "$RUNNER_TEMP/tip.log" | head -n 60 || true
          tail -n 5 "$RUNNER_TEMP/tip.log"
          echo "job row at the tip rc $code"
          echo "$code" > "$RUNNER_TEMP/tip.rc"
      - name: Job row at the red commit
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          git checkout -q -f "$RED_FULL" || exit 1
          git checkout -q "$TIP_FULL" -- crates/crazyagent/src/research/runner/listed_tests.rs || exit 1
          perl -0pi -e 's/#\[cfg\(all\(test, target_os = "macos"\)\)\]\n#\[path = "runner\/listed_tests.rs"\]/#[cfg(all(test, unix))]\n#[path = "runner\/listed_tests.rs"]/' crates/crazyagent/src/research/runner.rs
          grep -c '^#\[cfg(all(test, unix))\]$' crates/crazyagent/src/research/runner.rs
          git status --short
          cargo build -p crazyagent --locked --bin crazyagent-landlock > "$RUNNER_TEMP/bin-red.log" 2>&1
          echo "landlock helper build rc $?"
          cargo test -p crazyagent --lib --locked -- --exact "$ROW" > "$RUNNER_TEMP/red.log" 2>&1
          code=$?
          grep -E '^error|^test |panicked|^  left|^ right|ended before|never|^test result' "$RUNNER_TEMP/red.log" | head -n 60 || true
          tail -n 5 "$RUNNER_TEMP/red.log"
          echo "job row at the red commit rc $code"
          echo "tip rc $(cat "$RUNNER_TEMP/tip.rc" 2>/dev/null) red rc $code"
