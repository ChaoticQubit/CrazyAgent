name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 6a91c96e66730f1675f88247aca9df030ea9d34b
  FIXED_PATH: /usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin

defaults:
  run:
    shell: bash

jobs:
  g1-macos-uv:
    name: G1 macOS uv for the engine, the four uv rows red without the copied uv and green with it, then the M1, M2 and M3 rows
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
      - name: Install Claude Code and Codex as the shard does
        run: bash scripts/ci/install-harnesses.sh
      - name: Run the shard action's macOS uv and context-mode steps as it writes them
        run: |
          set -euo pipefail
          for name in "Install pinned graphify for the graph rows" "Install the pinned context-mode for the shared-install rows"; do
            ruby -ryaml -rshellwords -e 'step = YAML.load_file(".github/actions/rust-shard/action.yml")["runs"]["steps"].find { |s| s["name"] == ARGV[0] } or abort("no step #{ARGV[0]}"); abort("not macOS") unless step["if"] == "inputs.os == '"'"'macos'"'"'"; (step["env"] || {}).each { |k, v| puts "export #{k}=#{Shellwords.escape(v.to_s)}" }; puts step["run"]' "$name" > "$RUNNER_TEMP/step.sh"
            echo "== $name"
            bash -euo pipefail "$RUNNER_TEMP/step.sh"
          done
          ls -l /usr/local/bin/uv
          test ! -L /usr/local/bin/uv
          test "$(stat -f '%Su:%Sg' /usr/local/bin/uv)" = root:wheel
          echo "engine-path uv: $(env -i PATH="$FIXED_PATH" HOME=/tmp /usr/bin/which uv) $(env -i PATH="$FIXED_PATH" HOME=/tmp uv --version)"
          echo "GITHUB_PATH now:"
          cat "$GITHUB_PATH"
      - name: Build the library tests and the integration targets
        id: lib
        timeout-minutes: 160
        run: |
          set -euo pipefail
          date -u '+lib build start %H:%M:%S'
          cargo test -p crazyagent --lib --locked --no-run
          for target in project_sandbox onboarding e2e_add_existing; do
            date -u "+$target build start %H:%M:%S"
            cargo test -p crazyagent --test "$target" --locked --no-run
          done
          date -u '+build end %H:%M:%S'
      - name: Red leg, the four uv rows with the copied uv moved aside
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 70
        run: |
          set +e -uo pipefail
          summary="$RUNNER_TEMP/summary.txt"
          row() {
            local label=$1
            shift
            perl -e 'alarm shift @ARGV; exec @ARGV or die "exec: $!"' 900 cargo test -p crazyagent --locked "$@" > "$RUNNER_TEMP/$label.txt" 2>&1
            local code=$?
            grep -E "^test |^test result|panicked" "$RUNNER_TEMP/$label.txt" | cut -c1-300 | head -20
            echo "== $label rc=$code $(grep -m1 'test result' "$RUNNER_TEMP/$label.txt")" | tee -a "$summary"
          }
          sudo mv /usr/local/bin/uv "$RUNNER_TEMP/uv-aside"
          if env -i PATH="$FIXED_PATH" HOME=/tmp uv --version; then echo "== red-setup rc=1 a uv is still on the engine path" | tee -a "$summary"; else echo "== red-setup rc=0 no uv on the engine path" | tee -a "$summary"; fi
          row red-1-landing --lib -- landing::tests::real_uv_rewrites_a_clashing_uv_lock --test-threads 1
          row red-2-cargo-cache --lib -- landing::tests::a_cargo_lock_regeneration_primes_no_uv_cache --test-threads 1
          row red-3-primed --test project_sandbox -- uv_runs_on_a_primed_tool_cache_under_the_agent_profile_and_fails_on_an_unprimed_one --test-threads 1
          row red-4-marker --test project_sandbox -- the_uv_marker_cannot_be_changed_and_a_moved_bucket_stages_as_plain_files --test-threads 1
          sudo mv "$RUNNER_TEMP/uv-aside" /usr/local/bin/uv
          ls -l /usr/local/bin/uv
          if [ "$(stat -f '%Su:%Sg' /usr/local/bin/uv)" = root:wheel ] && [ "$(env -i PATH="$FIXED_PATH" HOME=/tmp uv --version | cut -d' ' -f2)" = "$UV_VERSION" ]; then echo "== restored rc=0" | tee -a "$summary"; else echo "== restored rc=1" | tee -a "$summary"; fi
          exit 0
      - name: Green leg, the four uv rows and the PATH uv rows with the copied uv
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e -uo pipefail
          summary="$RUNNER_TEMP/summary.txt"
          row() {
            local label=$1
            shift
            perl -e 'alarm shift @ARGV; exec @ARGV or die "exec: $!"' 900 cargo test -p crazyagent --locked "$@" > "$RUNNER_TEMP/$label.txt" 2>&1
            local code=$?
            grep -E "^test |^test result|panicked" "$RUNNER_TEMP/$label.txt" | cut -c1-300 | head -20
            echo "== $label rc=$code $(grep -m1 'test result' "$RUNNER_TEMP/$label.txt")" | tee -a "$summary"
          }
          row green-1-landing --lib -- landing::tests::real_uv_rewrites_a_clashing_uv_lock --test-threads 1
          row green-2-cargo-cache --lib -- landing::tests::a_cargo_lock_regeneration_primes_no_uv_cache --test-threads 1
          row green-3-primed --test project_sandbox -- uv_runs_on_a_primed_tool_cache_under_the_agent_profile_and_fails_on_an_unprimed_one --test-threads 1
          row green-4-marker --test project_sandbox -- the_uv_marker_cannot_be_changed_and_a_moved_bucket_stages_as_plain_files --test-threads 1
          row m1-pinned --lib -- a_locked_tool_installs_only_files_whose_sha256_its_lock_lists --test-threads 1
          row m1-uv-tool --lib -- setup::pinned::tests::a_tool_the_previous_build_installed_with_uv_tool_install_updates_to_its_lock --test-threads 1
          exit 0
      - name: M2 and M3 rows
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e -uo pipefail
          summary="$RUNNER_TEMP/summary.txt"
          row() {
            local label=$1
            shift
            perl -e 'alarm shift @ARGV; exec @ARGV or die "exec: $!"' 900 cargo test -p crazyagent --locked "$@" > "$RUNNER_TEMP/$label.txt" 2>&1
            local code=$?
            grep -E "^test |^test result|panicked" "$RUNNER_TEMP/$label.txt" | cut -c1-300 | head -20
            echo "== $label rc=$code $(grep -m1 'test result' "$RUNNER_TEMP/$label.txt")" | tee -a "$summary"
          }
          row m2-toolcache --lib -- context_mode::tests::npm_starts_under_the_install_sandbox_profile context_mode::tests::no_package_script_runs_before_npm_s_record_of_the_tarball_hash_is_checked_against_the_pin engine::owner::transport::plugins::tests::the_context_mode_check_runs_the_shared_install_agents_launch_and_never_npx --test-threads 1
          echo "graphify on PATH: $(command -v graphify || echo MISSING)"
          row m3-engine-lookup --test onboarding -- an_engine_started_without_codex_builds_the_graph_and_reports_codex_missing --test-threads 1
          row m3-onboarding --test onboarding -- agent_folders_left_by_an_earlier_project_with_the_same_id_never_block_a_new_onboarding without_codex_or_claude_mapping_fails_before_any_account_is_picked --test-threads 1
          row m3-e2e --test e2e_add_existing -- existing_folders_move_and_copy_into_the_home_and_onboarding_reports_its_steps --test-threads 1
          exit 0
      - name: Verdict, red rows failed for their named reasons, every other row passed
        if: always()
        run: |
          set +e -uo pipefail
          summary="$RUNNER_TEMP/summary.txt"
          touch "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          cat "$summary"
          rc=0
          for label in red-setup restored red-2-cargo-cache green-1-landing green-2-cargo-cache green-3-primed green-4-marker m1-pinned m1-uv-tool m2-toolcache m3-engine-lookup m3-onboarding m3-e2e; do
            grep -q "^== $label rc=0" "$summary" || { echo "::error::$label not ok"; rc=1; }
          done
          for label in red-1-landing red-3-primed red-4-marker; do
            grep -qE "^== $label rc=[1-9]" "$summary" || { echo "::error::$label did not fail without the copied uv"; rc=1; }
          done
          reason() {
            grep -qF -- "$2" "$RUNNER_TEMP/$1.txt" || { echo "::error::$1 did not fail for: $2"; rc=1; }
          }
          reason red-1-landing "uv is not installed for the engine"
          reason red-3-primed 'called `Option::unwrap()` on a `None` value'
          reason red-4-marker "uv missing"
          exit "$rc"
