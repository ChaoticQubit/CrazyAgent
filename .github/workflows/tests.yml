name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  CHROME_VERSION: "151.0.7922.34"

defaults:
  run:
    shell: bash

jobs:
  v243-linux-copy:
    name: Linux terminal copy (fix a147eaff4, red 20427f713)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm script outside the checkout
        run: cp .github/farm/v243-linux-copy.sh "$RUNNER_TEMP/farm.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the pinned Chrome for Testing
        env:
          CHROME_SHA256: ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_SHA256  $work/chrome.zip" | shasum -a 256 -c -
          unzip -q "$work/chrome.zip" -d "$work"
          chrome="$work/chrome-linux64/chrome"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Green at the fix, red at the red row
        timeout-minutes: 15
        env:
          CRAZYAGENT_BUN: ${{ steps.bun.outputs.bun-path }}
        run: bash "$RUNNER_TEMP/farm.sh"
