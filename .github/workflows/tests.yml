name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TMUX_VERSION: "3.8"
  BASE_SHA: a40e9fc4c35e6b6e22f4a736a1136d543e2fdb8f
  TIP_SHA: 83d1905ad61b98ed25ef13f94c91fa9a9af5ce26
  UNKNOWN_ROW: harnesses_with_an_unknown_version_sign_in_from_the_tui_as_before
  CODEX_ROW: a_codex_below_its_sign_in_minimum_updates_from_the_tui_then_signs_in
  CLAUDE_ROW: a_claude_code_below_its_sign_in_minimum_updates_from_the_tui_then_signs_in

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS DEC-166 sign-in rows, base then tip
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned tmux
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select the Xcode git the engine lands with
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows at base, then at tip
        run: |
          set -uo pipefail
          set +e
          verdict=pass
          for side in base tip; do
            if [ "$side" = base ]; then sha="$BASE_SHA"; else sha="$TIP_SHA"; fi
            out="$RUNNER_TEMP/dec166-macos-$side.txt"
            git checkout -q --detach "$sha" || { echo "::error::checkout $sha failed"; exit 1; }
            git log --oneline -1 | tee "$out"
            echo "HOME=$HOME" | tee -a "$out"
            cargo test -p crazyagent --locked --no-run --test e2e_tui 2>&1 | tee -a "$out"
            cargo test -p crazyagent --locked --test e2e_tui -- --exact "$UNKNOWN_ROW" "$CODEX_ROW" "$CLAUDE_ROW" --test-threads 1 2>&1 | tee -a "$out"
            result() { grep -E "^test $1 \.\.\. " "$out" | sed -E 's/.* \.\.\. //'; }
            unknown=$(result "$UNKNOWN_ROW"); codex=$(result "$CODEX_ROW"); claude=$(result "$CLAUDE_ROW")
            if [ "$side" = base ]; then
              want_min=FAILED
              grep -q "Codex stopped before it finished. Try again." "$out" || verdict=fail
              grep -q "Claude Code stopped before it finished. Try again." "$out" || verdict=fail
            else
              want_min=ok
            fi
            [ "$unknown" = ok ] || verdict=fail
            [ "$codex" = "$want_min" ] || verdict=fail
            [ "$claude" = "$want_min" ] || verdict=fail
            echo "VERDICT $side unknown=${unknown:-none} codex=${codex:-none} claude=${claude:-none} want_min=$want_min verdict_so_far=$verdict"
            { echo "| $side | ${unknown:-none} | ${codex:-none} | ${claude:-none} | $want_min |"; } >> "$GITHUB_STEP_SUMMARY"
          done
          echo "VERDICT final=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-dec166-macos
          path: ${{ runner.temp }}/dec166-macos-*.txt
          if-no-files-found: warn
          retention-days: 14
