name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 247b56187927d48a091aa429d328da4882920180
  RED: 594f76b9737e95f4b6bfef129d91c4ccb665d1c8
  BASE: 1e6fe0e094c2c09f0c9e3e26cc810281a631c63a

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Hidden git non-ASCII rows and timing ${{ matrix.runner }} (red 594f76b97, tip 247b56187, base chore/v244 1e6fe0e09)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm script outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-hidden-git-nonascii-2-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build at the red rows
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" build "$RED"
      - name: Red at the red rows, exactly the expected set
        run: bash "$RUNNER_TEMP/rows.sh" red "$RED"
      - name: Build at the tip
        if: always()
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" build "$TIP"
      - name: Green at the tip, and every lib row naming hidden
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" tip "$TIP"
      - name: Timing at the tip, quiet and under one busy loop per CPU
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" timing
      - name: Any row naming hidden red at the tip, again at the base
        if: always()
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" base "$BASE"

  windows-clippy:
    name: Hidden git non-ASCII clippy windows-2022 (tip 247b56187)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The crates are the tip
        run: git diff --quiet "$TIP" -- crates apps
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy, one target set per call
        timeout-minutes: 90
        run: |
          set -uo pipefail
          failed=0
          printf '| Windows clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"

  linux:
    name: Hidden git non-ASCII rows, timing and clippy ubuntu-22.04 (red 594f76b97, tip 247b56187, base chore/v244 1e6fe0e09)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm script outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-hidden-git-nonascii-2-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build at the red rows
        timeout-minutes: 60
        run: bash "$RUNNER_TEMP/rows.sh" build "$RED"
      - name: Red at the red rows, exactly the expected set
        run: bash "$RUNNER_TEMP/rows.sh" red "$RED"
      - name: Build at the tip
        if: always()
        timeout-minutes: 60
        run: bash "$RUNNER_TEMP/rows.sh" build "$TIP"
      - name: Green at the tip, and every lib row naming hidden
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" tip "$TIP"
      - name: Timing at the tip, quiet and under one busy loop per CPU
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" timing
      - name: Any row naming hidden red at the tip, again at the base
        if: always()
        timeout-minutes: 60
        run: bash "$RUNNER_TEMP/rows.sh" base "$BASE"
      - name: Clippy at the tip, one target set per call
        if: always()
        timeout-minutes: 60
        run: |
          set -uo pipefail
          git checkout -q -f --detach "$TIP"
          failed=0
          printf '| Linux clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"
