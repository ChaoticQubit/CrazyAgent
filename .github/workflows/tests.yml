name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: MASKED-FIELD-SPARE rows on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe-only pick %H %s' HEAD^
          git log -1 --format='branch tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = f38d4c2638bcf486111aaded8fb2d13b716f03cb ] || { echo "::error::the grandparent is not the MASKED-FIELD-SPARE tip f38d4c2638"; exit 1; }
          [ "$(git rev-parse HEAD^)" = f74be2d8a3fa81d6f947240677f863aa67604501 ] || { echo "::error::the parent is not the probe-only ef337e841 pick on the MASKED-FIELD-SPARE tip"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = 0e242e0df863ef076b744acbf1f8c3d74d5b4d79 ] || { echo "::error::HEAD~3 is not the red commit 0e242e0df8"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent-kernel-security and crazyagent at the fix
        timeout-minutes: 90
        run: |
          set +e
          code=0
          clippy() {
            log="$RUNNER_TEMP/clippy.log"
            cargo clippy "$@" --locked --keep-going --message-format short -- -D warnings > "$log" 2>&1
            rc=$?
            grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
            tail -n 3 "$log"
            echo "clippy $* rc $rc"
            [ "$rc" = 0 ] || code=1
          }
          clippy -p crazyagent-kernel-security --lib --tests
          clippy -p crazyagent --lib
          clippy -p crazyagent --test masked_field_spare
          exit $code
      - name: Rows at the fix, all five green, and the seven widget rows
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/fix-rows.log"
          cargo test -p crazyagent --test masked_field_spare --locked > "$log" 2>&1
          code=$?
          grep -E '^test |^test result:' "$log" || true
          ok=$(grep -cE '^test [a-z_:]+ \.\.\. ok$' "$log")
          failed=$(grep -cE '^test [a-z_:]+ \.\.\. FAILED$' "$log")
          widgets="$RUNNER_TEMP/fix-widgets.log"
          cargo test -p crazyagent --lib --locked tui::widgets::tests > "$widgets" 2>&1
          widgets_code=$?
          grep -E '^test |^test result:' "$widgets" || true
          widgets_ok=$(grep -cE '^test [a-z_:]+ \.\.\. ok$' "$widgets")
          widgets_failed=$(grep -cE '^test [a-z_:]+ \.\.\. FAILED$' "$widgets")
          echo "fix f38d4c2638: masked_field_spare rc $code ok $ok of 5 failed $failed; tui::widgets::tests rc $widgets_code ok $widgets_ok of 7 failed $widgets_failed"
          [ "$code" = 0 ] && [ "$ok" = 5 ] && [ "$failed" = 0 ] && [ "$widgets_code" = 0 ] && [ "$widgets_ok" = 7 ] && [ "$widgets_failed" = 0 ] || exit 1
      - name: Rows at the red commit, the five named rows red
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          git checkout 0e242e0df863ef076b744acbf1f8c3d74d5b4d79 -- crates/crazyagent/src/tui/widgets.rs crates/kernel/security/src/secret.rs
          changed=$(git diff --name-only 0e242e0df863ef076b744acbf1f8c3d74d5b4d79 -- crates | tr '\n' ' ')
          echo "tree against the red commit differs in: $changed"
          [ "$changed" = "crates/crazyagent/src/sdk_editor/tests.rs " ] || { echo "::error::the red tree is not the red commit plus the probe-only pick"; exit 1; }
          log="$RUNNER_TEMP/red-rows.log"
          cargo test -p crazyagent --test masked_field_spare --locked > "$log" 2>&1
          code=$?
          grep -E '^test |^test result:' "$log" || true
          got=$(grep -E '^test [a-z_:]+ \.\.\. (ok|FAILED)$' "$log" | sed -E 's/^test ([a-z_:]+) \.\.\. (ok|FAILED)$/\2 \1/' | sort | tr '\n' ';')
          want="FAILED a_masked_field_backspaced_then_dropped_frees_no_byte_of_the_removed_text;FAILED a_masked_field_deleted_from_then_dropped_frees_no_byte_of_the_removed_text;FAILED a_masked_field_pasted_into_frees_no_copy_of_the_paste;FAILED a_masked_field_word_erased_then_dropped_frees_no_copy_of_the_word;FAILED typing_into_a_masked_field_frees_no_copy_of_a_typed_character;"
          echo "red 0e242e0df8: rc $code got $got"
          [ "$got" = "$want" ] || { echo "::error::the red set is not the five named rows"; exit 1; }
