name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: db313ac8213650e4688374abd3048fb767625071
  RED: e9687ad9a484cafaf6815e107c5327f2bbc179f1
  BASE: 7200979e5541c8f2d79547df227401746b36d4d0
  FILES: "crates/kernel/plugin_host/src/registry_folder.rs crates/kernel/plugin_host/src/registry_folder_tests.rs "
  NEW_ROWS: >-
    registry_tests::folder::two_retired_folders_beside_a_trusted_live_plugin_are_deleted_at_start
    registry_tests::folder::two_retired_folders_beside_an_untrusted_live_plugin_are_kept
  GUARD: registry_tests::folder::two_retired_folders_beside_an_untrusted_live_plugin_are_kept
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent-kernel-plugin-host --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent-kernel-plugin-host --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -80 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red1)
        [ "$rc" != 0 ] && [ "$listed" = 2 ] && [ "$failed" = 1 ] && [ "$passed" = 1 ] && grep -qE "^test $GUARD \.\.\. ok$" "$log" || { echo "::error::$name is not the red row red and the guard green"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: MULTI-RETIRED plugin-host clippy, rustfmt and rows on ${{ matrix.os }}, red then tip
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='MULTI-RETIRED tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the MULTI-RETIRED tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED" ] || { echo "::error::HEAD~2 is not the red row commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE" ] || { echo "::error::HEAD~3 is not the REPLACE-SWEEP tip"; exit 1; }
          [ "$(git diff --name-only HEAD~3 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the REPLACE-SWEEP tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the 2 rows at the rows commit (expect the red row red, the guard green)
        timeout-minutes: 40
        run: |
          set +e
          set -uo pipefail
          git checkout "$RED" -- crates || exit 1
          git diff --quiet "$RED" -- crates || { echo "::error::the red tree is not the rows commit"; exit 1; }
          rc=0
          cargo test -p crazyagent-kernel-plugin-host --lib --locked --no-run || rc=1
          read -ra rows <<< "$NEW_ROWS"
          if [ "$rc" = 0 ]; then
            bash "$RUNNER_TEMP/rows.sh" new-at-red red1 --exact "${rows[@]}" || rc=$?
          fi
          git checkout HEAD^ -- crates || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "red leg rc $rc"
          [ "$rc" = 0 ]
      - name: rustfmt --check on the touched files (expect rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          read -ra files <<< "$FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "rustfmt rc $code"
          [ "$code" = 0 ]
      - name: plugin-host clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-plugin-host --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log" || true)"
          echo "clippy ${{ matrix.os }} rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the 2 new rows
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          read -ra rows <<< "$NEW_ROWS"
          bash "$RUNNER_TEMP/rows.sh" new-at-tip pass --exact "${rows[@]}"
      - name: Tip, the folder rows, start_sweep callers included
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" folder pass registry_tests::folder::
      - name: Tip, every plugin-host lib row
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          bash "$RUNNER_TEMP/rows.sh" lib pass

