name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  UV_VERSION: "0.13.5"
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  BASE_SHA: 2430c1f97bc7938959a4e34c00612c090e1fef72
  BATCH_TIP: 60765c4b8bf5e227a6044beba2430b2efc53c7a1
  ROWS_SH: |
    set -uo pipefail
    T=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
    out="$T/b38b"
    mkdir -p "$out/cmd" "$out/log"
    touch "$out/reds.tsv" "$out/summary.txt" "$out/verdict.tsv"
    wrapped() {
      local wrap="$1"
      shift
      case "$wrap" in
        dbus) dbus-run-session -- bash -c 'printf "farm-keyring\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; exec "$@"' wrapped "$@" ;;
        flag) env CRAZYAGENT_BUNDLES_TMUX=1 "$@" ;;
        *) env -u CRAZYAGENT_BUNDLES_TMUX "$@" ;;
      esac
    }
    results() {
      awk '/^test result:/{for(k=1;k<NF;k++){w=$(k+1); sub(/;$/,"",w); if(w=="passed")p+=$k; if(w=="failed")f+=$k; if(w=="ignored")i+=$k}} END{print p+0, f+0, i+0}' "$1"
    }
    verdict() {
      printf '%s\t%s\t%s\t%s\t%s\n' "$FARM_OS" "$1" "$2" "$3" "$4" >> "$out/verdict.tsv"
    }
    mode="$1"
    shift
    if [ "$mode" = run ]; then
      label="$1"
      wrap="$2"
      zero_ok="$3"
      shift 3
      pre=()
      while [ $# -gt 0 ] && [ "$1" != -- ]; do pre+=("$1"); shift; done
      [ $# -gt 0 ] && shift
      filters=()
      flags=()
      for a in "$@"; do
        case "$a" in -*) flags+=("$a") ;; *) filters+=("$a") ;; esac
      done
      printf '%s\n' "$wrap" "${pre[@]}" > "$out/cmd/$label"
      : > "$out/cmd/$label.filters"
      : > "$out/cmd/$label.flags"
      [ ${#filters[@]} -eq 0 ] || printf '%s\n' "${filters[@]}" > "$out/cmd/$label.filters"
      [ ${#flags[@]} -eq 0 ] || printf '%s\n' "${flags[@]}" > "$out/cmd/$label.flags"
      echo "$label on $FARM_OS: cargo test ${pre[*]} -- ${flags[*]+${flags[*]}} ${filters[*]+${filters[*]}} ($wrap)"
      wrapped "$wrap" cargo test "${pre[@]}" -- --list > "$out/log/$label.list" 2> "$out/log/$label.build"
      lrc=$?
      if [ "$lrc" -ne 0 ]; then
        grep -E -A 8 '^error' "$out/log/$label.build" | head -n 200
        tail -n 20 "$out/log/$label.build"
        printf '%s\tCOMPILE\n' "$label" >> "$out/reds.tsv"
        printf '%s %s COMPILE-RED rc=%s\n' "$FARM_OS" "$label" "$lrc" | tee -a "$out/summary.txt"
        exit 1
      fi
      sed -n 's/: test$//p' "$out/log/$label.list" > "$out/log/$label.names"
      total=$(grep -c '' "$out/log/$label.names" || true)
      bad=0
      pkg=""
      prev=""
      for a in "${pre[@]}"; do
        [ "$prev" = -p ] && pkg="$a"
        prev="$a"
      done
      sel="${pre[*]}"
      touch "$out/built.txt"
      if grep -qxF -- "$sel" "$out/built.txt"; then
        echo "$label: cargo test $sel was built earlier in this job, so no Compiling count"
      else
        printf '%s\n' "$sel" >> "$out/built.txt"
        comp=$(grep -c -E "^ +Compiling $pkg v" "$out/log/$label.build" || true)
        echo "$label: Compiling $pkg lines $comp"
        if [ -z "$pkg" ] || [ "$comp" -eq 0 ]; then
          printf '%s %s ZERO cargo compiled no %s unit, so its rows prove nothing\n' "$FARM_OS" "$label" "${pkg:-package}" | tee -a "$out/summary.txt"
          bad=1
        fi
      fi
      echo "$label: the target lists $total rows"
      if [ "$total" -eq 0 ]; then
        printf '%s %s ZERO the target lists no row\n' "$FARM_OS" "$label" | tee -a "$out/summary.txt"
        bad=1
      fi
      hits=0
      for f in ${filters[@]+"${filters[@]}"}; do
        n=$(grep -cF -- "$f" "$out/log/$label.names" || true)
        hits=$((hits + n))
        if [ "$n" -gt 0 ]; then
          echo "filter $f matches $n rows"
        else
          case ",$zero_ok," in
            *",$f,"*|*",*,"*) printf '%s %s ZERO-EXPECTED %s\n' "$FARM_OS" "$label" "$f" | tee -a "$out/summary.txt" ;;
            *) printf '%s %s ZERO %s matches no row\n' "$FARM_OS" "$label" "$f" | tee -a "$out/summary.txt"; bad=1 ;;
          esac
        fi
      done
      if [ ${#filters[@]} -gt 0 ] && [ "$hits" -eq 0 ]; then
        printf '%s %s ZERO no filter matches a row\n' "$FARM_OS" "$label" | tee -a "$out/summary.txt"
        bad=1
      fi
      log="$out/log/$label.log"
      wrapped "$wrap" cargo test "${pre[@]}" -- ${flags[@]+"${flags[@]}"} ${filters[@]+"${filters[@]}"} > "$log" 2>&1
      rc=$?
      grep -E '^running [0-9]+ test|^test .* FAILED$|^test result:' "$log" || true
      grep -oE 'budget [a-z0-9_]+ p95_us=[0-9]+ runs=[0-9]+' "$log" | tee -a "$out/summary.txt" || true
      awk '/^failures:$/{p=1} p' "$log"
      grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/; s/ - should panic$//' | awk '!s[$0]++' > "$out/log/$label.red"
      set -- $(results "$log")
      while IFS= read -r n; do printf '%s\t%s\n' "$label" "$n" >> "$out/reds.tsv"; done < "$out/log/$label.red"
      if [ "$rc" -ne 0 ] && [ ! -s "$out/log/$label.red" ]; then
        printf '%s\tCRASH\n' "$label" >> "$out/reds.tsv"
        tail -n 40 "$log"
      fi
      printf '%s %s rc=%s listed=%s filter_hits=%s passed=%s failed=%s ignored=%s\n' "$FARM_OS" "$label" "$rc" "$total" "$hits" "$1" "$2" "$3" | tee -a "$out/summary.txt"
      [ "$rc" -eq 0 ] && [ "$bad" -eq 0 ]
      exit $?
    fi
    if [ "$mode" = base ]; then
      if [ ! -s "$out/reds.tsv" ]; then
        echo "no red row on $FARM_OS, so no base rerun"
        exit 0
      fi
      git fetch --no-tags --depth=1 origin "$BASE_SHA" || { echo "base fetch failed"; exit 1; }
      git worktree add --detach "$T/base" FETCH_HEAD || exit 1
      cd "$T/base" || exit 1
      export CARGO_TARGET_DIR="$T/base-target"
      git log -1 --format='base %H %s'
      run_s="${BASE_RUN_S:-1200}"
      row_s="${BASE_ROW_S:-300}"
      stamp() { printf '%s %s\n' "$(date -u +%H:%M:%SZ)" "$*"; }
      cat > "$out/tmo" <<'TMO'
    s="$1"
    shift
    case "${FARM_OS:-}" in windows-*) exec "$@" ;; esac
    if timeout --version 2>/dev/null | grep GNU >/dev/null; then exec timeout -k 30 "$s" "$@"; fi
    exec perl -e 'my $s = shift @ARGV; my $pid = fork; defined $pid or die "fork: $!"; if ($pid == 0) { setpgrp(0, 0); exec { $ARGV[0] } @ARGV or exit 127 } setpgrp($pid, $pid); $SIG{ALRM} = sub { kill "TERM", -$pid; for (1 .. 30) { last if waitpid($pid, 1) == $pid; sleep 1 } kill "KILL", -$pid; waitpid($pid, 0); exit 124 }; alarm $s; waitpid($pid, 0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' "$s" "$@"
    TMO
      if [ -n "${BASE_PREP:-}" ]; then bash -c "$BASE_PREP" || echo "base prep rc $?"; fi
      exe=""
      case "${FARM_OS:-}" in windows-*) exe=.exe ;; esac
      export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$CARGO_TARGET_DIR/debug/crazyagent$exe"
      ls -l "$CRAZYAGENT_TEST_NATIVE_AUTH_HOST" || echo "base custodian binary missing"
      for label in $(awk -F'\t' '!s[$1]++{print $1}' "$out/reds.tsv"); do
        wrap=""
        pre=()
        first=1
        while IFS= read -r line; do
          if [ "$first" = 1 ]; then wrap="$line"; first=0; else pre+=("$line"); fi
        done < "$out/cmd/$label"
        flags=()
        while IFS= read -r line; do flags+=("$line"); done < "$out/cmd/$label.flags"
        if awk -F'\t' -v l="$label" '$1==l && $2=="COMPILE"{f=1} END{exit !f}' "$out/reds.tsv"; then
          wrapped "$wrap" cargo test "${pre[@]}" --no-run > "$out/log/$label.base-build" 2>&1
          brc=$?
          grep -E -A 8 '^error' "$out/log/$label.base-build" | head -n 80
          if [ "$brc" -eq 0 ]; then verdict "$label" "(compile)" NEW "compiles at base"; else verdict "$label" "(compile)" BASE "fails to compile at base too, rc $brc"; fi
          continue
        fi
        if awk -F'\t' -v l="$label" '$1==l && $2=="CRASH"{f=1} END{exit !f}' "$out/reds.tsv"; then
          filters=()
          while IFS= read -r line; do filters+=("$line"); done < "$out/cmd/$label.filters"
          stamp "$label base build start, cargo prints nothing until it ends"
          wrapped "$wrap" cargo test "${pre[@]}" --no-run > "$out/log/$label.base-crash.log" 2>&1
          brc=$?
          stamp "$label base build end, rc $brc"
          if [ "$brc" -eq 0 ]; then
            wrapped "$wrap" cargo test "${pre[@]}" -- ${flags[@]+"${flags[@]}"} ${filters[@]+"${filters[@]}"} >> "$out/log/$label.base-crash.log" 2>&1
            brc=$?
          fi
          grep -E '^test result:' "$out/log/$label.base-crash.log" || true
          if [ "$brc" -eq 0 ]; then verdict "$label" "(crash)" NEW "the same call is green at base"; else verdict "$label" "(crash)" BASE "the same call fails at base too, rc $brc"; fi
        fi
        names=()
        while IFS= read -r n; do names+=("$n"); done < <(awk -F'\t' -v l="$label" '$1==l && $2!="COMPILE" && $2!="CRASH" && !s[$2]++ {print $2}' "$out/reds.tsv")
        [ ${#names[@]} -gt 0 ] || continue
        blog="$out/log/$label.base.log"
        stamp "$label base build start, cargo prints nothing until it ends"
        wrapped "$wrap" cargo test "${pre[@]}" --no-run > "$blog" 2>&1
        brc=$?
        stamp "$label base build end, rc $brc"
        if [ "$brc" -eq 0 ]; then
          wrapped "$wrap" bash "$out/tmo" "$run_s" cargo test "${pre[@]}" -- ${flags[@]+"${flags[@]}"} --exact "${names[@]}" >> "$blog" 2>&1
          brc=$?
          if [ "$brc" -eq 124 ] || [ "$brc" -eq 137 ]; then
            stamp "$label base rows passed ${run_s}s, so each row without a result runs alone for at most ${row_s}s"
            for n in "${names[@]}"; do
              grep -qF -e "test $n ... " -e "test $n - should panic ... " "$blog" && continue
              wrapped "$wrap" bash "$out/tmo" "$row_s" cargo test "${pre[@]}" -- ${flags[@]+"${flags[@]}"} --exact "$n" >> "$blog" 2>&1
              r=$?
              if [ "$r" -eq 124 ] || [ "$r" -eq 137 ]; then printf 'test %s ... TIMEOUT\n' "$n" >> "$blog"; fi
            done
          fi
        fi
        stamp "$label at base: rc $brc"
        grep -E '^test |^test result:' "$blog" || true
        awk '/^failures:$/{p=1} p' "$blog"
        built=1
        grep -q '^test result:' "$blog" || built=0
        grep -qE 'no test target named|did not match any packages' "$blog" && built=absent
        for n in "${names[@]}"; do
          if grep -qxF -e "test $n ... ok" -e "test $n - should panic ... ok" "$blog"; then verdict "$label" "$n" NEW "green at base"
          elif grep -qxF -e "test $n ... FAILED" -e "test $n - should panic ... FAILED" "$blog"; then verdict "$label" "$n" BASE "red at base"
          elif grep -qxF "test $n ... TIMEOUT" "$blog"; then verdict "$label" "$n" UNKNOWN "timed out at base after ${row_s}s"
          elif grep -qF "test $n ... ignored" "$blog"; then verdict "$label" "$n" NEW "ignored at base"
          elif [ "$built" = absent ]; then verdict "$label" "$n" NEW "its target is absent at base"
          elif [ "$built" = 0 ]; then verdict "$label" "$n" UNKNOWN "no base test binary ran, rc $brc"
          else verdict "$label" "$n" NEW "absent at base"
          fi
        done
      done
      exit 0
    fi
    if [ "$mode" = summary ]; then
      {
        echo "rows on $FARM_OS:"
        cat "$out/summary.txt"
        echo "NEW vs BASE on $FARM_OS (os, label, row, verdict, detail):"
        if [ -s "$out/verdict.tsv" ]; then cat "$out/verdict.tsv"; else echo "none"; fi
      } | tee -a "$GITHUB_STEP_SUMMARY"
      if [ -s "$out/reds.tsv" ] || grep -qE ' (ZERO|COMPILE-RED) ' "$out/summary.txt"; then exit 1; fi
      exit 0
    fi
    echo "unknown mode $mode"
    exit 2

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Batch b38b rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      FARM_OS: ubuntu-22.04
      BASE_PREP: cargo build -p crazyagent --bin crazyagent --bin crazyagent-landlock --locked && mkdir -p "$CARGO_TARGET_DIR/debug/deps" && cp "$CARGO_TARGET_DIR/debug/crazyagent-landlock" "$CARGO_TARGET_DIR/debug/deps/crazyagent-landlock"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$BATCH_TIP" ] || { echo "::error::HEAD^ is not the batch tip $BATCH_TIP"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Install tmux from the pinned source build into a root-owned folder
        timeout-minutes: 30
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          if dpkg -s tmux >/dev/null 2>&1; then sudo apt-get remove -y tmux; fi
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          sed -i 's#^NCURSES_URL=https://invisible-mirror.net/archives/ncurses/ncurses-6.6.tar.gz$#NCURSES_URL=https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz#' scripts/release/build-tmux.sh
          grep -qx 'NCURSES_URL=https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz' scripts/release/build-tmux.sh
          scripts/release/build-tmux.sh --target x86_64-unknown-linux-gnu --work "$work/build" --out "$work/tmux"
          clean() {
            local p="$1"
            while :; do
              [ -e "$p" ] || return 1
              stat -c '%A %U:%G %n' "$p"
              [ -z "$(find "$p" -maxdepth 0 -perm /022)" ] || return 1
              [ "$(stat -c %u "$p")" = 0 ] || return 1
              [ "$p" = / ] && return 0
              p=$(dirname "$p")
            done
          }
          dir=""
          for root in /usr/lib /usr/libexec /srv; do
            if clean "$root"; then dir="$root/farm-tools/bin"; break; fi
            echo "$root has a group or world writable or foreign-owned hop"
          done
          [ -n "$dir" ] || { echo "::error::no root-owned folder without a writable hop"; exit 1; }
          sudo install -d -m 0755 -o root -g root "$(dirname "$dir")" "$dir"
          sudo install -m 0755 -o root -g root "$work/tmux" "$dir/tmux"
          clean "$dir/tmux" || { echo "::error::$dir/tmux has a group or world writable or foreign-owned hop"; exit 1; }
          [ ! -e /usr/local/bin/tmux ] || { echo "::error::/usr/local/bin/tmux exists"; exit 1; }
          echo "$dir" >> "$GITHUB_PATH"
          echo "FARM_TMUX_DIR=$dir" >> "$GITHUB_ENV"
          test "$("$dir/tmux" -V)" = "tmux $TMUX_VERSION"
      - name: Install uv at the pinned version
        run: |
          set -euo pipefail
          python3 -m pip install --user "uv==$UV_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.local/bin/uv" --version | cut -d' ' -f2)" = "$UV_VERSION"
      - name: Check the tools the rows find
        run: |
          set -euo pipefail
          test "$(command -v tmux)" = "$FARM_TMUX_DIR/tmux"
          stat -c '%A %U:%G %n' /home "$HOME" "$HOME/.local" "$HOME/.local/bin"
          tmux -V
          command -v uv
          uv --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Claude Code and Codex
        run: bash scripts/ci/install-harnesses.sh
      - name: Install the pinned context-mode for the shared-install rows
        run: |
          set -euo pipefail
          read -r version integrity < <(node -e '
            const text = require("node:fs").readFileSync(process.argv[1], "utf8");
            const entry = text.split("[[entries]]").find((block) => /^id = "context-mode"$/m.test(block));
            const version = entry?.match(/^install = ".*\bcontext-mode@([0-9]+\.[0-9]+\.[0-9]+) /m)?.[1];
            const integrity = entry?.match(/^integrity = "(sha512-[A-Za-z0-9+\/]+=*)"$/m)?.[1];
            if (!version || !integrity) throw new Error("the default pack does not pin an exact context-mode");
            console.log(version, integrity);
          ' crates/crazyagent/src/setup/pack.toml)
          test -n "$version" && test -n "$integrity"
          install="$RUNNER_TEMP/context-mode"
          mkdir -p "$install"
          cp .github/ci/context-mode/package.json .github/ci/context-mode/package-lock.json "$install/"
          locked="$(node -p 'const entry = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packages["node_modules/context-mode"]; entry.version + " " + entry.integrity' "$install/package-lock.json")"
          test "$locked" = "$version $integrity"
          npm ci --prefix "$install" --ignore-scripts --no-audit --no-fund --no-update-notifier --loglevel=error
          recorded="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packages["node_modules/context-mode"].integrity' "$install/node_modules/.package-lock.json")"
          test "$recorded" = "$integrity"
          npm_config_build_from_source=true npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")" \
            npm rebuild better-sqlite3 --prefix "$install" --no-audit --no-fund --no-update-notifier --loglevel=error
          test -f "$install/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          test "$(node -p 'require(process.argv[1]).version' "$install/node_modules/context-mode/package.json")" = "$version"
          echo "CRAZYAGENT_CONTEXT_MODE_INSTALL=$install" >> "$GITHUB_ENV"
      - name: Build the engine binaries the tests run and point the custodian rows at them
        timeout-minutes: 60
        run: |
          set -euo pipefail
          t="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          cargo build -p crazyagent --bin crazyagent --bin crazyagent-landlock --locked
          mkdir -p "$t/debug/deps"
          [ "$RUNNER_OS" != Linux ] || cp "$t/debug/crazyagent-landlock" "$t/debug/deps/crazyagent-landlock"
          ls -l "$t/debug/crazyagent"
          echo "CRAZYAGENT_TEST_NATIVE_AUTH_HOST=$t/debug/crazyagent" >> "$GITHUB_ENV"
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Fetch every locked crate for every target
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel storage rows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b38b-kernel-storage dbus - -p crazyagent-kernel-storage --locked --
      - name: project list cut rows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b38b-test-project-list-cut dbus - -p crazyagent --locked --test project_list_cut --
      - name: Base rerun of the red rows at chore/v250 2430c1f97b, cold base build first
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          bash "$RUNNER_TEMP/rows.sh" base
      - name: Rows and NEW versus BASE
        if: ${{ always() }}
        run: |
          bash "$RUNNER_TEMP/rows.sh" summary

  windows:
    name: Batch b38b rows on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
    env:
      FARM_OS: ${{ matrix.runner }}
      BASE_PREP: cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked && cp "$CARGO_TARGET_DIR/debug/crazyagent-win-boundary.exe" "$CARGO_TARGET_DIR/debug/deps/crazyagent-win-boundary.exe"; mkdir -p apps/desktop/dist; printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html && cargo build -p crazyagent --bin crazyagent --locked
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$BATCH_TIP" ] || { echo "::error::HEAD^ is not the batch tip $BATCH_TIP"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Build the engine binaries the tests run and point the custodian rows at them
        timeout-minutes: 60
        run: |
          set -euo pipefail
          t="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          cargo build -p crazyagent --bin crazyagent --locked
          mkdir -p "$t/debug/deps"
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp "$t/debug/crazyagent-win-boundary.exe" "$t/debug/deps/crazyagent-win-boundary.exe"
          ls -l "$t/debug/crazyagent.exe"
          echo "CRAZYAGENT_TEST_NATIVE_AUTH_HOST=$t/debug/crazyagent.exe" >> "$GITHUB_ENV"
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Fetch every locked crate for every target
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel storage rows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b38b-kernel-storage plain - -p crazyagent-kernel-storage --locked --
      - name: Write the stub frontend the desktop crate embeds
        id: desktop
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
      - name: Base rerun of the red rows at chore/v250 2430c1f97b, cold base build first
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          bash "$RUNNER_TEMP/rows.sh" base
      - name: Rows and NEW versus BASE
        if: ${{ always() }}
        run: |
          bash "$RUNNER_TEMP/rows.sh" summary

  macos:
    name: Batch b38b macOS rows on macos-15
    runs-on: macos-15
    timeout-minutes: 330
    env:
      FARM_OS: macos-15
      BASE_PREP: cargo build -p crazyagent --bin crazyagent --locked
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the macOS runner
        run: |
          set -euo pipefail
          df -h /
          case "${ANDROID_HOME:-}" in "$HOME"/?*) rm -rf "$ANDROID_HOME" ;; *) echo "no Android SDK under $HOME" ;; esac
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the batch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='batch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$BATCH_TIP" ] || { echo "::error::HEAD^ is not the batch tip $BATCH_TIP"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the batch tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash --version | head -n 1
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Claude Code and Codex
        run: bash scripts/ci/install-harnesses.sh
      - name: Install the pinned context-mode for the shared-install rows
        run: |
          set -euo pipefail
          read -r version integrity < <(node -e '
            const text = require("node:fs").readFileSync(process.argv[1], "utf8");
            const entry = text.split("[[entries]]").find((block) => /^id = "context-mode"$/m.test(block));
            const version = entry?.match(/^install = ".*\bcontext-mode@([0-9]+\.[0-9]+\.[0-9]+) /m)?.[1];
            const integrity = entry?.match(/^integrity = "(sha512-[A-Za-z0-9+\/]+=*)"$/m)?.[1];
            if (!version || !integrity) throw new Error("the default pack does not pin an exact context-mode");
            console.log(version, integrity);
          ' crates/crazyagent/src/setup/pack.toml)
          test -n "$version" && test -n "$integrity"
          install="$RUNNER_TEMP/context-mode"
          mkdir -p "$install"
          cp .github/ci/context-mode/package.json .github/ci/context-mode/package-lock.json "$install/"
          locked="$(node -p 'const entry = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packages["node_modules/context-mode"]; entry.version + " " + entry.integrity' "$install/package-lock.json")"
          test "$locked" = "$version $integrity"
          npm ci --prefix "$install" --ignore-scripts --no-audit --no-fund --no-update-notifier --loglevel=error
          recorded="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packages["node_modules/context-mode"].integrity' "$install/node_modules/.package-lock.json")"
          test "$recorded" = "$integrity"
          npm_config_build_from_source=true npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")" \
            npm rebuild better-sqlite3 --prefix "$install" --no-audit --no-fund --no-update-notifier --loglevel=error
          test -f "$install/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          test "$(node -p 'require(process.argv[1]).version' "$install/node_modules/context-mode/package.json")" = "$version"
          echo "CRAZYAGENT_CONTEXT_MODE_INSTALL=$install" >> "$GITHUB_ENV"
      - name: Build the engine binaries the tests run and point the custodian rows at them
        timeout-minutes: 60
        run: |
          set -euo pipefail
          t="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          cargo build -p crazyagent --bin crazyagent --bin crazyagent-landlock --locked
          mkdir -p "$t/debug/deps"
          [ "$RUNNER_OS" != Linux ] || cp "$t/debug/crazyagent-landlock" "$t/debug/deps/crazyagent-landlock"
          ls -l "$t/debug/crazyagent"
          echo "CRAZYAGENT_TEST_NATIVE_AUTH_HOST=$t/debug/crazyagent" >> "$GITHUB_ENV"
      - name: Setup done
        id: setup
        run: |
          echo "setup done on $FARM_OS"
      - name: Fetch every locked crate for every target
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: project list cut rows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b38b-test-project-list-cut plain - -p crazyagent --locked --test project_list_cut --
      - name: kernel storage rows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          bash "$RUNNER_TEMP/rows.sh" run b38b-kernel-storage plain - -p crazyagent-kernel-storage --locked --
      - name: Base rerun of the red rows at chore/v250 2430c1f97b, cold base build first
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          bash "$RUNNER_TEMP/rows.sh" base
      - name: Rows and NEW versus BASE
        if: ${{ always() }}
        run: |
          bash "$RUNNER_TEMP/rows.sh" summary
