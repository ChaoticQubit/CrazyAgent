name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: db1a0acb6e3edaedf690e187e94bdc4d174da4aa
  RED: 427a41b8ee124863d68f2626d894880fc1eebd8a
  BASE: ee844fc1e8dcc49cef9e193efd4551292623b11e
  FILES: crates/crazyagent/src/landing/prune.rs crates/crazyagent/src/landing/tests/polish.rs crates/crazyagent/src/landing/tests/prune_rows.rs
  RED_FILES: crates/crazyagent/src/landing/prune.rs crates/crazyagent/src/landing/tests/prune_rows.rs
  FILTER: "landing::tests::polish::prune_rows::"
  RED_ROWS: "landing::tests::polish::prune_rows::a_prune_that_cannot_read_the_repository_is_tried_again landing::tests::polish::prune_rows::a_set_discarded_again_after_the_prune_selection_keeps_its_new_window"
  TIP_ROWS: "landing::tests::polish::prune_rows::a_prune_that_cannot_read_the_repository_is_tried_again landing::tests::polish::prune_rows::a_set_discarded_again_after_the_prune_selection_keeps_its_new_window landing::tests::polish::prune_rows::a_set_whose_repository_became_a_file_is_marked_pruned"
  OLD_ROWS: "landing::tests::a_discarded_change_set_ref_is_pruned_after_seven_days landing::tests::a_discarded_set_whose_ref_cannot_be_deleted_never_stops_the_others_from_pruning landing::tests::owner_edits_are_forgotten_once_their_set_is_accepted_or_pruned_or_the_worktree_retires engine::owner::transport::changes::tests::upkeep_stop_tests::"

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: PRUNE-0226 red then tip, clippy, caps on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          bash --version | head -1
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the branch tip"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED" ] || { echo "::error::HEAD~3 is not the red rows commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE" ] || { echo "::error::HEAD~4 is not chore/v250 ee844fc1e8"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES " ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates, then touch the crazyagent sources so cargo builds the ticket crate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          find crates/crazyagent/src -name '*.rs' -exec touch {} +
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: rustfmt --check on the touched files (expect rc 0)
        run: |
          set -euo pipefail
          for f in $FILES; do rustfmt --edition 2024 --check "$f"; done
      - name: Line caps and sleeps at the base and the tip (expect no file new to the problem list, sleeps rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; echo "caps tip rc $?"
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1; st=$?; echo "sleeps tip rc $st"
          git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; echo "caps base rc $?"; node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-base.txt" 2>&1; echo "sleeps base rc $?")
          git worktree remove --force "$RUNNER_TEMP/base"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-base.txt" | sort > "$RUNNER_TEMP/cb.txt"
          grep -v 'problem(s)' "$RUNNER_TEMP/caps-tip.txt" | sort > "$RUNNER_TEMP/ct.txt"
          comm -13 "$RUNNER_TEMP/cb.txt" "$RUNNER_TEMP/ct.txt" > "$RUNNER_TEMP/caps-new.txt"
          echo "caps new at tip $(wc -l < "$RUNNER_TEMP/caps-new.txt" | tr -d ' ')"; cat "$RUNNER_TEMP/caps-new.txt"
          [ ! -s "$RUNNER_TEMP/caps-new.txt" ] && [ "$st" = 0 ] || exit 1
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings, crazyagent compiled)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Write the row runner
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          set +e
          set -u
          name=$1
          filter=$2
          log="$RUNNER_TEMP/rows-$name.log"
          cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
          rc=$?
          grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$RUNNER_TEMP/failed-$name.txt"
          echo "$name FAILED $(wc -l < "$RUNNER_TEMP/failed-$name.txt" | tr -d ' '):"
          cat "$RUNNER_TEMP/failed-$name.txt"
          awk '/^failures:$/ && !seen {seen=1; p=1; next} p && /^failures:$/ {exit} p' "$log" | grep -E '^---- |panicked at|left:|right:' | head -n 40 || true
          grep -E '^ +Compiling crazyagent v' "$log" || true
          ok=$(grep -cE '^test .* \.\.\. ok$' "$log")
          echo "$name filter $filter rc $rc ok $ok $(grep -E '^test result:' "$log" | tr '\n' ' ')"
          echo "$ok" > "$RUNNER_TEMP/ok-$name.txt"
          echo "$rc" > "$RUNNER_TEMP/rc-$name.txt"
          ROWS
          sed -i.bak 's/^          //' "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Red, the red commit's prune.rs and rows (expect exactly the two new rows FAILED on their asserts)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          for f in $RED_FILES; do git checkout "$RED" -- "$f"; done
          bash "$RUNNER_TEMP/rows.sh" red "$FILTER"
          for f in $RED_FILES; do git checkout HEAD^ -- "$f"; done
          git diff --quiet HEAD^ -- crates || { echo "::error::the tip files were not put back"; exit 1; }
          grep -E 'panicked at .*prune_rows\.rs' "$RUNNER_TEMP/rows-red.log" || { echo "::error::a red row did not fail on its own assert"; exit 1; }
          [ "$(tr '\n' ' ' < "$RUNNER_TEMP/failed-red.txt")" = "$RED_ROWS " ] || { echo "::error::the red set is not exactly the two new rows"; exit 1; }
      - name: Tip, the new rows and the existing prune rows (expect each filter rc 0, ok > 0, FAILED 0)
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set +e
          bad=0
          n=0
          for filter in "$FILTER" $OLD_ROWS; do
            n=$((n + 1))
            bash "$RUNNER_TEMP/rows.sh" "tip-$n" "$filter"
            if [ "$(cat "$RUNNER_TEMP/rc-tip-$n.txt")" != 0 ] || [ -s "$RUNNER_TEMP/failed-tip-$n.txt" ] || [ "$(cat "$RUNNER_TEMP/ok-tip-$n.txt")" -lt 1 ]; then
              bad=1
            fi
          done
          for row in $TIP_ROWS; do
            grep -qxF "test $row ... ok" "$RUNNER_TEMP/rows-tip-1.log" || { echo "::error::$row did not pass"; bad=1; }
          done
          exit "$bad"
  macos:
    name: PRUNE-0226 red then tip on macos-15
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
