          tail -n 5 "$log"
          echo "windows clippy lib rc $code"
          exit $code
      - name: Clippy crazyagent tests, failing only on the moved files or a missing module file
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-tests.log"
          touch crates/crazyagent/src/lib.rs
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          missing="$(grep -cE 'E0583|file not found for module' "$log")"
          echo "windows tests clippy rc $code moved-file lints $moved missing-module $missing"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] && [ "$missing" = 0 ] || { echo "::error::a lint or a missing module in the moved files"; exit 1; }
