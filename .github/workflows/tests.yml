name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 245da0b4f604425bc48ceea9b74d8d1be1a39ba2
  CHORE_FULL: 0202af53353164420170fce3f9073b85a3094bcd
  WANT: "storage::accounts::account_key_tests::a_replace_whose_folder_sync_fails_leaves_the_new_key_and_no_staged_file engine::owner::transport::accounts::account_key_sync_tests::a_store_whose_folder_sync_fails_leaves_no_key_file engine::owner::transport::accounts::account_key_sync_tests::a_replace_whose_folder_sync_fails_leaves_the_new_key_and_no_staged_file storage::migrations::tests::pins::restore::a_restore_moves_the_keys_only_2_5_rows_name_into_its_copy_and_keeps_a_2_4_accounts_key"
  WANT_WIN: "storage::accounts::account_key_windows_tests::a_store_whose_folder_sync_fails_leaves_no_key_file storage::accounts::account_key_windows_tests::a_replace_whose_folder_sync_fails_leaves_the_new_key_and_no_staged_file storage::accounts::account_key_windows_tests::a_key_is_stored_read_replaced_and_removed_as_a_labelled_secret_file"

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: B33-KEY-FILE-SYNC tip on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %P %s' -5 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$CHORE_FULL" ] || { echo "::error::HEAD~5 is not the ticket base chore/v250 0202af5335"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merged tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from chore newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/plugin_host/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of the two crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-kernel-plugin-host -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy kernel-plugin-host and crazyagent with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-plugin-host -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings gates crazyagent-kernel-plugin-host $g0 crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: crazyagent key sync rows and the restore sweep caller rows (expect 4 wanted rows ok, failed 0, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          cargo test -p crazyagent --lib --locked -- --test-threads=1 storage::accounts::account_key_tests:: engine::owner::transport::accounts::account_key_sync_tests:: storage::migrations::tests::pins::restore:: > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          for prefix in storage::accounts::account_key_tests:: engine::owner::transport::accounts::account_key_sync_tests:: storage::migrations::tests::pins::restore::; do
            echo "  $prefix $(grep -cE "^test ${prefix//./\\.}.* \.\.\. ok$" "$log" || true) ok"
          done
          read -r -a want <<< "$WANT"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.}( - should panic)? \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "rows rc $code passed $passed failed $failed wanted ${#want[@]} ok $ok gates crazyagent $g0"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "${#want[@]}" = 4 ] && [ "$g0" -ge 1 ] || exit 1

  windows:
    name: B33-KEY-FILE-SYNC tip clippy and key rows on windows-2022
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$CHORE_FULL" ] || { echo "::error::HEAD~5 is not the ticket base chore/v250 0202af5335"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merged tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from chore newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$CHORE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/plugin_host/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: kernel-plugin-host and crazyagent clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-plugin-host -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-plugin-host v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy windows-2022 rc $code errors $errors warnings $warnings gates crazyagent-kernel-plugin-host $g0 crazyagent $g1"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] || exit 1
      - name: crazyagent Windows key rows by want list (expect 3 wanted rows ok, failed 0, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          read -r -a want <<< "$WANT_WIN"
          cargo test -p crazyagent --lib --locked -- --test-threads=1 --exact "${want[@]}" > "$log" 2>&1
          code=$?
          grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.}( - should panic)? \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "rows windows-2022 rc $code passed $passed failed $failed wanted ${#want[@]} ok $ok gates crazyagent $g0"
          [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "${#want[@]}" = 3 ] && [ "$g0" -ge 1 ] || exit 1
