name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 4e2e4a647b043d0214a51e7a0f605b72f1bf8b68
  BASE: 8953b0b7c63ebcba2fdd586b9961f68fb6c81082

defaults:
  run:
    shell: bash

jobs:
  pastepane-windows:
    name: paste pane once r2 4e2e4a647 windows-2022 clippy, crazyagent (base 8953b0b7c)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The crates are the tip
        run: git diff --quiet "$TIP" -- crates apps
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: A stub desktop frontend, which tauri needs to exist at build time
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -f apps/desktop/dist/index.html ] || printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
      - name: Clippy at the tip, one target set per call
        timeout-minutes: 120
        run: |
          set +e
          set -u
          echo "== TIP $(git log --oneline -1 | cut -c1-100) toolchain $(rustc -V)"
          bad=0
          for crate in crazyagent; do
            for set in "--lib" "--lib --tests"; do
              out=$(cargo clippy -p "$crate" $set --locked -- -D warnings 2>&1)
              rc=$?
              echo "  TIP clippy -p $crate $set rc=$rc"
              printf '%s\n' "$out" | grep -E -A8 '^(error|warning)' | head -60 | cut -c1-300
              [ "$rc" -eq 0 ] || bad=1
            done
          done
          echo "PASTE_TIP_BAD=$bad" >> "$GITHUB_ENV"
          exit 0
      - name: Clippy at the base, only when the tip is not clean
        if: ${{ env.PASTE_TIP_BAD == '1' }}
        timeout-minutes: 120
        run: |
          set +e
          set -u
          git checkout -q -f --detach "$BASE"
          echo "== BASE $(git log --oneline -1 | cut -c1-100)"
          for crate in crazyagent; do
            for set in "--lib" "--lib --tests"; do
              out=$(cargo clippy -p "$crate" $set --locked -- -D warnings 2>&1)
              rc=$?
              echo "  BASE clippy -p $crate $set rc=$rc"
              printf '%s\n' "$out" | grep -E -A8 '^(error|warning)' | head -40 | cut -c1-300
            done
          done
          exit 0
