        id: caps
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set +e
          node scripts/quality/caps.mjs
          a=$?
          node --test scripts/quality/caps.test.mjs
          b=$?
          node scripts/quality/sleeps.mjs
          c=$?
          node --test scripts/quality/sleeps.test.mjs
          d=$?
          node --test scripts/perf/run.test.mjs
          e=$?
          echo "caps rc=$a caps-tests rc=$b sleeps rc=$c sleeps-tests rc=$d perf-run-tests rc=$e"
          [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && [ "$c" -eq 0 ] && [ "$d" -eq 0 ] && [ "$e" -eq 0 ]
      - name: Base rerun of the red node rows at chore/v250 ee844fc1e8
        if: ${{ failure() && steps.node.outcome == 'failure' }}
        timeout-minutes: 45
        run: |
          set +e
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cd "$RUNNER_TEMP/base" || exit 1
          git log -1 --format='base %H %s'
          cd apps/desktop || exit 1
          npm ci --ignore-scripts --no-audit --no-fund || echo "base npm ci failed"
          echo "NEW vs BASE on ubuntu-22.04 node:"
          sort -u "$RUNNER_TEMP/node.redfiles" | while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              awk -F'\t' -v f="$f" '$1==f{print "node " f " " $2 ": NEW (file absent at base)"}' "$RUNNER_TEMP/node.red"
              continue
            fi
            tap="$RUNNER_TEMP/$(basename "$f").base.tap"
            node --test --test-reporter=tap "$f" > "$tap" 2>&1
            brc=$?
            echo "$f at base: rc $brc"
            if ! awk -F'\t' -v f="$f" '$1==f{h=1} END{exit !h}' "$RUNNER_TEMP/node.red"; then
              if [ "$brc" -ne 0 ] || ! grep -qE '^# pass [1-9]' "$tap"; then echo "node $f whole file: BASE (red at base, rc $brc)"; else echo "node $f whole file: NEW (green at base)"; fi
            fi
            awk -F'\t' -v f="$f" '$1==f{print $2}' "$RUNNER_TEMP/node.red" | while IFS= read -r name; do
              if grep -E '^[[:space:]]*not ok' "$tap" | sed -E 's/^[[:space:]]*not ok [0-9]+ - //' | grep -qxF -- "$name"; then
                echo "node $f $name: BASE (red at base)"
              else
                echo "node $f $name: NEW (green or absent at base)"
              fi
            done
          done
          exit 1
