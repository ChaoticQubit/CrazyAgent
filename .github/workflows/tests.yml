name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 2fb31a3e2a32abe1a6f153c589381ae78e42f6b4
  BASE: 34fc7c22a509de9d1669596bd308f134f59feba1

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: V243-NARROWING-DURABLE-REST r1e the REST rows with their neighbours 3x at chore/v243 34fc7c22a and 3x at the merge 2fb31a3e2 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The REST rows with their neighbours 3x at chore/v243 and 3x at the merge, on 4 threads
        timeout-minutes: 200
        run: |
          set +e
          git merge-base --is-ancestor "$BASE" "$TIP" || { echo "BASE is not under TIP"; exit 1; }
          printf '| tree | run | rc | result | red rows |\n| --- | --- | --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for tree in "$BASE" "$TIP"; do
            git checkout -q -f --detach "$tree"
            git diff --quiet "$tree" -- crates apps || { echo "the checkout is not $tree"; exit 1; }
            cargo build -p crazyagent --bin crazyagent --locked > "$RUNNER_TEMP/host-${tree:0:9}.log" 2>&1
            brc=$?
            echo "native auth host build at ${tree:0:9} rc=$brc"
            [ "$brc" -eq 0 ] || { tail -n 40 "$RUNNER_TEMP/host-${tree:0:9}.log"; exit 1; }
            export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$GITHUB_WORKSPACE/target/debug/crazyagent"
            for run in 1 2 3; do
              log="$RUNNER_TEMP/rows-${tree:0:9}-$run.log"
              dbus-run-session -- bash -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec cargo test -p crazyagent --lib --locked --no-fail-fast -- engine::owner::transport::narrowing_rest_tests engine::owner::transport::native_auth_restart_tests engine::owner::transport::barrier_tests engine::owner::transport::secret_storage_wait_tests storage::trash storage::plugins storage::narrowing storage::migrations storage::owner_actor_tests --test-threads=4' > "$log" 2>&1
              rc=$?
              result=$(grep -E '^test result:' "$log" | tail -n 1)
              echo "tree ${tree:0:9} run $run rc=$rc $result"
              grep -E '^error(\[E[0-9]+\])?:' -A6 "$log" | head -n 30 || true
              reds=""
              for row in $(grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/'); do
                panic=$(awk -v h="---- $row stdout ----" '$0==h{p=1;next} p&&(/^---- /||/^failures:$/){p=0} p' "$log" | grep -m1 -A1 'panicked at' | sed -E 's/^thread .* panicked at //' | tr '\n' ' ' | cut -c1-300)
                echo "red tree ${tree:0:9} run $run $row first_panic=${panic:-none}"
                reds="$reds ${row##*::}"
              done
              printf '| %s | %s | %s | %s | %s |\n' "${tree:0:9}" "$run" "$rc" "$result" "${reds:- none}" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          git checkout -q -f --detach "$TIP"
