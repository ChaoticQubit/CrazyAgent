name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: E12 golden 2, the base editor profile at 4a738004f over a fixed root on macos-15
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = ca5cfd5d433f2ce961dfa97ad408a3b21be3ebed ] || { echo "::error::the parent is not the probe commit ca5cfd5d4"; exit 1; }
          [ "$(git rev-parse HEAD^^)" = 4a738004fce842517d0a9a68290975a4245f2c33 ] || { echo "::error::the grandparent is not the base 4a738004f"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the probe commit"; exit 1; }
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux 3.8"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          echo "xcode-select $(xcode-select -p)"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "CARGO_BUILD_JOBS=2"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Build the probe row
        timeout-minutes: 80
        run: |
          set -euo pipefail
          cargo test -p crazyagent --test editor_profile_golden_probe --no-run --locked --message-format json > "$RUNNER_TEMP/build.json"
          bin="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "editor_profile_golden_probe" and .executable != null) | .executable' "$RUNNER_TEMP/build.json" | head -n 1)"
          test -x "$bin"
          echo "PROBE_BIN=$bin" >> "$GITHUB_ENV"
          echo "probe binary $bin"
      - name: The base editor profile over the fixed root and empty tool homes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/golden.txt"
          E12_GOLDEN_OUT="$out" "$PROBE_BIN" --exact the_base_editor_profile_bytes --test-threads 1
          test -s "$out"
          test ! -e /private/tmp/ca-e12-golden
          echo "=== golden begin"
          cat "$out"
          echo "=== golden end"
