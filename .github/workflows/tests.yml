name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: a44e95788fded495c3a9d47c3401b61d5db1c2c8
  ROWS: >-
    project_setup::research_logs::
    project_setup::engine_tests::run_again::
    project_setup::tests::job_table_matches_the_research_runner_queue_columns
    research::runner::tests::attempts::
  ROW_OK: '^test (project_setup::(research_logs|engine_tests::run_again)::[a-z_0-9:]+|project_setup::tests::job_table_matches_the_research_runner_queue_columns|research::runner::tests::attempts::[a-z_0-9]+) \.\.\. ok$'
  SNAPSHOT_ROW: every_scenario_matches_its_2_4_2_capture
  RUST_FILES: >-
    crates/crazyagent/src/project_setup.rs
    crates/crazyagent/src/project_setup/engine_tests/run_again.rs
    crates/crazyagent/src/project_setup/research_logs.rs
    crates/crazyagent/src/project_setup/research_logs/job_log_tests.rs
    crates/crazyagent/src/project_setup/research_logs/tests.rs
    crates/crazyagent/src/project_setup/tests.rs
    crates/crazyagent/src/research/jobs.rs
    crates/crazyagent/src/research/runner.rs
    crates/crazyagent/src/research/runner/tests/attempts.rs
    crates/crazyagent/src/storage.rs

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: RLRN-MERGE rows and snapshot row on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "${#TIP_FULL}" = 40 ] || { echo "::error::TIP_FULL is not a full sha"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the merge tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merge tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Changed rows at the merge tip
        timeout-minutes: 75
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          read -ra filters <<< "$ROWS"
          cargo test -p crazyagent --lib --locked -- --list "${filters[@]}" > "$RUNNER_TEMP/list.log" 2>&1 || { echo "::error::the row list did not build"; tail -n 40 "$RUNNER_TEMP/list.log"; exit 1; }
          listed="$(sed -nE 's/: test$//p' "$RUNNER_TEMP/list.log" | sed 's/^/test /; s/$/ ... ok/' | grep -cE "$ROW_OK")"
          echo "LISTED $listed want 37"
          [ "$listed" = 37 ] || { echo "::error::the filters list $listed rows, not 37"; grep -E ': test$' "$RUNNER_TEMP/list.log"; exit 1; }
          cargo test -p crazyagent --lib --locked -- --test-threads=4 "${filters[@]}" > "$log" 2>&1
          code=$?
          built="$(cat "$RUNNER_TEMP"/helper.log "$RUNNER_TEMP/list.log" "$log" 2>/dev/null | grep -cE '^ +(Checking|Compiling) crazyagent v')"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          ok="$(grep -cE "$ROW_OK" "$log")"
          bad="$(grep -cE '^test .* \.\.\. FAILED$' "$log")"
          echo "BUILT $built ROWS rc $code ok $ok failed $bad want-ok 37"
          [ "$built" -gt 0 ] && [ "$code" = 0 ] && [ "$bad" = 0 ] && [ "$ok" = 37 ] || { echo "::error::changed rows not all green"; tail -n 40 "$log"; exit 1; }
      - name: The storage snapshot row, macOS only, by exact name
        timeout-minutes: 75
        run: |
          set +e
          log="$RUNNER_TEMP/snapshot.log"
          cargo test -p crazyagent --test snapshot_v242 --locked -- --exact "$SNAPSHOT_ROW" > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          passed="$(grep -cE '^test result: ok\. 1 passed; 0 failed' "$log")"
          echo "SNAPSHOT rc $code one-passed $passed"
          [ "$code" = 0 ] && [ "$passed" = 1 ] || { echo "::error::the snapshot row did not pass"; tail -n 60 "$log"; exit 1; }
  linux:
    name: RLRN-MERGE rows and clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "${#TIP_FULL}" = 40 ] || { echo "::error::TIP_FULL is not a full sha"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the merge tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merge tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Changed rows at the merge tip
        timeout-minutes: 75
        run: |
          set +e
          log="$RUNNER_TEMP/rows.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo build -p crazyagent --bin crazyagent-landlock --locked > "$RUNNER_TEMP/helper.log" 2>&1 || { echo "::error::the landlock helper did not build"; tail -n 40 "$RUNNER_TEMP/helper.log"; exit 1; }
          [ -x target/debug/crazyagent-landlock ] || { echo "::error::no target/debug/crazyagent-landlock beside the lib test folder"; exit 1; }
          echo "HELPER target/debug/crazyagent-landlock present"
          read -ra filters <<< "$ROWS"
          cargo test -p crazyagent --lib --locked -- --list "${filters[@]}" > "$RUNNER_TEMP/list.log" 2>&1 || { echo "::error::the row list did not build"; tail -n 40 "$RUNNER_TEMP/list.log"; exit 1; }
          listed="$(sed -nE 's/: test$//p' "$RUNNER_TEMP/list.log" | sed 's/^/test /; s/$/ ... ok/' | grep -cE "$ROW_OK")"
          echo "LISTED $listed want 36"
          [ "$listed" = 36 ] || { echo "::error::the filters list $listed rows, not 36"; grep -E ': test$' "$RUNNER_TEMP/list.log"; exit 1; }
          cargo test -p crazyagent --lib --locked -- --test-threads=4 "${filters[@]}" > "$log" 2>&1
          code=$?
          built="$(cat "$RUNNER_TEMP"/helper.log "$RUNNER_TEMP/list.log" "$log" 2>/dev/null | grep -cE '^ +(Checking|Compiling) crazyagent v')"
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          ok="$(grep -cE "$ROW_OK" "$log")"
          bad="$(grep -cE '^test .* \.\.\. FAILED$' "$log")"
          echo "BUILT $built ROWS rc $code ok $ok failed $bad want-ok 36"
          [ "$built" -gt 0 ] && [ "$code" = 0 ] && [ "$bad" = 0 ] && [ "$ok" = 36 ] || { echo "::error::changed rows not all green"; tail -n 40 "$log"; exit 1; }
      - name: Clippy crazyagent lib and tests, failing on a lint in the touched files
        if: always()
        timeout-minutes: 75
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          echo "linux clippy rc $code touched-file lints $moved"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked, the cache was read as fresh"; exit 1; }
          [ "$code" = 0 ] && [ "$moved" = 0 ] || { echo "::error::clippy is red"; exit 1; }
  windows:
    name: RLRN-MERGE clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "${#TIP_FULL}" = 40 ] || { echo "::error::TIP_FULL is not a full sha"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the merge tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merge tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib and tests, failing on a lint in the touched files
        if: always()
        timeout-minutes: 75
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          echo "windows clippy rc $code touched-file lints $moved"
          [ "$checked" -gt 0 ] || { echo "::error::the crate was not checked, the cache was read as fresh"; exit 1; }
          [ "$code" = 0 ] && [ "$moved" = 0 ] || { echo "::error::clippy is red"; exit 1; }
