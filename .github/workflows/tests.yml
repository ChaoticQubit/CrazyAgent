name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  TIP_FULL: f8444f0d9a599112be5f3be7a1cdfaffe3be6c12
  RED_FULL: 445ecb7f888b80809ef39863a0ec8ddfbbb032e4
  BASE_FULL: 639038633813cf04a4b37aa77b575b271664ea6d
  CHROME_VERSION: "151.0.7922.34"
  SWITCH_TEST: "apps/desktop/test/settings-restore-switch.test.mjs"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: COMPACTION-RACE node ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            chrome: linux64
            chrome_sha256: ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8
          - os: macos-15
            leg: macos
            chrome: mac-arm64
            chrome_sha256: 01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -3 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip (the fix commit)"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not the TICKET-2328 tip 6390386338"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned Chrome for Testing
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          CHROME_PLATFORM: ${{ matrix.chrome }}
          CHROME_SHA256: ${{ matrix.chrome_sha256 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/$CHROME_PLATFORM/chrome-$CHROME_PLATFORM.zip"
          echo "$CHROME_SHA256  $work/chrome.zip" | shasum -a 256 -c -
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "$work/chrome.zip" "$work"
            chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          else
            unzip -q "$work/chrome.zip" -d "$work"
            chrome="$work/chrome-linux64/chrome"
          fi
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: caps and sleeps ratchets at the base and the tip (expect sleeps rc 0 both; no tip caps problem missing at the base, none naming a ticket file)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          ct=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          st=$?
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL" > /dev/null 2>&1
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs) > "$RUNNER_TEMP/caps-base.txt" 2>&1
          cb=$?
          (cd "$RUNNER_TEMP/base" && node scripts/quality/sleeps.mjs) > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          sb=$?
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-tip.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-tip-files.txt" || true
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-base.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-base-files.txt" || true
          git diff --name-only "$BASE_FULL" HEAD^ | sort > "$RUNNER_TEMP/ticket-files.txt"
          new="$(comm -23 <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-tip.txt" | sort) <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-base.txt" | sort) | grep -c . || true)"
          ticket="$(comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" | grep -c . || true)"
          tail -n 1 "$RUNNER_TEMP/caps-tip.txt"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt"
          tail -n 1 "$RUNNER_TEMP/sleeps-tip.txt"
          comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" || true
          echo "caps rc tip $ct base $cb problems tip $(grep -c . "$RUNNER_TEMP/caps-tip-files.txt") base $(grep -c . "$RUNNER_TEMP/caps-base-files.txt") new-at-tip $new on-ticket-files $ticket sleeps rc tip $st base $sb"
          [ "$st" = 0 ] && [ "$sb" = 0 ] && [ "$ticket" = 0 ] && [ "$new" = 0 ] || exit 1
      - name: npm ci, tsc, the switch rows and the Restore 2.4 rows at the tip (expect each rc 0, fail 0, the 3 switch rows ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log" || true
          (cd apps/desktop && npm run --silent typecheck) > "$RUNNER_TEMP/tsc.log" 2>&1
          tc=$?
          grep -E 'error TS' "$RUNNER_TEMP/tsc.log" | head -n 10 || true
          (cd apps/desktop && node --test --test-reporter=tap test/settings-restore-switch.test.mjs) > "$RUNNER_TEMP/sw.log" 2>&1
          sw=$?
          (cd apps/desktop && node --test --test-reporter=tap test/settings-restore.test.mjs) > "$RUNNER_TEMP/sr.log" 2>&1
          sr=$?
          (cd apps/desktop && node --test --test-reporter=tap test/restore-recovery.test.mjs) > "$RUNNER_TEMP/rr.log" 2>&1
          rr=$?
          grep -E '^(not )?ok|^# (pass|fail)' "$RUNNER_TEMP/sw.log" || true
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/sr.log" || true
          grep -E '^not ok|^# (pass|fail)' "$RUNNER_TEMP/rr.log" || true
          f0="$(grep -E '^# fail ' "$RUNNER_TEMP/sw.log" | awk '{print $3}' || true)"
          f1="$(grep -E '^# fail ' "$RUNNER_TEMP/sr.log" | awk '{print $3}' || true)"
          f2="$(grep -E '^# fail ' "$RUNNER_TEMP/rr.log" | awk '{print $3}' || true)"
          oks="$(grep -cE '^ok [0-9]+ - ' "$RUNNER_TEMP/sw.log" || true)"
          echo "tip npm rc $ci tsc rc $tc switch rc $sw fail ${f0:-none} ok $oks settings-restore rc $sr fail ${f1:-none} restore-recovery rc $rr fail ${f2:-none}"
          [ "$ci" = 0 ] && [ "$tc" = 0 ] && [ "$sw" = 0 ] && [ "$sr" = 0 ] && [ "$rr" = 0 ] && [ "$f0" = 0 ] && [ "$f1" = 0 ] && [ "$f2" = 0 ] && [ "$oks" = 3 ] || exit 1
      - name: Red, the base restore.tsx under the tip switch test (expect exactly row 1, the second click, not ok with a second save; rows 2 and 3 ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set +e
          git checkout "$RED_FULL" -- apps/desktop/src/screens/settings/restore.tsx
          git diff --stat HEAD^ -- apps/desktop/src/screens/settings/restore.tsx | tail -n 1
          (cd apps/desktop && node --test --test-reporter=tap test/settings-restore-switch.test.mjs) > "$RUNNER_TEMP/sw-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/screens/settings/restore.tsx
          grep -E '^(not )?ok|^# (pass|fail)' "$RUNNER_TEMP/sw-red.log" || true
          bad="$(grep -cE '^not ok ' "$RUNNER_TEMP/sw-red.log" || true)"
          named="$(grep -cE '^not ok 1 - a second click on the compaction switch before its reload lands sends nothing$' "$RUNNER_TEMP/sw-red.log" || true)"
          said="$(grep -cF 'no second save before the reloaded choice' "$RUNNER_TEMP/sw-red.log" || true)"
          oks="$(grep -cE '^ok [23] - ' "$RUNNER_TEMP/sw-red.log" || true)"
          echo "red rc $red not ok $bad named $named second-save-assert $said rows-2-3-ok $oks"
          [ "$red" != 0 ] && [ "$bad" = 1 ] && [ "$named" = 1 ] && [ "$said" -ge 1 ] && [ "$oks" = 2 ] || exit 1
