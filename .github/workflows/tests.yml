name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  BASE_SHA: 07538ecd57027cb17432bd6758fc31f029fd310c
  TIP_SHA: d3fccbb1c64cf0dd6cbf711b1d686db579a1a03a
  MODULE: "tui::screens::app_setup::tests::"
  F1: tui::screens::app_setup::tests::a_fix_ending_with_a_run_that_left_items_keeps_the_run_failure_under_its_line
  F2: tui::screens::app_setup::tests::in_settings_a_fix_ending_with_a_run_that_installed_everything_keeps_its_line

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux app setup rows, ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [red, mutant, green]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the side; red is the base code with the tip rows, the mutant drops the fix-line gate on Setup finished.
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          file=crates/crazyagent/src/tui/screens/app_setup.rs
          case "$SIDE" in
            red)
              git checkout --detach "$BASE_SHA"
              git checkout "$TIP_SHA" -- crates/crazyagent/src/tui/screens/app_setup/tests.rs
              git status --short
              ;;
            mutant)
              test "$(grep -c 'if said.is_none() {' "$file")" = 1
              sed -i 's/^            if said\.is_none() {$/            if true {/' "$file"
              test "$(grep -c 'if said.is_none() {' "$file")" = 0
              git diff
              ;;
          esac
          git log --oneline -1
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Rows and their expected results
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -uo pipefail
          set +e
          out="$RUNNER_TEMP/setup-$SIDE.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib --no-run 2>&1 | tail -3
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --locked --lib -- "$MODULE" 2>&1 | tee -a "$out"
          result() { grep -E "^test $1 \.\.\. " "$out" | sed -E 's/.* \.\.\. //'; }
          failed=$(grep -cE "^test $MODULE.* \.\.\. FAILED$" "$out")
          passed=$(grep -cE "^test $MODULE.* \.\.\. ok$" "$out")
          f1=$(result "$F1")
          f2=$(result "$F2")
          verdict=pass
          case "$SIDE" in
            red) [ "$f1" = FAILED ] && [ "$f2" = ok ] && [ "$failed" = 1 ] || verdict=fail ;;
            mutant) [ "$f1" = ok ] && [ "$f2" = FAILED ] && [ "$failed" = 1 ] || verdict=fail ;;
            green) [ "$f1" = ok ] && [ "$f2" = ok ] && [ "$failed" = 0 ] || verdict=fail ;;
          esac
          [ "$passed" -gt 10 ] || verdict=fail
          { echo "| side | f1 | f2 | module ok | module failed | verdict |"; echo "| --- | --- | --- | --- | --- | --- |"; echo "| $SIDE | ${f1:-none} | ${f2:-none} | $passed | $failed | $verdict |"; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^test $MODULE.* \.\.\. FAILED$" "$out"
          echo "VERDICT $SIDE f1=${f1:-none} f2=${f2:-none} module_ok=$passed module_failed=$failed verdict=$verdict"
          [ "$verdict" = pass ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-setup-${{ matrix.side }}
          path: ${{ runner.temp }}/setup-${{ matrix.side }}.txt
          if-no-files-found: warn
          retention-days: 14
