name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: e03de1bada1cb69388334461a74fa63fbf948320
  BASE: 00b79614b312b9c0bd2212e5ff98208ccebd974f
  FILES: "crates/kernel/security/src/secret.rs crates/kernel/security/src/store.rs crates/kernel/security/src/store/tests.rs "
  NEW_ROW: store::tests::try_from_refuses_exactly_what_reference_refuses

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: PERF-PARITY-SECURITY kernel-security rows on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          [ "$(git rev-parse HEAD~8)" = "$BASE" ] || { echo "::error::HEAD~8 is not the merge base commit"; exit 1; }
          [ "$(git diff --name-only HEAD~8 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Base row count at the merge commit
        timeout-minutes: 30
        run: |
          set +e
          set -uo pipefail
          git checkout "$BASE" -- crates || exit 1
          git diff --quiet "$BASE" -- crates || { echo "::error::the base tree is not the merge commit"; exit 1; }
          cargo test -p crazyagent-kernel-security --lib --locked --no-run > "$RUNNER_TEMP/base-build.log" 2>&1
          rc=$?
          listed=$(cargo test -p crazyagent-kernel-security --lib --locked -- --list 2>/dev/null | grep -cE ': test$' || true)
          echo "$listed" > "$RUNNER_TEMP/base-listed"
          git checkout HEAD^ -- crates || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "BASE build rc $rc listed $listed"
          [ "$rc" = 0 ] && [ "$listed" -ge 1 ]
      - name: Tip, the guard row by name, then every kernel-security lib row (expect green, listed = base + 1)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          named="$RUNNER_TEMP/tip-named.log"
          cargo test -p crazyagent-kernel-security --lib --locked -- --exact "$NEW_ROW" > "$named" 2>&1
          nrc=$?
          grep -E '^test .*(ok|FAILED)$|panicked at|^test result:' "$named" || true
          npassed=$(grep -E '^test result:' "$named" | awk '{p+=$4} END {print p+0}')
          all="$RUNNER_TEMP/tip-all.log"
          listed=$(cargo test -p crazyagent-kernel-security --lib --locked -- --list 2>"$RUNNER_TEMP/tip-build.log" | grep -cE ': test$' || true)
          cargo test -p crazyagent-kernel-security --lib --locked > "$all" 2>&1
          rc=$?
          grep -E 'FAILED|panicked at|^test result:' "$all" | head -40 || true
          grep -A3 'panicked at' "$all" | cut -c1-400 | head -20 || true
          passed=$(grep -E '^test result:' "$all" | awk '{p+=$4} END {print p+0}')
          failed=$(grep -E '^test result:' "$all" | awk '{f+=$6} END {print f+0}')
          ignored=$(grep -E '^test result:' "$all" | awk '{i+=$8} END {print i+0}')
          base=$(cat "$RUNNER_TEMP/base-listed")
          echo "TIP named rc $nrc passed $npassed; all listed $listed base $base rc $rc passed $passed failed $failed ignored $ignored"
          [ "$nrc" = 0 ] && [ "$npassed" = 1 ] || { echo "::error::the guard row is not green at the tip"; exit 1; }
          [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ $((passed + ignored)) = "$listed" ] || { echo "::error::the security rows are not green"; exit 1; }
          [ "$listed" = $((base + 1)) ] || { echo "::error::the listed count is not base + 1"; exit 1; }
      - name: Tip, the sealed_wipe and read_limited_wipe integration tests (expect each listed >= 1, green)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo test -p crazyagent-kernel-security --locked --test sealed_wipe --test read_limited_wipe --no-run > "$RUNNER_TEMP/itests-build.log" 2>&1
          brc=$?
          ok=1
          for file in sealed_wipe read_limited_wipe; do
            listed=$(cargo test -p crazyagent-kernel-security --locked --test "$file" -- --list 2>/dev/null | grep -cE ': test$' || true)
            echo "ITEST $file listed $listed"
            [ "$listed" -ge 1 ] || ok=0
          done
          log="$RUNNER_TEMP/itests.log"
          cargo test -p crazyagent-kernel-security --locked --test sealed_wipe --test read_limited_wipe > "$log" 2>&1
          rc=$?
          grep -E '^test .*(ok|FAILED)$|panicked at|^test result:|Running ' "$log" | head -60 || true
          grep -A3 'panicked at' "$log" | cut -c1-400 | head -20 || true
          passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
          failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
          echo "ITESTS build rc $brc rc $rc passed $passed failed $failed"
          [ "$ok" = 1 ] || { echo "::error::an integration test file lists no test"; exit 1; }
          [ "$brc" = 0 ] && [ "$rc" = 0 ] && [ "$failed" = 0 ] || { echo "::error::the integration tests are not green"; exit 1; }
      - name: Gate, kernel-security was built (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          for leg in base-build tip-build itests-build; do echo "$leg $(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-security v' "$RUNNER_TEMP/$leg.log" 2>/dev/null || true)"; done
          n=$(cat "$RUNNER_TEMP"/base-build.log "$RUNNER_TEMP"/tip-build.log "$RUNNER_TEMP"/tip-named.log "$RUNNER_TEMP"/tip-all.log "$RUNNER_TEMP"/itests-build.log "$RUNNER_TEMP"/itests.log 2>/dev/null | grep -cE '^ +(Checking|Compiling) crazyagent-kernel-security v' || true)
          echo "GATE Compiling crazyagent-kernel-security $n"
          [ "$n" -ge 1 ]
