name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: dc39be89e08a37c74ee6813c939c6ea2d03bd253
  BASE_FULL: d7af343abc2e932a5a88f6913686f1717e955242

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: B42-WINDOWS-ENV-UNWRAPS tip fmt and clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$BASE_FULL" ] || { echo "::error::HEAD~2 is not the ticket base d7af343abc"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/crazyagent-win-sandbox/src/lib.rs crates/kernel/processes/src/lib.rs crates/crazyagent/src/lib.rs
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: rustfmt of the three crates (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent-win-sandbox -p crazyagent-kernel-processes -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy win-sandbox, kernel-processes and crazyagent --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gates)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-win-sandbox -p crazyagent-kernel-processes -p crazyagent --tests --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-win-sandbox v' "$log" || true)"
          g1="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-processes v' "$log" || true)"
          g2="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy windows-2022 rc $code errors $errors warnings $warnings gates crazyagent-win-sandbox $g0 crazyagent-kernel-processes $g1 crazyagent $g2"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] && [ "$g1" -ge 1 ] && [ "$g2" -ge 1 ] || exit 1
