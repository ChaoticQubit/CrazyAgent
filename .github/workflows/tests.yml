name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: e4eb33fea6a1a02564f01925052d322a38a2f1f9
  RED_FULL: 28bd7971a2d20f3310baa58ce09cda34cc8d3ca6
  BASE_FULL: b4f2e713598d8d6dfb970100200c983e4366976b

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: PRUNE-MADE kernel-storage clippy, the foreign-folder prune row at red and the windows rows at the tip, on windows-latest
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$RED_FULL" ] || { echo "::error::HEAD~2 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$BASE_FULL" ] || { echo "::error::HEAD~3 is not chore/v250 b4f2e71359"; exit 1; }
          [ "$(git diff --name-only "$RED_FULL" HEAD^ | tr '\n' ' ')" = "crates/kernel/storage/src/migrations.rs crates/kernel/storage/src/perf_tests/root_files.rs " ] || { echo "::error::red and tip differ beyond migrations.rs and root_files.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/kernel/storage/src/lib.rs
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: clippy kernel-storage --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, the crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent-kernel-storage --tests -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 40 || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          echo "clippy windows-latest rc $code errors $errors warnings $warnings gate crazyagent-kernel-storage $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: The foreign-folder prune row at the red migrations.rs, then the windows rows at the tip (expect 1 FAILED at red, 3 passed at the tip)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          row=migrations::windows_tests::folders_another_account_owns_are_neither_counted_nor_removed
          rows() {
            local log="$RUNNER_TEMP/rows-$1.log"
            cargo test --locked -p crazyagent-kernel-storage --lib "$2" > "$log" 2>&1
            local code=$?
            grep -E '^test migrations::windows_tests::|^test result|panicked at|^error(\[|:)' "$log" | head -n 40 || true
            failed="$(grep -cE '^test migrations::windows_tests::[a-z_]+ \.\.\. FAILED$' "$log" || true)"
            passed="$(grep -cE '^test migrations::windows_tests::[a-z_]+ \.\.\. ok$' "$log" || true)"
            made="$(grep -cE 'panicked at crates.kernel.storage.src.migrations.rs' "$log" || true)"
            gate="$(grep -cE '^ +Compiling crazyagent-kernel-storage v' "$log" || true)"
            echo "rows at $1 rc $code failed $failed passed $passed panics_in_migrations_rs $made gate $gate"
            eval "$1_code=$code $1_failed=$failed $1_passed=$passed $1_made=$made $1_gate=$gate"
          }
          git checkout "$RED_FULL" -- crates/kernel/storage/src/migrations.rs
          [ "$(git diff --name-only "$RED_FULL" -- crates/kernel/storage/src/migrations.rs | wc -l)" = 0 ] || { echo "::error::migrations.rs is not the red commit's"; exit 1; }
          touch crates/kernel/storage/src/migrations.rs
          rows red "$row"
          git checkout HEAD^ -- crates/kernel/storage/src/migrations.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip after the red"; exit 1; }
          touch crates/kernel/storage/src/migrations.rs
          rows tip migrations::windows_tests::
          [ "$red_code" != 0 ] && [ "$red_failed" = 1 ] && [ "$red_passed" = 0 ] && [ "$red_made" = 1 ] && [ "$red_gate" -ge 1 ] || { echo "::error::the row did not fail as expected at red"; exit 1; }
          [ "$tip_code" = 0 ] && [ "$tip_failed" = 0 ] && [ "$tip_passed" = 3 ] && [ "$tip_gate" -ge 1 ] || exit 1
