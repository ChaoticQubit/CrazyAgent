name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: e41aab1be9b76512e9d0f134997ae894b15190f3
  RED2: 8ecb292a107ef2ae8501e4567e027d2443f02fe8
  FIX: 97b0ff3f2e7d93efe3e24c38b528c5a65cfd29ac
  BASE: 7537cda1ed6572d6574bb754cc0be2db00212bf2

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows hidden boundary rows ${{ matrix.runner }} (tip e41aab1be, base 7537cda1e)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the farm script outside the checkout, whose crates and apps are the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP" -- crates apps
          cp .github/farm/v244-win-hidden-boundary-4-rows.sh "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Scratch red, base code with every later row, failing past the first project write
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" scratch-red "$TIP" "$RED2" "$FIX" "$BASE"
      - name: Build at the tip
        if: always()
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" build "$TIP"
      - name: Green at the tip, the probe on its own, and every lib row naming hidden
        if: always()
        run: bash "$RUNNER_TEMP/rows.sh" tip "$TIP"
      - name: Any row naming hidden red at the tip, again at the base
        if: always()
        timeout-minutes: 100
        run: bash "$RUNNER_TEMP/rows.sh" base "$BASE"

  windows-clippy:
    name: Windows hidden boundary clippy windows-2022 (tip e41aab1be)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The crates are the tip
        run: git diff --quiet "$TIP" -- crates apps
      - name: Install SQLite for Windows
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy, one target set per call
        timeout-minutes: 90
        run: |
          set -uo pipefail
          failed=0
          printf '| Windows clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          echo "FARM failed=$failed"
          exit "$failed"
