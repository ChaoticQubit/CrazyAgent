name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TIP_FULL: b4f2e713598d8d6dfb970100200c983e4366976b

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: SNAPSHOT-RED-2 git versions on macos-15
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Name every git a landing row could meet
        run: |
          set -uo pipefail
          [ "${#TIP_FULL}" = 40 ] || { echo "::error::TIP_FULL is not a full sha"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not chore $TIP_FULL"; exit 1; }
          engine="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"; echo "ENGINE-XCRUN-FIND rc $? $engine"
          echo "ENGINE-XCRUN-GIT $(env -i PATH=/usr/bin:/bin "$engine" version)"
          found="$(xcrun --find git)"; echo "XCRUN-FIND rc $? $found"
          echo "XCRUN-GIT $("$found" version)"
          echo "USR-BIN-GIT $(/usr/bin/git version)"
          echo "PATH-GIT $(command -v git) $(git version)"
          echo "XCODE $(xcode-select -p) $(xcodebuild -version | tr '\n' ' ')"
