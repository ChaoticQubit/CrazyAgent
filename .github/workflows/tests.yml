name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: f0bf0944f
  TIP_SHA: 47644481c

defaults:
  run:
    shell: bash

jobs:
  w3-4a:
    name: V244 W3-4c CR-1706 move containment on ${{ matrix.runner }}, red at f0bf0944f, tip 47644481c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on the crazyagent library
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: CR-1706 red row at f0bf0944f
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$RED_SHA" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --exact projects_home::move_project::spelling_windows_tests::a_reserved_lease_on_a_nested_repository_blocks_a_windows_move 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git checkout -q "$TIP_SHA" -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test .*_windows_tests|^test result|panicked|left:|right:|lease on' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 1 failed' "$RUNNER_TEMP/red.log"
          grep -q 'a_reserved_lease_on_a_nested_repository_blocks_a_windows_move \.\.\. FAILED' "$RUNNER_TEMP/red.log"
          echo "red as expected: under() parts a nested Windows path only at '/' at f0bf0944f"
      - name: W3-4c, W3-4a, W3-2 and W3-1 rows plus the CR-1706 row at the tip 47644481c
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::owner::transport::key_windows_tests:: engine::owner::transport::root_windows_tests:: engine::bootstrap::anchor_windows_tests:: storage::projects_home::engine_root_windows_tests:: projects_home::compare_windows_tests:: worktrees::canonical_windows_tests:: projects_home::move_project::spelling_windows_tests:: research::accounts::plain_folder_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*_windows_tests|^test result|panicked' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 45 passed; 0 failed' "$RUNNER_TEMP/tip.log"
