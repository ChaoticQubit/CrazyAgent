name: Tests

on:
  push:
    branches:
      - "test-farm/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  recheck:
    name: MCP npx, spawn gate and unsigned release rows on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Unsigned release rows
        run: |
          set -euo pipefail
          node --test --test-timeout=15000 scripts/release/assets.test.mjs scripts/release/manifest.test.mjs scripts/release/runners.test.mjs scripts/release/signing.test.mjs scripts/release/sign-windows.test.mjs scripts/release/workflows.test.mjs
      - name: MCP npx, plugin, batch, spawn gate and update rows
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked -- plugins tools:: launch_context::batch_files spawn_gate update:: --test-threads=4
