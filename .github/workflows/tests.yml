name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  BUN_DARWIN_ARM64_SHA256: 80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403
  NODE_DARWIN_ARM64_SHA256: 1901d539912c02afa10d1cc126943a8855a7eedebe830119463470db5e6c59e8
  RUSTC_DARWIN_ARM64_SHA256: 738e3f60114b20550fcf4f8a57c9cea0544239f214709f45594ff3fde327f577
  CARGO_DARWIN_ARM64_SHA256: de51d4fade4f31ad8ec405261cc96bedc000d905f98980027610d6e288dbe21b
  RUST_STD_DARWIN_ARM64_SHA256: 2de831ef563ce772519a4d18ba2659f0f7428d497ef66dad24b5a35e8f8cd177
  CLIPPY_DARWIN_ARM64_SHA256: 1ad080040ff0f4f8af0751bd7fa1fb1901212f8d164cecaa3c47b0654e0916f2
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ENGINE_TESTS_EXCLUDE: >-
    e2e_tui research_engine team_engine onboarding research_runner research_service tui_v1_e2e codex_app_server_live launch_context_live codex_bridge_live agents_live
    qualification_boundary worker_engine_boundary accounts_binary e2e_add_existing setup_network harness_catalog_bundled_rcli acceptance_v2_rcli_usage
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
  DESKTOP_TESTS_EXCLUDE: picker_windows accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: POD-C C2 on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Kernel processes and common rows, bundled tmux flag unset
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          env -u CRAZYAGENT_BUNDLES_TMUX cargo test -p crazyagent-kernel-processes -p crazyagent-kernel-common --locked 2>&1 | tee "$RUNNER_TEMP/kernel.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel rows on ubuntu-22.04, flag unset:"
          grep -E "^test result|FAILED|could not compile|panicked|bundled_tmux_flag|release_yml_sets" "$RUNNER_TEMP/kernel.log" || true
          [ "$code" -eq 0 ]
      - name: Kernel processes rows, bundled tmux flag set
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          CRAZYAGENT_BUNDLES_TMUX=1 cargo test -p crazyagent-kernel-processes --locked 2>&1 | tee "$RUNNER_TEMP/kernel-set.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel rows on ubuntu-22.04, flag set:"
          grep -E "^test result|FAILED|could not compile|panicked|bundled_tmux_flag|release_yml_sets" "$RUNNER_TEMP/kernel-set.log" || true
          [ "$code" -eq 0 ]
      - name: Engine clippy for the lib
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo clippy -p crazyagent --lib --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy-lib.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "engine clippy --lib rc $code"
          grep -E "^(warning|error)" "$RUNNER_TEMP/clippy-lib.log" || true
          [ "$code" -eq 0 ]
      - name: Engine clippy for the tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo clippy -p crazyagent --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy-tests.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "engine clippy --tests rc $code"
          grep -E "^(warning|error)" "$RUNNER_TEMP/clippy-tests.log" || true
          [ "$code" -eq 0 ]
      - name: Desktop clippy
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          mkdir -p apps/desktop/dist
          printf '<!doctype html><title>farm</title>\n' > apps/desktop/dist/index.html
          cargo clippy -p crazyagent-desktop --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/desktop.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "desktop clippy --all-targets rc $code"
          grep -E "^(warning|error)" "$RUNNER_TEMP/desktop.log" || true
          [ "$code" -eq 0 ]
      - name: Engine lib rows program finding touches
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- tools:: harnesses::probe_tests harnesses::finding harnesses::update harnesses::interactive paths:: setup:: terminal::tmux instruction_files:: 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "engine lib rows on ubuntu-22.04:"
          grep -E "^test result|FAILED|could not compile|panicked" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
      - name: harness_update rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --test harness_update --locked 2>&1 | tee "$RUNNER_TEMP/harness_update.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "harness_update on ubuntu-22.04:"
          grep -E "^test result|FAILED|could not compile|panicked" "$RUNNER_TEMP/harness_update.log" || true
          [ "$code" -eq 0 ]
  macos:
    name: POD-C C2 tools rows on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    env:
      TMUX_VERSION: "3.8"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          echo "engine git $git: $("$git" --version)"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Build the engine lib rows
        timeout-minutes: 90
        run: |
          set +e
          start=$(date +%s)
          cargo test -p crazyagent --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "engine lib test build on macos-15 rc $code in $(( $(date +%s) - start ))s"
          grep -E "^error|could not compile" "$RUNNER_TEMP/build.log" || true
          [ "$code" -eq 0 ]
      - name: Engine tools rows
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent --lib --locked tools:: 2>&1 | tee "$RUNNER_TEMP/tools.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "engine tools rows on macos-15:"
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tools.log" || true
          [ "$code" -eq 0 ]
  windows:
    name: POD-C C2 on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show the commit under test
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Kernel processes Windows rows
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: |
          set +e
          cargo test -p crazyagent-kernel-processes -p crazyagent-kernel-common --locked 2>&1 | tee "$RUNNER_TEMP/kernel.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel rows on ${{ matrix.runner }}:"
          grep -E "^test |^test result|could not compile|panicked" "$RUNNER_TEMP/kernel.log" || true
          [ "$code" -eq 0 ]
      - name: Kernel processes clippy for the lib and tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          cargo clippy -p crazyagent-kernel-processes --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/kclippy.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "kernel processes clippy --lib --tests rc $code on ${{ matrix.runner }}"
          grep -E "^(warning|error)" "$RUNNER_TEMP/kclippy.log" || true
          [ "$code" -eq 0 ]
      - name: Engine clippy for the lib and tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "engine clippy --lib --tests rc $code on ${{ matrix.runner }}"
          grep -E "^(warning|error)" "$RUNNER_TEMP/clippy.log" || true
          [ "$code" -eq 0 ]
      - name: Build the Windows boundary helper
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: Engine program finding and terminal rows
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- tools:: terminal::windows paths:: plugins:: storage::windows_tests storage::accounts::account_key_windows_tests 2>&1 | tee "$RUNNER_TEMP/rows.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "engine rows on ${{ matrix.runner }}:"
          grep -E "^test result|FAILED|could not compile|panicked|^test storage::" "$RUNNER_TEMP/rows.log" || true
          [ "$code" -eq 0 ]
