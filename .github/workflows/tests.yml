name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: GRANT-ROOT-SWAP fix rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -3 --format='%H %s'
          [ "$(git rev-parse HEAD^^)" = 4e8464f200a6bb987b2b9be8a0632a9ec27f25aa ] || { echo "::error::the grandparent is not the GRANT-ROOT-SWAP fix tip 4e8464f200"; exit 1; }
          [ "$(git rev-parse HEAD^)" = 261372cedb3d90de24ae26dc6c327efe9bc13dce ] || { echo "::error::the parent is not the probe-only sdk_editor pick"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the tip plus the pick"; exit 1; }
          [ "$(git diff --name-only HEAD^^ HEAD^)" = crates/crazyagent/src/sdk_editor/tests.rs ] || { echo "::error::the pick touches more than sdk_editor tests"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Kernel, Landlock and bubblewrap on this runner
        run: |
          set +e
          uname -r
          cat /sys/kernel/security/lsm || true
          bwrap --version
          echo "bwrap --help lines naming bind-fd: $(bwrap --help 2>&1 | grep -c -- '-bind-fd')"
          bwrap --dev-bind / / --unshare-user true && echo "user namespaces: yes" || echo "user namespaces: no"
          true
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy kernel-sandbox lib and tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          grep -E -A6 '^(error|warning)' "$RUNNER_TEMP/clippy.log" | head -80 || true
          echo "Clippy kernel-sandbox lib and tests rc $code"
          [ "$code" = 0 ] || exit 1
      - name: Clippy crazyagent lib
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          grep -E -A6 '^(error|warning)' "$RUNNER_TEMP/clippy.log" | head -80 || true
          echo "Clippy crazyagent lib rc $code"
          [ "$code" = 0 ] || exit 1
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          cargo clippy -p crazyagent --tests --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          grep -E -A6 '^(error|warning)' "$RUNNER_TEMP/clippy.log" | head -80 || true
          echo "Clippy crazyagent tests rc $code"
          [ "$code" = 0 ] || exit 1
      - name: Build the Landlock helper
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: cargo build -p crazyagent --bin crazyagent-landlock --locked
      - name: root_swap rows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/root-swap.log"
          cargo test -p crazyagent --test linux_sandbox --locked root_swap -- --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --test linux_sandbox --locked root_swap > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          tail -n 20 "$log"
          passed="$(grep -oE 'test result: [a-zA-Z]+\. [0-9]+ passed' "$log" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | awk '{s += $1} END {print s + 0}')"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "root-swap rc $code listed $listed passed ${passed:-0} failed $failed (expect listed 2)"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "${passed:-0}" = "$listed" ] && [ "$failed" = 0 ] || exit 1
      - name: objects_link rows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/objects-link.log"
          cargo test -p crazyagent --lib --locked landing::tests::own_clone_tip::objects_link -- --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --lib --locked landing::tests::own_clone_tip::objects_link > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          tail -n 20 "$log"
          passed="$(grep -oE 'test result: [a-zA-Z]+\. [0-9]+ passed' "$log" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | awk '{s += $1} END {print s + 0}')"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "objects-link rc $code listed $listed passed ${passed:-0} failed $failed (expect listed 2)"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "${passed:-0}" = "$listed" ] && [ "$failed" = 0 ] || exit 1
      - name: every linux_sandbox row (all launch through the helper's enforce)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/linux-sandbox.log"
          cargo test -p crazyagent --test linux_sandbox --locked -- --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --test linux_sandbox --locked > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          tail -n 20 "$log"
          passed="$(grep -oE 'test result: [a-zA-Z]+\. [0-9]+ passed' "$log" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | awk '{s += $1} END {print s + 0}')"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "linux-sandbox rc $code listed $listed passed ${passed:-0} failed $failed"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "${passed:-0}" = "$listed" ] && [ "$failed" = 0 ] || exit 1
      - name: landing confined-step rows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/landing-confined.log"
          cargo test -p crazyagent --lib --locked landing::tests::a_confined_git_step -- --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent --lib --locked landing::tests::a_confined_git_step > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          tail -n 20 "$log"
          passed="$(grep -oE 'test result: [a-zA-Z]+\. [0-9]+ passed' "$log" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | awk '{s += $1} END {print s + 0}')"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "landing-confined rc $code listed $listed passed ${passed:-0} failed $failed"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "${passed:-0}" = "$listed" ] && [ "$failed" = 0 ] || exit 1
      - name: kernel-sandbox helper rows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/helper-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked linux::helper -- --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent-kernel-sandbox --lib --locked linux::helper > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          tail -n 20 "$log"
          passed="$(grep -oE 'test result: [a-zA-Z]+\. [0-9]+ passed' "$log" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | awk '{s += $1} END {print s + 0}')"
          failed="$(grep -cE '^test .* FAILED$' "$log" || true)"
          echo "helper-rows rc $code listed $listed passed ${passed:-0} failed $failed"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "${passed:-0}" = "$listed" ] && [ "$failed" = 0 ] || exit 1
