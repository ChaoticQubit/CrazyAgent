name: Tests

on:
  push:
    branches:
      - "test-farm/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  noai-rows:
    name: No-AI parent rows on windows-2022
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Show the runner temp folder list
        run: icacls "$(cygpath -w "$RUNNER_TEMP")" || true
      - name: Run the no-AI rows, the probe and the reset control
        run: |
          set -euo pipefail
          cargo test -p crazyagent-win-sandbox --test boundary --locked -- releasing_under_a_parent_without_auto_inheritance probe_a_parent_grant releasing_restores_every_guarded_path_the_owner_left_alone --nocapture --test-threads=1
