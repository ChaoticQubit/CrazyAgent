name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 0501985ce032d21c3fc6d4466e43fe42d40c020d
  RED_FULL: d519fe9301608a240f7cf1363d81ddfef5bdfc50
  BASE_FULL: ec22db84c2445d37322e1515f2ff372454ef1275

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: CUSTODY fmt, clippy, the engine.db descriptor reds at red and at fix, and an fd count over the crazyagent lib run, on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 9
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --first-parent --format='%H %s' -12 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~6)" = "$RED_FULL" ] || { echo "::error::HEAD~6 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~7)" = "$BASE_FULL" ] || { echo "::error::HEAD~7 is not chore ec22db84c2"; exit 1; }
          [ "$(git diff --name-only "$RED_FULL" HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/engine/bootstrap/native_profiles.rs crates/crazyagent/src/engine/bootstrap/native_profiles/engine_fd_tests.rs " ] || { echo "::error::red and tip differ beyond native_profiles.rs and its fd rows"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the files that differ from the base newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
          touch crates/crazyagent/src/lib.rs
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt of crazyagent (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy --locked -p crazyagent --tests --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy ubuntu-22.04 rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: The engine.db descriptor reds at the red commit's native_profiles.rs with the tip's rows (expect 3 FAILED by name, each message once, left 5 three times, the CLOEXEC row ok) and at the fix (expect 4 passed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          rows=engine::bootstrap::native_profiles::engine_fd_tests::a_
          names="a_dropped_custody_leaves_an_idle_wal_engine_db_held a_dropped_retained_custody_leaves_an_idle_wal_engine_db_held a_refused_capture_leaves_an_idle_wal_engine_db_held"
          run() {
            local log="$RUNNER_TEMP/rows-$1.log"
            cargo test --locked -p crazyagent --lib "$rows" > "$log" 2>&1
            local code=$?
            grep -E '^test engine::|^test result|panicked at|^  left|^ right|another process took' "$log" | head -n 40 || true
            local failed passed gate left5
            failed="$(grep -cE "^test ${rows}[a-z_]+ \.\.\. FAILED" "$log" || true)"
            passed="$(grep -cE "^test ${rows}[a-z_]+ \.\.\. ok" "$log" || true)"
            gate="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
            left5="$(grep -cE '^  left: 5$' "$log" || true)"
            echo "rows at $1 rc $code failed $failed passed $passed left_5 $left5 gate crazyagent $gate"
            eval "$1_failed=$failed $1_passed=$passed $1_gate=$gate $1_left5=$left5 $1_log=$log"
          }
          files=(crates/crazyagent/src/engine/bootstrap/native_profiles.rs)
          git checkout "$RED_FULL" -- "${files[@]}"
          git diff --quiet "$RED_FULL" -- "${files[@]}" || { echo "::error::native_profiles.rs is not the red one"; exit 1; }
          run red
          ok=1
          for name in $names; do
            n="$(grep -cE "^test ${rows%a_}${name} \.\.\. FAILED" "$red_log" || true)"
            echo "red $name failed $n"
            [ "$n" = 1 ] || ok=0
          done
          for message in "after a custody was dropped" "after a retained custody was dropped" "after a refused capture"; do
            m="$(grep -c "another process took engine.db $message" "$red_log" || true)"
            echo "red message '$message' $m"
            [ "$m" = 1 ] || ok=0
          done
          git checkout HEAD^ -- "${files[@]}"
          git diff --quiet HEAD^ || { echo "::error::the tree is not the tip again"; exit 1; }
          run fix
          [ "$ok" = 1 ] && [ "$red_failed" = 3 ] && [ "$red_passed" = 1 ] && [ "$(grep -cE "^test ${rows}held_engine_db_is_closed_on_exec \\.\\.\\. ok" "$red_log" || true)" = 1 ] && [ "$red_left5" = 3 ] && [ "$red_gate" -ge 1 ] && [ "$fix_passed" = 4 ] && [ "$fix_failed" = 0 ] && [ "$fix_gate" -ge 1 ] || exit 1
      - name: Count open fds over the whole crazyagent lib run at the fix (report only; the run's own reds are listed, not gated)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 150
        run: |
          set +e
          log="$RUNNER_TEMP/lib.log"
          samples="$RUNNER_TEMP/fd-samples.txt"
          : > "$samples"
          cargo test --locked -p crazyagent --lib --no-run > "$RUNNER_TEMP/build.log" 2>&1
          echo "build rc $?"
          cargo test --locked -p crazyagent --lib > "$log" 2>&1 &
          runner=$!
          while kill -0 "$runner" 2>/dev/null; do
            for pid in $(pgrep -f 'target/debug/deps/crazyagent-' || true); do
              fds=0
              dbs=0
              for fd in "/proc/$pid/fd/"*; do
                target="$(readlink "$fd" 2>/dev/null)" || continue
                fds=$((fds + 1))
                case "$target" in */engine.db) dbs=$((dbs + 1)) ;; esac
              done
              echo "$pid $fds $dbs" >> "$samples"
            done
            sleep 1
          done
          wait "$runner"
          code=$?
          grep -E '^test result|^failures:$' "$log" | head -n 5 || true
          grep -E '^test .* \.\.\. FAILED$' "$log" | head -n 40 || true
          echo "lib rc $code limit $(ulimit -n) samples $(wc -l < "$samples")"
          awk '{ if ($2 > f) f = $2; if ($3 > d) d = $3 } END { print "max open fds " f + 0 " max engine.db fds " d + 0 }' "$samples"
          [ -s "$samples" ] || exit 1
