name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: b32191a9e
  TIP_SHA: 69b18b499

defaults:
  run:
    shell: bash

jobs:
  w3-4a:
    name: V244 W3-4a bootstrap twins on ${{ matrix.runner }}, red at b32191a9e, tip 69b18b499
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on crazyagent-win-sandbox
        timeout-minutes: 40
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy on the crazyagent library
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: W1 private rows in crazyagent-win-sandbox (fix10 delete rows and the deletable secret file row)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent-win-sandbox --locked --test private_windows -- --test-threads 1 --show-output 2>&1 | tee "$RUNNER_TEMP/w1.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test |^test result|a low-il' "$RUNNER_TEMP/w1.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/w1.log"
          grep -q 'a_deletable_secret_file_is_read_while_held_and_deleted_through_its_own_handle \.\.\. ok' "$RUNNER_TEMP/w1.log"
      - name: W3-4a red rows at b32191a9e
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git checkout -q "$RED_SHA" -- crates
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 root_windows_tests:: anchor_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git checkout -q "$TIP_SHA" -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test .*_windows_tests|^test result|panicked|left:|right:|Err. value' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 9 passed; 14 failed' "$RUNNER_TEMP/red.log"
          grep -q 'a_root_spelled_as_canonicalize_spells_it_opens_and_a_junction_still_fails \.\.\. FAILED' "$RUNNER_TEMP/red.log"
          grep -q 'a_short_name_root_and_a_verbatim_unc_root_are_refused \.\.\. FAILED' "$RUNNER_TEMP/red.log"
          echo "red as expected: the 12 anchor rows and the two W3-1 spelling rows fail at b32191a9e"
      - name: W3-4a, W3-2 and W3-1 rows at the tip 69b18b499
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 key_windows_tests:: root_windows_tests:: anchor_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*_windows_tests|^test result|panicked' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 30 passed; 0 failed' "$RUNNER_TEMP/tip.log"
