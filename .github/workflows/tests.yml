name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PACKAGE: crazyagent-kernel-sandbox
  ROW: egress::tests::a_refused_lookup_never_raises_the_count_past_the_cap
  PINS_SH: |
    set -euo pipefail
    git log -1 --format='farm %H %s'
    [ "$(git rev-parse HEAD^)" = ecd1b8b35271abc1060fc7b0b0a9dfb5f07683c3 ] || { echo "::error::the parent is not the row fix"; exit 1; }
    [ "$(git rev-parse HEAD~2)" = af1b6b99ae9939e8fa514e6fe5e14cacbf17b3c1 ] || { echo "::error::HEAD~2 is not the base"; exit 1; }
    [ "$(git diff --name-only HEAD~2 HEAD^ | tr '\n' ' ')" = "crates/kernel/sandbox/src/egress/tests.rs " ] || { echo "::error::the range touches more than egress/tests.rs"; exit 1; }
    git checkout HEAD^ -- .github/workflows/tests.yml
    git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
  GATE_SH: |
    set -uo pipefail
    name=$1
    log=$2
    n=$(grep -cE "^ +(Checking|Compiling) $PACKAGE v" "$log" || true)
    echo "crate gate $name $n"
    [ "$n" -ge 1 ] || { echo "::error::$name did not build $PACKAGE"; exit 1; }
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p "$PACKAGE" --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p "$PACKAGE" --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -60 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: RV-B22-CR12-R3-CR1 cap row 20 times, egress tests and clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Check the pins and restore the branch tip's tests.yml
        run: |
          printf '%s\n' "$PINS_SH" > "$RUNNER_TEMP/pins.sh"
          bash "$RUNNER_TEMP/pins.sh"
      - name: Write the row runner and the crate gate
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          printf '%s\n' "$GATE_SH" > "$RUNNER_TEMP/gate.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/gate.sh"
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Build the sandbox lib tests at the tip
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo test -p "$PACKAGE" --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build-tip.log"
          bash "$RUNNER_TEMP/gate.sh" tip-build "$RUNNER_TEMP/build-tip.log"
      - name: Tip, the cap row 20 times
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          fail=0
          for run in $(seq 1 20); do
            bash "$RUNNER_TEMP/rows.sh" "cap-row-$run" pass --exact "$ROW" || fail=$((fail + 1))
          done
          echo "cap row failed runs $fail of 20"
          [ "$fail" = 0 ]
      - name: Tip, egress tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" egress-tests pass egress::tests::
      - name: Clippy on the sandbox lib and its tests at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy -p "$PACKAGE" --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          bash "$RUNNER_TEMP/gate.sh" clippy "$RUNNER_TEMP/clippy.log"
          echo "clippy errors $(grep -cE '^error(\[|:)' "$RUNNER_TEMP/clippy.log" || true) warnings $(grep -cE '^warning(\[|:)' "$RUNNER_TEMP/clippy.log" || true)"

