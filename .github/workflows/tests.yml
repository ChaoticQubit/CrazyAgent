name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 5cc35d1b0143677d480ac25ad6efe83d6c3a57ae
  FIX_FULL: 41482e1c8f51f0bc885ad47aa2a24cbb3b0fcc7f
  RED_FULL: 9fe9fd82c8b2237017754d513bfee6a18e3aa2ed
  BASE_FULL: af1b6b99ae9939e8fa514e6fe5e14cacbf17b3c1
  TICKET_FILES: crates/crazyagent/src/app_plugins.rs crates/crazyagent/src/app_plugins/host_tests.rs crates/crazyagent/src/storage/migrations.rs crates/kernel/storage/src/restore/recovery.rs
  RED_CODE_FILES: crates/crazyagent/src/app_plugins.rs crates/crazyagent/src/storage/migrations.rs crates/kernel/storage/src/restore/recovery.rs
  RED_ROWS: app_plugins::host_tests::a_key_a_kept_replaced_copy_names_survives_the_start_sweep app_plugins::host_tests::an_unreadable_replaced_copy_keeps_every_plugin_key

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: RV-B06ADD-L1 key sweep ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: fmt-clippy-rows-red
            cache: linux
          - os: macos-15
            leg: rows
            cache: macOS
          - os: windows-2022
            leg: clippy
            cache: Windows
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='tip %H %s' HEAD^
          git log -1 --format='fix %H %s' HEAD~2
          git log -1 --format='red %H %s' HEAD~3
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$FIX_FULL" ] || { echo "::error::HEAD~2 is not the fix commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED_FULL" ] || { echo "::error::HEAD~3 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE_FULL" ] || { echo "::error::HEAD~4 is not the b24 base"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/app_plugins/host_tests.rs " ] || { echo "::error::the last ticket commit is not test-only"; exit 1; }
          changed="$(git diff --name-only HEAD~4 HEAD^ | sort | tr '\n' ' ')"
          read -ra files <<< "$TICKET_FILES"
          wanted="$(printf '%s\n' "${files[@]}" | sort | tr '\n' ' ')"
          [ "$changed" = "$wanted" ] || { echo "::error::the ticket range is not the four ticket files: $changed"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's files newer than the restored cache, so cargo rebuilds their crates
        run: |
          set -euo pipefail
          read -ra files <<< "$TICKET_FILES"
          sleep 2
          touch "${files[@]}"
          ls -l "${files[@]}"
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: rustfmt check of the four ticket files (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          read -ra files <<< "$TICKET_FILES"
          rustfmt --edition 2024 --check "${files[@]}"
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent and kernel storage --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg != 'rows' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent -p crazyagent-kernel-storage --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          grep -E '^ +(Checking|Compiling) crazyagent(-kernel-storage)? v' "$log" || true
          app_checking="$(grep -cE '^ +Checking crazyagent v' "$log" || true)"
          app_compiling="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          app="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          storage="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-storage v' "$log" || true)"
          echo "clippy rc $code errors $errors warnings $warnings crazyagent checking $app_checking compiling $app_compiling checked $app kernel-storage checked $storage"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$app" -ge 1 ] && [ "$storage" -ge 1 ] || exit 1
      - name: app_plugins::host_tests rows at tip (expect listed 8, passed 8)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.leg != 'clippy' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/host-rows.log"
          cargo test -p crazyagent --lib --locked -- app_plugins::host_tests:: --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          checking="$(grep -cE '^ +Checking crazyagent v' "$log.list" || true)"
          compiling="$(grep -cE '^ +Compiling crazyagent v' "$log.list" || true)"
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log.list" || true)"
          echo "host rows listed $listed, crazyagent checking $checking compiling $compiling built $built"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- app_plugins::host_tests:: > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked|left:|right:|assertion' "$log" | head -n 60 || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "host rows rc $code listed $listed passed $passed failed $failed built $built"
          [ "$code" = 0 ] && [ "$listed" = 8 ] && [ "$passed" = 8 ] && [ "$failed" = 0 ] && [ "$built" -ge 1 ] || exit 1
      - name: The two new rows from the tip over the red commit's code, base sweep plus the cap const (expect failed 2 at their keep asserts)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 120
        run: |
          set +e
          read -ra files <<< "$TICKET_FILES"
          read -ra code_files <<< "$RED_CODE_FILES"
          read -ra rows <<< "$RED_ROWS"
          git checkout "$RED_FULL" -- "${code_files[@]}"
          git diff --stat HEAD^
          sleep 2
          touch "${files[@]}"
          log="$RUNNER_TEMP/red.log"
          cargo test -p crazyagent --lib --locked -- --exact "${rows[@]}" > "$log" 2>&1
          code=$?
          grep -E '^test .*(FAILED|ok)$|test result:|panicked at|left:|right:|assertion' "$log" | head -n 40 || true
          built="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          kept="$(grep -cE "panicked at crates/crazyagent/src/app_plugins/host_tests.rs:[0-9]+:[0-9]+:$" "$log" || true)"
          echo "red rc $code passed $passed failed $failed panics-in-host_tests $kept built $built"
          git checkout HEAD^ -- "${files[@]}"
          [ "$code" = 101 ] && [ "$failed" = 2 ] && [ "$passed" = 0 ] && [ "$kept" = 2 ] && [ "$built" -ge 1 ] || exit 1
