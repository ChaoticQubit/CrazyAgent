        [ "$code" -eq 0 ]
    - name: lib protocol rows
      if: "${{ !cancelled() }}"
      timeout-minutes: 75
      run: |
        set +e
        cargo test -p crazyagent --lib --locked protocol:: 2>&1 | tee "$RUNNER_TEMP/rows.log"
        code=${PIPESTATUS[0]}
        set -e
        echo "lib protocol rows on ubuntu-22.04: rc $code"
        grep -E "^running |^test |^test result|could not compile|panicked|^error|UNAVAILABLE|keyring|secret-tool|secrets|StoreError" "$RUNNER_TEMP/rows.log" || true
        [ "$code" -eq 0 ]
    - name: lib credentials rows
