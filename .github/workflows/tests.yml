name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: cecd6fe956ae0eafcb9ef2baa7762bae1ed7ecd8
  RED_FULL: d5624438cab9f783337e4caf4131c8d603c969ad
  BASE_FULL: bac124898c07d7ca23332bff768f5d8f95e37998
  K: crazyagent-kernel-sandbox
  PATHS: "paths::tests::"
  SETUP: "project_setup::engine_tests::"
  BOUNDED: "harnesses::launch::bounded_windows_tests::"
  UNIX_HARNESS: "harnesses::launch::"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: RECHECK-ROOTS install re-walk tip 1 on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 18
      - name: Restore the ticket tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE_FULL" ] || { echo "::error::HEAD~4 is not the ticket base"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED_FULL" ] || { echo "::error::HEAD~3 is not the red commit"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - name: kernel_sandbox clippy --lib with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy-lib.log"
          cargo clippy -p "$K" --lib --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy-lib windows-2022 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: kernel_sandbox clippy --lib --tests with warnings denied (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/kernel-clippy-lib-tests.log"
          cargo clippy -p "$K" --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent-kernel-sandbox v' "$log" || true)"
          echo "kernel-clippy-lib-tests windows-2022 rc $code errors $errors warnings $warnings gate crazyagent-kernel-sandbox $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: kernel paths rows == list (17)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          rows() {
            local pkg="$1" filter="$2" label="$3" want="$4" log="$RUNNER_TEMP/$3.log" list="$RUNNER_TEMP/$3.list" matched listed code failed passed ignored
            cargo test -p "$pkg" --lib --locked -- "$filter" --list > "$list" 2>/dev/null
            matched="$(grep -cE ': test$' "$list" || true)"
            listed="$(grep -cE "^${filter}.*: test$" "$list" || true)"
            echo "$label filter $filter matches these modules (rows per module):"
            grep -E ': test$' "$list" | sed -E 's/::[^:]+: test$//' | sort | uniq -c || true
            cargo test -p "$pkg" --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(grep -cE "^test ${filter}.* \.\.\. ok$" "$log" || true)"
            ignored="$(grep -cE "^test ${filter}.* \.\.\. ignored" "$log" || true)"
            echo "$label rc $code matched $matched listed under $filter $listed want $want passed $passed ignored $ignored failed $failed"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" = "$want" ] && [ "$passed" = "$((listed - ignored))" ]
          }
          fail=0
          rows "$K" "$PATHS" paths 17 || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: crazyagent lib test build, logged (expect rc 0, 0 errors, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/norun.log"
          cargo test -p crazyagent --lib --locked --no-run > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 120 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          gate="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "test build windows-2022 rc $code errors $errors gate crazyagent $gate"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$gate" -ge 1 ] || exit 1
      - name: Build the boundary helper beside the test binary
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-win-boundary.exe target/debug/deps/crazyagent-win-boundary.exe
      - name: bounded Windows launch rows == list (7), through install_with_grants
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          rows() {
            local pkg="$1" filter="$2" label="$3" want="$4" log="$RUNNER_TEMP/$3.log" list="$RUNNER_TEMP/$3.list" matched listed code failed passed ignored
            cargo test -p "$pkg" --lib --locked -- "$filter" --list > "$list" 2>/dev/null
            matched="$(grep -cE ': test$' "$list" || true)"
            listed="$(grep -cE "^${filter}.*: test$" "$list" || true)"
            echo "$label filter $filter matches these modules (rows per module):"
            grep -E ': test$' "$list" | sed -E 's/::[^:]+: test$//' | sort | uniq -c || true
            cargo test -p "$pkg" --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(grep -cE "^test ${filter}.* \.\.\. ok$" "$log" || true)"
            ignored="$(grep -cE "^test ${filter}.* \.\.\. ignored" "$log" || true)"
            echo "$label rc $code matched $matched listed under $filter $listed want $want passed $passed ignored $ignored failed $failed"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" = "$want" ] && [ "$passed" = "$((listed - ignored))" ]
          }
          fail=0
          rows crazyagent "$BOUNDED" bounded 7 || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: Base control, the kernel paths rows at the base sources (expect == list 17, all ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          result_sum() {
            grep -E '^test result:' "$1" | awk -v col="$2" '{n+=$col} END {print n+0}'
          }
          rows() {
            local pkg="$1" filter="$2" label="$3" want="$4" log="$RUNNER_TEMP/$3.log" list="$RUNNER_TEMP/$3.list" matched listed code failed passed ignored
            cargo test -p "$pkg" --lib --locked -- "$filter" --list > "$list" 2>/dev/null
            matched="$(grep -cE ': test$' "$list" || true)"
            listed="$(grep -cE "^${filter}.*: test$" "$list" || true)"
            echo "$label filter $filter matches these modules (rows per module):"
            grep -E ': test$' "$list" | sed -E 's/::[^:]+: test$//' | sort | uniq -c || true
            cargo test -p "$pkg" --lib --locked -- "$filter" > "$log" 2>&1
            code=$?
            grep -E '^test .* FAILED$|panicked at' "$log" | head -n 20 || true
            grep -E -A14 '^---- .* stdout ----' "$log" | head -n 120 || true
            failed="$(result_sum "$log" 6)"
            passed="$(grep -cE "^test ${filter}.* \.\.\. ok$" "$log" || true)"
            ignored="$(grep -cE "^test ${filter}.* \.\.\. ignored" "$log" || true)"
            echo "$label rc $code matched $matched listed under $filter $listed want $want passed $passed ignored $ignored failed $failed"
            [ "$code" = 0 ] && [ "$failed" = 0 ] && [ "$listed" = "$want" ] && [ "$passed" = "$((listed - ignored))" ]
          }
          added="$(git diff --name-only --diff-filter=A "$BASE_FULL" HEAD -- crates/kernel/sandbox/src)"
          echo "added since the base, removed for the control: ${added:-none}"
          [ -z "$added" ] || printf '%s\n' "$added" | xargs git rm -q -f --
          git checkout "$BASE_FULL" -- crates/kernel/sandbox/src
          changed="$(git diff --name-only "$BASE_FULL" -- crates/kernel/sandbox/src | wc -l | tr -d ' ')"
          echo "changed vs the base: $changed files"
          [ "$changed" = 0 ] || { echo "::error::the kernel sources are not at the base"; exit 1; }
          fail=0
          rows "$K" "$PATHS" base-paths 17 || fail=1
          git checkout HEAD -- crates/kernel/sandbox/src
          [ "$fail" = 0 ] || exit 1

  linux:
    name: RECHECK-ROOTS install re-walk tip 1 on ubuntu-22.04
