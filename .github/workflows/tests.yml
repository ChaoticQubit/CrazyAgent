name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: 33322e71c0
  CHORE_FULL: c6f1398838
  RUST_FILES: >-
    crates/crazyagent/src/team/runtime/tests.rs crates/crazyagent/src/team/runtime/tests/run_time.rs crates/crazyagent/src/team/master/tests.rs crates/crazyagent/src/team/master/tests/view_keys.rs crates/crazyagent/src/team/events/tests.rs crates/crazyagent/src/team/events/tests/quoted_breaks.rs crates/crazyagent/src/usage/capture/tests.rs crates/crazyagent/src/usage/capture/tests/fifo_record.rs crates/crazyagent/src/team/events.rs crates/crazyagent/src/team/events/wake_default.rs crates/crazyagent/src/tui/screens/settings_harnesses/tests.rs crates/crazyagent/src/tui/screens/settings_harnesses/tests/engine_line.rs crates/crazyagent/tests/master_session.rs crates/crazyagent/tests/master_session/pool_authority.rs crates/crazyagent/tests/projects_home.rs crates/crazyagent/tests/projects_home/git_entry.rs

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: CAPS-MOVES-10-18 clippy lib strict and tests on the moved files on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 14
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the caps tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~12)" = "$CHORE_FULL" ] || { echo "::error::HEAD~12 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the caps tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent --lib --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "linux clippy lib rc $code"
          exit $code
      - name: Clippy crazyagent tests, failing only on the moved files or a missing module file
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-tests.log"
          touch crates/crazyagent/src/lib.rs
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          missing="$(grep -cE 'E0583|file not found for module' "$log")"
          echo "linux tests clippy rc $code moved-file lints $moved missing-module $missing"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] && [ "$missing" = 0 ] || { echo "::error::a lint or a missing module in the moved files"; exit 1; }

  windows:
    name: CAPS-MOVES-10-18 clippy lib strict and tests on the moved files on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 14
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "$(git rev-parse --short=10 HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the caps tip $TIP_FULL"; exit 1; }
          [ "$(git rev-parse --short=10 HEAD~12)" = "$CHORE_FULL" ] || { echo "::error::HEAD~12 is not chore/v250 $CHORE_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the caps tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy crazyagent lib
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          touch crates/crazyagent/src/lib.rs
          cargo fetch --locked
          cargo clippy -p crazyagent --lib --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; code=1; }
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "windows clippy lib rc $code"
          exit $code
      - name: Clippy crazyagent tests, failing only on the moved files or a missing module file
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-tests.log"
          touch crates/crazyagent/src/lib.rs
          cargo clippy -p crazyagent --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log")"
          echo "CHECKED crazyagent $checked"
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          tr "\\\\" "/" < "$log" > "$log.slash"
          read -ra files <<< "$RUST_FILES"
          moved=0
          for f in "${files[@]}"; do
            n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash")"
            moved=$((moved + n))
          done
          missing="$(grep -cE 'E0583|file not found for module' "$log")"
          echo "windows tests clippy rc $code moved-file lints $moved missing-module $missing"
          [ "$checked" -gt 0 ] || { echo "::error::crazyagent was not checked, the cache was read as fresh"; exit 1; }
          [ "$moved" = 0 ] && [ "$missing" = 0 ] || { echo "::error::a lint or a missing module in the moved files"; exit 1; }
