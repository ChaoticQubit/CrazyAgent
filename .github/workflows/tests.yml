name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  TOUCHED: accounts app first-run-harnesses-words harness-path harness-updates intake new-project no-opaque-failures project-page settings-plugins settings-setup
  ROWS: |
    accounts.test.mjs: default names take the lowest free number; form checks match the engine's rules
    accounts.test.mjs: step 2 lists catalog methods in order with Recommended first, and no subscription offers a sign-in taken from this Mac (PA-13)
    accounts.test.mjs: the start panel offers each managed method with the design copy
    app.test.mjs: Get set up stays until one account is ready and one pool exists; harnesses never block
    first-run-harnesses-words.test.mjs: the TUI Harnesses step uses the desktop step's words
    first-run-harnesses-words.test.mjs: the TUI says needs Node and a bad list in the desktop's words
    harness-path.test.mjs: a refused file names the file with home as ~ and the reason, and offers to forget a chosen file
    harness-path.test.mjs: each refusal of a harness file has its own sentence, and an unknown code reads as a plain refusal
    harness-updates.test.mjs: the page lists the install setting with both options, and changing it keeps the other three
    harness-updates.test.mjs: update and first-run words name this Mac on macOS and this computer on Windows and Linux
    intake.test.mjs: setup lists each tool's state in plain words
    intake.test.mjs: the tools step lists dependencies and the pack by group, and names the MCP servers it approves
    new-project.test.mjs: a harness the engine lists as Can't run is never the team default, sits in its own group and can't be picked
    new-project.test.mjs: team validation mirrors the engine agent range
    no-opaque-failures.test.mjs: account and server refusals name this Mac on macOS and this computer on Windows and Linux
    project-page.test.mjs: the master's harness that is not installed gets the design's line
    project-page.test.mjs: the master's harness the engine lists as Can't run gets the words New Project and the team pickers use
    settings-plugins.test.mjs: the Add MCP server form turns typed text into the engine's spec and refuses what the engine would
    settings-setup.test.mjs: Settings, Pack lists tmux, uv and graphify after the pack and offers Install tools while one is missing
  KNOWN_BASE: "settings-access-layout.test.mjs: V243-TERMINAL-SETTINGS-PLACE: Settings lists Terminal under App, and its section holds Terminal input and Terminal renderer as Profile's Appearance does"
  WORDS: dba65069ddad53822a84b4cd695096890c05a70e
  FIX: c99eaaf8cc0b74b38f7c3200d254604b44532935

jobs:
  ubuntu:
    name: ON-THIS-MAC words-9 desktop node files on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$WORDS" ] || { echo "::error::the parent is not the words commit"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$FIX" ] || { echo "::error::HEAD~2 is not the ON-THIS-MAC-FIX fix commit"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^ -- . ':!apps/desktop/test' | wc -l | tr -d ' ')" = 0 ] || { echo "::error::the words commit touches a file outside apps/desktop/test"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the words commit"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8  $work/chrome.zip" | shasum -a 256 -c -
          unzip -q "$work/chrome.zip" -d "$work"
          chrome="$work/chrome-linux64/chrome"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Caps at base and tip (expect no file new to the problem list)
        run: |
          set +e
          set -uo pipefail
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; tip=$?
          git checkout "$FIX" -- apps/desktop/test scripts/quality
          git clean -fdq apps/desktop/test
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; base=$?
          git checkout HEAD^ -- apps/desktop/test scripts/quality
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          new=$(comm -13 <(sort "$RUNNER_TEMP/caps-base.txt") <(sort "$RUNNER_TEMP/caps-tip.txt"))
          echo "caps base rc $base tip rc $tip new $(printf '%s' "$new" | grep -c . || true)"
          printf '%s\n' "$new"
          [ -z "$new" ]
      - name: Every desktop test file at the tip then at the base (expect no failure at the tip in the touched files, no failure at the tip that is not at the base, and on macOS at least 19 touched-file failures at the base)
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/desk"; mkdir -p "$out"
          failed() { sed -n '/failing tests:/,$p' "$1" | grep -E '^✖ ' | grep -v 'failing tests:' | sed -E 's/^✖ (.*) \([0-9.]+m?s\)$/\1/' | sort -u; }
          touched() { for name in $TOUCHED; do ( set +e; node --test --test-timeout=60000 --test-reporter=spec "apps/desktop/test/$name.test.mjs" > "$out/$1-$name.log" 2>&1; echo "$1 $name.test.mjs rc $? $(grep -E '^ℹ (tests|pass|fail) ' "$out/$1-$name.log" | tr '\n' ' ')" ); failed "$out/$1-$name.log" | sed "s|^|$name.test.mjs: |"; done; }
          node --test --test-timeout=60000 --test-reporter=spec apps/desktop/test/*.test.mjs > "$out/tip.log" 2>&1
          echo "tip rc $? $(grep -E '^ℹ (tests|pass|fail) ' "$out/tip.log" | tr '\n' ' ')"
          failed "$out/tip.log" > "$out/tip.txt"
          touched tip > "$out/touched-tip.raw"; grep -E ' rc [0-9]+ ' "$out/touched-tip.raw"; grep -vE '\.test\.mjs rc [0-9]+ ' "$out/touched-tip.raw" | grep -vxF "$KNOWN_BASE" > "$out/touched-tip.txt" || true
          git checkout "$FIX" -- apps/desktop/test
          git clean -fdq apps/desktop/test
          node --test --test-timeout=60000 --test-reporter=spec apps/desktop/test/*.test.mjs > "$out/base.log" 2>&1
          echo "base rc $? $(grep -E '^ℹ (tests|pass|fail) ' "$out/base.log" | tr '\n' ' ')"
          failed "$out/base.log" > "$out/base.txt"
          touched base > "$out/touched-base.raw"; grep -E ' rc [0-9]+ ' "$out/touched-base.raw"; grep -vE '\.test\.mjs rc [0-9]+ ' "$out/touched-base.raw" > "$out/touched-base.txt" || true
          git checkout HEAD^ -- apps/desktop/test
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          comm -13 "$out/base.txt" "$out/tip.txt" > "$out/new.txt"
          echo "failed at the tip only $(wc -l < "$out/new.txt" | tr -d ' '):"; cat "$out/new.txt"
          echo "failed at the tip $(wc -l < "$out/tip.txt" | tr -d ' '):"; cat "$out/tip.txt"
          echo "failed at the base $(wc -l < "$out/base.txt" | tr -d ' '):"; cat "$out/base.txt"
          grep -E -B2 -A14 '^✖ ' "$out/tip.log" | grep -vE '^ℹ' | head -n 150
          echo "touched files failed at the tip $(wc -l < "$out/touched-tip.txt" | tr -d ' '):"; cat "$out/touched-tip.txt"
          echo "touched files failed at the base $(wc -l < "$out/touched-base.txt" | tr -d ' '):"; cat "$out/touched-base.txt"
          rc=0
          [ ! -s "$out/new.txt" ] || { echo "::error::a failure at the tip that is not at the base"; rc=1; }
          grep -vxF "${KNOWN_BASE#*.test.mjs: }" "$out/tip.txt" > "$out/tip-unknown.txt" || true
          echo "failed at the tip apart from the known base row $(wc -l < "$out/tip-unknown.txt" | tr -d ' ')"
          [ ! -s "$out/tip-unknown.txt" ] || { echo "::error::a failure at the tip apart from the known base row"; rc=1; }
          okrows=0
          while IFS= read -r row; do
            [ -n "$row" ] || continue
            file=${row%%: *}; name=${row#*: }
            log="$out/tip-${file%.test.mjs}.log"
            if grep -qF "✔ $name (" "$log" && ! grep -qF "✖ $name (" "$log"; then okrows=$((okrows + 1)); else echo "::error::not ok at the tip: $row"; rc=1; fi
          done <<< "$ROWS"
          echo "named rows ok at the tip $okrows of 19"
          [ "$okrows" = 19 ] || rc=1
          if [ "$RUNNER_OS" = macOS ]; then
            [ "$(wc -l < "$out/touched-base.txt" | tr -d ' ')" -ge 19 ] || { echo "::error::fewer than 19 touched-file failures at the base on macOS"; rc=1; }
          fi
          exit "$rc"
  macos:
    name: ON-THIS-MAC words-9 desktop node files on macos-15
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$WORDS" ] || { echo "::error::the parent is not the words commit"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$FIX" ] || { echo "::error::HEAD~2 is not the ON-THIS-MAC-FIX fix commit"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^ -- . ':!apps/desktop/test' | wc -l | tr -d ' ')" = 0 ] || { echo "::error::the words commit touches a file outside apps/desktop/test"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the words commit"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
          echo "01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef  $work/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$work/chrome.zip" "$work"
          chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Caps at base and tip (expect no file new to the problem list)
        run: |
          set +e
          set -uo pipefail
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1; tip=$?
          git checkout "$FIX" -- apps/desktop/test scripts/quality
          git clean -fdq apps/desktop/test
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-base.txt" 2>&1; base=$?
          git checkout HEAD^ -- apps/desktop/test scripts/quality
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          new=$(comm -13 <(sort "$RUNNER_TEMP/caps-base.txt") <(sort "$RUNNER_TEMP/caps-tip.txt"))
          echo "caps base rc $base tip rc $tip new $(printf '%s' "$new" | grep -c . || true)"
          printf '%s\n' "$new"
          [ -z "$new" ]
      - name: Every desktop test file at the tip then at the base (expect no failure at the tip in the touched files, no failure at the tip that is not at the base, and on macOS at least 19 touched-file failures at the base)
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/desk"; mkdir -p "$out"
          failed() { sed -n '/failing tests:/,$p' "$1" | grep -E '^✖ ' | grep -v 'failing tests:' | sed -E 's/^✖ (.*) \([0-9.]+m?s\)$/\1/' | sort -u; }
          touched() { for name in $TOUCHED; do ( set +e; node --test --test-timeout=60000 --test-reporter=spec "apps/desktop/test/$name.test.mjs" > "$out/$1-$name.log" 2>&1; echo "$1 $name.test.mjs rc $? $(grep -E '^ℹ (tests|pass|fail) ' "$out/$1-$name.log" | tr '\n' ' ')" ); failed "$out/$1-$name.log" | sed "s|^|$name.test.mjs: |"; done; }
          node --test --test-timeout=60000 --test-reporter=spec apps/desktop/test/*.test.mjs > "$out/tip.log" 2>&1
          echo "tip rc $? $(grep -E '^ℹ (tests|pass|fail) ' "$out/tip.log" | tr '\n' ' ')"
          failed "$out/tip.log" > "$out/tip.txt"
          touched tip > "$out/touched-tip.raw"; grep -E ' rc [0-9]+ ' "$out/touched-tip.raw"; grep -vE '\.test\.mjs rc [0-9]+ ' "$out/touched-tip.raw" | grep -vxF "$KNOWN_BASE" > "$out/touched-tip.txt" || true
          git checkout "$FIX" -- apps/desktop/test
          git clean -fdq apps/desktop/test
          node --test --test-timeout=60000 --test-reporter=spec apps/desktop/test/*.test.mjs > "$out/base.log" 2>&1
          echo "base rc $? $(grep -E '^ℹ (tests|pass|fail) ' "$out/base.log" | tr '\n' ' ')"
          failed "$out/base.log" > "$out/base.txt"
          touched base > "$out/touched-base.raw"; grep -E ' rc [0-9]+ ' "$out/touched-base.raw"; grep -vE '\.test\.mjs rc [0-9]+ ' "$out/touched-base.raw" > "$out/touched-base.txt" || true
          git checkout HEAD^ -- apps/desktop/test
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          comm -13 "$out/base.txt" "$out/tip.txt" > "$out/new.txt"
          echo "failed at the tip only $(wc -l < "$out/new.txt" | tr -d ' '):"; cat "$out/new.txt"
          echo "failed at the tip $(wc -l < "$out/tip.txt" | tr -d ' '):"; cat "$out/tip.txt"
          echo "failed at the base $(wc -l < "$out/base.txt" | tr -d ' '):"; cat "$out/base.txt"
          grep -E -B2 -A14 '^✖ ' "$out/tip.log" | grep -vE '^ℹ' | head -n 150
          echo "touched files failed at the tip $(wc -l < "$out/touched-tip.txt" | tr -d ' '):"; cat "$out/touched-tip.txt"
          echo "touched files failed at the base $(wc -l < "$out/touched-base.txt" | tr -d ' '):"; cat "$out/touched-base.txt"
          rc=0
          [ ! -s "$out/new.txt" ] || { echo "::error::a failure at the tip that is not at the base"; rc=1; }
