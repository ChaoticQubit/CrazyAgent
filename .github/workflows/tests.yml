name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "26.12.1"
  TIP_FULL: c5622650ff0c18c44a7c11e78c8fd1ce980e8eae
  FIX_FULL: a9b98407f4dc95d57583b77e2d13daf369705c9a
  RED_FULL: 515a512d27f307311292f57a103c2f49a09671ea
  BASE_FULL: 23b9849156ebd6e5782cc98d0aef626f7e3f52a6
  FIX_RS: "crates/crazyagent/src/tui/screens/project_view.rs crates/crazyagent/src/tui/screens/project.rs"

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: MACOS-WORDS-A5-A6 ${{ matrix.leg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            leg: linux
            cache: linux
            want: "tui::screens::project::words_tests::an_unread_folder_says_only_that_off_macos tui::screens::project::words_tests::a_missing_project_folder_names_the_file_manager_off_macos"
          - os: windows-2022
            leg: win
            cache: Windows
            want: "tui::screens::project::words_tests::an_unread_folder_says_only_that_off_macos tui::screens::project::words_tests::a_missing_project_folder_names_the_file_manager_off_macos"
          - os: macos-15
            leg: mac
            cache: macOS
            want: "tui::screens::project::words_tests::an_unread_folder_names_icloud_on_macos tui::screens::project::words_tests::a_missing_project_folder_names_finder_on_macos"
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log --format='%H %s' -4 HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the ticket tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$FIX_FULL" ] || { echo "::error::HEAD~2 is not the fix commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED_FULL" ] || { echo "::error::HEAD~3 is not the red commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE_FULL" ] || { echo "::error::HEAD~4 is not chore/v250 23b9849156"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ticket tip"; exit 1; }
      - name: Install Linux packages
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci/linux-packages.sh
          sudo apt-get install -y --no-install-recommends libsecret-tools musl-tools bison binutils
      - name: Install SQLite for Windows
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ matrix.cache }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Mark the ticket's Rust files newer than the restored cache
        run: |
          set -euo pipefail
          sleep 2
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | xargs touch
          git diff --name-only "$BASE_FULL" HEAD^ -- '*.rs' | wc -l
      - name: Fetch crates
        timeout-minutes: 20
        run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: caps and sleeps ratchets at the base and the tip (expect sleeps rc 0 both; no tip caps problem missing at the base, none naming a ticket file)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          node scripts/quality/caps.mjs > "$RUNNER_TEMP/caps-tip.txt" 2>&1
          ct=$?
          node scripts/quality/sleeps.mjs > "$RUNNER_TEMP/sleeps-tip.txt" 2>&1
          st=$?
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_FULL" > /dev/null 2>&1
          (cd "$RUNNER_TEMP/base" && node scripts/quality/caps.mjs) > "$RUNNER_TEMP/caps-base.txt" 2>&1
          cb=$?
          (cd "$RUNNER_TEMP/base" && node scripts/quality/sleeps.mjs) > "$RUNNER_TEMP/sleeps-base.txt" 2>&1
          sb=$?
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-tip.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-tip-files.txt" || true
          grep -oE '^[^:]+: [0-9]+ lines' "$RUNNER_TEMP/caps-base.txt" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/caps-base-files.txt" || true
          git diff --name-only "$BASE_FULL" HEAD^ | sort > "$RUNNER_TEMP/ticket-files.txt"
          new="$(comm -23 <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-tip.txt" | sort) <(grep -E '^[^ :]+: ' "$RUNNER_TEMP/caps-base.txt" | sort) | grep -c . || true)"
          ticket="$(comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" | grep -c . || true)"
          tail -n 1 "$RUNNER_TEMP/caps-tip.txt"
          tail -n 1 "$RUNNER_TEMP/caps-base.txt"
          tail -n 1 "$RUNNER_TEMP/sleeps-tip.txt"
          comm -12 "$RUNNER_TEMP/caps-tip-files.txt" "$RUNNER_TEMP/ticket-files.txt" || true
          echo "caps rc tip $ct base $cb problems tip $(grep -c . "$RUNNER_TEMP/caps-tip-files.txt") base $(grep -c . "$RUNNER_TEMP/caps-base-files.txt") new-at-tip $new on-ticket-files $ticket sleeps rc tip $st base $sb"
          [ "$st" = 0 ] && [ "$sb" = 0 ] && [ "$ticket" = 0 ] && [ "$new" = 0 ] || exit 1
      - name: tsc, then node move-home rows at the tip, then red with the red commit's move-home.tsx (expect tip pass, red fail on both rows that render the unread line)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        timeout-minutes: 20
        run: |
          set +e
          (cd apps/desktop && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/npm.log" 2>&1
          ci=$?
          tail -n 2 "$RUNNER_TEMP/npm.log"
          (cd apps/desktop && npm run --silent typecheck) > "$RUNNER_TEMP/tsc.log" 2>&1
          tc=$?
          tcmine="$(grep -cE 'move-home' "$RUNNER_TEMP/tsc.log" || true)"
          grep -E 'error TS' "$RUNNER_TEMP/tsc.log" | head -n 10 || true
          (cd apps/desktop && node --test --test-reporter=tap test/move-home-words.test.mjs test/move-home.test.mjs) > "$RUNNER_TEMP/node-tip.log" 2>&1
          tip=$?
          grep -E '^# (pass|fail)|^not ok' "$RUNNER_TEMP/node-tip.log" || true
          git checkout "$RED_FULL" -- apps/desktop/src/screens/project/move-home.tsx
          (cd apps/desktop && node --test --test-reporter=tap test/move-home.test.mjs) > "$RUNNER_TEMP/node-red.log" 2>&1
          red=$?
          git checkout HEAD^ -- apps/desktop/src/screens/project/move-home.tsx
          grep -E '^# (pass|fail)|^not ok' "$RUNNER_TEMP/node-red.log" || true
          named="$(grep -cE '^not ok [0-9]+ - (Move into CrazyAgent folder shows only for a project outside the projects folder|V243-MOVE-SIZE-PROBLEM-DESKTOP)' "$RUNNER_TEMP/node-red.log" || true)"
          echo "node npm rc $ci tsc rc $tc tsc errors naming move-home $tcmine tip rc $tip red rc $red red names the rows $named"
          [ "$ci" = 0 ] && [ "$tcmine" = 0 ] && [ "$tip" = 0 ] && [ "$red" != 0 ] && [ "$named" -ge 2 ] || exit 1
      - name: rustfmt of crazyagent (expect rc 0)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os == 'ubuntu-22.04' }}
        run: |
          set +e
          cargo fmt --check -p crazyagent
          code=$?
          echo "fmt rc $code"
          [ "$code" = 0 ] || exit 1
      - name: clippy crazyagent lib with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'macos-15' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-lib.log"
          cargo clippy -p crazyagent --lib --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent lib rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: clippy crazyagent lib test target with warnings denied on this system (expect rc 0, 0 errors, 0 warnings, crate gate)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.os != 'macos-15' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-libtest.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 60 || true
          tail -n 3 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          g0="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent tests rc $code errors $errors warnings $warnings gate crazyagent $g0"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$g0" -ge 1 ] || exit 1
      - name: ticket rows at the tip by want list (expect each wanted row ok, failed 0, crate gate)
        id: tiprows
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        env:
          WANT: ${{ matrix.want }}
        run: |
          set +e
          log="$RUNNER_TEMP/rows-tip.log"
          cargo test -p crazyagent --lib --locked -- tui::screens::project::words_tests:: > "$log" 2>&1
          c1=$?
          grep -E '^test .* (ok|FAILED)$|panicked at' "$log" | head -n 20 || true
          grep -E '^test result:' "$log" || true
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          read -r -a want <<< "$WANT"
          ok=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.}( - should panic)? \.\.\. ok$" "$log" || true)"
            [ "$n" = 1 ] || echo "  missing or not ok: $row ($n)"
            ok=$((ok + n))
          done
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "tip rows rc $c1 failed $failed wanted ${#want[@]} ok $ok gates crazyagent $g1"
          [ "$c1" = 0 ] && [ "$failed" = 0 ] && [ "$ok" = "${#want[@]}" ] && [ "${#want[@]}" = 2 ] && [ "$g1" -ge 1 ] || exit 1
      - name: Red, the red commit's two fix files under the tip rows (expect both wanted rows FAILED off macOS; on macOS the rows guard today's words and stay ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 90
        env:
          WANT: ${{ matrix.want }}
          LEG: ${{ matrix.leg }}
        run: |
          set +e
          read -r -a files <<< "$FIX_RS"
          git checkout "$RED_FULL" -- "${files[@]}"
          git diff --cached --stat HEAD^ | tail -n 1
          sleep 2
          touch "${files[@]}"
          log="$RUNNER_TEMP/rows-red.log"
          cargo test -p crazyagent --lib --locked -- tui::screens::project::words_tests:: > "$log" 2>&1
          c1=$?
          grep -E '^test .* (ok|FAILED)$' "$log" | head -n 20 || true
          grep -E '^error(\[|:)' "$log" | head -n 10 || true
          read -r -a want <<< "$WANT"
          if [ "$LEG" = mac ]; then word=ok; else word=FAILED; fi
          hit=0
          for row in "${want[@]}"; do
            n="$(grep -cE "^test ${row//./\\.} \.\.\. ${word}$" "$log" || true)"
            [ "$n" = 1 ] || echo "  not ${word}: $row ($n)"
            hit=$((hit + n))
          done
          g1="$(grep -cE '^ +Compiling crazyagent v' "$log" || true)"
          echo "red rows leg $LEG rc $c1 wanted ${#want[@]} ${word}-as-wanted $hit gates crazyagent $g1"
          if [ "$LEG" = mac ]; then [ "$c1" = 0 ]; else [ "$c1" != 0 ]; fi && [ "$hit" = "${#want[@]}" ] && [ "$g1" -ge 1 ] || exit 1
