name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: bd2c196a30b9a4985e26e218580d34805984ee86
  BASE: 07c5c6cec21f8df2a0f707bde96080d59b060a6b
  FILES: "crates/crazyagent/tests/freed_bytes_support/mod.rs "

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: FREESCAN-SCRATCH-ABORT clippy on windows-2022 at the fix tip
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, Windows clippy on the crazyagent lib and its tests (expect rc 0 and 0 errors under -D warnings, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/tip-clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
          echo "CLIPPY rc $rc errors $errors warnings $warnings checked crazyagent $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Gate, clippy checked crazyagent (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$RUNNER_TEMP"/tip-clippy.log || true)
          echo "GATE Checking or Compiling crazyagent $n"
          [ "$n" -ge 1 ]
  linux:
    name: FREESCAN-SCRATCH-ABORT rows on ubuntu-22.04, fix tip against base (x86_64 asm path)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          [ "$(uname -m)" = x86_64 ] || { echo "::error::the runner is not x86_64"; exit 1; }
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Build the landlock helper beside the test binaries
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked --offline
          mkdir -p target/debug/deps
          cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
      - name: Write the row runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS'
          side="$1"
          : > "$RUNNER_TEMP/$side-failed.txt"
          bad=0
          for f in owner_token_residue masked_field_spare mcp_config_secret_copies secret_drops_wipe secret_format_copies secret_realloc_residue secret_value_wipe; do
            log="$RUNNER_TEMP/$side-$f.log"
            cargo test -p crazyagent --locked --offline --test "$f" > "$log" 2>&1
            rc=$?
            result=$(grep -E '^test result: ' "$log" | tail -1 || true)
            control=$(grep -cE '^test freed_bytes_support::a_copy_reads_every_byte_of_a_block \.\.\. ok$' "$log" || true)
            ran=$(grep -cE '^running [1-9][0-9]* tests?$' "$log" || true)
            grep -E '^test .* \.\.\. FAILED$' "$log" | sed -E 's/^test (.*) \.\.\. FAILED$/'"$f"'::\1/' >> "$RUNNER_TEMP/$side-failed.txt" || true
            echo "ROWS $side $f rc $rc control $control ran $ran $result"
            grep -E 'panicked' "$log" | head -10 || true
            grep -E '^test .* (ok|FAILED|ignored)$' "$log" || true
            [ "$rc" = 0 ] && [ "$control" = 1 ] && [ "$ran" -ge 1 ] || bad=1
          done
          echo "LINUX-ROWS $side bad $bad"
          [ "$side" = base ] || [ "$bad" = 0 ] || { echo "::error::a freed-block row failed on linux"; exit 1; }
          ROWS
      - name: Tip, the 7 freed-block test files, one cargo call each (expect every row ok and the control row in each)
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" tip
      - name: Base, the same 7 files with the helper at the base (expect the same rows)
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: |
          set +e
          set -uo pipefail
          read -ra files <<< "$FILES"
          git checkout "$BASE" -- "${files[@]}"
          [ "$(git diff --name-only HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the base side changed other files"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" base
          git checkout HEAD^ -- "${files[@]}"
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the fix tip"; exit 1; }
      - name: FAILED-name diff, tip against base (expect tip 0 and tip-only 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          sort -u "$RUNNER_TEMP/tip-failed.txt" > "$RUNNER_TEMP/t.txt"
          sort -u "$RUNNER_TEMP/base-failed.txt" > "$RUNNER_TEMP/b.txt"
          tip=$(wc -l < "$RUNNER_TEMP/t.txt" | tr -d ' ')
          base=$(wc -l < "$RUNNER_TEMP/b.txt" | tr -d ' ')
          only=$(comm -23 "$RUNNER_TEMP/t.txt" "$RUNNER_TEMP/b.txt" | wc -l | tr -d ' ')
          comm -23 "$RUNNER_TEMP/t.txt" "$RUNNER_TEMP/b.txt"
          echo "DIFF tip $tip base $base tip-only $only"
          [ "$tip" = 0 ] && [ "$only" = 0 ] || { echo "::error::the tip fails rows"; exit 1; }
