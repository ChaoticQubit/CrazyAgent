      - name: The steady-save reds at the red commit's save files, then at the tip (expect 2 FAILED with their messages at red, 2 passed at the tip)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          files=(crates/kernel/storage/src/state_log/appender.rs crates/crazyagent/src/state_log.rs crates/crazyagent/src/settings_log.rs)
          steady() {
            local log="$RUNNER_TEMP/steady-$1.log"
            cargo test --locked -p crazyagent --lib sdk_slice::tests::a_steady_ > "$log" 2>&1
            local code=$?
