name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  KERNEL: crazyagent-kernel-processes
  MERGE_FULL: ff05f15c7bb4107768b4ba24599e22daad47c9da
  TIP_FULL: 2d4b173e44f60e2b6685dc8064e0f37b0e3d4169
  CHORE_FULL: 9af0fed035548e0468d31f5db66792da23bf7496
  KERNEL_ROWS: "install::tests::a_hash_not_64_lower_hex_is_refused install::tests::a_lock_past_its_bound_is_refused install::tests::a_name_past_its_bound_is_refused install::tests::a_python_past_its_bound_is_refused install::tests::a_recipe_with_an_extra_argument_is_refused install::tests::a_system_package_name_a_manager_reads_as_a_version_or_pattern_is_refused install::tests::a_system_package_name_that_turns_the_verb_or_names_a_file_is_refused install::tests::a_target_past_its_bound_or_unnamed_is_refused install::tests::a_version_past_its_bound_is_refused install::tests::an_unlisted_npm_flag_is_refused install::tests::an_unlisted_self_update_arg_list_is_refused install::tests::npm_flags_past_their_bound_are_refused install::tests::self_update_args_past_their_bound_are_refused tests::a_dependency_table_turning_test_support_on_is_caught tests::a_feature_forwarding_test_support_is_caught tests::a_workspace_alias_turning_test_support_on_in_a_member_is_caught tests::a_workspace_dependency_turning_test_support_on_is_caught tests::finding_test_support_exports_exactly_the_named_items tests::test_support_is_enabled_only_by_crazyagent_dev_dependencies tests::the_crates_own_default_feature_turning_test_support_on_is_caught"
  RUST_FILES: "crates/crazyagent/src/update/tests.rs crates/kernel/processes/src/install.rs crates/kernel/processes/src/install/tests.rs crates/kernel/processes/src/tests.rs"

defaults:
  run:
    shell: bash

jobs:
  mac:
    name: b21 lows merge ff05f15c7b check and rows on macos-15
    runs-on: macos-15
    timeout-minutes: 170
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the merge's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='merge %H %P %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$MERGE_FULL" ] || { echo "::error::the parent is not the merge ff05f15c7b"; exit 1; }
          [ "$(git rev-parse HEAD^^1)" = "$TIP_FULL" ] || { echo "::error::the merge's first parent is not the branch tip 2d4b173e44"; exit 1; }
          [ "$(git rev-parse HEAD^^2)" = "$CHORE_FULL" ] || { echo "::error::the merge's second parent is not chore 9af0fed035"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit touches more than tests.yml"; exit 1; }
          [ "$(git diff --name-only "$CHORE_FULL" HEAD^ | tr '\n' ' ' | sed 's/ $//')" = "$RUST_FILES" ] || { echo "::error::the merge differs from chore in other files than the four"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merge"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: cargo check crazyagent with its tests at the merge (expect rc 0, 0 warning or error lines)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/check.log"
          touch crates/crazyagent/src/lib.rs
          cargo check -p crazyagent --tests --locked > "$log" 2>&1
          code=$?
          grep -E '^(warning|error)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 3 "$log"
          lines="$(grep -cE '^(warning|error)(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "CHECKED crazyagent $checked"
          echo "check rc $code warning-or-error lines $lines"
          [ "$checked" -gt 0 ] || { echo "::error::cargo check never checked crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$code" = 0 ] && [ "$lines" = 0 ] || exit 1
      - name: kernel rows at the merge by exact name (expect the 20 wanted rows ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/kernel.log"
          touch crates/kernel/processes/src/lib.rs
          read -r -a filters <<< "$KERNEL_ROWS"
          want="$(printf '%s\n' "${filters[@]}" | sort)"
          cargo test -p "$KERNEL" --lib --locked -- --exact "${filters[@]}" > "$log" 2>&1
          code=$?
          built="$(grep -cE "^ +(Checking|Compiling) $KERNEL v" "$log" || true)"
          echo "BUILT $KERNEL $built"
          grep -E '^running [0-9]+ test|FAILED|test result:|panicked at' "$log" || true
          ran="$(grep -E '^test [a-z_0-9:]+ \.\.\. (ok|FAILED|ignored)$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          got="$(grep -E '^test [a-z_0-9:]+ \.\.\. ok$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
          echo "kernel rows rc $code wanted $(printf '%s\n' "$want" | grep -c .) ran $(printf '%s' "$ran" | grep -c .) ok $(printf '%s' "$got" | grep -c .)"
          [ "$built" -gt 0 ] || { echo "::error::the row build never built $KERNEL (a restored target read as fresh)"; exit 1; }
          [ "$code" = 0 ] && [ "$ran" = "$want" ] && [ "$got" = "$want" ] || { echo "::error::kernel rows differ from the want list"; tail -n 40 "$log"; exit 1; }
      - name: engine update rows at the merge (expect all passed, desktop and perf rows listed, no swap rows)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          log="$RUNNER_TEMP/update.log"
          touch crates/crazyagent/src/lib.rs
          cargo test -p crazyagent --lib --locked -- update::tests:: --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          desktop="$(grep -cxF 'update::tests::no_install_path_skips_verification: test' "$log.list" || true)"
          perf="$(grep -cxF 'update::tests::a_perf_tests_folder_is_test_code_to_the_install_scan: test' "$log.list" || true)"
          swap="$(grep -E ': test$' "$log.list" | grep -cE 'swap_import|aliased_swap|swap_taken' || true)"
          [ "$listed" -gt 0 ] || { grep -E '^(error|warning)(\[|:)|^ +--> ' "$log.list" | head -n 60; tail -n 30 "$log.list"; }
          cargo test -p crazyagent --lib --locked -- update::tests:: > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ test|FAILED|test result:|panicked at' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          built="$(cat "$log.list" "$log" | grep -cE '^ +(Checking|Compiling) crazyagent v' || true)"
          echo "BUILT crazyagent $built"
          echo "update rows rc $code listed $listed desktop row $desktop perf row $perf swap rows $swap passed $passed failed $failed"
          [ "$built" -gt 0 ] || { echo "::error::the row build never built crazyagent (a restored target read as fresh)"; exit 1; }
          [ "$code" = 0 ] && [ "$desktop" = 1 ] && [ "$perf" = 1 ] && [ "$swap" = 0 ] && [ "$listed" -gt 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1

  clippy:
    name: b21 lows merge ff05f15c7b clippy on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 170
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the merge's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$MERGE_FULL" ] || { echo "::error::the parent is not the merge ff05f15c7b"; exit 1; }
          [ "$(git rev-parse HEAD^^2)" = "$CHORE_FULL" ] || { echo "::error::the merge's second parent is not chore 9af0fed035"; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tests.yml ] || { echo "::error::the farm commit touches more than tests.yml"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the merge"; exit 1; }
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Clippy lib strict on the kernel processes crate and the engine crate
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          worst=0
          for pair in "$KERNEL:crates/kernel/processes/src/lib.rs" "crazyagent:crates/crazyagent/src/lib.rs"; do
            crate="${pair%%:*}"
            touch "${pair#*:}"
            log="$RUNNER_TEMP/clippy-lib-$crate.log"
            cargo clippy -p "$crate" --lib --locked --message-format short -- -D warnings > "$log" 2>&1
            code=$?
            checked="$(grep -cE "^ +(Checking|Compiling) $crate v" "$log" || true)"
            grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
            tail -n 3 "$log"
            echo "CHECKED $crate $checked"
            echo "${{ matrix.os }} clippy lib $crate rc $code"
            [ "$checked" -gt 0 ] || { echo "::error::$crate was not checked, the cache was read as fresh"; worst=1; }
            [ "$code" = 0 ] || worst=1
          done
          exit "$worst"
      - name: Clippy tests on both crates, failing only on the merged files or a missing module file
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          set +e
          worst=0
          read -ra files <<< "$RUST_FILES"
          for pair in "$KERNEL:crates/kernel/processes/src/lib.rs" "crazyagent:crates/crazyagent/src/lib.rs"; do
            crate="${pair%%:*}"
            touch "${pair#*:}"
            log="$RUNNER_TEMP/clippy-tests-$crate.log"
            cargo clippy -p "$crate" --lib --tests --locked --message-format short -- -D warnings > "$log" 2>&1
            code=$?
            checked="$(grep -cE "^ +(Checking|Compiling) $crate v" "$log" || true)"
            grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
            tail -n 3 "$log"
            tr "\\\\" "/" < "$log" > "$log.slash"
            merged=0
            for f in "${files[@]}"; do
              n="$(grep -cE "^${f}:[0-9]+:[0-9]+: (error|warning)" "$log.slash" || true)"
              merged=$((merged + n))
            done
            missing="$(grep -cE 'E0583|file not found for module' "$log" || true)"
            echo "CHECKED $crate $checked"
            echo "${{ matrix.os }} clippy tests $crate rc $code merged-file lints $merged missing-module $missing"
            [ "$checked" -gt 0 ] || { echo "::error::$crate was not checked, the cache was read as fresh"; worst=1; }
            [ "$merged" = 0 ] && [ "$missing" = 0 ] || { echo "::error::a lint in a merged file or a missing module"; worst=1; }
          done
          exit "$worst"
