name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: 7125e1604677942946c0db9ca2c0be733d2c2bbe

defaults:
  run:
    shell: bash

jobs:
  win-clippy:
    name: V243-NARROWING-DURABLE-REST crazyagent clippy lib and tests on windows-2022 at the tip
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings

  linux:
    name: V243-NARROWING-DURABLE-REST clippy and the REST rows with their neighbours on ubuntu-22.04 at the tip
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Clippy at the tip, one target set per call
        timeout-minutes: 60
        run: |
          set -uo pipefail
          failed=0
          printf '| Linux clippy at %s | exit |\n| --- | --- |\n' "${TIP:0:9}" >> "$GITHUB_STEP_SUMMARY"
          for set in "--lib" "--lib --profile test"; do
            cargo clippy -p crazyagent $set --locked -- -D warnings 2>&1 | tail -n 60
            rc=${PIPESTATUS[0]}
            printf '| clippy -p crazyagent %s | %s |\n' "$set" "$rc" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          exit "$failed"
      - name: Build the native auth host the restart rows launch
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent --locked
          echo "CRAZYAGENT_TEST_NATIVE_AUTH_HOST=$GITHUB_WORKSPACE/target/debug/crazyagent" >> "$GITHUB_ENV"
      - name: The REST rows and their neighbours at the tip
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          dbus-run-session -- bash -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec cargo test -p crazyagent --lib --locked --no-fail-fast -- engine::owner::transport::narrowing_rest_tests engine::owner::transport::native_auth_restart_tests engine::owner::transport::barrier_tests engine::owner::transport::secret_storage_wait_tests storage::trash storage::plugins storage::narrowing storage::migrations storage::owner_actor_tests --test-threads=4' > "$RUNNER_TEMP/rows.log" 2>&1
          rc=$?
          grep -E '^test .* (ok|FAILED|ignored)$' "$RUNNER_TEMP/rows.log" | sort > "$RUNNER_TEMP/verdicts.txt"
          grep -E '^test result:' "$RUNNER_TEMP/rows.log" || true
          grep -E 'FAILED$' "$RUNNER_TEMP/verdicts.txt" || true
          grep -E 'panicked at|error\[E' -A3 "$RUNNER_TEMP/rows.log" | head -n 120 || true
          {
            printf '| Linux rows at %s | exit %s |\n| --- | --- |\n' "${TIP:0:9}" "$rc"
            printf '| passed | %s |\n' "$(grep -c ' ok$' "$RUNNER_TEMP/verdicts.txt" || true)"
            printf '| failed | %s |\n' "$(grep -c ' FAILED$' "$RUNNER_TEMP/verdicts.txt" || true)"
            grep ' FAILED$' "$RUNNER_TEMP/verdicts.txt" | sed 's/^test /| red | /; s/ \.\.\. FAILED$/ |/' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
