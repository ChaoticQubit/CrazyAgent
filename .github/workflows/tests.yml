name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: B23 CR10 and CR9 kernel-sandbox clippy on ${{ matrix.os }} at ${{ matrix.side }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            side: tip
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='CR9 pick %H %s' HEAD^
          git log -1 --format='CR10 fix %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = ba209aa1366ed4902e233bedb6028ffa515e7e69 ] || { echo "::error::the grandparent is not the CR10 fix"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = 1fdea8a10a1eb3e4a707afb751ad7facb70db82a ] || { echo "::error::HEAD~3 is not the CR10 red rows"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = f0a086aaedf8fb960af9ad174abf7381706b2077 ] || { echo "::error::HEAD~4 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD^^ HEAD^)" = crates/kernel/sandbox/src/grants/tests.rs ] || { echo "::error::the CR9 pick touches more than grants/tests.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the CR9 pick on the CR10 fix"; exit 1; }
          if [ "${{ matrix.side }}" = base ]; then
            git checkout HEAD~3 -- crates/kernel/sandbox/src/paths.rs crates/kernel/sandbox/src/paths/tests.rs
            git checkout HEAD~4 -- crates/kernel/sandbox/src/grants/tests.rs
            git diff --quiet HEAD~3 -- crates/kernel/sandbox/src/paths.rs crates/kernel/sandbox/src/paths || { echo "::error::the paths files are not the red rows commit"; exit 1; }
            git diff --quiet HEAD~4 -- crates/kernel/sandbox/src/paths.rs crates/kernel/sandbox/src/grants || { echo "::error::paths.rs or grants is not the base"; exit 1; }
            git diff --stat HEAD^ -- crates/kernel/sandbox
            echo "side base: paths.rs and grants/tests.rs at the base, the CR10 rows from the red commit"
          fi
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: kernel-sandbox clippy --lib --tests with warnings denied at tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.side == 'tip' }}
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +Checking crazyagent-kernel-sandbox ' "$log" || true)"
          echo "clippy side ${{ matrix.side }} rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
