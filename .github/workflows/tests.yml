name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RED_SHA: da2ad4014
  TIP_SHA: cf24c0f01

defaults:
  run:
    shell: bash

jobs:
  w3-4a:
    name: V244 W3-4a land r3 short-name alias on ${{ matrix.runner }}, red at da2ad4014, tip cf24c0f01
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: windows-2025
          - runner: ubuntu-22.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 30
      - name: Install Linux build packages
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Check the tree is the tip
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" -- crates
          echo "crates at $TIP_SHA"
      - name: Clippy on crazyagent-win-sandbox
        timeout-minutes: 40
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy on the crazyagent library
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy on the crazyagent test rows
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: W1 private rows in crazyagent-win-sandbox (fix10 delete rows and the deletable secret file row)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p crazyagent-win-sandbox --locked --test private_windows -- --test-threads 1 --show-output 2>&1 | tee "$RUNNER_TEMP/w1.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test |^test result|a low-il' "$RUNNER_TEMP/w1.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/w1.log"
          grep -q 'a_deletable_secret_file_is_read_while_held_and_deleted_through_its_own_handle \.\.\. ok' "$RUNNER_TEMP/w1.log"
      - name: W3-4a r3 red rows at da2ad4014 under a temp folder with no short name
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p /c/w34atmp
          git checkout -q "$RED_SHA" -- crates
          set +e
          TMP='C:\w34atmp' TEMP='C:\w34atmp' cargo test -p crazyagent --lib --locked -- --test-threads 1 --exact engine::bootstrap::anchor_windows_tests::an_anchor_given_as_a_short_name_or_another_case_opens_at_its_plain_long_name engine::owner::transport::root_windows_tests::a_short_name_root_and_a_verbatim_unc_root_are_refused 2>&1 | tee "$RUNNER_TEMP/red.log"
          rc=${PIPESTATUS[0]}
          set -e
          git checkout -q "$TIP_SHA" -- crates
          git diff --quiet "$TIP_SHA" -- crates
          grep -E '^test .*_windows_tests|^test result|panicked|short name' "$RUNNER_TEMP/red.log" || true
          [ "$rc" -ne 0 ]
          grep -qE 'test result: FAILED\. 0 passed; 2 failed' "$RUNNER_TEMP/red.log"
          [ "$(grep -c "spelled with a short name" "$RUNNER_TEMP/red.log")" -ge 2 ]
          echo "red as expected: both rows assumed a short-named temp folder at da2ad4014"
      - name: W3-4a r3 rows at the tip cf24c0f01 under the same temp folder
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set +e
          TMP='C:\w34atmp' TEMP='C:\w34atmp' cargo test -p crazyagent --lib --locked -- --test-threads 1 --show-output --exact engine::bootstrap::anchor_windows_tests::an_anchor_given_as_a_short_name_or_another_case_opens_at_its_plain_long_name engine::owner::transport::root_windows_tests::a_short_name_root_and_a_verbatim_unc_root_are_refused 2>&1 | tee "$RUNNER_TEMP/r3.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*_windows_tests|^test result|panicked|SKIP' "$RUNNER_TEMP/r3.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 2 passed; 0 failed' "$RUNNER_TEMP/r3.log"
          [ "$(grep -c '^SKIP' "$RUNNER_TEMP/r3.log" || true)" -eq 0 ]
      - name: W3-4a, W3-2 and W3-1 rows at the tip cf24c0f01
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- --test-threads 1 engine::owner::transport::key_windows_tests:: engine::owner::transport::root_windows_tests:: engine::bootstrap::anchor_windows_tests:: storage::projects_home::engine_root_windows_tests:: projects_home::compare_windows_tests:: 2>&1 | tee "$RUNNER_TEMP/tip.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test .*_windows_tests|^test result|panicked' "$RUNNER_TEMP/tip.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. 38 passed; 0 failed' "$RUNNER_TEMP/tip.log"
      - name: Unix projects-home and storage rows at the tip cf24c0f01
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 60
        run: |
          set +e
          cargo test -p crazyagent --lib --locked -- projects_home 2>&1 | tee "$RUNNER_TEMP/unix.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^test result|FAILED|panicked' "$RUNNER_TEMP/unix.log" || true
          [ "$rc" -eq 0 ]
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/unix.log"
