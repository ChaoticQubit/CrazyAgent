name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  git-sigpipe-probe:
    name: Engine git signature program SIGPIPE probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
          - runner: ubuntu-24.04
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Exit codes of engine-style git log --show-signature per armor and program, quiet, pinned and oversubscribed
        timeout-minutes: 35
        shell: bash
        env:
          RUNS: "2000"
        run: |
          set -u
          runs=${RUNS:-2000}
          base=$(mktemp -d)
          root=$base/owner
          mkdir -p "$root" "$base/home"
          g() { env -i HOME="$base/home" PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 /usr/bin/git -C "$root" "$@"; }
          g init -q --template=
          tree=$(g hash-object -t tree -w /dev/null)
          p="Owner <owner@example.invalid> 1700000000 +0000"
          : > "$base/allowed_signers"
          g config gpg.ssh.allowedSignersFile "$base/allowed_signers"
          g config log.showSignature true
          declare -A commit
          for armor in ssh pgp x509; do
            case $armor in
              ssh) b='-----BEGIN SSH SIGNATURE-----'; e='-----END SSH SIGNATURE-----' ;;
              pgp) b='-----BEGIN PGP SIGNATURE-----'; e='-----END PGP SIGNATURE-----' ;;
              x509) b='-----BEGIN SIGNED MESSAGE-----'; e='-----END SIGNED MESSAGE-----' ;;
            esac
            printf 'tree %s\nauthor %s\ncommitter %s\ngpgsig %s\n \n U0lHTkFUVVJF\n %s\n\nSigned subject\n' "$tree" "$p" "$p" "$b" "$e" > "$base/c.txt"
            commit[$armor]=$(g hash-object -t commit -w "$base/c.txt")
          done
          echo "$(uname -srm) nproc=$(nproc) $(/usr/bin/git --version)"
          one() {
            local armor=$1 prog=$2 wrap=$3 i=0 rc
            declare -A codes=()
            g update-ref HEAD "${commit[$armor]}"
            while [ $i -lt "$runs" ]; do
              $wrap env -i PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 /usr/bin/git --no-replace-objects --no-optional-locks -c core.hooksPath=/dev/null -c gpg.program="$prog" -c gpg.x509.program="$prog" -c gpg.ssh.program="$prog" --git-dir "$root/.git" --work-tree "$root" log --show-signature -1 --format=%s < /dev/null > /dev/null 2>&1
              rc=$?
              codes[$rc]=$(( ${codes[$rc]:-0} + 1 ))
              i=$((i+1))
            done
            local line=""
            for k in "${!codes[@]}"; do line="$line rc$k=${codes[$k]}"; done
            echo "  armor=$armor program=$prog runs=$runs$line"
          }
          pass() {
            local label=$1 wrap=$2
            echo "== $label"
            for prog in /usr/bin/false /dev/null; do
              for armor in ssh pgp x509; do one "$armor" "$prog" "$wrap"; done
            done
          }
          pass quiet ""
          pass pinned-cpu0 "taskset -c 0"
          n=$(( $(nproc) * 3 ))
          pids=()
          for _ in $(seq "$n"); do (while :; do :; done) & pids+=($!); done
          pass "oversubscribed-$n-busy-loops" ""
          pass "oversubscribed-and-pinned-cpu0" "taskset -c 0"
          kill "${pids[@]}" 2>/dev/null
          wait 2>/dev/null
          rm -rf "$base"
