name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  B_RED: team::runtime::tests::hidden_seers_tests::a_held_live_master_stays_down_until_restart_them
  B_GUARD: team::runtime::tests::hidden_seers_tests::a_live_master_that_is_not_held_still_starts
  GATE_SH: |
    set -uo pipefail
    name=$1
    log=$2
    n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
    echo "crate gate $name $n"
    [ "$n" -ge 1 ] || { echo "::error::$name did not build crazyagent"; exit 1; }
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    shift
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -60 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    echo "$name expect pass listed $listed rc $rc passed $passed failed $failed"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$passed" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; }

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: RV-B26-ROW14-CR1 on ubuntu-22.04, compile red at fc0ef5bca3 then the tip rows and clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='fix %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = cce57142a02a918c6f6af5c1ce1feac5021c2667 ] || { echo "::error::the parent is not the fix"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = fc0ef5bca35dc4249e8dff6553296bf1a1041af5 ] || { echo "::error::HEAD~2 is not the reviewed tip"; exit 1; }
          [ "$(git diff --name-only HEAD~2 HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/team/runtime.rs " ] || { echo "::error::the fix touches more than runtime.rs"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Write the row runner and the crate gate
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          printf '%s\n' "$GATE_SH" > "$RUNNER_TEMP/gate.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/gate.sh"
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux on Linux
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo chmod go-w /usr/local/bin
          test -z "$(find /usr/local/bin -maxdepth 0 -perm /022)"
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the engine lib tests at fc0ef5bca3 do not compile on Linux
        timeout-minutes: 120
        run: |
          set -uo pipefail
          git checkout fc0ef5bca35dc4249e8dff6553296bf1a1041af5 -- crates/crazyagent/src/team/runtime.rs
          [ "$(git diff --name-only HEAD^ | tr '\n' ' ')" = "crates/crazyagent/src/team/runtime.rs " ] || { echo "::error::the red tree differs from the fix in more than runtime.rs"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run > "$RUNNER_TEMP/build-red.log" 2>&1
          rc=$?
          grep -E '^error(\[|:)' -A6 "$RUNNER_TEMP/build-red.log" | head -40 || true
          hits=$(grep -cE 'no method named .with_tools_refresh. found' "$RUNNER_TEMP/build-red.log" || true)
          echo "red build rc $rc with_tools_refresh errors $hits"
          git checkout HEAD^ -- crates/crazyagent/src/team/runtime.rs
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the fix tip"; exit 1; }
          [ "$rc" != 0 ] && [ "$hits" -ge 1 ] || { echo "::error::the build at fc0ef5bca3 did not fail on with_tools_refresh"; exit 1; }
      - name: Build the landlock helper beside the test binaries
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo build -p crazyagent --bin crazyagent-landlock --locked
          mkdir -p "$CARGO_TARGET_DIR/debug/deps"
          cp "$CARGO_TARGET_DIR/debug/crazyagent-landlock" "$CARGO_TARGET_DIR/debug/deps/crazyagent-landlock"
      - name: Build the engine lib tests at the tip
        timeout-minutes: 120
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo test -p crazyagent --lib --locked --no-run 2>&1 | tee "$RUNNER_TEMP/build-tip.log"
          bash "$RUNNER_TEMP/gate.sh" tip-build "$RUNNER_TEMP/build-tip.log"
      - name: Tip, a held live master stays down until Restart them
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" b-red-at-tip --exact "$B_RED"
      - name: Tip, a live master that is not held still starts
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" b-guard-at-tip --exact "$B_GUARD"
      - name: Tip, clippy on the engine lib and its tests
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          bash "$RUNNER_TEMP/gate.sh" clippy "$RUNNER_TEMP/clippy.log"
          echo "clippy errors $(grep -cE '^error(\[|:)' "$RUNNER_TEMP/clippy.log" || true) warnings $(grep -cE '^warning(\[|:)' "$RUNNER_TEMP/clippy.log" || true)"
