name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 3715cfafd2
  TIP_FULL: 3715cfafd27a2a2d3432bbeec8435373794bb05f

defaults:
  run:
    shell: bash

jobs:
  green:
    name: FREE-SCAN-UNINIT green at the tip on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022]
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='branch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: kernel-security rows read_limited_wipe and sealed_wipe
        timeout-minutes: 60
        run: |
          set +e
          fail=0
          for pair in read_limited_wipe:3 sealed_wipe:2; do
            name="${pair%%:*}"
            want="${pair##*:}"
            log="$RUNNER_TEMP/$name.log"
            cargo test -p crazyagent-kernel-security --test "$name" --locked > "$log" 2>&1
            code=$?
            grep -E '^test |test result:' "$log" || true
            ok="$(grep -cE '^test [a-z_0-9:]+ \.\.\. ok$' "$log")"
            failed="$(grep -cE '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log")"
            echo "GREEN $name rc $code ok ${ok:-0} failed ${failed:-0} expected ok $want"
            [ "$code" = 0 ] && [ "${ok:-0}" = "$want" ] && [ "${failed:-0}" = 0 ] || { tail -n 30 "$log"; fail=1; }
          done
          exit "$fail"
      - name: crazyagent rows
        if: always()
        timeout-minutes: 120
        run: |
          set +e
          fail=0
          for pair in masked_field_spare:5 secret_realloc_residue:1 mcp_config_secret_copies:1 secret_format_copies:3 secret_drops_wipe:1 secret_value_wipe:1; do
            name="${pair%%:*}"
            want="${pair##*:}"
            log="$RUNNER_TEMP/$name.log"
            cargo test -p crazyagent --test "$name" --locked > "$log" 2>&1
            code=$?
            grep -E '^test |test result:' "$log" || true
            ok="$(grep -cE '^test [a-z_0-9:]+ \.\.\. ok$' "$log")"
            failed="$(grep -cE '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log")"
            echo "GREEN $name rc $code ok ${ok:-0} failed ${failed:-0} expected ok $want"
            [ "$code" = 0 ] && [ "${ok:-0}" = "$want" ] && [ "${failed:-0}" = 0 ] || { tail -n 30 "$log"; fail=1; }
          done
          exit "$fail"

  red:
    name: FREE-SCAN-UNINIT red at ${{ matrix.sha }} on macos-15
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: 0e242e0df8
            rows: "crazyagent:masked_field_spare:a_masked_field_backspaced_then_dropped_frees_no_byte_of_the_removed_text,a_masked_field_deleted_from_then_dropped_frees_no_byte_of_the_removed_text,a_masked_field_pasted_into_frees_no_copy_of_the_paste,a_masked_field_word_erased_then_dropped_frees_no_copy_of_the_word,typing_into_a_masked_field_frees_no_copy_of_a_typed_character"
          - sha: 842bee21d5
            rows: "crazyagent:secret_realloc_residue:a_probe_request_frees_no_copy_of_its_key crazyagent-kernel-security:read_limited_wipe:ANY"
          - sha: 3b50d510c9
            rows: "crazyagent:mcp_config_secret_copies:a_claude_mcp_config_frees_no_copy_of_a_secret"
          - sha: 2407b22359
            rows: "crazyagent:secret_format_copies:a_curl_request_frees_no_copy_of_its_token,a_relayed_request_frees_no_copy_of_the_key"
          - sha: 760b797a2b
            rows: "crazyagent:secret_drops_wipe:secret_types_free_only_zeros"
          - sha: 3b4f938aca
            rows: "crazyagent-kernel-security:sealed_wipe:a_dropped_secret_frees_no_byte_a_truncate_left_past_its_length"
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tmux from the fix tip
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Keep the tip's allocator blocks, then check out the red sha
        env:
          RED: ${{ matrix.sha }}
          ROWS: ${{ matrix.rows }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not the fix tip $TIP_FULL"; exit 1; }
          mkdir -p "$RUNNER_TEMP/blocks"
          for spec in $ROWS; do
            test_name="$(echo "$spec" | cut -d: -f2)"
            file="$(git ls-files "crates/*/tests/$test_name.rs" "crates/kernel/*/tests/$test_name.rs" | head -n 1)"
            test -n "$file"
            sed -n '/^\/\/\/ The system allocator/,/^static ALLOCATOR/p' "$file" > "$RUNNER_TEMP/blocks/$test_name.rs"
            grep -q 'alloc_zeroed' "$RUNNER_TEMP/blocks/$test_name.rs"
            echo "$test_name=$file" >> "$RUNNER_TEMP/blocks/files"
          done
          git checkout --detach "$RED"
          git log -1 --format='red %H %s'
          while IFS='=' read -r test_name file; do
            block="$RUNNER_TEMP/blocks/$test_name.rs"
            awk -v blk="$block" 'BEGIN { while ((getline line < blk) > 0) text = text line "\n" } /^\/\/\/ The system allocator/ { skip = 1; printf "%s", text } skip && /^static ALLOCATOR/ { skip = 0; next } !skip' "$file" > "$RUNNER_TEMP/swap.rs"
            mv "$RUNNER_TEMP/swap.rs" "$file"
            [ "$(grep -c 'alloc_zeroed' "$file")" = 1 ] || { echo "::error::the swap missed $file"; exit 1; }
            git diff --stat -- "$file"
            git diff -- "$file"
          done < "$RUNNER_TEMP/blocks/files"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Red rows
        timeout-minutes: 120
        env:
          ROWS: ${{ matrix.rows }}
        run: |
          set +e
          fail=0
          for spec in $ROWS; do
            package="$(echo "$spec" | cut -d: -f1)"
            test_name="$(echo "$spec" | cut -d: -f2)"
            want="$(echo "$spec" | cut -d: -f3 | tr ',' '\n' | sort)"
            log="$RUNNER_TEMP/$test_name.log"
            cargo test -p "$package" --test "$test_name" --locked > "$log" 2>&1
            code=$?
            grep -E '^test |test result:' "$log" || true
            got="$(grep -E '^test [a-z_0-9:]+ \.\.\. FAILED$' "$log" | sed -E 's/^test ([a-z_0-9:]+) .*/\1/' | sort)"
            count="$(printf '%s' "$got" | grep -c . )"
            echo "RED $test_name rc $code failed ${count:-0}: $(printf '%s' "$got" | tr '\n' ' ')"
            if [ "$want" = ANY ]; then
              [ "${count:-0}" -ge 1 ] || { echo "::error::$test_name has no red row"; tail -n 40 "$log"; fail=1; }
            else
              [ "$got" = "$want" ] || { echo "::error::$test_name red rows differ; want: $(printf '%s' "$want" | tr '\n' ' ')"; tail -n 40 "$log"; fail=1; }
            fi
          done
          exit "$fail"
