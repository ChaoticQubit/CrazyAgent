name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: a5a153e8648358f12e74459c6f77fb861047d8a1
  RED: 9590acc20eaf58820d436fca83022ac693ef77ba
  DEVICE_ROW: a_stock_machine_reads_both_device_lists_and_holds_neither_grant

defaults:
  run:
    shell: bash

jobs:
  b2-rows:
    name: Admin step B2 ${{ matrix.runner }}, the live device row red at the red commit and green at the tip, the crate's library rows, clippy
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow and drop the probe file so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$RED" "$TIP"
          test "$(git diff --name-only "$TIP" HEAD | sort | tr '\n' ' ')" = ".github/farm/runasprobe.rs .github/workflows/tests.yml "
          git checkout "$TIP" -- .github/workflows/tests.yml
          git rm -q .github/farm/runasprobe.rs
          git diff --quiet "$TIP"
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Red, the 8 pure rows and the live device row at the red commit's crate fail on its stubs
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          git checkout "$RED" -- crates/crazyagent-win-sandbox
          test "$(git diff --name-only "$RED" -- crates | wc -l)" -eq 0 || { echo "CRATES ARE NOT THE RED COMMIT"; exit 1; }
          cargo test -p crazyagent-win-sandbox --lib --locked -- admin_step:: dacl::tests::the_device_grants > "$RUNNER_TEMP/red-pure.txt" 2>&1
          rc_pure=$?
          grep -E "^test |^test result" "$RUNNER_TEMP/red-pure.txt" | cut -c1-300 | head -20
          [ "$rc_pure" -ne 0 ] || { echo "RED PURE ROWS PASSED, expected failures"; exit 1; }
          grep -q "^test result: FAILED\. 0 passed; 8 failed" "$RUNNER_TEMP/red-pure.txt" || { echo "RED PURE ROWS ARE NOT 8 FAILED OF 8"; exit 1; }
          [ "$(grep -c "not yet implemented: B2" "$RUNNER_TEMP/red-pure.txt")" -eq 8 ] || { echo "NOT EVERY PURE ROW FAILED ON ITS STUB"; exit 1; }
          cargo test -p crazyagent-win-sandbox --test device_grants_windows --locked -- --ignored --exact "$DEVICE_ROW" > "$RUNNER_TEMP/red.txt" 2>&1
          rc=$?
          grep -E "^test |^test result|panicked|not yet implemented|error\[" "$RUNNER_TEMP/red.txt" | cut -c1-300 | head -20
          [ "$rc" -ne 0 ] || { echo "RED DEVICE ROW PASSED, expected a failure"; exit 1; }
          grep -q "not yet implemented: B2" "$RUNNER_TEMP/red.txt" || { echo "RED DEVICE ROW DID NOT FAIL ON ITS STUB"; exit 1; }
          git checkout "$TIP" -- crates/crazyagent-win-sandbox
          git diff --quiet "$TIP" || { echo "TREE IS NOT THE TIP AFTER THE RED LEG"; exit 1; }
          echo "red ok"
      - name: Green, the live device row reads both stock device lists and finds neither grant
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent-win-sandbox --test device_grants_windows --locked -- --ignored --exact "$DEVICE_ROW" > "$RUNNER_TEMP/device.txt" 2>&1
          rc=$?
          grep -E "^test |^test result|panicked|left|right" "$RUNNER_TEMP/device.txt" | cut -c1-300 | head -20
          [ "$rc" -eq 0 ] || { echo "DEVICE ROW FAILED"; exit 1; }
          grep -q "^test $DEVICE_ROW \.\.\. ok$" "$RUNNER_TEMP/device.txt" || { echo "DEVICE ROW DID NOT RUN"; exit 1; }
      - name: The crate's library rows, the admin step and device grant rows named
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent-win-sandbox --lib --locked > "$RUNNER_TEMP/lib.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/lib.txt" | cut -c1-300 | head -20
          grep -cE "^test admin_step::tests::.* ok$" "$RUNNER_TEMP/lib.txt"
          grep -E "^test (admin_step::tests::|dacl::tests::the_device_grants).* ok$" "$RUNNER_TEMP/lib.txt"
          [ "$rc" -eq 0 ] || { echo "LIBRARY ROWS FAILED"; exit 1; }
          [ "$(grep -cE "^test admin_step::tests::.* ok$" "$RUNNER_TEMP/lib.txt")" -eq 7 ] || { echo "NOT ALL 7 ADMIN STEP ROWS RAN"; exit 1; }
          grep -q "^test dacl::tests::the_device_grants_are_nul_read_write_and_the_mount_manager_lookup \.\.\. ok$" "$RUNNER_TEMP/lib.txt" || { echo "DEVICE GRANT TABLE ROW DID NOT RUN"; exit 1; }
      - name: Clippy, the crate with every target
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings

  p4-probe:
    name: Admin step P4 ${{ matrix.runner }}, what runas returns to a standard user without a desktop, and whether that user sees a SYSTEM task and reads the HKLM record
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the runas probe with rustc alone
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cp .github/farm/runasprobe.rs "$RUNNER_TEMP/runasprobe.rs"
          rustc +"$RUST_TOOLCHAIN" --edition 2021 -O "$RUNNER_TEMP/runasprobe.rs" -o "$RUNNER_TEMP/runasprobe.exe"
      - name: Probe as the runner and as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          foreach ($name in 'EnableLUA', 'ConsentPromptBehaviorAdmin', 'ConsentPromptBehaviorUser', 'PromptOnSecureDesktop') {
            $value = (Get-ItemProperty -LiteralPath $policy -Name $name -ErrorAction SilentlyContinue).$name
            Write-Host "P4 policy $name=$value"
          }
          Write-Host "P4 runner session $([System.Diagnostics.Process]::GetCurrentProcess().SessionId) interactive $([Environment]::UserInteractive)"
          $probe = Join-Path $env:RUNNER_TEMP 'runasprobe.exe'
          $task = '\CrazyAgent\Device access'
          & "$env:SystemRoot\System32\schtasks.exe" /Create /TN $task /SC ONSTART /RU SYSTEM /TR "$env:SystemRoot\System32\cmd.exe /c exit 0" /F
          Write-Host "P4 runner schtasks create exit $LASTEXITCODE"
          & "$env:SystemRoot\System32\reg.exe" add 'HKLM\SOFTWARE\CrazyAgent\AdminStep' /v Version /t REG_DWORD /d 1 /f | Out-Null
          & "$env:SystemRoot\System32\reg.exe" add 'HKLM\SOFTWARE\CrazyAgent\AdminStep' /v Users /t REG_MULTI_SZ /d 'S-1-5-21-1-2-3-1000' /f | Out-Null
          Write-Host "P4 runner reg add exit $LASTEXITCODE"
          $user = 'castd'
          $alphabet = [char[]]'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = (-join (1..24 | ForEach-Object { $alphabet | Get-Random })) + 'aZ7!'
          net user $user $password /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net user failed with $LASTEXITCODE" }
          $admins = net localgroup Administrators
          if ($admins -contains $user) { throw "$user is an administrator" }
          icacls $env:RUNNER_TEMP /grant "${user}:(OI)(CI)(RX)" /C /Q | Out-Null
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          function Invoke-AsUser([string]$name, [string]$program, [string[]]$arguments) {
            $start = [System.Diagnostics.ProcessStartInfo]::new($program)
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $start.UserName = $user
            $start.Domain = '.'
            $start.Password = $secure
            $start.LoadUserProfile = $true
            $start.UseShellExecute = $false
            $start.WorkingDirectory = $env:RUNNER_TEMP
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            try {
              $process = [System.Diagnostics.Process]::Start($start)
            } catch {
              Write-Host "P4 castd $name did not start: $($_.Exception.Message)"
              return
            }
            $out = $process.StandardOutput.ReadToEndAsync()
            $err = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(120000)) {
              Write-Host "P4 castd $name timed out after 120 s"
              $process.Kill($true)
            }
            $process.WaitForExit()
            Write-Host "P4 castd $name exit $($process.ExitCode)"
            Write-Host $out.Result
            Write-Host $err.Result
          }
          foreach ($mode in 'ui', 'noui') {
            $runner = Start-Process -FilePath $probe -ArgumentList $mode -NoNewWindow -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "runner-$mode.txt")
            if (-not $runner.WaitForExit(120000)) {
              Write-Host "P4 runner probe $mode timed out after 120 s"
              $runner.Kill($true)
            }
            $runner.WaitForExit()
            Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "runner-$mode.txt") | Write-Host
            Write-Host "P4 runner probe $mode exit $($runner.ExitCode)"
          }
          Invoke-AsUser 'whoami' "$env:SystemRoot\System32\whoami.exe" @('/groups')
          Invoke-AsUser 'runas-ui' $probe @('ui')
          Invoke-AsUser 'runas-noui' $probe @('noui')
          Invoke-AsUser 'schtasks-query' "$env:SystemRoot\System32\schtasks.exe" @('/Query', '/TN', $task)
          Invoke-AsUser 'schtasks-list' "$env:SystemRoot\System32\schtasks.exe" @('/Query', '/FO', 'CSV', '/NH')
          Invoke-AsUser 'reg-query' "$env:SystemRoot\System32\reg.exe" @('query', 'HKLM\SOFTWARE\CrazyAgent\AdminStep')
          & "$env:SystemRoot\System32\schtasks.exe" /Query /TN $task
          Write-Host "P4 runner schtasks query exit $LASTEXITCODE"
          & "$env:SystemRoot\System32\schtasks.exe" /Delete /TN $task /F
          & "$env:SystemRoot\System32\reg.exe" delete 'HKLM\SOFTWARE\CrazyAgent' /f | Out-Null
          net user $user /delete | Out-Null
          exit 0
