name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 07c5c6cec21f8df2a0f707bde96080d59b060a6b
  BASE: 4f20f95df466bdba1c187262fd4be653ab3b532d
  FILES: "crates/crazyagent/src/engine/native_auth_host/claude_auth/channel.rs crates/crazyagent/src/engine/native_auth_host/entry_run_tests.rs crates/crazyagent/src/engine/native_auth_host/entry_tests.rs crates/crazyagent/src/engine/owner/transport.rs crates/crazyagent/src/engine/owner/transport/account_profile.rs crates/crazyagent/src/engine/owner/transport/accounts.rs crates/crazyagent/src/engine/owner/transport/agents.rs crates/crazyagent/src/engine/owner/transport/app_plugins.rs crates/crazyagent/src/engine/owner/transport/changes.rs crates/crazyagent/src/engine/owner/transport/cleanup.rs crates/crazyagent/src/engine/owner/transport/github.rs crates/crazyagent/src/engine/owner/transport/harness_catalog.rs crates/crazyagent/src/engine/owner/transport/harness_catalog/updates.rs crates/crazyagent/src/engine/owner/transport/icloud.rs crates/crazyagent/src/engine/owner/transport/ide.rs crates/crazyagent/src/engine/owner/transport/ide_extensions.rs crates/crazyagent/src/engine/owner/transport/ide_tab.rs crates/crazyagent/src/engine/owner/transport/intake.rs crates/crazyagent/src/engine/owner/transport/key_windows_tests.rs crates/crazyagent/src/engine/owner/transport/native_auth.rs crates/crazyagent/src/engine/owner/transport/native_auth_channel.rs crates/crazyagent/src/engine/owner/transport/native_auth_channel/reproof.rs crates/crazyagent/src/engine/owner/transport/native_auth_channel_tests.rs crates/crazyagent/src/engine/owner/transport/overview.rs crates/crazyagent/src/engine/owner/transport/owner_server_tests.rs crates/crazyagent/src/engine/owner/transport/plugins.rs crates/crazyagent/src/engine/owner/transport/process.rs crates/crazyagent/src/engine/owner/transport/questions.rs crates/crazyagent/src/engine/owner/transport/recovery.rs crates/crazyagent/src/engine/owner/transport/reply_skew_tests.rs crates/crazyagent/src/engine/owner/transport/roadmap.rs crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/engine/owner/transport/usage.rs crates/crazyagent/src/engine/owner/transport/watch.rs crates/crazyagent/src/engine/secret_frame.rs crates/crazyagent/src/ide/bridge.rs crates/crazyagent/src/ide/bridge/residue_tests.rs crates/crazyagent/src/ide/bridge/tests.rs crates/crazyagent/tests/freed_bytes_support/mod.rs crates/crazyagent/tests/masked_field_spare.rs crates/crazyagent/tests/mcp_config_secret_copies.rs crates/crazyagent/tests/owner_bootstrap.rs crates/crazyagent/tests/owner_client.rs crates/crazyagent/tests/owner_token_residue.rs crates/crazyagent/tests/project_conversation.rs crates/crazyagent/tests/secret_drops_wipe.rs crates/crazyagent/tests/secret_format_copies.rs crates/crazyagent/tests/secret_realloc_residue.rs crates/crazyagent/tests/secret_value_wipe.rs crates/crazyagent/tests/trusted_worker_dispatch.rs "

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Pod D line rows on ubuntu-22.04, tip 07c5c6cec2 vs base 4f20f95df4, one test target at a time
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the line tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the line tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the line tip"; exit 1; }
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the locked crates at the tip and at the base
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
          git diff --quiet "$BASE" HEAD^ -- Cargo.lock || { git show "$BASE:Cargo.lock" > "$RUNNER_TEMP/base.lock"; cp Cargo.lock "$RUNNER_TEMP/tip.lock"; cp "$RUNNER_TEMP/base.lock" Cargo.lock; cargo fetch --locked; cp "$RUNNER_TEMP/tip.lock" Cargo.lock; }
          git diff --quiet HEAD^ || { echo "::error::the tree is not the line tip"; exit 1; }
      - name: Write the rows script
        run: |
          cat > "$RUNNER_TEMP/rows.sh" <<'ROWS_EOF'
          set +e
          set -uo pipefail
          side=$1
          os=$2
          out="$RUNNER_TEMP/rows-$side"
          mkdir -p "$out"
          : > "$out/failed.txt"
          exe=""
          [ "$os" = windows ] && exe=.exe
          target="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          features="--features crazyagent/owner-trace"
          grep -Eq '^owner-trace[[:space:]]*=' crates/crazyagent/Cargo.toml || features=""
          echo "SIDE $side $(git rev-parse --short=10 HEAD) os $os features ${features:-none}"
          cargo build -p crazyagent --bin crazyagent --bin crazyagent-landlock $features --locked --offline > "$out/bins.log" 2>&1
          echo "BINS $side rc $?"
          mkdir -p "$target/debug/deps"
          cp "$target/debug/crazyagent-landlock$exe" "$target/debug/deps/crazyagent-landlock$exe"
          if [ "$os" = windows ]; then
            cargo build -p crazyagent-win-sandbox --bin crazyagent-win-boundary --locked --offline > "$out/boundary.log" 2>&1
            echo "BOUNDARY $side rc $?"
            cp "$target/debug/crazyagent-win-boundary.exe" "$target/debug/deps/crazyagent-win-boundary.exe"
          fi
          export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$target/debug/crazyagent$exe"
          unset CRAZYAGENT_CONTEXT_MODE_INSTALL
          zero=0
          one() {
            label=$1
            shift
            name=$(printf '%s' "$label" | tr -c 'A-Za-z0-9_' '_')
            cargo test -p crazyagent $features --locked --offline "$@" --list > "$out/$name-list.log" 2>&1
            listed=$(grep -cE ': test$' "$out/$name-list.log" || true)
            cargo test -p crazyagent $features --locked --offline "$@" --test-threads=1 > "$out/$name.log" 2>&1
            rc=$?
            result=$(grep -E '^test result' "$out/$name.log" | tail -1 | sed -E 's/.*(ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed.*/\1 passed \2 failed \3/' || true)
            control=$(grep -cE 'a_copy_reads_every_byte_of_a_block \.\.\. ok' "$out/$name.log" || true)
            echo "ROWS $side $label listed $listed rc $rc ${result:-no-result} control $control"
            grep -E '^(error|test .* FAILED$)' "$out/$name.log" | head -8 || true
            grep -E '^test .* FAILED$' "$out/$name.log" | awk -v l="$label" '{print l"::"$2}' >> "$out/failed.txt" || true
            if [ "$side" = tip ] && [ "$listed" = 0 ]; then
              echo "::error::$label lists 0 rows at the tip"
              zero=1
            fi
          }
          lib="engine::owner::transport:: ide::bridge:: engine::secret_frame::"
          [ "$os" = linux ] && lib="$lib engine::native_auth_host::"
          cargo test -p crazyagent $features --lib --locked --offline --no-run > "$out/lib-build.log" 2>&1
          echo "LIB-BUILD $side rc $?"
          for filter in $lib; do
            one "lib/$filter" --lib -- "$filter"
          done
          echo "SKIPPED $side lib/ide::server:: cfg(target_os = macos)"
          [ "$os" = linux ] || echo "SKIPPED $side lib/engine::native_auth_host:: cfg(unix)"
          files="masked_field_spare mcp_config_secret_copies secret_drops_wipe secret_format_copies secret_realloc_residue secret_value_wipe"
          if [ "$os" = linux ]; then
            files="owner_token_residue owner_bootstrap owner_client project_conversation trusted_worker_dispatch $files"
          else
            echo "SKIPPED $side owner_token_residue owner_bootstrap owner_client project_conversation trusted_worker_dispatch cfg(unix)"
          fi
          for file in $files; do
            one "test/$file" --test "$file" --
          done
          sort -o "$out/failed.txt" "$out/failed.txt"
          echo "FAILED $side $(wc -l < "$out/failed.txt" | tr -d ' ') zero $zero"
          echo "$zero" > "$out/zero"
          ROWS_EOF
      - name: Tip, each test target once (expect listed above 0 at every filter and file)
        if: ${{ !cancelled() }}
        timeout-minutes: 140
        run: |
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the line tip"; exit 1; }
          dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm bash "$RUNNER_TEMP/rows.sh" tip linux
      - name: Base, the same targets after a checkout of the base
        if: ${{ !cancelled() }}
        timeout-minutes: 140
        run: |
          set -uo pipefail
          git checkout -q -f "$BASE"
          if [ "$(git rev-parse HEAD)" != "$BASE" ] || ! git diff --quiet "$BASE"; then echo "::error::the tree is not the base"; exit 1; fi
          df -h "$GITHUB_WORKSPACE" | tail -1
          dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm bash "$RUNNER_TEMP/rows.sh" base linux
      - name: Diff, FAILED names tip vs base (expect tip-only 0 and no zero-listed target)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          tip="$RUNNER_TEMP/rows-tip/failed.txt"
          base="$RUNNER_TEMP/rows-base/failed.txt"
          [ -f "$tip" ] && [ -f "$base" ] || { echo "::error::a side wrote no FAILED list"; exit 1; }
          only=$(comm -23 "$tip" "$base" | wc -l | tr -d ' ')
          gone=$(comm -13 "$tip" "$base" | wc -l | tr -d ' ')
          zero=$(cat "$RUNNER_TEMP/rows-tip/zero")
          echo "DIFF tip $(wc -l < "$tip" | tr -d ' ') base $(wc -l < "$base" | tr -d ' ') tip-only $only base-only $gone zero $zero"
          comm -23 "$tip" "$base" | sed 's/^/TIP-ONLY /'
          comm -13 "$tip" "$base" | sed 's/^/BASE-ONLY /'
          [ "$only" = 0 ] && [ "$zero" = 0 ] || { echo "::error::a tip-only red or a zero-listed target"; exit 1; }
  windows:
    name: Pod D line rows on windows-2022, tip 07c5c6cec2 vs base 4f20f95df4, one test target at a time
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
