name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CHROME_VERSION: "151.0.7922.34"
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FIX: c99eaaf8cc0b74b38f7c3200d254604b44532935
  TIP: 866ed00c668da1fd1a4ed59a800baba77f849984
  MOVE: 56caa5cb5277e5eda1bca8c401a05d59537a2586
  RED: 8adccacd618d58ca4f658144ed8928562461f84f
  BASE: 2c025c9d2ba84848c7ff078024d9041aa3cf7831
  CAPS_BASE: c6c672b4726b8226a35e486089704f41e4f66230
  FILES: "apps/desktop/src/api-harness-path.ts apps/desktop/src/api-harness-updates.ts apps/desktop/src/api.ts apps/desktop/src/engine-client.ts apps/desktop/src/screens/dashboard/index.tsx apps/desktop/src/screens/first-run/harnesses.ts apps/desktop/src/screens/intake/clone.tsx apps/desktop/src/screens/intake/intake.ts apps/desktop/src/screens/new-project/index.tsx apps/desktop/src/screens/new-project/wizard.ts apps/desktop/src/screens/project/context.tsx apps/desktop/src/screens/project/research.ts apps/desktop/src/screens/settings/add-account.tsx apps/desktop/src/screens/settings/github.tsx apps/desktop/src/screens/settings/harnesses.tsx apps/desktop/src/screens/settings/plugins.tsx apps/desktop/src/screens/settings/profile.tsx apps/desktop/src/screens/settings/sign-in.tsx apps/desktop/src/ui/index.ts apps/desktop/src/ui/keys.ts apps/desktop/test/accounts.test.mjs apps/desktop/test/app.test.mjs apps/desktop/test/first-run-harnesses-words.test.mjs apps/desktop/test/harness-path.test.mjs apps/desktop/test/harness-updates.test.mjs apps/desktop/test/intake.test.mjs apps/desktop/test/new-project.test.mjs apps/desktop/test/no-opaque-failures.test.mjs apps/desktop/test/project-page.test.mjs apps/desktop/test/settings-access-layout.test.mjs apps/desktop/test/settings-harnesses-layout.test.mjs apps/desktop/test/settings-pack-layout.test.mjs apps/desktop/test/settings-plugins.test.mjs apps/desktop/test/settings-setup.test.mjs crates/crazyagent/src/lib.rs crates/crazyagent/src/plugins.rs crates/crazyagent/src/tui/client/settings/tests.rs crates/crazyagent/src/tui/frames/add-provider-120.macos.txt crates/crazyagent/src/tui/frames/add-provider-80.macos.txt crates/crazyagent/src/tui/frames/harnesses-120.macos.txt crates/crazyagent/src/tui/frames/harnesses-120.txt crates/crazyagent/src/tui/frames/home-first-120.txt crates/crazyagent/src/tui/frames/home-first-80.txt crates/crazyagent/src/tui/frames/plugin-add-80.macos.txt crates/crazyagent/src/tui/frames/plugin-add-80.txt crates/crazyagent/src/tui/render_tests.rs crates/crazyagent/src/tui/screens/computer_words_tests.rs crates/crazyagent/src/tui/screens/harness_setup.rs crates/crazyagent/src/tui/screens/home.rs crates/crazyagent/src/tui/screens/home/screen.rs crates/crazyagent/src/tui/screens/mod.rs crates/crazyagent/src/tui/screens/new_project.rs crates/crazyagent/src/tui/screens/new_project_tests.rs crates/crazyagent/src/tui/screens/settings/profile.rs crates/crazyagent/src/tui/screens/settings_accounts.rs crates/crazyagent/src/tui/screens/settings_accounts/tests.rs crates/crazyagent/src/tui/screens/settings_add_account.rs crates/crazyagent/src/tui/screens/settings_add_account/words.rs crates/crazyagent/src/tui/screens/settings_harnesses.rs crates/crazyagent/src/tui/screens/settings_harnesses/tests.rs crates/crazyagent/src/tui/screens/settings_harnesses/words.rs crates/crazyagent/src/tui/screens/settings_plugins.rs crates/crazyagent/src/tui/screens/settings_plugins/words.rs scripts/quality/caps-allow.json "
  RUST_FILES: crates/crazyagent/src/lib.rs crates/crazyagent/src/plugins.rs crates/crazyagent/src/tui/client/settings/tests.rs crates/crazyagent/src/tui/render_tests.rs crates/crazyagent/src/tui/screens/computer_words_tests.rs crates/crazyagent/src/tui/screens/harness_setup.rs crates/crazyagent/src/tui/screens/home.rs crates/crazyagent/src/tui/screens/home/screen.rs crates/crazyagent/src/tui/screens/mod.rs crates/crazyagent/src/tui/screens/new_project.rs crates/crazyagent/src/tui/screens/new_project_tests.rs crates/crazyagent/src/tui/screens/settings/profile.rs crates/crazyagent/src/tui/screens/settings_accounts.rs crates/crazyagent/src/tui/screens/settings_accounts/tests.rs crates/crazyagent/src/tui/screens/settings_add_account.rs crates/crazyagent/src/tui/screens/settings_add_account/words.rs crates/crazyagent/src/tui/screens/settings_harnesses.rs crates/crazyagent/src/tui/screens/settings_harnesses/tests.rs crates/crazyagent/src/tui/screens/settings_harnesses/words.rs crates/crazyagent/src/tui/screens/settings_plugins.rs crates/crazyagent/src/tui/screens/settings_plugins/words.rs
  LINUX_RED_ROWS: >-
    tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on
    tui::screens::computer_words_tests::plugin_and_profile_sentences_name_the_computer_the_build_runs_on
    tui::screens::new_project_tests::a_harness_the_engine_lists_as_cant_run_is_never_ready_the_default_or_picked
    tui::screens::settings_harnesses::tests::harness_list_frames_match_the_design
    tui::screens::settings_plugins::tests::the_server_form_checks_locally_and_hides_secret_values
  MAC_RED_ROWS: >-
    tui::screens::computer_words_tests::account_sentences_name_the_computer_the_build_runs_on
    tui::screens::settings_accounts::tests::add_account_provider_and_method_frames_match_the_design
    tui::client::settings::tests::add_account_offers_one_entry_per_company_and_adds_the_same_engine_accounts
  TIP_ROWS: >-
    tui::screens::computer_words_tests::harness_sentences_name_the_computer_the_build_runs_on
    tui::screens::computer_words_tests::account_sentences_name_the_computer_the_build_runs_on
    tui::screens::computer_words_tests::plugin_and_profile_sentences_name_the_computer_the_build_runs_on
    tui::screens::new_project_tests::a_harness_the_engine_lists_as_cant_run_is_never_ready_the_default_or_picked
    tui::screens::settings_harnesses::tests::harness_list_frames_match_the_design
    tui::screens::settings_plugins::tests::the_server_form_checks_locally_and_hides_secret_values
    tui::screens::settings_accounts::tests::add_account_provider_and_method_frames_match_the_design
    tui::client::settings::tests::add_account_offers_one_entry_per_company_and_adds_the_same_engine_accounts
    tui::render_tests::home_frames_match_the_design
    tui::screens::settings_harnesses::tests::every_update_sentence_is_the_desktop_sentence_and_no_two_are_alike
  NODE_RED_FILES: >-
    apps/desktop/test/accounts.test.mjs
    apps/desktop/test/app.test.mjs
    apps/desktop/test/harness-path.test.mjs
    apps/desktop/test/harness-updates.test.mjs
    apps/desktop/test/intake.test.mjs
    apps/desktop/test/new-project.test.mjs
    apps/desktop/test/no-opaque-failures.test.mjs
    apps/desktop/test/project-page.test.mjs
    apps/desktop/test/settings-plugins.test.mjs
    apps/desktop/test/settings-setup.test.mjs
  NODE_TIP_FILES: >-
    apps/desktop/test/first-run-harnesses-words.test.mjs
  BROWSER_FILES: >-
    apps/desktop/test/settings-access-layout.test.mjs
    apps/desktop/test/settings-harnesses-layout.test.mjs
    apps/desktop/test/settings-pack-layout.test.mjs
  ROWS_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    shift 2
    log="$RUNNER_TEMP/rows-$name.log"
    listed=$(cargo test -p crazyagent --lib --locked -- "$@" --list 2>/dev/null | grep -cE ': test$' || true)
    cargo test -p crazyagent --lib --locked -- "$@" > "$log" 2>&1
    rc=$?
    grep -E '^test .* FAILED$' "$log" || true
    grep -E '^test .*(ok|FAILED)$|panicked|left:|right:|^error(\[|:)' "$log" | head -80 || true
    passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
    failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
    ignored=$(grep -E '^test result:' "$log" | awk '{i+=$8} END {print i+0}')
    echo "$name expect $expect listed $listed rc $rc passed $passed failed $failed ignored $ignored"
    [ "$listed" -ge 1 ] || { echo "::error::$name matched no row"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "$failed" = 0 ] && [ "$((passed + ignored))" = "$listed" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red-all)
        [ "$rc" != 0 ] && [ "$failed" = "$listed" ] && [ "$passed" = 0 ] || { echo "::error::$name is not red on every row"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac
  KNOWN_BASE: |
    settings-access-layout.test.mjs: V243-TERMINAL-SETTINGS-PLACE: Settings lists Terminal under App, and its section holds Terminal input and Terminal renderer as Profile's Appearance does
  SPLIT_SH: |
    set +e
    set -uo pipefail
    out="$RUNNER_TEMP/split"
    mkdir -p "$out"
    names() { sed -n '/failing tests:/,$p' "$1" | grep -E '^✖ ' | grep -v 'failing tests:' | sed -E 's/^✖ (.*) \([0-9.]+m?s\)$/\1/' | sort -u; }
    run_at() {
      at=$1
      cargo test -p crazyagent --lib --locked -- tui::screens:: > "$out/screens-$at.log" 2>&1
      echo "screens $at rc $? $(grep -E '^test result:' "$out/screens-$at.log" | tail -n 1)"
      grep -E '^test .* \.\.\. FAILED$' "$out/screens-$at.log" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort > "$out/screens-failed-$at.txt"
      : > "$out/desktop-failed-$at.txt"
      for file in $DESKTOP; do
        [ -f "$file" ] || continue
        log="$out/desktop-$at-$(basename "$file" .test.mjs).log"
        timeout=15000
        case " $BROWSER_FILES " in *" $file "*) timeout=60000 ;; esac
        node --test --test-timeout="$timeout" --test-reporter=spec "$file" > "$log" 2>&1
        rc=$?
        echo "desktop $at $(basename "$file") rc $rc $(grep -E '^ℹ (tests|pass|fail) ' "$log" | tr '\n' ' ')"
        names "$log" | sed "s|^|$(basename "$file"): |" >> "$out/desktop-failed-$at.txt"
      done
      sort -o "$out/desktop-failed-$at.txt" "$out/desktop-failed-$at.txt"
    }
    DESKTOP="$NODE_RED_FILES $NODE_TIP_FILES $BROWSER_FILES"
    run_at tip
    cat "$out/screens-failed-tip.txt" "$out/desktop-failed-tip.txt" > "$out/all-failed-tip.txt"
    printf '%s\n' "$KNOWN_BASE" | sed '/^$/d' > "$out/known-base.txt"
    echo "known base failures:"; cat "$out/known-base.txt"
    grep -Fxv -f "$out/known-base.txt" "$out/all-failed-tip.txt" > "$out/unknown-tip.txt"
    echo "tip failures not in the known base list $(wc -l < "$out/unknown-tip.txt" | tr -d ' '):"; cat "$out/unknown-tip.txt"
    if [ ! -s "$out/unknown-tip.txt" ]; then
      echo "every tip failure is a known base failure: base rebuild skipped"
      cp "$out/screens-failed-tip.txt" "$out/screens-failed-base.txt"
      cp "$out/desktop-failed-tip.txt" "$out/desktop-failed-base.txt"
    elif [ -s "$out/screens-failed-tip.txt" ] || [ -s "$out/desktop-failed-tip.txt" ]; then
      git checkout "$BASE" -- crates apps scripts || exit 1
      git diff --name-only --diff-filter=A "$BASE" HEAD^ -- crates apps scripts | while read -r added; do git rm -q -f -- "$added" || exit 1; done || exit 1
      git diff --quiet "$BASE" -- crates apps scripts || { echo "::error::the tree is not the base"; exit 1; }
      run_at base
      git checkout HEAD^ -- crates apps scripts || exit 1
      git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
    else
      : > "$out/screens-failed-base.txt"
      : > "$out/desktop-failed-base.txt"
    fi
    for kind in screens desktop; do
      echo "$kind failed at the tip:"; cat "$out/$kind-failed-tip.txt"
      echo "$kind failed at the base:"; cat "$out/$kind-failed-base.txt"
      comm -13 "$out/$kind-failed-base.txt" "$out/$kind-failed-tip.txt" > "$out/$kind-new.txt"
      echo "$kind failed at the tip only $(wc -l < "$out/$kind-new.txt" | tr -d ' '):"; cat "$out/$kind-new.txt"
    done
    grep -E -A14 '^---- .* stdout ----$' "$out/screens-tip.log" | grep -E '^---- |panicked at|want |got  |left:|right:|differs' | head -n 120
    [ ! -s "$out/screens-new.txt" ] && [ ! -s "$out/desktop-new.txt" ]
  NODE_SH: |
    set +e
    set -uo pipefail
    name=$1
    expect=$2
    file=$3
    log="$RUNNER_TEMP/node-$name.log"
    node --test --test-timeout="${NODE_TIMEOUT:-15000}" --test-reporter=spec "$file" > "$log" 2>&1
    rc=$?
    grep -E '✖|✔|ℹ (tests|pass|fail) ' "$log" | head -80 || true
    grep -E -A6 '^  (AssertionError|Error)' "$log" | head -60 || true
    tests=$(grep -E '^ℹ tests ' "$log" | awk '{print $3+0}')
    pass=$(grep -E '^ℹ pass ' "$log" | awk '{print $3+0}')
    fail=$(grep -E '^ℹ fail ' "$log" | awk '{print $3+0}')
    echo "$name expect $expect file $file rc $rc tests ${tests:-0} pass ${pass:-0} fail ${fail:-0}"
    [ "${tests:-0}" -ge 1 ] || { echo "::error::$name ran no test"; exit 1; }
    case "$expect" in
      pass)
        [ "$rc" = 0 ] && [ "${fail:-1}" = 0 ] && [ "$pass" = "$tests" ] || { echo "::error::$name did not pass"; exit 1; } ;;
      red)
        [ "$rc" != 0 ] && [ "${fail:-0}" -ge 1 ] || { echo "::error::$name is not red"; exit 1; } ;;
      *)
        echo "::error::unknown expectation $expect"; exit 1 ;;
    esac

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: ON-THIS-MAC-FIX crazyagent clippy, macOS rows and layout tests on macos-15, red then tip
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='ON-THIS-MAC-FIX tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$FIX" ] || { echo "::error::the parent is not the ON-THIS-MAC-FIX fix commit"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$TIP" ] || { echo "::error::HEAD~2 is not the ON-THIS-MAC-FIX -2 tip"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$MOVE" ] || { echo "::error::HEAD~3 is not the move commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$RED" ] || { echo "::error::HEAD~4 is not the red test commit"; exit 1; }
          [ "$(git rev-parse HEAD~5)" = "$BASE" ] || { echo "::error::HEAD~5 is not the CR14-LOCAL-COPY tip"; exit 1; }
          [ "$(git diff --name-only HEAD~5 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the ON-THIS-MAC-FIX tip"; exit 1; }
      - name: Write the row runners
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          printf '%s\n' "$NODE_SH" > "$RUNNER_TEMP/node.sh"
          printf '%s\n' "$SPLIT_SH" > "$RUNNER_TEMP/split.sh"
          bash -n "$RUNNER_TEMP/split.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/node.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chrome for Testing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/chrome"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
          echo "01a23ef9501b2745e0c2944c2e583207e6f6132d8d91c3a87ff65b5079e438ef  $work/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$work/chrome.zip" "$work"
          chrome="$work/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome" --version
          echo "CRAZYAGENT_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the rows and desktop files at the red test commit (expect every row red, each file red)
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git checkout "$RED" -- crates apps || exit 1
          git diff --name-only --diff-filter=A "$RED" HEAD^ -- crates apps | while read -r added; do git rm -q -f -- "$added" || exit 1; done || exit 1
          git diff --quiet "$RED" -- crates apps || { echo "::error::the red tree is not the red test commit"; exit 1; }
          rc=0
          cargo test -p crazyagent --lib --locked --no-run || rc=1
          read -ra rows <<< "$MAC_RED_ROWS"
          if [ "$rc" = 0 ]; then
            bash "$RUNNER_TEMP/rows.sh" rows-at-red red-all --exact "${rows[@]}" || rc=$?
          fi
          git checkout HEAD^ -- crates apps || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "red leg rc $rc"
          [ "$rc" = 0 ]
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          grep -E '^ +(Checking|Compiling) crazyagent v' "$log" || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent macos-15 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the touched rows
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          read -ra rows <<< "$TIP_ROWS"
          bash "$RUNNER_TEMP/rows.sh" rows-at-tip pass --exact "${rows[@]}"
      - name: Tip, every settings client row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" settings-client pass tui::client::settings::
      - name: Tip then base, every screens row and every desktop file (expect no failure at the tip that is not at the base)
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          bash "$RUNNER_TEMP/split.sh"
      - name: Tip, every render row
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash "$RUNNER_TEMP/rows.sh" render pass tui::render_tests::

