name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 4f20f95df466bdba1c187262fd4be653ab3b532d
  RED: 1e61e7f41b2013e348b355ed0978c24665f8df3e
  BASE: 9b78b43e7065897d39734301e37ba8d958742fcc
  FILES: "crates/crazyagent/src/engine/native_auth_host/claude_auth/channel_actor_tests.rs crates/crazyagent/src/engine/native_auth_host/entry.rs crates/crazyagent/src/engine/native_auth_host/entry_run_tests.rs crates/crazyagent/src/engine/native_auth_host/entry_tests.rs crates/crazyagent/src/engine/owner/transport.rs crates/crazyagent/src/engine/owner/transport/key_windows_tests.rs crates/crazyagent/src/engine/owner/transport/native_auth_channel.rs crates/crazyagent/src/engine/owner/transport/native_auth_channel_tests.rs crates/crazyagent/src/engine/secret_frame.rs crates/crazyagent/src/ide/bridge.rs crates/crazyagent/src/ide/bridge/tests.rs crates/crazyagent/src/ide/server/tests.rs crates/crazyagent/tests/owner_token_residue.rs crates/crazyagent/tests/trusted_worker_dispatch.rs scripts/quality/caps-allow.json scripts/quality/owner-packets.mjs scripts/quality/owner-packets.test.mjs "

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: OWNER-TOKEN-AT-REST clippy on windows-2022 at the fix tip
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, Windows clippy on the crazyagent lib and its tests (expect rc 0 and 0 errors under -D warnings, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/tip-clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
          echo "CLIPPY rc $rc errors $errors warnings $warnings checked crazyagent $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Gate, clippy checked crazyagent (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$RUNNER_TEMP"/tip-clippy.log || true)
          echo "GATE Checking or Compiling crazyagent $n"
          [ "$n" -ge 1 ]
  macos:
    name: OWNER-TOKEN-AT-REST clippy on macos-15 at the fix tip, then the red residue rows at TIP~2
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Tip, macOS clippy on the crazyagent lib and its tests (expect rc 0 and 0 errors under -D warnings, crate checked)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          cargo clippy --version || { echo "::error::clippy is not installed"; exit 1; }
          log="$RUNNER_TEMP/tip-clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going -- -D warnings > "$log" 2>&1
          rc=$?
          grep -E '^(error|warning)' -A6 "$log" | head -80 || true
          errors=$(grep -cE '^error' "$log" || true)
          warnings=$(grep -cE '^warning' "$log" || true)
          checked=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)
          echo "CLIPPY rc $rc errors $errors warnings $warnings checked crazyagent $checked"
          [ "$checked" -ge 1 ] || { echo "::error::clippy did not check crazyagent"; exit 1; }
          [ "$rc" = 0 ] && [ "$errors" = 0 ] || { echo "::error::clippy is not clean"; exit 1; }
      - name: Gate, clippy checked crazyagent (expect at least 1)
        if: ${{ !cancelled() }}
        run: |
          set +e
          n=$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$RUNNER_TEMP"/tip-clippy.log || true)
          echo "GATE Checking or Compiling crazyagent $n"
          [ "$n" -ge 1 ]
      - name: Red, the new residue rows at the red commit TIP~2 (expect both FAILED on the unwiped assert)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set +e
          set -uo pipefail
          [ "$(git rev-parse "$TIP~2")" = "$RED" ] || { echo "::error::the red commit is not two below the tip"; exit 1; }
          git checkout --quiet --detach "$RED" || { echo "::error::cannot check out the red commit"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$RED" ] || { echo "::error::the tree is not the red commit"; exit 1; }
          log="$RUNNER_TEMP/red-residue.log"
          cargo test -p crazyagent --locked --test owner_token_residue > "$log" 2>&1
          rc=$?
          grep -E '^test |^test result:|left:|right:|panicked' "$log" || true
          built=$(grep -cE '^ +Compiling crazyagent v' "$log" || true)
          red=$(grep -cE '^test (a_dropped_owner_client_frees_no_copy_of_its_token|a_closed_engine_frees_no_copy_of_its_owner_tokens) \.\.\. FAILED$' "$log" || true)
          unwiped=$(grep -cE 'unwiped' "$log" || true)
          echo "RESIDUE red rc $rc built crazyagent $built rows FAILED $red unwiped asserts $unwiped"
          [ "$built" -ge 1 ] || { echo "::error::crazyagent was not built"; exit 1; }
          [ "$rc" != 0 ] && [ "$red" = 2 ] && [ "$unwiped" -ge 2 ] || { echo "::error::the residue rows are not red on the unwiped assert"; exit 1; }
  rows:
    name: OWNER-TOKEN-AT-REST rows on macos-15, new file green at TIP, callers TIP then BASE, FAILED-name diff
    runs-on: macos-15
    timeout-minutes: 340
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the fix tip"; exit 1; }
          git merge-base --is-ancestor "$BASE" HEAD^ || { echo "::error::the base is not under the fix tip"; exit 1; }
          [ "$(git diff --name-only "$BASE" HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
      - name: Install Rust toolchain, target outside the repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Write the rows script (same filters at TIP and BASE)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rows.sh" <<'EOF'
          set +e
          set -uo pipefail
          side=$1
          bash --version | head -n 1
          out="$RUNNER_TEMP/$side"
          mkdir -p "$out"
          : > "$out/failed.txt"
          bad=0
          for spec in lib owner_bootstrap owner_client project_conversation trusted_worker_dispatch secret_realloc_residue; do
            if [ "$spec" = lib ]; then
              target=(--lib)
              filters=(engine::owner:: engine::native_auth_host:: ide::)
            else
              target=(--test "$spec")
              filters=()
            fi
            cargo test -p crazyagent --locked "${target[@]}" --no-run > "$out/$spec-build.log" 2>&1
            brc=$?
            tail -n 5 "$out/$spec-build.log"
            for filter in ${filters[@]+"${filters[@]}"}; do
              each=$(cargo test -p crazyagent --locked "${target[@]}" -- --list "$filter" 2>/dev/null | grep -cE ': test$' || true)
              echo "LISTED $side $spec $filter $each"
              [ "$each" -gt 0 ] || { echo "::error::$side $spec filter $filter lists 0 rows"; bad=1; }
            done
            listed=$(cargo test -p crazyagent --locked "${target[@]}" -- --list ${filters[@]+"${filters[@]}"} 2>/dev/null | grep -cE ': test$' || true)
            cargo test -p crazyagent --locked "${target[@]}" -- ${filters[@]+"${filters[@]}"} > "$out/$spec-rows.log" 2>&1
            rc=$?
            grep -E '^test .* \.\.\. FAILED$' "$out/$spec-rows.log" | awk -v s="$spec" '{print s"/"$2}' >> "$out/failed.txt" || true
            passed=$(grep -E '^test result:' "$out/$spec-rows.log" | awk '{p+=$4} END {print p+0}')
            failed=$(grep -E '^test result:' "$out/$spec-rows.log" | awk '{f+=$6} END {print f+0}')
            echo "ROWS $side $spec build rc $brc listed $listed rc $rc passed $passed failed $failed"
            [ "$brc" = 0 ] || { echo "::error::$side $spec did not build"; bad=1; }
            [ "$listed" -gt 0 ] || { echo "::error::$side $spec filters list 0 rows"; bad=1; }
          done
          sort -u "$out/failed.txt" -o "$out/failed.txt"
          echo "FAILED $side $(wc -l < "$out/failed.txt" | tr -d ' ')"
          exit "$bad"
          EOF
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Tip, the new residue rows (expect rc 0, 2 passed, 0 failed)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          log="$RUNNER_TEMP/tip-residue.log"
          cargo test -p crazyagent --locked --test owner_token_residue > "$log" 2>&1
          rc=$?
          grep -E '^test |^test result:|left:|right:|panicked' "$log" || true
          passed=$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')
          failed=$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')
          echo "RESIDUE tip rc $rc passed $passed failed $failed"
          [ "$rc" = 0 ] && [ "$passed" = 2 ] && [ "$failed" = 0 ] || { echo "::error::the residue rows are not green at the tip"; exit 1; }
      - name: Tip, the caller rows (expect every filter to list rows and build)
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        run: |
          set +e
          set -uo pipefail
          git diff --quiet HEAD^ || { echo "::error::the tree is not the fix tip"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" tip
      - name: Base, the same caller rows at BASE
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        run: |
          set +e
          set -uo pipefail
          git checkout --quiet --detach "$BASE" || { echo "::error::cannot check out the base"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$BASE" ] || { echo "::error::the tree is not the base"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" base
      - name: Diff, FAILED names at TIP only and at BASE only (expect none at TIP only)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          tip="$RUNNER_TEMP/tip/failed.txt"
          base="$RUNNER_TEMP/base/failed.txt"
          [ -f "$tip" ] && [ -f "$base" ] || { echo "::error::a side has no FAILED list"; exit 1; }
          comm -23 "$tip" "$base" > "$RUNNER_TEMP/tip-only.txt"
          comm -13 "$tip" "$base" > "$RUNNER_TEMP/base-only.txt"
          echo "DIFF tip $(wc -l < "$tip" | tr -d ' ') base $(wc -l < "$base" | tr -d ' ') tip-only $(wc -l < "$RUNNER_TEMP/tip-only.txt" | tr -d ' ') base-only $(wc -l < "$RUNNER_TEMP/base-only.txt" | tr -d ' ')"
          sed 's/^/TIP-ONLY /' "$RUNNER_TEMP/tip-only.txt"
          sed 's/^/BASE-ONLY /' "$RUNNER_TEMP/base-only.txt"
          sed 's/^/BOTH /' <(comm -12 "$tip" "$base")
          [ ! -s "$RUNNER_TEMP/tip-only.txt" ] || { echo "::error::rows fail at the tip only"; exit 1; }
      - name: Gate, the rows built crazyagent at both sides (expect at least 1 each)
        if: ${{ !cancelled() }}
        run: |
          set +e
          t=$(cat "$RUNNER_TEMP"/tip/*-build.log 2>/dev/null | grep -cE '^ +Compiling crazyagent v' || true)
          b=$(cat "$RUNNER_TEMP"/base/*-build.log 2>/dev/null | grep -cE '^ +Compiling crazyagent v' || true)
          echo "GATE rows Compiling crazyagent tip $t base $b"
          [ "$t" -ge 1 ] && [ "$b" -ge 1 ]
