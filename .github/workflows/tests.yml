          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          uname -r
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Full linux_sandbox x3 per tree with the resolver row's message, under the keyring
        if: ${{ !cancelled() }}
        timeout-minutes: 200
        run: |
          set +e
          set -u
          bad=0
          keyring() {
            dbus-run-session -- bash -euo pipefail -c 'printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null; exec "$@"' farm "$@"
          }
          git merge-base --is-ancestor "$OLD" "$BASE" || exit 1
          for at in OLD BASE; do
            git checkout -q -f --detach "${!at}"
            echo "== $at $(git log --oneline -1 | cut -c1-100)"
            out=$(cargo test -p crazyagent --test linux_sandbox --locked --no-run 2>&1)
            rc=$?
            echo "  linux_sandbox build rc=$rc"
            printf '%s\n' "$out" | grep -m20 "error\[E\|^error" | cut -c1-300 | sed 's/^/    /'
            [ "$rc" -eq 0 ] || { bad=1; continue; }
            sandbox=$(realpath "$(printf '%s\n' "$out" | sed -n 's/.*Executable tests\/linux_sandbox.rs (\(.*\))/\1/p' | tail -1)")
            for bin in crazyagent crazyagent-landlock; do
              cargo build -p crazyagent --bin "$bin" --locked > "$RUNNER_TEMP/bin.log" 2>&1
              rc=$?
              echo "  bin $bin rc=$rc"
              [ "$rc" -eq 0 ] || { tail -20 "$RUNNER_TEMP/bin.log" | cut -c1-300; bad=1; continue 2; }
            done
            cp target/debug/crazyagent-landlock target/debug/deps/crazyagent-landlock
            export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent"
            for i in 1 2 3; do
              out=$(keyring "$sandbox" 2>&1)
              rc=$?
              echo "  full try $i rc=$rc $(printf '%s\n' "$out" | grep -m1 '^test result' | cut -c1-140)"
              printf '%s\n' "$out" | grep '^test .* FAILED$' | cut -c1-200 | sed 's/^/    /'
              if printf '%s\n' "$out" | grep -q "^test .*$ROW .*FAILED$"; then
                printf '%s\n' "$out" | awk -v row="$ROW" '/^---- /{p = index($0, row) > 0} p' | head -40 | cut -c1-300 | sed 's/^/      /'
              else
                echo "    $ROW passed"
              fi
            done
          done
          exit "$bad"
