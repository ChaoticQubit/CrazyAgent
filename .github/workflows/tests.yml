name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: SECRET-WIPE sealed_wipe diag on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe-only pick %H %s' HEAD^
          git log -1 --format='branch tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = 9797d18dec45d6bcbc102c2a0f41fee2b0b2f04d ] || { echo "::error::the grandparent is not the SECRET-WIPE tip 9797d18dec"; exit 1; }
          [ "$(git rev-parse HEAD^)" = 654256925fce5ffb09c39e3c51acf90c125bcb74 ] || { echo "::error::the parent is not the probe-only ef337e841 pick on the SECRET-WIPE tip"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: sealed_wipe at the tip, then with the crate at the base
        timeout-minutes: 60
        run: |
          set +e
          tip="$RUNNER_TEMP/sealed-tip.log"
          cargo test -p crazyagent-kernel-security --test sealed_wipe --locked > "$tip" 2>&1
          tip_code=$?
          echo "== tip $(git rev-parse --short=10 HEAD^^) rc $tip_code"
          grep -E '^test |^test result:' "$tip" || true
          sed -n '/^failures:/,/^test result:/p' "$tip" | head -n 60
          [ "$(git rev-parse HEAD~4)" = 2a95b5af00ef482dc4b0137b76be555737038901 ] || { echo "::error::HEAD~4 is not the base 2a95b5af00"; exit 1; }
          git checkout HEAD~4 -- crates/kernel/security
          base="$RUNNER_TEMP/sealed-base.log"
          cargo test -p crazyagent-kernel-security --test sealed_wipe --locked > "$base" 2>&1
          base_code=$?
          echo "== base 2a95b5af00 rc $base_code"
          grep -E '^test |^test result:' "$base" || true
          sed -n '/^failures:/,/^test result:/p' "$base" | head -n 60
          echo "sealed_wipe tip rc $tip_code base rc $base_code"
