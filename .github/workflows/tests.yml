name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TMUX_VERSION: "3.8"
  NAMED_ROWS: >-
    plugins::tests::a_windows_check_under_a_host_or_port_limit_is_refused_with_the_firewall_reason
    sandbox::policy::tests::a_loopback_model_on_windows_is_refused_under_every_network_choice
    sandbox::policy::tests::full_access_on_windows_names_no_level_this_version_refuses_there
    sandbox::policy::tests::full_access_on_windows_is_refused_with_its_own_reason_and_code
    sandbox::policy::tests::a_windows_model_only_agent_with_tools_starts_no_proxy_and_reaches_the_models_port_on_any_host
    sandbox::policy::tests::on_windows_a_limited_network_choice_says_it_reaches_the_whole_internet
    sandbox::policy::tests::each_platform_offers_only_the_levels_it_can_enforce

defaults:
  run:
    shell: bash

jobs:
  macos-proxy:
    name: macOS team model-proxy rows on chore/v244 5e25980d6, with trunk's pinned tmux
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
          echo "confined-step git, which xcode-select does not move: $(/Library/Developer/CommandLineTools/usr/bin/git --version || echo missing)"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Build the library tests, then run the proxy and network rows and the policy rows
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/o3a-o2a-macos.txt"
          git log --oneline -1 | tee "$out"
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-run 2>&1 | tee -a "$out"
          built=${PIPESTATUS[0]}
          cargo +"$RUST_TOOLCHAIN" test -p crazyagent --lib --locked --no-fail-fast -- \
            sandbox::policy::tests \
            team::runtime::tests::a_tools_on_agent_profile_follows_the_project_network_choice \
            team::runtime::tests::a_managed_tools_on_agent_under_no_network \
            team::runtime::tests::a_live_master_with_tools_under_no_network \
            team::runtime::tests::a_proxied_agent_s \
            team::runtime::tests::an_endpoint_agent_under_no_network \
            team::runtime::tests::a_kept_pane_gets_its_model_proxy \
            team::runtime::tests::a_real_endpoint_turn_under_no_network 2>&1 | tee -a "$out"
          rc=${PIPESTATUS[0]}
          team=$(grep -cE '^test team::runtime::tests::.* \.\.\. ok$' "$out")
          failed=$(grep -cE '^test .* \.\.\. FAILED$' "$out")
          printf '| macOS | value |\n| --- | --- |\n| build --lib --no-run | %s |\n| rows exit | %s |\n| team rows ok (want 9; the live endpoint row is ignored) | %s |\n| failed rows | %s |\n' "$built" "$rc" "$team" "$failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$built" = 0 ] && [ "$rc" = 0 ] && [ "$team" = 9 ] && [ "$failed" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: farm-o3a-o2a-macos
          path: ${{ runner.temp }}/o3a-o2a-macos.txt
          if-no-files-found: warn
          retention-days: 14
