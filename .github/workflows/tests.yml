name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  rows:
    name: ENGINE-ROWS-CANONICAL fix, kernel engine rows on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore the branch tip's tests.yml under the farm one
        id: restore
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='branch tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = 88bbb6ffe1830385a58407307774120997cc07fb ] || { echo "::error::the parent is not the ENGINE-ROWS-CANONICAL fix tip 88bbb6ffe1"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the branch tip"; exit 1; }
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Kernel, Landlock and bubblewrap on this runner
        run: |
          set +e
          uname -r
          cat /sys/kernel/security/lsm || true
          bwrap --version
          echo "bwrap --help lines naming bind-fd: $(bwrap --help 2>&1 | grep -c -- '-bind-fd')"
          bwrap --dev-bind / / --unshare-user true && echo "user namespaces: yes" || echo "user namespaces: no"
          true
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          rustup run "$RUST_TOOLCHAIN" cargo clippy --version
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: ${{ runner.os }}
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Build the Landlock helper
        timeout-minutes: 60
        run: cargo build -p crazyagent --bin crazyagent-landlock --locked
      - name: Clippy kernel-sandbox lib and tests
        timeout-minutes: 60
        run: |
          set +e
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          code=$?
          grep -E '^(error|warning)' "$RUNNER_TEMP/clippy.log" | head -40 || true
          echo "Clippy kernel-sandbox lib and tests rc $code"
          exit $code
      - name: the 8 rows by exact name (expect listed 8, passed 8)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/eight.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact linux::launch::engine_rows::a_clone_on_the_bubblewrap_backend_is_refused_with_the_landlock_line linux::launch::engine_rows::a_clone_writes_its_whole_clone_and_has_no_git_folder_grant linux::launch::engine_rows::a_confined_launch_on_the_bubblewrap_backend_is_refused_with_its_own_line linux::launch::engine_rows::a_launch_whose_git_grant_covers_a_protected_path_nothing_holds_is_refused linux::launch::engine_rows::a_linked_worktree_agent_makes_entries_in_its_admin_folder_and_no_other_git linux::launch::engine_rows::a_linked_worktree_writes_its_tree_its_admin_folder_without_links_and_no_object linux::launch::engine_rows::a_supervised_clone_launches_with_its_store_held linux::launch::engine_rows::a_supervised_linked_worktree_launches_with_every_guarded_entry_held --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- --exact linux::launch::engine_rows::a_clone_on_the_bubblewrap_backend_is_refused_with_the_landlock_line linux::launch::engine_rows::a_clone_writes_its_whole_clone_and_has_no_git_folder_grant linux::launch::engine_rows::a_confined_launch_on_the_bubblewrap_backend_is_refused_with_its_own_line linux::launch::engine_rows::a_launch_whose_git_grant_covers_a_protected_path_nothing_holds_is_refused linux::launch::engine_rows::a_linked_worktree_agent_makes_entries_in_its_admin_folder_and_no_other_git linux::launch::engine_rows::a_linked_worktree_writes_its_tree_its_admin_folder_without_links_and_no_object linux::launch::engine_rows::a_supervised_clone_launches_with_its_store_held linux::launch::engine_rows::a_supervised_linked_worktree_launches_with_every_guarded_entry_held > "$log" 2>&1
          code=$?
          grep -E '^test |test result:|panicked|left:|right:|Invalid' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "eight rows rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" = 8 ] && [ "$passed" = 8 ] && [ "$failed" = 0 ] || exit 1
      - name: every engine_rows row (listed > 0, passed = listed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/engine-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked linux::launch::engine_rows -- --list > "$log.list" 2>&1
          listed="$(grep -cE ': test$' "$log.list" || true)"
          cargo test -p crazyagent-kernel-sandbox --lib --locked linux::launch::engine_rows > "$log" 2>&1
          code=$?
          grep -E 'FAILED|test result:|panicked' "$log" || true
          passed="$(grep -E '^test result:' "$log" | awk '{p+=$4} END {print p+0}')"
          failed="$(grep -E '^test result:' "$log" | awk '{f+=$6} END {print f+0}')"
          echo "engine-rows rc $code listed $listed passed $passed failed $failed"
          [ "$code" = 0 ] && [ "$listed" -gt 0 ] && [ "$passed" = "$listed" ] && [ "$failed" = 0 ] || exit 1
