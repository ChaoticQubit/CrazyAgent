          }
          fail=0
          rows crazyagent "$SETUP" setup 87 || fail=1
          rows crazyagent "project_setup::tests::read_only_folder_lists_are_bounded_before_the_engine_checks_them" bounded-lists 1 || fail=1
          [ "$fail" = 0 ] || exit 1
      - name: Base control, the kernel paths rows at the base sources (expect == list 19, all ok)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
