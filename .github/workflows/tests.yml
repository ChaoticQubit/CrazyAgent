name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  BASE_SHA: 752b70016
  TIP_SHA: 1eeb9124e
  SCAN_OLD_SHA: 71c472416

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: V244 Linux L5c-1 seam forward on Linux at 1eeb9124e, lib build, native_term rows, clippy, the host/ scan red
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Drop the runner image's Microsoft apt source, which no package here needs
        run: |
          set -euo pipefail
          grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          if grep -rqs packages.microsoft.com /etc/apt/sources.list /etc/apt/sources.list.d; then
            echo "::error::a Microsoft apt source is still listed"
            exit 1
          fi
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install the fonts the font rows read
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends fonts-dejavu-core \
            || echo "::warning::fonts-dejavu-core did not install; the font row takes its built-in branch"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lib build, native_term rows and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          cp .github/farm/v244-linux-l5c1.sh "$RUNNER_TEMP/seam.sh"
          bash "$RUNNER_TEMP/seam.sh" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-linux-l5c1-linux
          path: ${{ runner.temp }}/v244-linux-l5c1-linux.txt
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: V244 Linux L5c-1 seam forward on Windows at 1eeb9124e, lib build, native_term rows, clippy, the host/ scan red
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lib build, native_term rows and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" HEAD -- apps crates Cargo.toml Cargo.lock
          cp .github/farm/v244-linux-l5c1.sh "$RUNNER_TEMP/seam.sh"
          bash "$RUNNER_TEMP/seam.sh" windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-linux-l5c1-windows
          path: ${{ runner.temp }}/v244-linux-l5c1-windows.txt
          if-no-files-found: warn
          retention-days: 14
