name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  LAND: "1"
  LAND_SHA: 9b86601c1

defaults:
  run:
    shell: bash

jobs:
  host:
    name: V244 Linux land 9b86601c1, the L5c-2 host and term display rows green under Xvfb, weston and sway, quiet and loaded, clippy
    env:
      BASE_SHA: e35cb26f4
      RED_SHA: d9f30e834
      GATE_SHA: 3e0b6a299
      GREEN_SHA: 9b86601c1
      SLICE_RUN: "44712084198"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Drop the Microsoft apt source the farm does not use
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install the display servers, Vulkan and screenshot tools the display row needs
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends xvfb x11-apps weston sway grim gdb mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1-mesa-dri libegl1 imagemagick jq
      - name: Install the fonts the font rows read
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends fonts-dejavu-core \
            || echo "::warning::fonts-dejavu-core did not install; the font row takes its built-in branch"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux-2404
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Green rows at the land tip, lib build and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          cp .github/farm/v244-linux-l5c2.sh "$RUNNER_TEMP/l5c2.sh"
          bash "$RUNNER_TEMP/l5c2.sh" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-linux-l5c2-linux
          path: |
            ${{ runner.temp }}/v244-linux-l5c2-linux.txt
            ${{ runner.temp }}/l5c2-cells
          if-no-files-found: warn
          retention-days: 14

  paste:
    name: V244 Linux land 9b86601c1, the L5c-3 Ctrl+Shift+V display row green under Xvfb and sway, quiet and loaded, the driven-build boards row, clippy in both builds
    env:
      RED1_SHA: 7de64b2d0
      GREEN_SHA: 9b86601c1
      ROW_FIX_SHA: cc3b2ac8a 99b5218da
      SLICE_RUN: "44803339237"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Drop the Microsoft apt source the farm does not use
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -print -delete
      - name: Install Linux build packages
        timeout-minutes: 25
        run: bash scripts/ci/linux-packages.sh
      - name: Install the display servers, clipboard and typing tools the display rows need
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends xvfb x11-apps sway libxkbcommon-tools xdotool xclip wl-clipboard dbus-x11 mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libegl1 jq
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux-2404
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Green rows at the land tip, lib build and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          cp .github/farm/wl-input.py "$RUNNER_TEMP/wl-input.py"
          cp .github/farm/v244-linux-l5c3.sh "$RUNNER_TEMP/clip.sh"
          bash "$RUNNER_TEMP/clip.sh" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-linux-l5c3-linux
          path: |
            ${{ runner.temp }}/v244-linux-l5c3-linux.txt
            ${{ runner.temp }}/l5c3-cells
          if-no-files-found: warn
          retention-days: 14

  rows:
    name: V244 Linux land 9b86601c1 on ubuntu-22.04, lib build, native_term rows with the lib.rs native host scan, clippy
    env:
      BASE_SHA: ab011e69d
      RED_SHA: a83d0ecdd
      TIP_SHA: 9b86601c1
      SLICE_RUN: "44790417818"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Drop the runner image's Microsoft apt source, which no package here needs
        run: |
          set -euo pipefail
          grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          if grep -rqs packages.microsoft.com /etc/apt/sources.list /etc/apt/sources.list.d; then
            echo "::error::a Microsoft apt source is still listed"
            exit 1
          fi
      - name: Install Linux build packages
        timeout-minutes: 40
        run: bash scripts/ci/linux-packages.sh
      - name: Install the fonts the font rows read
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends fonts-dejavu-core \
            || echo "::warning::fonts-dejavu-core did not install; the font row takes its built-in branch"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: linux
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lib build, native_term rows and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" HEAD -- apps crates Cargo.toml Cargo.lock
          cp .github/farm/v244-linux-l5c5.sh "$RUNNER_TEMP/seam.sh"
          bash "$RUNNER_TEMP/seam.sh" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-linux-l5c5-linux
          path: ${{ runner.temp }}/v244-linux-l5c5-linux.txt
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: V244 Linux land 9b86601c1 on Windows, lib build, native_term rows with the lib.rs native host scan, clippy
    env:
      BASE_SHA: ab011e69d
      RED_SHA: a83d0ecdd
      TIP_SHA: 9b86601c1
      SLICE_RUN: "44790417818"
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: windows
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lib build, native_term rows and clippy, one target set per cargo call
        run: |
          set -euo pipefail
          git diff --quiet "$TIP_SHA" HEAD -- apps crates Cargo.toml Cargo.lock
          cp .github/farm/v244-linux-l5c5.sh "$RUNNER_TEMP/seam.sh"
          bash "$RUNNER_TEMP/seam.sh" windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v244-linux-l5c5-windows
          path: ${{ runner.temp }}/v244-linux-l5c5-windows.txt
          if-no-files-found: warn
          retention-days: 14
