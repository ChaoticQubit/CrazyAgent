name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  probe-perf-parity-cr:
    name: Probe PERF-PARITY CR rows on macos-15
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Run base, red and tip rows, clippy and the tempfile tree, keeping going
        run: |
          set -uo pipefail
          base=9ac82f93ba
          red=f37f7caf82
          tip=$(git rev-parse --short=10 HEAD^)
          echo "base $base red $red tip $tip"
          logs="$RUNNER_TEMP/probe"
          mkdir -p "$logs"
          step() {
            local label=$1
            shift
            local rc=0
            "$@" > "$logs/$label.log" 2>&1 || rc=$?
            cat "$logs/$label.log"
            echo "== $label rc $rc"
            echo "$rc" > "$logs/$label.rc"
          }
          for rev in "$base" "$red" "$tip"; do
            git checkout -q --detach "$rev" || { echo "::error::checkout $rev"; exit 1; }
            echo "== at $(git rev-parse --short=10 HEAD)"
            step "fetch-$rev" cargo fetch --locked
            case "$rev" in
              "$red")
                step "red" cargo test -p crazyagent-kernel-processes --lib --no-fail-fast -- --exact service::tests::socket_check::a_home_with_a_shut_folder_is_gone_after_a_failed_setup
                ;;
              *)
                step "tree-$rev" cargo tree -i tempfile --locked --offline
                step "held-$rev" cargo test -p crazyagent-macos-fs --lib --locked --offline --no-fail-fast -- held
                step "socket-$rev" cargo test -p crazyagent-kernel-processes --lib --locked --offline --no-fail-fast -- service::tests::socket_check::
                ;;
            esac
          done
          step "clippy-macos-fs" cargo clippy -p crazyagent-macos-fs --tests --locked --offline -- -D warnings
          step "clippy-processes" cargo clippy -p crazyagent-kernel-processes --tests --locked --offline -- -D warnings
          echo "== verdicts"
          bad=0
          want() { if [ "$2" = "$3" ]; then echo "ok $1"; else echo "::error::$1: got $2, want $3"; bad=1; fi; }
          rc() { cat "$logs/$1.rc"; }
          count() { grep -cE "$2" "$logs/$1.log" || true; }
          for rev in "$base" "$tip"; do
            want "held rows rc at $rev" "$(rc "held-$rev")" 0
            want "socket rows rc at $rev" "$(rc "socket-$rev")" 0
            want "tree rc at $rev" "$(rc "tree-$rev")" 0
            want "one tempfile version at $rev" "$(count "tree-$rev" '^tempfile v')" 1
            want "tempfile 3.27.0 at $rev" "$(count "tree-$rev" '^tempfile v3\.27\.0$')" 1
            echo "held rows ok at $rev: $(count "held-$rev" '^test .* \.\.\. ok$')"
            echo "socket rows ok at $rev: $(count "socket-$rev" '^test .* \.\.\. ok$')"
          done
          want "macos-fs a dev user of tempfile at base" "$(count "tree-$base" 'crazyagent-macos-fs v')" 0
          want "macos-fs a dev user of tempfile at tip" "$([ "$(count "tree-$tip" 'crazyagent-macos-fs v')" -ge 1 ] && echo yes || echo no)" yes
          want "red row fails at $red" "$([ "$(rc red)" != 0 ] && echo yes || echo no)" yes
          want "red row named FAILED at $red" "$(count red '^test service::tests::socket_check::a_home_with_a_shut_folder_is_gone_after_a_failed_setup \.\.\. FAILED$')" 1
          want "red row passes at tip" "$(count "socket-$tip" '^test service::tests::socket_check::a_home_with_a_shut_folder_is_gone_after_a_failed_setup \.\.\. ok$')" 1
          want "clippy macos-fs rc" "$(rc clippy-macos-fs)" 0
          want "clippy processes rc" "$(rc clippy-processes)" 0
          want "clippy checked macos-fs" "$([ "$(count clippy-macos-fs 'Checking crazyagent-macos-fs v')" -ge 1 ] && echo yes || echo no)" yes
          want "clippy checked processes" "$([ "$(count clippy-processes 'Checking crazyagent-kernel-processes v')" -ge 1 ] && echo yes || echo no)" yes
          want "tip tests compiled macos-fs" "$([ "$(count "held-$tip" 'Compiling crazyagent-macos-fs v')" -ge 1 ] && echo yes || echo no)" yes
          want "tip tests compiled processes" "$([ "$(count "socket-$tip" 'Compiling crazyagent-kernel-processes v')" -ge 1 ] && echo yes || echo no)" yes
          exit "$bad"
