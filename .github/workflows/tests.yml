name: Tests

on:
  push:
    branches:
      - "chore/v242-batch*"
      - "chore/v25*"
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_PROFILE: farm
  CHROME_VERSION: "151.0.7922.34"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FARM_ENGINE_EXCLUDE: >-
    agents_live codex_app_server_live codex_bridge_live launch_context_live
    acceptance_v2_rcli_usage accounts_binary harness_catalog_bundled_rcli
    worker_engine_boundary qualification_boundary/boundary_denies_escape_and_trusted_writes
    accounts/local_model_discovery_reads_the_real_ollama accounts/an_openai_compatible_account_check_lists_the_real_ollama_models
    harness_launch/live_codex_and_claude_reply_from_the_local_model_and_stop_their_process_groups
    harness_launch/live_keyed_codex_and_claude_reach_the_model_through_the_relay_with_their_key_file
    harness_launch/live_tools_on_turn_completes_inside_the_project_sandbox
    github::tests::signed_in_gh_cli_token_is_reused_through_the_real_gh
    project_sandbox/an_agent_cannot_exec_an_app_bundle_binary_in_any_case_but_bundle_tools_still_run
  FARM_DESKTOP_EXCLUDE: accounts_bridge/desktop_accounts_commands_reach_the_real_engine
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts
  NODE_TEST_TIMEOUT_MACOS_MS: "60000"
  FARM_PARTS: >-
    linux-rust-1 linux-rust-2 linux-rust-3 linux-rust-4 macos-rust-1 macos-rust-2 macos-rust-3
    windows-rust-1 windows-rust-2 windows-rust-3 linux-node-1 linux-node-2 macos-node-1 linux-bun-1

defaults:
  run:
    shell: bash

jobs:
  probe-redaction-pem:
    name: Probe REDACTION-PEM rows on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Run red and tip rows and clippy, keeping going
        timeout-minutes: 130
        run: |
          set -uo pipefail
          red=ef8b3d24c0
          tip=9873b2cf56
          reds="an_openvpn_static_key_end_with_no_begin_hides_every_line_before_it a_tls_crypt_v2_server_key_end_with_no_begin_hides_every_line_before_it a_tls_crypt_v2_client_key_opened_before_the_tail_window_hides_its_body_rows a_separator_inside_a_key_block_leaves_it_open_to_its_end a_separator_before_the_tail_window_leaves_an_opened_block_open"
          guards="a_chunk_separator_before_any_begin_keeps_the_lines_above_it a_begin_label_holding_key_inside_a_word_before_the_tail_window_hides_nothing"
          logs="$RUNNER_TEMP/probe"
          mkdir -p "$logs"
          step() {
            local label=$1 rc=0
            shift
            "$@" > "$logs/$label.log" 2>&1 || rc=$?
            cat "$logs/$label.log"
            echo "$rc" > "$logs/$label.rc"
            echo "== $label rc $rc"
          }
          for rev in "$red" "$tip"; do
            git checkout -q --detach "$rev" || { echo "::error::checkout $rev"; exit 1; }
            echo "== at $(git rev-parse --short=10 HEAD)"
            step "fetch-$rev" cargo fetch --locked
            step "module-$rev" cargo test -p crazyagent --lib --locked --offline --no-fail-fast -- project_setup::research_logs::tests::
            step "setup-$rev" cargo test -p crazyagent --lib --locked --offline --no-fail-fast -- project_setup::
          done
          step clippy cargo clippy -p crazyagent --tests --locked --offline -- -D warnings
          echo "== verdicts"
          bad=0
          want() { if [ "$2" = "$3" ]; then echo "ok $1"; else echo "::error::$1: got $2, want $3"; bad=1; fi; }
          count() { grep -cE "$2" "$logs/$1.log" || true; }
          ran() { grep -E '^running [0-9]+ tests$' "$logs/$1.log" | awk '{ s += $2 } END { print s + 0 }'; }
          yes_if() { [ "$1" -ge 1 ] && echo yes || echo no; }
          for label in module-$red setup-$red module-$tip setup-$tip; do
            echo "rows run by $label: $(ran "$label")"
            want "$label ran rows" "$(yes_if "$(ran "$label")")" yes
          done
          want "red module compiled crazyagent" "$(yes_if "$(count module-$red 'Compiling crazyagent v')")" yes
          for row in $reds; do
            want "red row $row FAILED at $red" "$(count module-$red "^test project_setup::research_logs::tests::$row \.\.\. FAILED$")" 1
            want "red row $row ok at $tip" "$(count module-$tip "^test project_setup::research_logs::tests::$row \.\.\. ok$")" 1
          done
          for row in $guards; do
            want "guard $row ok at $red" "$(count module-$red "^test project_setup::research_logs::tests::$row \.\.\. ok$")" 1
            want "guard $row ok at $tip" "$(count module-$tip "^test project_setup::research_logs::tests::$row \.\.\. ok$")" 1
          done
          want "red module failed only the 5 red rows" "$(count module-$red '^test .* \.\.\. FAILED$')" 5
          want "tip module rc" "$(cat "$logs/module-$tip.rc")" 0
          want "tip project_setup rc" "$(cat "$logs/setup-$tip.rc")" 0
          want "red project_setup failed only the 5 red rows" "$(count setup-$red '^test .* \.\.\. FAILED$')" 5
          want "clippy rc" "$(cat "$logs/clippy.rc")" 0
          want "clippy checked crazyagent" "$(yes_if "$(count clippy 'Checking crazyagent v')")" yes
          exit "$bad"
  probe-redaction-pem-windows:
    name: Probe REDACTION-PEM clippy on windows-2022
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners, never on badal or another self-hosted runner"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Clippy on the crate at the tip, with its crate gate
        timeout-minutes: 130
        run: |
          set -uo pipefail
          rc=0
          git checkout -q --detach 9873b2cf56
          cargo clippy -p crazyagent --tests --locked -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/clippy.log"
          echo "== clippy rc $rc"
          checked=$(grep -c 'Checking crazyagent v' "$RUNNER_TEMP/clippy.log" || true)
          echo "Checking crazyagent v lines: $checked"
          [ "$rc" = 0 ] && [ "$checked" -ge 1 ]
