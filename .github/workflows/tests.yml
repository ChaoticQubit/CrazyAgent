name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP_FULL: b4f2e713598d8d6dfb970100200c983e4366976b
  SNAPSHOT_ROW: every_scenario_matches_its_2_4_2_capture

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: RLRN-BASE snapshot row on macos-15
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          [ "${#TIP_FULL}" = 40 ] || { echo "::error::TIP_FULL is not a full sha"; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$TIP_FULL" ] || { echo "::error::the parent is not chore $TIP_FULL"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not chore"; exit 1; }
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: farm
          shared-key: macos
          add-job-id-key: false
          add-rust-environment-hash-key: false
          cache-bin: false
          save-if: false
      - name: The storage snapshot row, macOS only, by exact name
        timeout-minutes: 75
        run: |
          set +e
          log="$RUNNER_TEMP/snapshot.log"
          cargo test -p crazyagent --test snapshot_v242 --locked -- --exact "$SNAPSHOT_ROW" > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ test|^test |test result:|panicked at' "$log" || true
          sed -n '/ stdout ----$/,/^note: run with/p' "$log" | grep -E '^[a-z0-9_-]+/[a-z0-9_.-]+: ' | sort | sed 's/^/SCENARIO /'
          passed="$(grep -cE '^test result: ok\. 1 passed; 0 failed' "$log")"
          echo "SNAPSHOT rc $code one-passed $passed"
          [ "$code" = 0 ] && [ "$passed" = 1 ] || { echo "::error::the snapshot row did not pass"; tail -n 60 "$log"; exit 1; }
