name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  TMUX_VERSION: "3.8"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TIP: e923252dc609c556308ff0fd4141bfe024c1d918
  F1_RED: 1bc3d679ad32b12682e807317b3833485dbaa419
  N1_RED: 24b7dcacded36e3624b18fb81199b205030cbbba
  VALUE_WIN: research::runner::program_tests::engine_and_ide_git_name_a_missing_system_folder_file_for_hooks_programs_and_ssh
  VALUE_UNIX: research::runner::program_tests::engine_and_ide_git_name_dev_null_for_hooks_programs_and_ssh
  BUILDER: research::runner::program_tests::the_windows_value_is_a_plain_system_folder_with_forward_slashes_or_none
  REFUSAL: research::runner::program_tests::an_unusable_system_folder_is_the_named_refusal_never_a_panic
  CLONE: github::clone::tests::clone_runs_the_resolved_git_in_a_private_empty_home
  EFFECT: github::publish::windows_tests::no_planted_program_runs_for_a_hook_a_signature_check_or_the_ssh_command
  IDE_LOG: ide::git::tests::the_ide_git_logs_a_signed_commit_alone_and_runs_no_false_the_path_finds

defaults:
  run:
    shell: bash

jobs:
  win-red:
    name: Git safe r2 windows-2022, the clone row over the clone code before F1 and the refusal row over the helper before N1 fail for their named reasons
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the tree the N1 red commit with the clone code before the F1 fix
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          git merge-base --is-ancestor "$N1_RED" "$TIP"
          git merge-base --is-ancestor "$F1_RED" "$N1_RED"
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$N1_RED" -- .
          git checkout "$F1_RED" -- crates/crazyagent/src/github/clone.rs
          test "$(git diff --name-only "$N1_RED")" = crates/crazyagent/src/github/clone.rs || { echo "TREE IS NOT THE N1 RED COMMIT WITH THE OLD CLONE CODE"; git diff --stat "$N1_RED"; exit 1; }
          test "$(git diff --name-only "$F1_RED" | sort | tr '\n' ' ')" = "crates/crazyagent/src/research/runner.rs crates/crazyagent/src/research/runner/program_tests.rs " || { echo "TREE DIFFERS FROM THE F1 RED COMMIT BEYOND THE N1 RED ROW"; git diff --stat "$F1_RED"; exit 1; }
          grep -qF 'core.hooksPath={NULL_DEVICE}' crates/crazyagent/src/github/clone.rs
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Build the engine library tests at the red tree
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: The clone row and the refusal row fail at the red tree for their named reasons
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --exact "$CLONE" > "$RUNNER_TEMP/red-clone.txt" 2>&1
          rc_clone=$?
          cargo test -p crazyagent --lib --locked -- --exact "$REFUSAL" > "$RUNNER_TEMP/red-refusal.txt" 2>&1
          rc_refusal=$?
          grep -E "^test |^test result|panicked|core.hooksPath|GetSystemDirectoryW" "$RUNNER_TEMP/red-clone.txt" "$RUNNER_TEMP/red-refusal.txt" | cut -c1-400 | head -40
          [ "$rc_clone" -ne 0 ] || { echo "RED CLONE ROW PASSED, expected a failure"; exit 1; }
          [ "$rc_refusal" -ne 0 ] || { echo "RED REFUSAL ROW PASSED, expected a failure"; exit 1; }
          reason() {
            awk -v t="thread '$2' " -v want="$3" 'index($0, t) == 1 && /panicked at/ {getline line; if (index(line, want)) found=1} END {exit !found}' "$1" || { echo "RED: $2 did not fail for: $3"; exit 1; }
          }
          reason "$RUNNER_TEMP/red-clone.txt" "$CLONE" '"core.hooksPath=NUL"'
          reason "$RUNNER_TEMP/red-refusal.txt" "$REFUSAL" "GetSystemDirectoryW names the system folder"
          echo "red ok: both rows failed for their named reasons"

  win-tip:
    name: Git safe r2 ${{ matrix.runner }} at the tip, clippy engine and desktop on windows-2022, rows, the planted-program row alone
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          git --version
      - name: Clippy crazyagent-win-sandbox, all targets
        if: matrix.runner == 'windows-2022'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-win-sandbox --all-targets --locked -- -D warnings
      - name: Clippy crazyagent lib
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the desktop frontend for the desktop crate
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 20
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Clippy crazyagent-desktop lib
        if: ${{ !cancelled() && matrix.runner == 'windows-2022' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent-desktop --lib --locked -- -D warnings
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- research::runner::program_tests:: research::runner::windows_tests:: github:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "program_tests|clone::|ignored" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$VALUE_WIN" "$BUILDER" "$REFUSAL" "$CLONE"; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          grep -q "^test $EFFECT \.\.\. ignored" "$RUNNER_TEMP/tip.txt" || { echo "THE PLANTED-PROGRAM ROW IS NOT IGNORED IN THE SHARED RUN"; rc=1; }
          exit "$rc"
      - name: The planted-program row alone at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- --ignored --exact "$EFFECT" > "$RUNNER_TEMP/effect.txt" 2>&1
          code=$?
          grep -E "^test |^test result|panicked|: ran |: ended " "$RUNNER_TEMP/effect.txt" | cut -c1-400 | head -40
          rc=0
          grep -q "^test $EFFECT \.\.\. ok" "$RUNNER_TEMP/effect.txt" || { echo "EFFECT ROW NOT OK (exit $code)"; rc=1; }
          grep -q "^test result: ok\. 1 passed" "$RUNNER_TEMP/effect.txt" || { echo "THE EFFECT ROW DID NOT RUN ALONE"; rc=1; }
          for left in /c/usr/bin/false /c/usr/bin/false.exe /c/dev/null.exe /c/dev/null/reference-transaction.exe /d/usr/bin/false /d/dev/null/reference-transaction.exe; do
            [ ! -e "$left" ] || { echo "THE ROW LEFT $left BEHIND"; rc=1; }
          done
          exit "$rc"
      - name: The system folder row in crazyagent-win-sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent-win-sandbox --lib --locked -- system:: > "$RUNNER_TEMP/system.txt" 2>&1
          code=$?
          grep -E "^test |^test result|panicked" "$RUNNER_TEMP/system.txt" | head -20
          grep -q "^test win::system::tests::the_system_folder_is_the_absolute_folder_that_holds_kernel32 \.\.\. ok" "$RUNNER_TEMP/system.txt" || { echo "SYSTEM FOLDER ROW NOT OK (exit $code)"; exit 1; }

  linux-tip:
    name: Git safe r2 Linux at the tip, clippy lib then tests, rows
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - name: Free disk on the Linux runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - name: Install Linux build packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain with clippy
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          /usr/bin/git --version
      - name: Clippy crazyagent lib
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --lib --locked -- -D warnings
      - name: Clippy crazyagent tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo clippy -p crazyagent --tests --locked -- -D warnings
      - name: Build the engine library tests
        id: lib
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test -p crazyagent --lib --locked --no-run
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- research::runner::program_tests:: ide::git:: ide::env:: landing::signature_tests:: landing::git:: worktrees::tests:: github:: project_files:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "program_tests|clone::|ignored" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$VALUE_UNIX" "$BUILDER" "$REFUSAL" "$CLONE" "$IDE_LOG" ide::git::tests::the_ide_git_ssh_transport_runs_no_false_the_path_finds landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor worktrees::tests::engine_worktree_git_runs_no_repository_signature_program_in_any_armor; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"

  macos-tip:
    name: Git safe r2 macOS at the tip with the pinned IDE build, rows
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put back the tip workflow so the tree is the tip
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TIP" HEAD
          test "$(git diff --name-only "$TIP" HEAD)" = .github/workflows/tests.yml
          git checkout "$TIP" -- .github/workflows/tests.yml
          git diff --quiet "$TIP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tmux on macOS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$RUNNER_TEMP/tmux"
          mkdir -p "$work"
          scripts/release/build-tmux.sh --target aarch64-apple-darwin --work "$work/build" --out "$work/tmux"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "$work/tmux" /usr/local/bin/tmux
          test "$(command -v tmux)" = /usr/local/bin/tmux
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - name: Select Xcode 26.3, whose git the engine runs
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          git="$(env -i PATH=/usr/bin:/bin /usr/bin/xcrun --find git)"
          version="$("$git" --version)"
          echo "engine git $git: $version"
          IFS=. read -r major minor _ <<< "${version#git version }"
          (( major > 2 || (major == 2 && minor >= 40) )) || { echo "::error::the engine's landing needs git 2.40 or newer and xcrun finds $version"; exit 1; }
          echo "confined-step git, which xcode-select does not move: $(/Library/Developer/CommandLineTools/usr/bin/git --version || echo missing)"
      - name: Read the pinned IDE build, as the shard does
        id: ide
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("crates/crazyagent/src/ide/builds.json", "utf8"));
            const { version } = manifest;
            const build = manifest.builds["aarch64-apple-darwin"];
            const url = `https://github.com/VSCodium/vscodium/releases/download/${version}/vscodium-reh-web-darwin-arm64-${version}.tar.gz`;
            const pinned = /^[0-9]+(\.[0-9]+)*$/.test(version) && build?.url === url && /^[0-9a-f]{64}$/.test(build.sha256)
              && Number.isSafeInteger(build.bytes) && build.bytes > 0 && build.bytes <= 150 * 1024 * 1024;
            if (!pinned) throw new Error("builds.json does not pin an official darwin-arm64 VSCodium build");
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nurl=${url}\nsha256=${build.sha256}\nbytes=${build.bytes}\n`);
          '
      - name: Provision the pinned IDE build, as the shard does
        env:
          IDE_VERSION: ${{ steps.ide.outputs.version }}
          IDE_URL: ${{ steps.ide.outputs.url }}
          IDE_SHA256: ${{ steps.ide.outputs.sha256 }}
          IDE_BYTES: ${{ steps.ide.outputs.bytes }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vscodium-reh-web"
          build=".local-state/ide-cache/vscodium-$IDE_VERSION"
          mkdir -p "$work" "$build"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --max-filesize "$IDE_BYTES" -o "$work/vscodium.tgz" "$IDE_URL"
          test "$(stat -f %z "$work/vscodium.tgz")" = "$IDE_BYTES"
          echo "$IDE_SHA256  $work/vscodium.tgz" | shasum -a 256 -c -
          tar -xzf "$work/vscodium.tgz" -C "$build"
          test -f "$build/out/server-main.js"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
      - name: Build the engine library tests
        id: lib
        timeout-minutes: 100
        run: |
          set -euo pipefail
          date -u '+lib build start %H:%M:%S'
          cargo test -p crazyagent --lib --locked --no-run
          date -u '+lib build end %H:%M:%S'
      - name: Rows at the tip
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          set +e -uo pipefail
          cargo test -p crazyagent --lib --locked -- research::runner::program_tests:: ide::git:: ide::env:: ide::server::tests::server_env_holds_only_allowlisted_names ide::server::tests::an_older_agents_root_too_large_to_read_keeps_the_git_stop ide::sandbox::tests::ide_git_refuses_agent_folders_and_runs_project_hooks_only_when_on landing::signature_tests:: worktrees::tests:: github::publish:: github::clone:: > "$RUNNER_TEMP/tip.txt" 2>&1
          rc=$?
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/tip.txt" | head -40
          grep -E "^test .* \.\.\. (ok|ignored)" "$RUNNER_TEMP/tip.txt" | sed 's/^test //' | sort > "$RUNNER_TEMP/tip-rows.txt"
          wc -l < "$RUNNER_TEMP/tip-rows.txt"
          grep -E "program_tests|clone::|ide::server::|ide::sandbox::|ignored" "$RUNNER_TEMP/tip-rows.txt"
          for row in "$VALUE_UNIX" "$BUILDER" "$REFUSAL" "$CLONE" "$IDE_LOG" ide::server::tests::server_env_holds_only_allowlisted_names ide::server::tests::an_older_agents_root_too_large_to_read_keeps_the_git_stop ide::sandbox::tests::ide_git_refuses_agent_folders_and_runs_project_hooks_only_when_on landing::signature_tests::engine_setup_git_runs_no_repository_signature_program_in_any_armor; do
            grep -q "^test $row \.\.\. ok" "$RUNNER_TEMP/tip.txt" || { echo "ROW NOT OK: $row"; rc=1; }
          done
          exit "$rc"
