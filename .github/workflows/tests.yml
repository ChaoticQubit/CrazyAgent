name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TIP: 1b6b4ffd0c0539aa333e666b69b3dd67e4ac625f
  FIX: 67d5354c5092fa5bd6104a90b49edca8de88dce2
  RED: cdc68932057e2e266ff11f96c834237cddbd593a
  BASE: c6c672b4726b8226a35e486089704f41e4f66230
  FILES: "crates/crazyagent/src/engine/owner/transport.rs crates/crazyagent/src/engine/owner/transport/account_profile.rs crates/crazyagent/src/engine/owner/transport/accounts.rs crates/crazyagent/src/engine/owner/transport/agents.rs crates/crazyagent/src/engine/owner/transport/app_plugins.rs crates/crazyagent/src/engine/owner/transport/changes.rs crates/crazyagent/src/engine/owner/transport/cleanup.rs crates/crazyagent/src/engine/owner/transport/github.rs crates/crazyagent/src/engine/owner/transport/harness_catalog.rs crates/crazyagent/src/engine/owner/transport/harness_catalog/updates.rs crates/crazyagent/src/engine/owner/transport/icloud.rs crates/crazyagent/src/engine/owner/transport/ide.rs crates/crazyagent/src/engine/owner/transport/ide_extensions.rs crates/crazyagent/src/engine/owner/transport/ide_tab.rs crates/crazyagent/src/engine/owner/transport/native_auth.rs crates/crazyagent/src/engine/owner/transport/overview.rs crates/crazyagent/src/engine/owner/transport/owner_pipe_windows_tests.rs crates/crazyagent/src/engine/owner/transport/owner_stream.rs crates/crazyagent/src/engine/owner/transport/owner_stream_tests.rs crates/crazyagent/src/engine/owner/transport/plugins.rs crates/crazyagent/src/engine/owner/transport/process.rs crates/crazyagent/src/engine/owner/transport/questions.rs crates/crazyagent/src/engine/owner/transport/recovery.rs crates/crazyagent/src/engine/owner/transport/roadmap.rs crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/engine/owner/transport/usage.rs crates/crazyagent/src/engine/owner/transport/watch.rs scripts/quality/caps-allow.json "
  ROWS_SH: |
    set +e
    set -uo pipefail
    name="$1"; want="$2"; filter="$3"; count="$4"
    log="$RUNNER_TEMP/rows-$name.log"
    cargo test -p crazyagent --lib --locked -- "$filter" > "$log" 2>&1
    code=$?
    grep -E '^test .* \.\.\. |^test result|panicked at|^thread ' "$log" | head -n 60
    passed=$(grep -cE '^test .* \.\.\. ok$' "$log" || true)
    failed=$(grep -cE '^test .* \.\.\. FAILED$' "$log" || true)
    ran=$((passed + failed))
    echo "rows $name filter $filter want $want rc $code ran $ran passed $passed failed $failed"
    if [ "$want" = pass ]; then
      [ "$code" = 0 ] && [ "$failed" = 0 ] && { { [ "$count" = any ] && [ "$ran" -ge 1 ]; } || [ "$ran" = "$count" ]; }
    else
      [ "$code" != 0 ] && [ "$ran" = "$count" ] && [ "$failed" = "$count" ]
    fi

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: SEC-F1 crazyagent clippy, rustfmt, checked connect rows, owner server rows and caps on ubuntu-22.04, red then tip
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='SEC-F1 tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the SEC-F1 tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$FIX" ] || { echo "::error::HEAD~2 is not the fix commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED" ] || { echo "::error::HEAD~3 is not the red test commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE" ] || { echo "::error::HEAD~4 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~4 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the SEC-F1 tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the checked connect source row at the red test commit (expect 1 row, failed)
        timeout-minutes: 60
        run: |
          set +e
          set -uo pipefail
          git checkout "$RED" -- crates scripts || exit 1
          git rm -q --cached crates/crazyagent/src/engine/owner/transport/owner_stream.rs || exit 1
          rm crates/crazyagent/src/engine/owner/transport/owner_stream.rs || exit 1
          git diff --quiet "$RED" -- crates scripts || { echo "::error::the red tree is not the red test commit"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" red red owner_stream_tests:: 1
          rc=$?
          git checkout HEAD^ -- crates scripts || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "red leg rc $rc"
          [ "$rc" = 0 ]
      - name: rustfmt --check on the touched Rust files (expect rc 0)
        if: ${{ !cancelled() }}
        run: |
          set +e
          rustfmt --edition 2024 --check crates/crazyagent/src/engine/owner/transport.rs crates/crazyagent/src/engine/owner/transport/account_profile.rs crates/crazyagent/src/engine/owner/transport/accounts.rs crates/crazyagent/src/engine/owner/transport/agents.rs crates/crazyagent/src/engine/owner/transport/app_plugins.rs crates/crazyagent/src/engine/owner/transport/changes.rs crates/crazyagent/src/engine/owner/transport/cleanup.rs crates/crazyagent/src/engine/owner/transport/github.rs crates/crazyagent/src/engine/owner/transport/harness_catalog.rs crates/crazyagent/src/engine/owner/transport/harness_catalog/updates.rs crates/crazyagent/src/engine/owner/transport/icloud.rs crates/crazyagent/src/engine/owner/transport/ide.rs crates/crazyagent/src/engine/owner/transport/ide_extensions.rs crates/crazyagent/src/engine/owner/transport/ide_tab.rs crates/crazyagent/src/engine/owner/transport/native_auth.rs crates/crazyagent/src/engine/owner/transport/overview.rs crates/crazyagent/src/engine/owner/transport/owner_pipe_windows_tests.rs crates/crazyagent/src/engine/owner/transport/owner_stream.rs crates/crazyagent/src/engine/owner/transport/owner_stream_tests.rs crates/crazyagent/src/engine/owner/transport/plugins.rs crates/crazyagent/src/engine/owner/transport/process.rs crates/crazyagent/src/engine/owner/transport/questions.rs crates/crazyagent/src/engine/owner/transport/recovery.rs crates/crazyagent/src/engine/owner/transport/roadmap.rs crates/crazyagent/src/engine/owner/transport/terminal.rs crates/crazyagent/src/engine/owner/transport/usage.rs crates/crazyagent/src/engine/owner/transport/watch.rs
          code=$?
          echo "rustfmt rc $code"
          [ "$code" = 0 ]
      - name: Line caps at the tip against the base (expect no file new to the problem list)
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          git worktree add --detach "$RUNNER_TEMP/caps-base" "$BASE" || exit 1
          node scripts/quality/caps.mjs "$RUNNER_TEMP/caps-base" 2> "$RUNNER_TEMP/caps-base.txt"
          base_rc=$?
          node scripts/quality/caps.mjs 2> "$RUNNER_TEMP/caps-tip.txt"
          tip_rc=$?
          for name in base tip; do echo "caps $name problems:"; sed '$d' "$RUNNER_TEMP/caps-$name.txt"; done
          for name in base tip; do sed '$d' "$RUNNER_TEMP/caps-$name.txt" | awk '{print $1}' | sort -u > "$RUNNER_TEMP/caps-$name-files.txt"; done
          new=$(comm -13 "$RUNNER_TEMP/caps-base-files.txt" "$RUNNER_TEMP/caps-tip-files.txt" | tee "$RUNNER_TEMP/caps-new.txt" | wc -l | tr -d ' ')
          owner=$(grep -c 'engine/owner/transport' "$RUNNER_TEMP/caps-tip.txt" || true)
          echo "new vs base:"; cat "$RUNNER_TEMP/caps-new.txt"
          echo "caps base rc $base_rc problems $(wc -l < "$RUNNER_TEMP/caps-base-files.txt" | tr -d ' ') tip rc $tip_rc problems $(wc -l < "$RUNNER_TEMP/caps-tip-files.txt" | tr -d ' ') new $new owner transport lines $owner"
          [ "$new" = 0 ] && [ "$owner" = 0 ]
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          grep -E '^ +(Checking|Compiling) crazyagent v' "$log" || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent ubuntu-22.04 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the checked connect rows 5x (expect 2 rows, all pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          rc=0
          for run in 1 2 3 4 5; do bash "$RUNNER_TEMP/rows.sh" "tip-$run" pass owner_stream_tests:: 2 || rc=1; done
          [ "$rc" = 0 ]
      - name: Tip, every owner_server_tests row (expect all pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          bash "$RUNNER_TEMP/rows.sh" owner_server_tests pass owner_server_tests:: any
  windows:
    name: SEC-F1 crazyagent clippy, checked connect rows and owner pipe rows on windows-2022, red then tip
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='SEC-F1 tip %H %s' HEAD^
          [ "$(git rev-parse HEAD^)" = "$TIP" ] || { echo "::error::the parent is not the SEC-F1 tip"; exit 1; }
          [ "$(git rev-parse HEAD~2)" = "$FIX" ] || { echo "::error::HEAD~2 is not the fix commit"; exit 1; }
          [ "$(git rev-parse HEAD~3)" = "$RED" ] || { echo "::error::HEAD~3 is not the red test commit"; exit 1; }
          [ "$(git rev-parse HEAD~4)" = "$BASE" ] || { echo "::error::HEAD~4 is not the base"; exit 1; }
          [ "$(git diff --name-only HEAD~4 HEAD^ | tr '\n' ' ')" = "$FILES" ] || { echo "::error::the range touches other files"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the SEC-F1 tip"; exit 1; }
      - name: Write the row runner
        run: |
          set -euo pipefail
          printf '%s\n' "$ROWS_SH" > "$RUNNER_TEMP/rows.sh"
          bash -n "$RUNNER_TEMP/rows.sh"
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
      - name: Fetch the locked crates
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo fetch --locked
      - name: Red, the checked connect source row at the red test commit (expect 1 row, failed)
        timeout-minutes: 60
        run: |
          set +e
          set -uo pipefail
          git checkout "$RED" -- crates scripts || exit 1
          git rm -q --cached crates/crazyagent/src/engine/owner/transport/owner_stream.rs || exit 1
          rm crates/crazyagent/src/engine/owner/transport/owner_stream.rs || exit 1
          git diff --quiet "$RED" -- crates scripts || { echo "::error::the red tree is not the red test commit"; exit 1; }
          bash "$RUNNER_TEMP/rows.sh" red red owner_stream_tests:: 1
          rc=$?
          git checkout HEAD^ -- crates scripts || exit 1
          git diff --quiet HEAD^ || { echo "::error::the tree is not back at the tip"; exit 1; }
          echo "red leg rc $rc"
          [ "$rc" = 0 ]
      - name: crazyagent clippy --lib --tests at the tip (expect rc 0, 0 errors, 0 warnings)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy.log"
          cargo clippy -p crazyagent --lib --tests --locked -- -D warnings > "$log" 2>&1
          code=$?
          grep -E '^(error|warning)(\[|:)|^ +--> ' "$log" | head -n 80 || true
          tail -n 5 "$log"
          grep -E '^ +(Checking|Compiling) crazyagent v' "$log" || true
          errors="$(grep -cE '^error(\[|:)' "$log" || true)"
          warnings="$(grep -cE '^warning(\[|:)' "$log" || true)"
          checked="$(grep -cE '^ +(Checking|Compiling) crazyagent v' "$log" || true)"
          echo "clippy crazyagent windows-2022 rc $code errors $errors warnings $warnings checked $checked"
          [ "$code" = 0 ] && [ "$errors" = 0 ] && [ "$warnings" = 0 ] && [ "$checked" -ge 1 ] || exit 1
      - name: Tip, the checked connect rows 5x (expect 2 rows, all pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          rc=0
          for run in 1 2 3 4 5; do bash "$RUNNER_TEMP/rows.sh" "tip-$run" pass owner_stream_tests:: 2 || rc=1; done
          [ "$rc" = 0 ]
      - name: Tip, every owner_pipe_windows_tests row (expect all pass)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          bash "$RUNNER_TEMP/rows.sh" owner_pipe_windows_tests pass owner_pipe_windows_tests:: any
