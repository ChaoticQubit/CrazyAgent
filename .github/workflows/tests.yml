name: Tests

on:
  push:
    branches:
      - "test-farm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: BWRAP-ROOT-SWAP fix rows and clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the test farm runs only on GitHub-hosted runners"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 7
      - name: Restore the branch tip's tests.yml under the farm one
        run: |
          set -euo pipefail
          git log -1 --format='farm %H %s'
          git log -1 --format='probe-only pick %H %s' HEAD^
          git log -1 --format='fix tip %H %s' HEAD^^
          [ "$(git rev-parse HEAD^^)" = 6aaa0dadbb5f249713dbb01d378b647b37805c67 ] || { echo "::error::the grandparent is not the fix tip 6aaa0dadbb"; exit 1; }
          [ "$(git rev-parse HEAD^)" = bc2b792970b2f1bc79a36b80ad2d76072b2e61aa ] || { echo "::error::the parent is not the probe-only ef337e841 pick bc2b792970"; exit 1; }
          [ "$(git rev-parse HEAD~6)" = 25373789a82ef6ca344b395b6b62f5124f4277dd ] || { echo "::error::HEAD~6 is not b23 25373789a8"; exit 1; }
          git checkout HEAD^ -- .github/workflows/tests.yml
          git diff --quiet HEAD^ || { echo "::error::the tree is not the pick on the fix tip"; exit 1; }
      - name: Free runner disk
        run: |
          set +e
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          [ "$(rustup run "$RUST_TOOLCHAIN" rustc -V | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc is not $RUST_TOOLCHAIN"; exit 1; }
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
      - name: Runner facts
        run: |
          set +e
          uname -r
          bwrap --version
          echo "tmp filesystem: $(stat -f -c %T /tmp)"
      - name: Clippy crazyagent-kernel-sandbox
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-kernel-sandbox.log"
          cargo clippy -p crazyagent-kernel-sandbox --lib --tests --locked --keep-going --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          echo "crazyagent-kernel-sandbox clippy rc $code"
          exit $code
      - name: Kernel sandbox Linux lib rows
        if: always()
        timeout-minutes: 60
        run: |
          set +e
          log="$RUNNER_TEMP/lib-rows.log"
          cargo test -p crazyagent-kernel-sandbox --lib --locked -- linux:: > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ tests|FAILED|panicked at|test result|^error' "$log" | head -n 80 || true
          grep -E '^test .*(places|bound|bubblewrap_launch_names|without_its_identity|filter_request).* \.\.\. ' "$log" || true
          tail -n 3 "$log"
          echo "kernel-sandbox linux lib rows rc $code"
          exit $code
      - name: Linux sandbox rows, every row
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/linux-sandbox.log"
          cargo test -p crazyagent --test linux_sandbox --locked -- --test-threads 1 > "$log" 2>&1
          code=$?
          grep -E '^running [0-9]+ tests|^test .* \.\.\. |panicked at|exit Some|exit None|test result|^error' "$log" | head -n 400 || true
          echo "FAILED rows:"
          grep -E '^test .* \.\.\. FAILED' "$log" || true
          tail -n 3 "$log"
          echo "linux_sandbox rows rc $code"
          exit $code
      - name: Clippy crazyagent
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          log="$RUNNER_TEMP/clippy-crazyagent.log"
          cargo clippy -p crazyagent --lib --tests --locked --keep-going --message-format short -- -D warnings > "$log" 2>&1
          code=$?
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' "$log" | sort -u | head -n 300 || true
          tail -n 5 "$log"
          df -h /
          echo "crazyagent clippy rc $code"
          exit $code
