name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ENGINE_TESTS_EXCLUDE: >-
    e2e_team e2e_tui research_engine smoke team_engine terminal_owner terminal_session terminal_tmux
    onboarding research_runner research_service research_managed tui_v1_e2e codex_app_server_live launch_context_live
    qualification_boundary worker_engine_boundary accounts_binary e2e_add_existing setup_network
    credential_platforms linux_sandbox windows_terminal
  DESKTOP_TESTS_EXCLUDE: conversation_native picker_windows
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Format, typecheck and Linux lint
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Linux build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsqlite3-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ci-linux-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Check Rust formatting
        run: make fmt-check
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lint engine for Linux
        run: cargo clippy -p crazyagent --all-targets --locked --offline -- -D warnings

  macos:
    name: macOS lint and tests
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.RCLI_SOURCE_REPOSITORY }}
          ref: ${{ env.RCLI_SOURCE_REVISION }}
          path: .local-state/tools/rcli-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ci-macos-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install rcli source dependencies
        working-directory: .local-state/tools/rcli-source
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lint workspace
        run: make lint
      - name: Test engine and desktop crates
        run: |
          set -euo pipefail
          engine=()
          for file in crates/crazyagent/tests/*.rs; do
            name="$(basename "$file" .rs)"
            case " $ENGINE_TESTS_EXCLUDE " in
              *" $name "*) ;;
              *) engine+=(--test "$name") ;;
            esac
          done
          desktop=()
          for file in apps/desktop/src-tauri/tests/*.rs; do
            name="$(basename "$file" .rs)"
            case " $DESKTOP_TESTS_EXCLUDE " in
              *" $name "*) ;;
              *) desktop+=(--test "$name") ;;
            esac
          done
          echo "Engine test targets: ${#engine[@]} flags, desktop: ${#desktop[@]} flags"
          cargo build -p crazyagent --bin crazyagent --locked --offline
          export CRAZYAGENT_TEST_NATIVE_AUTH_HOST="$PWD/target/debug/crazyagent"
          cargo test -p crazyagent --locked --offline --bins "${engine[@]}"
          cargo test -p crazyagent-desktop --locked --offline --lib --bins "${desktop[@]}"
      - name: Test Node suites
        env:
          BUN: ${{ steps.bun.outputs.bun-path }}
        run: make test-node BUN="$BUN" NODE_TESTS_EXCLUDE="$NODE_TESTS_EXCLUDE"
      - name: Test Bun suites
        env:
          BUN: ${{ steps.bun.outputs.bun-path }}
        run: make test-bun BUN="$BUN" BUN_TESTS_EXCLUDE="$BUN_TESTS_EXCLUDE"

  windows:
    name: Windows lint and sandbox tests
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ci-windows-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lint engine and Windows sandbox
        run: cargo clippy -p crazyagent -p crazyagent-win-sandbox --all-targets --locked --offline -- -D warnings
      - name: Test Windows sandbox
        run: cargo test -p crazyagent-win-sandbox --locked --offline
