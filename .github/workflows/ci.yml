name: CI

on:
  pull_request:
  push:
    branches: ["chore/**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  CLAUDE_CODE_VERSION: "2.1.309"
  CODEX_VERSION: "0.164.0"
  UV_VERSION: "0.13.5"
  BUN_DARWIN_ARM64_SHA256: 80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403
  NODE_DARWIN_ARM64_SHA256: 1901d539912c02afa10d1cc126943a8855a7eedebe830119463470db5e6c59e8
  RUSTC_DARWIN_ARM64_SHA256: 738e3f60114b20550fcf4f8a57c9cea0544239f214709f45594ff3fde327f577
  CARGO_DARWIN_ARM64_SHA256: de51d4fade4f31ad8ec405261cc96bedc000d905f98980027610d6e288dbe21b
  RUST_STD_DARWIN_ARM64_SHA256: 2de831ef563ce772519a4d18ba2659f0f7428d497ef66dad24b5a35e8f8cd177
  CLIPPY_DARWIN_ARM64_SHA256: 1ad080040ff0f4f8af0751bd7fa1fb1901212f8d164cecaa3c47b0654e0916f2
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  ENGINE_TESTS_EXCLUDE: >-
    e2e_tui research_engine team_engine onboarding research_runner research_service tui_v1_e2e codex_app_server_live launch_context_live codex_bridge_live agents_live
    qualification_boundary worker_engine_boundary accounts_binary e2e_add_existing setup_network harness_catalog_bundled_rcli acceptance_v2_rcli_usage
  DESKTOP_TESTS_EXCLUDE: picker_windows
  NODE_TESTS_EXCLUDE: apps/desktop/test/native/zero-retry-tauri-service.test.mjs apps/desktop/test/native/zero-retry-tauri-service-constructor.test.mjs
  BUN_TESTS_EXCLUDE: scripts/rcli/host.construction.test.ts

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux format, typecheck, lint and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PLATFORM_TESTS_EXCLUDE: >-
        credential_platforms windows_terminal agent_secret_walls setup team_project_root
        harness_launch launch_context project_sandbox sandbox_everywhere terminal_session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null && [ -x "$HOME/.cargo/bin/rustup" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v rustup >/dev/null || { echo "::error::rustup is not installed for the runner user; install it from https://rustup.rs and restart the runner service"; exit 1; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Linux build packages
        run: |
          set -euo pipefail
          command -v dpkg >/dev/null || { echo "::error::this job needs a Debian or Ubuntu runner with dpkg"; exit 1; }
          packages=(build-essential pkg-config curl libsqlite3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap libevent-dev libncurses-dev dbus gnome-keyring)
          missing=()
          for package in "${packages[@]}"; do
            [ "$(dpkg -s "$package" 2>/dev/null | sed -n 's/^Status: //p')" = "install ok installed" ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "all ${#packages[@]} build packages are installed"
            exit 0
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "::error::missing packages: ${missing[*]}. This runner has no passwordless sudo; provision it with: sudo apt-get install -y --no-install-recommends ${missing[*]}"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
      - name: Install tmux
        run: |
          set -euo pipefail
          prefix="$RUNNER_TOOL_CACHE/tmux/$TMUX_VERSION/x64"
          if [ ! -f "$prefix.complete" ]; then
            work="$RUNNER_TEMP/tmux"
            rm -rf "$work" "$prefix"
            mkdir -p "$work"
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
            echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
            tar -xzf "$work/tmux.tar.gz" -C "$work"
            (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
            rm -rf "$work"
            touch "$prefix.complete"
          fi
          test "$("$prefix/bin/tmux" -V)" = "tmux $TMUX_VERSION"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          found=""
          for dir in /opt/homebrew/bin /usr/local/bin /usr/bin /bin; do
            if [ -x "$dir/tmux" ]; then found="$dir/tmux"; break; fi
          done
          version="$([ -z "$found" ] || "$found" -V)"
          if [[ "$version" =~ ^tmux\ ([0-9]+)\.([0-9]+) ]] && (( BASH_REMATCH[1] > 3 || (BASH_REMATCH[1] == 3 && BASH_REMATCH[2] >= 4) )); then
            echo "the engine uses $found ($version)"
            exit 0
          fi
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo "::error::the engine looks for tmux 3.4 or later only in /opt/homebrew/bin, /usr/local/bin, /usr/bin and /bin, and found ${found:-none} ${version}. Provision this runner once with: sudo ln -sf $prefix/bin/tmux /usr/local/bin/tmux"
            exit 1
          fi
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Install Claude Code
        env:
          CLAUDE_CODE_PACKAGE: claude-code-linux-x64
          CLAUDE_CODE_SHA256: e960c4437f6f99648437784db43e04ad5f12711aecd710864f96876f94c2fc1a
        run: |
          set -euo pipefail
          prefix="$RUNNER_TOOL_CACHE/claude-code/$CLAUDE_CODE_VERSION/x64"
          work="$RUNNER_TEMP/claude-code"
          rm -rf "$work"
          mkdir -p "$prefix" "$work/bin"
          if [ -f "$prefix/claude.tgz" ]; then
            cp "$prefix/claude.tgz" "$work/claude.tgz"
          fi
          if ! echo "$CLAUDE_CODE_SHA256  $work/claude.tgz" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/claude.tgz" "https://registry.npmjs.org/@anthropic-ai/$CLAUDE_CODE_PACKAGE/-/$CLAUDE_CODE_PACKAGE-$CLAUDE_CODE_VERSION.tgz"
            echo "$CLAUDE_CODE_SHA256  $work/claude.tgz" | sha256sum -c -
            cp "$work/claude.tgz" "$prefix/claude.tgz.$$"
            mv "$prefix/claude.tgz.$$" "$prefix/claude.tgz"
          fi
          tar -xzf "$work/claude.tgz" -C "$work" package/claude
          install -m 0755 "$work/package/claude" "$work/bin/claude"
          test "$("$work/bin/claude" --version | cut -d' ' -f1)" = "$CLAUDE_CODE_VERSION"
          echo "$work/bin" >> "$GITHUB_PATH"
      - name: Install uv
        env:
          UV_TARGET: x86_64-unknown-linux-gnu
          UV_SHA256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
        run: |
          set -euo pipefail
          prefix="$RUNNER_TOOL_CACHE/uv/$UV_VERSION/x64"
          work="$RUNNER_TEMP/uv"
          rm -rf "$work"
          mkdir -p "$prefix" "$work/bin"
          if [ -f "$prefix/uv.tar.gz" ]; then
            cp "$prefix/uv.tar.gz" "$work/uv.tar.gz"
          fi
          if ! echo "$UV_SHA256  $work/uv.tar.gz" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/uv.tar.gz" "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$UV_TARGET.tar.gz"
            echo "$UV_SHA256  $work/uv.tar.gz" | sha256sum -c -
            cp "$work/uv.tar.gz" "$prefix/uv.tar.gz.$$"
            mv "$prefix/uv.tar.gz.$$" "$prefix/uv.tar.gz"
          fi
          tar -xzf "$work/uv.tar.gz" -C "$work" "uv-$UV_TARGET/uv"
          install -m 0755 "$work/uv-$UV_TARGET/uv" "$work/bin/uv"
          test "$("$work/bin/uv" --version | cut -d' ' -f2)" = "$UV_VERSION"
          echo "$work/bin" >> "$GITHUB_PATH"
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: ci-linux
          cache-on-failure: true
      - name: Keep the Rust build cache under 20 GiB
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          target="$RUNNER_TOOL_CACHE/crazyagent-ci/target"
          mkdir -p "$target"
          size_kib="$(du -sk "$target" | cut -f1)"
          if (( size_kib > 20 * 1024 * 1024 )); then
            echo "pruning $target: ${size_kib} KiB"
            rm -rf "$target"
            mkdir -p "$target"
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - name: Check Rust formatting
        run: make fmt-check
      - name: Check the price snapshot script
        run: make test-price-script
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Show the kernel's sandbox features
        run: |
          set -euo pipefail
          echo "kernel $(uname -r)"
          echo "lsm $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
          cargo build -p crazyagent --bin crazyagent-landlock --locked --offline
          helper="${CARGO_TARGET_DIR:-target}/debug/crazyagent-landlock"
          for args in "--probe" "--probe --limit-network" "--probe --limit-network --open-sockets"; do
            status=0
            "$helper" $args || status=$?
            echo "crazyagent-landlock $args: exit $status"
          done
      - name: Lint workspace
        run: make lint
      - name: Test engine and desktop crates
        run: |
          set -euo pipefail
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s\n" ci-keyring | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null
            make test-rust-selected ENGINE_TESTS_EXCLUDE="$ENGINE_TESTS_EXCLUDE $PLATFORM_TESTS_EXCLUDE" DESKTOP_TESTS_EXCLUDE="$DESKTOP_TESTS_EXCLUDE"
          '

  macos:
    name: macOS lint and tests
    runs-on: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","macOS","badal"]' || '"macos-15"') }}
    timeout-minutes: 150
    env:
      PLATFORM_TESTS_EXCLUDE: credential_platforms linux_sandbox windows_terminal instruction_files::tests::import::a_reftable_checkout_names_the_branch_it_switched_to
    steps:
      - name: Refuse to run under Rosetta
        run: |
          set -euo pipefail
          if [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || true)" = 1 ]; then
            echo "::error::this job runs as x86_64 under Rosetta; reinstall the runner with the macOS ARM64 package"
            exit 1
          fi
          echo "native $(uname -m)"
      - name: Keep CI state out of the runner user's home
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          state="$RUNNER_TOOL_CACHE/crazyagent-ci"
          home="$RUNNER_TEMP/home"
          target="$state/target-line-tables"
          mkdir -p "$state"
          size_kib="$(du -sk "$state" | cut -f1)"
          if (( size_kib > 20 * 1024 * 1024 )); then
            echo "pruning $state: ${size_kib} KiB"
            rm -rf "$state"
          fi
          mkdir -p "$state"
          find "$state" -mindepth 1 -maxdepth 1 -name 'target*' ! -name target-line-tables -exec rm -rf {} +
          free_kib="$(df -Pk "$RUNNER_TOOL_CACHE" | awk 'NR == 2 { print $4 }')"
          echo "runner tool cache volume: $(( free_kib / 1024 / 1024 )) GiB free before the build"
          if (( free_kib < 15 * 1024 * 1024 )); then
            echo "::error::badal has $(( free_kib / 1024 / 1024 )) GiB free on the runner tool cache volume and this job needs 15 GiB; free disk on badal, then run the job again"
            exit 1
          fi
          rm -rf "$home"
          mkdir -p "$home" "$target" "$state/cargo-home" "$state/npm-cache" "$state/bun-cache"
          {
            echo "HOME=$home"
            echo "CARGO_HOME=$state/cargo-home"
            echo "CARGO_TARGET_DIR=$target"
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
            echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
            echo "npm_config_cache=$state/npm-cache"
            echo "BUN_INSTALL_CACHE_DIR=$state/bun-cache"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.RCLI_SOURCE_REPOSITORY }}
          ref: ${{ env.RCLI_SOURCE_REVISION }}
          path: .local-state/tools/rcli-source
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - id: bun
        if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Node on the owner's runner
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          [ "$(uname -s)/$(uname -m)" = Darwin/arm64 ] || { echo "::error::the CI runner on badal must be native macOS arm64"; exit 1; }
          prefix="$RUNNER_TOOL_CACHE/crazyagent-ci/node/$NODE_VERSION/arm64"
          work="$RUNNER_TEMP/node-arm64"
          rm -rf "$work"
          mkdir -p "$prefix" "$work"
          if [ -f "$prefix/node.tar.gz" ]; then
            cp "$prefix/node.tar.gz" "$work/node.tar.gz"
          fi
          if ! echo "$NODE_DARWIN_ARM64_SHA256  $work/node.tar.gz" | shasum -a 256 -s -c - 2>/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/node.tar.gz" "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-darwin-arm64.tar.gz"
            echo "$NODE_DARWIN_ARM64_SHA256  $work/node.tar.gz" | shasum -a 256 -c -
            cp "$work/node.tar.gz" "$prefix/node.tar.gz.$$"
            mv "$prefix/node.tar.gz.$$" "$prefix/node.tar.gz"
          fi
          tar -xzf "$work/node.tar.gz" -C "$work" --strip-components 1
          test "$("$work/bin/node" --version)" = "v$NODE_VERSION"
          test "$("$work/bin/node" -p process.arch)" = arm64
          echo "$work/bin" >> "$GITHUB_PATH"
      - id: bun-arm64
        name: Install pinned arm64 bun on the owner's runner
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          [ "$(uname -s)/$(uname -m)" = Darwin/arm64 ] || { echo "::error::the CI runner on badal must be native macOS arm64"; exit 1; }
          prefix="$RUNNER_TOOL_CACHE/crazyagent-ci/bun/$BUN_VERSION/arm64"
          work="$RUNNER_TEMP/bun-arm64"
          rm -rf "$work"
          mkdir -p "$prefix" "$work/bin"
          if [ -f "$prefix/bun.zip" ]; then
            cp "$prefix/bun.zip" "$work/bun.zip"
          fi
          if ! echo "$BUN_DARWIN_ARM64_SHA256  $work/bun.zip" | shasum -a 256 -s -c - 2>/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-darwin-aarch64.zip"
            echo "$BUN_DARWIN_ARM64_SHA256  $work/bun.zip" | shasum -a 256 -c -
            cp "$work/bun.zip" "$prefix/bun.zip.$$"
            mv "$prefix/bun.zip.$$" "$prefix/bun.zip"
          fi
          unzip -q "$work/bun.zip" -d "$work"
          install -m 0755 "$work/bun-darwin-aarch64/bun" "$work/bin/bun"
          test "$("$work/bin/bun" --version)" = "$BUN_VERSION"
          test "$("$work/bin/bun" -e 'console.log(process.arch)')" = arm64
          echo "bun-path=$work/bin/bun" >> "$GITHUB_OUTPUT"
          echo "$work/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null && [ -x "$HOME/.cargo/bin/rustup" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v rustup >/dev/null || { echo "::error::rustup is not installed for the runner user; install it from https://rustup.rs and restart the runner service"; exit 1; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install pinned Rust on the owner's runner
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          [ "$(uname -s)/$(uname -m)" = Darwin/arm64 ] || { echo "::error::the CI runner on badal must be native macOS arm64"; exit 1; }
          dir="$(dirname "$GITHUB_WORKSPACE")"
          while :; do
            for config in "$dir/.cargo/config.toml" "$dir/.cargo/config"; do
              if [ -e "$config" ]; then
                echo "::error::Cargo reads $config from outside the checkout; remove it from the runner, CI never builds with settings left on the runner"
                exit 1
              fi
            done
            if [ "$dir" = / ]; then break; fi
            dir="$(dirname "$dir")"
          done
          for config in "$CARGO_HOME/config.toml" "$CARGO_HOME/config"; do
            [ ! -e "$config" ] || { echo "::error::Cargo reads $config from the Cargo home CI keeps across runs; remove it, CI never builds with Cargo settings left in its cache"; exit 1; }
          done
          prefix="$RUNNER_TOOL_CACHE/crazyagent-ci/rust/$RUST_TOOLCHAIN"
          work="$RUNNER_TEMP/rust"
          rm -rf "$work"
          mkdir -p "$prefix" "$work"
          components=("rustc aarch64-apple-darwin $RUSTC_DARWIN_ARM64_SHA256" "cargo aarch64-apple-darwin $CARGO_DARWIN_ARM64_SHA256" "rust-std aarch64-apple-darwin $RUST_STD_DARWIN_ARM64_SHA256" "clippy aarch64-apple-darwin $CLIPPY_DARWIN_ARM64_SHA256")
          for component in "${components[@]}"; do
            read -r name triple sha <<< "$component"
            archive="$name-$RUST_TOOLCHAIN-$triple.tar.xz"
            if [ -f "$prefix/$archive" ]; then
              cp "$prefix/$archive" "$work/$archive"
            fi
            if ! echo "$sha  $work/$archive" | shasum -a 256 -s -c - 2>/dev/null; then
              curl -fsSL --proto '=https' --tlsv1.2 -o "$work/$archive" "https://static.rust-lang.org/dist/$archive"
              echo "$sha  $work/$archive" | shasum -a 256 -c -
              cp "$work/$archive" "$prefix/$archive.$$"
              mv "$prefix/$archive.$$" "$prefix/$archive"
            fi
            tar -xJf "$work/$archive" -C "$work"
            "$work/$name-$RUST_TOOLCHAIN-$triple/install.sh" --prefix="$work" --disable-ldconfig > /dev/null
          done
          export PATH="$work/bin:$PATH"
          test "$(command -v rustc)" = "$work/bin/rustc"
          test "$(command -v cargo)" = "$work/bin/cargo"
          test "$(command -v cargo-clippy)" = "$work/bin/cargo-clippy"
          clippy="0.1.$(echo "$RUST_TOOLCHAIN" | cut -d. -f2)"
          case "$(rustc --version)" in "rustc $RUST_TOOLCHAIN "*) ;; *) echo "::error::the pinned rustc reports $(rustc --version)"; exit 1 ;; esac
          case "$(cargo --version)" in "cargo $RUST_TOOLCHAIN "*) ;; *) echo "::error::the pinned cargo reports $(cargo --version)"; exit 1 ;; esac
          case "$(cargo clippy --version)" in "clippy $clippy "*) ;; *) echo "::error::the pinned clippy reports $(cargo clippy --version)"; exit 1 ;; esac
          test -d "$(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/lib"
          echo "$work/bin" >> "$GITHUB_PATH"
      - name: Install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          found=""
          for dir in /opt/homebrew/bin /usr/local/bin /usr/bin /bin; do
            if [ -x "$dir/tmux" ]; then found="$dir/tmux"; break; fi
          done
          if [ -z "$found" ]; then
            if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
              echo "::error::missing: tmux 3.4 or later in /opt/homebrew/bin, /usr/local/bin, /usr/bin or /bin. This runner is not provisioned for CrazyAgent CI; install tmux on it once (for example: brew install tmux)"
              exit 1
            fi
            brew install tmux
            found="$(brew --prefix)/bin/tmux"
          fi
          version="$("$found" -V)"
          echo "the engine uses $found ($version)"
          [[ "$version" =~ ^tmux\ ([0-9]+)\.([0-9]+) ]] || { echo "unexpected tmux version: $version" >&2; exit 1; }
          (( BASH_REMATCH[1] > 3 || (BASH_REMATCH[1] == 3 && BASH_REMATCH[2] >= 4) )) || { echo "tmux 3.4 or later is required: $version" >&2; exit 1; }
      - name: Install Claude Code
        env:
          CLAUDE_CODE_PACKAGE: claude-code-darwin-arm64
          CLAUDE_CODE_SHA256: 0e8ce1ddb8566129661bb7698db69db89d904e23b464afc6e85d5bd8879b9a51
        run: |
          set -euo pipefail
          prefix="$RUNNER_TOOL_CACHE/claude-code/$CLAUDE_CODE_VERSION/arm64"
          work="$RUNNER_TEMP/claude-code"
          rm -rf "$work"
          mkdir -p "$prefix" "$work/bin"
          if [ -f "$prefix/claude.tgz" ]; then
            cp "$prefix/claude.tgz" "$work/claude.tgz"
          fi
          if ! echo "$CLAUDE_CODE_SHA256  $work/claude.tgz" | shasum -a 256 -s -c - 2>/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/claude.tgz" "https://registry.npmjs.org/@anthropic-ai/$CLAUDE_CODE_PACKAGE/-/$CLAUDE_CODE_PACKAGE-$CLAUDE_CODE_VERSION.tgz"
            echo "$CLAUDE_CODE_SHA256  $work/claude.tgz" | shasum -a 256 -c -
            cp "$work/claude.tgz" "$prefix/claude.tgz.$$"
            mv "$prefix/claude.tgz.$$" "$prefix/claude.tgz"
          fi
          tar -xzf "$work/claude.tgz" -C "$work" package/claude
          install -m 0755 "$work/package/claude" "$work/bin/claude"
          test "$("$work/bin/claude" --version | cut -d' ' -f1)" = "$CLAUDE_CODE_VERSION"
          echo "$work/bin" >> "$GITHUB_PATH"
      - name: Install Codex
        env:
          CODEX_PACKAGE: codex-package-aarch64-apple-darwin.tar.gz
          CODEX_SHA256: dd99e9092270691a67bdde7be04ac283dea9da8e86cbde356c2cc851a79205fa
        run: |
          set -euo pipefail
          prefix="$RUNNER_TOOL_CACHE/codex/$CODEX_VERSION/arm64"
          work="$RUNNER_TEMP/codex"
          rm -rf "$work"
          mkdir -p "$prefix" "$work"
          if [ -f "$prefix/codex.tgz" ]; then
            cp "$prefix/codex.tgz" "$work/codex.tgz"
          fi
          if ! echo "$CODEX_SHA256  $work/codex.tgz" | shasum -a 256 -s -c - 2>/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/codex.tgz" "https://github.com/openai/codex/releases/download/rust-v$CODEX_VERSION/$CODEX_PACKAGE"
            echo "$CODEX_SHA256  $work/codex.tgz" | shasum -a 256 -c -
            cp "$work/codex.tgz" "$prefix/codex.tgz.$$"
            mv "$prefix/codex.tgz.$$" "$prefix/codex.tgz"
          fi
          tar -xzf "$work/codex.tgz" -C "$work"
          test "$("$work/bin/codex" --version)" = "codex-cli $CODEX_VERSION"
          echo "$work/bin" >> "$GITHUB_PATH"
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: ci-macos
          cache-on-failure: true
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install IDE extension dependencies
        working-directory: apps/ide-extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install rcli source dependencies
        working-directory: .local-state/tools/rcli-source
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lint workspace
        run: make lint
      - id: ide
        name: Read the pinned IDE build
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("crates/crazyagent/src/ide/builds.json", "utf8"));
            const { version } = manifest;
            const build = manifest.builds["aarch64-apple-darwin"];
            const url = `https://github.com/VSCodium/vscodium/releases/download/${version}/vscodium-reh-web-darwin-arm64-${version}.tar.gz`;
            const pinned = /^[0-9]+(\.[0-9]+)*$/.test(version) && build?.url === url && /^[0-9a-f]{64}$/.test(build.sha256)
              && Number.isSafeInteger(build.bytes) && build.bytes > 0 && build.bytes <= 150 * 1024 * 1024;
            if (!pinned) throw new Error("builds.json does not pin an official darwin-arm64 VSCodium build");
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nurl=${url}\nsha256=${build.sha256}\nbytes=${build.bytes}\n`);
          '
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.tool_cache }}/vscodium-reh-web/${{ steps.ide.outputs.version }}/arm64
          key: ci-macos-vscodium-reh-web-darwin-arm64-${{ steps.ide.outputs.version }}
      - name: Provision the pinned IDE build
        env:
          IDE_VERSION: ${{ steps.ide.outputs.version }}
          IDE_URL: ${{ steps.ide.outputs.url }}
          IDE_SHA256: ${{ steps.ide.outputs.sha256 }}
          IDE_BYTES: ${{ steps.ide.outputs.bytes }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TOOL_CACHE/vscodium-reh-web/$IDE_VERSION/arm64"
          work="$RUNNER_TEMP/vscodium-reh-web"
          build=".local-state/ide-cache/vscodium-$IDE_VERSION"
          rm -rf "$work" "$build"
          mkdir -p "$prefix" "$work" "$build"
          if [ -f "$prefix/vscodium.tgz" ]; then
            cp "$prefix/vscodium.tgz" "$work/vscodium.tgz"
          fi
          if ! echo "$IDE_SHA256  $work/vscodium.tgz" | shasum -a 256 -s -c - 2>/dev/null; then
            rm -f "$work/vscodium.tgz"
            curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --max-filesize "$IDE_BYTES" -o "$work/vscodium.tgz" "$IDE_URL"
            test "$(stat -f %z "$work/vscodium.tgz")" = "$IDE_BYTES"
            echo "$IDE_SHA256  $work/vscodium.tgz" | shasum -a 256 -c -
            cp "$work/vscodium.tgz" "$prefix/vscodium.tgz.$$"
            mv "$prefix/vscodium.tgz.$$" "$prefix/vscodium.tgz"
          fi
          tar -xzf "$work/vscodium.tgz" -C "$build"
          test -f "$build/out/server-main.js"
          find "$RUNNER_TOOL_CACHE/vscodium-reh-web" -mindepth 1 -maxdepth 1 ! -name "$IDE_VERSION" -exec rm -rf {} +
      - name: Test engine and desktop crates
        run: make test-rust-selected ENGINE_TESTS_EXCLUDE="$ENGINE_TESTS_EXCLUDE $PLATFORM_TESTS_EXCLUDE" DESKTOP_TESTS_EXCLUDE="$DESKTOP_TESTS_EXCLUDE"
      - name: Test Node suites
        env:
          BUN: ${{ steps.bun.outputs.bun-path || steps.bun-arm64.outputs.bun-path }}
        run: make test-node BUN="$BUN" NODE_TESTS_EXCLUDE="$NODE_TESTS_EXCLUDE"
      - name: Test Bun suites
        env:
          BUN: ${{ steps.bun.outputs.bun-path || steps.bun-arm64.outputs.bun-path }}
        run: make test-bun BUN="$BUN" BUN_TESTS_EXCLUDE="$BUN_TESTS_EXCLUDE"
      - name: Show the free disk and trim the CI cache on the owner's runner
        if: always() && runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          case "$RUNNER_TOOL_CACHE" in /?*) ;; *) echo "::error::RUNNER_TOOL_CACHE is not an absolute path; nothing trimmed"; exit 1 ;; esac
          state="$RUNNER_TOOL_CACHE/crazyagent-ci"
          target="$state/target-line-tables"
          free_gib() { df -Pk "$RUNNER_TOOL_CACHE" | awk 'NR == 2 { print int($4 / 1048576) }'; }
          echo "runner tool cache volume: $(free_gib) GiB free after the tests"
          if [ -d "$target" ]; then
            du -sk "$target" | awk '{ printf "Rust target: %.1f GiB\n", $1 / 1048576 }'
          fi
          if [ -d "$state" ] && [ ! -L "$state" ]; then
            size_kib="$(du -sk "$state" | cut -f1)"
            if (( size_kib > 10 * 1024 * 1024 )); then
              echo "trimming the Rust targets in $state: ${size_kib} KiB"
              find "$state" -mindepth 1 -maxdepth 1 -name 'target*' -exec rm -rf {} +
            fi
            size_kib="$(du -sk "$state" | cut -f1)"
            if (( size_kib > 10 * 1024 * 1024 )); then
              echo "pruning $state: ${size_kib} KiB"
              rm -rf "$state"
            fi
          fi
          echo "runner tool cache volume: $(free_gib) GiB free after the trim"

  windows:
    name: Windows lint and tests (informational until v2.2.1)
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: ci-windows
          cache-on-failure: true
      - name: Install SQLite for Windows
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Test Windows sandbox, terminal, code graph switch and picker
        run: |
          set -euo pipefail
          cargo test -p crazyagent-win-sandbox --locked --offline
          cargo test -p crazyagent --locked --offline --test windows_terminal
          cargo test -p crazyagent --locked --offline --lib -- storage::setup::switch_tests onboarding::step_tests
          cargo test -p crazyagent-desktop --locked --offline --test picker_windows
