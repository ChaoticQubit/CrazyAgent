name: R1 probe

on:
  push:
    branches:
      - "test-farm/r1-probe"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

jobs:
  probe:
    name: R1 probe 2, who can change the farm tmux path
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Refuse a runner that is not GitHub-hosted
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::the R1 probe runs only on GitHub-hosted runners"; exit 1; }
      - name: Path parts before the farm install
        run: |
          set -euo pipefail
          id
          for part in / /usr /usr/local /usr/local/bin /usr/bin /usr/bin/tmux /bin; do
            stat -c 'R2 before %A %U:%G %a %F %n' "$part" || true
          done
          dpkg -S /usr/bin/tmux || true
          dpkg -l tmux || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux packages
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh
      - name: Install tmux as the farm does
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tmux"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $work/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          (cd "$work/tmux-$TMUX_VERSION" && ./configure --prefix="$prefix" && make -j"$(nproc)" && make install)
          sudo install -m 0755 "$prefix/bin/tmux" /usr/local/bin/tmux
          test "$(/usr/local/bin/tmux -V)" = "tmux $TMUX_VERSION"
      - name: Path parts after the farm install
        run: |
          set -euo pipefail
          for part in / /usr /usr/local /usr/local/bin /usr/local/bin/tmux; do
            stat -c 'R2 after %A %U:%G %a %F %n' "$part"
          done
          getfacl -p /usr/local /usr/local/bin /usr/local/bin/tmux 2>/dev/null || true
          lsattr -d /usr/local/bin 2>/dev/null || true
          getent group "$(stat -c %G /usr/local/bin)" || true
          getent group "$(stat -c %G /usr/local)" || true
