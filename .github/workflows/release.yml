name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "26.12.1"
  BUN_VERSION: "1.4.3"
  RCLI_SOURCE_REPOSITORY: Backboard-io/Backboard-R-CLI
  RCLI_SOURCE_REVISION: 51bee17e02344de5fffd89523ce2b73d5042f216
  ARTIFACT_SIGNING_CLIENT_VERSION: "1.0.146"
  ARTIFACT_SIGNING_CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70
  BUN_DARWIN_X64_SHA256: 62660e6438eb872278877acca77e1152d5d031324df368d4a81b428211489d2d
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            version="$(node scripts/release/version.mjs stable "$REF_NAME")"
            channel=stable
            tag="$REF_NAME"
          else
            version="$(node scripts/release/version.mjs dev)"
            channel=dev
            tag=dev
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version on channel $channel"

  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prepare, ci]
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, badal]
            target: aarch64-apple-darwin
            os: macos
          - runner: [self-hosted, macOS, badal]
            target: x86_64-apple-darwin
            os: macos
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.os }}
    steps:
      - name: Refuse to run under Rosetta
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          if [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || true)" = 1 ]; then
            echo "::error::this job runs as x86_64 under Rosetta; reinstall the runner with the macOS ARM64 package"
            exit 1
          fi
          echo "native $(uname -m)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.RCLI_SOURCE_REPOSITORY }}
          ref: ${{ env.RCLI_SOURCE_REVISION }}
          path: .local-state/tools/rcli-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: bun-x64
        name: Install x86_64 bun for the Intel rcli host
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          arch -x86_64 /usr/bin/true || { echo "::error::Rosetta 2 is required to build the x86_64 rcli host; install it with: softwareupdate --install-rosetta --agree-to-license"; exit 1; }
          prefix="$RUNNER_TOOL_CACHE/bun/$BUN_VERSION/x64"
          if [ ! -f "$prefix.complete" ]; then
            work="$RUNNER_TEMP/bun-x64"
            rm -rf "$work" "$prefix"
            mkdir -p "$work" "$prefix/bin"
            curl -fsSL --proto '=https' --tlsv1.2 -o "$work/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-darwin-x64.zip"
            echo "$BUN_DARWIN_X64_SHA256  $work/bun.zip" | shasum -a 256 -c -
            unzip -q "$work/bun.zip" -d "$work"
            install -m 0755 "$work/bun-darwin-x64/bun" "$prefix/bin/bun"
            rm -rf "$work"
            touch "$prefix.complete"
          fi
          test "$("$prefix/bin/bun" --version)" = "$BUN_VERSION"
          test "$("$prefix/bin/bun" -e 'console.log(process.arch)')" = x64
          echo "bun-path=$prefix/bin/bun" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null && [ -x "$HOME/.cargo/bin/rustup" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          command -v rustup >/dev/null || { echo "::error::rustup is not installed for the runner user; install it from https://rustup.rs and restart the runner service"; exit 1; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Linux build packages
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file patchelf pkg-config libsqlite3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: Install SQLite for Windows
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          vcpkg install sqlite3:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
          } >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ matrix.target }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Keep the Rust build cache under 20 GiB
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          target="$RUNNER_TOOL_CACHE/crazyagent-ci/target"
          mkdir -p "$target"
          size_kib="$(du -sk "$target" | cut -f1)"
          if (( size_kib > 20 * 1024 * 1024 )); then
            echo "pruning $target: ${size_kib} KiB"
            rm -rf "$target"
            mkdir -p "$target"
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - name: Set release version
        run: node scripts/release/version.mjs set "$VERSION"
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install rcli source dependencies
        working-directory: .local-state/tools/rcli-source
        env:
          BUN_PATH: ${{ steps.bun-x64.outputs.bun-path || steps.bun.outputs.bun-path }}
        run: '"$BUN_PATH" install --frozen-lockfile --ignore-scripts'
      - name: Build command line binaries
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" -p crazyagent --bins
          if [ "$PLATFORM" = windows ]; then
            cargo build --release --locked --target "$TARGET" -p crazyagent-win-sandbox --bin crazyagent-win-boundary
          fi
      - name: Build rcli host
        env:
          BUN_PATH: ${{ steps.bun-x64.outputs.bun-path || steps.bun.outputs.bun-path }}
        run: |
          set -euo pipefail
          exe=""
          if [ "$PLATFORM" = windows ]; then exe=".exe"; fi
          mkdir -p "$RUNNER_TEMP/rcli"
          node scripts/release/rcli.mjs --sdk "$GITHUB_WORKSPACE/.local-state/tools/rcli-source" --bun "$BUN_PATH" --output "$RUNNER_TEMP/rcli/crazyagent-rcli$exe"
          echo "RCLI_HOST=$RUNNER_TEMP/rcli/crazyagent-rcli$exe" >> "$GITHUB_ENV"
      - name: Stage desktop sidecars
        run: node scripts/release/assets.mjs stage --target "$TARGET" --cargo-dir "${CARGO_TARGET_DIR:-target}/$TARGET/release" --rcli "$RCLI_HOST" --tauri-dir apps/desktop/src-tauri
      - name: Prepare Windows signing tools
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/artifact-signing.nupkg"
          curl -fsSL --retry 3 -o "$package" "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$ARTIFACT_SIGNING_CLIENT_VERSION/microsoft.artifactsigning.client.$ARTIFACT_SIGNING_CLIENT_VERSION.nupkg"
          echo "$ARTIFACT_SIGNING_CLIENT_SHA256  $package" | sha256sum -c -
          unzip -q "$package" -d "$RUNNER_TEMP/artifact-signing"
          signtool="/c/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe"
          test -f "$signtool"
          test -f "$RUNNER_TEMP/artifact-signing/bin/x64/Azure.CodeSigning.Dlib.dll"
          {
            echo "CRAZYAGENT_SIGNTOOL=$(cygpath -w "$signtool")"
            echo "CRAZYAGENT_SIGNING_DLIB=$(cygpath -w "$RUNNER_TEMP/artifact-signing/bin/x64/Azure.CodeSigning.Dlib.dll")"
          } >> "$GITHUB_ENV"
      - id: desktop
        name: Build desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_CONTENT: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY_PATH || '' }}
          APPLE_ID: ${{ matrix.os == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_PASSWORD || '' }}
          AZURE_CLIENT_ID: ${{ matrix.os == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.os == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ matrix.os == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.os == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.os == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ matrix.os == 'windows' && secrets.AZURE_TRUSTED_SIGNING_PROFILE || '' }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/apple"
          trap 'rm -rf "$key_dir"' EXIT
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            (umask 077 && mkdir -p "$key_dir" && printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_dir/AuthKey.p8")
            export APPLE_API_KEY_PATH="$key_dir/AuthKey.p8"
          fi
          unset APPLE_API_KEY_CONTENT
          for name in TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_ID APPLE_PASSWORD AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT AZURE_TRUSTED_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          status="$(node scripts/release/signing.mjs "$PLATFORM" "$CHANNEL")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Platform signing: $status"
          if [ "$CHANNEL" = stable ]; then export CRAZYAGENT_REQUIRE_SIGNING=1; fi
          if [ "$PLATFORM" = windows ]; then
            for binary in apps/desktop/src-tauri/binaries/*.exe; do node scripts/release/sign-windows.mjs "$binary"; done
          fi
          if [ "$PLATFORM" = macos ]; then
            export TMPDIR="$RUNNER_TEMP/macos-tmp"
            mkdir -p "$TMPDIR"
          fi
          if [ "$PLATFORM" = macos ] && [ "$status" = signed ]; then
            security_line() { printf '%s\n' "$1" | security -i; }
            quote() { printf '"%s"' "$(printf '%s' "$1" | sed 's/[\\"]/\\&/g')"; }
            case "$APPLE_CERTIFICATE_PASSWORD" in *$'\n'*|*$'\r'*) echo "::error::APPLE_CERTIFICATE_PASSWORD contains a line break"; exit 1 ;; esac
            keychain="$(cd "$RUNNER_TEMP" && pwd -P)/crazyagent-signing.keychain-db"
            keychain_password="$(openssl rand -hex 32)"
            echo "::add-mask::$keychain_password"
            (umask 077 && mkdir -p "$key_dir" && printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$key_dir/certificate.p12")
            security_line "create-keychain -p $(quote "$keychain_password") $(quote "$keychain")"
            security_line "unlock-keychain -p $(quote "$keychain_password") $(quote "$keychain")"
            security set-keychain-settings -lut 21600 "$keychain"
            security_line "import $(quote "$key_dir/certificate.p12") -k $(quote "$keychain") -P $(quote "$APPLE_CERTIFICATE_PASSWORD") -f pkcs12 -t agg -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild" > /dev/null
            rm -f "$key_dir/certificate.p12"
            security_line "set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $(quote "$keychain_password") $(quote "$keychain")" > /dev/null
            search=()
            while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line#\"}"
              line="${line%\"}"
              if [ -n "$line" ] && [ "$line" != "$keychain" ]; then search+=("$line"); fi
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$keychain" ${search[@]+"${search[@]}"}
            identities="$(security find-identity -p codesigning "$keychain")"
            [[ "$identities" == *"$APPLE_SIGNING_IDENTITY"* ]] || { echo "::error::the job keychain holds no codesigning identity named by APPLE_SIGNING_IDENTITY"; exit 1; }
            unset keychain_password
          fi
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          rm -rf "${CARGO_TARGET_DIR:-target}/$TARGET/release/bundle"
          cd apps/desktop
          node node_modules/@tauri-apps/cli/tauri.js build --ci --target "$TARGET" --config src-tauri/binaries/release.conf.json
      - name: Remove the signing keychain and Apple keys
        if: always() && matrix.os == 'macos'
        run: |
          set -uo pipefail
          keychain="$(cd "$RUNNER_TEMP" && pwd -P)/crazyagent-signing.keychain-db"
          rm -rf "$RUNNER_TEMP/apple" "$RUNNER_TEMP/macos-tmp"
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$keychain"
          search=()
          stale=0
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line#\"}"
            line="${line%\"}"
            case "$line" in
              "" ) continue ;;
              */crazyagent-signing.keychain-db)
                if [ "$line" = "$keychain" ] || [ ! -e "$line" ]; then stale=1; continue; fi ;;
            esac
            search+=("$line")
          done < <(security list-keychains -d user)
          if [ "$stale" = 1 ] && [ "${#search[@]}" -gt 0 ]; then security list-keychains -d user -s "${search[@]}"; fi
          if security list-keychains -d user | grep -qF "$keychain"; then echo "::error::the job keychain is still in the search list"; exit 1; fi
          if [ -e "$keychain" ] || [ -e "$RUNNER_TEMP/apple" ]; then echo "::error::signing material is still on disk"; exit 1; fi
          echo "signing keychain and Apple keys removed"
      - name: Package release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNING_STATUS: ${{ steps.desktop.outputs.status }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          bundle="${CARGO_TARGET_DIR:-target}/$TARGET/release/bundle"
          mkdir -p dist signing
          if [ "$PLATFORM" = macos ]; then
            node scripts/release/assets.mjs package --target "$TARGET" --version "$VERSION" --source "$bundle/macos/CrazyAgent.app/Contents/MacOS" --out dist --sign
          else
            node scripts/release/assets.mjs package --target "$TARGET" --version "$VERSION" --source apps/desktop/src-tauri/binaries --suffixed --out dist --sign
          fi
          node scripts/release/assets.mjs collect --target "$TARGET" --version "$VERSION" --bundle-dir "$bundle" --out dist
          printf '%s\n' "$SIGNING_STATUS" > "signing/$TARGET.txt"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signing-${{ matrix.target }}
          path: signing/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: signing-*
          path: signing
          merge-multiple: true
      - name: Write release notes
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          if [ "$CHANNEL" = stable ]; then
            printf 'CrazyAgent %s\n' "$VERSION" > notes.txt
          else
            printf 'Dev build %s of %s.\n' "$VERSION" "$short" > notes.txt
          fi
          for file in signing/*.txt; do
            if [ "$(cat "$file")" = unsigned ]; then
              printf 'Not code signed: %s\n' "$(basename "$file" .txt)" >> notes.txt
            fi
          done
          cat notes.txt
      - name: Write update manifests and checksums
        run: node scripts/release/manifest.mjs --dir dist --version "$VERSION" --channel "$CHANNEL" --commit "$GITHUB_SHA" --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" --notes "$(cat notes.txt)"
      - name: Publish dev prerelease
        if: needs.prepare.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view dev --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev"
          fi
          gh release create dev --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" --title "Dev build $VERSION" --notes-file notes.txt dist/*
      - name: Publish stable release
        if: needs.prepare.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "CrazyAgent $VERSION" --notes-file notes.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
