<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; height: 100%; background: #313338; font: 13px "Segoe UI", sans-serif; }
#side { position: absolute; left: 0; top: 0; bottom: 0; width: 180px; background: #2b2d31; color: #ddd; padding: 8px; box-sizing: border-box; }
#top { position: absolute; left: 180px; right: 0; top: 0; height: 48px; background: #1e1f22; }
#term { position: absolute; left: 196px; right: 16px; top: 64px; bottom: 16px; background: #ff0000; }
#pop { position: absolute; left: 400px; top: 200px; width: 260px; height: 160px; background: #ff00ff; display: none; z-index: 10; }
#field { width: 150px; margin-top: 8px; background: #ffffff; color: #000; }
</style>
</head>
<body>
<div id="side">sidebar<br><input id="field" placeholder="type here"></div>
<div id="top"></div>
<div id="term"></div>
<div id="pop"></div>
<script>
const invoke = (command, args) => window.__TAURI__.core.invoke(command, args);
const term = document.getElementById('term');
const field = document.getElementById('field');
const pop = document.getElementById('pop');
const rectOf = (element) => {
  const r = element.getBoundingClientRect();
  return { x: r.left, y: r.top, w: r.width, h: r.height };
};
const report = (kind, detail) => invoke('report', { kind, detail: String(detail) });
const place = () => invoke('place', { term: rectOf(term), field: rectOf(field), dpr: window.devicePixelRatio });
window.showPop = (hide) => {
  pop.style.display = 'block';
  if (hide) { invoke('popover', { open: true }); }
  report('pop_rect', JSON.stringify(rectOf(pop)));
};
window.hidePop = () => {
  pop.style.display = 'none';
  invoke('popover', { open: false });
};
window.reportField = () => report('field_value', field.value);
window.addEventListener('resize', place);
window.addEventListener('load', () => {
  report('env_webview', navigator.userAgent);
  place();
});
</script>
</body>
</html>
