language: en-US
tone_instructions: >-
  Be brief and concrete. Report defects with a failure path, not style.
  Never use em dash or en dash characters. Never suggest code comments,
  only docstrings. Never name a third-party app as a reference.
early_access: false
inheritance: false
reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  review_status: true
  review_details: true
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  auto_approvals:
    enabled: false
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - "^master$"
      - "^chore/v2\\d+$"
      - "^chore/v3\\S*$"
  path_filters:
    - "!**/CHANGELOG.md"
    - "!**/Cargo.lock"
    - "!**/package-lock.json"
  path_instructions:
    - path: "**/*"
      instructions: |
        Project rules for every file:
        - No code comments of any kind except docstrings directly above a declaration. Flag any other added comment. Never suggest adding one.
        - No em dash or en dash characters in code, strings or docs. Use a hyphen.
        - Never name a third-party application as a reference or comparison.
        - CHANGELOG.md is generated by release tooling. Never suggest editing it.
        - Formatting and lint style are enforced by rustfmt, clippy and CI. Do not comment on them.
        - Rank findings: security, data loss, correctness, concurrency, resource leaks, then performance.
    - path: "**/*.rs"
      instructions: |
        Rust. Internal invariants that should be impossible use assert! or debug_assert!. Input validation is not an assertion.
        Flag unwrap or expect on values that come from user input, files, IPC or the network.
        Flag blocking calls inside async code and locks held across await points.
        Process spawning, filesystem paths and environment variables are trust boundaries.
        With rusqlite use prepare, never prepare_cached: the crate is built without its cache feature.
    - path: "apps/desktop/src-tauri/**"
      instructions: |
        Tauri host side. Every command exposed to the webview is a trust boundary. Check that it validates its arguments and does not widen filesystem, shell or network access.
    - path: "apps/desktop/src/**/*.{ts,tsx}"
      instructions: |
        React desktop UI on Tauri. Flag missing effect cleanup, state updates after unmount, unhandled promise rejections from IPC calls, and accessibility regressions such as missing labels, keyboard access or focus handling.
    - path: "**/*.{sh,bash}"
      instructions: |
        Shell scripts run on macOS and Linux. Flag unquoted expansions, unchecked failures and GNU-only flags that break on macOS.
    - path: "**/*.py"
      instructions: |
        Python helper scripts. Flag shell=True with untrusted input, unchecked subprocess return codes and network calls without timeouts.
    - path: "apps/desktop/test/**"
      instructions: |
        Tests. Integration and end-to-end tests use real systems with no mocks. Mocks are allowed only in unit tests, as a last resort.
    - path: "crates/**/tests/**"
      instructions: |
        Tests. Integration and end-to-end tests use real systems with no mocks. Mocks are allowed only in unit tests, as a last resort.
  finishing_touches:
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "No non-docstring comments"
        mode: warning
        instructions: |
          Fail if the pull request adds a code comment that is not a docstring directly above a declaration. Docstrings are Rust doc comments, TSDoc blocks and Python docstrings.
      - name: "No em dash"
        mode: warning
        instructions: |
          Fail if any added line contains the Unicode character U+2014 or U+2013.
  tools:
    clippy:
      enabled: true
    eslint:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    github-checks:
      enabled: true
    languagetool:
      enabled: false
chat:
  art: false
  auto_reply: false
  allow_non_org_members: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled
knowledge_base:
  opt_out: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
  automatic_linking_mode: disabled
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    auto_planning:
      enabled: false
